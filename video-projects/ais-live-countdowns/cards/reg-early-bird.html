<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>AIS LIVE — reg-early-bird</title>
    <link href="assets/fonts/fonts.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --onyx: #07121c;
        --charcoal: #0a0e14;
        --blue: #37bdf8;
        --coral: #ff8a5c;
        --red-live: #ff3b30;
        --font-display: "Montserrat", sans-serif;
        --font-body: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #000; color: #fff; font-family: var(--font-body);
      }
      #root {
        position: relative; width: 1920px; height: 1080px;
        overflow: hidden; background: var(--onyx); isolation: isolate;
      }
      #root .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }

      /* ---------- background ---------- */
      .grid {
        position: absolute; inset: -48px;
        background-image:
          linear-gradient(rgba(55, 189, 248, 0.065) 1px, transparent 1px),
          linear-gradient(90deg, rgba(55, 189, 248, 0.065) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .glow { position: absolute; top: -160px; left: 50%; border-radius: 50%; }
      .glow.blue { width: 760px; height: 760px; margin-left: -380px; background: var(--blue); filter: blur(150px); opacity: 0.20; }
      .glow.coral { width: 680px; height: 680px; margin-left: -340px; background: var(--coral); filter: blur(140px); opacity: 0.20; }
      .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.55) 95%);
      }

      /* ---------- scene ---------- */
      .wrap {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 40px; padding: 110px; text-align: center;
      }

      .eyebrow {
        font-family: var(--font-mono); font-weight: 700; font-size: 24px;
        letter-spacing: 0.32em; text-transform: uppercase; color: #37bdf8;
        display: inline-flex; align-items: center; gap: 12px;
      }
      .eyebrow::before {
        content: ""; width: 9px; height: 9px; border-radius: 2px;
        background: currentColor; box-shadow: 0 0 10px currentColor;
      }

      .line {
        font-family: var(--font-display); font-style: italic; font-weight: 900;
        font-size: 112px; line-height: 0.95; letter-spacing: -0.035em;
        color: #fff; max-width: 1560px; clip-path: inset(0 0 0 0);
      }
      .line .accent { color: #37bdf8; font-style: italic; position: relative; }

      .subline {
        font-family: var(--font-body); font-weight: 300; font-style: italic;
        font-size: 40px; line-height: 1.2; letter-spacing: -0.01em;
        color: rgba(209, 220, 232, 0.82); max-width: 1400px;
      }

      /* countdown */
      .count { display: flex; flex-direction: column; align-items: center; gap: 4px; }
      .kicker {
        font-family: var(--font-mono); font-weight: 700; font-size: 26px;
        letter-spacing: 0.32em; text-transform: uppercase; color: #fff;
      }
      .num {
        font-family: var(--font-display); font-style: italic; font-weight: 900;
        font-size: 300px; line-height: 0.86; letter-spacing: -0.05em; color: #37bdf8;
        text-shadow: 0 0 80px rgba(55,189,248,0.55);
      }
      .unit {
        font-family: var(--font-mono); font-weight: 700; font-size: 28px;
        letter-spacing: 0.32em; text-transform: uppercase; color: #37bdf8;
      }

      /* ---------- AIS LIVE mark (solid, brand §3.2) ---------- */
      .markwrap { display: inline-flex; }
      .backdrop-mark { position: absolute; right: 72px; bottom: 60px; display: inline-flex; }
      .mark {
        font-family: var(--font-display); font-style: italic; font-weight: 900;
        letter-spacing: -0.03em; line-height: 0.9; font-size: 92px;
        display: inline-flex; align-items: baseline; position: relative;
      }
      .mark .ais { color: #fff; }
      .mark .gap { display: inline-block; width: 0.08em; }
      /* .live treatment is shared by the mark AND any headline live-word */
      .live {
        position: relative; color: var(--blue);
        text-shadow: 0 0 60px rgba(55, 189, 248, 0.55);
        padding-right: 0.28em;
      }
      .dot {
        position: absolute; top: 0.08em; left: 100%; margin-left: 0.06em;
        width: 0.16em; height: 0.16em; border-radius: 50%;
        background: var(--red-live);
        box-shadow: 0 0 0.7em #ff3b30, 0 0 0.25em #ff3b30;
      }
      .ring {
        position: absolute; top: 0.08em; left: 100%; margin-left: 0.06em;
        width: 0.16em; height: 0.16em; border-radius: 50%;
        background: rgba(255, 59, 48, 0.55); opacity: 0;
        transform-origin: 50% 50%; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cmp-reg-early-bird" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div class="grid"></div>
        <div class="glow blue"></div>
        <div class="vignette"></div>
      </div>
      <div id="scene" class="clip" data-start="0" data-duration="8" data-track-index="1">
        <div class="wrap">
        <div class="eyebrow">PRICING</div>
        <div class="line">Early bird <span class="accent">closing.</span></div>
        <div class="subline">Prices step up at the next tier.</div>
        <div class="markwrap"><span class="mark"><span class="ais">AIS</span><span class="gap"></span><span class="live">LIVE<span class="ring"></span><span class="dot"></span></span></span></div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const D = 8;
      const tl = gsap.timeline({ paused: true });

      /* AMBIENT — phase-locked to 1.6s, seamless at the loop point */
      // live-dot pulse — the only ambient motion the brand allows. Targets every .dot
      // (the mark's, and any headline live-dot) so they pulse together on the beat.
      tl.to(".dot", { scale: 1.1, duration: 0.8, yoyo: true, repeat: 9, ease: "sine.inOut", transformOrigin: "50% 50%" }, 0);
      tl.fromTo(".ring", { scale: 1, autoAlpha: 0 }, { keyframes: [
        { autoAlpha: 0.5, scale: 1, duration: 0.001 },
        { autoAlpha: 0, scale: 2.6, duration: 0.999, ease: "power2.out" },
        { autoAlpha: 0, scale: 1, duration: 0.6 }
      ], repeat: 4, ease: "none" }, 0);
      tl.to(".glow", { x: 40, y: -22, duration: 4, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0);
      tl.to(".grid", { backgroundPosition: "24px 24px", duration: D, ease: "none" }, 0);

      /* ENTRANCE — settles to the rest pose, then holds */
      tl.from(".eyebrow", { autoAlpha: 0, y: -12, duration: 0.5, ease: "power2.out" }, 0.15);
      tl.from(".line", { clipPath: "inset(0 100% 0 0)", duration: 0.62, ease: "power3.out" }, 0.32);
      tl.from(".subline", { autoAlpha: 0, y: 14, duration: 0.5, ease: "power2.out" }, 0.7);
      tl.from(".markwrap", { autoAlpha: 0, scale: 0.92, y: 8, duration: 0.5, ease: "back.out(1.4)", transformOrigin: "50% 50%" }, 0.85);

      tl.set({}, {}, D); // Law #11 — fill the slot
      window.__timelines["cmp-reg-early-bird"] = tl;
    </script>
  </body>
</html>
