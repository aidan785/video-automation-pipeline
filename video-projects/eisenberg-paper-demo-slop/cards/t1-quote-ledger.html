<template id="tpl-ep-t1-quote-ledger">
<div id="ep-t1-quote-ledger" data-composition-id="ep-t1-quote-ledger" data-start="0" data-width="1080" data-height="1920">
      <div class="ep-cam">
        <div class="ep-paper"></div>
        <div class="stage">
          <div class="drift"><div class="mover quote">
            <span class="q" data-slot="q1">that saved budget</span>
            <span class="q" data-slot="q2">goes straight</span>
            <span class="q" data-slot="q3">into the next plugin</span>
          </div></div>

          <div class="drift"><div class="mover connwrap">
            <svg class="conn" width="140" height="130" viewBox="0 0 140 130">
              <path class="connpath" d="M 110 0 C 110 65, 30 55, 30 125" />
            </svg>
          </div></div>

          <div class="drift"><div class="mover attribwrap">
            <div class="attrib" data-slot="attrib">— plugin #2: morph</div>
          </div></div>
        </div>
      </div>
      <div class="ep-lens"></div>
      <div class="ep-vig"></div>
      <div class="ep-grain"></div>
    
  <style>
      #ep-t1-quote-ledger {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: var(--paper-mid); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #ep-t1-quote-ledger .stage { position: absolute; inset: 0; z-index: 3; }

      #ep-t1-quote-ledger .quote { position: absolute; left: 150px; top: 640px; line-height: 1.08; transform: rotate(-0.4deg); }
      #ep-t1-quote-ledger .quote .q { display: block; font-size: var(--size-title); white-space: nowrap; text-shadow: var(--press); }
      #ep-t1-quote-ledger .quote .q:nth-child(2) { margin-left: 62px; font-style: italic; color: var(--sage); }
      #ep-t1-quote-ledger .quote .q:nth-child(3) { margin-left: 20px; }

      #ep-t1-quote-ledger svg.conn { position: absolute; left: 430px; top: 940px; overflow: visible; }
      #ep-t1-quote-ledger svg.conn path { fill: none; stroke: var(--connector); stroke-width: 3; stroke-dasharray: 9 9; }

      #ep-t1-quote-ledger .attribwrap { position: absolute; left: 260px; top: 1110px; }
      #ep-t1-quote-ledger .attrib {
        background: var(--tag); color: var(--tag-ink);
        border-radius: var(--radius-tag); box-shadow: var(--shadow-tag);
        padding: 20px 42px;
        font-family: var(--font-mono); font-size: var(--size-label); font-weight: 600;
        text-transform: uppercase; letter-spacing: var(--track-pill); white-space: nowrap;
        transform: rotate(0.6deg);
      }
    </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
      window.__timelines = window.__timelines || {};
      const root = "#ep-t1-quote-ledger";
      const DUR = 7;

      /* SLOP: statics instead of animation — numbers at final value, meter full */
      document.querySelectorAll(root + " .count").forEach((el) => {
        const v = parseFloat(el.getAttribute("data-value")) || 0;
        const p = el.getAttribute("data-prefix") || "";
        el.textContent = p + Math.round(v).toLocaleString("en-US");
      });
      const fill = document.querySelector(root + " .fill");
      if (fill) fill.style.transform = "scaleX(0.78)";
      const cur = document.querySelector(root + " .cursor, " + root + " .caret");
      if (cur) cur.style.display = "none";

      /* SLOP: one uniform opacity fade for everything, same duration, same ease */
      const tl = gsap.timeline({ paused: true });
      const movers = gsap.utils.toArray(root + " .mover");
      tl.from(movers, { autoAlpha: 0, y: 30, duration: 0.4, ease: "power1.out", stagger: 0.45 }, 0.2)
        .set({}, {}, DUR);

      window.__timelines["ep-t1-quote-ledger"] = tl;
  </script>
</div>
</template>
