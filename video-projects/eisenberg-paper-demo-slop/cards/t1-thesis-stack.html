<template id="tpl-ep-t1-thesis-stack">
<div id="ep-t1-thesis-stack" data-composition-id="ep-t1-thesis-stack" data-start="0" data-width="1080" data-height="1920">
      <div class="ep-cam">
        <div class="ep-paper"></div>
        <div class="stage">
          <div class="drift"><div class="mover phrase phraseA">
            <span class="w" data-slot="a1">These</span>
            <span class="w" data-slot="a2">3 Claude</span>
            <span class="w" data-slot="a3">Code</span>
            <span class="w sage it" data-slot="a4">plugins</span>
          </div></div>
          <div class="drift"><div class="mover phrase phraseB">
            <span class="w" data-slot="b1">can</span>
            <span class="w coral" data-slot="b2">stop</span>
            <span class="w it" data-slot="b3">Claude</span>
          </div></div>
        </div>
      </div>
      <div class="ep-lens"></div>
      <div class="ep-vig"></div>
      <div class="ep-grain"></div>
    
  <style>
      #ep-t1-thesis-stack {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: var(--paper-mid); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #ep-t1-thesis-stack .stage { position: absolute; inset: 0; z-index: 3; }

      #ep-t1-thesis-stack .phrase { position: absolute; line-height: 0.99; }
      #ep-t1-thesis-stack .phrase .w {
        display: block; font-size: 100px;
        letter-spacing: -0.015em; white-space: nowrap;
        text-shadow: var(--press);
      }
      #ep-t1-thesis-stack .w.it    { font-style: italic; }
      #ep-t1-thesis-stack .w.sage  { color: var(--sage); }
      #ep-t1-thesis-stack .w.coral { color: var(--coral); }

      #ep-t1-thesis-stack .phraseA { left: 300px; top: 850px; transform: rotate(-0.5deg); }
      #ep-t1-thesis-stack .phraseA .w:nth-child(2) { margin-left: 58px; }
      #ep-t1-thesis-stack .phraseA .w:nth-child(3) { margin-left: 10px; }
      #ep-t1-thesis-stack .phraseA .w:nth-child(4) { margin-left: 88px; }

      #ep-t1-thesis-stack .phraseB { left: 350px; top: 420px; transform: rotate(0.4deg); }
      #ep-t1-thesis-stack .phraseB .w { font-size: 84px; }
      #ep-t1-thesis-stack .phraseB .w:nth-child(2) { margin-left: 46px; }
      #ep-t1-thesis-stack .phraseB .w:nth-child(3) { margin-left: 96px; }
    </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
      window.__timelines = window.__timelines || {};
      const root = "#ep-t1-thesis-stack";
      const DUR = 7;

      /* SLOP: statics instead of animation — numbers at final value, meter full */
      document.querySelectorAll(root + " .count").forEach((el) => {
        const v = parseFloat(el.getAttribute("data-value")) || 0;
        const p = el.getAttribute("data-prefix") || "";
        el.textContent = p + Math.round(v).toLocaleString("en-US");
      });
      const fill = document.querySelector(root + " .fill");
      if (fill) fill.style.transform = "scaleX(0.78)";
      const cur = document.querySelector(root + " .cursor, " + root + " .caret");
      if (cur) cur.style.display = "none";

      /* SLOP: one uniform opacity fade for everything, same duration, same ease */
      const tl = gsap.timeline({ paused: true });
      const movers = gsap.utils.toArray(root + " .mover");
      tl.from(movers, { autoAlpha: 0, y: 30, duration: 0.4, ease: "power1.out", stagger: 0.45 }, 0.2)
        .set({}, {}, DUR);

      window.__timelines["ep-t1-thesis-stack"] = tl;
  </script>
</div>
</template>
