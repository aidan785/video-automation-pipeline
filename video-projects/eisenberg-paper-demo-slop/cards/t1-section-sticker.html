<template id="tpl-ep-t1-section-sticker">
<div id="ep-t1-section-sticker" data-composition-id="ep-t1-section-sticker" data-start="0" data-width="1080" data-height="1920">
      <div class="ep-cam">
        <div class="ep-paper"></div>
        <div class="stage">
          <div class="drift"><div class="mover stickwrap">
            <div class="sticker"><span class="glyph" data-slot="glyph">🗿</span></div>
          </div></div>
          <div class="drift"><div class="mover labelwrap">
            <div class="label" data-slot="label">caveman</div>
          </div></div>
        </div>
      </div>
      <div class="ep-lens"></div>
      <div class="ep-vig"></div>
      <div class="ep-grain"></div>
    
  <style>
      #ep-t1-section-sticker {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: var(--paper-mid); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #ep-t1-section-sticker .stage {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }

      #ep-t1-section-sticker .sticker {
        width: 330px; height: 330px;
        background: var(--card); border-radius: 72px;
        border-top: 1px solid var(--card-hi);
        border-left: 1px solid var(--card-hi-l);
        box-shadow: var(--shadow-card);
        display: flex; align-items: center; justify-content: center;
        transform: rotate(-0.8deg);
      }
      #ep-t1-section-sticker .glyph {
        font-size: 168px; line-height: 1; color: var(--coral);
        font-family: var(--font-mono); font-weight: 600;
      }

      #ep-t1-section-sticker .label {
        margin-top: 56px; font-size: 84px;
        font-style: italic; letter-spacing: -0.01em; color: var(--ink);
        text-shadow: var(--press);
        transform: rotate(0.5deg);
      }
    </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
      window.__timelines = window.__timelines || {};
      const root = "#ep-t1-section-sticker";
      const DUR = 6;

      /* SLOP: statics instead of animation — numbers at final value, meter full */
      document.querySelectorAll(root + " .count").forEach((el) => {
        const v = parseFloat(el.getAttribute("data-value")) || 0;
        const p = el.getAttribute("data-prefix") || "";
        el.textContent = p + Math.round(v).toLocaleString("en-US");
      });
      const fill = document.querySelector(root + " .fill");
      if (fill) fill.style.transform = "scaleX(0.78)";
      const cur = document.querySelector(root + " .cursor, " + root + " .caret");
      if (cur) cur.style.display = "none";

      /* SLOP: one uniform opacity fade for everything, same duration, same ease */
      const tl = gsap.timeline({ paused: true });
      const movers = gsap.utils.toArray(root + " .mover");
      tl.from(movers, { autoAlpha: 0, y: 30, duration: 0.4, ease: "power1.out", stagger: 0.45 }, 0.2)
        .set({}, {}, DUR);

      window.__timelines["ep-t1-section-sticker"] = tl;
  </script>
</div>
</template>
