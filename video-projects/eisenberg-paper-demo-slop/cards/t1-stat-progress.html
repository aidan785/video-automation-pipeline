<template id="tpl-ep-t1-stat-progress">
<div id="ep-t1-stat-progress" data-composition-id="ep-t1-stat-progress" data-start="0" data-width="1080" data-height="1920">
      <div class="ep-cam">
        <div class="ep-paper"></div>
        <div class="stage">
          <div class="drift"><div class="mover groupwrap">
            <div class="tag">
              <div><span class="count" data-slot="stat" data-from="3000" data-value="1911" data-prefix="$">$3,000</span></div>
              <div class="sub" data-slot="sub">reasoning cost</div>
            </div>
            <div class="term">
              <div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
              <div class="track"><div class="fill"></div></div>
              <div class="line" data-slot="l1">Claude Code v2.1.6&#10;Sonnet 4.5 · API Usage Billing · Why Try AI</div>
              <div class="status" data-slot="status">[TOKENS BURNING]</div>
            </div>
          </div></div>
        </div>
      </div>
      <div class="ep-lens"></div>
      <div class="ep-vig"></div>
      <div class="ep-grain"></div>
    
  <style>
      #ep-t1-stat-progress {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: var(--paper-mid); color: var(--term-text);
        font-family: var(--font-mono); overflow: hidden;
      }
      #ep-t1-stat-progress .stage { position: absolute; inset: 0; z-index: 3; }

      #ep-t1-stat-progress .groupwrap { position: absolute; left: 80px; top: 640px; }

      /* white price tag riding the card's top edge */
      #ep-t1-stat-progress .tag {
        position: absolute; left: 300px; top: -74px; z-index: 2;
        background: var(--tag); color: var(--tag-ink);
        border-radius: var(--radius-tag) var(--radius-tag) 0 0;
        box-shadow: var(--shadow-tag);
        padding: 20px 46px 26px; text-align: center;
        font-size: 46px; font-weight: 600; white-space: nowrap;
        transform: rotate(-0.3deg);
      }
      #ep-t1-stat-progress .tag .sub {
        font-size: 20px; color: rgba(34, 32, 30, 0.5);
        text-transform: uppercase; letter-spacing: var(--track-pill); margin-top: 6px;
      }

      #ep-t1-stat-progress .term {
        position: relative; width: 920px;
        background: var(--card); border-radius: var(--radius-card);
        border-top: 1px solid var(--card-hi);
        border-left: 1px solid var(--card-hi-l);
        box-shadow: var(--shadow-card);
        padding: 42px 54px 60px; box-sizing: border-box;
        transform: rotate(-0.4deg);
      }
      #ep-t1-stat-progress .chrome { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
      #ep-t1-stat-progress .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--tag); }

      /* the burn meter */
      #ep-t1-stat-progress .track {
        height: 44px; border-radius: 22px; background: rgba(255, 255, 255, 0.08);
        overflow: hidden; margin-bottom: 38px;
      }
      #ep-t1-stat-progress .fill {
        height: 100%; width: 100%; border-radius: 22px;
        background: linear-gradient(90deg, var(--sage) 0%, var(--mint) 45%, var(--coral) 100%);
        transform-origin: left center;
      }

      #ep-t1-stat-progress .line { font-size: var(--size-term-sm); color: var(--term-dim); line-height: 1.55; white-space: pre-line; }
      #ep-t1-stat-progress .status { margin-top: 24px; font-size: var(--size-term-sm); color: var(--coral); letter-spacing: var(--track-pill); }
    </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
      window.__timelines = window.__timelines || {};
      const root = "#ep-t1-stat-progress";
      const DUR = 7;

      /* SLOP: statics instead of animation — numbers at final value, meter full */
      document.querySelectorAll(root + " .count").forEach((el) => {
        const v = parseFloat(el.getAttribute("data-value")) || 0;
        const p = el.getAttribute("data-prefix") || "";
        el.textContent = p + Math.round(v).toLocaleString("en-US");
      });
      const fill = document.querySelector(root + " .fill");
      if (fill) fill.style.transform = "scaleX(0.78)";
      const cur = document.querySelector(root + " .cursor, " + root + " .caret");
      if (cur) cur.style.display = "none";

      /* SLOP: one uniform opacity fade for everything, same duration, same ease */
      const tl = gsap.timeline({ paused: true });
      const movers = gsap.utils.toArray(root + " .mover");
      tl.from(movers, { autoAlpha: 0, y: 30, duration: 0.4, ease: "power1.out", stagger: 0.45 }, 0.2)
        .set({}, {}, DUR);

      window.__timelines["ep-t1-stat-progress"] = tl;
  </script>
</div>
</template>
