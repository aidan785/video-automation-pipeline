<template id="tpl-ep-t1-list-terminal">
<div id="ep-t1-list-terminal" data-composition-id="ep-t1-list-terminal" data-start="0" data-width="1080" data-height="1920">
      <div class="ep-cam">
        <div class="ep-paper"></div>
        <div class="stage">
          <div class="drift"><div class="mover termwrap">
            <div class="term">
              <div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
              <div class="statusrow">
                <span class="stag c1" data-slot="s1">[CAVEMAN ACTIVE]</span>
                <span class="stag c2" data-slot="s2">[BULLET MODE]</span>
                <span class="stag c3" data-slot="s3">[NO ESSAYS]</span>
              </div>
              <div class="title" data-slot="title">// RESPONSE</div>
              <div class="item">
                <div class="k" data-slot="i1a">01_FOUR_BULLETS</div>
                <div class="a" data-slot="i1b">NOT_400_WORDS</div>
              </div>
              <div class="item">
                <div class="k" data-slot="i2a">02_CRISP_ANSWERS</div>
                <div class="a" data-slot="i2b">ZERO_FLUFF</div>
              </div>
              <div class="item">
                <div class="k" data-slot="i3a">03_LESS_TOKENS</div>
                <div class="a" data-slot="i3b">SPARING_THE_SPEND</div>
              </div>
            </div>
          </div></div>
        </div>
      </div>
      <div class="ep-lens"></div>
      <div class="ep-vig"></div>
      <div class="ep-grain"></div>
    
  <style>
      #ep-t1-list-terminal {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: var(--paper-mid); color: var(--term-text);
        font-family: var(--font-mono); overflow: hidden;
      }
      #ep-t1-list-terminal .stage { position: absolute; inset: 0; z-index: 3; }

      #ep-t1-list-terminal .termwrap { position: absolute; left: 70px; top: 430px; }
      #ep-t1-list-terminal .term {
        width: 940px;
        background: var(--card); border-radius: var(--radius-card);
        border-top: 1px solid var(--card-hi);
        border-left: 1px solid var(--card-hi-l);
        box-shadow: var(--shadow-card);
        padding: 36px 54px 56px; box-sizing: border-box;
        transform: rotate(-0.4deg);
      }
      #ep-t1-list-terminal .chrome { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
      #ep-t1-list-terminal .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--tag); }

      #ep-t1-list-terminal .statusrow { display: flex; gap: 22px; margin-bottom: 40px; flex-wrap: wrap; }
      #ep-t1-list-terminal .stag { font-size: 23px; font-weight: 500; letter-spacing: 0.06em; white-space: nowrap; }
      #ep-t1-list-terminal .stag.c1 { color: var(--term-text); }
      #ep-t1-list-terminal .stag.c2 { color: var(--mint); }
      #ep-t1-list-terminal .stag.c3 { color: var(--coral); }

      #ep-t1-list-terminal .title { font-size: 27px; color: var(--term-dim); margin-bottom: 34px; }

      #ep-t1-list-terminal .item { margin-bottom: 36px; }
      #ep-t1-list-terminal .item .k { font-size: 27px; color: var(--term-text); letter-spacing: 0.04em; }
      #ep-t1-list-terminal .item .a { font-size: 25px; color: var(--mint); margin-top: 10px; padding-left: 34px; }
      #ep-t1-list-terminal .item .a::before { content: "→ "; color: var(--term-dim); }
    </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
      window.__timelines = window.__timelines || {};
      const root = "#ep-t1-list-terminal";
      const DUR = 7.5;

      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const rnd = mulberry32(313);

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(root + " .ep-cam", { scale: 1.04 }, { scale: 1.09, duration: DUR, ease: "none" }, 0)
        .to(root + " .ep-cam", { x: 5, y: 5, rotation: -0.2, duration: DUR / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      document.querySelectorAll(root + " .drift").forEach((el) => {
        const half = 1.4 + rnd() * 0.7;
        tl.to(el, {
          x: (rnd() * 2 - 1) * 4, y: 3 + rnd() * 2.5, rotation: (rnd() * 2 - 1) * 0.35,
          duration: half, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / half),
        }, 0);
      });

      tl
        /* terminal slides up */
        .fromTo(root + " .termwrap",
          { y: 780, x: -22, autoAlpha: 0, filter: "blur(10px)" },
          { y: 0, x: 0, autoAlpha: 1, filter: "blur(0px)", duration: 0.9, ease: "back.out(0.9)" }, 0.15)

        /* follow-through: chrome trails the card landing (Disney #5) */
        .from(root + " .chrome", { y: -10, autoAlpha: 0, duration: 0.35, ease: "power2.out" }, 0.62)

        /* status tags print left to right */
        .from(root + " .stag", { autoAlpha: 0, y: 8, duration: 0.34, ease: "power3.out", stagger: 0.18 }, 1.0)

        /* title, then item pairs land beat by beat */
        .from(root + " .title", { autoAlpha: 0, y: 8, duration: 0.34, ease: "power3.out" }, 1.7)
        .from(root + " .item .k", { autoAlpha: 0, y: 10, filter: "blur(4px)", duration: 0.4, ease: "power3.out", stagger: 0.7 }, 2.1)
        .from(root + " .item .a", { autoAlpha: 0, y: 10, filter: "blur(4px)", duration: 0.4, ease: "power3.out", stagger: 0.7 }, 2.4)

        /* breathing hold */
        .set({}, {}, DUR);

      window.__timelines["ep-t1-list-terminal"] = tl;
    </script>
</div>
</template>
