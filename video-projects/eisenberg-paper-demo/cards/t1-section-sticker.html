<template id="tpl-ep-t1-section-sticker">
<div id="ep-t1-section-sticker" data-composition-id="ep-t1-section-sticker" data-start="0" data-width="1080" data-height="1920">
      <div class="ep-cam">
        <div class="ep-paper"></div>
        <div class="stage">
          <div class="drift"><div class="mover stickwrap">
            <div class="sticker"><span class="glyph" data-slot="glyph">🗿</span></div>
          </div></div>
          <div class="drift"><div class="mover labelwrap">
            <div class="label" data-slot="label">caveman</div>
          </div></div>
        </div>
      </div>
      <div class="ep-lens"></div>
      <div class="ep-vig"></div>
      <div class="ep-grain"></div>
    
  <style>
      #ep-t1-section-sticker {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: var(--paper-mid); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #ep-t1-section-sticker .stage {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }

      #ep-t1-section-sticker .sticker {
        width: 330px; height: 330px;
        background: var(--card); border-radius: 72px;
        border-top: 1px solid var(--card-hi);
        border-left: 1px solid var(--card-hi-l);
        box-shadow: var(--shadow-card);
        display: flex; align-items: center; justify-content: center;
        transform: rotate(-0.8deg);
      }
      #ep-t1-section-sticker .glyph {
        font-size: 168px; line-height: 1; color: var(--coral);
        font-family: var(--font-mono); font-weight: 600;
      }

      #ep-t1-section-sticker .label {
        margin-top: 56px; font-size: 84px;
        font-style: italic; letter-spacing: -0.01em; color: var(--ink);
        text-shadow: var(--press);
        transform: rotate(0.5deg);
      }
    </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
      window.__timelines = window.__timelines || {};
      const root = "#ep-t1-section-sticker";
      const DUR = 6;

      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const rnd = mulberry32(505);

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(root + " .ep-cam", { scale: 1.04 }, { scale: 1.10, duration: DUR, ease: "none" }, 0)
        .to(root + " .ep-cam", { x: -5, y: 5, rotation: 0.25, duration: DUR / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      document.querySelectorAll(root + " .drift").forEach((el) => {
        const half = 1.4 + rnd() * 0.7;
        tl.to(el, {
          x: (rnd() * 2 - 1) * 4, y: 3 + rnd() * 2.5, rotation: (rnd() * 2 - 1) * 0.35,
          duration: half, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / half),
        }, 0);
      });

      tl
        /* sticker scale-pops with overshoot */
        .fromTo(root + " .stickwrap",
          { scale: 0.6, autoAlpha: 0, filter: "blur(12px)" },
          { scale: 1, autoAlpha: 1, filter: "blur(0px)", duration: 0.7, ease: "back.out(1.05)" }, 0.25)

        /* italic serif label fades up */
        .from(root + " .labelwrap", { autoAlpha: 0, y: 18, filter: "blur(5px)", duration: 0.45, ease: "power3.out" }, 0.85)

        /* breathing hold */
        .set({}, {}, DUR);

      window.__timelines["ep-t1-section-sticker"] = tl;
    </script>
</div>
</template>
