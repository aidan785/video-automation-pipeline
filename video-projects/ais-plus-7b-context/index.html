<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="assets/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;}
#comp{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;}
.bg{position:absolute;inset:0;}
.bg img{width:1920px;height:1080px;object-fit:cover;display:block;}
.bg .darken{position:absolute;inset:0;background:rgba(3,12,26,.38);}
.bg .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 46%,rgba(0,0,10,.42) 100%);}
.card{position:absolute;overflow:hidden;background:#0a1420;
  box-shadow:0 26px 70px rgba(0,0,10,.5),0 6px 22px rgba(0,0,10,.4);}
#cam-card{left:48px;top:153px;width:438px;height:774px;border-radius:24px;}
#cam-card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
#screen-card{left:520px;top:153px;width:1376px;height:774px;border-radius:28px;background:#101418;}
#screen-card video{position:absolute;inset:0;width:1376px;height:774px;object-fit:cover;}
</style>
</head>
<body>
<div data-hf-id="hf-nwpb" id="comp" data-composition-id="comp" data-start="0" data-width="1920" data-height="1080">
  <div data-hf-id="hf-m7dd" class="bg">
    <img data-hf-id="hf-kbtz" src="assets/background.jpg" alt="">
    <div data-hf-id="hf-vaz1" class="darken"></div>
    <div data-hf-id="hf-e4a6" class="vig"></div>
  </div>
  <div data-hf-id="hf-ywfr" class="card" id="screen-card">
    <video data-hf-id="hf-25cu" id="screen-video" src="assets/clean-screen.mp4" muted playsinline data-has-audio="false" data-start="0" data-duration="306.316" data-track-index="3"></video>
  </div>
  <div data-hf-id="hf-z9ys" class="card" id="cam-card">
    <div data-hf-id="hf-a7h8" style="position:absolute;inset:0;">
      <video data-hf-id="hf-x7w0" id="cam-video" src="assets/clean-cam-crop.mp4" muted playsinline data-has-audio="false" data-start="0" data-duration="306.367" data-track-index="4"></video>
    </div>
  </div>
  <audio data-hf-id="hf-ybnt" id="main-audio" src="assets/clean-cam.m4a" data-start="0" data-duration="306.367" data-track-index="10" data-volume="1"></audio>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.set({}, {}, 306.367);
  window.__timelines = window.__timelines || {};
  window.__timelines["comp"] = tl;
</script>
</body>
</html>
