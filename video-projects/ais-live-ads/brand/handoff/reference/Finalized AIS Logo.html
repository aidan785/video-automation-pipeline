        {children}
      </div>
    </div>
  );
}

  return (
    <div style={{ transform: `scale(${scale})`, fontFamily: "'Montserrat', sans-serif", fontStyle: 'italic', fontWeight: 900, fontSize: 96, letterSpacing: '-0.03em', lineHeight: 0.9, display: 'inline-flex', alignItems: 'baseline' }}>

      <span style={{ position: 'relative', color: '#37bdf8', WebkitTextStroke: '3px #37bdf8', textShadow: '0 0 28px rgba(55,189,248,0.55)' }}>
        LIVE
      </span>
    </div>
  );
}

// V2 — upright all-caps lockup (no italic). Same colorway, same proportions.
function LogoShiftRoman({ scale = 1 }) {
  return (
    <div style={{ transform: `scale(${scale})`, fontFamily: "'Montserrat', sans-serif", fontStyle: 'normal', fontWeight: 900, fontSize: 96, letterSpacing: '-0.03em', lineHeight: 0.9, display: 'inline-flex', alignItems: 'baseline' }}>

        LIVE
      </span>
    </div>

}

// V3 — mixed case: "AIS" all caps + "Live" with cap L + lowercase i/v/e. Upright.
function LogoShiftMixed({ scale = 1 }) {
  return (
    <div style={{ transform: `scale(${scale})`, fontFamily: "'Montserrat', sans-serif", fontStyle: 'normal', fontWeight: 900, fontSize: 96, letterSpacing: '-0.03em', lineHeight: 0.9, display: 'inline-flex', alignItems: 'baseline' }}>

// ───── Shift mark — auto-recolors for any surface ─────
function ShiftMark({ theme = 'dark', size = 18, glow = true }) {
  const m = {
    dark:       { ais: '#fff',    live: '#37bdf8', glow: 'rgba(55,189,248,0.55)' },
    blue:       { ais: '#fff',    live: '#07121c', glow: 'transparent' },
    yellow:     { ais: '#07121c', live: '#fff',    glow: 'transparent' },
    orange:     { ais: '#07121c', live: '#fff',    glow: 'transparent' },
    white:      { ais: '#07121c', live: '#37bdf8', glow: 'rgba(55,189,248,0.25)' },
    allblack:   { ais: '#07121c', live: '#07121c', glow: 'transparent' },
    allwhite:   { ais: '#fff',    live: '#fff',    glow: 'transparent' },
    blueblack:  { ais: '#37bdf8', live: '#07121c', glow: 'transparent' },
    yellowblack:{ ais: '#f5d82a', live: '#07121c', glow: 'transparent' },
    whiteblue:  { ais: '#fff',    live: '#37bdf8', glow: 'rgba(55,189,248,0.45)' },
    blackblue:  { ais: '#07121c', live: '#37bdf8', glow: 'rgba(55,189,248,0.2)' },
    orangeblack:{ ais: '#FF8A5C', live: '#07121c', glow: 'transparent' },
    cream:      { ais: '#f0eee9', live: '#c96442', glow: 'transparent' },
  };
  const c = m[theme] || m.dark;
  return (
    <span style={{ fontFamily: "'Montserrat', sans-serif", fontStyle: 'italic', fontWeight: 900, fontSize: size, letterSpacing: '-0.03em', display: 'inline-flex', alignItems: 'baseline', lineHeight: 0.9 }}>
      <span style={{ color: c.ais, WebkitTextStroke: `${Math.max(1, size*0.032)}px ${c.ais}` }}>AIS</span><span style={{ display:'inline-block', width: size*0.12 }}/>
      <span style={{ color: c.live, WebkitTextStroke: `${Math.max(1, size*0.032)}px ${c.live}`, textShadow: glow && c.glow !== 'transparent' ? `0 0 ${size*0.8}px ${c.glow}` : 'none' }}>LIVE</span>
    </span>
  );
}

function VariationsGrid() {
  const grounds = [
    { name: 'Deep Onyx', bg: '#07121c', grid: 'rgba(55,189,248,0.08)' },
    { name: 'Pure Black', bg: '#000000', grid: 'rgba(255,255,255,0.06)' },
    { name: 'Deep Charcoal', bg: '#0A0E14', grid: 'rgba(55,189,248,0.07)' },
    { name: 'Electric Blue', bg: '#37BDF8', grid: 'rgba(7,18,28,0.1)' },
    { name: 'Cyber Yellow', bg: '#F5D82A', grid: 'rgba(7,18,28,0.08)' },
    { name: 'Coral', bg: '#FF8A5C', grid: 'rgba(7,18,28,0.08)' },
    { name: 'Cream', bg: '#F0EEE9', grid: 'rgba(7,18,28,0.05)' },
    { name: 'Paper White', bg: '#FFFFFF', grid: 'rgba(7,18,28,0.05)' },
  ];
  const pairs = [
    { key: 'dark', ais: '#fff', live: '#37BDF8', glow: true, label: 'White · Electric (primary)' },
    { key: 'whiteblue', ais: '#fff', live: '#37BDF8', glow: false, label: 'White · Electric (flat)' },
    { key: 'allwhite', ais: '#fff', live: '#fff', glow: false, label: 'All White' },
    { key: 'allblack', ais: '#07121C', live: '#07121C', glow: false, label: 'All Black' },
    { key: 'blackblue', ais: '#07121C', live: '#37BDF8', glow: false, label: 'Black · Electric' },
    { key: 'blueblack', ais: '#37BDF8', live: '#07121C', glow: false, label: 'Electric · Black' },
    { key: 'yellowblack', ais: '#F5D82A', live: '#07121C', glow: false, label: 'Yellow · Black' },
    { key: 'blackyellow', ais: '#07121C', live: '#F5D82A', glow: false, label: 'Black · Yellow' },
    { key: 'orangeblack', ais: '#FF8A5C', live: '#07121C', glow: false, label: 'Orange · Black' },
    { key: 'blackorange', ais: '#07121C', live: '#FF8A5C', glow: false, label: 'Black · Orange' },
    { key: 'whiteyellow', ais: '#fff', live: '#F5D82A', glow: false, label: 'White · Yellow' },
    { key: 'whiteorange', ais: '#fff', live: '#FF8A5C', glow: false, label: 'White · Orange' },
    { key: 'blackwhite', ais: '#07121C', live: '#fff', glow: false, label: 'Black · White' },
    { key: 'whiteblack', ais: '#fff', live: '#07121C', glow: false, label: 'White · Black' },
    { key: 'yellowelec', ais: '#F5D82A', live: '#37BDF8', glow: false, label: 'Yellow · Electric' },
    { key: 'creamclay', ais: '#F0EEE9', live: '#C96442', glow: false, label: 'Cream · Clay' },
  ];
  const contrastOk = (hex, bg) => {
    const h = (c) => parseInt(c.slice(1), 16);
    const lum = (v) => { const r=((v>>16)&255)/255, g=((v>>8)&255)/255, b=(v&255)/255; const f=x=>x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4); return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b); };
    const a = lum(h(hex)), b = lum(h(bg));
    const hi = Math.max(a,b), lo = Math.min(a,b);
    return (hi + 0.05) / (lo + 0.05) >= 2.0;
  };
  return (
    <div style={{ marginTop: 14, background: '#0a0e14', padding: 24, borderRadius: 6 }}>
      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: '0.25em', textTransform: 'uppercase', color: 'rgba(209,220,232,0.55)', marginBottom: 14 }}>{pairs.length} colorways × {grounds.length} grounds = {pairs.length * grounds.length} permutations</div>
      {grounds.map((g) => (
        <div key={g.bg} style={{ marginBottom: 18 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
            <span style={{ width: 14, height: 14, borderRadius: 3, background: g.bg, border: '1px solid rgba(255,255,255,0.15)' }}/>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: '0.22em', textTransform: 'uppercase', color: '#fff', fontWeight: 700 }}>{g.name}</span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: 'rgba(209,220,232,0.45)' }}>{g.bg}</span>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8 }}>
            {pairs.filter((p) => contrastOk(p.ais, g.bg) && contrastOk(p.live, g.bg)).map((p) => (
              <div key={g.bg + p.key} style={{ position: 'relative', background: g.bg, borderRadius: 4, padding: 16, border: '1px solid rgba(255,255,255,0.08)', display: 'flex', flexDirection: 'column', gap: 10, minHeight: 90, overflow: 'hidden' }}>
                <div style={{ position: 'absolute', inset: 0, backgroundImage: `linear-gradient(${g.grid} 1px, transparent 1px), linear-gradient(90deg, ${g.grid} 1px, transparent 1px)`, backgroundSize: '16px 16px', pointerEvents: 'none' }}/>
                <div style={{ position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 1 }}>
                  <span style={{ fontFamily: "'Montserrat', sans-serif", fontStyle: 'italic', fontWeight: 900, fontSize: 28, letterSpacing: '-0.02em', display: 'inline-flex', alignItems: 'baseline', lineHeight: 0.9 }}>
                    <span style={{ color: p.ais }}>AIS</span><span style={{ display:'inline-block', width: 4 }}/>
                    <span style={{ color: p.live, textShadow: p.glow ? `0 0 20px ${p.live}99` : 'none' }}>LIVE</span>
                  </span>
                </div>
                <div style={{ position: 'relative', fontFamily: "'JetBrains Mono', monospace", fontSize: 8, letterSpacing: '0.18em', textTransform: 'uppercase', fontWeight: 700, color: ['#07121C','#000000','#0A0E14'].includes(g.bg) ? 'rgba(255,255,255,0.5)' : 'rgba(7,18,28,0.55)' }}>
                  {p.label}
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: '0.05em', color: 'rgba(255,255,255,0.55)', marginTop: 6, lineHeight: 1.5 }}>{meta}</div>
        <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: 12, fontWeight: 300, color: 'rgba(255,255,255,0.65)', marginTop: 10, lineHeight: 1.45 }}>{notes}</div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center' }}>
        <div style={sample}>{example}</div>
      </div>
    </div>
  );
}
