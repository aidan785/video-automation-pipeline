<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>AIS Live — Ad 2 Intro (9x16)</title>
    <link href="assets/fonts/fonts.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --onyx: #07121c; --charcoal: #0a0e14; --cream: #f0eee9; --paper: #ffffff;
        --blue: #37bdf8; --yellow: #f5d82a; --coral: #ff8a5c; --red-live: #ff3b30;
        --paper-soft: rgba(209, 220, 232, 0.82); --paper-mute: rgba(209, 220, 232, 0.55);
        --font-display: "Montserrat", sans-serif; --font-body: "Inter", sans-serif; --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; color: #fff; font-family: var(--font-body); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; isolation: isolate; }
      #bg-wrap { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      #bg-video { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #root .clip { position: absolute; inset: 0; width: 1080px; height: 1920px; pointer-events: none; }

      #panel .grid { position: absolute; left: -40px; right: -40px; bottom: -40px; height: 880px; background-image: linear-gradient(rgba(55,189,248,0.11) 1px, transparent 1px), linear-gradient(90deg, rgba(55,189,248,0.11) 1px, transparent 1px); background-size: 46px 46px; -webkit-mask-image: linear-gradient(0deg, #000 0%, #000 62%, transparent 100%); mask-image: linear-gradient(0deg, #000 0%, #000 62%, transparent 100%); }
      #panel .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 860px; background: linear-gradient(0deg, rgba(7,18,28,0.97) 0%, rgba(7,18,28,0.93) 40%, rgba(7,18,28,0.62) 72%, rgba(7,18,28,0.0) 100%); }

      .card { position: relative; overflow: hidden; border-radius: 6px; background: linear-gradient(135deg, rgba(7,18,28,0.93), rgba(10,14,20,0.86)); border: 1px solid rgba(55,189,248,0.32); box-shadow: 0 24px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06); }
      .card::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(55,189,248,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(55,189,248,0.07) 1px, transparent 1px); background-size: 28px 28px; }
      .kick { display: inline-block; font-family: var(--font-mono); font-weight: 700; font-size: 26px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--blue); white-space: nowrap; padding: 12px 20px; border-radius: 4px; border: 1.5px solid rgba(55,189,248,0.55); background: rgba(7,18,28,0.55); }
      .beat { position: absolute; left: 56px; bottom: 132px; width: 968px; }

      /* A · screenshot envy */
      #beatA .kick { margin-bottom: 24px; }
      #beatA .line { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 84px; line-height: 1.0; letter-spacing: -0.035em; color: #fff; text-shadow: 0 3px 26px rgba(0,0,0,0.55); }
      #beatA .box { display: inline-block; background: var(--blue); color: var(--onyx); font-style: italic; padding: 2px 20px 8px; border-radius: 5px; box-shadow: 0 0 40px rgba(55,189,248,0.4); }

      /* B · subtle difference */
      #beatB .big { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 104px; line-height: 0.94; letter-spacing: -0.04em; color: #fff; text-shadow: 0 3px 30px rgba(0,0,0,0.6); }
      #beatB .big em { color: var(--blue); font-style: italic; }

      /* C · what they won't tell you — three cards */
      #beatC .kick { margin-bottom: 22px; }
      #beatC .dcard { display: flex; align-items: center; gap: 22px; padding: 24px 30px; margin-bottom: 16px; width: 100%; }
      #beatC .dnum { font-family: var(--font-mono); font-weight: 700; font-size: 30px; color: var(--blue); opacity: 0.9; }
      #beatC .dtext { font-family: var(--font-body); font-weight: 600; font-size: 46px; line-height: 1.0; color: #fff; letter-spacing: -0.012em; }

      /* D · smart vs paid */
      #beatD .gbox { padding: 26px 34px; width: 100%; }
      #beatD .gtext { font-family: var(--font-body); font-weight: 600; font-size: 50px; line-height: 1.0; letter-spacing: -0.012em; }
      #beatD .top .gtext { color: var(--paper-mute); }
      #beatD .bottom { background: linear-gradient(135deg, rgba(55,189,248,0.95), rgba(55,189,248,0.78)); border-color: rgba(55,189,248,0.9); }
      #beatD .bottom .gtext { color: var(--onyx); font-weight: 800; }
      #beatD .gaplabel { display: flex; align-items: center; gap: 16px; margin: 18px 0 18px 4px; font-family: var(--font-mono); font-weight: 700; font-size: 22px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--coral); }
      #beatD .gaplabel::after { content: ""; flex: 1; height: 2px; background: linear-gradient(90deg, rgba(255,138,92,0.7), rgba(255,138,92,0)); }

      /* E · reveal everything */
      #beatE .sub { font-family: var(--font-body); font-weight: 600; font-size: 50px; color: var(--paper-soft); letter-spacing: -0.01em; margin-bottom: 22px; text-shadow: 0 3px 20px rgba(0,0,0,0.5); }
      #beatE .big { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 138px; line-height: 0.86; letter-spacing: -0.045em; color: #fff; text-shadow: 0 4px 40px rgba(0,0,0,0.6); }
      #beatE .big em { color: var(--blue); font-style: italic; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ais-live-intro2-9x16" data-start="0" data-duration="23.52" data-width="1080" data-height="1920">
      <div id="bg-wrap"><video id="bg-video" src="assets/intro2-source.mp4" data-start="0" data-duration="23.52" data-track-index="0" data-has-audio="false" muted></video></div>
      <audio id="bg-audio" src="assets/intro2-audio.m4a" data-start="0" data-duration="23.52" data-track-index="1"></audio>
      <div id="panel" class="clip" data-start="0" data-duration="23.52" data-track-index="2"><div class="scrim"></div><div class="grid"></div></div>

      <div id="beatA" class="clip" data-start="0.8" data-duration="6.4" data-track-index="3">
        <div class="beat"><div class="kick">Screenshot envy</div><div class="line">They&rsquo;re getting paid.<br>And they&rsquo;re not <span class="box">smarter.</span></div></div>
      </div>
      <div id="beatB" class="clip" data-start="7.6" data-duration="2.7" data-track-index="4">
        <div class="beat"><div class="big">There&rsquo;s a <em>subtle difference.</em></div></div>
      </div>
      <div id="beatC" class="clip" data-start="12.4" data-duration="5.9" data-track-index="5">
        <div class="beat">
          <div class="kick">What they won&rsquo;t tell you</div>
          <div class="card dcard d1"><span class="dnum">01</span><span class="dtext">How they got the client</span></div>
          <div class="card dcard d2"><span class="dnum">02</span><span class="dtext">How long it took</span></div>
          <div class="card dcard d3"><span class="dnum">03</span><span class="dtext">The contract</span></div>
        </div>
      </div>
      <div id="beatD" class="clip" data-start="18.4" data-duration="2.9" data-track-index="6">
        <div class="beat">
          <div class="card gbox top"><span class="gtext">Being smart</span></div>
          <div class="gaplabel">The difference</div>
          <div class="card gbox bottom"><span class="gtext">Getting paid</span></div>
        </div>
      </div>
      <div id="beatE" class="clip" data-start="21.3" data-duration="2.22" data-track-index="7">
        <div class="beat"><div class="sub">So I&rsquo;m going to&hellip;</div><div class="big">Reveal <em>everything.</em></div></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const DURATION = 23.52;
      const tl = gsap.timeline({ paused: true });

      /* A — "smarter" 5.50 */
      tl.fromTo("#beatA", { autoAlpha: 0, y: 44, filter: "blur(10px)" }, { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 1.1);
      tl.from("#beatA .kick", { autoAlpha: 0, y: 12, duration: 0.4, ease: "power2.out" }, 1.3);
      tl.from("#beatA .line", { autoAlpha: 0, y: 16, duration: 0.45, ease: "power2.out" }, 1.45);
      tl.fromTo("#beatA .box", { scale: 0.6, autoAlpha: 0, y: 8 }, { scale: 1, autoAlpha: 1, y: 0, duration: 0.4, ease: "back.out(2)", transformOrigin: "left center" }, 5.4);
      tl.to("#beatA", { autoAlpha: 0, y: 40, filter: "blur(8px)", duration: 0.4, ease: "power2.in" }, 6.85);

      /* B — "subtle difference" 8.04 */
      tl.fromTo("#beatB", { autoAlpha: 0, scale: 0.82, filter: "blur(10px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.5)", transformOrigin: "left center" }, 7.8);
      tl.to("#beatB", { autoAlpha: 0, scale: 0.94, filter: "blur(8px)", duration: 0.35, ease: "power2.in" }, 9.85);

      /* C — client (14.08), took (15.34), contract (16.96) */
      tl.fromTo("#beatC", { autoAlpha: 0, y: 44, filter: "blur(10px)" }, { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 12.6);
      tl.from("#beatC .kick", { autoAlpha: 0, y: 12, duration: 0.4, ease: "power2.out" }, 12.8);
      tl.fromTo("#beatC .d1", { autoAlpha: 0, scale: 0.94, x: -16 }, { autoAlpha: 1, scale: 1, x: 0, duration: 0.45, ease: "power3.out", transformOrigin: "left center" }, 13.8);
      tl.fromTo("#beatC .d2", { autoAlpha: 0, scale: 0.94, x: -16 }, { autoAlpha: 1, scale: 1, x: 0, duration: 0.45, ease: "power3.out", transformOrigin: "left center" }, 15.0);
      tl.fromTo("#beatC .d3", { autoAlpha: 0, scale: 0.94, x: -16 }, { autoAlpha: 1, scale: 1, x: 0, duration: 0.45, ease: "power3.out", transformOrigin: "left center" }, 16.6);
      tl.to("#beatC", { autoAlpha: 0, y: 40, filter: "blur(8px)", duration: 0.4, ease: "power2.in" }, 18.0);

      /* D — "smart" 19.82, "paid" 20.74 */
      tl.fromTo("#beatD .top", { autoAlpha: 0, scale: 0.94, y: 10 }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out", transformOrigin: "left center" }, 18.7);
      tl.from("#beatD .gaplabel", { autoAlpha: 0, duration: 0.4, ease: "power1.out" }, 19.6);
      tl.fromTo("#beatD .bottom", { autoAlpha: 0, scale: 0.94, y: 20 }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out", transformOrigin: "left center" }, 20.4);
      tl.to("#beatD", { autoAlpha: 0, y: 40, filter: "blur(8px)", duration: 0.35, ease: "power2.in" }, 21.15);

      /* E — "reveal everything" 22.68 */
      tl.fromTo("#beatE .sub", { autoAlpha: 0, y: 18, filter: "blur(8px)" }, { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power2.out" }, 21.4);
      tl.fromTo("#beatE .big", { autoAlpha: 0, scale: 0.7, y: 14 }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.8)", transformOrigin: "left center" }, 22.5);
      tl.to("#beatE .sub", { autoAlpha: 0.35, duration: 0.4, ease: "power1.out" }, 22.6);

      tl.set("#beatA", { autoAlpha: 0 }, 7.3);
      tl.set("#beatB", { autoAlpha: 0 }, 10.25);
      tl.set("#beatC", { autoAlpha: 0 }, 18.45);
      tl.set("#beatD", { autoAlpha: 0 }, 21.6);
      tl.set({}, {}, DURATION);
      window.__timelines["ais-live-intro2-9x16"] = tl;
    </script>
  </body>
</html>
