    3.92  gooey splits 1 -> 2 -> 4 -> 8 (one continuous blob system, cluster keeps turning)
    6.08  explode + assemble into two cave hunters (20px grid); the hunter carries the spear overhead, the other flails
    8.40  the chaser falls away, the hunter plants and winds up;  9.00 throw;  spear flies right
    9.17  SCALE-THROUGH: a giant dot meets the spear tip, sweeps in and becomes the ground (oxblood)
    9.40  two cream stones drift in, strike on the beat (9.79), fly apart off frame, sparks settle into two embers
   10.33  fire builds dot by dot from the embers (30px grid), flickers
   11.71  INVERT CUT: ground back to cream; the fire's curl coils into a coin with a square hole (5f), leftovers drift off
   11.92  the coin rocks +-15 deg;  13.33 silhouette swap to a spoked wheel, it spins up
   14.08  the wheel fills solid (2f), becomes one dot, shrinks (ease-in);  14.50 bursts as an over-scaled grid
   14.50  zoom out (6f) into a galloping horse and rider; a second rider enters from the left
  Flow rules (Aidan, proof v1 "too choppy"): nothing starts from rest, moves overlap, camera always drifting,
  180-degree shutter motion blur (8 sub-frames on blobs, streaks on moving dots), WebGL metaballs.

            out.fillStyle = g; out.fillRect(0, 0, W, H);
            if (LOGO.complete && LOGO.naturalWidth) {
              const u = bz(0.23, 1, 0.32, 1)(seg(cc, T_CARD + 4, 21)), lw = 620, lh = lw * LOGO.naturalHeight / LOGO.naturalWidth;
              out.globalAlpha = u; out.filter = `blur(${(6 * (1 - u)).toFixed(2)}px)`; out.drawImage(LOGO, 960 - lw / 2, 540 - lh / 2 + 18 * (1 - u), lw, lh); out.filter = "none"; out.globalAlpha = 1;
            }
            out.globalAlpha = 0.16 * op; out.fillStyle = GP; out.translate(-Math.floor(hash(Math.floor(t * 24), 1, 5) * 256), -Math.floor(hash(Math.floor(t * 24), 2, 5) * 256)); out.fillRect(0, 0, W + 256, H + 256);
            out.restore();
          }
          const f = Math.floor(t * 24); out.save(); out.globalAlpha = 0.05;
          out.translate(-Math.floor(hash(f, 1, 3) * 256), -Math.floor(hash(f, 2, 3) * 256)); out.fillStyle = GP; out.fillRect(0, 0, W + 256, H + 256); out.restore();
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        const STEP_FPS = 18;   /* hold each frame 1/STEP_FPS s (12 = on twos, 18 = in between); 0 = smooth, every frame */
        const q = (t) => (STEP_FPS ? Math.floor(t * STEP_FPS + 1e-6) / STEP_FPS : t);
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(q(P.t)) }, 0);
        tl.set({}, {}, END);
        draw(0);
        window.__timelines["hp-cg-proof"] = tl;
      })();
    </script>
