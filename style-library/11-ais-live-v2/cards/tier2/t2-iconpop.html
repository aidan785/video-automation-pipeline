<!doctype html>
<!--
  AIS LIVE v2 · tier2 · label · ICONPOP — transparent overlay; glass icon chips pop along the bottom third in sync with spoken words (data-at = seconds from beat start). Bakes 5 chips; strip empties. Video stays full-frame.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;color:var(--text);font-family:var(--font-body);}
      #aisv2-t2-iconpop{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:none;}
      #aisv2-t2-iconpop .chip{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
        background:var(--chip-overlay-bg);border:1px solid var(--chip-overlay-border);border-radius:var(--radius-chip);
        box-shadow:var(--chip-highlight),var(--chip-shadow),var(--chip-glow);overflow:hidden;will-change:transform,opacity;
        backdrop-filter:blur(10px) saturate(1.1);}
      #aisv2-t2-iconpop .chip .sheen{position:absolute;top:-30%;bottom:-30%;left:0;width:34%;pointer-events:none;
        background:linear-gradient(105deg,transparent,rgba(255,255,255,.16),transparent);transform:translateX(-160%) rotate(8deg);}
      #aisv2-t2-iconpop .ic{display:block;}
      #aisv2-t2-iconpop .ic svg{width:100%;height:100%;display:block;color:var(--icon-color);filter:var(--icon-halo);
        fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
      #aisv2-t2-iconpop .ic svg *{stroke-dasharray:100 100;}

      #aisv2-t2-iconpop .popsrow{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);display:flex;gap:42px;align-items:flex-start;}
      #aisv2-t2-iconpop .popwrap{display:flex;flex-direction:column;align-items:center;gap:14px;will-change:transform,opacity;}
      #aisv2-t2-iconpop .popwrap .chip{width:142px;height:142px;}
      #aisv2-t2-iconpop .popwrap .ic{width:66px;height:66px;}
      #aisv2-t2-iconpop .cl{font-family:var(--font-mono);font-weight:var(--wt-bold);font-size:21px;color:var(--white);
        letter-spacing:.16em;text-transform:uppercase;text-align:center;max-width:180px;line-height:1.3;
        text-shadow:0 2px 12px rgba(0,0,0,.8), 0 0 18px rgba(var(--blue-rgb),.35);}

    </style>
  </head>
  <body>
    <div id="aisv2-t2-iconpop" data-composition-id="aisv2-t2-iconpop" data-start="0" data-width="1920" data-height="1080">

      <div class="popsrow">
        <div class="popwrap" data-at="0.2"><span class="chip"><i class="sheen"></i><span class="ic" data-icon="doc"></span></span><span class="cl">CONTENT</span></div>
        <div class="popwrap" data-at="0.9"><span class="chip"><i class="sheen"></i><span class="ic" data-icon="megaphone"></span></span><span class="cl">MARKETING</span></div>
        <div class="popwrap" data-at="1.6"><span class="chip"><i class="sheen"></i><span class="ic" data-icon="target"></span></span><span class="cl">SALES</span></div>
        <div class="popwrap" data-at="2.3"><span class="chip"><i class="sheen"></i><span class="ic" data-icon="gear"></span></span><span class="cl">OPERATIONS</span></div>
        <div class="popwrap" data-at="3.0"><span class="chip"><i class="sheen"></i><span class="ic" data-icon="userplus"></span></span><span class="cl">RECRUITING</span></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>

      window.__timelines = window.__timelines || {};
      const ROOT = document.getElementById("aisv2-t2-iconpop");
      const $  = (s) => ROOT.querySelectorAll(s);
      const $1 = (s) => ROOT.querySelector(s);
      const DUR = 12;
      const tl = gsap.timeline({ paused: true });
      const ICONS = {"compass":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M15.5 8.5l-2.2 5.8-5.8 2.2 2.2-5.8z\"/>","doc":"<path d=\"M6 3h8l4 4v14H6z\"/><path d=\"M14 3v4h4\"/><path d=\"M9 12h6M9 16h6\"/>","megaphone":"<path d=\"M4 10v4l3 .6V9.4z\"/><path d=\"M7 9.4L19 5v14l-12-4.6\"/><path d=\"M9.5 15.4l1.2 4.1h2.4l-1.2-4.4\"/>","target":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1.2\"/>","gear":"<circle cx=\"12\" cy=\"12\" r=\"4.2\"/><path d=\"M12 2.5v2.8M12 18.7v2.8M2.5 12h2.8M18.7 12h2.8M5.3 5.3l2 2M16.7 16.7l2 2M18.7 5.3l-2 2M7.3 16.7l-2 2\"/>","users":"<circle cx=\"9\" cy=\"8\" r=\"3.4\"/><path d=\"M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6\"/><circle cx=\"17\" cy=\"9\" r=\"2.4\"/><path d=\"M16.6 14.6c2.5.5 4.4 2.7 4.4 5.4\"/>","userplus":"<circle cx=\"10\" cy=\"8\" r=\"3.4\"/><path d=\"M4 20c0-3.3 2.7-6 6-6s6 2.7 6 6\"/><path d=\"M18.5 5.5v6M15.5 8.5h6\"/>","mail":"<rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7.5l9 6 9-6\"/>","bulb":"<path d=\"M9 18h6M10 21h4\"/><path d=\"M12 3a6 6 0 00-4 10.5c.8.7 1 1.5 1 2.5h6c0-1 .2-1.8 1-2.5A6 6 0 0012 3z\"/>","clock":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3.5 2\"/>","briefcase":"<rect x=\"3\" y=\"8\" width=\"18\" height=\"12\" rx=\"2\"/><path d=\"M9 8V6a2 2 0 012-2h2a2 2 0 012 2v2\"/><path d=\"M3 13h18\"/>","building":"<rect x=\"5\" y=\"4\" width=\"14\" height=\"17\"/><path d=\"M9 8h2M13 8h2M9 12h2M13 12h2M9 16h2M13 16h2\"/><path d=\"M10.5 21v-3h3v3\"/>","gradcap":"<path d=\"M2 9l10-5 10 5-10 5z\"/><path d=\"M6.5 11.5V16c0 1.6 2.5 3 5.5 3s5.5-1.4 5.5-3v-4.5\"/><path d=\"M22 9v5\"/>","code":"<path d=\"M8 6l-6 6 6 6M16 6l6 6-6 6\"/>","scales":"<path d=\"M12 4v15M8.5 19h7M3.5 7h17\"/><path d=\"M6 7l-2.4 5.2a2.9 2.9 0 004.8 0L6 7z\"/><path d=\"M18 7l-2.4 5.2a2.9 2.9 0 004.8 0L18 7z\"/>","heart":"<path d=\"M12 20s-7-4.6-9-9a4.8 4.8 0 018.6-3.4l.4.4.4-.4A4.8 4.8 0 0121 11c-2 4.4-9 9-9 9z\"/>","spark":"<path d=\"M12 3l2 6 6 3-6 3-2 6-2-6-6-3 6-3z\"/>","flag":"<path d=\"M5 21V4\"/><path d=\"M5 4c4-2 7 2 12 0v9c-5 2-8-2-12 0\"/>","search":"<circle cx=\"10.5\" cy=\"10.5\" r=\"6.5\"/><path d=\"M15.5 15.5L21 21\"/>","pen":"<path d=\"M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19z\"/><path d=\"M14.5 6.5l3 3\"/>","repeat":"<path d=\"M4 12a8 8 0 0113.6-5.7L20 8.5\"/><path d=\"M20 3.5v5h-5\"/><path d=\"M20 12a8 8 0 01-13.6 5.7L4 15.5\"/><path d=\"M4 20.5v-5h5\"/>","chartup":"<path d=\"M3 17.5l6-6 4 4 8-8\"/><path d=\"M15 7.5h6v6\"/>","rocket":"<path d=\"M12 2.6c2.5 1.9 3.9 4.8 3.9 7.9 0 1.9-.5 3.7-1.4 5.1H9.5c-.9-1.4-1.4-3.2-1.4-5.1 0-3.1 1.4-6 3.9-7.9z\"/><circle cx=\"12\" cy=\"9.7\" r=\"1.8\"/><path d=\"M9.5 15.6L7.6 19.2M14.5 15.6l1.9 3.6M12 16.4v3.8\"/>","shield":"<path d=\"M12 3l7 2.6v5.2c0 4.4-2.9 7.6-7 10.2-4.1-2.6-7-5.8-7-10.2V5.6z\"/><path d=\"M9 12.2l2.2 2.2 4.3-4.6\"/>","bot":"<rect x=\"5\" y=\"8\" width=\"14\" height=\"10\" rx=\"3\"/><path d=\"M12 8V5.2\"/><circle cx=\"12\" cy=\"3.8\" r=\"1.2\"/><circle cx=\"9.2\" cy=\"12.5\" r=\"1\"/><circle cx=\"14.8\" cy=\"12.5\" r=\"1\"/><path d=\"M9.5 15.5h5\"/>","chip":"<rect x=\"7\" y=\"7\" width=\"10\" height=\"10\" rx=\"2\"/><path d=\"M10 7V4M14 7V4M10 20v-3M14 20v-3M7 10H4M7 14H4M20 10h-3M20 14h-3\"/>","workflow":"<circle cx=\"5.5\" cy=\"6\" r=\"2.4\"/><circle cx=\"18.5\" cy=\"6\" r=\"2.4\"/><circle cx=\"12\" cy=\"18\" r=\"2.4\"/><path d=\"M7.9 6h8.2M6.6 8.2l4.2 7.6M17.4 8.2l-4.2 7.6\"/>","layers":"<path d=\"M12 3l9 5-9 5-9-5z\"/><path d=\"M3 13.5l9 5 9-5\"/>","calendar":"<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/>","ticket":"<path d=\"M3 9V7a2 2 0 012-2h14a2 2 0 012 2v2a3 3 0 000 6v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2a3 3 0 000-6z\"/><path d=\"M14 8v1.6M14 11.7v1.6M14 15.4V17\"/>","check":"<path d=\"M4 12.5l5.5 5.5L20 6.5\"/>","undo":"<path d=\"M9 14L4 9l5-5\"/><path d=\"M4 9h10a6 6 0 016 6v1.5\"/>","funnel":"<path d=\"M3 4h18l-7 8v7l-4-2v-5z\"/>","bolt":"<path d=\"M13 2L4 14h6l-1 8 9-12h-6z\"/>","link":"<path d=\"M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1.5 1.5\"/><path d=\"M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1.5-1.5\"/>","globe":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18\"/><path d=\"M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21M12 3c-2.5 2.6-3.8 5.7-3.8 9s1.3 6.4 3.8 9\"/>","down":"<path d=\"M12 4v15M6 13.5l6 6 6-6\"/>","up":"<path d=\"M12 20V5M5.5 10.5L12 4l6.5 6.5\"/>","dollar":"<path d=\"M12 3v18\"/><path d=\"M16.5 7c-.8-1.5-2.4-2.2-4.5-2.2-2.5 0-4.5 1.2-4.5 3.3 0 4.5 9 2.7 9 7.2 0 2.1-2 3.3-4.5 3.3-2.1 0-3.9-.8-4.7-2.3\"/>","key":"<circle cx=\"8\" cy=\"14\" r=\"4.5\"/><path d=\"M11.5 10.5L20 2M15 7l3 3M18 4l2.5 2.5\"/>"};
      $("[data-icon]").forEach(el => {
        const n = el.getAttribute("data-icon");
        if (!n || !ICONS[n]) { el.style.display = "none"; return; }
        el.innerHTML = "<svg viewBox='0 0 24 24'>" + ICONS[n] + "</svg>";
        el.querySelectorAll("path,circle,rect,line,polyline").forEach(p => p.setAttribute("pathLength", "100"));
      });
      [".popwrap"].forEach(sel => $(sel).forEach(r => { if (!r.textContent.trim()) r.remove(); }));

      /* ---- scene ---- */
      $(".popwrap").forEach((el, i) => {
        const at = parseFloat(el.getAttribute("data-at") || (0.2 + i * 0.6));
        tl.fromTo(el, {autoAlpha:0, y:44, scale:.5}, {autoAlpha:1, y:0, scale:1, duration:.55, ease:"back.out(1.8)", transformOrigin:"50% 90%"}, at);
        tl.fromTo(el.querySelectorAll(".ic svg *"), {strokeDashoffset:100}, {strokeDashoffset:0, duration:.5, ease:"power2.inOut", stagger:.05}, at + 0.1);
        tl.fromTo(el.querySelector(".sheen"), {xPercent:-160}, {xPercent:560, duration:.5, ease:"power2.inOut", immediateRender:false}, at + 0.45);
        const floatStart = at + 1.1;
        tl.to(el, {y:"-=7", duration:1.4, yoyo:true, repeat:Math.max(1, Math.floor((DUR - floatStart)/1.4) - 1), ease:"sine.inOut"}, floatStart);
      });
      tl.set({}, {}, DUR);
      window.__timelines["aisv2-t2-iconpop"] = tl;
      if (location.hash.indexOf("#t=") === 0) { tl.progress(0); tl.seek(parseFloat(location.hash.slice(3)) || 0); }
    </script>
  </body>
</html>
