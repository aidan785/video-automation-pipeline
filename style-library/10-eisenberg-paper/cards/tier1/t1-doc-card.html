<!doctype html>
<!--
  EISENBERG PAPER · tier1 · overview · DOC CARD  (vertical 1080x1920)
  The deep-green document card from the LinkedIn reel: a tall green card
  with black label chips (serif italic white text) and white skeleton text
  lines. Card slides up, then each chip pops and its lines draw in
  (scaleX), section by section. Camera pushes in.
  Slots: chip1 · chip2 · chip3.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #ep-t1-doc-card {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: var(--paper-mid); color: var(--ink);
        font-family: var(--font-mono); overflow: hidden;
      }
      #ep-t1-doc-card .stage { position: absolute; inset: 0; z-index: 3; }

      #ep-t1-doc-card .docwrap { position: absolute; left: 150px; top: 380px; }
      #ep-t1-doc-card .doc {
        width: 780px; min-height: 1080px;
        background: var(--card-alt); border-radius: 34px;
        border-top: 1px solid var(--card-alt-hi);
        box-shadow: var(--shadow-card);
        padding: 64px 64px 70px; box-sizing: border-box;
        transform: rotate(-0.6deg);
      }
      #ep-t1-doc-card .sec { margin-bottom: 64px; }
      #ep-t1-doc-card .chip {
        display: inline-block; background: #101312; color: var(--tag);
        font-family: var(--font-display); font-style: italic;
        font-size: 40px; padding: 12px 30px; border-radius: 12px;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35);
        margin-bottom: 30px; white-space: nowrap;
      }
      #ep-t1-doc-card .ln {
        height: 9px; border-radius: 5px; background: var(--doc-line);
        margin-bottom: 20px; transform-origin: left center;
      }
      #ep-t1-doc-card .ln.w1 { width: 92%; } #ep-t1-doc-card .ln.w2 { width: 78%; }
      #ep-t1-doc-card .ln.w3 { width: 86%; } #ep-t1-doc-card .ln.w4 { width: 55%; }
    </style>
  </head>
  <body>
    <div id="ep-t1-doc-card" data-composition-id="ep-t1-doc-card" data-start="0" data-width="1080" data-height="1920">
      <div class="ep-cam">
        <div class="ep-paper"></div>
        <div class="stage">
          <div class="drift"><div class="mover docwrap">
            <div class="doc">
              <div class="sec">
                <span class="chip" data-slot="chip1">What you do</span>
                <div class="ln w1"></div><div class="ln w2"></div><div class="ln w4"></div>
              </div>
              <div class="sec">
                <span class="chip" data-slot="chip2">How you sound</span>
                <div class="ln w3"></div><div class="ln w1"></div><div class="ln w2"></div>
              </div>
              <div class="sec">
                <span class="chip" data-slot="chip3">How you work</span>
                <div class="ln w2"></div><div class="ln w4"></div>
              </div>
            </div>
          </div></div>
        </div>
      </div>
      <div class="ep-lens"></div>
      <div class="ep-vig"></div>
      <div class="ep-grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#ep-t1-doc-card";
      const DUR = 7;

      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const rnd = mulberry32(515);

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(root + " .ep-cam", { scale: 1.04 }, { scale: 1.09, duration: DUR, ease: "none" }, 0)
        .to(root + " .ep-cam", { x: 6, y: 4, rotation: -0.22, duration: DUR / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      document.querySelectorAll(root + " .drift").forEach((el) => {
        const half = 1.4 + rnd() * 0.7;
        tl.to(el, {
          x: (rnd() * 2 - 1) * 4, y: 3 + rnd() * 2.5, rotation: (rnd() * 2 - 1) * 0.35,
          duration: half, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / half),
        }, 0);
      });

      tl
        /* doc slides up */
        .fromTo(root + " .docwrap",
          { y: 780, x: -22, autoAlpha: 0, filter: "blur(10px)" },
          { y: 0, x: 0, autoAlpha: 1, filter: "blur(0px)", duration: 0.9, ease: "back.out(0.9)" }, 0.15)

        /* section by section: chip pops, its lines draw */
        .from(root + " .sec:nth-child(1) .chip", { scale: 0.7, autoAlpha: 0, duration: 0.48, ease: "back.out(1.0)" }, 1.05)
        .from(root + " .sec:nth-child(1) .ln", { scaleX: 0, duration: 0.5, ease: "power2.out", stagger: 0.09 }, 1.25)

        .from(root + " .sec:nth-child(2) .chip", { scale: 0.7, autoAlpha: 0, duration: 0.48, ease: "back.out(1.0)" }, 2.15)
        .from(root + " .sec:nth-child(2) .ln", { scaleX: 0, duration: 0.5, ease: "power2.out", stagger: 0.09 }, 2.35)

        .from(root + " .sec:nth-child(3) .chip", { scale: 0.7, autoAlpha: 0, duration: 0.48, ease: "back.out(1.0)" }, 3.25)
        .from(root + " .sec:nth-child(3) .ln", { scaleX: 0, duration: 0.5, ease: "power2.out", stagger: 0.09 }, 3.45)

        /* breathing hold */
        .set({}, {}, DUR);

      window.__timelines["ep-t1-doc-card"] = tl;
    </script>
  </body>
</html>
