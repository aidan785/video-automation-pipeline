<!doctype html>
<!--
  EISENBERG PAPER · tier1 · overview · TERMINAL HERO  (vertical 1080x1920)
  The big charcoal terminal window. Slides up from below with motion blur
  and a back.out settle. Chrome: three white dots + a dark app-icon tile.
  Coral pixel-art mascot (CSS box-shadow pixels). Dim mono welcome lines,
  a white prompt pill types on, a mint status prints. Camera pushes in.
  Slots: l1 · l2 · prompt · status.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #ep-t1-terminal-hero {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: var(--paper-mid); color: var(--term-text);
        font-family: var(--font-mono); overflow: hidden;
      }
      #ep-t1-terminal-hero .stage { position: absolute; inset: 0; z-index: 3; }

      #ep-t1-terminal-hero .termwrap { position: absolute; left: 80px; top: 560px; }
      #ep-t1-terminal-hero .term {
        position: relative; width: 920px; min-height: 620px;
        background: var(--card); border-radius: var(--radius-card);
        border-top: 1px solid var(--card-hi);
        border-left: 1px solid var(--card-hi-l);
        box-shadow: var(--shadow-card);
        padding: 36px 52px 52px; box-sizing: border-box;
        transform: rotate(-0.4deg);
      }
      #ep-t1-terminal-hero .chrome { display: flex; align-items: center; gap: 13px; margin-bottom: 46px; }
      #ep-t1-terminal-hero .dot { width: 15px; height: 15px; border-radius: 50%; background: var(--tag); }
      #ep-t1-terminal-hero .appicon {
        margin-left: 18px; width: 34px; height: 34px; border-radius: 9px;
        background: #2A2827; display: flex; align-items: center; justify-content: center;
        color: var(--tag); font-size: 19px; font-weight: 600;
      }

      /* coral pixel mascot — box-shadow pixel art, 13px grid */
      #ep-t1-terminal-hero .mascot { position: absolute; top: 108px; right: 150px; width: 13px; height: 13px; }
      #ep-t1-terminal-hero .mascot::before {
        content: ""; position: absolute; width: 13px; height: 13px; background: var(--coral);
        box-shadow:
          13px 0 var(--coral), 26px 0 var(--coral), 39px 0 var(--coral), 52px 0 var(--coral),
          65px 0 var(--coral), 78px 0 var(--coral),
          0 13px var(--coral), 13px 13px var(--card), 26px 13px var(--coral), 39px 13px var(--coral),
          52px 13px var(--coral), 65px 13px var(--card), 78px 13px var(--coral),
          -13px 13px var(--coral), 91px 13px var(--coral),
          0 26px var(--coral), 13px 26px var(--coral), 26px 26px var(--coral), 39px 26px var(--coral),
          52px 26px var(--coral), 65px 26px var(--coral), 78px 26px var(--coral),
          13px 39px var(--coral), 65px 39px var(--coral);
      }

      #ep-t1-terminal-hero .line { font-size: var(--size-term); line-height: 1.55; white-space: pre-line; }
      #ep-t1-terminal-hero .line.dim { color: var(--term-dim); font-size: var(--size-term-sm); margin-top: 30px; }

      #ep-t1-terminal-hero .promptline {
        margin-top: 46px; font-size: var(--size-term); font-weight: 500;
        display: inline-flex; align-items: baseline;
        background: var(--tag); color: var(--tag-ink);
        padding: 7px 16px; border-radius: 7px;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35);
      }
      #ep-t1-terminal-hero .promptline .chars span { display: inline-block; white-space: pre; }
      #ep-t1-terminal-hero .cursor {
        display: inline-block; width: 12px; height: 25px;
        background: var(--tag-ink); margin-left: 6px; transform: translateY(4px);
      }

      #ep-t1-terminal-hero .status {
        margin-top: 40px; font-size: var(--size-term);
        color: var(--mint); letter-spacing: var(--track-pill);
      }
    </style>
  </head>
  <body>
    <div id="ep-t1-terminal-hero" data-composition-id="ep-t1-terminal-hero" data-start="0" data-width="1080" data-height="1920">
      <div class="ep-cam">
        <div class="ep-paper"></div>
        <div class="stage">
          <div class="drift"><div class="mover termwrap">
            <div class="term">
              <div class="chrome">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                <span class="appicon">C</span>
              </div>
              <div class="mascot"></div>
              <div class="line" data-slot="l1">Claude Code v2.1.6&#10;Welcome back, Daniel!</div>
              <div class="line dim" data-slot="l2">Sonnet 4.5 · API Usage Billing · Why Try AI&#10;~/Claude Code</div>
              <div class="promptline">
                <span>&gt;&nbsp;</span><span class="chars" data-slot="prompt">fix typecheck errors</span><span class="cursor"></span>
              </div>
              <div class="status" data-slot="status">[CAVEMAN ACTIVE]</div>
            </div>
          </div></div>
        </div>
      </div>
      <div class="ep-lens"></div>
      <div class="ep-vig"></div>
      <div class="ep-grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#ep-t1-terminal-hero";
      const DUR = 7;

      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const rnd = mulberry32(202);

      const chEl = document.querySelector(root + " .chars");
      const txt = chEl.textContent; chEl.textContent = "";
      txt.split("").forEach((c) => { const s = document.createElement("span"); s.textContent = c; chEl.appendChild(s); });
      const chars = chEl.querySelectorAll("span");
      gsap.set(chars, { autoAlpha: 0 });

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(root + " .ep-cam", { scale: 1.04 }, { scale: 1.09, duration: DUR, ease: "none" }, 0)
        .to(root + " .ep-cam", { x: 6, y: 4, rotation: -0.2, duration: DUR / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      document.querySelectorAll(root + " .drift").forEach((el) => {
        const half = 1.4 + rnd() * 0.7;
        tl.to(el, {
          x: (rnd() * 2 - 1) * 4, y: 3 + rnd() * 2.5, rotation: (rnd() * 2 - 1) * 0.35,
          duration: half, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / half),
        }, 0);
      });

      tl
        /* card slides up from below frame with motion blur */
        .fromTo(root + " .mover",
          { y: 780, x: -22, autoAlpha: 0, filter: "blur(10px)" },
          { y: 0, x: 0, autoAlpha: 1, filter: "blur(0px)", duration: 0.9, ease: "back.out(0.9)" }, 0.15)

        /* follow-through: chrome trails the card landing (Disney #5) */
        .from(root + " .chrome, " + root + " .mascot", { y: -10, autoAlpha: 0, duration: 0.35, ease: "power2.out" }, 0.62)

        /* prompt types on */
        .to(chars, { autoAlpha: 1, duration: 0.01, ease: "none", stagger: 0.03 }, 1.15)

        /* finite cursor blinks */
        .to(root + " .cursor", { autoAlpha: 0, duration: 0.2, repeat: 5, yoyo: true, ease: "none" }, ">0.1")

        /* status prints */
        .from(root + " .status", { autoAlpha: 0, y: 10, filter: "blur(4px)", duration: 0.4, ease: "power3.out" }, 3.0)

        /* breathing hold */
        .set({}, {}, DUR);

      window.__timelines["ep-t1-terminal-hero"] = tl;
    </script>
  </body>
</html>
