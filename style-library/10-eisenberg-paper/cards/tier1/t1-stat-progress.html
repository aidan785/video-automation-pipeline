<!doctype html>
<!--
  EISENBERG PAPER · tier1 · stat · PROGRESS  (vertical 1080x1920)
  The burn-down meter from the reels: a terminal card with a rounded track
  whose sage→coral gradient fill grows while a white price tag attached to
  the card's top edge counts DOWN (data-from → data-value). Camera pushes
  in; everything drifts.
  Slots: stat (data-from/data-value/data-prefix) · sub · l1 · status.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #ep-t1-stat-progress {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: var(--paper-mid); color: var(--term-text);
        font-family: var(--font-mono); overflow: hidden;
      }
      #ep-t1-stat-progress .stage { position: absolute; inset: 0; z-index: 3; }

      #ep-t1-stat-progress .groupwrap { position: absolute; left: 80px; top: 640px; }

      /* white price tag riding the card's top edge */
      #ep-t1-stat-progress .tag {
        position: absolute; left: 300px; top: -74px; z-index: 2;
        background: var(--tag); color: var(--tag-ink);
        border-radius: var(--radius-tag) var(--radius-tag) 0 0;
        box-shadow: var(--shadow-tag);
        padding: 20px 46px 26px; text-align: center;
        font-size: 46px; font-weight: 600; white-space: nowrap;
        transform: rotate(-0.3deg);
      }
      #ep-t1-stat-progress .tag .sub {
        font-size: 20px; color: rgba(34, 32, 30, 0.5);
        text-transform: uppercase; letter-spacing: var(--track-pill); margin-top: 6px;
      }

      #ep-t1-stat-progress .term {
        position: relative; width: 920px;
        background: var(--card); border-radius: var(--radius-card);
        border-top: 1px solid var(--card-hi);
        border-left: 1px solid var(--card-hi-l);
        box-shadow: var(--shadow-card);
        padding: 42px 54px 60px; box-sizing: border-box;
        transform: rotate(-0.4deg);
      }
      #ep-t1-stat-progress .chrome { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
      #ep-t1-stat-progress .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--tag); }

      /* the burn meter */
      #ep-t1-stat-progress .track {
        height: 44px; border-radius: 22px; background: rgba(255, 255, 255, 0.08);
        overflow: hidden; margin-bottom: 38px;
      }
      #ep-t1-stat-progress .fill {
        height: 100%; width: 100%; border-radius: 22px;
        background: linear-gradient(90deg, var(--sage) 0%, var(--mint) 45%, var(--coral) 100%);
        transform-origin: left center;
      }

      #ep-t1-stat-progress .line { font-size: var(--size-term-sm); color: var(--term-dim); line-height: 1.55; white-space: pre-line; }
      #ep-t1-stat-progress .status { margin-top: 24px; font-size: var(--size-term-sm); color: var(--coral); letter-spacing: var(--track-pill); }
    </style>
  </head>
  <body>
    <div id="ep-t1-stat-progress" data-composition-id="ep-t1-stat-progress" data-start="0" data-width="1080" data-height="1920">
      <div class="ep-cam">
        <div class="ep-paper"></div>
        <div class="stage">
          <div class="drift"><div class="mover groupwrap">
            <div class="tag">
              <div><span class="count" data-slot="stat" data-from="3000" data-value="1911" data-prefix="$">$3,000</span></div>
              <div class="sub" data-slot="sub">api budget left</div>
            </div>
            <div class="term">
              <div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
              <div class="track"><div class="fill"></div></div>
              <div class="line" data-slot="l1">Claude Code v2.1.6&#10;Sonnet 4.5 · API Usage Billing · Why Try AI</div>
              <div class="status" data-slot="status">[TOKENS BURNING]</div>
            </div>
          </div></div>
        </div>
      </div>
      <div class="ep-lens"></div>
      <div class="ep-vig"></div>
      <div class="ep-grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#ep-t1-stat-progress";
      const DUR = 7;

      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const rnd = mulberry32(616);

      const countEl = document.querySelector(root + " .count");
      const from = parseFloat(countEl.getAttribute("data-from")) || 0;
      const target = parseFloat(countEl.getAttribute("data-value")) || 0;
      const prefix = countEl.getAttribute("data-prefix") || "";
      const counter = { v: from };
      const fmt = (n) => prefix + Math.round(n).toLocaleString("en-US");
      countEl.textContent = fmt(from);

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(root + " .ep-cam", { scale: 1.04 }, { scale: 1.09, duration: DUR, ease: "none" }, 0)
        .to(root + " .ep-cam", { x: -6, y: 5, rotation: 0.2, duration: DUR / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      document.querySelectorAll(root + " .drift").forEach((el) => {
        const half = 1.4 + rnd() * 0.7;
        tl.to(el, {
          x: (rnd() * 2 - 1) * 4, y: 3 + rnd() * 2.5, rotation: (rnd() * 2 - 1) * 0.35,
          duration: half, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / half),
        }, 0);
      });

      tl
        /* whole group slides up (tag rides the card) */
        .fromTo(root + " .groupwrap",
          { y: 780, x: -22, autoAlpha: 0, filter: "blur(10px)" },
          { y: 0, x: 0, autoAlpha: 1, filter: "blur(0px)", duration: 0.9, ease: "back.out(0.9)" }, 0.15)

        /* follow-through: chrome trails the card landing (Disney #5) */
        .from(root + " .chrome", { y: -10, autoAlpha: 0, duration: 0.35, ease: "power2.out" }, 0.62)

        /* meter burns while the tag counts down — the coupled beat */
        .fromTo(root + " .fill", { scaleX: 0.22 }, { scaleX: 0.78, duration: 1.6, ease: "power1.inOut" }, 1.2)
        .to(counter, {
          v: target, duration: 1.6, ease: "power1.inOut",
          onUpdate: () => { countEl.textContent = fmt(counter.v); },
        }, 1.2)

        /* status prints */
        .from(root + " .status", { autoAlpha: 0, y: 10, filter: "blur(4px)", duration: 0.4, ease: "power3.out" }, 3.0)

        /* breathing hold */
        .set({}, {}, DUR);

      window.__timelines["ep-t1-stat-progress"] = tl;
    </script>
  </body>
</html>
