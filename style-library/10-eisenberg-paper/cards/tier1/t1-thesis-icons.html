<!doctype html>
<!--
  EISENBERG PAPER · tier1 · thesis · ICONS  (vertical 1080x1920)
  The signature composite scene: stacked serif headline up top, a row of
  three app-icon stickers mid-frame, dashed connectors fanning down from
  the icons converging on a white paper tag. Headline builds word by word,
  icons pop staggered, connectors draw, tag pops. Camera pushes in.
  Slots: h1 h2 h3 · g1 g2 g3 · tag.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #ep-t1-thesis-icons {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: var(--paper-mid); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #ep-t1-thesis-icons .stage { position: absolute; inset: 0; z-index: 3; }

      #ep-t1-thesis-icons .phrase { position: absolute; left: 330px; top: 330px; line-height: 1.0; transform: rotate(-0.4deg); }
      #ep-t1-thesis-icons .phrase .w { display: block; font-size: 92px; text-shadow: var(--press); white-space: nowrap; }
      #ep-t1-thesis-icons .phrase .w:nth-child(2) { margin-left: 48px; color: var(--coral); }
      #ep-t1-thesis-icons .phrase .w:nth-child(3) { margin-left: 96px; font-style: italic; }

      #ep-t1-thesis-icons .icons { position: absolute; left: 0; top: 760px; width: 1080px;
        display: flex; justify-content: center; gap: 64px; }
      #ep-t1-thesis-icons .sticker {
        width: 170px; height: 170px;
        background: var(--card); border-radius: 42px;
        border-top: 1px solid var(--card-hi);
        border-left: 1px solid var(--card-hi-l);
        box-shadow: var(--shadow-pill);
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-mono); font-weight: 600; font-size: 84px;
      }
      #ep-t1-thesis-icons .s1 { transform: rotate(-1deg); }  #ep-t1-thesis-icons .s1 .glyph { color: var(--coral); }
      #ep-t1-thesis-icons .s2 { transform: rotate(0.6deg); } #ep-t1-thesis-icons .s2 .glyph { color: var(--lime); }
      #ep-t1-thesis-icons .s3 { transform: rotate(-0.5deg); }#ep-t1-thesis-icons .s3 .glyph { color: var(--term-text); }

      #ep-t1-thesis-icons svg.conn { position: absolute; left: 140px; top: 950px; overflow: visible; }
      #ep-t1-thesis-icons svg.conn path { fill: none; stroke: var(--connector); stroke-width: 3; stroke-dasharray: 8 8; }

      #ep-t1-thesis-icons .tagwrap { position: absolute; left: 385px; top: 1210px; }
      #ep-t1-thesis-icons .tag {
        background: var(--tag); color: var(--tag-ink);
        border-radius: var(--radius-tag); box-shadow: var(--shadow-tag);
        padding: 24px 52px; text-align: center;
        font-family: var(--font-mono); font-size: 52px; font-weight: 600;
        letter-spacing: 0.02em; white-space: nowrap;
        transform: rotate(0.7deg);
      }
    </style>
  </head>
  <body>
    <div id="ep-t1-thesis-icons" data-composition-id="ep-t1-thesis-icons" data-start="0" data-width="1080" data-height="1920">
      <div class="ep-cam">
        <div class="ep-paper"></div>
        <div class="stage">
          <div class="drift"><div class="mover phrase">
            <span class="w" data-slot="h1">these plugins</span>
            <span class="w" data-slot="h2">stop</span>
            <span class="w" data-slot="h3">the burn</span>
          </div></div>

          <div class="drift"><div class="mover icons">
            <div class="sticker s1"><span class="glyph" data-slot="g1">&#9679;</span></div>
            <div class="sticker s2"><span class="glyph" data-slot="g2">M</span></div>
            <div class="sticker s3"><span class="glyph" data-slot="g3">C</span></div>
          </div></div>

          <div class="drift"><div class="mover connwrap">
            <svg class="conn" width="800" height="260" viewBox="0 0 800 260">
              <path class="connpath" d="M 90 0 C 90 140, 380 150, 390 250" />
              <path class="connpath" d="M 400 0 C 400 120, 400 140, 400 250" />
              <path class="connpath" d="M 710 0 C 710 140, 420 150, 410 250" />
            </svg>
          </div></div>

          <div class="drift"><div class="mover tagwrap">
            <div class="tag" data-slot="tag">$2,342 saved</div>
          </div></div>
        </div>
      </div>
      <div class="ep-lens"></div>
      <div class="ep-vig"></div>
      <div class="ep-grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#ep-t1-thesis-icons";
      const DUR = 7;

      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const rnd = mulberry32(212);

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(root + " .ep-cam", { scale: 1.04 }, { scale: 1.09, duration: DUR, ease: "none" }, 0)
        .to(root + " .ep-cam", { x: -6, y: 5, rotation: 0.22, duration: DUR / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      document.querySelectorAll(root + " .drift").forEach((el) => {
        const half = 1.4 + rnd() * 0.7;
        tl.to(el, {
          x: (rnd() * 2 - 1) * 4, y: 3 + rnd() * 2.5, rotation: (rnd() * 2 - 1) * 0.35,
          duration: half, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / half),
        }, 0);
      });

      const words = gsap.utils.toArray(root + " .phrase .w");
      const paths = gsap.utils.toArray(root + " .connpath");
      /* precompute path lengths once (build time) so render workers agree */
      paths.forEach((p) => { p.dataset.len = p.getTotalLength(); gsap.set(p, { strokeDashoffset: p.dataset.len, opacity: 0 }); });

      tl
        /* headline builds word by word */
        .from(words, { autoAlpha: 0, y: 14, scale: 0.96, filter: "blur(5px)", duration: 0.38, ease: "power3.out", stagger: 0.13 }, 0.3)

        /* icon stickers pop staggered with overshoot */
        .from(root + " .sticker", {
          scale: 0.55, autoAlpha: 0, filter: "blur(10px)",
          duration: 0.65, ease: "back.out(1.05)", stagger: 0.16,
        }, 1.1)

        /* connectors draw down, converging (lengths precomputed above) */
        .to(paths, { strokeDashoffset: 0, opacity: 1, duration: 0.5, ease: "power2.inOut", stagger: 0.1 }, 1.9)

        /* tag pops where they converge */
        .from(root + " .tagwrap", { scale: 0.6, autoAlpha: 0, filter: "blur(8px)", duration: 0.55, ease: "back.out(1.0)" }, 2.5)

        /* breathing hold */
        .set({}, {}, DUR);

      window.__timelines["ep-t1-thesis-icons"] = tl;
    </script>
  </body>
</html>
