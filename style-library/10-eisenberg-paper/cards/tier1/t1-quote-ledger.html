<!doctype html>
<!--
  EISENBERG PAPER · tier1 · quote · LEDGER  (vertical 1080x1920)
  Editorial quote takeover. Three stacked serif lines (middle italic sage)
  build line by line, then a white attribution tag pops beneath with a
  dashed connector stub. Camera pushes in; everything drifts.
  Slots: q1 q2 q3 · attrib.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #ep-t1-quote-ledger {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: var(--paper-mid); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #ep-t1-quote-ledger .stage { position: absolute; inset: 0; z-index: 3; }

      #ep-t1-quote-ledger .quote { position: absolute; left: 150px; top: 640px; line-height: 1.08; transform: rotate(-0.4deg); }
      #ep-t1-quote-ledger .quote .q { display: block; font-size: var(--size-title); white-space: nowrap; text-shadow: var(--press); }
      #ep-t1-quote-ledger .quote .q:nth-child(2) { margin-left: 62px; font-style: italic; color: var(--sage); }
      #ep-t1-quote-ledger .quote .q:nth-child(3) { margin-left: 20px; }

      #ep-t1-quote-ledger svg.conn { position: absolute; left: 430px; top: 940px; overflow: visible; }
      #ep-t1-quote-ledger svg.conn path { fill: none; stroke: var(--connector); stroke-width: 3; stroke-dasharray: 9 9; }

      #ep-t1-quote-ledger .attribwrap { position: absolute; left: 260px; top: 1110px; }
      #ep-t1-quote-ledger .attrib {
        background: var(--tag); color: var(--tag-ink);
        border-radius: var(--radius-tag); box-shadow: var(--shadow-tag);
        padding: 20px 42px;
        font-family: var(--font-mono); font-size: var(--size-label); font-weight: 600;
        text-transform: uppercase; letter-spacing: var(--track-pill); white-space: nowrap;
        transform: rotate(0.6deg);
      }
    </style>
  </head>
  <body>
    <div id="ep-t1-quote-ledger" data-composition-id="ep-t1-quote-ledger" data-start="0" data-width="1080" data-height="1920">
      <div class="ep-cam">
        <div class="ep-paper"></div>
        <div class="stage">
          <div class="drift"><div class="mover quote">
            <span class="q" data-slot="q1">the budget goes</span>
            <span class="q" data-slot="q2">straight into</span>
            <span class="q" data-slot="q3">the next plugin</span>
          </div></div>

          <div class="drift"><div class="mover connwrap">
            <svg class="conn" width="140" height="130" viewBox="0 0 140 130">
              <path class="connpath" d="M 110 0 C 110 65, 30 55, 30 125" />
            </svg>
          </div></div>

          <div class="drift"><div class="mover attribwrap">
            <div class="attrib" data-slot="attrib">— daniel, day 30 of claude code</div>
          </div></div>
        </div>
      </div>
      <div class="ep-lens"></div>
      <div class="ep-vig"></div>
      <div class="ep-grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#ep-t1-quote-ledger";
      const DUR = 7;

      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const rnd = mulberry32(606);

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(root + " .ep-cam", { scale: 1.04 }, { scale: 1.09, duration: DUR, ease: "none" }, 0)
        .to(root + " .ep-cam", { x: 6, y: 4, rotation: -0.2, duration: DUR / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      document.querySelectorAll(root + " .drift").forEach((el) => {
        const half = 1.4 + rnd() * 0.7;
        tl.to(el, {
          x: (rnd() * 2 - 1) * 4, y: 3 + rnd() * 2.5, rotation: (rnd() * 2 - 1) * 0.35,
          duration: half, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / half),
        }, 0);
      });

      const lines = gsap.utils.toArray(root + " .quote .q");
      const connpath = document.querySelector(root + " .connpath");
      const plen = connpath.getTotalLength();

      tl
        /* quote lines build one by one */
        .from(lines, { autoAlpha: 0, y: 16, scale: 0.97, filter: "blur(5px)", duration: 0.42, ease: "power3.out", stagger: 0.22 }, 0.3)

        /* connector draws, tag pops */
        .fromTo(connpath,
          { strokeDashoffset: plen, opacity: 0 },
          { strokeDashoffset: 0, opacity: 1, duration: 0.65, ease: "power2.inOut" }, 1.5)
        .from(root + " .attribwrap", { scale: 0.7, autoAlpha: 0, filter: "blur(8px)", duration: 0.5, ease: "back.out(1.0)" }, 1.8)

        /* breathing hold */
        .set({}, {}, DUR);

      window.__timelines["ep-t1-quote-ledger"] = tl;
    </script>
  </body>
</html>
