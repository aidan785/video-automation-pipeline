<!doctype html>
<!--
  EISENBERG PAPER · tier1 · overview · PROMPT BAR  (vertical 1080x1920)
  The chat input bar from the LinkedIn reel: a dark rounded prompt bar with
  a "+", typing prompt text, dim model name and a white circle send button.
  A coral spinner fan blooms beneath it (thinking), and a small file chip
  (Agents.md) pops below wired to the bar by a dashed connector. Camera
  pushes in.
  Slots: prompt · model · file.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #ep-t1-prompt-bar {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: var(--paper-mid); color: var(--term-text);
        font-family: var(--font-mono); overflow: hidden;
      }
      #ep-t1-prompt-bar .stage { position: absolute; inset: 0; z-index: 3; }

      #ep-t1-prompt-bar .barwrap { position: absolute; left: 80px; top: 760px; }
      #ep-t1-prompt-bar .bar {
        width: 920px; height: 128px;
        background: var(--card); border-radius: 26px;
        border-top: 1px solid var(--card-hi);
        border-left: 1px solid var(--card-hi-l);
        box-shadow: var(--shadow-card);
        display: flex; align-items: center; gap: 24px;
        padding: 0 30px 0 34px; box-sizing: border-box;
        transform: rotate(-0.4deg);
      }
      #ep-t1-prompt-bar .plus { font-size: 40px; color: var(--term-dim); line-height: 1; }
      #ep-t1-prompt-bar .ptext { flex: 1; font-size: 27px; color: var(--tag); white-space: nowrap; overflow: hidden; }
      #ep-t1-prompt-bar .ptext .chars span { display: inline-block; white-space: pre; }
      #ep-t1-prompt-bar .caret { display: inline-block; width: 3px; height: 32px; background: var(--tag); margin-left: 4px; transform: translateY(6px); }
      #ep-t1-prompt-bar .model { font-size: 24px; color: var(--term-dim); white-space: nowrap; }
      #ep-t1-prompt-bar .send {
        width: 62px; height: 62px; border-radius: 50%; flex: none;
        background: var(--tag); color: var(--tag-ink);
        display: flex; align-items: center; justify-content: center;
        font-size: 32px; font-weight: 600;
      }

      /* coral spinner fan blooming under the bar */
      #ep-t1-prompt-bar .fanwrap { position: absolute; left: 470px; top: 960px; width: 0; height: 0; }
      #ep-t1-prompt-bar .fan { position: absolute; left: 0; top: 0; }
      #ep-t1-prompt-bar .ray {
        position: absolute; left: -9px; top: 12px;
        width: 18px; height: 86px; border-radius: 10px;
        background: var(--coral); transform-origin: 50% -12px;
      }

      /* file chip wired up to the bar */
      #ep-t1-prompt-bar .chipwrap { position: absolute; left: 150px; top: 1250px; }
      #ep-t1-prompt-bar .chip {
        display: inline-flex; align-items: center; gap: 14px;
        background: var(--card); border-radius: 12px;
        border-top: 1px solid var(--card-hi);
        box-shadow: var(--shadow-pill);
        padding: 16px 28px;
        font-size: 26px; font-weight: 500; color: var(--tag);
        transform: rotate(-0.7deg); white-space: nowrap;
      }
      #ep-t1-prompt-bar .chip .doc { color: var(--coral); font-weight: 600; }
      #ep-t1-prompt-bar svg.conn { position: absolute; left: 120px; top: -168px; overflow: visible; }
      #ep-t1-prompt-bar svg.conn path { fill: none; stroke: var(--connector); stroke-width: 3; stroke-dasharray: 8 8; }
    </style>
  </head>
  <body>
    <div id="ep-t1-prompt-bar" data-composition-id="ep-t1-prompt-bar" data-start="0" data-width="1080" data-height="1920">
      <div class="ep-cam">
        <div class="ep-paper"></div>
        <div class="stage">
          <div class="drift"><div class="mover barwrap">
            <div class="bar">
              <span class="plus">+</span>
              <span class="ptext"><span class="chars" data-slot="prompt">Write a LinkedIn post</span><span class="caret"></span></span>
              <span class="model" data-slot="model">Sonnet 4.6 ⌄</span>
              <span class="send">↑</span>
            </div>
          </div></div>

          <div class="drift"><div class="mover fanwrap">
            <div class="fan">
              <div class="ray"></div><div class="ray"></div><div class="ray"></div><div class="ray"></div>
              <div class="ray"></div><div class="ray"></div><div class="ray"></div>
            </div>
          </div></div>

          <div class="drift"><div class="mover chipwrap">
            <svg class="conn" width="140" height="170" viewBox="0 0 140 170">
              <path class="connpath" d="M 120 0 C 120 90, 30 80, 30 165" />
            </svg>
            <div class="chip"><span class="doc">▤</span><span data-slot="file">Agents.md</span></div>
          </div></div>
        </div>
      </div>
      <div class="ep-lens"></div>
      <div class="ep-vig"></div>
      <div class="ep-grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#ep-t1-prompt-bar";
      const DUR = 7;

      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const rnd = mulberry32(414);

      /* typewriter split */
      const chEl = document.querySelector(root + " .chars");
      const txt = chEl.textContent; chEl.textContent = "";
      txt.split("").forEach((c) => { const s = document.createElement("span"); s.textContent = c; chEl.appendChild(s); });
      const chars = chEl.querySelectorAll("span");
      gsap.set(chars, { autoAlpha: 0 });

      /* fan rays spread from -54° to +54° */
      const rays = gsap.utils.toArray(root + " .ray");
      rays.forEach((r, i) => gsap.set(r, { rotation: -54 + i * 18, autoAlpha: 0 }));

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(root + " .ep-cam", { scale: 1.04 }, { scale: 1.09, duration: DUR, ease: "none" }, 0)
        .to(root + " .ep-cam", { x: -5, y: 5, rotation: 0.22, duration: DUR / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      document.querySelectorAll(root + " .drift").forEach((el) => {
        const half = 1.4 + rnd() * 0.7;
        tl.to(el, {
          x: (rnd() * 2 - 1) * 4, y: 3 + rnd() * 2.5, rotation: (rnd() * 2 - 1) * 0.35,
          duration: half, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / half),
        }, 0);
      });

      const connpath = document.querySelector(root + " .connpath");
      const plen = connpath.getTotalLength();

      tl
        /* bar slides up */
        .fromTo(root + " .barwrap",
          { y: 780, x: -22, autoAlpha: 0, filter: "blur(10px)" },
          { y: 0, x: 0, autoAlpha: 1, filter: "blur(0px)", duration: 0.9, ease: "back.out(0.9)" }, 0.15)

        /* prompt types on; caret blinks finite */
        .to(chars, { autoAlpha: 1, duration: 0.01, ease: "none", stagger: 0.025 }, 1.0)
        .to(root + " .caret", { autoAlpha: 0, duration: 0.2, repeat: 5, yoyo: true, ease: "none" }, ">0.1")

        /* send button pulses once, fan blooms + sweeps (thinking) */
        .to(root + " .send", { scale: 1.15, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.inOut" }, 2.3)
        .to(rays, { autoAlpha: 1, duration: 0.16, stagger: 0.06, ease: "power2.out" }, 2.55)
        .to(rays, { rotation: "+=14", duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 2 }, 2.9)

        /* file chip pops, connector draws up to the bar */
        .from(root + " .chipwrap", { scale: 0.6, autoAlpha: 0, filter: "blur(8px)", duration: 0.55, ease: "back.out(1.0)" }, 3.1)
        .fromTo(connpath,
          { strokeDashoffset: plen, opacity: 0 },
          { strokeDashoffset: 0, opacity: 1, duration: 0.65, ease: "power2.inOut" }, 3.4)

        /* breathing hold */
        .set({}, {}, DUR);

      window.__timelines["ep-t1-prompt-bar"] = tl;
    </script>
  </body>
</html>
