<!doctype html>
<!--
  EISENBERG PAPER · tier2 · caption · SERIF  (vertical 1080x1920)
  The kinetic serif caption over talking-head footage (the "feeding context"
  beat): 2-3 stacked serif words, roman + italic mixed, second word in sage,
  with a soft dark halo for legibility over video. Words build one by one,
  drift, then ghost out. Transparent overlay — sits in the upper third,
  clear of face and captions.
  Slots: w1 · w2 · w3.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #ep-t2-caption-serif {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: transparent; font-family: var(--font-display); overflow: hidden;
      }
      #ep-t2-caption-serif .cap { position: absolute; left: 120px; top: 260px; line-height: 1.02; transform: rotate(-0.5deg); }
      #ep-t2-caption-serif .cap .w {
        display: block; font-size: 88px; color: #F3F0EA; white-space: nowrap;
        text-shadow: 0 2px 4px rgba(10, 8, 6, 0.55), 0 8px 30px rgba(10, 8, 6, 0.45);
      }
      #ep-t2-caption-serif .cap .w:nth-child(2) { margin-left: 54px; font-style: italic; color: var(--sage); }
      #ep-t2-caption-serif .cap .w:nth-child(3) { margin-left: 20px; }
    </style>
  </head>
  <body>
    <div id="ep-t2-caption-serif" data-composition-id="ep-t2-caption-serif" data-start="0" data-width="1080" data-height="1920">
      <div class="drift"><div class="mover cap">
        <span class="w" data-slot="w1">feeding</span>
        <span class="w" data-slot="w2">context</span>
        <span class="w" data-slot="w3">changes everything</span>
      </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#ep-t2-caption-serif";
      const DUR = 5;

      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const rnd = mulberry32(717);

      const tl = gsap.timeline({ paused: true });

      document.querySelectorAll(root + " .drift").forEach((el) => {
        const half = 1.4 + rnd() * 0.7;
        tl.to(el, {
          x: (rnd() * 2 - 1) * 4, y: 3 + rnd() * 2.5, rotation: (rnd() * 2 - 1) * 0.35,
          duration: half, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / half),
        }, 0);
      });

      const words = gsap.utils.toArray(root + " .cap .w");

      tl
        /* words build one by one, synced to VO */
        .from(words, { autoAlpha: 0, y: 16, scale: 0.96, filter: "blur(5px)", duration: 0.38, ease: "power3.out", stagger: 0.16 }, 0.2)

        /* ghost out */
        .to(root + " .cap", { autoAlpha: 0, filter: "blur(7px)", y: -22, duration: 0.55, ease: "power2.in" }, DUR - 0.55)
        .set({}, {}, DUR);

      window.__timelines["ep-t2-caption-serif"] = tl;
    </script>
  </body>
</html>
