<!doctype html>
<!--
  EISENBERG PAPER · tier2 · list · STEPS  (vertical 1080x1920)
  Transparent overlay: the numbered fix-list from the reels. Four bold-mono
  pills stack down the left, each with a numbered chip; first row
  sage-filled. Rows stagger in with slide+blur, drift, ghost out together.
  Slots: item1 item2 item3 item4.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #ep-t2-list-steps {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: transparent; font-family: var(--font-mono); overflow: hidden;
      }
      #ep-t2-list-steps .row {
        position: absolute; display: flex; align-items: center; gap: 22px;
        background: var(--card); border-radius: var(--radius-pill);
        border-top: 1px solid var(--card-hi);
        border-left: 1px solid var(--card-hi-l);
        box-shadow: var(--shadow-pill);
        padding: 16px 32px 16px 18px;
        font-size: 28px; font-weight: 600; color: var(--tag);
        letter-spacing: var(--track-pill); text-transform: uppercase; white-space: nowrap;
      }
      #ep-t2-list-steps .row .num {
        font-size: 23px; font-weight: 600; color: var(--tag);
        background: rgba(255, 255, 255, 0.10);
        border-radius: 9px; padding: 8px 13px;
      }
      #ep-t2-list-steps .row.hl { background: var(--sage); color: var(--tag-ink); }
      #ep-t2-list-steps .row.hl .num { background: rgba(27, 26, 25, 0.14); color: var(--tag-ink); }
      #ep-t2-list-steps .r1 { left: 70px; top: 1080px; transform: rotate(-0.6deg); }
      #ep-t2-list-steps .r2 { left: 92px; top: 1198px; transform: rotate(0.4deg); }
      #ep-t2-list-steps .r3 { left: 64px; top: 1316px; transform: rotate(0.5deg); }
      #ep-t2-list-steps .r4 { left: 98px; top: 1434px; transform: rotate(-0.4deg); }
    </style>
  </head>
  <body>
    <div id="ep-t2-list-steps" data-composition-id="ep-t2-list-steps" data-start="0" data-width="1080" data-height="1920">
      <div class="drift"><div class="mover row hl r1"><span class="num">01</span><span data-slot="item1">loading entire codebase</span></div></div>
      <div class="drift"><div class="mover row r2"><span class="num">02</span><span data-slot="item2">resending same context</span></div></div>
      <div class="drift"><div class="mover row r3"><span class="num">03</span><span data-slot="item3">include full chat history</span></div></div>
      <div class="drift"><div class="mover row r4"><span class="num">04</span><span data-slot="item4">excessive documentation</span></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#ep-t2-list-steps";
      const DUR = 6;

      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const rnd = mulberry32(909);

      const tl = gsap.timeline({ paused: true });

      document.querySelectorAll(root + " .drift").forEach((el) => {
        const half = 1.4 + rnd() * 0.7;
        tl.to(el, {
          x: (rnd() * 2 - 1) * 4, y: 3 + rnd() * 2.5, rotation: (rnd() * 2 - 1) * 0.35,
          duration: half, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / half),
        }, 0);
      });

      tl
        .fromTo(root + " .row",
          { x: -110, autoAlpha: 0, filter: "blur(12px)" },
          { x: 0, autoAlpha: 1, filter: "blur(0px)", duration: 0.6, ease: "back.out(1.0)", stagger: 0.15 }, 0.2)

        /* ghost out */
        .to(root + " .row", { autoAlpha: 0, filter: "blur(7px)", x: -36, duration: 0.5, ease: "power2.in", stagger: 0.08 }, DUR - 0.7)
        .set({}, {}, DUR);

      window.__timelines["ep-t2-list-steps"] = tl;
    </script>
  </body>
</html>
