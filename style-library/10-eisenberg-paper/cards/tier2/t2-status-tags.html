<!doctype html>
<!--
  EISENBERG PAPER · tier2 · label · STATUS TAGS  (vertical 1080x1920)
  Transparent overlay: three bracket status tags ([CAVEMAN ACTIVE] style)
  on slim charcoal pills stack in top-left, in white / mint / coral. For
  "now installed/active" beats over footage. Stagger in, drift, ghost out.
  Slots: tag1 · tag2 · tag3.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #ep-t2-status-tags {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: transparent; font-family: var(--font-mono); overflow: hidden;
      }
      #ep-t2-status-tags .stag {
        position: absolute;
        background: var(--card); border-radius: 12px;
        border-top: 1px solid var(--card-hi);
        box-shadow: var(--shadow-pill);
        padding: 16px 28px;
        font-size: 29px; font-weight: 500; letter-spacing: 0.06em; white-space: nowrap;
      }
      #ep-t2-status-tags .g1 { left: 80px;  top: 300px; color: var(--tag);   transform: rotate(-0.6deg); }
      #ep-t2-status-tags .g2 { left: 104px; top: 402px; color: var(--mint);  transform: rotate(0.4deg); }
      #ep-t2-status-tags .g3 { left: 76px;  top: 504px; color: var(--coral); transform: rotate(0.5deg); }
    </style>
  </head>
  <body>
    <div id="ep-t2-status-tags" data-composition-id="ep-t2-status-tags" data-start="0" data-width="1080" data-height="1920">
      <div class="drift"><div class="mover stag g1" data-slot="tag1">[CAVEMAN ACTIVE]</div></div>
      <div class="drift"><div class="mover stag g2" data-slot="tag2">[MORPH ACTIVE]</div></div>
      <div class="drift"><div class="mover stag g3" data-slot="tag3">[CODEBURN ACTIVE]</div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#ep-t2-status-tags";
      const DUR = 5;

      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const rnd = mulberry32(919);

      const tl = gsap.timeline({ paused: true });

      document.querySelectorAll(root + " .drift").forEach((el) => {
        const half = 1.4 + rnd() * 0.7;
        tl.to(el, {
          x: (rnd() * 2 - 1) * 4, y: 3 + rnd() * 2.5, rotation: (rnd() * 2 - 1) * 0.35,
          duration: half, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / half),
        }, 0);
      });

      tl
        /* tags stagger in like terminal prints */
        .fromTo(root + " .stag",
          { x: -70, autoAlpha: 0, filter: "blur(10px)" },
          { x: 0, autoAlpha: 1, filter: "blur(0px)", duration: 0.55, ease: "back.out(1.0)", stagger: 0.15 }, 0.2)

        /* ghost out */
        .to(root + " .stag", { autoAlpha: 0, filter: "blur(7px)", x: -26, duration: 0.5, ease: "power2.in", stagger: 0.08 }, DUR - 0.65)
        .set({}, {}, DUR);

      window.__timelines["ep-t2-status-tags"] = tl;
    </script>
  </body>
</html>
