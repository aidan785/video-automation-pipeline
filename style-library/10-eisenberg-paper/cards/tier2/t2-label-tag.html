<!doctype html>
<!--
  EISENBERG PAPER · tier2 · label · TAG  (vertical 1080x1920)
  Transparent overlay: a single white paper tag pops in upper area with a
  dashed connector stub pointing down toward the speaker. Drifts, holds,
  ghosts out.
  Slots: label.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #ep-t2-label-tag {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: transparent; font-family: var(--font-mono); overflow: hidden;
      }
      #ep-t2-label-tag .tagwrap { position: absolute; left: 470px; top: 250px; }
      #ep-t2-label-tag .tag {
        background: var(--tag); color: var(--tag-ink);
        border-radius: var(--radius-tag); box-shadow: var(--shadow-tag);
        padding: 22px 44px;
        font-size: var(--size-pill); font-weight: 600;
        letter-spacing: var(--track-pill); white-space: nowrap;
        transform: rotate(0.7deg);
      }
      #ep-t2-label-tag svg.conn { position: absolute; left: 70px; top: 86px; overflow: visible; }
      #ep-t2-label-tag svg.conn path { fill: none; stroke: var(--connector); stroke-width: 3; stroke-dasharray: 9 9; }
    </style>
  </head>
  <body>
    <div id="ep-t2-label-tag" data-composition-id="ep-t2-label-tag" data-start="0" data-width="1080" data-height="1920">
      <div class="drift"><div class="mover tagwrap">
        <div class="tag" data-slot="label">$2,342 burned</div>
        <svg class="conn" width="90" height="170" viewBox="0 0 90 170">
          <path class="connpath" d="M 70 0 C 70 85, 12 85, 12 165" />
        </svg>
      </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#ep-t2-label-tag";
      const DUR = 5;

      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const rnd = mulberry32(808);

      const tl = gsap.timeline({ paused: true });

      document.querySelectorAll(root + " .drift").forEach((el) => {
        const half = 1.4 + rnd() * 0.7;
        tl.to(el, {
          x: (rnd() * 2 - 1) * 4, y: 3 + rnd() * 2.5, rotation: (rnd() * 2 - 1) * 0.35,
          duration: half, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / half),
        }, 0);
      });

      const connpath = document.querySelector(root + " .connpath");
      const plen = connpath.getTotalLength();

      tl
        .from(root + " .tagwrap", { scale: 0.6, autoAlpha: 0, filter: "blur(10px)", duration: 0.55, ease: "back.out(1.0)" }, 0.15)
        .fromTo(connpath,
          { strokeDashoffset: plen, opacity: 0 },
          { strokeDashoffset: 0, opacity: 1, duration: 0.65, ease: "power2.inOut" }, 0.45)

        /* ghost out */
        .to(root + " .tagwrap", { autoAlpha: 0, filter: "blur(7px)", y: -20, duration: 0.55, ease: "power2.in" }, DUR - 0.5)
        .set({}, {}, DUR);

      window.__timelines["ep-t2-label-tag"] = tl;
    </script>
  </body>
</html>
