<!doctype html>
<!--
  Humanly Possible · transition · pill · MORPH (opaque full frame, 3.6 s)
  One element, two states. A brick topic pill (14 px radius, cream Bricolage 800 label, small
  orange tab) reveals by width over 0.15 s bottom-center over the host cam, away from the face.
  On the next beat the same element grows (clip-path on the pill wrapper, hpPop, 0.5 s) into a
  full-bleed brick field around the B-roll; the B-roll window grows with it (10 px radius,
  56 px brick margin) and the footage fades in at 40% of the morph. The tab rides the pill's corner the
  whole way and stays as the frame's one orange.
  From references/analysis/ali-abdaal.md (signature move 1 + Fit), DESIGN.md motion rule 5.
  Exit: none; hold on the framed B-roll and cut away (or into the next layout).
  Slots: host-cam (media, full frame), label (text, ~22 chars), broll (media, full frame; shown
         through the 1808x968 window). data-at on the label = when the morph starts (default 1.5).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:var(--hp-deep);}
      #hp-tr-pill-morph{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:var(--hp-deep);color:var(--fg);font-family:var(--font-body);}

      #hp-tr-pill-morph .host{position:absolute;inset:0;overflow:hidden;}
      #hp-tr-pill-morph .host img,#hp-tr-pill-morph .host video{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;display:block;}

      /* the one element: a full-frame brick layer shown through a clip window */
      #hp-tr-pill-morph .pill{position:absolute;inset:0;background:var(--hp-brick);}
      #hp-tr-pill-morph .label{position:absolute;left:680px;top:900px;width:560px;height:100px;display:flex;align-items:center;justify-content:center;
        font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;font-size:44px;line-height:1;letter-spacing:var(--track-display);
        color:var(--hp-cream);white-space:nowrap;}
      #hp-tr-pill-morph .broll{position:absolute;inset:0;}
      #hp-tr-pill-morph .broll .drift{position:absolute;inset:0;transform-origin:50% 50%;}
      #hp-tr-pill-morph .broll img,#hp-tr-pill-morph .broll video{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;display:block;}

      #hp-tr-pill-morph .tab{position:absolute;left:708px;top:892px;width:52px;height:8px;background:var(--hp-orange);transform-origin:0 100%;}
    </style>
  </head>
  <body>
    <div id="hp-tr-pill-morph" data-composition-id="hp-tr-pill-morph" data-start="0" data-width="1920" data-height="1080">
      <div class="host"><img data-slot="host-cam" src="../../assets/demo/cam-host.jpg" alt="" /></div>

      <div class="pill">
        <div class="broll"><div class="drift"><img data-slot="broll" src="../../assets/demo/hands.jpg" alt="" /></div></div>
        <div class="label" data-slot="label" data-at="1.5">How he grades now</div>
      </div>
      <i class="tab"></i>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-tr-pill-morph";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const DUR = 3.6;
      const tl = gsap.timeline({ paused: true });
      const pill = $1(".pill"), label = $1(".label"), broll = $1(".broll"), tab = $1(".tab");
      const M = parseFloat(label.dataset.at); const MORPH = isFinite(M) && M > .5 ? M : 1.5;

      // states (all clip-path insets: top right bottom left). Always fromTo with explicit strings:
      // the browser collapses symmetric insets when read back, which mis-pairs the numbers in a to().
      const SLIVER = "inset(900px 958px 80px 958px round 14px)";
      const PILL   = "inset(900px 680px 80px 680px round 14px)";
      const CARD   = "inset(0px 0px 0px 0px round 0px)";        // full-bleed brick margin
      const WIN0   = "inset(912px 692px 92px 692px round 10px)";   // pill inset by 12
      const WIN1   = "inset(56px 56px 56px 56px round 10px)";      // 56 px brick margin

      tl.set(pill, { clipPath: SLIVER, autoAlpha: 0 }, 0);
      tl.set(broll, { clipPath: WIN0, autoAlpha: 0 }, 0);
      tl.set(tab, { autoAlpha: 0, x: 0, y: 0 }, 0);

      // 1. pill reveals by width (label is clipped by the same window)
      tl.set(pill, { autoAlpha: 1 }, .2);
      tl.fromTo(pill, { clipPath: SLIVER }, { clipPath: PILL, duration: .15, ease: POP, immediateRender: false }, .2);
      tl.fromTo(tab, { autoAlpha: 1, scaleY: 0 }, { scaleY: 1, duration: .14, ease: POP, immediateRender: false }, .33);

      // 2. the same element grows into the card; the window and the tab move with it
      tl.fromTo(pill, { clipPath: PILL }, { clipPath: CARD, duration: .5, ease: POP, immediateRender: false }, MORPH);
      tl.fromTo(broll, { clipPath: WIN0 }, { clipPath: WIN1, duration: .5, ease: POP, immediateRender: false }, MORPH);
      tl.to(tab, { x: -624, y: -844, duration: .5, ease: POP }, MORPH);   // rides from the pill top edge to the window top edge
      tl.to(label, { autoAlpha: 0, duration: .12, ease: "power1.in" }, MORPH);
      tl.to(broll, { autoAlpha: 1, duration: .2, ease: "power1.out" }, MORPH + .2);   // 40% of the morph

      // 3. the world drifts inside the window; the frame holds still
      tl.fromTo(broll.querySelector(".drift"), { scale: 1 }, { scale: 1.04, duration: DUR - MORPH, ease: "none" }, MORPH);
      tl.set({}, {}, DUR);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
    </script>
  </body>
</html>
