<!doctype html>
<!--
  Humanly Possible · layout · framed · FIELD (opaque full frame)
  Two remote webcams made into one set: each sits in a 14 px keylined frame (1 px cream keyline,
  3 px oxblood inset, then the picture) on flat grained oxblood, names under the frames in
  Bricolage 800 with roles in Inter Tight. Frames pop in staggered, names per line after.
  The active speaker gets the frame's one orange: a 3 px underline bar under the frame, drawn
  left to right. It moves at each data-swap-at time. Both cams are cropped so the eyes share
  one line (y 170 inside the frame).
  From the Oct 15 research "Framed on the field" (Pat McAfee, Valuetainment, Peter Attia, Ramsey).
  Exit: none, cut away. Cut in at ~1.0 s to skip the build.
  Slots: guest-cam, host-cam (media; crop via --s/--x/--y, inner box 792x512),
         guest-name, guest-role, host-name, host-role (text).
  Root attrs: data-active="guest|host", data-swap-at="4.5,...".
  Local token: --hp-keyline (cream at 22%), the brand hairline (8%) disappears on oxblood at video size.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:var(--hp-oxblood);}
      #hp-lay-framed-field{--hp-keyline:rgba(255,240,230,.22);position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:var(--hp-oxblood);color:var(--fg);font-family:var(--font-body);}

      #hp-lay-framed-field .seat{position:absolute;top:206px;width:800px;}
      #hp-lay-framed-field .seat.g{left:var(--margin);}
      #hp-lay-framed-field .seat.h{right:var(--margin);}

      #hp-lay-framed-field .frame{position:relative;width:800px;height:520px;border:1px solid var(--hp-keyline);border-radius:var(--radius-lg);padding:3px;background:var(--hp-oxblood);}
      #hp-lay-framed-field .cam{position:relative;width:792px;height:512px;overflow:hidden;border-radius:var(--radius);background:var(--hp-deep);}
      #hp-lay-framed-field .cam img,#hp-lay-framed-field .cam video{position:absolute;left:var(--x);top:var(--y);width:calc(1280px * var(--s));height:auto;max-width:none;display:block;}

      #hp-lay-framed-field .under{display:block;margin-top:16px;width:800px;height:3px;background:var(--hp-orange);transform-origin:0 50%;}
      #hp-lay-framed-field .name{display:block;margin-top:26px;font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;
        font-size:56px;line-height:1;letter-spacing:var(--track-display);color:var(--hp-cream);white-space:nowrap;}
      #hp-lay-framed-field .role{display:block;margin-top:12px;font-family:var(--font-body);font-weight:500;font-size:26px;line-height:1.2;color:var(--hp-cream-muted);white-space:nowrap;}

      #hp-lay-framed-field .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;}
    </style>
  </head>
  <body>
    <div id="hp-lay-framed-field" data-composition-id="hp-lay-framed-field" data-start="0" data-width="1920" data-height="1080" data-active="guest" data-swap-at="4.5">
      <div class="seat g">
        <div class="frame"><div class="cam"><img data-slot="guest-cam" src="../../assets/demo/cam-guest.jpg" alt="" style="--s:.84;--x:-125px;--y:-87px" /></div></div>
        <i class="under"></i>
        <span class="name" data-slot="guest-name">Dale Brooks</span>
        <span class="role" data-slot="guest-role">Shop teacher, grades 40 projects a week</span>
      </div>
      <div class="seat h">
        <div class="frame"><div class="cam"><img data-slot="host-cam" src="../../assets/demo/cam-host.jpg" alt="" style="--s:1.14;--x:-379px;--y:0px" /></div></div>
        <i class="under"></i>
        <span class="name" data-slot="host-name">Jillian Wolf</span>
        <span class="role" data-slot="host-role">Host</span>
      </div>

      <svg class="grain" width="1920" height="1080" aria-hidden="true">
        <filter id="hp-lay-framed-field-gr" x="0" y="0" width="100%" height="100%">
          <feTurbulence class="turb" type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="1" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="saturate" values="0"/>
          <feComponentTransfer><feFuncR type="linear" slope="1.4" intercept="-.2"/><feFuncG type="linear" slope="1.4" intercept="-.2"/><feFuncB type="linear" slope="1.4" intercept="-.2"/></feComponentTransfer>
        </filter>
        <rect width="1920" height="1080" filter="url(#hp-lay-framed-field-gr)"/>
      </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-lay-framed-field";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      const $ = (s) => ROOT.querySelectorAll(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const DUR = 8;
      const tl = gsap.timeline({ paused: true });

      const bars = { guest: $1(".seat.g .under"), host: $1(".seat.h .under") };
      let active = ROOT.dataset.active === "host" ? "host" : "guest";
      tl.set(bars[active === "guest" ? "host" : "guest"], { scaleX: 0 }, 0);

      // 1. frames pop, staggered
      tl.fromTo($(".frame"), { autoAlpha: 0, scale: .94, y: 12 }, { autoAlpha: 1, scale: 1, y: 0, duration: .42, ease: POP, stagger: .12 }, .08);
      // 2. names then roles, per line, each seat a beat apart
      tl.fromTo($(".name"), { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: .3, ease: POP, stagger: .12 }, .44);
      tl.fromTo($(".role"), { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: .3, ease: POP, stagger: .12 }, .52);
      // 3. the one orange: underline the active speaker
      tl.fromTo(bars[active], { scaleX: 0 }, { scaleX: 1, duration: .32, ease: POP }, .74);

      // 4. speaker swaps: bar retracts to the right, grows under the other frame
      (ROOT.dataset.swapAt || "").split(",").map(parseFloat).filter((t) => t > 1.2 && t < DUR).sort((a, b) => a - b).forEach((t) => {
        const next = active === "guest" ? "host" : "guest";
        tl.to(bars[active], { scaleX: 0, transformOrigin: "100% 50%", duration: .16, ease: "power2.in" }, t);
        tl.fromTo(bars[next], { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: .3, ease: POP, immediateRender: false }, t + .12);
        active = next;
      });
      tl.set({}, {}, DUR);

      const turb = $1(".turb");
      tl.eventCallback("onUpdate", () => turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97));

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) { tl.seek(parseFloat(location.hash.slice(3)) || 0); turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97); }
    </script>
  </body>
</html>
