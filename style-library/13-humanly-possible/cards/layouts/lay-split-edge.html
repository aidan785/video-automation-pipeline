<!doctype html>
<!--
  Humanly Possible · layout · split · EDGE (opaque full frame)
  Edge-to-edge 50/50 remote split: two webcams fill the frame, cover-cropped so both pairs of
  eyes sit on the same line (y 340). A 4 px cream seam grows from the center, then both cams
  open outward from the seam (born from a line). Small cream corner mark (70%) top-left. Name
  chips bottom-left of each half; the active speaker's chip carries the frame's one orange dot,
  the other chip a cream ring. The dot moves at each data-swap-at time (light, not layout).
  From the Oct 15 research "Edge to edge" (Impact Theory, Rest Is Politics, Think Media).
  Exit: none, cut away. Cut in at ~0.9 s to skip the build.
  Slots: guest-cam, host-cam (media; crop via --s/--x/--y on the element so eyes land at y 340),
         guest-name, guest-role, host-name, host-role (text).
  Root attrs: data-active="guest|host" (who speaks first), data-swap-at="4.5,..." (seconds the dot moves).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:var(--hp-deep);}
      #hp-lay-split-edge{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:var(--hp-deep);color:var(--fg);font-family:var(--font-body);}

      #hp-lay-split-edge .half{position:absolute;top:0;width:960px;height:1080px;overflow:hidden;}
      #hp-lay-split-edge .half.g{left:0;}
      #hp-lay-split-edge .half.h{left:960px;}
      #hp-lay-split-edge .cam{position:absolute;inset:0;overflow:hidden;background:var(--hp-deep);}
      #hp-lay-split-edge .cam img,#hp-lay-split-edge .cam video{position:absolute;left:var(--x);top:var(--y);width:calc(1280px * var(--s));height:auto;max-width:none;display:block;}

      #hp-lay-split-edge .seam{position:absolute;left:958px;top:0;width:4px;height:1080px;background:var(--hp-cream);transform-origin:50% 50%;}

      #hp-lay-split-edge .bug{position:absolute;left:var(--margin);top:var(--margin-y);width:46px;opacity:.7;}
      #hp-lay-split-edge .bug svg{width:46px;height:auto;display:block;}

      #hp-lay-split-edge .tag{position:absolute;bottom:72px;display:flex;align-items:center;gap:14px;padding:12px 20px 12px 16px;border-radius:var(--radius-sm);
        background:var(--hp-deep);white-space:nowrap;font-family:var(--font-body);font-size:26px;line-height:1;}
      #hp-lay-split-edge .tag.g{left:var(--margin);}
      #hp-lay-split-edge .tag.h{left:calc(960px + var(--margin));}
      #hp-lay-split-edge .tag .dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid rgba(255,240,230,.45);background:transparent;}
      #hp-lay-split-edge .tag .nm{font-weight:600;color:var(--hp-cream);letter-spacing:-.005em;}
      #hp-lay-split-edge .tag .rl{font-weight:500;color:var(--hp-cream-muted);}

      #hp-lay-split-edge .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.28;}
    </style>
  </head>
  <body>
    <div id="hp-lay-split-edge" data-composition-id="hp-lay-split-edge" data-start="0" data-width="1920" data-height="1080" data-active="guest" data-swap-at="4.5">
      <div class="half g"><div class="cam"><img data-slot="guest-cam" src="../../assets/demo/cam-guest.jpg" alt="" style="--s:1.65;--x:-576px;--y:-108px" /></div></div>
      <div class="half h"><div class="cam"><img data-slot="host-cam" src="../../assets/demo/cam-host.jpg" alt="" style="--s:1.65;--x:-660px;--y:-82px" /></div></div>

      <div class="seam"></div>

      <div class="bug">
        <svg viewBox="231 201 426 486" aria-hidden="true"><g fill="#FFF0E6"><path fill-rule="evenodd" d="M231,215 A14,14 0 0 1 245,201 L643,201 A14,14 0 0 1 657,215 L657,613 A14,14 0 0 1 643,627 L481,627 A14,14 0 0 0 467,641 L467,673 A14,14 0 0 1 453,687 L245,687 A14,14 0 0 1 231,673 Z M275,259 A14,14 0 0 1 289,245 L599,245 A14,14 0 0 1 613,259 L613,569 A14,14 0 0 1 599,583 L437,583 A14,14 0 0 0 423,597 L423,629 A14,14 0 0 1 409,643 L289,643 A14,14 0 0 1 275,629 Z"/><path d="M303,287 A14,14 0 0 1 317,273 L381,273 A14,14 0 0 1 395,287 L395,359 A14,14 0 0 0 409,373 L479,373 A14,14 0 0 0 493,359 L493,287 A14,14 0 0 1 507,273 L571,273 A14,14 0 0 1 585,287 L585,541 A14,14 0 0 1 571,555 L507,555 A14,14 0 0 1 493,541 L493,466 A14,14 0 0 0 479,452 L409,452 A14,14 0 0 0 395,466 L395,601 A14,14 0 0 1 381,615 L317,615 A14,14 0 0 1 303,601 Z"/></g></svg>
      </div>

      <div class="tag g"><i class="dot"></i><span class="nm" data-slot="guest-name">Dale Brooks</span><span class="rl" data-slot="guest-role">Shop teacher</span></div>
      <div class="tag h"><i class="dot"></i><span class="nm" data-slot="host-name">Jillian Wolf</span><span class="rl" data-slot="host-role">Host</span></div>

      <svg class="grain" width="1920" height="1080" aria-hidden="true">
        <filter id="hp-lay-split-edge-gr" x="0" y="0" width="100%" height="100%">
          <feTurbulence class="turb" type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="1" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="saturate" values="0"/>
          <feComponentTransfer><feFuncR type="linear" slope="1.4" intercept="-.2"/><feFuncG type="linear" slope="1.4" intercept="-.2"/><feFuncB type="linear" slope="1.4" intercept="-.2"/></feComponentTransfer>
        </filter>
        <rect width="1920" height="1080" filter="url(#hp-lay-split-edge-gr)"/>
      </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-lay-split-edge";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      const $ = (s) => ROOT.querySelectorAll(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const DUR = 8;
      const tl = gsap.timeline({ paused: true });

      const ON = { backgroundColor: "#FF8A4C", borderColor: "#FF8A4C" };
      const OFF = { backgroundColor: "rgba(255,240,230,0)", borderColor: "rgba(255,240,230,.45)" };
      const dots = { guest: $1(".tag.g .dot"), host: $1(".tag.h .dot") };
      let active = ROOT.dataset.active === "host" ? "host" : "guest";
      tl.set(dots[active], ON, 0);
      tl.set(dots[active === "guest" ? "host" : "guest"], OFF, 0);

      // 1. the seam is born from the center point
      tl.fromTo($1(".seam"), { scaleY: 0 }, { scaleY: 1, duration: .38, ease: POP }, .06);
      // 2. both cams open outward from the seam
      tl.fromTo($1(".half.g .cam"), { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: .45, ease: POP }, .34);
      tl.fromTo($1(".half.h .cam"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: .45, ease: POP }, .34);
      // 3. bug + name chips
      tl.fromTo($1(".bug"), { autoAlpha: 0, scale: .92 }, { autoAlpha: .7, scale: 1, duration: .3, ease: POP }, .72);
      tl.fromTo($(".tag"), { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: .3, ease: POP, stagger: .06 }, .78);

      // 4. speaker swaps: the orange dot moves, nothing else does
      (ROOT.dataset.swapAt || "").split(",").map(parseFloat).filter((t) => t > 0 && t < DUR).sort((a, b) => a - b).forEach((t) => {
        const next = active === "guest" ? "host" : "guest";
        tl.to(dots[active], { ...OFF, duration: .1, ease: "power1.in" }, t);
        tl.to(dots[next], { ...ON, duration: .14, ease: POP }, t + .08);
        active = next;
      });
      tl.set({}, {}, DUR);

      const turb = $1(".turb");
      tl.eventCallback("onUpdate", () => turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97));

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) { tl.seek(parseFloat(location.hash.slice(3)) || 0); turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97); }
    </script>
  </body>
</html>
