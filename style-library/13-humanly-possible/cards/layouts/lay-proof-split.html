<!doctype html>
<!--
  Humanly Possible · layout · proof · SPLIT (opaque full frame)
  One third / two thirds, built around the result. The guest cam stands full height in the left
  third (10 px frame inside the margins); the right two thirds is a brick result panel: a running
  label, a big gold number that ticks up on each data-at (old value rolls up and out, new one rolls
  in, nothing else moves), a caption, and a strip of the guest's own spreadsheet rebuilt in HTML
  (4 rows). The row that matters lifts to deep with the frame's one orange bar when the last
  tick lands. Grained oxblood ground.
  From the Oct 15 research "Proof forward" (Caleb Hammer one third / two thirds, Ramsey, Hormozi).
  Exit: none, cut away. Cut in at ~1.0 s to skip the build.
  Slots: guest-cam (media, 528x968, crop via --s/--x/--y), label (text), value (number list:
         data-steps="58,130,212" + data-at="1.4,3.2,5.0", last step = the hero), caption (text),
         sheet (list: header + 4 rows; the row with class "hot" is the one that matters).
  Brand note: the brief asked for a gold row highlight, but the number already owns the frame's
  one gold, so the row lifts to deep with the orange bar instead.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:var(--hp-oxblood);}
      #hp-lay-proof-split{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:var(--hp-oxblood);color:var(--fg);font-family:var(--font-body);}

      #hp-lay-proof-split .cam{position:absolute;left:56px;top:56px;width:528px;height:968px;overflow:hidden;border-radius:var(--radius);background:var(--hp-deep);}
      #hp-lay-proof-split .cam img,#hp-lay-proof-split .cam video{position:absolute;left:var(--x);top:var(--y);width:calc(1280px * var(--s));height:auto;max-width:none;display:block;}

      #hp-lay-proof-split .panel{position:absolute;left:640px;top:56px;width:1224px;height:968px;border-radius:var(--radius-lg);background:var(--hp-brick);overflow:hidden;}
      #hp-lay-proof-split .label{position:absolute;left:80px;top:84px;font-family:var(--font-body);font-weight:600;font-size:24px;letter-spacing:.16em;text-transform:uppercase;color:var(--hp-cream-muted);white-space:nowrap;}
      #hp-lay-proof-split .num{position:absolute;left:72px;top:134px;width:1000px;height:290px;overflow:hidden;}
      #hp-lay-proof-split .num b{position:absolute;left:0;top:0;font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;font-size:300px;line-height:290px;
        letter-spacing:var(--track-tight);color:var(--hp-gold);white-space:nowrap;}
      #hp-lay-proof-split .caption{position:absolute;left:80px;top:446px;font-family:var(--font-body);font-weight:500;font-size:34px;line-height:1.2;color:var(--hp-cream);white-space:nowrap;}

      #hp-lay-proof-split .sheet{position:absolute;left:80px;right:80px;top:560px;border-radius:var(--radius);background:var(--hp-cream);color:var(--hp-deep);overflow:hidden;
        font-family:var(--font-body);font-variant-numeric:tabular-nums;}
      #hp-lay-proof-split .row{position:relative;display:grid;grid-template-columns:1.1fr 1.3fr 1.3fr 1.2fr;align-items:center;height:64px;padding:0 32px 0 38px;
        font-size:27px;font-weight:500;border-top:1px solid rgba(44,11,22,.1);}
      #hp-lay-proof-split .row.head{height:56px;border-top:none;font-size:17px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(44,11,22,.55);}
      #hp-lay-proof-split .row span:not(:first-of-type){text-align:right;}
      #hp-lay-proof-split .row .lift{position:absolute;inset:0;background:var(--hp-deep);transform-origin:0 50%;}
      #hp-lay-proof-split .row .bar{position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--hp-orange);transform-origin:50% 50%;}
      #hp-lay-proof-split .row span{position:relative;}
      #hp-lay-proof-split .row.hot{font-weight:700;}

      #hp-lay-proof-split .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;}
    </style>
  </head>
  <body>
    <div id="hp-lay-proof-split" data-composition-id="hp-lay-proof-split" data-start="0" data-width="1920" data-height="1080">
      <div class="cam"><img data-slot="guest-cam" src="../../assets/demo/cam-guest.jpg" alt="" style="--s:1.4;--x:-604px;--y:-40px" /></div>

      <div class="panel">
        <div class="label" data-slot="label">Hours back since September</div>
        <div class="num" data-slot="value" data-steps="58,130,212" data-at="1.4,3.2,5.0"></div>
        <div class="caption" data-slot="caption">On grading alone, by his own count</div>

        <div class="sheet" data-slot="sheet">
          <div class="row head"><span>Month</span><span>Projects graded</span><span>Hours grading</span><span>Hours saved</span></div>
          <div class="row"><span>September</span><span>152</span><span>9</span><span>58</span></div>
          <div class="row"><span>October</span><span>168</span><span>7</span><span>72</span></div>
          <div class="row"><span>November</span><span>160</span><span>6</span><span>82</span></div>
          <div class="row hot"><span>Total</span><span>480</span><span>22</span><span>212</span></div>
        </div>
      </div>

      <svg class="grain" width="1920" height="1080" aria-hidden="true">
        <filter id="hp-lay-proof-split-gr" x="0" y="0" width="100%" height="100%">
          <feTurbulence class="turb" type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="1" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="saturate" values="0"/>
          <feComponentTransfer><feFuncR type="linear" slope="1.4" intercept="-.2"/><feFuncG type="linear" slope="1.4" intercept="-.2"/><feFuncB type="linear" slope="1.4" intercept="-.2"/></feComponentTransfer>
        </filter>
        <rect width="1920" height="1080" filter="url(#hp-lay-proof-split-gr)"/>
      </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-lay-proof-split";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      const $ = (s) => ROOT.querySelectorAll(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const DUR = 8;
      const tl = gsap.timeline({ paused: true });

      // build the number stack from the slot (one span per step), synchronously
      const num = $1(".num");
      const steps = (num.dataset.steps || "0").split(",").map((s) => s.trim()).filter(Boolean);
      const ats = (num.dataset.at || "").split(",").map(parseFloat);
      const vals = steps.map((v) => { const b = document.createElement("b"); b.textContent = v; num.appendChild(b); return b; });
      const at = (i) => (isFinite(ats[i]) ? ats[i] : 1.4 + i * 1.6);

      // the hot row gets its lift + orange bar layers
      const hot = $1(".row.hot");
      if (hot) { const l = document.createElement("i"); l.className = "lift"; const b = document.createElement("i"); b.className = "bar"; hot.prepend(b); hot.prepend(l); }

      // 1. cam frame, then the panel
      tl.fromTo($1(".cam"), { autoAlpha: 0, scale: .95 }, { autoAlpha: 1, scale: 1, duration: .42, ease: POP }, .06);
      tl.fromTo($1(".panel"), { autoAlpha: 0, scale: .97, y: 12 }, { autoAlpha: 1, scale: 1, y: 0, duration: .42, ease: POP }, .16);
      // 2. label, caption, sheet rows per line
      tl.fromTo($1(".label"), { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: .3, ease: POP }, .46);
      tl.fromTo($1(".caption"), { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: .3, ease: POP }, .56);
      tl.fromTo($1(".sheet"), { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: .36, ease: POP }, .64);
      tl.fromTo($(".row span"), { autoAlpha: 0 }, { autoAlpha: 1, duration: .2, ease: "power1.out", stagger: { each: .012 } }, .74);
      if (hot) tl.set(hot.querySelectorAll(".lift,.bar"), { autoAlpha: 0 }, 0);

      // 3. ticks: first value pops, each later value rolls the previous one up and out
      vals.forEach((b, i) => {
        const t = at(i);
        if (i === 0) tl.fromTo(b, { autoAlpha: 0, yPercent: 18 }, { autoAlpha: 1, yPercent: 0, duration: .32, ease: POP }, t);
        else {
          tl.set(b, { autoAlpha: 1, yPercent: 102 }, 0);
          tl.to(vals[i - 1], { yPercent: -102, duration: .3, ease: POP }, t);
          tl.to(b, { yPercent: 0, duration: .3, ease: POP }, t);
        }
      });
      if (vals.length > 1) tl.set(vals.slice(1), { yPercent: 102 }, 0);

      // 4. the row that matters lifts when the last tick lands (light, not layout)
      if (hot) {
        const t = at(vals.length - 1) + .1;
        tl.fromTo(hot.querySelector(".lift"), { autoAlpha: 1, scaleX: 0 }, { scaleX: 1, duration: .3, ease: POP, immediateRender: false }, t);
        tl.to(hot, { color: "#FFF0E6", duration: .2, ease: "power1.out" }, t + .06);
        tl.fromTo(hot.querySelector(".bar"), { autoAlpha: 1, scaleY: 0 }, { scaleY: 1, duration: .24, ease: POP, immediateRender: false }, t + .14);
      }
      tl.set({}, {}, DUR);

      const turb = $1(".turb");
      tl.eventCallback("onUpdate", () => turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97));

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) { tl.seek(parseFloat(location.hash.slice(3)) || 0); turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97); }
    </script>
  </body>
</html>
