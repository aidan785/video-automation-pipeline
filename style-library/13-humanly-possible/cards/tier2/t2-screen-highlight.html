<!doctype html>
<!--
  Humanly Possible · tier2 · screen · HIGHLIGHT
  Highlighter swipe on the guest's prompt. A brick prompt card (10px radius) on the right side
  holds 5 to 7 lines of Inter Tight 500 in cream. On its data-at, a gold band (the line box x 1.1)
  wipes left to right behind the ONE key line in 0.2s and that line's ink flips to deep (the
  frame's one gold). Up to two supporting lines then get cream-18% bands, 0.15s apart, so gold
  stays single. Text never moves; only the light changes. The orange dot in the header is the
  frame's one orange. Flat 0 8px 0 deep offset over footage.
  From Colin and Samir's highlighter swipe on quoted text (references/analysis/colin-samir.md, move 4 + Fit).
  Slots: label (text), meta (text), lines (list of 5 to 7 lines, max ~44 chars each, one line nowrap per row;
         mark the gold line class="key" with data-at, up to two lines class="sup", optional data-at).
  Exit: mirrors the entrance in .26s at DUR-.4, or let the edit cut it away.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
      #hp-t2-screen-highlight{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:none;color:var(--fg);font-family:var(--font-body);
        /* local: the supporting band (cream at 18%, per the Fit notes) */
        --e-band-sup:rgba(255,240,230,.18);}

      #hp-t2-screen-highlight .card{position:absolute;left:1044px;top:318px;width:760px;padding:34px 48px 40px;border-radius:var(--radius);
        background:var(--hp-brick);color:var(--hp-cream);box-shadow:0 8px 0 var(--hp-deep);transform-origin:50% 50%;}
      #hp-t2-screen-highlight .head{display:flex;align-items:center;gap:12px;padding-bottom:20px;margin-bottom:18px;border-bottom:1px solid var(--hp-hairline);
        font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--hp-cream-muted);white-space:nowrap;}
      #hp-t2-screen-highlight .head i{width:9px;height:9px;border-radius:50%;background:var(--hp-orange);display:block;}
      #hp-t2-screen-highlight .head .meta{margin-left:auto;letter-spacing:.02em;text-transform:none;font-weight:600;}

      #hp-t2-screen-highlight .lines{list-style:none;font-weight:500;font-size:29px;line-height:1.6;letter-spacing:-.01em;}
      #hp-t2-screen-highlight .lines li{white-space:nowrap;}
      #hp-t2-screen-highlight .lines .t{position:relative;display:inline-block;z-index:0;}
      #hp-t2-screen-highlight .lines .band{position:absolute;left:-.22em;right:-.22em;top:50%;height:1.43em;margin-top:-.70em;border-radius:3px;z-index:-1;
        transform-origin:0 50%;transform:scaleX(0);background:var(--e-band-sup);}
      #hp-t2-screen-highlight .lines .key .band{background:var(--hp-gold);}
      /* the key line's deep ink: a copy wiped on in step with the gold band */
      #hp-t2-screen-highlight .lines .ink{position:absolute;left:0;top:0;color:var(--hp-deep);white-space:nowrap;clip-path:inset(-20% 100% -20% 0);}
    </style>
  </head>
  <body>
    <div id="hp-t2-screen-highlight" data-composition-id="hp-t2-screen-highlight" data-start="0" data-width="1920" data-height="1080">
      <div class="card">
        <div class="head"><i></i><span data-slot="label">Her prompt</span><span class="meta" data-slot="meta">Every Friday, 6 pm</span></div>
        <ul class="lines" data-slot="lines">
          <li>You help me run a small bakery.</li>
          <li class="sup" data-at="2.0">Read my sales sheet for this week.</li>
          <li class="key" data-at="1.4">Tell me which three breads sold out first,</li>
          <li class="sup" data-at="2.15">and how many of each to bake next week.</li>
          <li>Keep it under five lines.</li>
          <li>Plain words, no tables.</li>
        </ul>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t2-screen-highlight";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      const $ = (s) => Array.from(ROOT.querySelectorAll(s));
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const DUR = 5;
      const OUT = DUR - .4;
      const F = 1 / 24;
      const at = (el, fb) => { const v = parseFloat(el && el.dataset.at); return isNaN(v) ? fb : v; };
      const tl = gsap.timeline({ paused: true });

      // wrap each line's text so the band hugs the text extent (no measuring)
      const rows = $(".lines li");
      rows.forEach((li) => { const t = document.createElement("span"); t.className = "t"; while (li.firstChild) t.appendChild(li.firstChild);
        const b = document.createElement("i"); b.className = "band"; t.appendChild(b); li.appendChild(t); });

      // 1. card pops and settles, lines land per line (1-frame stagger)
      const card = $1(".card");
      tl.fromTo(card, { autoAlpha: 0 }, { autoAlpha: 1, duration: 2 * F, ease: "none" }, .08);
      tl.fromTo(card, { scale: .96, y: 12 }, { scale: 1, y: 0, duration: .32, ease: POP }, .08);
      tl.fromTo(rows, { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: .26, ease: POP, stagger: F }, .2);

      // 2. the gold band wipes behind the key line (.2s) and its ink flips to deep
      const key = $1(".lines .key");
      const tKey = at(key, 1.4);
      if (key) {
        const t = key.querySelector(".t"), ink = document.createElement("span");
        ink.className = "ink"; ink.setAttribute("aria-hidden", "true"); ink.textContent = t.textContent; t.appendChild(ink);
        tl.fromTo(key.querySelector(".band"), { scaleX: 0 }, { scaleX: 1, duration: .2, ease: POP }, tKey);
        tl.fromTo(ink, { clipPath: "inset(-20% 100% -20% 0%)" }, { clipPath: "inset(-20% 0% -20% 0%)", duration: .2, ease: POP }, tKey);
      }
      // 3. up to two supporting lines get cream-18% bands, .15s apart
      $(".lines .sup").slice(0, 2).forEach((li, i) =>
        tl.fromTo(li.querySelector(".band"), { scaleX: 0 }, { scaleX: 1, duration: .2, ease: POP }, at(li, tKey + .3 + i * .15)));

      // exit: mirror (or cut away)
      tl.to(card, { scale: .96, y: 10, duration: .26, ease: "power2.in" }, OUT);
      tl.to(card, { autoAlpha: 0, duration: 3 * F, ease: "none" }, OUT + .26 - 3 * F);
      tl.set({}, {}, DUR);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
    </script>
  </body>
</html>
