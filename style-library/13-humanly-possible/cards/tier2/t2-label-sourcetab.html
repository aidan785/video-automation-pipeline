<!doctype html>
<!--
  Humanly Possible · tier2 · label · SOURCE-TAB
  Patriot Act's source tab: a brick chip flush to the top-left safe margin, 6 px radius, a 6 px
  orange bar down its left edge, two lines of Inter Tight 600 caps (the source, then the date or
  detail at 72%). It pops in over 4 frames with the stat it sources and is usually cut away with it.
  Orange: the bar. Gold: none.
  From Patriot Act move 3 (source tab) + Fit (references/analysis/patriot-act.md).
  Exit: 4-frame pop-out 0.2 s before DUR, or cut away with the stat.
  Slots: source (text, ~30 chars, caps), detail (text, ~30 chars, caps, optional).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
      #hp-t2-label-source-tab{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:none;color:var(--fg);font-family:var(--font-body);}

      #hp-t2-label-source-tab .tab{position:absolute;left:var(--margin);top:var(--margin-y);display:inline-block;background:var(--hp-brick);
        border-radius:var(--radius-sm);overflow:hidden;padding:13px 22px 14px 26px;transform-origin:0% 0%;}
      #hp-t2-label-source-tab .bar{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--hp-orange);}
      #hp-t2-label-source-tab .ln{display:block;font-family:var(--font-body);font-weight:600;font-size:19px;line-height:1.32;letter-spacing:.12em;
        text-transform:uppercase;color:var(--hp-cream);white-space:nowrap;}
      #hp-t2-label-source-tab .ln.detail{color:var(--hp-cream-muted);}
    </style>
  </head>
  <body>
    <div id="hp-t2-label-source-tab" data-composition-id="hp-t2-label-source-tab" data-start="0" data-width="1920" data-height="1080">
      <div class="tab">
        <i class="bar"></i>
        <span class="ln" data-slot="source">Her own order log</span>
        <span class="ln detail" data-slot="detail">March to September 2026</span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t2-label-source-tab";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const DUR = 4;
      const OUT = DUR - .2;
      const F = 1 / 30;  // one frame at 30 fps
      const tl = gsap.timeline({ paused: true });

      const detail = $1(".detail");
      if (!detail.textContent.trim()) detail.remove();

      // pops in over 4 frames, stops dead
      tl.fromTo($1(".tab"), { autoAlpha: 0, scale: .92 }, { autoAlpha: 1, scale: 1, duration: 4 * F, ease: POP }, .05);

      // exit: 4-frame pop-out (or cut away with the stat)
      tl.to($1(".tab"), { autoAlpha: 0, scale: .94, duration: 4 * F, ease: "power2.in" }, OUT);
      tl.set({}, {}, DUR);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
    </script>
  </body>
</html>
