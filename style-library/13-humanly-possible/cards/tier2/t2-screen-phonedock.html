<!doctype html>
<!--
  Humanly Possible · tier2 · screen · PHONEDOCK
  A plain flat phone docked beside the speaker for a whole demo. Deep body (44px device radius,
  no gloss, no bezel highlights), ~420x880 at x 1380, vertically centred. Inside, a rebuilt
  messages app (cream screen): the client's question arrives, the Assistant drafts a reply
  (dashed outline = draft), then it is sent and the same bubble fills brick (one element, two
  states) and the key time flips cream to gold on its landing frame (the frame's one gold).
  The send arrow button is the frame's one orange. Bubbles arrive on data-at.
  Rises 40px with hpPop, then holds dead still; built to sit through a long answer and ride
  across cuts within the same speaker.
  From Ali Abdaal's phone docked beside the talking head (references/analysis/ali-abdaal.md, move 2 + Fit).
  Slots: contact (text), contact-sub (text), msg-in (text), draft-label (text),
         msg-out (richtext, one <em> = the gold detail), receipt (text), msg-in-2 (text), note (text).
  Exit: mirrors the entrance (drops 40px, .3s) at DUR-.4, or let the edit cut it away.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
      #hp-t2-screen-phonedock{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:none;color:var(--fg);font-family:var(--font-body);
        /* local: ink on cream surfaces, device radii (a phone is not a card) */
        --e-ink-muted:rgba(75,21,38,.56);--e-ink-line:rgba(75,21,38,.12);--e-ink-tint:rgba(75,21,38,.08);--e-edge:rgba(255,240,230,.16);
        --e-device:44px;--e-screen:32px;}

      #hp-t2-screen-phonedock .phone{position:absolute;left:1380px;top:100px;width:420px;height:880px;padding:14px;border-radius:var(--e-device);
        background:var(--hp-deep);box-shadow:inset 0 0 0 2px var(--e-edge), 0 8px 0 var(--hp-deep);}
      #hp-t2-screen-phonedock .screen{position:relative;width:100%;height:100%;border-radius:var(--e-screen);overflow:hidden;background:var(--hp-cream);color:var(--hp-oxblood);}
      #hp-t2-screen-phonedock .cam{position:absolute;left:50%;top:14px;width:96px;height:28px;margin-left:-48px;border-radius:14px;background:var(--hp-deep);}

      #hp-t2-screen-phonedock .status{position:absolute;left:30px;right:28px;top:18px;height:22px;display:flex;justify-content:space-between;align-items:center;
        font-weight:600;font-size:17px;letter-spacing:-.01em;}
      #hp-t2-screen-phonedock .batt{width:26px;height:13px;border-radius:4px;border:2px solid var(--hp-oxblood);padding:1px;}
      #hp-t2-screen-phonedock .batt b{display:block;width:70%;height:100%;border-radius:1px;background:var(--hp-oxblood);}

      #hp-t2-screen-phonedock .head{position:absolute;left:0;right:0;top:58px;padding:14px 22px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--e-ink-line);}
      #hp-t2-screen-phonedock .av{width:48px;height:48px;border-radius:50%;background:var(--hp-brick);color:var(--hp-cream);display:flex;align-items:center;justify-content:center;
        font-weight:700;font-size:18px;letter-spacing:.02em;flex:none;}
      #hp-t2-screen-phonedock .nm{font-weight:700;font-size:21px;line-height:1.15;letter-spacing:-.01em;}
      #hp-t2-screen-phonedock .sb{font-weight:500;font-size:15px;line-height:1.3;color:var(--e-ink-muted);}

      #hp-t2-screen-phonedock .thread{position:absolute;left:18px;right:18px;top:152px;bottom:96px;}
      #hp-t2-screen-phonedock .day{text-align:center;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--e-ink-muted);margin:6px 0 16px;}
      #hp-t2-screen-phonedock .row{display:flex;margin-bottom:12px;}
      #hp-t2-screen-phonedock .row.out{justify-content:flex-end;}
      #hp-t2-screen-phonedock .b{max-width:304px;padding:13px 16px;font-weight:500;font-size:22px;line-height:1.32;letter-spacing:-.005em;border-radius:18px;}
      #hp-t2-screen-phonedock .in .b{background:var(--e-ink-tint);border-bottom-left-radius:var(--radius-sm);}
      #hp-t2-screen-phonedock .out .b{background:var(--hp-cream);color:var(--hp-oxblood);border:2px dashed var(--hp-oxblood);border-bottom-right-radius:var(--radius-sm);padding:11px 14px;}
      #hp-t2-screen-phonedock .out .b em{font-style:normal;font-weight:700;color:var(--hp-oxblood);}
      #hp-t2-screen-phonedock .tag{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:-2px 4px 6px;font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--e-ink-muted);}
      #hp-t2-screen-phonedock .tag i{width:12px;height:12px;border-radius:3px;background:var(--hp-oxblood);display:block;}
      #hp-t2-screen-phonedock .receipt{text-align:right;margin:-4px 6px 14px;font-weight:600;font-size:13px;color:var(--e-ink-muted);}
      #hp-t2-screen-phonedock .note{display:flex;align-items:center;gap:10px;margin:6px auto 0;width:max-content;max-width:100%;padding:9px 14px;border-radius:var(--radius);
        border:1px solid var(--e-ink-line);font-weight:600;font-size:15px;color:var(--hp-oxblood);}
      #hp-t2-screen-phonedock .note svg{width:16px;height:16px;flex:none;}

      #hp-t2-screen-phonedock .compose{position:absolute;left:16px;right:16px;bottom:24px;height:58px;display:flex;align-items:center;gap:10px;}
      #hp-t2-screen-phonedock .field{flex:1;height:52px;border-radius:26px;border:1.5px solid var(--e-ink-line);display:flex;align-items:center;padding:0 20px;
        font-weight:500;font-size:18px;color:var(--e-ink-muted);}
      #hp-t2-screen-phonedock .send{width:52px;height:52px;border-radius:50%;background:var(--hp-orange);color:var(--hp-deep);display:flex;align-items:center;justify-content:center;flex:none;}
      #hp-t2-screen-phonedock .send svg{width:24px;height:24px;display:block;}
    </style>
  </head>
  <body>
    <div id="hp-t2-screen-phonedock" data-composition-id="hp-t2-screen-phonedock" data-start="0" data-width="1920" data-height="1080">
      <div class="phone">
        <div class="screen">
          <div class="cam"></div>
          <div class="status"><span>9:41</span><span class="batt"><b></b></span></div>

          <div class="head">
            <div class="av">MR</div>
            <div><div class="nm" data-slot="contact">Maria R.</div><div class="sb" data-slot="contact-sub">Biscuit, goldendoodle</div></div>
          </div>

          <div class="thread">
            <div class="day">Today</div>
            <div class="row in" data-at="0.9"><div class="b" data-slot="msg-in">Hi! Is Biscuit due for a trim soon?</div></div>
            <div class="tag" data-at="2.4"><i></i><span data-slot="draft-label">Assistant drafted this</span></div>
            <div class="row out" data-at="2.4"><div class="b" data-slot="msg-out">He is! His last trim was Oct&nbsp;3. Want <em>Saturday at 10</em>?</div></div>
            <div class="receipt" data-at="4.6" data-slot="receipt">Delivered</div>
            <div class="row in" data-at="7.2"><div class="b" data-slot="msg-in-2">Saturday works. Thank you!</div></div>
            <div class="note" data-at="8.6">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M1.5 6.5h13M5 1v3M11 1v3" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
              <span data-slot="note">Booked, Sat 10:00</span>
            </div>
          </div>

          <div class="compose">
            <div class="field">Message</div>
            <div class="send" data-at="4.2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6 11.5L12 5.5l6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t2-screen-phonedock";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      const $ = (s) => Array.from(ROOT.querySelectorAll(s));
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const DUR = 14;
      const OUT = DUR - .4;
      const F = 1 / 24;
      const at = (el, fb) => { const v = parseFloat(el && el.dataset.at); return isNaN(v) ? fb : v; };
      const tl = gsap.timeline({ paused: true });

      // 1. the phone rises 40px and stops dead
      const phone = $1(".phone");
      tl.fromTo(phone, { autoAlpha: 0 }, { autoAlpha: 1, duration: 3 * F, ease: "none" }, .06);
      tl.fromTo(phone, { y: 40 }, { y: 0, duration: .42, ease: POP }, .06);

      // 2. messages arrive on their spoken words (layout is final from frame one; nothing reflows)
      const pop = (el, t, from) => tl.fromTo(el, Object.assign({ autoAlpha: 0, y: 10 }, from || {}), { autoAlpha: 1, y: 0, scale: 1, duration: .24, ease: POP }, t);
      const ins = $(".row.in");
      ins.forEach((r, i) => pop(r, at(r, 1 + i * 5), { scale: .96, transformOrigin: "0% 100%" }));
      const tag = $1(".tag"), out = $1(".row.out"), b = out.querySelector(".b"), em = b.querySelector("em");
      pop(tag, at(tag, 2.4));
      pop(out, at(out, 2.4) + F, { scale: .96, transformOrigin: "100% 100%" });

      // 3. send: 1-frame press on the orange button, the draft bubble becomes the sent bubble
      const send = $1(".send"), tSend = at(send, 4.2);
      tl.set(send, { scale: .9, filter: "brightness(.85)" }, tSend);
      tl.set(send, { scale: 1, filter: "brightness(1)" }, tSend + F);
      tl.set(b, { backgroundColor: "#7A1E1E", borderColor: "#7A1E1E", color: "#FFF0E6" }, tSend + F);
      if (em) tl.fromTo(em, { color: "#FFF0E6" }, { color: "#FFC145", duration: .2, ease: POP, immediateRender: false }, tSend + F);
      const rc = $1(".receipt");
      tl.fromTo(rc, { autoAlpha: 0 }, { autoAlpha: 1, duration: .2, ease: "power1.out" }, at(rc, tSend + .4));
      const note = $1(".note");
      pop(note, at(note, 8.6));

      // exit: mirror (drop 40px), or cut away
      tl.to(phone, { y: 40, duration: .3, ease: "power2.in" }, OUT);
      tl.to(phone, { autoAlpha: 0, duration: 3 * F, ease: "none" }, OUT + .3 - 3 * F);
      tl.set({}, {}, DUR);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
    </script>
  </body>
</html>
