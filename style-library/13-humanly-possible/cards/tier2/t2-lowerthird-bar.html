<!doctype html>
<!--
  Humanly Possible · tier2 · lower-third · BAR
  The brand's canonical lower third: an oxblood bar bottom-left with an orange stripe down its
  left edge. Born from a line: the stripe grows first (scaleY), the bar wipes out of it (clip-path),
  then name and role pop a beat apart. Exit mirrors back into the stripe, the stripe collapses.
  The bar is opaque, so it needs no scrim over bright footage. Orange: the stripe. Gold: none by
  default (one optional <em> in role). From the brand spec (references/brand/).
  Exit: animated mirror (0.5 s before DUR), or let the edit cut it away.
  Slots: name (text, ~22 chars), role (richtext, ~44 chars, optional one <em> = gold).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
      #hp-t2-lower-third-bar{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:none;color:var(--fg);font-family:var(--font-body);}

      #hp-t2-lower-third-bar .lt{position:absolute;left:var(--margin);bottom:112px;}
      #hp-t2-lower-third-bar .plate{position:relative;display:inline-block;background:var(--hp-oxblood);border-radius:var(--radius);
        padding:24px 44px 26px 42px;will-change:clip-path;}
      #hp-t2-lower-third-bar .stripe{position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--hp-orange);
        border-radius:var(--radius) 0 0 var(--radius);transform-origin:50% 50%;}
      #hp-t2-lower-third-bar .name{display:block;font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;
        font-size:56px;line-height:1;letter-spacing:var(--track-display);color:var(--hp-cream);white-space:nowrap;}
      #hp-t2-lower-third-bar .role{display:block;margin-top:10px;font-family:var(--font-body);font-weight:600;font-size:26px;line-height:1.2;
        letter-spacing:-.005em;color:var(--hp-cream-muted);white-space:nowrap;}
      #hp-t2-lower-third-bar .role em{font-style:normal;color:var(--hp-gold);}
    </style>
  </head>
  <body>
    <div id="hp-t2-lower-third-bar" data-composition-id="hp-t2-lower-third-bar" data-start="0" data-width="1920" data-height="1080">
      <div class="lt">
        <div class="plate">
          <span class="name" data-slot="name">Marisol Vega</span>
          <span class="role" data-slot="role">Baker, runs the morning orders on her phone</span>
        </div>
        <i class="stripe"></i>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t2-lower-third-bar";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const DUR = 4.5;
      const OUT = DUR - .5;
      const tl = gsap.timeline({ paused: true });

      const role = $1(".role");
      if (!role.textContent.trim()) role.remove();
      const name = $1(".name");

      // 1. the stripe grows first
      tl.fromTo($1(".stripe"), { scaleY: 0 }, { scaleY: 1, duration: .26, ease: POP }, .05);
      // 2. the bar wipes out of the stripe
      tl.fromTo($1(".plate"), { clipPath: "inset(0 100% 0 0 round 10px)" }, { clipPath: "inset(0 0% 0 0 round 10px)", duration: .4, ease: POP }, .26);
      // 3. name, then role
      tl.fromTo(name, { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: .3, ease: POP }, .44);
      if (role.isConnected) tl.fromTo(role, { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: .28, ease: POP }, .54);

      // exit: mirror back into the stripe
      tl.to([role.isConnected ? role : null, name].filter(Boolean), { autoAlpha: 0, y: 6, duration: .16, ease: "power2.in", stagger: .03 }, OUT);
      tl.to($1(".plate"), { clipPath: "inset(0 100% 0 0 round 10px)", duration: .22, ease: "power2.in" }, OUT + .1);
      tl.to($1(".stripe"), { scaleY: 0, duration: .16, ease: "power2.in" }, OUT + .3);
      tl.set({}, {}, DUR);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
    </script>
  </body>
</html>
