<!doctype html>
<!--
  Humanly Possible · tier2 · screen · CLICK
  The click as the climax. A compact rebuilt confirm panel (cream, 10px radius) pops in lower
  right. A cursor travels into the orange button over ~0.5s on a soft ease-out, a 1-frame press
  darkens the button, the label swaps to its done state with a check ("Sent"), and a tiny
  delivered count lands in the panel footer, its number flipping cream to gold on its landing
  frame (the frame's one gold). The button is the frame's one orange. Flat 0 8px 0 deep offset.
  Built to be cut away right after the count lands (hard cut to the reaction, like the source);
  a mirrored .26s exit at DUR-.4 is there if the edit holds.
  From Apple's click as the climax (references/analysis/apple-students.md, move 4 + Fit).
  Slots: app-label (text), context (text), title (text), sub (text), people (list of 3 initials),
         more (text, e.g. "+35"), cancel (text), action (text), done (text), count (number), count-label (text).
  Timing: the button's data-at = the click (spoken word); the cursor arrives 0.5s before it.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
      #hp-t2-screen-click{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:none;color:var(--fg);font-family:var(--font-body);
        /* local: ink on cream surfaces */
        --e-ink-muted:rgba(75,21,38,.58);--e-ink-line:rgba(75,21,38,.14);}

      #hp-t2-screen-click .panel{position:absolute;left:1164px;top:618px;width:640px;height:332px;padding:30px 36px;border-radius:var(--radius);
        background:var(--hp-cream);color:var(--hp-oxblood);box-shadow:0 8px 0 var(--hp-deep);transform-origin:100% 100%;}
      #hp-t2-screen-click .top{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--e-ink-muted);}
      #hp-t2-screen-click .top .av{width:22px;height:22px;border-radius:var(--radius-sm);background:var(--hp-oxblood);display:flex;align-items:center;justify-content:center;}
      #hp-t2-screen-click .top .av b{width:7px;height:7px;border-radius:2px;background:var(--hp-cream);display:block;}
      #hp-t2-screen-click .top .ctx{margin-left:auto;letter-spacing:.02em;text-transform:none;font-weight:600;}
      #hp-t2-screen-click .title{margin-top:22px;font-weight:700;font-size:38px;line-height:1.1;letter-spacing:-.02em;white-space:nowrap;}
      #hp-t2-screen-click .sub{margin-top:10px;font-weight:500;font-size:20px;line-height:1.35;color:var(--e-ink-muted);white-space:nowrap;}
      #hp-t2-screen-click .people{display:flex;align-items:center;margin-top:18px;}
      #hp-t2-screen-click .people span{width:34px;height:34px;border-radius:50%;margin-right:-8px;border:2px solid var(--hp-cream);background:var(--hp-brick);color:var(--hp-cream);
        display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;letter-spacing:.02em;position:relative;}
      #hp-t2-screen-click .people span:nth-child(1){z-index:3;}
      #hp-t2-screen-click .people span:nth-child(2){z-index:2;}
      #hp-t2-screen-click .people span:nth-child(2){background:var(--hp-oxblood);}
      #hp-t2-screen-click .people span:nth-child(3){background:var(--hp-deep);}
      #hp-t2-screen-click .people em{font-style:normal;margin-left:18px;font-weight:600;font-size:17px;color:var(--e-ink-muted);}

      #hp-t2-screen-click .foot{position:absolute;left:36px;right:36px;bottom:30px;height:60px;}
      #hp-t2-screen-click .ghost{position:absolute;left:0;top:0;height:60px;padding:0 24px;border-radius:var(--radius);border:1.5px solid var(--e-ink-line);
        display:flex;align-items:center;font-weight:600;font-size:20px;color:var(--e-ink-muted);}
      #hp-t2-screen-click .count{position:absolute;left:0;top:6px;height:48px;padding:0 18px 0 16px;border-radius:var(--radius-sm);background:var(--hp-deep);color:var(--hp-cream);
        display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;white-space:nowrap;transform-origin:0 50%;}
      #hp-t2-screen-click .count b{font-weight:700;font-size:24px;letter-spacing:-.01em;color:var(--hp-cream);}
      #hp-t2-screen-click .btn{position:absolute;right:0;top:0;width:200px;height:60px;border-radius:var(--radius);background:var(--hp-orange);color:var(--hp-deep);
        font-weight:700;font-size:22px;letter-spacing:-.005em;}
      #hp-t2-screen-click .btn > span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;}
      #hp-t2-screen-click .btn svg{width:22px;height:22px;display:block;}

      #hp-t2-screen-click .cursor{position:absolute;left:0;top:0;width:34px;height:46px;transform-origin:0 0;}
      #hp-t2-screen-click .cursor path{fill:var(--hp-deep);stroke:var(--hp-cream);}
    </style>
  </head>
  <body>
    <div id="hp-t2-screen-click" data-composition-id="hp-t2-screen-click" data-start="0" data-width="1920" data-height="1080">
      <div class="panel">
        <div class="top"><span class="av"><b></b></span><span data-slot="app-label">Assistant</span><span class="ctx" data-slot="context">Friday reminders</span></div>
        <div class="title" data-slot="title">Send 38 reminders?</div>
        <div class="sub" data-slot="sub">Every client booked next week gets their time.</div>
        <div class="people"><span data-slot="people">MR</span><span>JT</span><span>AK</span><em data-slot="more">+35 more</em></div>
        <div class="foot">
          <div class="ghost" data-slot="cancel">Not now</div>
          <div class="count"><b data-slot="count">38</b><span data-slot="count-label">delivered</span></div>
          <div class="btn" data-at="1.6">
            <span class="lbl" data-slot="action">Send 38</span>
            <span class="done"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M4.5 11.5l4.2 4.2L17.5 6.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-slot="done">Sent</span></span>
          </div>
        </div>
      </div>

      <svg class="cursor" viewBox="0 0 34 46" aria-hidden="true"><path d="M3 2.5v35.5l9.2-8.6 6.1 13.6 6.4-2.9-6.1-13.4 12.4-.6z" stroke-width="2.4" stroke-linejoin="round"/></svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t2-screen-click";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const DUR = 4.5;
      const OUT = DUR - .4;
      const F = 1 / 24;
      const at = (el, fb) => { const v = parseFloat(el && el.dataset.at); return isNaN(v) ? fb : v; };
      const tl = gsap.timeline({ paused: true });

      const panel = $1(".panel"), btn = $1(".btn"), cur = $1(".cursor");
      const lbl = $1(".btn .lbl"), done = $1(".btn .done"), ghost = $1(".ghost"), count = $1(".count"), num = $1(".count b");
      const T = at(btn, 1.6);                 // the click
      // cursor target: tip just inside the button, left of centre (panel 1164,618; foot bottom 30; btn 200x60 at right 36)
      const TIP = { x: 1164 + 640 - 36 - 200 + 156, y: 618 + 332 - 30 - 60 + 26 };

      // 1. panel pops and settles
      tl.fromTo(panel, { autoAlpha: 0 }, { autoAlpha: 1, duration: 2 * F, ease: "none" }, .08);
      tl.fromTo(panel, { scale: .95, y: 12 }, { scale: 1, y: 0, duration: .32, ease: POP }, .08);
      tl.set([done, count], { autoAlpha: 0 }, 0);

      // 2. cursor travels in over .5s, soft ease-out, and stops on the button
      tl.set(cur, { autoAlpha: 0, x: TIP.x - 300, y: TIP.y + 150 }, 0);
      tl.to(cur, { autoAlpha: 1, duration: 2 * F, ease: "none" }, T - .62);
      tl.fromTo(cur, { x: TIP.x - 300, y: TIP.y + 150 }, { x: TIP.x, y: TIP.y, duration: .5, ease: "power2.out", immediateRender: false }, T - .62);

      // 3. one-frame press, then the label swaps to its done state
      tl.set(btn, { filter: "brightness(.85)", scale: .98 }, T);
      tl.set(cur, { scale: .92 }, T);
      tl.set(btn, { filter: "brightness(1)", scale: 1 }, T + F);
      tl.set(cur, { scale: 1 }, T + F);
      tl.set(lbl, { autoAlpha: 0 }, T + F);
      tl.set(done, { autoAlpha: 1 }, T + F);

      // 4. the count lands in the footer; its number flips cream to gold on the landing frame
      tl.set(ghost, { autoAlpha: 0 }, T + .2);
      tl.fromTo(count, { autoAlpha: 0, scale: .92 }, { autoAlpha: 1, scale: 1, duration: .22, ease: POP, immediateRender: false }, T + .2);
      tl.fromTo(num, { color: "#FFF0E6" }, { color: "#FFC145", duration: .16, ease: POP, immediateRender: false }, T + .3);

      // exit: mirror (or, preferably, cut away to the reaction)
      tl.to(cur, { autoAlpha: 0, duration: 3 * F, ease: "none" }, OUT);
      tl.to(panel, { scale: .95, y: 10, duration: .26, ease: "power2.in" }, OUT);
      tl.to(panel, { autoAlpha: 0, duration: 3 * F, ease: "none" }, OUT + .26 - 3 * F);
      tl.set({}, {}, DUR);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
    </script>
  </body>
</html>
