<!doctype html>
<!--
  Humanly Possible · tier2 · lower-third · THREESTEP (gold card)
  Name, then role, then a short orange dash, each a beat apart, bottom-left in the safe margin.
  Type pops and holds still; it can ride across a cut within the same speaker. A soft deep
  scrim (shadow plate, not a glow) keeps cream type legible over bright footage.
  From Great Big Story's three-step super (references/analysis/gbs-marathons.md).
  Slots: name (text), role (richtext, optional one <em> = gold, e.g. the AI tool name).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
      #hp-t2-lowerthird-threestep{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:none;color:var(--fg);font-family:var(--font-body);}

      #hp-t2-lowerthird-threestep .scrim{position:absolute;left:0;bottom:0;width:1100px;height:420px;pointer-events:none;
        background:radial-gradient(70% 80% at 0% 100%, rgba(44,11,22,.62) 0%, rgba(44,11,22,.32) 45%, rgba(44,11,22,0) 100%);}

      #hp-t2-lowerthird-threestep .unit{position:absolute;left:var(--margin);bottom:112px;}
      #hp-t2-lowerthird-threestep .name{display:block;font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;
        font-size:64px;line-height:1;letter-spacing:var(--track-display);color:var(--hp-cream);white-space:nowrap;}
      #hp-t2-lowerthird-threestep .role{display:block;margin-top:12px;font-family:var(--font-body);font-weight:600;font-size:28px;line-height:1.2;
        letter-spacing:-.005em;color:var(--hp-cream-muted);white-space:nowrap;}
      #hp-t2-lowerthird-threestep .role em{font-style:normal;color:var(--hp-gold);}
      #hp-t2-lowerthird-threestep .dash{display:block;margin-top:20px;width:64px;height:6px;border-radius:3px;background:var(--hp-orange);transform-origin:0 50%;}
    </style>
  </head>
  <body>
    <div id="hp-t2-lowerthird-threestep" data-composition-id="hp-t2-lowerthird-threestep" data-start="0" data-width="1920" data-height="1080">
      <div class="scrim"></div>
      <div class="unit">
        <span class="name" data-slot="name">Dana Ruiz</span>
        <span class="role" data-slot="role">Runs a two-chair grooming shop with <em>ChatGPT</em></span>
        <i class="dash"></i>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t2-lowerthird-threestep";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const DUR = 4.5;
      const OUT = DUR - .4;
      const tl = gsap.timeline({ paused: true });

      const role = $1(".role");
      if (!role.textContent.trim()) role.remove();

      tl.fromTo($1(".scrim"), { autoAlpha: 0 }, { autoAlpha: 1, duration: .3, ease: "power1.out" }, 0);
      // three steps, one beat apart: name, role, dash
      tl.fromTo($1(".name"), { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: .32, ease: POP }, .08);
      if (role.isConnected) tl.fromTo(role, { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: .3, ease: POP }, .16);
      tl.fromTo($1(".dash"), { scaleX: 0 }, { scaleX: 1, duration: .3, ease: POP }, .26);

      // exit mirrors the entrance (or the edit cuts it away first)
      tl.to($1(".dash"), { scaleX: 0, duration: .18, ease: "power2.in" }, OUT);
      tl.to([role.isConnected ? role : null, $1(".name")].filter(Boolean), { autoAlpha: 0, y: 8, duration: .2, ease: "power2.in", stagger: .04 }, OUT + .06);
      tl.to($1(".scrim"), { autoAlpha: 0, duration: .25, ease: "power1.in" }, OUT + .12);
      tl.set({}, {}, DUR);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
    </script>
  </body>
</html>
