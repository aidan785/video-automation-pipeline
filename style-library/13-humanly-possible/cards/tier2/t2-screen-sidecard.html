<!doctype html>
<!--
  Humanly Possible · tier2 · screen · SIDECARD
  The AI chat pops beside the host. A rebuilt chat snippet (cream card, 10px radius, Inter Tight)
  sits on the right third at ~42% width, vertically centred. It pops from .9 to 1 in 6 frames
  and settles about 2% up and left, then holds dead still. The "You" prompt bubble lands, then the
  Assistant reply lands sentence by sentence on the spoken words, and one key phrase gets a gold
  highlighter band (the frame's one gold). A small brick tab on the top edge names the tool
  context; its dot is the frame's one orange. Flat 0 8px 0 deep offset, no other shadow.
  From Patriot Act's screenshot pop beside the host (references/analysis/patriot-act.md, move 5 + Fit).
  Slots: tab (text, tool context), prompt (text, what the guest typed),
         reply (richtext: sentence spans with data-at; one <em> = the highlighted phrase).
  Successive chats replace each other in the same slot by a hard swap (new card instance).
  Exit: mirrors the entrance in .26s at DUR-.4, or let the edit cut it away.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
      #hp-t2-screen-sidecard{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:none;color:var(--fg);font-family:var(--font-body);
        /* local: ink on cream surfaces (oxblood at reduced alpha) */
        --e-ink-muted:rgba(75,21,38,.58);--e-ink-line:rgba(75,21,38,.12);}

      #hp-t2-screen-sidecard .card{position:absolute;left:1104px;top:322px;width:700px;padding:44px 44px 42px;border-radius:var(--radius);
        background:var(--hp-cream);color:var(--hp-oxblood);box-shadow:0 8px 0 var(--hp-deep);transform-origin:50% 50%;}

      #hp-t2-screen-sidecard .tab{position:absolute;left:40px;top:-19px;height:38px;padding:0 16px 0 14px;border-radius:var(--radius-sm);background:var(--hp-brick);
        display:flex;align-items:center;gap:10px;font-family:var(--font-body);font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--hp-cream);white-space:nowrap;}
      #hp-t2-screen-sidecard .tab i{width:9px;height:9px;border-radius:50%;background:var(--hp-orange);display:block;}

      #hp-t2-screen-sidecard .who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--e-ink-muted);}
      #hp-t2-screen-sidecard .who.you{justify-content:flex-end;}
      #hp-t2-screen-sidecard .who .av{width:24px;height:24px;border-radius:var(--radius-sm);background:var(--hp-oxblood);display:flex;align-items:center;justify-content:center;}
      #hp-t2-screen-sidecard .who .av b{width:8px;height:8px;border-radius:2px;background:var(--hp-cream);display:block;}

      #hp-t2-screen-sidecard .ask{display:flex;justify-content:flex-end;margin-top:12px;}
      #hp-t2-screen-sidecard .bubble{max-width:520px;padding:16px 20px;border-radius:var(--radius) var(--radius) var(--radius-sm) var(--radius);background:var(--hp-brick);color:var(--hp-cream);
        font-weight:500;font-size:25px;line-height:1.34;letter-spacing:-.005em;}

      #hp-t2-screen-sidecard .rule{height:1px;background:var(--e-ink-line);margin:30px 0 26px;}

      #hp-t2-screen-sidecard .reply{margin-top:14px;font-weight:500;font-size:29px;line-height:1.4;letter-spacing:-.01em;color:var(--hp-oxblood);}
      #hp-t2-screen-sidecard .reply em{font-style:normal;color:var(--hp-deep);font-weight:600;padding:0 .14em;margin:0 -.04em;border-radius:3px;
        background-image:linear-gradient(var(--hp-gold),var(--hp-gold));background-repeat:no-repeat;background-position:0 55%;background-size:0% 92%;
        -webkit-box-decoration-break:clone;box-decoration-break:clone;}
    </style>
  </head>
  <body>
    <div id="hp-t2-screen-sidecard" data-composition-id="hp-t2-screen-sidecard" data-start="0" data-width="1920" data-height="1080">
      <div class="card">
        <div class="tab"><i></i><span data-slot="tab">Her AI chat, Tuesday booking</span></div>

        <div class="who you">You</div>
        <div class="ask"><div class="bubble" data-slot="prompt" data-at="0.45">Write a short reminder for Biscuit's owner and offer two times.</div></div>

        <div class="rule"></div>

        <div class="who ai"><span class="av"><b></b></span>Assistant</div>
        <div class="reply" data-slot="reply"><span data-at="1.3">Hi Maria! Biscuit is due for his trim next week. </span><span data-at="2.1">I have <em>Saturday at 10 or Tuesday at 2</em> open. </span><span data-at="3.0">Reply 1 or 2 and you're booked.</span></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t2-screen-sidecard";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      const $ = (s) => Array.from(ROOT.querySelectorAll(s));
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const DUR = 6;
      const OUT = DUR - .4;
      const F = 1 / 24;
      const at = (el, fb) => { const v = parseFloat(el && el.dataset.at); return isNaN(v) ? fb : v; };
      const tl = gsap.timeline({ paused: true });

      const card = $1(".card");
      // 1. pop: .9 to 1 in 6 frames, then settle ~2% up-left over the next 6 frames
      tl.fromTo(card, { autoAlpha: 0 }, { autoAlpha: 1, duration: 2 * F, ease: "none" }, .08);
      tl.fromTo(card, { scale: .9 }, { scale: 1, duration: 6 * F, ease: POP }, .08);
      tl.fromTo(card, { x: 30, y: 18 }, { x: 0, y: 0, duration: 12 * F, ease: POP }, .08);
      tl.fromTo($1(".tab"), { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: .24, ease: POP }, .26);

      // 2. the prompt lands, then the reply sentence by sentence (layout fixed from frame one)
      const bubble = $1(".bubble");
      tl.fromTo([$1(".who.you"), bubble], { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: .28, ease: POP, stagger: F }, at(bubble, .45));
      const sents = $(".reply > span");
      const first = at(sents[0], 1.3);
      tl.fromTo([$1(".rule"), $1(".who.ai")], { autoAlpha: 0 }, { autoAlpha: 1, duration: .2, ease: "power1.out" }, first - .2);
      sents.forEach((s, i) => tl.fromTo(s, { autoAlpha: 0 }, { autoAlpha: 1, duration: .2, ease: "power1.out" }, at(s, first + i * .8)));

      // 3. the one gold: highlighter band wipes left to right behind the key phrase
      const em = $1(".reply em");
      if (em) tl.fromTo(em, { backgroundSize: "0% 92%" }, { backgroundSize: "100% 92%", duration: .24, ease: POP }, at(em.closest("span"), first) + .3);

      // exit: mirror the pop (or cut away)
      tl.to(card, { scale: .94, x: 16, y: 10, duration: .26, ease: "power2.in" }, OUT);
      tl.to(card, { autoAlpha: 0, duration: 3 * F, ease: "none" }, OUT + .26 - 3 * F);
      tl.set({}, {}, DUR);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
    </script>
  </body>
</html>
