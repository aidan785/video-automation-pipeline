<!doctype html>
<!--
  Humanly Possible · tier2 · lower-third · IGNITE
  Hot Ones' neon name box, flattened: "animate the light, not the layout". A brick box (10 px radius,
  solid 4 px cream outline, no glow) pops in with name and role already in place; about 0.4 s after it
  lands, the small spark icon inside ignites: cream outline to orange fill with a 0.8 to 1 pop.
  The icon is the frame's ONE orange (outline is cream so the orange stays single). Gold: none by
  default (one optional <em> in role, e.g. the tool name).
  From Hot Ones move 1 + Fit (references/analysis/hot-ones.md).
  Ignite time: data-at on .icon (seconds from beat start, default .78).
  Exit: animated mirror (icon goes dark, box pops out, 0.35 s before DUR), or cut away.
  Slots: name (text, ~20 chars), role (richtext, ~44 chars, optional one <em> = gold).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
      #hp-t2-lower-third-ignite{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:none;color:var(--fg);font-family:var(--font-body);}

      #hp-t2-lower-third-ignite .lt{position:absolute;left:var(--margin);bottom:112px;}
      #hp-t2-lower-third-ignite .box{display:inline-flex;align-items:center;gap:26px;background:var(--hp-brick);border:4px solid var(--hp-cream);
        border-radius:var(--radius);padding:22px 42px 24px 28px;transform-origin:0% 100%;}
      #hp-t2-lower-third-ignite .icon{display:block;width:64px;height:64px;flex:none;transform-origin:50% 50%;}
      #hp-t2-lower-third-ignite .icon path{fill:transparent;stroke:var(--hp-cream);stroke-width:3.5;stroke-linejoin:round;}
      #hp-t2-lower-third-ignite .txt{display:block;}
      #hp-t2-lower-third-ignite .name{display:block;font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;
        font-size:54px;line-height:1;letter-spacing:var(--track-display);color:var(--hp-cream);white-space:nowrap;}
      #hp-t2-lower-third-ignite .role{display:block;margin-top:9px;font-family:var(--font-body);font-weight:600;font-size:25px;line-height:1.2;
        letter-spacing:-.005em;color:var(--hp-cream-muted);white-space:nowrap;}
      #hp-t2-lower-third-ignite .role em{font-style:normal;color:var(--hp-gold);}
    </style>
  </head>
  <body>
    <div id="hp-t2-lower-third-ignite" data-composition-id="hp-t2-lower-third-ignite" data-start="0" data-width="1920" data-height="1080">
      <div class="lt">
        <div class="box">
          <svg class="icon" viewBox="0 0 64 64" aria-hidden="true" data-at=".78">
            <path d="M32 5 C33.6 21 43 30.4 59 32 C43 33.6 33.6 43 32 59 C30.4 43 21 33.6 5 32 C21 30.4 30.4 21 32 5 Z"/>
          </svg>
          <div class="txt">
            <span class="name" data-slot="name">Ray Okafor</span>
            <span class="role" data-slot="role">Shop teacher, plans every lesson with an AI</span>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t2-lower-third-ignite";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const DUR = 4.5;
      const OUT = DUR - .35;
      const tl = gsap.timeline({ paused: true });

      const role = $1(".role");
      if (!role.textContent.trim()) role.remove();
      const icon = $1(".icon");
      const glyph = icon.querySelector("path");
      const IGNITE = isFinite(parseFloat(icon.getAttribute("data-at"))) ? parseFloat(icon.getAttribute("data-at")) : .78;

      // box lands as one unit (name + role ride with it); the icon sits unlit, small
      tl.fromTo($1(".box"), { autoAlpha: 0, scale: .94, y: 12 }, { autoAlpha: 1, scale: 1, y: 0, duration: .32, ease: POP }, .05);
      gsap.set(icon, { scale: .8 });
      // the light changes, the layout does not: icon ignites cream outline -> orange fill
      tl.fromTo(icon, { scale: .8 }, { scale: 1, duration: .24, ease: POP, immediateRender: false }, IGNITE);
      tl.fromTo(glyph, { fill: "rgba(255,138,76,0)", stroke: "#FFF0E6" }, { fill: "#FF8A4C", stroke: "#FF8A4C", duration: .1, ease: "none" }, IGNITE);

      // exit: the icon goes dark first, then the box pops out
      tl.to(glyph, { fill: "rgba(255,138,76,0)", stroke: "#FFF0E6", duration: .08, ease: "none" }, OUT);
      tl.to(icon, { scale: .8, duration: .12, ease: "power2.in" }, OUT);
      tl.to($1(".box"), { autoAlpha: 0, scale: .96, y: 8, duration: .22, ease: "power2.in" }, OUT + .08);
      tl.set({}, {}, DUR);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
    </script>
  </body>
</html>
