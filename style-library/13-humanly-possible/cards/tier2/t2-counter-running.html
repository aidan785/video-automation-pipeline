<!doctype html>
<!--
  Humanly Possible · tier2 · counter · RUNNING
  Proof-forward running counter pinned top-right in the safe margin for a long hold. A compact
  brick plate (10 px radius, flat deep offset because it sits on footage) carries a caps label
  led by the frame's one orange dot, and a Bricolage number that ticks up at each data-at
  moment: the old value slides up and out while the new one slides in (0.2 s). The last value is
  gold (the frame's one gold) and only shows once it lands. Plate and type hold still between
  ticks; it rides across cuts within the same chapter.
  From the October research's "running counter" (DESIGN.md card plan, "proof forward").
  Every value is laid out up front in one fixed window; seeking to any time shows the right one.
  Exit: mirrors the entrance in 0.3 s at the end of DUR (or cut it away with the chapter).
  Slots: label (text, caps, about 18 chars), values (list of <b data-at="seconds">value</b>,
         2 to 8 items, first one shows on entrance; keep values to 5 characters), sub (text,
         optional small line under the number). DUR is extended to cover the last tick + 2 s.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
      #hp-t2-counter-running{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:none;color:var(--fg);font-family:var(--font-body);}

      #hp-t2-counter-running .plate{position:absolute;right:var(--margin);top:var(--margin-y);width:316px;padding:24px 28px 22px;
        background:var(--hp-brick);border-radius:var(--radius);box-shadow:0 8px 0 var(--hp-deep);transform-origin:100% 0;}
      #hp-t2-counter-running .label{display:flex;align-items:center;gap:12px;font-family:var(--font-body);font-weight:600;font-size:18px;line-height:1;
        letter-spacing:.16em;text-transform:uppercase;color:var(--hp-cream);white-space:nowrap;}
      #hp-t2-counter-running .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--hp-orange);}
      /* the fixed number window: values stack in place, only one shows */
      #hp-t2-counter-running .win{position:relative;height:104px;margin-top:12px;overflow:hidden;}
      #hp-t2-counter-running .vals b{position:absolute;left:0;top:0;display:block;font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;
        font-size:104px;line-height:1;letter-spacing:var(--track-display);color:var(--hp-cream);white-space:nowrap;font-variant-numeric:tabular-nums;}
      #hp-t2-counter-running .vals b.last{color:var(--hp-gold);}
      #hp-t2-counter-running .sub{display:block;margin-top:8px;padding-top:12px;border-top:1px solid var(--hp-hairline);font-family:var(--font-body);font-weight:500;font-size:18px;
        line-height:1.2;color:var(--hp-cream-muted);white-space:nowrap;}
    </style>
  </head>
  <body>
    <div id="hp-t2-counter-running" data-composition-id="hp-t2-counter-running" data-start="0" data-width="1920" data-height="1080">
      <div class="plate">
        <span class="label"><i class="dot"></i><span data-slot="label">Hours saved</span></span>
        <div class="win"><div class="vals" data-slot="values">
          <b data-at="0">2</b>
          <b data-at="3.2">5</b>
          <b data-at="6.4">9</b>
          <b data-at="9.2">12</b>
        </div></div>
        <span class="sub" data-slot="sub">Theo's shop class, this term</span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t2-counter-running";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      const $ = (s) => ROOT.querySelectorAll(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const tl = gsap.timeline({ paused: true });

      const sub = $1(".sub");
      if (!sub.textContent.trim()) sub.remove();
      const vals = Array.from($(".vals b")).filter((b) => b.textContent.trim());
      const IN = .1;                      // plate entrance
      // tick times: data-at, or an even 3 s stagger when missing; first value shows with the plate
      const at = vals.map((b, i) => { const a = parseFloat(b.getAttribute("data-at")); return isFinite(a) ? a : i * 3; });
      at[0] = Math.max(at[0], IN);
      for (let i = 1; i < at.length; i++) at[i] = Math.max(at[i], at[i - 1] + .4);
      vals[vals.length - 1].classList.add("last");
      const DUR = Math.max(12, at[at.length - 1] + 2.4);
      const OUT = DUR - .4;

      // initial state: every value parked below the window except the first
      vals.forEach((b, i) => gsap.set(b, { yPercent: i === 0 ? 0 : 100 }));

      // entrance: plate pops down-in from the corner, label then number
      tl.fromTo($1(".plate"), { autoAlpha: 0, y: -10, scale: .96 }, { autoAlpha: 1, y: 0, scale: 1, duration: .3, ease: POP }, IN);
      tl.fromTo($1(".label"), { autoAlpha: 0, y: 6 }, { autoAlpha: 1, y: 0, duration: .25, ease: POP }, IN + .06);
      tl.fromTo(vals[0], { yPercent: 100 }, { yPercent: 0, duration: .25, ease: POP, immediateRender: false }, IN + .1);
      if (sub.isConnected) tl.fromTo(sub, { autoAlpha: 0, y: 6 }, { autoAlpha: 1, y: 0, duration: .25, ease: POP }, IN + .16);

      // ticks: old value slides up out, new slides in, 0.2 s each
      for (let i = 1; i < vals.length; i++) {
        // both values move as one reel (same ease, same start) so they never overlap in the window
        tl.fromTo(vals[i - 1], { yPercent: 0 }, { yPercent: -100, duration: .2, ease: POP, immediateRender: false }, at[i]);
        tl.fromTo(vals[i], { yPercent: 100 }, { yPercent: 0, duration: .2, ease: POP, immediateRender: false }, at[i]);
      }

      // exit: mirror of the entrance
      tl.to([sub.isConnected ? sub : null, $1(".label")].filter(Boolean), { autoAlpha: 0, y: 6, duration: .16, ease: "power2.in" }, OUT);
      tl.to(vals[vals.length - 1], { yPercent: 100, duration: .18, ease: "power2.in" }, OUT);
      tl.to($1(".plate"), { autoAlpha: 0, y: -10, scale: .96, duration: .22, ease: "power2.in" }, OUT + .08);
      tl.set({}, {}, DUR);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
    </script>
  </body>
</html>
