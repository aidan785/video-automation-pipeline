<!doctype html>
<!--
  Humanly Possible · tier1 · list · BUILD
  A numbered list that builds line by line beside a framed clip. Left: three items, each a
  brick number chip and a Bricolage line, popping on at their spoken time (data-at). The
  current item is full cream with an orange chip (the frame's one orange, it travels down
  the list); past items step back to cream 55% on brick chips. Right: a 14 px frame holding
  a stand-in clip that drifts slowly inside the frame and hard-swaps to the next shot on
  each item's time (the frame holds, the content inside changes).
  From Ali Abdaal's numbered list + video card (references/analysis/ali-abdaal.md, inventory 0:07.8;
  references/frames/ali-abdaal_numbered-list-videocard.jpg).
  Slots: kicker (text, small label over the list), items (list of up to 3 .item, each with
         data-at and a .txt richtext; one <em> across the whole card = the gold word),
         media (one <img>/<video> per item inside .frame, data-slot="media-1..3").
  Exit: animated mirror in the last 0.3 s; also safe to cut away.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:var(--hp-oxblood);}
      #hp-t1-list-build{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:var(--hp-oxblood);color:var(--fg);font-family:var(--font-body);}

      #hp-t1-list-build .bg{position:absolute;inset:-5%;will-change:transform;transform-origin:30% 50%;
        background:
          radial-gradient(55% 70% at 22% 45%, rgba(122,30,30,.45) 0%, rgba(122,30,30,0) 100%),
          radial-gradient(80% 60% at 70% 110%, var(--hp-deep) 0%, rgba(44,11,22,0) 100%),
          var(--hp-oxblood);}
      #hp-t1-list-build .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;}

      #hp-t1-list-build .col{position:absolute;left:var(--margin);top:var(--margin-y);bottom:var(--margin-y);width:780px;
        display:flex;flex-direction:column;justify-content:center;}
      #hp-t1-list-build .kicker{font-family:var(--font-body);font-weight:600;font-size:22px;letter-spacing:.16em;text-transform:uppercase;
        color:var(--hp-cream-muted);margin-bottom:44px;white-space:nowrap;}
      #hp-t1-list-build .item{display:flex;align-items:flex-start;gap:32px;margin-bottom:48px;}
      #hp-t1-list-build .item:last-child{margin-bottom:0;}
      #hp-t1-list-build .chip{position:relative;flex:none;width:76px;height:76px;border-radius:var(--radius-sm);background:var(--hp-brick);
        display:flex;align-items:center;justify-content:center;margin-top:2px;}
      #hp-t1-list-build .chip .on{position:absolute;inset:0;border-radius:var(--radius-sm);background:var(--hp-orange);opacity:0;}
      #hp-t1-list-build .chip b{position:relative;font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;font-size:42px;line-height:1;
        letter-spacing:-.02em;color:var(--hp-cream);}
      #hp-t1-list-build .txt{font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;font-size:60px;line-height:1;
        letter-spacing:var(--track-display);color:var(--hp-cream);max-width:660px;padding-bottom:.06em;}
      #hp-t1-list-build .txt em{font-style:normal;color:var(--hp-gold);}

      /* the frame: holds still, its content swaps per item and drifts inside */
      #hp-t1-list-build .frame{position:absolute;left:1000px;top:var(--margin-y);width:804px;height:950px;border-radius:var(--radius-lg);
        overflow:hidden;background:var(--hp-deep);}
      #hp-t1-list-build .frame .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%;will-change:transform;visibility:hidden;}
      #hp-t1-list-build .frame .keyline{position:absolute;inset:0;border-radius:var(--radius-lg);box-shadow:inset 0 0 0 1px var(--hp-hairline);pointer-events:none;}
    </style>
  </head>
  <body>
    <div id="hp-t1-list-build" data-composition-id="hp-t1-list-build" data-start="0" data-width="1920" data-height="1080">
      <div class="bg"></div>

      <div class="col">
        <div class="kicker" data-slot="kicker">Three ways Dana uses it</div>
        <div class="item" data-at="0.7"><div class="chip"><i class="on"></i><b>1</b></div><div class="txt" data-slot="item-1">Answers booking texts while she grooms</div></div>
        <div class="item" data-at="2.1"><div class="chip"><i class="on"></i><b>2</b></div><div class="txt" data-slot="item-2">Writes her weekly shop update</div></div>
        <div class="item" data-at="3.5"><div class="chip"><i class="on"></i><b>3</b></div><div class="txt" data-slot="item-3">Prices every new job in <em>seconds</em></div></div>
      </div>

      <div class="frame">
        <img class="shot" data-slot="media-1" src="../../assets/demo/hands.jpg" alt="" style="object-position:55% 50%" />
        <img class="shot" data-slot="media-2" src="../../assets/demo/place-dana.jpg" alt="" style="object-position:50% 50%" />
        <img class="shot" data-slot="media-3" src="../../assets/demo/plate.jpg" alt="" style="object-position:50% 50%" />
        <i class="keyline"></i>
      </div>

      <svg class="grain" width="1920" height="1080" aria-hidden="true">
        <filter id="hp-t1-list-build-gr" x="0" y="0" width="100%" height="100%">
          <feTurbulence class="turb" type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="1" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="saturate" values="0"/>
          <feComponentTransfer><feFuncR type="linear" slope="1.4" intercept="-.2"/><feFuncG type="linear" slope="1.4" intercept="-.2"/><feFuncB type="linear" slope="1.4" intercept="-.2"/></feComponentTransfer>
        </filter>
        <rect width="1920" height="1080" filter="url(#hp-t1-list-build-gr)"/>
      </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t1-list-build";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      const $ = (s) => ROOT.querySelectorAll(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }

      // drop empty items, then resolve timing (data-at or a 1.4 s stagger)
      Array.from($(".item")).forEach((it) => { if (!it.querySelector(".txt").textContent.trim()) it.remove(); });
      const items = Array.from($(".item"));
      const shots = Array.from($(".frame .shot"));
      let cur = 0.7;
      items.forEach((it) => { const a = parseFloat(it.getAttribute("data-at")); if (!isNaN(a)) cur = a; it.__at = cur; cur += 1.4; });
      const lastAt = items.length ? items[items.length - 1].__at : 0.7;
      const DUR = Math.max(6, lastAt + 2.8);
      const OUT = DUR - 0.3;
      const tl = gsap.timeline({ paused: true });

      // ground drift
      tl.fromTo($1(".bg"), { scale: 1 }, { scale: 1.04, duration: DUR, ease: "none" }, 0);

      // the frame pops first and holds; its first shot is up from the start
      tl.fromTo($1(".frame"), { autoAlpha: 0, scale: .96, y: 12 }, { autoAlpha: 1, scale: 1, y: 0, duration: .42, ease: POP }, .12);
      tl.fromTo($1(".kicker"), { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: .3, ease: POP }, .3);

      // shots: shot i is live from its item's time (shot 0 from frame 0) to the next item; each drifts while live
      shots.forEach((s, i) => {
        const from = i === 0 ? 0 : (items[i] ? items[i].__at : null);
        if (from === null) { s.remove(); return; }
        const to = items[i + 1] ? items[i + 1].__at : DUR;
        tl.set(s, { visibility: "visible" }, from);
        if (items[i + 1]) tl.set(s, { visibility: "hidden" }, to);
        tl.fromTo(s, { scale: 1.02, xPercent: 0 }, { scale: 1.08, xPercent: i % 2 ? 1.2 : -1.2, duration: Math.max(.5, to - from), ease: "none" }, from);
      });

      // items: pop on the spoken time; the active chip goes orange, the previous item steps back
      items.forEach((it, i) => {
        const chip = it.querySelector(".chip"), on = it.querySelector(".chip .on"), txt = it.querySelector(".txt");
        tl.fromTo(chip, { autoAlpha: 0, scale: .92 }, { autoAlpha: 1, scale: 1, duration: .3, ease: POP }, it.__at);
        tl.fromTo(txt, { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: .34, ease: POP }, it.__at + .04);
        tl.fromTo(on, { opacity: 0 }, { opacity: 1, duration: .16, ease: "power1.out" }, it.__at + .06);
        const em = txt.querySelector("em");
        if (em) tl.fromTo(em, { color: "#FFF0E6" }, { color: "#FFC145", duration: .22, ease: POP }, it.__at + .36);
        const prev = items[i - 1];
        if (prev) {
          tl.to(prev.querySelector(".chip .on"), { opacity: 0, duration: .16, ease: "power1.out" }, it.__at + .02);
          tl.to(prev.querySelector(".txt"), { opacity: .55, duration: .22, ease: "power1.out" }, it.__at + .02);
        }
      });

      // exit (mirror, 0.3 s): items drop bottom-up, kicker, then the frame settles out
      tl.to(items.slice().reverse(), { autoAlpha: 0, y: 8, duration: .16, stagger: .03, ease: "power2.in" }, OUT);
      tl.to($1(".kicker"), { autoAlpha: 0, y: 8, duration: .14, ease: "power2.in" }, OUT + .1);
      tl.to($1(".frame"), { autoAlpha: 0, scale: .96, duration: .2, ease: "power2.in" }, OUT + .08);
      tl.set({}, {}, DUR);

      const turb = $1(".turb");
      tl.eventCallback("onUpdate", () => turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97));

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) { tl.seek(parseFloat(location.hash.slice(3)) || 0); turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97); }
    </script>
  </body>
</html>
