<!doctype html>
<!--
  Humanly Possible · tier1 · stat · BURNHERO
  The big hero stat on the burn. The burn is re-anchored bottom-right (--hp-burn-br) so the
  number owns the dark top-left two thirds. The number is the card's only clip-text element,
  filled with --hp-noise-fill; it counts up and, on the frame it lands, one --hp-pass light
  sweep crosses it (light, not layout: the pass is a second background layer on the same
  clip-text element, so it never needs a second clip-text). Small caps label above, sub line
  below in cream 72%. Burn drifts under still type; grain over everything.
  Source: brand (DESIGN.md card plan "stat / burn-hero"; burn + noise-fill + pass from tokens.css).
  Seek-safe: the count is derived from a tweened proxy on every render.
  Exit: mirrors the entrance in 0.3 s; can be cut away.
  Slots: label (text, small caps line above), value (number, e.g. "31", "$2,400", "4.5x";
         prefix/suffix kept), sub (text, one line under the number).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:var(--hp-deep);}
      /* local token: --hp-pass re-stopped with transparent margins so the band never shows the
         edge of its own tile when it is sized to a word (same colors, same 118deg angle) */
      #hp-t1-stat-burnhero{--hp-pass-band:linear-gradient(118deg, transparent 0%, transparent 26%, var(--hp-cream) 42%, var(--hp-orange) 52%, var(--hp-gold) 61%, transparent 74%, transparent 100%);}
      #hp-t1-stat-burnhero{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:var(--hp-deep);color:var(--fg);font-family:var(--font-body);}

      #hp-t1-stat-burnhero .bg{position:absolute;inset:-4%;background:var(--hp-burn-br);transform-origin:92% 100%;will-change:transform;}
      #hp-t1-stat-burnhero .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;}

      #hp-t1-stat-burnhero .stat{position:absolute;left:var(--margin);top:150px;}
      #hp-t1-stat-burnhero .label{display:flex;align-items:center;gap:16px;padding-left:14px;font-family:var(--font-body);font-weight:600;font-size:26px;line-height:1;
        letter-spacing:.18em;text-transform:uppercase;color:var(--hp-cream-muted);white-space:nowrap;}
      /* the one clip-text element: noise fill, plus the pass as a second layer (200% wide; position 170% parks it off the left, -70% off the right) */
      #hp-t1-stat-burnhero .num{display:inline-block;margin-top:6px;padding:0 24px 0 6px;font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;
        font-size:400px;line-height:1.02;letter-spacing:var(--track-tight);white-space:nowrap;font-variant-numeric:tabular-nums;
        --pass-x:170%;
        background-image:var(--hp-pass-band), var(--hp-noise-fill);
        background-size:200% 100%, 100% 100%;
        background-position:var(--pass-x) 0, 0 0;
        background-repeat:no-repeat;
        -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
      #hp-t1-stat-burnhero .sub{display:block;margin-top:14px;padding-left:14px;max-width:1100px;font-family:var(--font-body);font-weight:500;font-size:38px;line-height:1.25;
        color:var(--hp-cream-muted);}
    </style>
  </head>
  <body>
    <div id="hp-t1-stat-burnhero" data-composition-id="hp-t1-stat-burnhero" data-start="0" data-width="1920" data-height="1080">
      <div class="bg"></div>

      <div class="stat">
        <span class="label" data-slot="label">Hours saved a month</span>
        <div><span class="num" data-slot="value">31</span></div>
        <span class="sub" data-slot="sub">Priya, a bookkeeper, lets AI sort the receipts first.</span>
      </div>

      <svg class="grain" width="1920" height="1080" aria-hidden="true">
        <filter id="hp-t1-stat-burnhero-gr" x="0" y="0" width="100%" height="100%">
          <feTurbulence class="turb" type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="1" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="saturate" values="0"/>
          <feComponentTransfer><feFuncR type="linear" slope="1.4" intercept="-.2"/><feFuncG type="linear" slope="1.4" intercept="-.2"/><feFuncB type="linear" slope="1.4" intercept="-.2"/></feComponentTransfer>
        </filter>
        <rect width="1920" height="1080" filter="url(#hp-t1-stat-burnhero-gr)"/>
      </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t1-stat-burnhero";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const DUR = 5.5;
      const OUT = DUR - .5;
      const tl = gsap.timeline({ paused: true });

      function parseNum(str) {
        const m = String(str).trim().match(/^(\D*?)(\d[\d,]*(?:\.\d+)?)(.*)$/);
        if (!m) return null;
        return { pre: m[1], val: parseFloat(m[2].replace(/,/g, "")), dec: (m[2].split(".")[1] || "").length, comma: m[2].indexOf(",") >= 0, suf: m[3] };
      }
      function fmt(p, v) {
        let s = v.toFixed(p.dec);
        if (p.comma) { const parts = s.split("."); s = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (parts[1] ? "." + parts[1] : ""); }
        return p.pre + s + p.suf;
      }
      const num = $1(".num");
      const P = parseNum(num.textContent);
      const proxy = { v: 0 };
      const paint = () => { if (P) num.textContent = fmt(P, proxy.v); };
      const sub = $1(".sub");
      if (!sub.textContent.trim()) sub.remove();

      // count timing; the landing frame is when the shown value first reads as the final value
      const T_COUNT = .3, D_COUNT = 1.4, EASE = "expo.out";
      let tLand = T_COUNT + D_COUNT;
      if (P) {
        const E = gsap.parseEase(EASE), target = fmt(P, P.val);
        for (let i = 0; i <= 240; i++) { if (fmt(P, P.val * E(i / 240)) === target) { tLand = T_COUNT + D_COUNT * i / 240; break; } }
      }

      // ground drift (background layer only)
      tl.fromTo($1(".bg"), { scale: 1 }, { scale: 1.06, duration: DUR, ease: "none" }, 0);

      // 1. label pops, number pops in and counts
      tl.fromTo($1(".label"), { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: .3, ease: POP }, .12);
      tl.fromTo(num, { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: .32, ease: POP }, T_COUNT - .04);
      if (P) tl.fromTo(proxy, { v: 0 }, { v: P.val, duration: D_COUNT, ease: EASE, onUpdate: paint }, T_COUNT);
      // 2. on the landing frame, one light pass crosses the number (light, not layout)
      tl.fromTo(num, { "--pass-x": "170%" }, { "--pass-x": "-70%", duration: .6, ease: "power2.inOut" }, tLand);
      // 3. sub line
      if (sub.isConnected) tl.fromTo(sub, { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: .3, ease: POP }, .62);

      // exit: mirror
      tl.to([sub.isConnected ? sub : null, num, $1(".label")].filter(Boolean), { autoAlpha: 0, y: 8, duration: .2, ease: "power2.in", stagger: .04 }, OUT);
      tl.set({}, {}, DUR);

      const turb = $1(".turb");
      const grain = () => turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97);
      tl.eventCallback("onUpdate", grain);
      const _render = tl.render;
      tl.render = function () { const r = _render.apply(this, arguments); paint(); grain(); return r; };
      paint();

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) { tl.seek(parseFloat(location.hash.slice(3)) || 0); paint(); grain(); }
    </script>
  </body>
</html>
