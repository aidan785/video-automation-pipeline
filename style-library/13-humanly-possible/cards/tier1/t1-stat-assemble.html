<!doctype html>
<!--
  Humanly Possible · tier1 · stat · ASSEMBLE
  A flat gold hero number assembles per character on the empty side of the guest's photo:
  each glyph lands from scale 1.15 and y 20 over 4 frames, 2 frames apart, no blur. A two-line
  caps label wipes in per line 3 frames after the last glyph, and in the same frame as the first
  glyph a source tab pops into the top-left corner (brick chip, the frame's one orange as its
  6 px left bar). Ground: the guest photo, darkened toward the far side into oxblood, drifting
  slowly under still type; grain over everything.
  From Patriot Act's per-character stat + source tab (references/analysis/patriot-act.md,
  signature move 3 + Fit).
  Exit: designed to be cut away (as in the source). A 0.3 s mirrored exit is included at the
  end of DUR for standalone use.
  Slots: media (guest/place photo, 1920x1080 landscape; subject on the left, empty side right),
         value (text, the hero number as typed, e.g. "40%", "6 hrs"; per character), label1 and
         label2 (text, caps label lines), source1 and source2 (text, the source tab lines;
         source2 optional).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:var(--hp-deep);}
      #hp-t1-stat-assemble{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:var(--hp-oxblood);color:var(--fg);font-family:var(--font-body);}

      /* ground: photo drifting on its own layer, darkened toward the empty (right) side */
      #hp-t1-stat-assemble .bg{position:absolute;inset:0;will-change:transform;transform-origin:20% 50%;}
      #hp-t1-stat-assemble .bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:0% 50%;display:block;}
      #hp-t1-stat-assemble .shade{position:absolute;inset:0;pointer-events:none;
        background:
          linear-gradient(90deg, color-mix(in srgb, var(--hp-oxblood) 0%, transparent) 18%, color-mix(in srgb, var(--hp-oxblood) 78%, transparent) 50%, var(--hp-oxblood) 70%),
          linear-gradient(0deg, color-mix(in srgb, var(--hp-deep) 55%, transparent) 0%, color-mix(in srgb, var(--hp-deep) 0%, transparent) 45%),
          color-mix(in srgb, var(--hp-deep) 22%, transparent);}
      #hp-t1-stat-assemble .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;}

      /* source tab: flush to the top-left frame edges, brick chip, orange left bar */
      #hp-t1-stat-assemble .tab{position:absolute;left:0;top:0;display:flex;background:var(--hp-brick);border-radius:0 0 var(--radius-sm) 0;}
      #hp-t1-stat-assemble .tab .bar{flex:none;width:6px;background:var(--hp-orange);}
      #hp-t1-stat-assemble .tab .txt{padding:30px 40px 26px 30px;font-family:var(--font-body);font-weight:600;font-size:18px;line-height:1.35;
        letter-spacing:.14em;text-transform:uppercase;color:var(--hp-cream);white-space:nowrap;}
      #hp-t1-stat-assemble .tab .txt span{display:block;}
      #hp-t1-stat-assemble .tab .txt span + span{color:var(--hp-cream-muted);}

      /* the stat: empty side, baseline about 70% down */
      #hp-t1-stat-assemble .stat{position:absolute;left:1068px;top:372px;}
      #hp-t1-stat-assemble .num{display:block;font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;font-size:260px;line-height:.86;
        letter-spacing:var(--track-tight);color:var(--hp-gold);white-space:nowrap;}
      #hp-t1-stat-assemble .num .g{display:inline-block;transform-origin:50% 70%;}
      #hp-t1-stat-assemble .label{margin-top:34px;padding-left:10px;}
      #hp-t1-stat-assemble .label span{display:block;font-family:var(--font-body);font-weight:600;font-size:44px;line-height:1.12;letter-spacing:.06em;
        text-transform:uppercase;color:var(--hp-cream);white-space:nowrap;}
    </style>
  </head>
  <body>
    <div id="hp-t1-stat-assemble" data-composition-id="hp-t1-stat-assemble" data-start="0" data-width="1920" data-height="1080">
      <div class="bg"><img data-slot="media" src="../../assets/demo/place-dana.jpg" alt="" /></div>
      <div class="shade"></div>

      <div class="tab">
        <i class="bar"></i>
        <div class="txt"><span data-slot="source1">Dana's booking log</span><span data-slot="source2">Jan to Jun 2026</span></div>
      </div>

      <div class="stat">
        <span class="num" data-slot="value">40%</span>
        <div class="label"><span data-slot="label1">Fewer no-shows</span><span data-slot="label2">at the grooming van</span></div>
      </div>

      <svg class="grain" width="1920" height="1080" aria-hidden="true">
        <filter id="hp-t1-stat-assemble-gr" x="0" y="0" width="100%" height="100%">
          <feTurbulence class="turb" type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="1" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="saturate" values="0"/>
          <feComponentTransfer><feFuncR type="linear" slope="1.4" intercept="-.2"/><feFuncG type="linear" slope="1.4" intercept="-.2"/><feFuncB type="linear" slope="1.4" intercept="-.2"/></feComponentTransfer>
        </filter>
        <rect width="1920" height="1080" filter="url(#hp-t1-stat-assemble-gr)"/>
      </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t1-stat-assemble";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      const $ = (s) => ROOT.querySelectorAll(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const F = 1 / 24;                 // one frame at 24 fps
      const DUR = 5;
      const OUT = DUR - .45;
      const tl = gsap.timeline({ paused: true });

      // split the hero number into glyphs (per character is allowed for a hero number only)
      const num = $1(".num");
      const chars = Array.from(num.textContent.trim());
      num.textContent = "";
      chars.forEach((c) => { const g = document.createElement("span"); g.className = "g"; g.textContent = c === " " ? " " : c; num.appendChild(g); });
      const glyphs = $(".num .g");
      ROOT.querySelectorAll(".tab .txt span, .label span").forEach((el) => { if (!el.textContent.trim()) el.remove(); });
      const lines = $(".label span");

      // ground drift (background layer only)
      tl.fromTo($1(".bg"), { scale: 1 }, { scale: 1.045, duration: DUR, ease: "none" }, 0);

      const T0 = .2;
      // 1. glyphs land left to right: 4 frames each, 2 frames apart, no blur
      tl.fromTo(glyphs, { scale: 1.15, y: 20, autoAlpha: 0 }, { scale: 1, y: 0, autoAlpha: 1, duration: 4 * F, ease: POP, stagger: 2 * F }, T0);
      // 2. source tab pops in on the first glyph's frame
      tl.fromTo($1(".tab"), { y: -14, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .25, ease: POP }, T0);
      // 3. label wipes in per line, 3 frames after the last glyph lands
      const lastLand = T0 + (glyphs.length - 1) * 2 * F + 4 * F;
      tl.fromTo(lines, { clipPath: "inset(-10% 100% -10% 0)" }, { clipPath: "inset(-10% 0% -10% 0)", duration: .26, ease: POP, stagger: 3 * F }, lastLand + 3 * F);

      // exit (standalone use; in the edit this is usually a cut): mirror in 0.3 s
      tl.to(Array.from(lines).reverse(), { clipPath: "inset(-10% 100% -10% 0)", duration: .18, ease: "power2.in", stagger: F }, OUT);
      tl.to(Array.from(glyphs).reverse(), { scale: 1.15, y: 20, autoAlpha: 0, duration: 3 * F, ease: "power2.in", stagger: F }, OUT + .06);
      tl.to($1(".tab"), { y: -14, autoAlpha: 0, duration: .18, ease: "power2.in" }, OUT + .12);
      tl.set({}, {}, DUR);

      // grain: deterministic seed stepped at 12 fps
      const turb = $1(".turb");
      tl.eventCallback("onUpdate", () => turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97));

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) { tl.seek(parseFloat(location.hash.slice(3)) || 0); turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97); }
    </script>
  </body>
</html>
