<!doctype html>
<!--
  Humanly Possible · tier1 · diagram · HOW-WIRED
  "How they wired it": three or four flat tool tiles on oxblood, left to right. Each tile is a
  brick body with a cream header strip (Inter Tight 600 label) and a simple cream line icon
  that draws on (stroke-dashoffset). Dashed cream connectors draw left to right (0.4 s each)
  and the next tile pops at each connector's end. One connector is orange: the step that
  matters (the frame's one orange). Headline top-left in Bricolage with one gold word.
  The ground drifts under still tiles; grain on top.
  From Ali Abdaal's node diagram (references/analysis/ali-abdaal.md, move 6 + Fit 6;
  references/frames/ali-abdaal_node-diagram.jpg). No glows, no tool logos, generic names.
  Slots: headline (richtext, one <em> = gold word), tiles (3 to 4 .tile, each: label text,
         note text (short, optional), data-icon = chat | spark | calendar | sheet | mail | phone |
         camera | list, optional data-at). Mark the orange connector with .key on the tile it
         points INTO (default: tile 3).
  Exit: animated mirror in the last 0.3 s; also safe to cut away.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:var(--hp-oxblood);}
      #hp-t1-diagram-howwired{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:var(--hp-oxblood);color:var(--fg);font-family:var(--font-body);}

      #hp-t1-diagram-howwired .bg{position:absolute;inset:-5%;will-change:transform;transform-origin:50% 60%;
        background:
          radial-gradient(60% 50% at 50% 62%, rgba(122,30,30,.42) 0%, rgba(122,30,30,0) 100%),
          radial-gradient(80% 50% at 50% 115%, var(--hp-deep) 0%, rgba(44,11,22,0) 100%),
          var(--hp-oxblood);}
      #hp-t1-diagram-howwired .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;}

      #hp-t1-diagram-howwired .headline{position:absolute;left:var(--margin);top:160px;width:1500px;font-family:var(--font-display);font-weight:800;
        font-variation-settings:"opsz" 96;font-size:84px;line-height:.98;letter-spacing:var(--track-display);color:var(--hp-cream);padding-bottom:.06em;}
      #hp-t1-diagram-howwired .headline em{font-style:normal;color:var(--hp-gold);}

      /* the row of tiles: fixed 4-column grid; with 3 tiles the row recentres (JS sets --n) */
      #hp-t1-diagram-howwired .row{position:absolute;left:var(--margin);right:var(--margin);top:470px;height:420px;}
      #hp-t1-diagram-howwired .tile{position:absolute;top:0;width:300px;}
      #hp-t1-diagram-howwired .card{width:300px;height:240px;border-radius:var(--radius);background:var(--hp-brick);overflow:hidden;}
      #hp-t1-diagram-howwired .head{height:58px;background:var(--hp-cream);display:flex;align-items:center;padding:0 24px;}
      #hp-t1-diagram-howwired .head span{font-family:var(--font-body);font-weight:600;font-size:26px;line-height:1;letter-spacing:-.005em;color:var(--hp-oxblood);white-space:nowrap;}
      #hp-t1-diagram-howwired .body{height:182px;display:flex;align-items:center;justify-content:center;}
      #hp-t1-diagram-howwired .body svg{width:96px;height:96px;display:block;overflow:visible;}
      #hp-t1-diagram-howwired .body svg *{fill:none;stroke:var(--hp-cream);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;}
      #hp-t1-diagram-howwired .note{margin-top:22px;font-family:var(--font-body);font-weight:500;font-size:26px;line-height:1.25;color:var(--hp-cream-muted);width:300px;}

      #hp-t1-diagram-howwired .link{position:absolute;top:100px;height:40px;}
      #hp-t1-diagram-howwired .link svg{display:block;width:100%;height:40px;overflow:visible;}
      #hp-t1-diagram-howwired .link .ln{fill:none;stroke:var(--hp-cream);stroke-width:4;stroke-linecap:round;stroke-dasharray:2 14;}
      #hp-t1-diagram-howwired .link .hd{fill:none;stroke:var(--hp-cream);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
      #hp-t1-diagram-howwired .link.key .ln,#hp-t1-diagram-howwired .link.key .hd{stroke:var(--hp-orange);}
    </style>
  </head>
  <body>
    <div id="hp-t1-diagram-howwired" data-composition-id="hp-t1-diagram-howwired" data-start="0" data-width="1920" data-height="1080">
      <div class="bg"></div>

      <div class="headline" data-slot="headline">How Dana's bookings fill <em>themselves</em></div>

      <div class="row">
        <div class="tile" data-icon="chat" data-at="0.6"><div class="card"><div class="head"><span data-slot="tile-1">Texts</span></div><div class="body"></div></div><div class="note" data-slot="note-1">A client asks for Saturday</div></div>
        <div class="tile" data-icon="spark"><div class="card"><div class="head"><span data-slot="tile-2">Assistant</span></div><div class="body"></div></div><div class="note" data-slot="note-2">Reads it and finds a slot</div></div>
        <div class="tile key" data-icon="calendar"><div class="card"><div class="head"><span data-slot="tile-3">Calendar</span></div><div class="body"></div></div><div class="note" data-slot="note-3">Books it and texts back</div></div>
        <div class="tile" data-icon="sheet"><div class="card"><div class="head"><span data-slot="tile-4">Booking sheet</span></div><div class="body"></div></div><div class="note" data-slot="note-4">Logs every visit</div></div>
      </div>

      <svg class="grain" width="1920" height="1080" aria-hidden="true">
        <filter id="hp-t1-diagram-howwired-gr" x="0" y="0" width="100%" height="100%">
          <feTurbulence class="turb" type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="1" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="saturate" values="0"/>
          <feComponentTransfer><feFuncR type="linear" slope="1.4" intercept="-.2"/><feFuncG type="linear" slope="1.4" intercept="-.2"/><feFuncB type="linear" slope="1.4" intercept="-.2"/></feComponentTransfer>
        </filter>
        <rect width="1920" height="1080" filter="url(#hp-t1-diagram-howwired-gr)"/>
      </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t1-diagram-howwired";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      const $ = (s) => ROOT.querySelectorAll(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }

      // simple line icons (96 x 96 box), every path drawn on with pathLength=1
      const ICONS = {
        chat: '<path d="M14 22 H82 a6 6 0 0 1 6 6 V62 a6 6 0 0 1 -6 6 H40 L24 82 V68 H14 a6 6 0 0 1 -6 -6 V28 a6 6 0 0 1 6 -6 Z"/><path d="M28 40 H68"/><path d="M28 52 H54"/>',
        spark: '<path d="M48 10 C51 34 62 45 86 48 C62 51 51 62 48 86 C45 62 34 51 10 48 C34 45 45 34 48 10 Z"/><path d="M78 12 V26"/><path d="M71 19 H85"/>',
        calendar: '<path d="M16 22 H80 a6 6 0 0 1 6 6 V80 a6 6 0 0 1 -6 6 H16 a6 6 0 0 1 -6 -6 V28 a6 6 0 0 1 6 -6 Z"/><path d="M10 40 H86"/><path d="M30 12 V30"/><path d="M66 12 V30"/><path d="M36 62 L45 71 L62 53"/>',
        sheet: '<path d="M18 10 H62 L80 28 V86 H18 Z"/><path d="M62 10 V28 H80"/><path d="M30 46 H68"/><path d="M30 60 H68"/><path d="M30 74 H54"/>',
        mail: '<path d="M14 24 H82 a4 4 0 0 1 4 4 V70 a4 4 0 0 1 -4 4 H14 a4 4 0 0 1 -4 -4 V28 a4 4 0 0 1 4 -4 Z"/><path d="M12 28 L48 54 L84 28"/>',
        phone: '<path d="M30 8 H66 a6 6 0 0 1 6 6 V82 a6 6 0 0 1 -6 6 H30 a6 6 0 0 1 -6 -6 V14 a6 6 0 0 1 6 -6 Z"/><path d="M42 76 H54"/>',
        camera: '<path d="M12 30 H30 L38 20 H58 L66 30 H84 a4 4 0 0 1 4 4 V76 a4 4 0 0 1 -4 4 H12 a4 4 0 0 1 -4 -4 V34 a4 4 0 0 1 4 -4 Z"/><path d="M48 40 a14 14 0 1 1 0 28 a14 14 0 1 1 0 -28 Z"/>',
        list: '<path d="M36 26 H84"/><path d="M36 48 H84"/><path d="M36 70 H72"/><path d="M14 26 H20"/><path d="M14 48 H20"/><path d="M14 70 H20"/>'
      };

      const row = $1(".row");
      const tiles = Array.from($(".tile")).filter((t) => { if (!t.querySelector(".head span").textContent.trim()) { t.remove(); return false; } return true; }).slice(0, 4);
      const n = tiles.length;
      const W = 1688, TW = 300;                         // row width inside the safe margin, tile width
      const gap = n > 1 ? (W - n * TW) / (n - 1) : 0;   // 4 tiles: 162 px gaps; 3 tiles: 394 px gaps
      tiles.forEach((t, i) => {
        t.style.left = (i * (TW + gap)) + "px";
        const body = t.querySelector(".body");
        body.innerHTML = '<svg viewBox="0 0 96 96">' + (ICONS[t.getAttribute("data-icon")] || ICONS.spark) + "</svg>";
        body.querySelectorAll("path").forEach((p) => { p.setAttribute("pathLength", "1"); p.style.strokeDasharray = "1 1"; p.style.strokeDashoffset = "1"; p.style.opacity = "0"; });
        const note = t.querySelector(".note"); if (note && !note.textContent.trim()) note.remove();
      });
      // connectors between tiles: 18 px clear of each tile, dashed line + chevron head
      const hasKey = tiles.some((t) => t.classList.contains("key"));
      const links = [];
      for (let i = 0; i < n - 1; i++) {
        const x0 = i * (TW + gap) + TW + 18, len = gap - 36;
        const l = document.createElement("div");
        l.className = "link" + ((tiles[i + 1].classList.contains("key") || (!hasKey && i === 1)) ? " key" : "");
        l.style.left = x0 + "px"; l.style.width = len + "px";
        l.innerHTML = '<svg viewBox="0 0 ' + len + ' 40"><path class="ln" d="M2 20 H' + (len - 6) + '"/><path class="hd" d="M' + (len - 16) + ' 8 L' + (len - 3) + ' 20 L' + (len - 16) + ' 32"/></svg>';
        row.appendChild(l); links.push(l);
      }

      // timing: tile 1 at its data-at (or 0.6); each link draws 0.4 s after the previous tile lands
      const T = [];
      let cur = 0.6;
      tiles.forEach((t, i) => {
        const a = parseFloat(t.getAttribute("data-at"));
        if (i === 0) cur = isNaN(a) ? 0.6 : a;
        else cur = isNaN(a) ? cur + 0.85 : Math.max(a, cur + 0.5);
        T.push(cur);
      });
      const DUR = Math.max(6, T[n - 1] + 3);
      const OUT = DUR - 0.3;
      const tl = gsap.timeline({ paused: true });

      tl.fromTo($1(".bg"), { scale: 1 }, { scale: 1.04, duration: DUR, ease: "none" }, 0);
      tl.fromTo($1(".headline"), { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: .4, ease: POP }, .12);
      const em = $1(".headline em");
      if (em) tl.fromTo(em, { color: "#FFF0E6" }, { color: "#FFC145", duration: .22, ease: POP }, .5);

      tiles.forEach((t, i) => {
        const at = T[i];
        if (i > 0) tl.fromTo(links[i - 1], { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: .4, ease: "power2.inOut" }, at - .4);
        tl.fromTo(t.querySelector(".card"), { autoAlpha: 0, scale: .92 }, { autoAlpha: 1, scale: 1, duration: .3, ease: POP }, at);
        tl.set(t.querySelectorAll(".body path"), { opacity: 1 }, at + .14);   // hidden until drawn (round caps would dot a zero-length dash)
        tl.to(t.querySelectorAll(".body path"), { strokeDashoffset: 0, duration: .45, stagger: .08, ease: "power2.out" }, at + .14);
        const note = t.querySelector(".note");
        if (note) tl.fromTo(note, { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: .3, ease: POP }, at + .2);
      });

      // exit (mirror, 0.3 s): right to left, links retract, headline last
      tiles.slice().reverse().forEach((t, k) => tl.to(t, { autoAlpha: 0, scale: .96, duration: .14, ease: "power2.in" }, OUT + k * .03));
      links.forEach((l) => tl.to(l, { clipPath: "inset(0px 100% 0px 0px)", duration: .14, ease: "power2.in" }, OUT + .04));
      tl.to($1(".headline"), { autoAlpha: 0, y: 8, duration: .16, ease: "power2.in" }, OUT + .12);
      tl.set({}, {}, DUR);

      const turb = $1(".turb");
      tl.eventCallback("onUpdate", () => turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97));

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) { tl.seek(parseFloat(location.hash.slice(3)) || 0); turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97); }
    </script>
  </body>
</html>
