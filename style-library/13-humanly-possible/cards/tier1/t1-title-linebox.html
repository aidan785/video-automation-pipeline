<!doctype html>
<!--
  Humanly Possible · tier1 · title · LINEBOX (gold card)
  Episode title takeover. The mark pops on an orange disc, a cream line grows out of it,
  the line opens into the title box, and on exit the box collapses back to a line.
  Burn ground drifts slowly under still type; grain on top. From Great Big Story's
  line-born title box (references/analysis/gbs-memory.md, gbs-marathons.md).
  Slots: title (richtext, one <em> = the gold word), sub (text).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:var(--hp-deep);}
      #hp-t1-title-linebox{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:var(--hp-deep);color:var(--fg);font-family:var(--font-body);}

      /* ground: the burn, drifting on its own layer */
      #hp-t1-title-linebox .bg{position:absolute;inset:-4%;background:var(--hp-burn);transform-origin:8% 100%;will-change:transform;}
      #hp-t1-title-linebox .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;}

      /* the box: top edge = two segments with a gap for the disc; sides + bottom reveal from the top */
      #hp-t1-title-linebox .box{position:absolute;left:216px;top:396px;width:1488px;height:300px;}
      #hp-t1-title-linebox .topline{position:absolute;left:216px;top:396px;width:1488px;height:3px;}
      #hp-t1-title-linebox .edge{position:absolute;top:0;height:3px;background:var(--hp-cream);border-radius:2px;}
      #hp-t1-title-linebox .edge.l{left:0;right:calc(50% + 78px);transform-origin:100% 50%;}
      #hp-t1-title-linebox .edge.r{left:calc(50% + 78px);right:0;transform-origin:0% 50%;}
      #hp-t1-title-linebox .frame{position:absolute;inset:0;border:3px solid var(--hp-cream);border-top:none;border-radius:0 0 var(--radius) var(--radius);}
      #hp-t1-title-linebox .frame::before,#hp-t1-title-linebox .frame::after{content:"";position:absolute;top:0;width:var(--radius);height:var(--radius);border-top:3px solid var(--hp-cream);}
      #hp-t1-title-linebox .frame::before{left:-3px;border-left:3px solid var(--hp-cream);border-top-left-radius:var(--radius);}
      #hp-t1-title-linebox .frame::after{right:-3px;border-right:3px solid var(--hp-cream);border-top-right-radius:var(--radius);}

      #hp-t1-title-linebox .title{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
        font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;font-size:112px;line-height:.95;
        letter-spacing:var(--track-display);color:var(--hp-cream);padding:0 72px;}
      #hp-t1-title-linebox .title em{font-style:normal;color:var(--hp-gold);}

      /* orange disc with the cream mark: the frame's one orange */
      #hp-t1-title-linebox .disc{position:absolute;left:960px;top:396px;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;
        background:var(--hp-orange);display:flex;align-items:center;justify-content:center;}
      #hp-t1-title-linebox .disc svg{width:64px;height:auto;display:block;}

      #hp-t1-title-linebox .sub{position:absolute;left:0;right:0;top:732px;text-align:center;font-family:var(--font-body);font-weight:600;
        font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:var(--hp-cream-muted);}
    </style>
  </head>
  <body>
    <div id="hp-t1-title-linebox" data-composition-id="hp-t1-title-linebox" data-start="0" data-width="1920" data-height="1080">
      <div class="bg"></div>

      <div class="box">
        <div class="frame"></div>
        <div class="title" data-slot="title">She got her <em>Saturdays</em> back</div>
      </div>

      <div class="topline"><i class="edge l"></i><i class="edge r"></i></div>

      <div class="disc">
        <svg viewBox="231 201 426 486" aria-hidden="true"><g fill="#FFF0E6"><path fill-rule="evenodd" d="M231,215 A14,14 0 0 1 245,201 L643,201 A14,14 0 0 1 657,215 L657,613 A14,14 0 0 1 643,627 L481,627 A14,14 0 0 0 467,641 L467,673 A14,14 0 0 1 453,687 L245,687 A14,14 0 0 1 231,673 Z M275,259 A14,14 0 0 1 289,245 L599,245 A14,14 0 0 1 613,259 L613,569 A14,14 0 0 1 599,583 L437,583 A14,14 0 0 0 423,597 L423,629 A14,14 0 0 1 409,643 L289,643 A14,14 0 0 1 275,629 Z"/><path d="M303,287 A14,14 0 0 1 317,273 L381,273 A14,14 0 0 1 395,287 L395,359 A14,14 0 0 0 409,373 L479,373 A14,14 0 0 0 493,359 L493,287 A14,14 0 0 1 507,273 L571,273 A14,14 0 0 1 585,287 L585,541 A14,14 0 0 1 571,555 L507,555 A14,14 0 0 1 493,541 L493,466 A14,14 0 0 0 479,452 L409,452 A14,14 0 0 0 395,466 L395,601 A14,14 0 0 1 381,615 L317,615 A14,14 0 0 1 303,601 Z"/></g></svg>
      </div>

      <div class="sub" data-slot="sub">Episode 03 &nbsp;/&nbsp; Dana Ruiz, dog groomer</div>

      <svg class="grain" width="1920" height="1080" aria-hidden="true">
        <filter id="hp-t1-title-linebox-gr" x="0" y="0" width="100%" height="100%">
          <feTurbulence class="turb" type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="1" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="saturate" values="0"/>
          <feComponentTransfer><feFuncR type="linear" slope="1.4" intercept="-.2"/><feFuncG type="linear" slope="1.4" intercept="-.2"/><feFuncB type="linear" slope="1.4" intercept="-.2"/></feComponentTransfer>
        </filter>
        <rect width="1920" height="1080" filter="url(#hp-t1-title-linebox-gr)"/>
      </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t1-title-linebox";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      const $ = (s) => ROOT.querySelectorAll(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const DUR = 6;
      const OUT = DUR - 0.75;           // exit starts here
      const tl = gsap.timeline({ paused: true });

      // ground drift (background layer only; type never scales)
      tl.fromTo($1(".bg"), { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);

      // 1. disc + mark pop
      tl.fromTo($1(".disc"), { scale: .6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: .38, ease: POP }, .12);
      // 2. the line grows out of the disc
      tl.fromTo($(".edge"), { scaleX: 0 }, { scaleX: 1, duration: .42, ease: POP }, .5);
      // 3. the line opens into the box (sides + bottom reveal downward) and the title unmasks center-out
      tl.fromTo($1(".frame"), { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: .42, ease: POP }, .86);
      tl.fromTo($1(".title"), { clipPath: "inset(0 50% 0 50%)" }, { clipPath: "inset(0 0% 0 0%)", duration: .5, ease: POP }, .92);
      tl.fromTo($1(".sub"), { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: .32, ease: POP }, 1.22);
      // 4. light, not layout: one pass over the gold word after the title lands
      const em = $1(".title em");
      if (em) tl.fromTo(em, { color: "#FFF0E6" }, { color: "#FFC145", duration: .22, ease: POP }, 1.5);

      // exit: mirror of the entrance. title closes center-in, frame retracts up into the line, line retracts into the disc, disc pops out
      tl.to([$1(".sub")], { autoAlpha: 0, duration: .18, ease: "power2.in" }, OUT);
      tl.to($1(".title"), { clipPath: "inset(0 50% 0 50%)", duration: .24, ease: "power2.in" }, OUT + .02);
      tl.to($1(".frame"), { clipPath: "inset(0 0 100% 0)", duration: .24, ease: "power2.in" }, OUT + .08);
      tl.to($(".edge"), { scaleX: 0, duration: .22, ease: "power2.in" }, OUT + .3);
      tl.to($1(".disc"), { scale: .6, autoAlpha: 0, duration: .18, ease: "power2.in" }, OUT + .5);
      tl.set({}, {}, DUR);

      // grain: deterministic seed stepped at 12 fps
      const turb = $1(".turb");
      tl.eventCallback("onUpdate", () => turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97));

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) { tl.seek(parseFloat(location.hash.slice(3)) || 0); turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97); }
    </script>
  </body>
</html>
