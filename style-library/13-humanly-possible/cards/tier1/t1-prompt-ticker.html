<!doctype html>
<!--
  Humanly Possible · tier1 · prompt · TICKER
  The prompt-draft ticker: a tall list of the guest's prompt rewrites in Bricolage 800 cream on
  oxblood, a fixed brick selection bar in the middle of frame. The list steps up one row at a
  time (hard steps, no tween), fast at first (~0.12 s a row) and decelerating, and the final
  draft lands in the bar and flips cream to gold on its landing frame (the frame's one gold).
  Then a caption with an orange dash (the frame's one orange) counts the drafts.
  Comedy and struggle told by type alone. Ground drifts under still type; grain on top.
  From Apple's version-name ticker (references/analysis/apple-students.md, move 3 + Fit 3).
  Slots: drafts (list, 6 to 16 rows, each under ~26 chars; the last row is the keeper),
         caption (richtext; the number lives in <b class="n">; leave it empty to auto-count rows).
  Exit: animated mirror (caption and rows out, the bar collapses to a line) in the last 0.32 s.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:var(--hp-oxblood);}
      #hp-t1-prompt-ticker{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:var(--hp-oxblood);color:var(--fg);font-family:var(--font-body);--row:176px;}

      #hp-t1-prompt-ticker .bg{position:absolute;inset:-4%;will-change:transform;transform-origin:30% 50%;
        background:radial-gradient(90% 70% at 30% 50%, var(--hp-oxblood) 0%, var(--hp-oxblood) 50%, var(--hp-deep) 125%);}
      #hp-t1-prompt-ticker .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;}

      /* the fixed selection bar */
      #hp-t1-prompt-ticker .bar{position:absolute;left:var(--margin);right:var(--margin);top:calc(540px - var(--row) / 2);height:var(--row);
        background:var(--hp-brick);border-radius:var(--radius);transform-origin:50% 50%;}

      /* the list viewport, faded top and bottom */
      #hp-t1-prompt-ticker .view{position:absolute;inset:0;
        -webkit-mask-image:linear-gradient(180deg, transparent 4%, var(--hp-deep) 36%, var(--hp-deep) 64%, transparent 96%);
                mask-image:linear-gradient(180deg, transparent 4%, var(--hp-deep) 36%, var(--hp-deep) 64%, transparent 96%);}
      #hp-t1-prompt-ticker .list{position:absolute;left:var(--margin);right:var(--margin);top:0;}
      #hp-t1-prompt-ticker .row{display:flex;align-items:center;height:var(--row);padding-left:52px;white-space:nowrap;}
      #hp-t1-prompt-ticker .row .n{flex:none;width:104px;font-family:var(--font-body);font-weight:600;font-size:26px;letter-spacing:.12em;color:var(--hp-cream-muted);}
      #hp-t1-prompt-ticker .row .tx{font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;font-size:96px;line-height:1;
        letter-spacing:var(--track-display);color:var(--hp-cream);padding-bottom:6px;}

      /* caption */
      #hp-t1-prompt-ticker .cap{position:absolute;left:calc(var(--margin) + 52px);top:calc(540px + var(--row) / 2 + 56px);display:flex;align-items:center;gap:18px;
        font-family:var(--font-body);font-weight:600;font-size:30px;letter-spacing:.16em;text-transform:uppercase;color:var(--hp-cream);}
      #hp-t1-prompt-ticker .cap .dash{width:44px;height:6px;border-radius:3px;background:var(--hp-orange);display:block;transform-origin:0 50%;}
      #hp-t1-prompt-ticker .cap b{font-weight:700;}
    </style>
  </head>
  <body>
    <div id="hp-t1-prompt-ticker" data-composition-id="hp-t1-prompt-ticker" data-start="0" data-width="1920" data-height="1080">
      <div class="bg"></div>
      <div class="bar"></div>

      <div class="view">
        <div class="list" data-slot="drafts">
          <div class="row">Write a reminder text</div>
          <div class="row">Write a reminder text v2</div>
          <div class="row">Make it friendlier</div>
          <div class="row">Friendlier, less pushy</div>
          <div class="row">Shorter</div>
          <div class="row">Shorter, mention the dog</div>
          <div class="row">Use the dog's name</div>
          <div class="row">Add the time</div>
          <div class="row">No exclamation marks</div>
          <div class="row">One exclamation mark</div>
          <div class="row">Sound like me</div>
          <div class="row">Sound like me, but awake</div>
          <div class="row">Add a way to reschedule</div>
          <div class="row">Reminder text, final final</div>
        </div>
      </div>

      <div class="cap"><i class="dash"></i><span data-slot="caption"><b class="n"></b> drafts later</span></div>

      <svg class="grain" width="1920" height="1080" aria-hidden="true">
        <filter id="hp-t1-prompt-ticker-gr" x="0" y="0" width="100%" height="100%">
          <feTurbulence class="turb" type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="1" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="saturate" values="0"/>
          <feComponentTransfer><feFuncR type="linear" slope="1.4" intercept="-.2"/><feFuncG type="linear" slope="1.4" intercept="-.2"/><feFuncB type="linear" slope="1.4" intercept="-.2"/></feComponentTransfer>
        </filter>
        <rect width="1920" height="1080" filter="url(#hp-t1-prompt-ticker-gr)"/>
      </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t1-prompt-ticker";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      const $ = (s) => ROOT.querySelectorAll(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const ROW = 176;
      const tl = gsap.timeline({ paused: true });

      // rows: wrap text, add the draft number
      const rows = Array.from($(".row"));
      rows.forEach((r, i) => {
        const tx = document.createElement("span"); tx.className = "tx"; while (r.firstChild) tx.appendChild(r.firstChild); r.appendChild(tx);
        const n = document.createElement("span"); n.className = "n"; n.textContent = String(i + 1).padStart(2, "0"); r.insertBefore(n, tx);
      });
      const N = rows.length;
      const num = $1(".cap .n");
      if (num && !num.textContent.trim()) num.textContent = String(N);

      // step schedule: ~0.12 s a row, decelerating into the last row
      const T0 = .7;
      const steps = [];
      let t = T0;
      for (let i = 1; i < N; i++) {
        const k = i / (N - 1);                     // 0..1 through the list
        t += .12 + .36 * Math.pow(k, 3);           // fast, then slows hard at the end
        steps.push(t);
      }
      const T_LAND = steps.length ? steps[steps.length - 1] : T0;
      const DUR = Math.max(5.5, T_LAND + 2.4);
      const OUT = DUR - .32;

      const list = $1(".list");
      const yFor = (i) => 540 - ROW / 2 - i * ROW;

      // ground drift
      tl.fromTo($1(".bg"), { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);

      // bar born from a line, list pops on at row 1
      tl.fromTo($1(".bar"), { scaleY: 3 / ROW, scaleX: .96 }, { scaleY: 1, scaleX: 1, duration: .32, ease: POP }, .1);
      tl.set(list, { y: yFor(0) }, 0);
      rows.forEach((r, i) => tl.set(r, { opacity: i === 0 ? 1 : .42 }, 0));
      tl.fromTo(list, { autoAlpha: 0 }, { autoAlpha: 1, duration: .2, ease: "power1.out" }, .26);

      // stepped ticks (hard steps, no tween)
      steps.forEach((ts, j) => {
        tl.set(list, { y: yFor(j + 1) }, ts);
        tl.set(rows[j], { opacity: .42 }, ts);
        tl.set(rows[j + 1], { opacity: 1 }, ts);
      });
      // landing: the keeper flips to gold
      const last = rows[N - 1].querySelector(".tx");
      tl.fromTo(last, { color: "#FFF0E6" }, { color: "#FFC145", duration: .12, ease: "none" }, T_LAND + .02);

      // caption
      tl.fromTo($1(".cap .dash"), { scaleX: 0 }, { scaleX: 1, duration: .28, ease: POP }, T_LAND + .25);
      tl.fromTo($1(".cap span"), { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: .3, ease: POP }, T_LAND + .3);

      // exit: mirror
      tl.to($1(".cap span"), { autoAlpha: 0, y: 8, duration: .16, ease: "power2.in" }, OUT);
      tl.to($1(".cap .dash"), { scaleX: 0, duration: .16, ease: "power2.in" }, OUT);
      tl.to(list, { autoAlpha: 0, duration: .16, ease: "power2.in" }, OUT + .04);
      tl.to($1(".bar"), { scaleY: 3 / ROW, duration: .2, ease: "power2.in" }, OUT + .1);
      tl.to($1(".bar"), { autoAlpha: 0, duration: .06, ease: "none" }, OUT + .26);
      tl.set({}, {}, DUR);

      const turb = $1(".turb");
      tl.eventCallback("onUpdate", () => turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97));

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) { tl.seek(parseFloat(location.hash.slice(3)) || 0); turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97); }
    </script>
  </body>
</html>
