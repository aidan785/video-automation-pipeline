<!doctype html>
<!--
  Humanly Possible · tier1 · chapter · BRICK-NUMBER
  The brand's chapter card. Brick ground with grain, a big gold chapter number assembling per
  character, the chapter title in cream below it landing word by word, then a short orange rule
  drawing in from the left. A soft deep vignette drifts under still type.
  Exit: mirrored 0.3 s (rule retracts, title and digits drop out in reverse), or cut away.
  Source: brand DESIGN.md components ("Chapter card"), per-character number per DESIGN.md
  (hero numbers only) and Patriot Act move 3's glyph assemble, flattened.
  Slots: label (text), number (number, 1 to 2 digits, each digit in <span class="ch">),
  title (text, words in <span class="w">, data-at per word).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:var(--hp-brick);}
      #hp-t1-chapter-number{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:var(--hp-brick);color:var(--fg);font-family:var(--font-body);}
      #hp-t1-chapter-number .bg{position:absolute;inset:-4%;transform-origin:20% 60%;
        background:radial-gradient(90% 95% at 22% 58%, rgba(44,11,22,0) 40%, rgba(44,11,22,.55) 100%);}
      #hp-t1-chapter-number .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;}

      #hp-t1-chapter-number .block{position:absolute;left:var(--margin);right:var(--margin);bottom:168px;}
      #hp-t1-chapter-number .label{display:block;font-weight:700;font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:var(--hp-cream-muted);margin-left:14px;}
      #hp-t1-chapter-number .num{display:flex;margin-top:6px;font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;font-size:360px;line-height:.86;
        letter-spacing:-.05em;color:var(--hp-gold);}
      #hp-t1-chapter-number .num .ch{display:block;transform-origin:50% 85%;}
      #hp-t1-chapter-number .title{margin-top:40px;max-width:1500px;font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;font-size:108px;line-height:.98;
        letter-spacing:var(--track-display);color:var(--hp-cream);}
      #hp-t1-chapter-number .title .w{display:inline-block;margin-right:.22em;transform-origin:0 80%;}
      #hp-t1-chapter-number .rule{display:block;margin-top:52px;margin-left:6px;width:132px;height:8px;border-radius:4px;background:var(--hp-orange);transform-origin:0 50%;}
    </style>
  </head>
  <body>
    <div id="hp-t1-chapter-number" data-composition-id="hp-t1-chapter-number" data-start="0" data-width="1920" data-height="1080">
      <div class="bg"></div>

      <div class="block">
        <span class="label" data-slot="label">Chapter</span>
        <div class="num" data-slot="number"><span class="ch">0</span><span class="ch">2</span></div>
        <div class="title" data-slot="title"><span class="w" data-at=".62">The</span><span class="w" data-at=".78">front</span><span class="w" data-at=".96">desk</span><span class="w" data-at="1.14">answers</span><span class="w" data-at="1.4">itself</span></div>
        <i class="rule"></i>
      </div>

      <svg class="grain" width="1920" height="1080" aria-hidden="true">
        <filter id="hp-t1-chapter-number-gr" x="0" y="0" width="100%" height="100%">
          <feTurbulence class="turb" type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="1" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="saturate" values="0"/>
          <feComponentTransfer><feFuncR type="linear" slope="1.4" intercept="-.2"/><feFuncG type="linear" slope="1.4" intercept="-.2"/><feFuncB type="linear" slope="1.4" intercept="-.2"/></feComponentTransfer>
        </filter>
        <rect width="1920" height="1080" filter="url(#hp-t1-chapter-number-gr)"/>
      </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t1-chapter-number";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      const $ = (s) => ROOT.querySelectorAll(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }
      const DUR = 4.5;
      const OUT = DUR - 0.4;
      const tl = gsap.timeline({ paused: true });

      tl.fromTo($1(".bg"), { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);

      tl.fromTo($1(".label"), { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: .28, ease: POP }, .1);
      // per-character assemble: 4 frames per glyph, 2-frame stagger, no blur
      const chars = Array.from($(".num .ch"));
      tl.fromTo(chars, { autoAlpha: 0, y: 24, scale: 1.12 }, { autoAlpha: 1, y: 0, scale: 1, duration: .2, ease: POP, stagger: .085 }, .2);
      // title per word on data-at
      const words = Array.from($(".title .w"));
      let lastAt = 0;
      words.forEach((w, i) => {
        const a = parseFloat(w.dataset.at); const t = isNaN(a) ? .62 + i * .16 : a; lastAt = Math.max(lastAt, t);
        tl.fromTo(w, { autoAlpha: 0, y: 12, scale: .95 }, { autoAlpha: 1, y: 0, scale: 1, duration: .3, ease: POP }, t);
      });
      tl.fromTo($1(".rule"), { scaleX: 0 }, { scaleX: 1, duration: .34, ease: POP }, lastAt + .22);

      // exit: mirror
      tl.to($1(".rule"), { scaleX: 0, duration: .14, ease: "power2.in" }, OUT);
      tl.to(words.slice().reverse(), { autoAlpha: 0, y: 12, scale: .95, duration: .14, ease: "power2.in", stagger: .025 }, OUT + .05);
      tl.to(chars.slice().reverse(), { autoAlpha: 0, y: 24, scale: 1.12, duration: .14, ease: "power2.in", stagger: .04 }, OUT + .14);
      tl.to($1(".label"), { autoAlpha: 0, duration: .12, ease: "power2.in" }, OUT + .18);
      tl.set({}, {}, DUR);

      const turb = $1(".turb");
      tl.eventCallback("onUpdate", () => turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97));

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) { tl.seek(parseFloat(location.hash.slice(3)) || 0); turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97); }
    </script>
  </body>
</html>
