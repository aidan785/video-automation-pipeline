<!doctype html>
<!--
  Humanly Possible · tier1 · quote · MARK
  The brand quote card. A large orange opening quote mark pops first (the frame's one orange),
  then the quote lands line by line in cream Bricolage, short and big, with one gold word.
  The guest's portrait sits cropped on a brick panel on the right; the panel is born from a
  3 px line and the photo drifts slowly inside it while the type holds still. Speaker and
  episode in cream 72% under the quote, the small mark bottom-right.
  From the brand quote card (references/brand/), composed against the ink-fill so the two
  never look alike: this one is a statement, the ink-fill is a sentence being spoken.
  Slots: quote (list of lines, each <span class="ln" data-at="s">; one <em> = the gold word),
         by (text, speaker), ep (text, episode line), media (portrait image, any aspect; cover-cropped).
  Exit: animated mirror in the last 0.3 s; also safe to cut away.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:var(--hp-oxblood);}
      #hp-t1-quote-mark{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:var(--hp-oxblood);color:var(--fg);font-family:var(--font-body);}

      #hp-t1-quote-mark .bg{position:absolute;inset:-5%;will-change:transform;transform-origin:0% 100%;
        background:
          radial-gradient(70% 80% at 0% 100%, var(--hp-deep) 0%, rgba(44,11,22,0) 100%),
          radial-gradient(50% 60% at 40% 10%, rgba(122,30,30,.4) 0%, rgba(122,30,30,0) 100%),
          var(--hp-oxblood);}
      #hp-t1-quote-mark .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;}

      /* the big opening mark: the one orange */
      #hp-t1-quote-mark .qm{position:absolute;left:96px;top:22px;font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;
        font-size:360px;line-height:1;letter-spacing:0;color:var(--hp-orange);transform-origin:30% 40%;}

      #hp-t1-quote-mark .quote{position:absolute;left:var(--margin);top:370px;width:1040px;font-family:var(--font-display);font-weight:800;
        font-variation-settings:"opsz" 96;font-size:112px;line-height:.98;letter-spacing:var(--track-display);color:var(--hp-cream);}
      #hp-t1-quote-mark .quote .ln{display:block;white-space:nowrap;padding-bottom:.04em;}
      #hp-t1-quote-mark .quote em{font-style:normal;color:var(--hp-gold);}

      #hp-t1-quote-mark .meta{position:absolute;left:var(--margin);bottom:128px;}
      #hp-t1-quote-mark .by{display:block;font-family:var(--font-body);font-weight:700;font-size:34px;line-height:1.2;color:var(--hp-cream-muted);white-space:nowrap;}
      #hp-t1-quote-mark .ep{display:block;margin-top:10px;font-family:var(--font-body);font-weight:600;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--hp-cream-muted);white-space:nowrap;}

      /* the portrait panel: brick, born from a line at its left edge */
      #hp-t1-quote-mark .panel{position:absolute;left:1260px;top:var(--margin-y);width:544px;height:836px;border-radius:var(--radius-lg);background:var(--hp-brick);overflow:hidden;}
      #hp-t1-quote-mark .photo{position:absolute;left:24px;top:24px;right:24px;bottom:24px;border-radius:var(--radius);overflow:hidden;background:var(--hp-deep);}
      #hp-t1-quote-mark .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;transform-origin:50% 35%;will-change:transform;}

      #hp-t1-quote-mark .mark{position:absolute;right:var(--margin);bottom:var(--margin-y);width:44px;height:auto;display:block;}
    </style>
  </head>
  <body>
    <div id="hp-t1-quote-mark" data-composition-id="hp-t1-quote-mark" data-start="0" data-width="1920" data-height="1080">
      <div class="bg"></div>

      <div class="qm" aria-hidden="true">&ldquo;</div>

      <div class="quote" data-slot="quote">
        <span class="ln" data-at="0.55">I didn't hire help.</span>
        <span class="ln" data-at="1.05">I got my <em>evenings</em></span>
        <span class="ln" data-at="1.45">back instead.</span>
      </div>

      <div class="meta">
        <span class="by" data-slot="by">Frank Doyle, baker</span>
        <span class="ep" data-slot="ep">Episode 05 &nbsp;/&nbsp; The midnight orders</span>
      </div>

      <div class="panel">
        <div class="photo"><img data-slot="media" src="../../assets/demo/baker.jpg" alt="" /></div>
      </div>

      <svg class="mark" viewBox="231 201 426 486" aria-hidden="true"><g fill="#FFF0E6"><path fill-rule="evenodd" d="M231,215 A14,14 0 0 1 245,201 L643,201 A14,14 0 0 1 657,215 L657,613 A14,14 0 0 1 643,627 L481,627 A14,14 0 0 0 467,641 L467,673 A14,14 0 0 1 453,687 L245,687 A14,14 0 0 1 231,673 Z M275,259 A14,14 0 0 1 289,245 L599,245 A14,14 0 0 1 613,259 L613,569 A14,14 0 0 1 599,583 L437,583 A14,14 0 0 0 423,597 L423,629 A14,14 0 0 1 409,643 L289,643 A14,14 0 0 1 275,629 Z"/><path d="M303,287 A14,14 0 0 1 317,273 L381,273 A14,14 0 0 1 395,287 L395,359 A14,14 0 0 0 409,373 L479,373 A14,14 0 0 0 493,359 L493,287 A14,14 0 0 1 507,273 L571,273 A14,14 0 0 1 585,287 L585,541 A14,14 0 0 1 571,555 L507,555 A14,14 0 0 1 493,541 L493,466 A14,14 0 0 0 479,452 L409,452 A14,14 0 0 0 395,466 L395,601 A14,14 0 0 1 381,615 L317,615 A14,14 0 0 1 303,601 Z"/></g></svg>

      <svg class="grain" width="1920" height="1080" aria-hidden="true">
        <filter id="hp-t1-quote-mark-gr" x="0" y="0" width="100%" height="100%">
          <feTurbulence class="turb" type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="1" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="saturate" values="0"/>
          <feComponentTransfer><feFuncR type="linear" slope="1.4" intercept="-.2"/><feFuncG type="linear" slope="1.4" intercept="-.2"/><feFuncB type="linear" slope="1.4" intercept="-.2"/></feComponentTransfer>
        </filter>
        <rect width="1920" height="1080" filter="url(#hp-t1-quote-mark-gr)"/>
      </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const ID = "hp-t1-quote-mark";
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      const $ = (s) => ROOT.querySelectorAll(s);
      let POP = "power3.out";
      if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("hpPop", ".2,.9,.25,1"); POP = "hpPop"; }

      // lines: data-at or an even 0.45 s stagger after the mark lands
      const lines = Array.from($(".quote .ln"));
      let cur = 0.55;
      lines.forEach((l) => { const a = parseFloat(l.getAttribute("data-at")); if (!isNaN(a)) cur = a; l.__at = cur; cur += 0.45; });
      const lastAt = lines.length ? lines[lines.length - 1].__at : 0.55;
      const META = lastAt + 0.45;
      const DUR = Math.max(5.5, META + 3);
      const OUT = DUR - 0.3;
      const tl = gsap.timeline({ paused: true });

      // the world drifts: ground and the photo inside its frame
      tl.fromTo($1(".bg"), { scale: 1 }, { scale: 1.04, duration: DUR, ease: "none" }, 0);
      tl.fromTo($1(".photo img"), { scale: 1.02, yPercent: 0 }, { scale: 1.07, yPercent: -1.5, duration: DUR, ease: "none" }, 0);

      // 1. the orange mark pops first
      tl.fromTo($1(".qm"), { autoAlpha: 0, scale: .92, y: 12 }, { autoAlpha: 1, scale: 1, y: 0, duration: .36, ease: POP }, .1);
      // 2. the panel is born from a 3 px line at its left edge and opens right
      // (px values throughout so GSAP can interpolate the inset; panel is 544 x 836)
      tl.fromTo($1(".panel"), { clipPath: "inset(418px 541px 418px 0px round 2px)" }, { clipPath: "inset(0px 541px 0px 0px round 2px)", duration: .22, ease: POP }, .22);
      tl.to($1(".panel"), { clipPath: "inset(0px 0px 0px 0px round 14px)", duration: .42, ease: POP }, .44);
      // 3. quote per line on its spoken time
      lines.forEach((l) => tl.fromTo(l, { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: .32, ease: POP }, l.__at));
      // light, not layout: the gold word flips from cream on its line's landing
      const em = $1(".quote em");
      if (em) { const host = em.closest(".ln"); tl.fromTo(em, { color: "#FFF0E6" }, { color: "#FFC145", duration: .22, ease: POP }, (host ? host.__at : lastAt) + .3); }
      // 4. speaker, episode, the small mark
      tl.fromTo($1(".by"), { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: .3, ease: POP }, META);
      tl.fromTo($1(".ep"), { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: .3, ease: POP }, META + .1);
      tl.fromTo($1(".mark"), { autoAlpha: 0, scale: .92 }, { autoAlpha: 1, scale: 1, duration: .3, ease: POP }, META + .2);

      // exit (mirror, 0.3 s): meta and lines drop, panel collapses back to its line, mark pops out last
      tl.to([$1(".mark"), $1(".ep"), $1(".by")], { autoAlpha: 0, y: 8, duration: .16, ease: "power2.in" }, OUT);
      tl.to(lines.slice().reverse(), { autoAlpha: 0, y: 8, duration: .16, stagger: .03, ease: "power2.in" }, OUT + .02);
      tl.to($1(".panel"), { clipPath: "inset(0px 541px 0px 0px round 2px)", duration: .16, ease: "power2.in" }, OUT + .02);
      tl.to($1(".panel"), { clipPath: "inset(418px 541px 418px 0px round 2px)", duration: .1, ease: "power2.in" }, OUT + .18);
      tl.to($1(".qm"), { autoAlpha: 0, scale: .92, duration: .16, ease: "power2.in" }, OUT + .12);
      tl.set({}, {}, DUR);

      const turb = $1(".turb");
      tl.eventCallback("onUpdate", () => turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97));

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) { tl.seek(parseFloat(location.hash.slice(3)) || 0); turb.setAttribute("seed", 1 + Math.floor(tl.time() * 12) % 97); }
    </script>
  </body>
</html>
