<!doctype html>
<!--
  Humanly Possible style sampler · KINETIC COLOR BLOCKS (8 s, 24 fps, 192 frames)
  Built frame by frame from raw-media/hp-sampler-refs/kinetic-blocks/ANALYSIS.md
  (Burger King rebrand intro by JKR, Spotify Wrapped case studies).
  Every change is scheduled on an exact frame with tl.set (no easing tweens), so the
  timeline renders identically at any seek. "Eased" moves are sampled per frame.
  F numbers below are 1-based frames; time = (F-1)/24.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#2C0B16;}
      #hp-sample-kinetic{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;
        --oxblood:#4B1526;--cream:#FFF0E6;--brick:#7A1E1E;--orange:#FF8A4C;--gold:#FFC145;--deep:#2C0B16;
        font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"opsz" 96;}
      #hp-sample-kinetic .field{position:absolute;inset:0;background:var(--oxblood);}
      #hp-sample-kinetic .layer{position:absolute;inset:0;opacity:0;}
      #hp-sample-kinetic .disp{font-weight:800;letter-spacing:-.03em;line-height:1;white-space:nowrap;}

      /* moment 1 */
      #hp-sample-kinetic .dana{position:absolute;left:0;right:0;top:600px;transform:translateY(-78%);text-align:center;font-size:220px;color:var(--cream);}
      #hp-sample-kinetic .ruiz{position:absolute;left:50%;top:50%;font-size:1000px;letter-spacing:-.045em;transform-origin:50% 50%;color:var(--brick);}
      #hp-sample-kinetic .typed{position:absolute;left:140px;top:0;font-size:120px;color:var(--deep);letter-spacing:-.03em;}
      #hp-sample-kinetic .typed .l1{position:absolute;left:0;top:375px;}
      #hp-sample-kinetic .typed .l2{position:absolute;left:0;top:505px;}
      #hp-sample-kinetic .cut{position:absolute;top:90px;height:1500px;width:auto;}

      /* transition stripes */
      #hp-sample-kinetic .bar{position:absolute;left:0;width:1920px;height:360px;}

      /* moment 2 */
      #hp-sample-kinetic .glyph{position:absolute;font-size:3700px;letter-spacing:0;line-height:1;}
      #hp-sample-kinetic .band{position:absolute;left:0;width:1920px;height:216px;overflow:hidden;}
      #hp-sample-kinetic .band .row{position:absolute;top:50%;left:0;font-size:262px;line-height:1;transform:translateY(-52%);white-space:nowrap;}
      #hp-sample-kinetic .hrs{position:absolute;left:0;right:0;top:430px;text-align:center;font-size:170px;color:var(--brick);}
      #hp-sample-kinetic .back{position:absolute;left:0;right:0;top:640px;text-align:center;font-size:300px;}
      #hp-sample-kinetic .back i{font-style:normal;visibility:hidden;}

      /* moment 3 */
      #hp-sample-kinetic .pill{position:absolute;left:150px;top:470px;width:1620px;height:140px;border-radius:70px;background:var(--oxblood);}
      #hp-sample-kinetic .prompt{position:absolute;left:210px;top:470px;height:140px;line-height:140px;font-family:"Inter Tight",sans-serif;font-weight:500;font-size:58px;color:var(--cream);white-space:nowrap;letter-spacing:-.005em;}
      #hp-sample-kinetic .card{position:absolute;left:150px;top:300px;width:1620px;height:auto;border-radius:32px;background:var(--cream);padding:84px 96px;
        font-family:"Inter Tight",sans-serif;font-weight:400;font-size:64px;line-height:1.3;color:var(--deep);letter-spacing:-.012em;}
      #hp-sample-kinetic .card p{margin:0 0 40px;color:rgba(44,11,22,.62);}
      #hp-sample-kinetic .hl{position:relative;display:inline-block;}
      #hp-sample-kinetic .hl b{position:absolute;left:-8px;right:-8px;top:2px;bottom:0;background:var(--gold);transform-origin:0 50%;transform:scaleX(0);z-index:0;}
      #hp-sample-kinetic .hl span{position:relative;z-index:1;}
    </style>
  </head>
  <body>
    <div id="hp-sample-kinetic" data-composition-id="hp-sample-kinetic" data-start="0" data-width="1920" data-height="1080">
      <div class="field"></div>

      <div class="layer m1a"><div class="dana disp">Dana</div></div>
      <div class="layer m1b"><div class="ruiz disp">RUIZ</div></div>
      <div class="layer m1c">
        <div class="typed disp"><span class="l1"></span><span class="l2"></span></div>
        <img class="cut" src="assets/dana-cut-birefnet-portrait.png" alt="" />
      </div>

      <div class="layer m2a"><div class="glyph disp g1">6</div></div>
      <div class="layer m2b"><div class="glyph disp g2">6</div></div>
      <div class="layer m2c bands"></div>
      <div class="layer m2d">
        <div class="hrs disp">6 hours a week</div>
        <div class="back disp"><i>b</i><i>a</i><i>c</i><i>k</i><i>.</i></div>
      </div>

      <div class="layer m3a"><div class="pill"></div><div class="prompt"></div></div>
      <div class="layer m3b">
        <div class="card">
          <p>Hi! Just a reminder that Biscuit is booked for tomorrow at 10.</p>
          <span class="hl h1"><b></b><span>Reply C to confirm, or R and</span></span><br />
          <span class="hl h2"><b></b><span>we'll find a new time.</span></span>
        </div>
      </div>

      <div class="layer bars"><div class="bar b1" style="top:0;background:#7A1E1E"></div><div class="bar b2" style="top:360px;background:#4B1526"></div><div class="bar b3" style="top:720px;background:#FFC145"></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp-sample-kinetic", FPS = 24, N = 192;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s), $ = (s) => ROOT.querySelectorAll(s);
      const C = { oxblood:"#4B1526", cream:"#FFF0E6", brick:"#7A1E1E", orange:"#FF8A4C", gold:"#FFC145", deep:"#2C0B16", tint:"#FFDA85" };
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;                       // frame -> seconds
      const at = (F, el, v) => tl.set(el, v, T(F));
      const show = (F, sel) => at(F, $1(sel), { opacity: 1 });
      const hide = (F, sel) => at(F, $1(sel), { opacity: 0 });
      const field = (F, c) => at(F, $1(".field"), { backgroundColor: c });
      // sample an eased move on ones: from F0 for n frames, value(k) with k in 0..1
      function sample(F0, n, ease, fn) { const e = gsap.parseEase(ease); for (let i = 0; i <= n; i++) fn(F0 + i, e(i / n)); }

      // start state
      tl.set($(".layer"), { opacity: 0 }, 0);
      tl.set($(".bar"), { x: -1960 }, 0);

      // ---------- MOMENT 1: name (F1-F60) ----------
      field(1, C.oxblood); show(1, ".m1a");                                 // F1-8 "Dana", arrives placed
      hide(9, ".m1a"); field(9, C.cream); show(9, ".m1b");                  // F9-11 RUIZ small, held
      const ruiz = $1(".ruiz");
      const S0 = .222, S1 = 1.32;                                            // ~530 px wide -> ~2190 px (bleeds both sides)
      at(9, ruiz, { xPercent: -50, yPercent: -50, scale: S0, color: C.brick });
      // F12-21 slam: sharp ease-out, ~85% of the way by F14
      sample(11, 10, "expo.out", (F, k) => at(F, ruiz, { scale: S0 + (S1 - S0) * k }));
      // F25 + F28 one-frame inverts
      at(25, $1(".field"), { backgroundColor: C.oxblood }); at(25, ruiz, { color: C.cream });
      at(26, $1(".field"), { backgroundColor: C.cream });   at(26, ruiz, { color: C.brick });
      at(28, $1(".field"), { backgroundColor: C.oxblood }); at(28, ruiz, { color: C.cream });
      // F29-31 breath: empty orange
      hide(29, ".m1b"); field(29, C.orange);
      // F32-51 type "Dog groomer / in Tulsa", one character per frame; F32-44 cutout slides in
      show(32, ".m1c");
      const l1 = "Dog groomer", l2 = "in Tulsa", L1 = $1(".l1"), L2 = $1(".l2");
      for (let i = 0; i <= l1.length + l2.length; i++) {
        const F = 32 + i;
        at(F, L1, { textContent: l1.slice(0, Math.min(i, l1.length)) });
        at(F, L2, { textContent: i > l1.length ? l2.slice(0, i - l1.length) : "" });
      }
      const cut = $1(".cut");
      sample(32, 12, "power3.out", (F, k) => at(F, cut, { x: 2300 + (980 - 2300) * k }));
      // F45-60 dead hold

      // ---------- TRANSITION 1 -> 2: stacked stripe wipe (F61-F72) ----------
      show(61, ".bars");
      [[".b1", 61], [".b2", 63], [".b3", 65]].forEach(([s, F0]) => sample(F0, 8, "power3.out", (F, k) => at(F, $1(s), { x: -1960 * (1 - k) })));

      // ---------- MOMENT 2: number (F73-F120) ----------
      hide(73, ".m1c"); hide(73, ".bars"); field(73, C.gold); show(73, ".m2a");
      const g1 = $1(".g1"), g2 = $1(".g2");
      at(73, g1, { color: C.brick, left: 380, top: -1150 });               // top bowl of a giant 6
      for (let F = 73; F <= 80; F++) at(F, g1, { y: -40 * (F - 73) / 7 });
      hide(81, ".m2a"); field(81, C.cream); show(81, ".m2b");
      at(81, g2, { color: C.oxblood, left: -260, top: -2350 });            // lower curve
      for (let F = 81; F <= 88; F++) at(F, g2, { x: -40 * (F - 81) / 7 });

      // F89-108 repeated-word bands, rows slide on twos in alternating directions
      hide(89, ".m2b"); show(89, ".m2c");
      const bands = $1(".bands"), cols = [C.oxblood, C.orange, C.gold, C.brick, C.deep], ink = [C.cream, C.deep, C.deep, C.cream, C.cream];
      const offs = [0, -480, -160, -640, -320], rows = [];
      cols.forEach((c, i) => {
        const b = document.createElement("div"); b.className = "band"; b.style.top = (i * 216) + "px"; b.style.background = c;
        const r = document.createElement("div"); r.className = "row disp"; r.style.color = ink[i];
        r.textContent = "6 HOURS A WEEK  6 HOURS A WEEK  6 HOURS A WEEK  6 HOURS A WEEK";
        b.appendChild(r); bands.appendChild(b); rows.push(r);
      });
      for (let F = 89; F <= 108; F++) {
        const step = Math.floor((F - 89) / 2);                              // changes every other frame
        rows.forEach((r, i) => at(F, r, { x: offs[i] + (i % 2 ? 1 : -1) * 24 * step }));
      }
      // F109 gold field, "6 hours a week"; F109-114 "back." one letter per frame, tint then brick
      hide(109, ".m2c"); field(109, C.gold); show(109, ".m2d");
      $(".back i").forEach((ch, i) => {
        at(109 + i, ch, { visibility: "visible", color: C.tint });
        at(111 + i, ch, { color: C.brick });
      });

      // ---------- TRANSITION 2 -> 3: hard cut to deep (F121) ----------
      hide(121, ".m2d"); field(121, C.deep);

      // ---------- MOMENT 3: AI screen (F121-F192) ----------
      show(124, ".m3a");
      const prompt = "Write a friendly reminder text for tomorrow's grooms", P = $1(".prompt");
      at(124, P, { textContent: "" });
      for (let F = 124; F <= 151; F++) at(F, P, { textContent: prompt.slice(0, Math.min(prompt.length, (F - 123) * 2)) });
      // F162 hard cut to the answer card; F166-181 gold block grows line by line, 8 f per line
      hide(162, ".m3a"); show(162, ".m3b");
      [[".h1 b", 166], [".h2 b", 174]].forEach(([s, F0]) => sample(F0, 7, "power2.out", (F, k) => at(F, $1(s), { scaleX: k })));
      // F182-192 dead hold
      tl.set({}, {}, N / FPS);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
