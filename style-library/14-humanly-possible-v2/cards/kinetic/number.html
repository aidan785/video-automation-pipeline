<!doctype html>
<!--
  Humanly Possible v2 · KINETIC · number (tier1, 76 frames = 3.17 s at 24 fps)
  Moment 2 of the verified sampler (style-library/13-humanly-possible/sampler/kinetic-blocks.html),
  rebased to F1 (sampler F73 = F1). Research: raw-media/hp-sampler-refs/kinetic-blocks/ANALYSIS.md.
    F1-F8    gold field, extreme crop of the top bowl of the digit, drifts 40 px up      (bk_rebrand_f285_giant-glyph-crop)
    F9-F16   cream field, crop of the lower curve, drifts 40 px left
    F17-F36  the number repeated in 5 bands, rows slide on twos, alternating            (wrapped_onplatform_f780_number-stripes)
    F37      gold field, number line placed
    F37-F42  kicker types one letter per frame, each in tint stepping to brick in 2 f   (bk_rebrand_f198_thanever-letter-tint)
    F43-F66  dead hold (1 s read)
    F67-F76  clean ending: orange circle grows from the period of the kicker and fills the frame in 10 f,
             accelerating (wrapped10yrs_f286_circle-iris). Hand off to the next card on the full orange field,
             or cut at F66 for a hard-cut exit.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#2C0B16;}
      #hp2-kinetic-number{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;
        --oxblood:#4B1526;--cream:#FFF0E6;--brick:#7A1E1E;--orange:#FF8A4C;--gold:#FFC145;--deep:#2C0B16;
        font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"opsz" 96;}
      #hp2-kinetic-number .field{position:absolute;inset:0;background:var(--gold);}
      #hp2-kinetic-number .layer{position:absolute;inset:0;opacity:0;}
      #hp2-kinetic-number .disp{font-weight:800;letter-spacing:-.03em;line-height:1;white-space:nowrap;}
      #hp2-kinetic-number .glyph{position:absolute;font-size:3700px;letter-spacing:0;line-height:1;}
      #hp2-kinetic-number .band{position:absolute;left:0;width:1920px;height:216px;overflow:hidden;}
      #hp2-kinetic-number .band .row{position:absolute;top:50%;left:0;font-size:262px;line-height:1;transform:translateY(-52%);white-space:nowrap;}
      #hp2-kinetic-number .hrs{position:absolute;left:0;right:0;top:430px;text-align:center;font-size:170px;color:var(--brick);}
      #hp2-kinetic-number .back{position:absolute;left:0;right:0;top:640px;text-align:center;font-size:300px;}
      #hp2-kinetic-number .back i{font-style:normal;visibility:hidden;}
      #hp2-kinetic-number .iris{position:absolute;inset:0;background:var(--orange);--r:0px;--cx:960px;--cy:900px;
        --rmax:1400px;clip-path:circle(calc(var(--k, 0) * var(--rmax) + 14px) at var(--cx) var(--cy));}
    </style>
  </head>
  <body>
    <div id="hp2-kinetic-number" data-composition-id="hp2-kinetic-number" data-start="0" data-width="1920" data-height="1080">
      <div class="field"></div>
      <div class="layer m2a"><div class="glyph disp g1"></div></div>
      <div class="layer m2b"><div class="glyph disp g2"></div></div>
      <div class="layer m2c bands"></div>
      <div class="layer m2d">
        <div class="hrs disp" data-slot="number">6 hours a week</div>
        <div class="back disp" data-slot="kicker">back.</div>
      </div>
      <div class="layer m2e"><div class="iris"></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-kinetic-number", FPS = 24, N = 76;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s), $ = (s) => ROOT.querySelectorAll(s);
      const C = { oxblood:"#4B1526", cream:"#FFF0E6", brick:"#7A1E1E", orange:"#FF8A4C", gold:"#FFC145", deep:"#2C0B16", tint:"#FFDA85" };
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      const show = (F, sel) => at(F, $1(sel), { opacity: 1 });
      const hide = (F, sel) => at(F, $1(sel), { opacity: 0 });
      const field = (F, c) => at(F, $1(".field"), { backgroundColor: c });
      function sample(F0, n, ease, fn) { const e = gsap.parseEase(ease); for (let i = 0; i <= n; i++) fn(F0 + i, e(i / n)); }

      // slots -> derived pieces: the glyph crops use the first character of the number, the bands repeat it in caps
      const num = $1(".hrs").textContent.trim(), kick = $1(".back").textContent.trim();
      $1(".g1").textContent = $1(".g2").textContent = num.charAt(0);
      const B = $1(".back"); B.textContent = "";
      [...kick].forEach((c) => { const i = document.createElement("i"); i.textContent = c; B.appendChild(i); });

      tl.set($(".layer"), { opacity: 0 }, 0);

      // F1-F16 glyph crops
      field(1, C.gold); show(1, ".m2a");
      const g1 = $1(".g1"), g2 = $1(".g2");
      at(1, g1, { color: C.brick, left: 380, top: -1150 });                // top bowl
      for (let F = 1; F <= 8; F++) at(F, g1, { y: -40 * (F - 1) / 7 });
      hide(9, ".m2a"); field(9, C.cream); show(9, ".m2b");
      at(9, g2, { color: C.oxblood, left: -260, top: -2350 });             // lower curve
      for (let F = 9; F <= 16; F++) at(F, g2, { x: -40 * (F - 9) / 7 });

      // F17-F36 repeated-number bands, on twos
      hide(17, ".m2b"); show(17, ".m2c");
      const bands = $1(".bands"), cols = [C.oxblood, C.orange, C.gold, C.brick, C.deep], ink = [C.cream, C.deep, C.deep, C.cream, C.cream];
      const offs = [0, -480, -160, -640, -320], rows = [], cap = num.toUpperCase();
      cols.forEach((c, i) => {
        const b = document.createElement("div"); b.className = "band"; b.style.top = (i * 216) + "px"; b.style.background = c;
        const r = document.createElement("div"); r.className = "row disp"; r.style.color = ink[i];
        r.textContent = [cap, cap, cap, cap].join("  ");
        b.appendChild(r); bands.appendChild(b); rows.push(r);
      });
      for (let F = 17; F <= 36; F++) {
        const step = Math.floor((F - 17) / 2);
        rows.forEach((r, i) => at(F, r, { x: offs[i] + (i % 2 ? 1 : -1) * 24 * step }));
      }

      // F37 number line; F37-F42 kicker letters tint in
      hide(37, ".m2c"); field(37, C.gold); show(37, ".m2d");
      const letters = $(".back i");
      letters.forEach((ch, i) => {
        at(37 + i, ch, { visibility: "visible", color: C.tint });
        at(39 + i, ch, { color: C.brick });
      });
      const typedEnd = 37 + letters.length + 1;

      // F43-F66 dead hold. F67-F76 iris from the last character (the period), accelerating, fills the frame.
      const IR = typedEnd + 24, iris = $1(".iris");
      function placeIris() {                                                // centre on the last glyph once fonts have laid out
        const last = letters[letters.length - 1]; if (!last) return;
        const r = last.getBoundingClientRect(), o = ROOT.getBoundingClientRect();
        iris.style.setProperty("--cx", (r.left - o.left + r.width / 2) + "px");
        const cx = r.left - o.left + r.width / 2, cy = r.top - o.top + r.height * 0.82;
        iris.style.setProperty("--cy", cy + "px");
        iris.style.setProperty("--rmax", Math.ceil(Math.hypot(Math.max(cx, 1920 - cx), Math.max(cy, 1080 - cy))) + "px");   // fills exactly on the last frame
      }
      placeIris(); if (document.fonts) document.fonts.ready.then(placeIris);
      show(IR, ".m2e");
      sample(IR, 9, "power3.in", (F, k) => at(F, iris, { "--k": k }));
      tl.set({}, {}, Math.max(N, IR + 9) / FPS);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
