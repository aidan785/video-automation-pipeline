<!doctype html>
<!--
  Humanly Possible v2 · KINETIC · ai-screen (tier1, 112 frames = 4.67 s at 24 fps)
  Moment 3 of the verified sampler (style-library/13-humanly-possible/sampler/kinetic-blocks.html),
  rebased to F1 (sampler F121 = F1). Research: raw-media/hp-sampler-refs/kinetic-blocks/ANALYSIS.md, move G.
  The reference rebuilt its search UI as flat graphics, so the screen is HTML here too.
    F1-F3    empty deep field
    F4       filled oxblood prompt pill (no stroke) cuts on                  (wrapped10yrs_f2405_search-typing)
    F4-F31   prompt types 2 characters per frame
    F32-F41  10 f hold
    F42      hard cut to a filled cream answer card, no stroke, no shadow    (wrapped10yrs_f2493_answer-highlight)
    F46-F61  flat gold block grows behind the key reply line, 8 f per line, hard edge
    F62-F96  dead hold (the reference holds 79 identical frames)
    F97-F111 clean ending: card tilts back in 3D and drifts away, accelerating (wrapped10yrs_f2533_card-tilt-exit)
    F112     empty deep field, cut point
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#2C0B16;}
      #hp2-kinetic-ai-screen{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;
        --oxblood:#4B1526;--cream:#FFF0E6;--brick:#7A1E1E;--orange:#FF8A4C;--gold:#FFC145;--deep:#2C0B16;
        font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"opsz" 96;}
      #hp2-kinetic-ai-screen .field{position:absolute;inset:0;background:var(--deep);}
      #hp2-kinetic-ai-screen .layer{position:absolute;inset:0;opacity:0;}
      #hp2-kinetic-ai-screen .pill{position:absolute;left:150px;top:470px;width:1620px;height:140px;border-radius:70px;background:var(--oxblood);}
      #hp2-kinetic-ai-screen .prompt{position:absolute;left:210px;top:470px;height:140px;line-height:140px;font-family:"Inter Tight",sans-serif;font-weight:500;font-size:58px;color:var(--cream);white-space:nowrap;letter-spacing:-.005em;}
      #hp2-kinetic-ai-screen .stage{position:absolute;inset:0;perspective:1600px;}
      #hp2-kinetic-ai-screen .card{position:absolute;left:150px;top:300px;width:1620px;height:auto;border-radius:32px;background:var(--cream);padding:84px 96px;
        font-family:"Inter Tight",sans-serif;font-weight:400;font-size:64px;line-height:1.3;color:var(--deep);letter-spacing:-.012em;transform-origin:50% 50%;}
      #hp2-kinetic-ai-screen .card p{margin:0 0 40px;color:rgba(44,11,22,.62);}
      #hp2-kinetic-ai-screen .hl{position:relative;display:inline-block;}
      #hp2-kinetic-ai-screen .hl b{position:absolute;left:-8px;right:-8px;top:2px;bottom:0;background:var(--gold);transform-origin:0 50%;transform:scaleX(0);z-index:0;}
      #hp2-kinetic-ai-screen .hl span{position:relative;z-index:1;}
    </style>
  </head>
  <body>
    <div id="hp2-kinetic-ai-screen" data-composition-id="hp2-kinetic-ai-screen" data-start="0" data-width="1920" data-height="1080">
      <div class="field"></div>
      <div class="layer m3a"><div class="pill"></div><div class="prompt" data-slot="prompt">Write a friendly reminder text for tomorrow's grooms</div></div>
      <div class="layer m3b">
        <div class="stage">
          <div class="card">
            <p data-slot="reply-intro">Hi! Just a reminder that Biscuit is booked for tomorrow at 10.</p>
            <div class="key" data-slot="reply-key">Reply C to confirm, or R and<br />we'll find a new time.</div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-kinetic-ai-screen", FPS = 24;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s), $ = (s) => ROOT.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      const show = (F, sel) => at(F, $1(sel), { opacity: 1 });
      const hide = (F, sel) => at(F, $1(sel), { opacity: 0 });
      function sample(F0, n, ease, fn) { const e = gsap.parseEase(ease); for (let i = 0; i <= n; i++) fn(F0 + i, e(i / n)); }

      // reply-key slot: hand-set lines split on <br>, each wrapped in a highlight
      const key = $1(".key"), lines = key.innerHTML.split(/<br\s*\/?>/i).map((s) => s.trim()).filter(Boolean);
      key.innerHTML = lines.map((l) => `<span class="hl"><b></b><span>${l}</span></span>`).join("<br />");

      tl.set($(".layer"), { opacity: 0 }, 0);

      // F4 pill; F4-F31 prompt types, 2 chars per frame
      show(4, ".m3a");
      const P = $1(".prompt"), prompt = P.textContent;
      const typeEnd = 4 + Math.ceil(prompt.length / 2) - 1;
      for (let F = 4; F <= typeEnd; F++) at(F, P, { textContent: prompt.slice(0, (F - 3) * 2) });
      // 10 f hold, then hard cut to the answer card
      const A = typeEnd + 13;                                                  // 12 f hold after the last character (sampler F149 -> F162)
      hide(A, ".m3a"); show(A, ".m3b");
      // highlight grows line by line, 8 f per line, starting 4 f after the cut
      const hls = $(".hl b");
      hls.forEach((b, i) => sample(A + 4 + 8 * i, 7, "power2.out", (F, k) => at(F, b, { scaleX: k })));
      const H = A + 4 + 8 * hls.length;                                     // first frame after the highlight lands
      // 35 f dead hold, then 15 f tilt exit, accelerating
      const X = H + 35, card = $1(".card");
      sample(X, 14, "power2.in", (F, k) => at(F, card, { rotationX: 8 * k, rotationY: 34 * k, x: -300 * k, y: 160 * k, scale: 1 - .3 * k, z: -400 * k }));
      hide(X + 15, ".m3b");                                                 // last frame: empty deep field
      tl.set({}, {}, (X + 15) / FPS);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
