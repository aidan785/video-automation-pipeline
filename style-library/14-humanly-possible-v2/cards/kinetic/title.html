<!doctype html>
<!--
  Humanly Possible v2 · KINETIC · title (tier1, 160 frames = 6.67 s at 24 fps)
  Chapter title built from raw-media/hp-sampler-refs/kinetic-blocks/ANALYSIS.md.
    F1-F12    live footage (the outgoing shot), untouched
    F13-F40   shape iris: a flat gold circle grows from a point on the subject and fills the frame in 28 f,
              accelerating, hard edge                                      (wrapped10yrs_f286_circle-iris, Wrapped 10yrs f261-291)
    F41-F42   empty gold field (2 f breath)                                (BK f656-658)
    F43-F87   three extreme glyph crops of the chapter number, 15 f each, field swaps on every cut,
              each drifting slowly (40 px, linear, on ones)                (bk_rebrand_f285_giant-glyph-crop, BK f264-308)
    F88-F160  hard cut to the readable lockup on cream, hand-set ragged title lines, dead hold 73 f
              (BK f309-339 "MAKES US GREAT" lockup; ragged breaks as bk_rebrand_f1790_haveit-build)
  Clean ending: hard cut after F160.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#2C0B16;}
      #hp2-kinetic-title{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;
        --oxblood:#4B1526;--cream:#FFF0E6;--brick:#7A1E1E;--orange:#FF8A4C;--gold:#FFC145;--deep:#2C0B16;
        font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"opsz" 96;}
      #hp2-kinetic-title .field{position:absolute;inset:0;background:var(--gold);}
      #hp2-kinetic-title .layer{position:absolute;inset:0;opacity:0;}
      #hp2-kinetic-title .shot{position:absolute;inset:0;overflow:hidden;}
      #hp2-kinetic-title .shot video{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;}
      #hp2-kinetic-title .iris{position:absolute;inset:0;background:var(--gold);--r:0px;clip-path:circle(var(--r) at 1000px 560px);}
      #hp2-kinetic-title .disp{font-weight:800;letter-spacing:-.03em;line-height:1;white-space:nowrap;}
      #hp2-kinetic-title .glyph{position:absolute;font-size:3400px;letter-spacing:0;line-height:1;}
      #hp2-kinetic-title .num{position:absolute;left:122px;top:96px;font-size:520px;letter-spacing:-.05em;color:var(--brick);}
      #hp2-kinetic-title .ttl{position:absolute;left:140px;top:640px;font-size:150px;color:var(--deep);line-height:1.0;letter-spacing:-.035em;}
      #hp2-kinetic-title .ttl div{white-space:nowrap;}
      #hp2-kinetic-title .ttl div:nth-child(2){margin-left:220px;}
    </style>
  </head>
  <body>
    <div id="hp2-kinetic-title" data-composition-id="hp2-kinetic-title" data-start="0" data-width="1920" data-height="1080">
      <div class="field"></div>
      <div class="layer s0"><div class="shot">
        <video data-slot="media" src="../../assets/footage/groom2_6131038.mp4" poster="../../assets/footage/groom2_6131038.jpg" muted playsinline preload="auto" data-start="0" data-duration="1.75" data-track-index="0"></video>
      </div></div>
      <div class="layer s1"><div class="iris"></div></div>
      <div class="layer c1"><div class="glyph disp g1"></div></div>
      <div class="layer c2"><div class="glyph disp g2"></div></div>
      <div class="layer c3"><div class="glyph disp g3"></div></div>
      <div class="layer lock">
        <div class="num disp" data-slot="chapter">02</div>
        <div class="ttl disp" data-slot="title">The front desk<br />answers itself</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-kinetic-title", FPS = 24, N = 160;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s), $ = (s) => ROOT.querySelectorAll(s);
      const C = { oxblood:"#4B1526", cream:"#FFF0E6", brick:"#7A1E1E", orange:"#FF8A4C", gold:"#FFC145", deep:"#2C0B16" };
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      const show = (F, sel) => at(F, $1(sel), { opacity: 1 });
      const hide = (F, sel) => at(F, $1(sel), { opacity: 0 });
      const field = (F, c) => at(F, $1(".field"), { backgroundColor: c });
      function sample(F0, n, ease, fn) { const e = gsap.parseEase(ease); for (let i = 0; i <= n; i++) fn(F0 + i, e(i / n)); }

      // slots -> glyph crops use the chapter's first and last characters; title lines are hand-set on <br>
      const ch = $1(".num").textContent.trim();
      $1(".g1").textContent = ch.charAt(0); $1(".g2").textContent = $1(".g3").textContent = ch.charAt(ch.length - 1);
      const TT = $1(".ttl");
      TT.innerHTML = TT.innerHTML.split(/<br\s*\/?>/i).map((s) => `<div>${s.trim()}</div>`).join("");

      tl.set($(".layer"), { opacity: 0 }, 0);

      // F1-F40 footage; F13-F40 gold iris from the subject, accelerating
      show(1, ".s0"); show(13, ".s1");
      const iris = $1(".iris");
      sample(13, 27, "power3.in", (F, k) => at(F, iris, { "--r": (6 + 1160 * k) + "px" }));   // 1160 px = centre to farthest corner: full at F40
      // F41-F42 breath
      hide(41, ".s0"); hide(41, ".s1"); field(41, C.gold);

      // F43-F87 three crops, 15 f each, each drifting 40 px
      const crops = [
        [".c1", ".g1", C.cream,   C.brick,   { left: -1250, top: -700 },  { x: 40 }],   // right wall of the 0 and its counter
        [".c2", ".g2", C.brick,   C.cream,   { left: -80,   top: -360 },  { y: -40 }],  // top curve of the 2
        [".c3", ".g3", C.cream,   C.oxblood, { left: 220,   top: -2120 }, { x: -40 }],  // the foot and base of the 2
      ];
      crops.forEach(([lay, g, fc, ink, pos, drift], i) => {
        const F0 = 43 + 15 * i, el = $1(g), key = Object.keys(drift)[0];
        if (i) hide(F0, crops[i - 1][0]);
        field(F0, fc); show(F0, lay); at(F0, el, Object.assign({ color: ink }, pos));
        for (let F = F0; F < F0 + 15; F++) at(F, el, { [key]: drift[key] * (F - F0) / 14 });
      });

      // F88 hard cut to the lockup; dead hold to F160
      hide(88, ".c3"); field(88, C.cream); show(88, ".lock");
      tl.set({}, {}, N / FPS);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
