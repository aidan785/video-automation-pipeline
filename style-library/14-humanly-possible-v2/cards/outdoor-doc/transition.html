<!doctype html>
<!--
  Humanly Possible v2 · OUTDOOR DOC · signature transition (4 s, 24 fps, 96 frames)
  Research: ANALYSIS.md "Cut rhythm" (almost every transition is a hard cut, no designed flash) + motion D exception
  (Salomon CHAMONIX / FRANCE: the super survives the picture cut f13174 to f13175 and fades out mid-shot ~24 f later
  over ~5 f) + motion A for its entrance (Leadville: clean delay, 27 f fade).
  Matches picks: salomon_location_chamonix_acrosscut.jpg, salomon_location_leadville.jpg.
  - Shot A (media) F1-60, hard cut on F61 to shot B (media-2), no dissolve, no flash, no motion.
  - F1-12 clean picture. F13-39 location super fades on (27 f, measured curve), 85%.
  - The super carries across the cut, then leaves on its own 24 f into shot B: F85-89, 5 f, linear.
  - F90-96 shot B clean. Both plates share one grade so the cut is the only change.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Inter+Tight:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#000;}
      #hp2-outdoor-doc-transition{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#000;
        --cream:#FFF0E6;}
      #hp2-outdoor-doc-transition .plate{position:absolute;inset:0;filter:url(#hp2-outdoor-doc-transition-grade) saturate(.8) brightness(.84) contrast(1.06);}
      #hp2-outdoor-doc-transition .plate video{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;display:block;}
      #hp2-outdoor-doc-transition .shot{position:absolute;inset:0;}
      #hp2-outdoor-doc-transition .sup{position:absolute;left:120px;color:var(--cream);white-space:nowrap;line-height:1;opacity:0;}
      #hp2-outdoor-doc-transition .nm{top:828px;font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"opsz" 96;font-weight:800;
        font-size:46px;letter-spacing:.10em;text-transform:uppercase;}
      #hp2-outdoor-doc-transition .rl{top:884px;font-family:"Inter Tight",sans-serif;font-style:italic;font-weight:400;font-size:28px;letter-spacing:.02em;}
    </style>
  </head>
  <body>
    <div id="hp2-outdoor-doc-transition" data-composition-id="hp2-outdoor-doc-transition" data-start="0" data-width="1920" data-height="1080">
      <svg width="0" height="0" style="position:absolute">
        <!-- split-tone grade: shadows toward #2C0B16, highlights toward #FF8A4C, 15% strength -->
        <filter id="hp2-outdoor-doc-transition-grade" color-interpolation-filters="sRGB">
          <feColorMatrix in="SourceGraphic" type="matrix" values=".2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  0 0 0 1 0" result="L" />
          <feComponentTransfer in="L" result="T">
            <feFuncR type="table" tableValues=".173 .40 .78 1" />
            <feFuncG type="table" tableValues=".043 .28 .62 .80" />
            <feFuncB type="table" tableValues=".086 .27 .55 .66" />
          </feComponentTransfer>
          <feComposite in="SourceGraphic" in2="T" operator="arithmetic" k1="0" k2=".85" k3=".15" k4="0" />
        </filter>
      </svg>
      <div class="plate">
        <div class="shot a"><video data-slot="media" src="../../assets/footage/groom2_6131038.mp4" poster="../../assets/footage/groom2_6131038.jpg" muted playsinline preload="auto" data-start="0" data-duration="2.5" data-track-index="0"></video></div>
        <div class="shot b"><video data-slot="media-2" src="../../assets/footage/groom_6816883.mp4" poster="../../assets/footage/groom_6816883.jpg" muted playsinline preload="auto" data-start="2.5" data-media-start="0" data-duration="1.5" data-track-index="1"></video></div>
      </div>
      <div class="sup nm" data-slot="place">Tulsa</div>
      <div class="sup rl" data-slot="region">Oklahoma</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-outdoor-doc-transition", FPS = 24, N = 96;
      const ROOT = document.getElementById(ID);
      const $ = (s) => ROOT.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      // Salomon Kevin super, text-region YMAX per frame (f1027-1056), background 53, settled 180.
      const KEVIN = [70,81,85,92,99,103,110,113,117,118,126,131,137,136,143,144,148,149,152,154,156,165,167,167,167,174,174,177,179,180];
      const curve = (arr, lo, hi) => { let m = 0; return arr.map((v) => (m = Math.max(m, (v - lo) / (hi - lo)))); };
      // resample a measured curve to n frames (linear between measured frames)
      const resample = (c, n) => Array.from({ length: n }, (_, i) => { const u = n === 1 ? c.length - 1 : i * (c.length - 1) / (n - 1), a = Math.floor(u), b = Math.min(c.length - 1, a + 1); return c[a] + (c[b] - c[a]) * (u - a); });
      const fadeOn = (F0, n, els, peak, c) => resample(c, n).forEach((k, i) => at(F0 + i, els, { opacity: +(peak * k).toFixed(4) }));

      const A = ROOT.querySelector(".shot.a"), B = ROOT.querySelector(".shot.b");
      tl.set($(".sup"), { opacity: 0 }, 0);
      at(1, A, { opacity: 1 }); at(1, B, { opacity: 0 });
      // Leadville: clean delay, then a 27 f fade on the measured curve
      fadeOn(13, 27, $(".sup"), 0.85, curve(KEVIN, 53, 180));
      // F61 hard cut (layer swap on one frame)
      at(61, A, { opacity: 0 }); at(61, B, { opacity: 1 });
      // Chamonix: the super survives the cut, then goes 24 f later over 5 f, linear
      for (let i = 1; i <= 5; i++) at(84 + i, $(".sup"), { opacity: +(0.85 * (1 - i / 5)).toFixed(4) });
      tl.set({}, {}, N / FPS);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
