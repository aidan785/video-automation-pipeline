<!doctype html>
<!--
  Humanly Possible v2 · OUTDOOR DOC · name super (5 s, 24 fps, 120 frames)
  Research: raw-media/hp-sampler-refs/outdoor-doc/ANALYSIS.md, motion A (Salomon "KEVIN / COURTNEY'S HUSBAND").
  Matches picks: salomon_namesuper_kevin.jpg, salomon_location_leadville.jpg.
  - Real plate (graded split-tone, color lives in the grade); type cream only, no box, no shadow.
  - F1-10 clean picture. F11-40 both lines fade together on the measured Kevin luma curve
    (16 frame clean delay in the reference, 10 here), opacity only, to 85%. Nothing moves.
  - Hold until the end of the card. The super has no exit: it disappears on the picture cut,
    so the editor can cut this card anywhere after ~2.5 s and the super goes with the shot.
  F numbers are 1-based; time = (F-1)/24.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Inter+Tight:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#000;}
      #hp2-outdoor-doc-name{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#000;
        --cream:#FFF0E6;}
      #hp2-outdoor-doc-name .plate{position:absolute;inset:0;filter:url(#hp2-outdoor-doc-name-grade) saturate(.78) brightness(.8) contrast(1.06);}
      #hp2-outdoor-doc-name .plate video{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;display:block;}
      #hp2-outdoor-doc-name .sup{position:absolute;left:120px;color:var(--cream);white-space:nowrap;line-height:1;opacity:0;}
      #hp2-outdoor-doc-name .nm{top:828px;font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"opsz" 96;font-weight:800;
        font-size:46px;letter-spacing:.10em;text-transform:uppercase;}
      #hp2-outdoor-doc-name .rl{top:884px;font-family:"Inter Tight",sans-serif;font-style:italic;font-weight:400;font-size:28px;letter-spacing:.02em;}
    </style>
  </head>
  <body>
    <div id="hp2-outdoor-doc-name" data-composition-id="hp2-outdoor-doc-name" data-start="0" data-width="1920" data-height="1080">
      <svg width="0" height="0" style="position:absolute">
        <!-- split-tone grade: shadows toward #2C0B16, highlights toward #FF8A4C, 15% strength -->
        <filter id="hp2-outdoor-doc-name-grade" color-interpolation-filters="sRGB">
          <feColorMatrix in="SourceGraphic" type="matrix" values=".2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  0 0 0 1 0" result="L" />
          <feComponentTransfer in="L" result="T">
            <feFuncR type="table" tableValues=".173 .40 .78 1" />
            <feFuncG type="table" tableValues=".043 .28 .62 .80" />
            <feFuncB type="table" tableValues=".086 .27 .55 .66" />
          </feComponentTransfer>
          <feComposite in="SourceGraphic" in2="T" operator="arithmetic" k1="0" k2=".85" k3=".15" k4="0" />
        </filter>
      </svg>
      <div class="plate">
        <video data-slot="media" src="../../assets/footage/groom_6132700.mp4" poster="../../assets/footage/groom_6132700.jpg" muted playsinline preload="auto" data-start="0" data-duration="5" data-track-index="0"></video>
      </div>
      <div class="sup nm" data-slot="name">Dana Ruiz</div>
      <div class="sup rl" data-slot="role">Dog groomer in Tulsa</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-outdoor-doc-name", FPS = 24, N = 120;
      const ROOT = document.getElementById(ID);
      const $ = (s) => ROOT.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      // Salomon Kevin super, text-region YMAX per frame (f1027-1056), background 53, settled 180.
      const KEVIN = [70,81,85,92,99,103,110,113,117,118,126,131,137,136,143,144,148,149,152,154,156,165,167,167,167,174,174,177,179,180];
      const curve = (arr, lo, hi) => { let m = 0; return arr.map((v) => (m = Math.max(m, (v - lo) / (hi - lo)))); };
      // resample a measured curve to n frames (linear between measured frames)
      const resample = (c, n) => Array.from({ length: n }, (_, i) => { const u = n === 1 ? c.length - 1 : i * (c.length - 1) / (n - 1), a = Math.floor(u), b = Math.min(c.length - 1, a + 1); return c[a] + (c[b] - c[a]) * (u - a); });
      const fadeOn = (F0, n, els, peak, c) => resample(c, n).forEach((k, i) => at(F0 + i, els, { opacity: +(peak * k).toFixed(4) }));

      tl.set($(".sup"), { opacity: 0 }, 0);
      // F1-10 clean picture; F11-40 fade (30 f, measured); hold to the cut
      fadeOn(11, 30, $(".sup"), 0.85, curve(KEVIN, 53, 180));
      tl.set({}, {}, N / FPS);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
