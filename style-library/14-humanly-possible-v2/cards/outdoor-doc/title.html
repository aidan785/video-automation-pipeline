<!doctype html>
<!--
  Humanly Possible v2 · OUTDOOR DOC · chapter title (5 s, 24 fps, 120 frames)
  Research: ANALYSIS.md motion C (Salomon chapter card "A TEAM SPORT": one line of bold caps centred above the horizon,
  9 f ease-in-out on the measured luma, held, gone on the cut) + motion E (Patagonia title: hairline rule arrives with
  the title, tracked light-caps subtitle 27 f later, 16 f).
  Matches picks: salomon_chapter_teamsport.jpg, pata_titlecard.jpg.
  - Real wide plate, sun on the horizon; type never moves; light on the plate keeps changing.
  - F1-10 clean. F11-19 title + rule (measured 9 f curve). F38-53 subtitle (16 f ease-out). Hold; all leave on the cut.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Inter+Tight:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#000;}
      #hp2-outdoor-doc-title{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#000;
        --cream:#FFF0E6;}
      #hp2-outdoor-doc-title .plate{position:absolute;inset:0;filter:url(#hp2-outdoor-doc-title-grade) saturate(.9) brightness(.9) contrast(1.05);}
      #hp2-outdoor-doc-title .plate video{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;display:block;}
      #hp2-outdoor-doc-title .sup{position:absolute;left:0;width:1920px;text-align:center;color:var(--cream);white-space:nowrap;line-height:1;opacity:0;}
      #hp2-outdoor-doc-title .blk{position:absolute;left:0;top:190px;width:1920px;text-align:center;}
      #hp2-outdoor-doc-title .blk .in{display:inline-block;position:relative;}
      #hp2-outdoor-doc-title .ttl{position:relative;opacity:0;color:var(--cream);white-space:nowrap;line-height:1;font-family:"Bricolage Grotesque",sans-serif;
        font-variation-settings:"opsz" 96;font-weight:800;font-size:56px;letter-spacing:.05em;text-transform:uppercase;}
      #hp2-outdoor-doc-title .rule{position:absolute;left:0;right:0;top:78px;height:2px;background:var(--cream);opacity:0;}
      #hp2-outdoor-doc-title .sub{position:absolute;left:0;right:0;top:104px;opacity:0;color:var(--cream);white-space:nowrap;line-height:1;text-align:center;
        font-family:"Inter Tight",sans-serif;font-weight:400;font-size:24px;letter-spacing:.5em;text-transform:uppercase;text-indent:.5em;}
    </style>
  </head>
  <body>
    <div id="hp2-outdoor-doc-title" data-composition-id="hp2-outdoor-doc-title" data-start="0" data-width="1920" data-height="1080">
      <svg width="0" height="0" style="position:absolute">
        <!-- split-tone grade: shadows toward #2C0B16, highlights toward #FF8A4C, 15% strength -->
        <filter id="hp2-outdoor-doc-title-grade" color-interpolation-filters="sRGB">
          <feColorMatrix in="SourceGraphic" type="matrix" values=".2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  0 0 0 1 0" result="L" />
          <feComponentTransfer in="L" result="T">
            <feFuncR type="table" tableValues=".173 .40 .78 1" />
            <feFuncG type="table" tableValues=".043 .28 .62 .80" />
            <feFuncB type="table" tableValues=".086 .27 .55 .66" />
          </feComponentTransfer>
          <feComposite in="SourceGraphic" in2="T" operator="arithmetic" k1="0" k2=".85" k3=".15" k4="0" />
        </filter>
      </svg>
      <div class="plate">
        <video data-slot="media" src="../../assets/footage/field_5805200.mp4" poster="../../assets/footage/field_5805200.jpg" muted playsinline preload="auto" data-start="0" data-duration="5" data-track-index="0"></video>
      </div>
      <div class="blk"><div class="in">
        <div class="ttl" data-slot="title">The front desk answers itself</div>
        <div class="rule"></div>
        <div class="sub"><span data-slot="kicker">Chapter</span> <span data-slot="chapter">02</span></div>
      </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-outdoor-doc-title", FPS = 24, N = 120;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      // Salomon Kevin super, text-region YMAX per frame, background 53, settled 180 (the measured ease-out)
      const KEVIN = [70,81,85,92,99,103,110,113,117,118,126,131,137,136,143,144,148,149,152,154,156,165,167,167,167,174,174,177,179,180];
      const curve = (arr, lo, hi) => { let m = 0; return arr.map((v) => (m = Math.max(m, (v - lo) / (hi - lo)))); };
      const resample = (c, n) => Array.from({ length: n }, (_, i) => { const u = n === 1 ? c.length - 1 : i * (c.length - 1) / (n - 1), a = Math.floor(u), b = Math.min(c.length - 1, a + 1); return c[a] + (c[b] - c[a]) * (u - a); });
      const fadeOn = (F0, n, els, peak, c) => resample(c, n).forEach((k, i) => at(F0 + i, els, { opacity: +(peak * k).toFixed(4) }));
      const FADE = curve(KEVIN, 53, 180);

      // Salomon "A TEAM SPORT" text-region YMAX per frame f2269-2277 (9 f ease-in-out), background 115
      const CHAPTER = curve([115,117,126,141,163,189,211,235,239], 115, 239);
      tl.set([$1(".ttl"), $1(".rule"), $1(".sub")], { opacity: 0 }, 0);
      fadeOn(11, 9, [$1(".ttl"), $1(".rule")], 1.0, CHAPTER);   // title and its rule arrive together
      fadeOn(38, 16, $1(".sub"), 0.85, FADE);                    // subtitle 27 f later, 16 f
      tl.set({}, {}, N / FPS);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
