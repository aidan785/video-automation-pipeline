<!doctype html>
<!--
  Humanly Possible v2 · OUTDOOR DOC · the guest's line (7 s, 24 fps, 168 frames)
  Designed from ANALYSIS.md: motion B (Salomon staggered reading, long gaps between lines) + tell 5
  (emphasis by weight only) + tell 4 (no container: the dark of the plate gives legibility).
  Matches picks: salomon_record_ws100.jpg (light line, then heavy line, same cream), salomon_racetitle_utmb.jpg
  (centred over the landscape, light and bold in one stack).
  - Real evening plate (the line is about evenings), its light keeps changing under the hold.
  - F1-12 clean. F13-42 line 1 (light, 85%) on the measured Salomon curve. F79-108 line 2 (heavy, 100%),
    36 f clean gap after line 1 settles. F133-156 attribution (tracked caps, 85%). Hold; all leave on the cut.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Inter+Tight:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#000;}
      #hp2-outdoor-doc-quote{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#000;
        --cream:#FFF0E6;}
      #hp2-outdoor-doc-quote .plate{position:absolute;inset:0;filter:url(#hp2-outdoor-doc-quote-grade) saturate(.9) brightness(.9) contrast(1.05);}
      #hp2-outdoor-doc-quote .plate video{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;display:block;}
      #hp2-outdoor-doc-quote .sup{position:absolute;left:0;width:1920px;text-align:center;color:var(--cream);white-space:nowrap;line-height:1;opacity:0;}
      #hp2-outdoor-doc-quote .l1{top:648px;font-family:"Inter Tight",sans-serif;font-weight:300;font-size:46px;letter-spacing:.005em;}
      #hp2-outdoor-doc-quote .l2{top:712px;font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"opsz" 96;font-weight:800;font-size:58px;letter-spacing:.01em;}
      #hp2-outdoor-doc-quote .who{top:808px;font-family:"Inter Tight",sans-serif;font-weight:500;font-size:20px;letter-spacing:.18em;text-transform:uppercase;}
    </style>
  </head>
  <body>
    <div id="hp2-outdoor-doc-quote" data-composition-id="hp2-outdoor-doc-quote" data-start="0" data-width="1920" data-height="1080">
      <svg width="0" height="0" style="position:absolute">
        <!-- split-tone grade: shadows toward #2C0B16, highlights toward #FF8A4C, 15% strength -->
        <filter id="hp2-outdoor-doc-quote-grade" color-interpolation-filters="sRGB">
          <feColorMatrix in="SourceGraphic" type="matrix" values=".2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  0 0 0 1 0" result="L" />
          <feComponentTransfer in="L" result="T">
            <feFuncR type="table" tableValues=".173 .40 .78 1" />
            <feFuncG type="table" tableValues=".043 .28 .62 .80" />
            <feFuncB type="table" tableValues=".086 .27 .55 .66" />
          </feComponentTransfer>
          <feComposite in="SourceGraphic" in2="T" operator="arithmetic" k1="0" k2=".85" k3=".15" k4="0" />
        </filter>
      </svg>
      <div class="plate">
        <video data-slot="media" src="../../assets/footage/prairie_8087832.mp4" poster="../../assets/footage/prairie_8087832.jpg" muted playsinline preload="auto" data-start="0" data-duration="7" data-track-index="0"></video>
      </div>
      <div class="sup l1" data-slot="line-1">I didn't hire help.</div>
      <div class="sup l2" data-slot="line-2">I got my evenings back.</div>
      <div class="sup who" data-slot="attribution">Dana Ruiz</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-outdoor-doc-quote", FPS = 24, N = 168;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      // Salomon Kevin super, text-region YMAX per frame, background 53, settled 180 (the measured ease-out)
      const KEVIN = [70,81,85,92,99,103,110,113,117,118,126,131,137,136,143,144,148,149,152,154,156,165,167,167,167,174,174,177,179,180];
      const curve = (arr, lo, hi) => { let m = 0; return arr.map((v) => (m = Math.max(m, (v - lo) / (hi - lo)))); };
      const resample = (c, n) => Array.from({ length: n }, (_, i) => { const u = n === 1 ? c.length - 1 : i * (c.length - 1) / (n - 1), a = Math.floor(u), b = Math.min(c.length - 1, a + 1); return c[a] + (c[b] - c[a]) * (u - a); });
      const fadeOn = (F0, n, els, peak, c) => resample(c, n).forEach((k, i) => at(F0 + i, els, { opacity: +(peak * k).toFixed(4) }));
      const FADE = curve(KEVIN, 53, 180);

      tl.set([$1(".l1"), $1(".l2"), $1(".who")], { opacity: 0 }, 0);
      fadeOn(13, 30, $1(".l1"), 0.85, FADE);     // line 1, light
      fadeOn(79, 30, $1(".l2"), 1.0, FADE);      // line 2, heavy, after a long clean gap
      fadeOn(133, 24, $1(".who"), 0.85, FADE);   // attribution
      tl.set({}, {}, N / FPS);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
