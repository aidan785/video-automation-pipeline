<!doctype html>
<!--
  Humanly Possible v2 · OUTDOOR DOC · the AI moment (6 s, 24 fps, 144 frames)
  Research: raw-media/hp-sampler-refs/outdoor-doc/ANALYSIS.md, motion F (Patagonia route map: hairline traced
  along the plate, open-triangle marker that settles from ~3x, labels pinned and tracked to the moving plate).
  Matches picks: pata_route_label_scalein.jpg, pata_peaklabels_full.jpg (move), salomon_namesuper_roy.jpg (placement:
  small cream type in the dark of the shot, no panel).
  - Real phone-in-hand plate. The chat is NOT rebuilt as UI (research: never vector-UI the chat). The exchange is set as
    supers in the dark negative space of the shot (her black jacket), pinned to the plate with a real baked track.
  - TRACK: per-frame (x, y) offset in px of the plate under the type, measured by block matching two patches (hair +
    jacket) on every frame of phone_8142388 at 960x540, sub-pixel, 5-tap smoothed. Swap the plate = re-bake the track.
  - F1-12 clean. F13-42 the prompt (italic caption, 85%) fades on the measured Salomon curve.
    F61-84 the reply fades on (100%). F90-106 open triangle settles 300% to 100% (17 f, strong ease-out, no fade).
    F94-117 a 3 px cream hairline is traced from the marker under the reply, left to right, linear with a 4 f
    ease-out at the end. Hold to the end, still tracked; everything leaves on the picture cut.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Inter+Tight:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#000;}
      #hp2-outdoor-doc-ai-screen{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#000;
        --cream:#FFF0E6;font-family:"Inter Tight",sans-serif;}
      #hp2-outdoor-doc-ai-screen .plate{position:absolute;inset:0;filter:url(#hp2-outdoor-doc-ai-screen-grade) saturate(.85) brightness(.9) contrast(1.06);}
      #hp2-outdoor-doc-ai-screen .plate video{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;display:block;}
      #hp2-outdoor-doc-ai-screen .pin{position:absolute;left:1440px;top:0;width:440px;height:1080px;}
      #hp2-outdoor-doc-ai-screen .ask{position:absolute;left:0;top:676px;width:440px;white-space:normal;color:var(--cream);opacity:0;
        font-style:italic;font-weight:400;font-size:25px;line-height:34px;letter-spacing:.02em;}
      #hp2-outdoor-doc-ai-screen .reply{position:absolute;left:0;top:784px;color:var(--cream);opacity:0;
        font-weight:500;font-size:34px;line-height:54px;letter-spacing:-.005em;white-space:nowrap;}
      #hp2-outdoor-doc-ai-screen .reply .ln{display:block;width:max-content;}
      #hp2-outdoor-doc-ai-screen .trace{position:absolute;left:0;top:952px;height:14px;}
      #hp2-outdoor-doc-ai-screen .trace .hair{position:absolute;left:24px;top:10px;height:3px;background:var(--cream);transform-origin:0 50%;transform:scaleX(0);}
      #hp2-outdoor-doc-ai-screen .tri{position:absolute;left:0;top:0;width:16px;height:14px;transform-origin:50% 100%;opacity:0;overflow:visible;}
    </style>
  </head>
  <body>
    <div id="hp2-outdoor-doc-ai-screen" data-composition-id="hp2-outdoor-doc-ai-screen" data-start="0" data-width="1920" data-height="1080">
      <svg width="0" height="0" style="position:absolute">
        <!-- split-tone grade: shadows toward #2C0B16, highlights toward #FF8A4C, 15% strength -->
        <filter id="hp2-outdoor-doc-ai-screen-grade" color-interpolation-filters="sRGB">
          <feColorMatrix in="SourceGraphic" type="matrix" values=".2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  0 0 0 1 0" result="L" />
          <feComponentTransfer in="L" result="T">
            <feFuncR type="table" tableValues=".173 .40 .78 1" />
            <feFuncG type="table" tableValues=".043 .28 .62 .80" />
            <feFuncB type="table" tableValues=".086 .27 .55 .66" />
          </feComponentTransfer>
          <feComposite in="SourceGraphic" in2="T" operator="arithmetic" k1="0" k2=".85" k3=".15" k4="0" />
        </filter>
      </svg>
      <div class="plate">
        <video data-slot="media" src="../../assets/footage/phone_8142388.mp4" poster="../../assets/footage/phone_8142388.jpg" muted playsinline preload="auto" data-start="0" data-duration="6" data-track-index="0"></video>
      </div>
      <div class="pin">
        <div class="ask" data-slot="prompt">Write a friendly reminder text for tomorrow's grooms</div>
        <div class="reply" data-slot="reply" data-type="richtext"><span class="ln">Reply C to confirm,</span><span class="ln">or R and we'll find</span><span class="ln">a new time.</span></div>
        <div class="trace"><svg class="tri" viewBox="0 0 16 14"><path d="M8 1.6 L14.6 12.9 L1.4 12.9 Z" fill="none" stroke="#FFF0E6" stroke-width="2" stroke-linejoin="miter" /></svg><i class="hair"></i></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-outdoor-doc-ai-screen", FPS = 24, N = 144;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s), $ = (s) => ROOT.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      const KEVIN = [70,81,85,92,99,103,110,113,117,118,126,131,137,136,143,144,148,149,152,154,156,165,167,167,167,174,174,177,179,180];
      const curve = (arr, lo, hi) => { let m = 0; return arr.map((v) => (m = Math.max(m, (v - lo) / (hi - lo)))); };
      const resample = (c, n) => Array.from({ length: n }, (_, i) => { const u = n === 1 ? c.length - 1 : i * (c.length - 1) / (n - 1), a = Math.floor(u), b = Math.min(c.length - 1, a + 1); return c[a] + (c[b] - c[a]) * (u - a); });
      const fadeOn = (F0, n, els, peak, c) => resample(c, n).forEach((k, i) => at(F0 + i, els, { opacity: +(peak * k).toFixed(4) }));
      const FADE = curve(KEVIN, 53, 180);
      // baked plate track, one [dx, dy] per frame (F1 = index 0), px at 1920x1080
      const TRACK = [[0.6,-0.1],[1.6,-0.1],[2.8,-0.1],[4.1,-0.3],[5.3,-0.6],[6.3,-1.3],[7.0,-2.1],[7.6,-3.0],[8.0,-3.9],[8.1,-4.7],[8.0,-5.3],[7.7,-5.8],[7.4,-6.3],[7.3,-6.6],[7.5,-6.9],[8.0,-7.1],[8.6,-7.1],[9.3,-7.0],[9.9,-6.8],[10.3,-6.2],[10.4,-5.2],[10.2,-4.1],[9.8,-3.1],[9.4,-2.6],[9.1,-2.4],[8.9,-2.5],[8.9,-3.0],[8.9,-3.8],[8.9,-4.7],[8.8,-5.4],[8.5,-5.6],[8.1,-5.4],[7.3,-4.7],[6.4,-3.6],[5.5,-2.5],[4.7,-1.2],[4.1,0.1],[3.7,1.5],[3.5,2.8],[3.6,4.0],[4.2,5.0],[5.1,5.8],[6.4,6.4],[8.0,6.9],[9.7,7.4],[11.6,7.8],[13.7,8.1],[15.9,8.1],[18.0,8.1],[19.9,8.1],[21.6,8.2],[23.2,8.0],[24.8,7.8],[26.4,7.5],[28.2,7.4],[30.2,7.5],[32.1,7.8],[33.9,7.9],[35.4,7.9],[36.6,7.8],[37.7,7.4],[38.7,6.9],[39.5,6.3],[40.3,5.6],[41.1,5.1],[41.9,4.5],[42.7,4.1],[43.4,3.8],[44.0,3.7],[44.6,3.7],[45.2,3.9],[45.6,3.9],[45.6,3.7],[45.3,3.2],[44.8,2.4],[44.0,1.2],[43.2,-0.0],[42.5,-1.4],[41.9,-2.7],[41.6,-4.2],[41.8,-5.7],[42.2,-6.9],[42.7,-7.9],[43.0,-8.8],[43.0,-9.6],[43.0,-10.1],[42.8,-10.2],[42.6,-10.0],[42.5,-10.0],[42.4,-10.0],[42.2,-10.1],[41.8,-10.2],[41.2,-10.3],[40.3,-10.4],[39.4,-10.3],[38.6,-10.3],[38.0,-10.1],[37.7,-9.9],[37.5,-9.5],[37.2,-9.1],[36.9,-8.5],[36.5,-7.8],[36.2,-7.1],[35.9,-6.1],[35.6,-4.9],[35.3,-3.3],[35.2,-1.6],[35.4,0.3],[35.8,2.3],[36.2,4.1],[36.4,5.5],[36.3,6.4],[36.1,6.9],[36.1,7.3],[36.1,7.4],[36.2,7.1],[36.2,6.5],[36.1,5.5],[35.8,4.6],[35.6,3.7],[35.4,3.1],[35.3,2.5],[35.2,2.0],[35.1,1.5],[34.8,1.1],[34.4,0.8],[33.8,0.4],[33.3,-0.2],[33.0,-1.0],[32.9,-1.8],[32.9,-2.7],[32.9,-3.5],[32.9,-4.3],[32.9,-5.0],[32.8,-5.6],[32.7,-6.1],[32.5,-6.6],[32.6,-7.3],[32.9,-8.0],[33.1,-8.5],[32.9,-8.6],[32.2,-8.3],[31.2,-8.1],[30.0,-8.0]];

      // the hairline runs from the marker to the end of the longest reply line (measured once fonts are in)
      const reply = $1(".reply"), hair = $1(".trace .hair");
      const fit = () => { hair.style.width = Math.max(40, reply.getBoundingClientRect().width - 24) + "px"; };
      fit(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
      const hairs = [hair];

      tl.set([$1(".ask"), $1(".reply"), $1(".tri")], { opacity: 0 }, 0);
      tl.set(hairs, { scaleX: 0 }, 0);
      // pinned to the plate on every frame
      const pin = $1(".pin");
      for (let F = 1; F <= N; F++) { const p = TRACK[Math.min(TRACK.length - 1, F - 1)]; at(F, pin, { x: p[0], y: p[1] }); }

      fadeOn(13, 30, $1(".ask"), 0.85, FADE);        // the prompt
      fadeOn(61, 24, $1(".reply"), 1.0, FADE);       // the reply, 30 f clean gap after the prompt settles

      // open triangle: appears at 300% and settles over 17 f, strong ease-out, no opacity ramp
      const tri = $1(".tri"), eo = gsap.parseEase("power4.out");
      at(90, tri, { opacity: 1 });
      for (let i = 0; i <= 16; i++) at(90 + i, tri, { scale: +(3 - 2 * eo(i / 16)).toFixed(4) });

      // F94-117 hairline traced left to right from the marker under the reply: linear, last 4 f ease out
      const DRAW = 24, eo2 = gsap.parseEase("power2.out");
      for (let i = 1; i <= DRAW; i++) {
        let k = i / DRAW; if (i > DRAW - 4) k = (DRAW - 4) / DRAW + eo2((i - (DRAW - 4)) / 4) * 4 / DRAW;
        at(93 + i, hair, { scaleX: +k.toFixed(4) });
      }
      tl.set({}, {}, N / FPS);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
