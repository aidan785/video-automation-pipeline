<!doctype html>
<!--
  Humanly Possible v2 · APPLE / A24 · name (tier1, 108 frames = 4.5 s at 24 fps)
  Research: raw-media/hp-sampler-refs/apple-a24/ANALYSIS.md (graphic types B, C, A; translation spec "name").
  The name card is a text field: the photo is an inline image, the caret sits after it, the role then
  lives on as a caption over picture that carries across a cut and leaves by select-delete.
    F1-10    cream field, tall orange caret alone, blinking               (mac-dorm f220-232)
    F11      photo + "Dana Ruiz" arrive in ONE frame, caret right of photo (mac-dorm_f0240_namecard-photo; "Tulsa, OK" right-aligned like "20yrs, Student")
    F11-37   hold, caret blinks 14 on / 10 off
    F38      hard cut to picture; role caption middle-left, same frame     (mac-dorm_f0290_role-caption)
    F60      picture cut; caption carries across it                       (mac-dorm f304/305)
    F72      caret appears after the caption, blinks
    F80-85   selection sweeps right to left, accelerating (6 f)           (mac-dorm f1175-1180)
    F85-94   held selected (10 f); F95 deleted in one frame; shot runs clean to F108, hard cut out.
  F numbers are 1-based; time = (F-1)/24. Every change is a tl.set on an exact frame. Nothing eases.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;1,400&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#2C0B16;}
      #hp2-apple-a24-name{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;
        --oxblood:#4B1526;--cream:#FFF0E6;--brick:#7A1E1E;--orange:#FF8A4C;--gold:#FFC145;--deep:#2C0B16;
        font-family:"Inter Tight",sans-serif;font-weight:500;}
      #hp2-apple-a24-name .layer{position:absolute;inset:0;opacity:0;}
      #hp2-apple-a24-name .shot video,#hp2-apple-a24-name .shot img{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;}
      /* text field: cream, faint dot grid, white bloom top right (a lit screen) */
      #hp2-apple-a24-name .field{position:absolute;inset:0;background:
        radial-gradient(ellipse 520px 420px at 1920px 0px,rgba(255,255,255,1) 0%,rgba(255,255,255,.75) 38%,rgba(255,255,255,0) 100%),
        radial-gradient(circle,rgba(44,11,22,.055) 0.9px,rgba(44,11,22,0) 1.3px) 0 0/5px 5px,
        #FFF0E6;}
      #hp2-apple-a24-name .photo{position:absolute;left:660px;top:205px;width:600px;height:670px;overflow:hidden;background:#1a0a0e;}
      #hp2-apple-a24-name .photo img{position:absolute;left:-170px;top:-200px;width:930px;height:auto;}
      #hp2-apple-a24-name .fname{position:absolute;left:40px;top:510px;font-size:56px;line-height:1;color:var(--deep);letter-spacing:-.01em;white-space:pre;}
      #hp2-apple-a24-name .detail{position:absolute;right:36px;top:510px;font-size:56px;line-height:1;color:var(--deep);letter-spacing:-.01em;white-space:pre;}
      #hp2-apple-a24-name .tallcaret{position:absolute;left:1288px;top:182px;width:7px;height:716px;border-radius:4px;background:var(--orange);}
      #hp2-apple-a24-name .cap{position:absolute;left:44px;top:518px;font-size:44px;line-height:1;color:var(--cream);letter-spacing:-.005em;white-space:pre;}
      #hp2-apple-a24-name .caret{display:inline-block;width:4px;height:1.12em;margin-left:3px;vertical-align:-.2em;border-radius:2px;background:var(--orange);opacity:0;}
    </style>
  </head>
  <body>
    <div id="hp2-apple-a24-name" data-composition-id="hp2-apple-a24-name" data-start="0" data-width="1920" data-height="1080">
      <div class="layer shot s1"><video id="nm-v1" data-slot="media" src="../../assets/footage/groom_6816883.mp4" muted playsinline preload="auto" data-start="1.5417" data-duration="0.9167" data-track-index="1"></video></div>
      <div class="layer shot s2"><video id="nm-v2" data-slot="media-2" src="../../assets/footage/groom2_6131038.mp4" muted playsinline preload="auto" data-start="2.4583" data-duration="2.0417" data-track-index="2" data-media-start="2"></video></div>

      <div class="layer card">
        <div class="field"></div>
        <div class="photo"><img data-slot="photo" src="../../assets/dana-cutout.png" alt="" /></div>
        <div class="fname" data-slot="name">Dana Ruiz</div>
        <div class="detail" data-slot="detail">Tulsa, OK</div>
        <div class="tallcaret" data-tell-ok="caret"></div>
      </div>

      <div class="layer caption"><div class="cap"><span class="txt" data-slot="role">Dog groomer in Tulsa</span><span class="caret" data-tell-ok="caret"></span></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-apple-a24-name", FPS = 24, N = 108;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s), $ = (s) => ROOT.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      const show = (F, el) => at(F, typeof el === "string" ? $1(el) : el, { opacity: 1 });
      const hide = (F, el) => at(F, typeof el === "string" ? $1(el) : el, { opacity: 0 });
      // split a text element into one span per character (keeps <i> etc.)
      function chars(el) { const out = []; (function walk(n) { [...n.childNodes].forEach((c) => {
        if (c.nodeType === 3) { const f = document.createDocumentFragment(); [...c.textContent].forEach((ch) => { const s = document.createElement("span"); s.textContent = ch; f.appendChild(s); out.push(s); }); n.replaceChild(f, c); }
        else if (c.nodeType === 1) walk(c); }); })(el); return out; }
      // caret blink on ones: on/off frames from F0 until F1 (exclusive)
      function blink(F0, F1, el, on = 14, off = 10) { for (let F = F0; F < F1; F += on + off) { at(F, el, { opacity: 1 }); if (F + on < F1) at(F + on, el, { opacity: 0 }); } }
      // selection grows right to left, accelerating, over n frames
      function sweepRTL(F0, n, arr, color) { const L = arr.length; let done = 0;
        for (let i = 1; i <= n; i++) { const k = Math.max(done + 1, Math.ceil(L * Math.pow(i / n, 1.8))); for (let j = done; j < Math.min(k, L); j++) at(F0 + i - 1, arr[L - 1 - j], { backgroundColor: color }); done = Math.min(k, L); } }
      const SEL = "rgba(255,193,69,.45)";

      tl.set($(".layer"), { opacity: 0 }, 0);
      const tall = $1(".tallcaret"), cap = chars($1(".cap .txt")), caret = $1(".cap .caret");
      tl.set(cap, { backgroundColor: "rgba(255,193,69,0)", display: "inline" }, 0);
      tl.set(caret, { opacity: 0 }, 0);

      // F1-37 text field: caret alone, then photo + name in one frame
      show(1, ".card");
      tl.set([$1(".photo"), $1(".fname"), $1(".detail")], { opacity: 0 }, 0);
      at(1, tall, { opacity: 1 }); at(7, tall, { opacity: 0 });              // F1-6 on, F7-10 off
      show(11, ".photo"); show(11, ".fname"); show(11, ".detail");
      blink(11, 38, tall);
      // F38 hard cut to picture, caption on the same frame
      hide(38, ".card"); show(38, ".s1"); show(38, ".caption");
      // F60 picture cut, caption carries
      hide(60, ".s1"); show(60, ".s2");
      // F72 caret, F80-85 select right to left, F85-94 held, F95 delete
      blink(72, 80, caret); at(80, caret, { opacity: 1 });
      sweepRTL(80, 6, cap, SEL);
      at(86, caret, { opacity: 0 });
      at(95, cap, { display: "none" });
      tl.set({}, {}, N / FPS);

      window.__timelines[ID] = tl;
      if (/poster/.test(location.hash)) $("video").forEach((v) => { const i = document.createElement("img"); i.src = v.getAttribute("src").replace(".mp4", ".jpg"); v.replaceWith(i); });
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
