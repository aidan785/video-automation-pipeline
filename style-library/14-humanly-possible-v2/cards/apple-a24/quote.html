<!doctype html>
<!--
  Humanly Possible v2 · APPLE / A24 · quote (tier2 over picture, 120 frames = 5.0 s at 24 fps)
  Research: raw-media/hp-sampler-refs/apple-a24/ANALYSIS.md (graphic type G, signature move 4 "quote on the cut").
  A24 press-quote grammar: a book serif, Bold for the charged words and Regular for the connectors, two lines
  centred over the flattest part of a soft shot, credit in italic name + caps source. The quote's first and
  last frames ARE the shot's first and last frames. Zero fade, no plate, no shadow.
    F1-18    shot A, clean
    F19      cut to shot B (chosen for the type: flat sky); quote on, same frame   (aftersun_f0520_pressquote, f500)
    F19-96   hold 78 f (reference: 79 f)
    F97      cut to shot C; quote off on the cut                                    (aftersun f578/579)
    F97-120  shot C clean. Hard cut out.
  F numbers are 1-based; time = (F-1)/24.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#2C0B16;}
      #hp2-apple-a24-quote{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;
        --oxblood:#4B1526;--cream:#FFF0E6;--brick:#7A1E1E;--orange:#FF8A4C;--gold:#FFC145;--deep:#2C0B16;
        font-family:"EB Garamond",serif;color:var(--cream);}
      #hp2-apple-a24-quote .layer{position:absolute;inset:0;opacity:0;}
      #hp2-apple-a24-quote .shot video,#hp2-apple-a24-quote .shot img{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;}
      #hp2-apple-a24-quote .q{position:absolute;left:0;right:0;top:436px;text-align:center;font-size:76px;line-height:96px;font-weight:400;letter-spacing:.005em;}
      #hp2-apple-a24-quote .q b{font-weight:700;}
      #hp2-apple-a24-quote .q .ln{display:block;white-space:pre;}
      #hp2-apple-a24-quote .q .open{margin-left:-.42em;}
      #hp2-apple-a24-quote .cr{position:absolute;left:0;right:0;top:648px;text-align:center;font-size:24px;line-height:1;letter-spacing:.02em;}
      #hp2-apple-a24-quote .cr i{font-style:italic;}
      #hp2-apple-a24-quote .cr .src{font-size:21px;letter-spacing:.04em;text-transform:uppercase;}
    </style>
  </head>
  <body>
    <div id="hp2-apple-a24-quote" data-composition-id="hp2-apple-a24-quote" data-start="0" data-width="1920" data-height="1080">
      <div class="layer shot s1"><video id="qt-v1" data-slot="media" src="../../assets/footage/field_30178060.mp4" muted playsinline preload="auto" data-start="0" data-duration="0.75" data-track-index="1" data-media-start="1"></video></div>
      <div class="layer shot s2"><video id="qt-v2" data-slot="media-2" src="../../assets/footage/prairie_13975529.mp4" muted playsinline preload="auto" data-start="0.75" data-duration="3.25" data-track-index="2" data-media-start="1"></video></div>
      <div class="layer shot s3"><video id="qt-v3" data-slot="media-3" src="../../assets/footage/dusk_5941610.mp4" muted playsinline preload="auto" data-start="4" data-duration="1" data-track-index="3" data-media-start="1"></video></div>
      <div class="layer type">
        <div class="q" data-slot="quote"><span class="ln"><span class="open">&ldquo;</span>I didn't <b>hire help</b>.</span><span class="ln">I got my <b>evenings back</b>.&rdquo;</span></div>
        <div class="cr"><i data-slot="credit-name">Dana Ruiz</i>, <span class="src" data-slot="credit-source">Tulsa</span></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-apple-a24-quote", FPS = 24, N = 120;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s), $ = (s) => ROOT.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      const show = (F, s) => at(F, $1(s), { opacity: 1 });
      const hide = (F, s) => at(F, $1(s), { opacity: 0 });

      tl.set($(".layer"), { opacity: 0 }, 0);
      show(1, ".s1");
      hide(19, ".s1"); show(19, ".s2"); show(19, ".type");      // on, on the cut
      hide(97, ".s2"); hide(97, ".type"); show(97, ".s3");      // off, on the cut
      tl.set({}, {}, N / FPS);

      window.__timelines[ID] = tl;
      if (/poster/.test(location.hash)) $("video").forEach((v) => { const i = document.createElement("img"); i.src = v.getAttribute("src").replace(".mp4", ".jpg"); v.replaceWith(i); });
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
