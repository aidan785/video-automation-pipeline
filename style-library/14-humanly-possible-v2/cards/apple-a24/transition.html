<!doctype html>
<!--
  Humanly Possible v2 · APPLE / A24 · transition (transition, 60 frames = 2.5 s at 24 fps)
  Research: raw-media/hp-sampler-refs/apple-a24/ANALYSIS.md (A24 datamosh shot-to-shot; NOTES_raw "Datamosh
  (I-frame removed MPEG smear) is the signature transition", aftersun f82-105, f121-134, f218-235).
  Real codec damage, not an effect: assets/apple-a24/mosh/build-mosh.sh transition encodes shot A + shot B in
  MPEG-4 Part 2 and drops shot B's first I-frame, so B's motion vectors drag A's last picture apart in 16 px
  macroblocks until the next kept I-frame snaps B clean. The two shots play live on either side; the plate is
  shown only on the mosh frames. Swap media / media-2 -> rerun the script with the same two clips.
    F1-24    shot A live (media)
    F25-38   datamosh: A's pixels pushed by B's motion (14 f, reference 8-24 f)   (aftersun_f0020_logo-datamosh)
    F39-60   shot B live (media-2), continuous with the plate's last frame
  Never a crossfade, slide, whip or blur. F numbers are 1-based; time = (F-1)/24.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#2C0B16;}
      #hp2-apple-a24-transition{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;}
      #hp2-apple-a24-transition .layer{position:absolute;inset:0;opacity:0;}
      #hp2-apple-a24-transition .shot video,#hp2-apple-a24-transition .shot img{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;}
    </style>
  </head>
  <body>
    <div id="hp2-apple-a24-transition" data-composition-id="hp2-apple-a24-transition" data-start="0" data-width="1920" data-height="1080">
      <div class="layer shot sa"><video id="tr-a" data-slot="media" src="../../assets/footage/groom2_6131038.mp4" muted playsinline preload="auto" data-start="0" data-duration="1" data-track-index="1"></video></div>
      <div class="layer shot mosh"><video id="tr-mosh" src="../../assets/apple-a24/mosh/transition-plate.mp4" muted playsinline preload="auto" data-start="1" data-duration="0.5833" data-track-index="2" data-media-start="1"></video></div>
      <div class="layer shot sb"><video id="tr-b" data-slot="media-2" src="../../assets/footage/groom_6131725.mp4" muted playsinline preload="auto" data-start="1.5833" data-duration="0.9167" data-track-index="3" data-media-start="0.5833"></video></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-apple-a24-transition", FPS = 24, N = 60;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s), $ = (s) => ROOT.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      const show = (F, s) => at(F, $1(s), { opacity: 1 });
      const hide = (F, s) => at(F, $1(s), { opacity: 0 });

      tl.set($(".layer"), { opacity: 0 }, 0);
      show(1, ".sa");
      hide(25, ".sa"); show(25, ".mosh");     // cut: B's I-frame is missing, A melts under B's motion
      hide(39, ".mosh"); show(39, ".sb");     // kept I-frame: B clean
      tl.set({}, {}, N / FPS);

      window.__timelines[ID] = tl;
      if (/poster/.test(location.hash)) $("video").forEach((v) => { const i = document.createElement("img"); i.src = v.getAttribute("src").replace(".mp4", ".jpg"); v.replaceWith(i); });
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
