<!doctype html>
<!--
  Humanly Possible v2 · APPLE / A24 · title (tier1, 102 frames = 4.25 s at 24 fps)
  Research: raw-media/hp-sampler-refs/apple-a24/ANALYSIS.md (graphic type H, signature move 5 "datamosh card").
  A24 title card: wide-tracked sans caps on a real paper scan (ambientCG Paper001, CC0, graded warm grey toward
  cream with a lens-like vignette), credit line in a typewriter face arriving 15 f after the title.
  The break-in and break-up are REAL codec damage, not an effect: assets/apple-a24/mosh/build-mosh.sh encodes
  footage -> this card -> footage in MPEG-4 Part 2 and drops the I-frames at both cuts (ffmpeg noise bsf), so the
  card's motion vectors and residuals are applied to the previous picture. The plate is shown only on the
  mosh frames; the clean hold is the live HTML below (slots stay editable). Change the text -> rebuild the plate.
    F1-12    shot A (in the plate)
    F13-28   datamosh in: card type breaks in over shot A in 16 px macroblocks (16 f)   (aftersun_f0020, f2471-2483)
    F29      clean title, live                                                           (aftersun_f2500_title)
    F44      credit line arrives, 15 f after the title (typewriter)                      (aftersun f2486)
    F50-59   paper grade drifts warm to cool, sampled per frame                          (aftersun f2490-2500)
    F85-90   break-up out: shot C's motion drags the card apart (6 f)                    (aftersun f2540-2543)
    F91-102  shot C clean. Hard cut out.
  F numbers are 1-based; time = (F-1)/24. Every change is a tl.set on an exact frame.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600&family=Courier+Prime&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#2C0B16;}
      #hp2-apple-a24-title{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;
        --oxblood:#4B1526;--cream:#FFF0E6;--brick:#7A1E1E;--orange:#FF8A4C;--gold:#FFC145;--deep:#2C0B16;}
      #hp2-apple-a24-title .layer{position:absolute;inset:0;opacity:0;}
      #hp2-apple-a24-title .plate video,#hp2-apple-a24-title .plate img,#hp2-apple-a24-title .paper{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;}
      #hp2-apple-a24-title .ttl{position:absolute;left:0;right:0;top:500px;text-align:center;font-family:"Inter Tight",sans-serif;font-weight:600;font-size:64px;line-height:1;letter-spacing:.28em;text-indent:.28em;text-transform:uppercase;color:var(--deep);white-space:pre;}
      #hp2-apple-a24-title .cr{position:absolute;left:0;right:0;top:612px;text-align:center;font-family:"Courier Prime",monospace;font-size:38px;line-height:1;color:var(--deep);white-space:pre;}
    </style>
  </head>
  <body>
    <div id="hp2-apple-a24-title" data-composition-id="hp2-apple-a24-title" data-start="0" data-width="1920" data-height="1080">
      <!-- datamosh plate: built by assets/apple-a24/mosh/build-mosh.sh from media (dusk_33845059) + this card + groom_6131725 -->
      <div class="layer plate"><video id="tt-plate" data-slot="media" src="../../assets/apple-a24/mosh/title-plate.mp4" muted playsinline preload="auto" data-start="0" data-duration="4.25" data-track-index="1"></video></div>
      <div class="layer live">
        <img class="paper warm" src="../../assets/apple-a24/paper-warm.jpg" alt="" />
        <img class="paper cool" src="../../assets/apple-a24/paper-cool.jpg" alt="" />
        <div class="ttl" data-slot="title">The front desk answers itself</div>
        <div class="cr" data-slot="chapter">Chapter 02</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-apple-a24-title", FPS = 24, N = 102;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s), $ = (s) => ROOT.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      const show = (F, s) => at(F, $1(s), { opacity: 1 });
      const hide = (F, s) => at(F, $1(s), { opacity: 0 });

      tl.set($(".layer"), { opacity: 0 }, 0);
      tl.set([$1(".cr"), $1(".cool")], { opacity: 0 }, 0);
      show(1, ".plate");                                     // F1-28 shot A + mosh in (plate)
      hide(29, ".plate"); show(29, ".live");                 // F29 clean, live
      show(44, ".cr");                                       // F44 credit, 15 f later
      for (let F = 50; F <= 59; F++) at(F, $1(".cool"), { opacity: (F - 49) / 10 });   // warm -> cool grade drift on ones
      hide(85, ".live"); show(85, ".plate");                 // F85-90 break-up, F91-102 shot C (plate)
      tl.set({}, {}, N / FPS);

      window.__timelines[ID] = tl;
      if (/poster/.test(location.hash)) $("video").forEach((v) => { const i = document.createElement("img"); i.src = v.getAttribute("src").replace(".mp4", ".jpg"); v.replaceWith(i); });
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
