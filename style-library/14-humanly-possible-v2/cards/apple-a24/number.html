<!doctype html>
<!--
  Humanly Possible v2 · APPLE / A24 · number (tier2 over picture, 72 frames = 3.0 s at 24 fps)
  Research: raw-media/hp-sampler-refs/apple-a24/ANALYSIS.md (signature move 3 "scale jump", translation spec "number").
    F1-8     picture clean
    F9-15    "6 hours" typed one character per frame at caption size, no caret   (mac-dorm f2021-2044)
    F17      ONE-FRAME scale jump: "6 hours" to display size; "a week" lands at caption size
                                                                               (mac-dorm_f0182_hacking-productivity, f172-177)
    F21      "a week" jumps to display size, indented under it                (mac-dorm f181)
    F23-27   "back." typed in italic at caption size under the second line
    F27-72   hold. No count-up, no counter, no ring. Card ends on the picture cut.
  The media slot is the footage the type sits on (in an edit: the shot under it).
  F numbers are 1-based; time = (F-1)/24. Every change is a tl.set on an exact frame.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter+Tight:ital,wght@0,500;1,500&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#2C0B16;}
      #hp2-apple-a24-number{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;
        --oxblood:#4B1526;--cream:#FFF0E6;--brick:#7A1E1E;--orange:#FF8A4C;--gold:#FFC145;--deep:#2C0B16;
        font-family:"Inter Tight",sans-serif;font-weight:500;color:var(--cream);}
      #hp2-apple-a24-number .layer{position:absolute;inset:0;opacity:0;}
      #hp2-apple-a24-number .shot video,#hp2-apple-a24-number .shot img{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;}
      #hp2-apple-a24-number .t{position:absolute;line-height:1;white-space:pre;}
      #hp2-apple-a24-number .small{font-size:44px;letter-spacing:-.005em;}
      #hp2-apple-a24-number .big{font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"opsz" 96;font-weight:800;font-size:320px;letter-spacing:-.035em;}
      #hp2-apple-a24-number .typed{left:300px;top:518px;}
      #hp2-apple-a24-number .l1{left:96px;top:466px;}
      #hp2-apple-a24-number .l2s{left:640px;top:920px;}
      #hp2-apple-a24-number .l2{left:640px;top:700px;}
      #hp2-apple-a24-number .back{left:648px;top:984px;font-style:italic;}
    </style>
  </head>
  <body>
    <div id="hp2-apple-a24-number" data-composition-id="hp2-apple-a24-number" data-start="0" data-width="1920" data-height="1080">
      <div class="layer shot s1"><video id="nb-v1" data-slot="media" src="../../assets/footage/groom_6131725.mp4" muted playsinline preload="auto" data-start="0" data-duration="3" data-track-index="1" data-media-start="1"></video></div>
      <div class="t small typed" data-slot="value">6 hours</div>
      <div class="t big l1">6 hours</div>
      <div class="t small l2s" data-slot="unit">a week</div>
      <div class="t big l2">a week</div>
      <div class="t small back" data-slot="kicker">back.</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-apple-a24-number", FPS = 24, N = 72;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s), $ = (s) => ROOT.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      const show = (F, s) => at(F, $1(s), { opacity: 1 });
      const hide = (F, s) => at(F, $1(s), { opacity: 0 });
      function chars(el) { const t = el.textContent; el.textContent = ""; return [...t].map((c) => { const s = document.createElement("span"); s.textContent = c; el.appendChild(s); return s; }); }
      // display copies mirror the slot text
      $1(".l1").textContent = $1(".typed").textContent; $1(".l2").textContent = $1(".l2s").textContent;

      tl.set($(".layer, .t"), { opacity: 0 }, 0);
      show(1, ".s1");
      // F9-15 typed, one character per frame
      const ty = chars($1(".typed")); tl.set(ty, { display: "none" }, 0); show(9, ".typed");
      ty.forEach((s, i) => at(9 + i, s, { display: "inline" }));
      // F17 scale jump (one frame), "a week" arrives small
      hide(17, ".typed"); show(17, ".l1"); show(17, ".l2s");
      // F21 "a week" jumps
      hide(21, ".l2s"); show(21, ".l2");
      // F23-27 "back." typed, italic
      const bk = chars($1(".back")); tl.set(bk, { display: "none" }, 0); show(23, ".back");
      bk.forEach((s, i) => at(23 + i, s, { display: "inline" }));
      tl.set({}, {}, N / FPS);

      window.__timelines[ID] = tl;
      if (/poster/.test(location.hash)) $("video").forEach((v) => { const i = document.createElement("img"); i.src = v.getAttribute("src").replace(".mp4", ".jpg"); v.replaceWith(i); });
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
