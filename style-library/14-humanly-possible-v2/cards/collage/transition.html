<!doctype html>
<!--
  Humanly Possible v2 · COLLAGE · transition (24 fps, 48 f = 2 s): ink swipe into defocus
  Research: raw-media/hp-sampler-refs/handmade-collage/ANALYSIS.md, signature move H ("Transition 1 to 2").
  Matches: ig-reel_f00415 (black brush strokes crossing with motion blur), ig-reel_f00417 (the frame after:
  defocused, racking back to sharp), ig-reel f414-420 (3 f of strokes, 1 f full defocus, 3 f rack).
  The strokes are real India-ink brush strokes scanned at 300 dpi (OpenGameArt CC0 raw scans), tinted deep
  oxblood-black; their motion blur is directional (horizontal only), like the reel. The transition is made of the
  content: shot A is wiped by ink, shot B arrives out of focus and racks sharp. Nothing fades.
  Shot A (data-slot="media") F1-F23, swipe F22-F24, B at 18 px blur F24-F25, rack 12 -> 0 px F26-F29, B holds.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#2C0B16;}
      #hp2-collage-transition{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;}
      #hp2-collage-transition .shot{position:absolute;inset:-80px;opacity:0;}
      #hp2-collage-transition .shot video{position:absolute;left:0;top:0;width:2080px;height:1240px;object-fit:cover;}
      #hp2-collage-transition .stroke{position:absolute;left:0;top:0;opacity:0;filter:url(#hp2c-mblur);}
      #hp2-collage-transition .s1{width:2300px;height:auto;}
      #hp2-collage-transition .s2{width:2700px;height:auto;}
      #hp2-collage-transition .s3{width:2300px;height:auto;}
    </style>
  </head>
  <body>
    <div id="hp2-collage-transition" data-composition-id="hp2-collage-transition" data-start="0" data-width="1920" data-height="1080">
      <svg width="0" height="0" style="position:absolute">
        <filter id="hp2c-mblur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="40 0" /></filter>
      </svg>
      <div class="shot sA">
        <video data-slot="media" src="../../assets/footage/groom_6132700.mp4" poster="../../assets/footage/groom_6132700.jpg" muted playsinline preload="auto" data-start="0" data-duration="1" data-track-index="0"></video>
      </div>
      <div class="shot sB">
        <video data-slot="media-2" src="../../assets/footage/groom_6816875.mp4" poster="../../assets/footage/groom_6816875.jpg" muted playsinline preload="auto" data-start="0.917" data-duration="1.083" data-track-index="1"></video>
      </div>
      <img class="stroke s1" src="../../assets/collage/ink-stroke-b.png" alt="" />
      <img class="stroke s2" src="../../assets/collage/ink-stroke-c.png" alt="" />
      <img class="stroke s3" src="../../assets/collage/ink-stroke-b.png" alt="" />
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-collage-transition", FPS = 24, N = 48;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s), $ = (s) => ROOT.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));

      const A = $1(".sA"), B = $1(".sB"), s1 = $1(".s1"), s2 = $1(".s2"), s3 = $1(".s3");
      tl.set(A, { opacity: 1 }, 0);
      tl.set(B, { opacity: 0 }, 0);
      tl.set([s1, s2, s3], { opacity: 0 }, 0);

      // ---- F1-F21 shot A holds (the camera on the shot drifts 1.5% on ones)
      for (let F = 1; F <= 23; F++) at(F, A, { scale: 1 + 0.015 * (F - 1) / 22 });

      // ---- F22-F24 three ink strokes cross left to right, one position per frame (no tween), staggered rows
      // [x, y, rotation] per frame for each stroke; they accelerate across like a hand swipe
      const P = {
        s1: [[-2100, -260, -4], [-950, -280, -3], [420, -300, -3]],
        s2: [[-2350, 205, 3], [-1250, 190, 2], [120, 175, 2]],
        s3: [[-2400, 440, -2], [-1550, 470, -3], [-200, 500, -4]],
      };
      const SY = { s1: 0.55, s2: 0.8, s3: -0.5 };
      [["s1", s1], ["s2", s2], ["s3", s3]].forEach(([k, el]) => P[k].forEach(([x, y, r], i) => at(22 + i, el, { opacity: 1, x, y, rotation: r, scaleY: SY[k] })));
      at(25, [s1, s2, s3], { opacity: 0 });

      // ---- F24 cut to B under the last stroke frame, fully defocused (18 px) through F25; F26-F29 racks 12 -> 0
      at(24, A, { opacity: 0 }); at(24, B, { opacity: 1, filter: "blur(18px)", scale: 1.012 });
      at(25, B, { filter: "blur(18px)" });
      [12, 5.5, 2, 0.5].forEach((b, i) => at(26 + i, B, { filter: "blur(" + b + "px)", scale: 1.012 - 0.003 * (i + 1) }));
      at(30, B, { filter: "none", scale: 1 });

      // ---- F30-F48 shot B holds
      tl.set({}, {}, N / FPS);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
