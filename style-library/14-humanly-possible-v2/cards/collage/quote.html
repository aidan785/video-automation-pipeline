<!doctype html>
<!--
  Humanly Possible v2 · COLLAGE · quote (tier 1, 24 fps, 120 f = 5 s)
  Research: raw-media/hp-sampler-refs/handmade-collage/ANALYSIS.md, "Callout + quote" and signature moves B + C.
  Matches: vox-ok_f01170 (hero: label risen from its own kinked line, headline, highlighter low on the letters
  stopping short), vox-ok_f01166 (headline roughed up for its first 3 f), vox-ok_f00990 (callout on an archival
  hand-colored figure).
  Plate: J. J. Chalon, "Les Tondeuses de Chiens" (1820, hand-colored lithograph, Paris Musees CC0) on the
  scanned paper ground; filmed dust on ones. Cadence: fast in, long dead hold (tell 6).
  Callout geometry is placed by hand on this plate (MARK_LINE); move it if the plate (data-slot="media") changes.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter+Tight:wght@400;500;600&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#2C0B16;}
      #hp2-collage-quote{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;
        --oxblood:#4B1526;--cream:#FFF0E6;--brick:#7A1E1E;--orange:#FF8A4C;--gold:#FFC145;--deep:#2C0B16;
        font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"opsz" 96;}
      #hp2-collage-quote .cam{position:absolute;inset:0;transform-origin:960px 600px;}
      #hp2-collage-quote .paper{position:absolute;left:-96px;top:-54px;width:2112px;height:1188px;}
      #hp2-collage-quote .plate{position:absolute;left:760px;top:360px;width:1240px;height:auto;transform:rotate(1.4deg);transform-origin:620px 300px;}
      #hp2-collage-quote .q{position:absolute;left:118px;font-size:104px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--deep);
        white-space:nowrap;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;}
      #hp2-collage-quote .q1{top:88px;}
      #hp2-collage-quote .q2{top:204px;}
      #hp2-collage-quote .hlw{position:relative;}
      #hp2-collage-quote .hlw i{position:relative;font-style:normal;z-index:1;}
      #hp2-collage-quote .hl{position:absolute;left:-6px;right:0;top:56%;height:42%;background:var(--gold);z-index:0;
        transform-origin:0 50%;clip-path:polygon(0 4%,100% 0,99.6% 100%,.3% 93%);}
      #hp2-collage-quote .lab{position:absolute;left:470px;top:656px;overflow:hidden;padding:0 4px 4px 0;}
      #hp2-collage-quote .lab i{display:block;font-style:normal;font-size:56px;font-weight:800;line-height:1;letter-spacing:-.025em;color:var(--deep);}
      #hp2-collage-quote svg{position:absolute;left:0;top:0;overflow:visible;}
      #hp2-collage-quote .ink{fill:none;stroke-linecap:round;stroke-linejoin:miter;}
      #hp2-collage-quote .dust{position:absolute;inset:0;width:1920px;height:1080px;mix-blend-mode:multiply;opacity:.16;}
    </style>
  </head>
  <body>
    <div id="hp2-collage-quote" data-composition-id="hp2-collage-quote" data-start="0" data-width="1920" data-height="1080">
      <div class="cam">
        <img class="paper" src="../../assets/collage/paper-cream.jpg" alt="" />
        <img class="plate" data-slot="media" src="../../assets/collage/tondeuses-chalon-1820.jpg" alt="" />
        <div class="q q1" data-slot="quote-1">&ldquo;I didn't hire help.</div>
        <div class="q q2" data-slot="quote-2">I got <span class="hlw"><b class="hl"></b><i>my evenings bac</i></span>k.&rdquo;</div>
        <svg width="1920" height="1080">
          <path class="ink line" stroke="#FFC145" stroke-width="7" />
        </svg>
        <div class="lab" data-slot="attribution"><i>Dana Ruiz</i></div>
      </div>
      <video class="dust" src="../../assets/collage/dust-light.mp4" muted playsinline preload="auto" data-start="0" data-duration="5" data-track-index="9"></video>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-collage-quote", FPS = 24, N = 120;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s), $ = (s) => ROOT.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      // a ruled line drawn by hand: straight runs between hand-placed points, sharp elbow (Vox callout), drawn to
      // length `len` px; each drawing frame gets its own small wobble
      function polyTo(pts, len, r) {
        let d = "M" + pts[0][0] + " " + pts[0][1], left = len;
        for (let i = 1; i < pts.length && left > 0; i++) {
          const [ax, ay] = pts[i - 1], [bx, by] = pts[i], seg = Math.hypot(bx - ax, by - ay), k = Math.min(1, left / seg);
          const w = r ? (r() - .5) * 1.6 : 0;
          d += " L" + (ax + (bx - ax) * k + w).toFixed(1) + " " + (ay + (by - ay) * k - w).toFixed(1); left -= seg;
        }
        return d;
      }

      tl.set($(".q"), { opacity: 0 }, 0);
      tl.set($1(".hl"), { scaleX: 0 }, 0);
      tl.set($1(".lab i"), { yPercent: 110 }, 0);
      tl.set($1(".line"), { opacity: 0 }, 0);

      // ---- F1-F6 the plate lands with the camera settling 1.03 -> 1.0 (ease-out, on ones)
      const cam = $1(".cam"), eo = gsap.parseEase("power3.out");
      for (let i = 0; i <= 5; i++) at(1 + i, cam, { scale: 1.03 - 0.03 * eo(i / 5) });

      // ---- F6 1-f dot on the groomer, F7-F9 line to the elbow, F10-F11 the arm; label rises out of the arm F11-F16
      const MARK_LINE = [[1338, 640], [1196, 726], [1190, 727], [472, 729]];
      const line = $1(".line"), r = rng(9);
      let L = 0; for (let i = 1; i < MARK_LINE.length; i++) L += Math.hypot(MARK_LINE[i][0] - MARK_LINE[i - 1][0], MARK_LINE[i][1] - MARK_LINE[i - 1][1]);
      const segA = Math.hypot(MARK_LINE[1][0] - MARK_LINE[0][0], MARK_LINE[1][1] - MARK_LINE[0][1]);
      [[6, 4], [7, segA * .34], [8, segA * .74], [9, segA + 6], [10, segA + 6 + (L - segA - 6) * .58]].forEach(([F, len]) =>
        at(F, line, { opacity: 1, attr: { d: polyTo(MARK_LINE, len, r) } }));
      at(11, line, { attr: { d: polyTo(MARK_LINE, L, null) } });
      const lab = $1(".lab i"), eo2 = gsap.parseEase("power2.out");
      for (let i = 0; i <= 5; i++) at(11 + i, lab, { yPercent: 110 * (1 - eo2(i / 5)) });

      // ---- headline: each line appears roughed up for 3 f (real ink-speckle scan as its mask), then solid
      const rough = [["1500px 420px", "-260px -160px"], ["1350px 380px", "-120px -110px"], ["1600px 460px", "-330px -150px"]];
      [[".q1", 18], [".q2", 26]].forEach(([s, F0]) => {
        const el = $1(s);
        at(F0, el, { opacity: 1 });
        rough.forEach(([sz, pos], i) => at(F0 + i, el, { maskImage: "url(../../assets/collage/ink-speckle.png)", maskSize: sz, maskPosition: pos, webkitMaskImage: "url(../../assets/collage/ink-speckle.png)", webkitMaskSize: sz, webkitMaskPosition: pos }));
        at(F0 + 3, el, { maskImage: "none", webkitMaskImage: "none" });
      });

      // ---- F33-F36 highlighter: 4 f linear behind the lower 40% of "my evenings back", stopping short of the k
      [0.25, 0.5, 0.75, 1].forEach((k, i) => at(33 + i, $1(".hl"), { scaleX: k }));

      // ---- F37-F120 dead hold
      tl.set({}, {}, N / FPS);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
