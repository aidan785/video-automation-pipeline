<!doctype html>
<!--
  Humanly Possible v2 · COLLAGE · title (tier 1, 24 fps, 120 f = 5 s): chapter number + chapter title
  Research: raw-media/hp-sampler-refs/handmade-collage/ANALYSIS.md, "Borders title collage" + move F.
  Matches: vox-borders_f00345 / f00352 (overprinted translucent letterform, planes rotating to level, red digit
  strings), vox-borders_f00366 (one object slot swapping real scans on irregular counts inside a notched frame line,
  title over it, dust), vox-borders_f01765 (the settled lockup holding).
  Materials: the object slot is a stop-motion flipbook of real archival scans (1891 dog tax receipt, 1902
  calendar page, Carle Vernet "Tondeur de Chiens", Truman's 1933 appointment book; all public domain / CC0);
  planes are the scanned book page; ground is the scanned paper; dust filmed, on ones.
  The notched frame is a hand-placed pen path (MARK_FRAME): redraw it if the slot moves.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter+Tight:wght@400;500;600&family=DM+Mono:wght@400&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#2C0B16;}
      #hp2-collage-title{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;
        --oxblood:#4B1526;--cream:#FFF0E6;--brick:#7A1E1E;--orange:#FF8A4C;--gold:#FFC145;--deep:#2C0B16;
        font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"opsz" 96;}
      #hp2-collage-title .cam{position:absolute;inset:0;}
      #hp2-collage-title .paper{position:absolute;left:-96px;top:-54px;width:2112px;height:1188px;}
      #hp2-collage-title .plane{position:absolute;overflow:hidden;mix-blend-mode:multiply;}
      #hp2-collage-title .plane img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(1.32) contrast(.8);}
      #hp2-collage-title .pA{left:830px;top:600px;width:720px;height:420px;transform-origin:50% 50%;}
      #hp2-collage-title .pB{left:150px;top:150px;width:300px;height:520px;transform-origin:50% 50%;opacity:.7;}
      #hp2-collage-title .big{position:absolute;left:1010px;top:30px;font-size:860px;font-weight:800;line-height:1;letter-spacing:-.05em;
        color:var(--brick);opacity:.86;mix-blend-mode:multiply;white-space:nowrap;transform-origin:60% 50%;}
      #hp2-collage-title .slot{position:absolute;left:262px;top:196px;width:440px;height:340px;overflow:hidden;}
      #hp2-collage-title .slot img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;opacity:0;mix-blend-mode:multiply;}
      #hp2-collage-title .digits{position:absolute;font-family:"DM Mono",monospace;font-size:19px;letter-spacing:.06em;color:var(--brick);white-space:nowrap;}
      #hp2-collage-title .chap{position:absolute;left:254px;top:132px;overflow:hidden;padding-bottom:4px;}
      #hp2-collage-title .chap i{display:block;font-style:normal;font-family:"Inter Tight",sans-serif;font-weight:600;font-size:30px;letter-spacing:.01em;color:var(--deep);}
      #hp2-collage-title .ttl{position:absolute;left:300px;top:458px;font-size:128px;font-weight:800;line-height:1.0;letter-spacing:-.035em;color:var(--deep);white-space:nowrap;}
      #hp2-collage-title .ttl .row{display:block;}
      #hp2-collage-title .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em .08em 0;margin-bottom:-.08em;}
      #hp2-collage-title .w > i{display:inline-block;font-style:normal;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;}
      #hp2-collage-title svg{position:absolute;left:0;top:0;overflow:visible;}
      #hp2-collage-title .ink{fill:none;stroke-linecap:round;stroke-linejoin:round;}
      #hp2-collage-title .dust{position:absolute;inset:0;width:1920px;height:1080px;mix-blend-mode:multiply;opacity:.18;}
    </style>
  </head>
  <body>
    <div id="hp2-collage-title" data-composition-id="hp2-collage-title" data-start="0" data-width="1920" data-height="1080">
      <div class="cam">
        <img class="paper" src="../../assets/collage/paper-cream.jpg" alt="" />
        <div class="plane pB"><img src="../../assets/collage/paper-book.jpg" alt="" /></div>
        <div class="big" data-slot="chapter-number">02</div>
        <div class="plane pA"><img src="../../assets/collage/paper-book.jpg" alt="" /></div>
        <div class="slot" data-slot="media">
          <img src="../../assets/collage/receipt-dogtax-1891.jpg" alt="" />
          <img src="../../assets/collage/calendar-1902.jpg" alt="" />
          <img src="../../assets/collage/tondeur-vernet.jpg" alt="" style="object-position:50% 62%" />
          <img src="../../assets/collage/appointment-book-1933.jpg" alt="" style="object-position:20% 30%" />
        </div>
        <svg width="1920" height="1080"><path class="ink frame" stroke="#FF8A4C" stroke-width="5" pathLength="1000" /></svg>
        <div class="digits d1" style="left:1240px;top:842px">0211 0014 2710</div>
        <div class="digits d2" style="left:726px;top:214px">02.1027</div>
        <div class="digits d3" style="left:1552px;top:868px">00 141 02</div>
        <div class="chap" data-slot="chapter-label"><i>Chapter 02</i></div>
        <div class="ttl" data-slot="title"><span class="row"><span class="w"><i>The</i></span> <span class="w"><i>front</i></span> <span class="w"><i>desk</i></span></span><span class="row"><span class="w"><i>answers</i></span> <span class="w"><i>itself</i></span></span></div>
      </div>
      <video class="dust" src="../../assets/collage/dust-light.mp4" muted playsinline preload="auto" data-start="0" data-duration="5" data-track-index="9"></video>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-collage-title", FPS = 24, N = 120;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s), $ = (s) => ROOT.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      function sample(F0, n, ease, fn) { const e = gsap.parseEase(ease); for (let i = 0; i <= n; i++) fn(F0 + i, e(i / n)); }
      function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      function crPath(p) {
        let d = "M" + p[0][0].toFixed(1) + " " + p[0][1].toFixed(1);
        for (let i = 0; i < p.length - 1; i++) {
          const a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c;
          d += " C" + (b[0] + (c[0] - a[0]) / 6).toFixed(1) + " " + (b[1] + (c[1] - a[1]) / 6).toFixed(1) + " " + (c[0] - (e[0] - b[0]) / 6).toFixed(1) + " " + (c[1] - (e[1] - b[1]) / 6).toFixed(1) + " " + c[0].toFixed(1) + " " + c[1].toFixed(1);
        }
        return d;
      }
      // straight runs with sharp corners for a ruled frame, hand wobble on every vertex
      function linePath(p) { return p.map(([x, y], i) => (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1)).join(" "); }
      function penWrite(path, pts, F0, prog, width, seed, build) {
        const r = rng(seed);
        prog.forEach((k, i) => {
          const jit = pts.map(([x, y]) => [x + (r() - .5) * 2.2, y + (r() - .5) * 2.2]);
          at(F0 + i, path, { attr: { d: build(jit), "stroke-width": (width * (0.88 + r() * 0.24)).toFixed(2), "stroke-dasharray": "1000 1000", "stroke-dashoffset": (1000 * (1 - k)).toFixed(1) }, opacity: k > 0 ? 1 : 0 });
        });
        at(F0 + prog.length, path, { attr: { d: build(pts), "stroke-width": width, "stroke-dasharray": "none", "stroke-dashoffset": 0 }, opacity: 1 });
      }

      tl.set($(".w > i, .chap i"), { yPercent: 108 }, 0);
      tl.set($(".digits"), { opacity: 0 }, 0);
      tl.set($1(".frame"), { opacity: 0 }, 0);

      // ---- F1-F10 the planes and the overprinted 02 rotate to level (ease-out, on ones): Borders move F
      const pA = $1(".pA"), pB = $1(".pB"), big = $1(".big");
      sample(1, 9, "power3.out", (F, k) => {
        at(F, pA, { rotation: 7 - 5.6 * k, scale: 1.12 - 0.12 * k });
        at(F, pB, { rotation: -9 + 6.5 * k, scale: 1.1 - 0.1 * k });
      });
      sample(1, 7, "power3.out", (F, k) => at(F, big, { rotation: -4 + 4 * k, scale: 1.08 - 0.08 * k }));

      // ---- object slot: real scans swap in one slot on irregular counts 1, 4, 2, 3 f, then the last holds
      const objs = $(".slot img"), seq = [[0, 1], [1, 4], [2, 2], [0, 3], [3, 0]];   // [scan, frames held]; the last holds
      let F = 2;
      seq.forEach(([n, hold], i) => { at(F, objs[n], { opacity: 1 }); if (hold) { F += hold; at(F, objs[n], { opacity: 0 }); } });

      // ---- F12-F17 orange notched frame line around the slot, 6 f (hand-placed; notch at lower left like Borders)
      const MARK_FRAME = [[250, 184], [716, 181], [719, 551], [312, 553], [310, 520], [247, 521], [250, 188]];
      penWrite($1(".frame"), MARK_FRAME, 12, [0.12, 0.3, 0.5, 0.7, 0.88, 1.0], 5, 21, linePath);

      // ---- red digit strings pop on in 1 f, staggered
      [[".d2", 8], [".d1", 13], [".d3", 17]].forEach(([s, f]) => at(f, $1(s), { opacity: 1 }));

      // ---- chapter label then title words rise from their baseline mask: 5 f each, 3 f apart, first 3 f roughed up
      sample(11, 5, "power2.out", (F, k) => at(F, $1(".chap i"), { yPercent: 108 * (1 - k) }));
      const rough = [["560px", "-160px -110px"], ["520px", "-60px -180px"], ["640px", "-220px -60px"]];
      $(".ttl .w > i").forEach((el, i) => {
        const F0 = 15 + i * 3;
        sample(F0, 5, "power2.out", (F, k) => at(F, el, { yPercent: 108 * (1 - k) }));
        rough.forEach(([sz, pos], j) => at(F0 + j, el, { maskImage: "url(../../assets/collage/ink-speckle.png)", maskSize: sz, maskPosition: pos, webkitMaskImage: "url(../../assets/collage/ink-speckle.png)", webkitMaskSize: sz, webkitMaskPosition: pos }));
        at(F0 + 3, el, { maskImage: "none", webkitMaskImage: "none" });
      });

      // ---- F32-F120 the lockup holds dead still
      tl.set({}, {}, N / FPS);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
