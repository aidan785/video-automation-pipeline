<!doctype html>
<!--
  Humanly Possible v2 · COLLAGE · name (tier 1, 24 fps, 84 f = 3.5 s)
  Research: raw-media/hp-sampler-refs/handmade-collage/ANALYSIS.md, translation spec "Moment 1, name".
  Matches: vox-ok_f01445 (cutout figure in front of a giant cut-paper letterform), vox-ok_f02125 (name super,
  no box), ig-reel_f00001 / f00002 (one-frame flicker open), ig-reel_f00035 (pen ellipse around one word).
  Real materials only: paper = scanned vintage paper (assets/collage/paper-cream.jpg), dog = De Seve 1755
  drawing for Buffon cut out on a torn strip of its own plate, dust = filmed dust overlay on ones.
  Every change is a tl.set on an exact frame (F is 1-based, time = (F-1)/24); eased moves are sampled per frame.
  Pen marks are hand-placed point lists (not geometric ellipses); while being drawn each frame gets its own
  tremble and pressure, then the mark holds dead still like the Vox marks. Mark coordinates are placed by
  hand for the default slot copy: if "Tulsa" changes, redraw the ellipse points (MARK_TULSA) around the new word.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter+Tight:wght@400;500;600&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#2C0B16;}
      #hp2-collage-name{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;
        --oxblood:#4B1526;--cream:#FFF0E6;--brick:#7A1E1E;--orange:#FF8A4C;--gold:#FFC145;--deep:#2C0B16;
        font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"opsz" 96;}
      #hp2-collage-name .layer{position:absolute;inset:0;opacity:0;}
      #hp2-collage-name .field{position:absolute;inset:0;}
      #hp2-collage-name .paper{position:absolute;left:-96px;top:-54px;width:2112px;height:1188px;}
      #hp2-collage-name .cam{position:absolute;inset:0;transform-origin:960px 560px;}
      #hp2-collage-name svg{position:absolute;left:0;top:0;overflow:visible;}
      #hp2-collage-name .ink{fill:none;stroke-linecap:round;stroke-linejoin:round;}

      /* the giant cut-paper D, printed into the paper (multiply lets the scan's tooth through) */
      #hp2-collage-name .bigD{position:absolute;left:1090px;top:-170px;font-size:1500px;font-weight:800;line-height:1;
        letter-spacing:-.04em;color:var(--brick);mix-blend-mode:multiply;white-space:nowrap;}
      #hp2-collage-name .dog{position:absolute;left:1000px;top:418px;height:580px;width:auto;}

      #hp2-collage-name .name{position:absolute;left:140px;top:332px;font-size:150px;font-weight:800;line-height:1;
        letter-spacing:-.035em;color:var(--deep);white-space:nowrap;mix-blend-mode:multiply;}
      #hp2-collage-name .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em .06em 0;margin-bottom:-.06em;}
      #hp2-collage-name .w > i{display:inline-block;font-style:normal;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;}
      #hp2-collage-name .sub{position:absolute;left:144px;top:514px;font-family:"Inter Tight",sans-serif;font-weight:500;
        font-size:40px;line-height:1;letter-spacing:-.005em;color:var(--deep);white-space:nowrap;}
      #hp2-collage-name .sub span{visibility:hidden;}
      #hp2-collage-name .dust{position:absolute;inset:0;width:1920px;height:1080px;mix-blend-mode:multiply;opacity:.16;}
    </style>
  </head>
  <body>
    <div id="hp2-collage-name" data-composition-id="hp2-collage-name" data-start="0" data-width="1920" data-height="1080">
      <!-- F1: the scribbled D on bare paper (reel f1 "How") -->
      <div class="layer L-scrib">
        <img class="paper" src="../../assets/collage/paper-cream.jpg" alt="" />
        <svg width="1920" height="1080"><path class="ink scrib" stroke="#2C0B16" stroke-width="7" /></svg>
      </div>
      <!-- F2 / F3: one-frame color worlds -->
      <div class="layer L-ox"><div class="field" style="background:#4B1526"></div></div>
      <div class="layer L-gold"><div class="field" style="background:#FFC145"></div></div>

      <!-- F4 on: the layout -->
      <div class="layer L-main">
        <div class="cam">
          <img class="paper" src="../../assets/collage/paper-cream.jpg" alt="" />
          <div class="bigD">D</div>
          <img class="dog" data-slot="media" src="../../assets/collage/barbet-cutout.png" alt="" />
          <div class="name" data-slot="name"><span class="w"><i>Dana</i></span> <span class="w"><i>Ruiz</i></span></div>
          <div class="sub" data-slot="role"><span>Dog</span> <span>groomer</span> <span>in</span> <span class="tulsa">Tulsa</span></div>
          <svg width="1920" height="1080"><path class="ink ell" stroke="#FF8A4C" stroke-width="9" pathLength="1000" /></svg>
        </div>
      </div>

      <video class="dust" src="../../assets/collage/dust-light.mp4" muted playsinline preload="auto" data-start="0" data-duration="3.5" data-track-index="9"></video>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-collage-name", FPS = 24, N = 84;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s), $ = (s) => ROOT.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      const show = (F, s) => at(F, $1(s), { opacity: 1 });
      const hide = (F, s) => at(F, $1(s), { opacity: 0 });
      function sample(F0, n, ease, fn) { const e = gsap.parseEase(ease); for (let i = 0; i <= n; i++) fn(F0 + i, e(i / n)); }
      // seeded PRNG (mulberry32): the per-frame tremble is fixed for every render and every seek
      function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      // Catmull-Rom through hand-placed points -> cubic path
      function crPath(p) {
        let d = "M" + p[0][0].toFixed(1) + " " + p[0][1].toFixed(1);
        for (let i = 0; i < p.length - 1; i++) {
          const a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c;
          d += " C" + (b[0] + (c[0] - a[0]) / 6).toFixed(1) + " " + (b[1] + (c[1] - a[1]) / 6).toFixed(1) + " " + (c[0] - (e[0] - b[0]) / 6).toFixed(1) + " " + (c[1] - (e[1] - b[1]) / 6).toFixed(1) + " " + c[0].toFixed(1) + " " + c[1].toFixed(1);
        }
        return d;
      }
      // write a pen mark on: frame-by-frame progress from `prog`, each frame re-inked with its own tremble/pressure,
      // then the settled stroke holds still (Vox marks never boil)
      function penWrite(path, pts, F0, prog, width, seed) {
        const r = rng(seed);
        prog.forEach((k, i) => {
          const jit = pts.map(([x, y]) => [x + (r() - .5) * 2.6, y + (r() - .5) * 2.6]);
          at(F0 + i, path, { attr: { d: crPath(jit), "stroke-width": (width * (0.9 + r() * 0.22)).toFixed(2), "stroke-dasharray": "1000 1000", "stroke-dashoffset": (1000 * (1 - k)).toFixed(1) }, opacity: k > 0 ? 1 : 0 });
        });
        at(F0 + prog.length, path, { attr: { d: crPath(pts), "stroke-width": width, "stroke-dasharray": "none", "stroke-dashoffset": 0 }, opacity: 1 });
      }

      // ---- start state
      tl.set($(".layer"), { opacity: 0 }, 0);
      tl.set($(".w > i"), { yPercent: 105 }, 0);
      tl.set($1(".ell"), { opacity: 0 }, 0);

      // ---- F1 scribbled D (hand-drawn, three overlapping passes, like the reel's "How")
      const SCRIB = [[818,268],[811,350],[820,452],[809,560],[823,672],[806,790],[826,836],[815,742],[800,610],[812,470],[797,330],[806,236],[829,330],[835,488],[828,640],[841,792],[804,812],[792,770],[858,241],[960,236],[1062,272],[1136,350],[1170,452],[1161,566],[1121,676],[1046,766],[950,816],[851,826],[770,812],[836,796],[948,790],[1037,744],[1103,656],[1135,540],[1119,420],[1062,328],[973,282],[880,276],[930,262],[1028,302],[1096,380],[1129,494],[1108,610],[1060,705],[990,768],[905,800]];
      $1(".scrib").setAttribute("d", crPath(SCRIB));
      show(1, ".L-scrib");
      hide(2, ".L-scrib"); show(2, ".L-ox");
      hide(3, ".L-ox"); show(3, ".L-gold");
      hide(4, ".L-gold"); show(4, ".L-main");

      // ---- F4-F9 camera settles from 1.06x / -1.5 deg to rest, ease-out on ones
      const cam = $1(".cam");
      sample(4, 5, "power3.out", (F, k) => at(F, cam, { scale: 1.06 - 0.06 * k, rotation: -1.5 + 1.5 * k }));

      // ---- name words rise from their baseline mask: 5 f each, 3 f stagger; first 3 f roughed up (real ink-speckle scan as mask)
      const rough = [["620px", "-180px -120px"], ["560px", "-60px -210px"], ["700px", "-240px -60px"]];
      [[".name .w:nth-child(1) > i", 9], [".name .w:nth-child(2) > i", 12]].forEach(([s, F0]) => {
        const el = $1(s);
        sample(F0, 5, "power2.out", (F, k) => at(F, el, { yPercent: 105 * (1 - k) }));
        rough.forEach(([sz, pos], i) => at(F0 + i, el, { maskImage: "url(../../assets/collage/ink-speckle.png)", maskSize: sz, maskPosition: pos, webkitMaskImage: "url(../../assets/collage/ink-speckle.png)", webkitMaskSize: sz, webkitMaskPosition: pos }));
        at(F0 + 3, el, { maskImage: "none", webkitMaskImage: "none" });
      });

      // ---- subtitle types one word per 4 f, each word soaking from #8A6F66 @45% to full ink over 3 f
      $(".sub span").forEach((w, i) => {
        const F = 21 + i * 4;
        at(F, w, { visibility: "visible", color: "rgba(138,111,102,.45)" });
        at(F + 1, w, { color: "rgba(100,64,66,.72)" });
        at(F + 2, w, { color: "#2C0B16" });
      });

      // ---- F39-F47 orange pen ellipse around "Tulsa": starts upper right, runs counter-clockwise, overshoots ~40 px
      // and crosses the top of the T. Hand-placed points (MARK_TULSA) around the measured word box.
      const MARK_TULSA = [[538,512],[507,505],[471,503],[439,507],[420,518],[414,534],[424,550],[451,561],[488,565],[523,561],[547,549],[554,532],[542,516],[514,507],[481,507],[455,513],[438,522]];
      const ell = $1(".ell");
      const ramp = [0.05, 0.14, 0.27, 0.42, 0.58, 0.73, 0.86, 0.95, 1.0];   // slow start, fast through the bottom, eases into the overshoot
      penWrite(ell, MARK_TULSA, 39, ramp, 9, 7);

      // ---- F49-F84 hold, camera drifting 0.6% (linear, on ones)
      for (let F = 49; F <= N; F++) at(F, cam, { scale: 1 + 0.006 * (F - 49) / (N - 49) });
      tl.set({}, {}, N / FPS);

      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
