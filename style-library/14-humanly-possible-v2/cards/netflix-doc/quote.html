<!doctype html>
<!--
  Humanly Possible v2 · NETFLIX DOC · quote (tier1, 168 f @ 24 fps)
  Built from the Chef's Table opening cards (raw-media/hp-sampler-refs/netflix-doc/ANALYSIS.md, moves 2 + 3;
  picks chefs-table_card_farthest_full, _card_midfade, _card_jiro_full, _namecard_bottura for the attribution).
  F1-12 a 12-f footage shot (the reference's food-shot slot). F13-15 the 3-f dip to the cream card
  (measured luma ramp 62>127>162>188>211 as card opacity .34/.58/.77, full on F16). F16-18 empty card.
  F19-62 both lines ink in together on the measured accelerating curve, letters never move:
  line 1 light, line 2 bold with the metallic vertical gradient. F75 the attribution hard-cuts on, small,
  wide-tracked, 74 px under line 2 (the name-card place line). Dead hold; the edit cuts out.
  2.0:1 letterbox throughout; soft corner darkening on the card.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;600&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#000;}
      #hp2-netflix-doc-quote{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#000;
        --cream:#FFF0E6;--deep:#2C0B16;font-family:"Inter Tight",sans-serif;}
      #hp2-netflix-doc-quote .layer{position:absolute;inset:0;opacity:0;}
      #hp2-netflix-doc-quote .shot video{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;}
      #hp2-netflix-doc-quote .card{background:var(--cream);}
      #hp2-netflix-doc-quote .vig{position:absolute;inset:0;background:radial-gradient(ellipse 62% 70% at 50% 50%, rgba(44,11,22,0) 55%, rgba(44,11,22,.065) 100%);}
      #hp2-netflix-doc-quote .ln{position:absolute;left:0;width:1920px;text-align:center;white-space:nowrap;text-transform:uppercase;color:var(--deep);}
      #hp2-netflix-doc-quote .ink,#hp2-netflix-doc-quote .att{opacity:0;}
      #hp2-netflix-doc-quote .q1{top:452px;height:84px;line-height:84px;font-weight:300;font-size:66px;letter-spacing:.22em;text-indent:.22em;}
      #hp2-netflix-doc-quote .q2{top:532px;height:90px;line-height:90px;font-weight:600;font-size:70px;letter-spacing:.2em;text-indent:.2em;}
      #hp2-netflix-doc-quote .q2 span{display:inline-block;line-height:1;padding:8px 0;
        background:linear-gradient(180deg,#2C0B16 0%,#2C0B16 28%,#7d5a63 50%,#2C0B16 74%,#2C0B16 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
      #hp2-netflix-doc-quote .att{top:668px;height:36px;line-height:36px;font-weight:300;font-size:27px;letter-spacing:.3em;text-indent:.3em;}
      #hp2-netflix-doc-quote .lb{position:absolute;left:0;width:1920px;height:60px;background:#000;}
    </style>
  </head>
  <body>
    <div id="hp2-netflix-doc-quote" data-composition-id="hp2-netflix-doc-quote" data-start="0" data-width="1920" data-height="1080">
      <div class="layer shot" data-slot="media">
        <video src="../../assets/footage/groom_6132700.mp4" poster="../../assets/footage/groom_6132700.jpg" muted playsinline preload="auto" data-start="0" data-duration="0.6667" data-track-index="0"></video>
      </div>
      <div class="layer card">
        <div class="vig"></div>
        <div class="ln q1 ink" data-slot="line-1">I didn't hire help.</div>
        <div class="ln q2 ink"><span data-slot="line-2">I got my evenings back.</span></div>
        <div class="ln att" data-slot="attribution">Dana Ruiz</div>
      </div>
      <div class="lb" style="top:0"></div><div class="lb" style="top:1020px"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-netflix-doc-quote", FPS = 24, N = 168;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s), $ = (s) => ROOT.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      // Chef's Table ink-in: darkest-pixel luma per frame on the white card (measured, 44 f), as opacity
      const INK_L = [235,234,229,226,220,222,216,216,210,210,206,202,198,199,191,190,182,181,177,174,170,170,158,154,153,146,145,140,136,129,120,112,109,97,93,82,67,73,72,45,41,26,1,0];
      let lo = 255; const INK = INK_L.map((L) => { lo = Math.min(lo, L); return (255 - lo) / 255; });
      const DIP = [0.34, 0.58, 0.77, 1];                      // 3-f dip to the card, full on the 4th frame

      tl.set($(".layer"), { opacity: 0 }, 0); tl.set($(".ink"), { opacity: 0 }, 0); tl.set($1(".att"), { opacity: 0 }, 0);
      const shot = $1(".shot"), card = $1(".card");
      at(1, shot, { opacity: 1 });                              // F1-12 footage
      DIP.forEach((o, i) => at(13 + i, card, { opacity: o }));   // F13-16 dip to cream
      at(16, shot, { opacity: 0 });
      // F16-18 empty card; F19-62 ink-in
      INK.forEach((o, i) => $(".ink").forEach((el) => at(19 + i, el, { opacity: o })));
      // F75 attribution hard on, fully drawn
      at(75, $1(".att"), { opacity: 1 });
      // F76-168 dead hold

      tl.set({}, {}, N / FPS);
      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
