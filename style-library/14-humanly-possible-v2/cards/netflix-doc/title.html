<!doctype html>
<!--
  Humanly Possible v2 · NETFLIX DOC · title (tier1, 156 f @ 24 fps)
  The Chef's Table title-and-tagline sequence (raw-media/hp-sampler-refs/netflix-doc/ANALYSIS.md, the
  "CHEF'S TABLE" > "DINNER IS SERVED." end, f2885-2930; picks chefs-table_titlecard, chefs-table_tagline,
  chefs-table_card_midfade). Light + bold weights in one line, wide tracking, no plate.
  F1-12 footage, F13-15 3-f dip to the cream card, F16-18 empty, F19-62 "CHAPTER 02" inks in on the
  measured 44-f curve. Hold. F85-89 it dissolves out in 5 f; F90-101 the title inks in over 12 f (the same
  measured curve resampled to 12 f). Hold. F136-149 the card dips toward grey over 14 f. Hard end.
  2.0:1 letterbox throughout; soft corner darkening on the card.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;600&display=swap" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#000;}
      #hp2-netflix-doc-title{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#000;
        --cream:#FFF0E6;--deep:#2C0B16;font-family:"Inter Tight",sans-serif;}
      #hp2-netflix-doc-title .layer{position:absolute;inset:0;opacity:0;}
      #hp2-netflix-doc-title .shot video{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;}
      #hp2-netflix-doc-title .card{background:var(--cream);}
      #hp2-netflix-doc-title .vig{position:absolute;inset:0;background:radial-gradient(ellipse 62% 70% at 50% 50%, rgba(44,11,22,0) 55%, rgba(44,11,22,.065) 100%);}
      #hp2-netflix-doc-title .grey{position:absolute;inset:0;background:#2C0B16;opacity:0;}
      #hp2-netflix-doc-title .ln{position:absolute;left:0;width:1920px;text-align:center;white-space:nowrap;text-transform:uppercase;color:var(--deep);opacity:0;}
      #hp2-netflix-doc-title .lt{font-weight:300;}
      #hp2-netflix-doc-title .bd{font-weight:600;display:inline-block;line-height:1;padding:8px 0;
        background:linear-gradient(180deg,#2C0B16 0%,#2C0B16 28%,#7d5a63 50%,#2C0B16 74%,#2C0B16 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
      #hp2-netflix-doc-title .ch{top:490px;height:100px;line-height:100px;font-size:74px;letter-spacing:.24em;text-indent:.24em;}
      #hp2-netflix-doc-title .t1{top:432px;height:104px;line-height:104px;font-size:84px;letter-spacing:.22em;text-indent:.22em;}
      #hp2-netflix-doc-title .t2{top:536px;height:110px;line-height:110px;font-size:88px;letter-spacing:.2em;text-indent:.2em;}
      #hp2-netflix-doc-title .lb{position:absolute;left:0;width:1920px;height:60px;background:#000;}
    </style>
  </head>
  <body>
    <div id="hp2-netflix-doc-title" data-composition-id="hp2-netflix-doc-title" data-start="0" data-width="1920" data-height="1080">
      <div class="layer shot" data-slot="media">
        <video src="../../assets/footage/field_30178060.mp4" poster="../../assets/footage/field_30178060.jpg" muted playsinline preload="auto" data-start="0" data-duration="0.6667" data-track-index="0"></video>
      </div>
      <div class="layer card">
        <div class="vig"></div>
        <div class="ln ch"><span class="lt" data-slot="chapter-label">Chapter</span> <span class="bd" data-slot="chapter">02</span></div>
        <div class="ln t1 lt" data-slot="title-1">The front desk</div>
        <div class="ln t2"><span class="bd" data-slot="title-2">answers itself</span></div>
        <div class="grey"></div>
      </div>
      <div class="lb" style="top:0"></div><div class="lb" style="top:1020px"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const ID = "hp2-netflix-doc-title", FPS = 24, N = 156;
      const ROOT = document.getElementById(ID);
      const $1 = (s) => ROOT.querySelector(s), $ = (s) => ROOT.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const T = (F) => (F - 1) / FPS;
      const at = (F, el, v) => tl.set(el, v, T(F));
      // Chef's Table ink-in: darkest-pixel luma per frame on the white card (measured, 44 f), as opacity
      const INK_L = [235,234,229,226,220,222,216,216,210,210,206,202,198,199,191,190,182,181,177,174,170,170,158,154,153,146,145,140,136,129,120,112,109,97,93,82,67,73,72,45,41,26,1,0];
      let lo = 255; const INK = INK_L.map((L) => { lo = Math.min(lo, L); return (255 - lo) / 255; });
      const INK12 = Array.from({ length: 12 }, (_, i) => INK[Math.round(i * (INK.length - 1) / 11)]);
      const DIP = [0.34, 0.58, 0.77, 1];

      tl.set($(".layer"), { opacity: 0 }, 0); tl.set($(".ln"), { opacity: 0 }, 0); tl.set($1(".grey"), { opacity: 0 }, 0);
      const shot = $1(".shot"), card = $1(".card"), ch = $1(".ch"), t1 = $1(".t1"), t2 = $1(".t2"), grey = $1(".grey");
      at(1, shot, { opacity: 1 });                                  // F1-12 footage
      DIP.forEach((o, i) => at(13 + i, card, { opacity: o }));       // F13-16 dip to cream
      at(16, shot, { opacity: 0 });
      INK.forEach((o, i) => at(19 + i, ch, { opacity: o }));          // F19-62 chapter inks in
      // F63-84 hold; F85-89 chapter dissolves out in 5 f
      for (let i = 0; i < 5; i++) at(85 + i, ch, { opacity: 1 - (i + 1) / 5 });
      // F90-101 title inks in over 12 f
      INK12.forEach((o, i) => { at(90 + i, t1, { opacity: o }); at(90 + i, t2, { opacity: o }); });
      // F102-135 hold; F136-149 the card dips toward grey (linear, 14 f); F150-156 hold
      for (let i = 0; i < 14; i++) at(136 + i, grey, { opacity: 0.2 * (i + 1) / 14 });

      tl.set({}, {}, N / FPS);
      window.__timelines[ID] = tl;
      if (location.hash.indexOf("#t=") === 0) tl.seek(parseFloat(location.hash.slice(3)) || 0);
      if (location.hash.indexOf("#f=") === 0) tl.seek(T(parseInt(location.hash.slice(3), 10) || 1) + 0.001);
      })();
    </script>
  </body>
</html>
