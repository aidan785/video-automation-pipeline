<!doctype html>
<!--
  SANJI · tier1 · instructional · KEY TAKEAWAYS (paper variant)
  White PAPER canvas carrying solid COBALT liquid-glass rows (the "THE
  CHALLENGE" pill language scaled up). A cobalt kicker pill with the spark
  glyph pops at the top, then three numbered glass rows rise out of blur one
  by one. Each row carries a mono index, a glass icon badge and a sentence
  that resolves word by word. The newest row glows ACTIVE while the earlier
  ones settle (text stays white: this is a summary, everything stays true).
  To close, every row lights together and a soft white light sweep glides
  across all three, top to bottom.
  Slots: kicker (<=20), t1 / t2 / t3 (<=38 each, single line).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t1-key-takeaway {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--paper); font-family: var(--font-display); color: var(--white);
      }
      #sanji-t1-key-takeaway .kwrap { position: absolute; left: 0; right: 0; top: 156px; display: flex; justify-content: center; }
      #sanji-t1-key-takeaway .kick {
        display: flex; align-items: center; gap: 16px; height: 76px; padding: 0 40px 0 28px; border-radius: var(--r-pill);
        background: linear-gradient(180deg, var(--cobalt-lift), var(--cobalt) 55%, var(--cobalt-deep));
        box-shadow: 0 0 0 1.5px rgba(255,255,255,0.35) inset, 0 14px 40px rgba(var(--cobalt-rgb), 0.35), 0 0 30px rgba(var(--cobalt-rgb), 0.25);
        white-space: nowrap;
      }
      #sanji-t1-key-takeaway .kick .lab { font-weight: var(--wt-heavy); font-size: 34px; letter-spacing: var(--track-caps); text-transform: uppercase; }

      #sanji-t1-key-takeaway .g { position: absolute; left: 330px; width: 1260px; height: 156px; box-sizing: border-box; border-radius: 44px; }
      #sanji-t1-key-takeaway .g > .fill, #sanji-t1-key-takeaway .g > .lit, #sanji-t1-key-takeaway .g > .clip { position: absolute; inset: 0; border-radius: inherit; box-sizing: border-box; }
      #sanji-t1-key-takeaway .g > .fill {
        background: var(--glass-fill), var(--cobalt);
        border: var(--rim) solid var(--glass-rim);
        box-shadow: 0 26px 60px rgba(var(--cobalt-rgb), 0.26), 0 6px 16px rgba(var(--cobalt-rgb), 0.16), inset 0 1.5px 0 rgba(255,255,255,0.35), inset 0 -24px 60px rgba(28,22,200,0.30);
      }
      #sanji-t1-key-takeaway .g > .lit {
        background: var(--glass-fill-active), var(--cobalt);
        border: var(--rim) solid var(--glass-rim-active);
        box-shadow: 0 34px 80px rgba(var(--cobalt-rgb), 0.40), 0 0 50px rgba(var(--cobalt-rgb), 0.30), inset 0 1.5px 0 rgba(255,255,255,0.5), inset 0 -30px 70px rgba(28,22,200,0.45);
        opacity: 0;
      }
      #sanji-t1-key-takeaway .g > .clip { overflow: hidden; }
      #sanji-t1-key-takeaway .sheen {
        position: absolute; top: -40px; left: 0; width: 260px; height: 236px; transform: skewX(-18deg);
        background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.32) 50%, rgba(255,255,255,0));
        filter: blur(8px); opacity: 0;
      }
      #sanji-t1-key-takeaway .g > .in { position: absolute; inset: 0; }
      #sanji-t1-key-takeaway .num { position: absolute; left: 44px; top: 0; height: 156px; display: flex; align-items: center; font-family: var(--font-mono); font-weight: 500; font-size: 26px; color: var(--white-soft); }
      #sanji-t1-key-takeaway .badge {
        position: absolute; left: 112px; top: 30px; width: 96px; height: 96px; border-radius: 50%; box-sizing: border-box;
        background: var(--badge-fill); border: var(--rim) solid var(--badge-rim);
        display: flex; align-items: center; justify-content: center;
      }
      #sanji-t1-key-takeaway .txt {
        position: absolute; left: 244px; right: 48px; top: 0; height: 156px; display: flex; align-items: center; white-space: nowrap;
        font-family: var(--font-body); font-weight: var(--wt-bold); font-size: 46px; letter-spacing: var(--track-ui);
      }
      #sanji-t1-key-takeaway .w { display: inline-block; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="sanji-t1-key-takeaway" data-composition-id="sanji-t1-key-takeaway" data-start="0" data-width="1920" data-height="1080">
            <div class="kwrap"><div class="kick">
        <svg class="spk" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round"><path d="M12 2.5v19M2.5 12h19M5.3 5.3l13.4 13.4M18.7 5.3L5.3 18.7"/></svg>
        <span class="lab" data-slot="kicker">Key takeaways</span></div></div>

      <div class="g" style="top:316px"><div class="fill"></div><div class="lit"></div><div class="clip"><div class="sheen"></div></div><div class="in">
        <div class="num">01</div>
        <div class="badge"><svg width="46" height="46" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M12 2.2a7 7 0 0 0-4.2 12.6c.7.55 1.2 1.3 1.2 2.2v.5h6V17c0-.9.5-1.65 1.2-2.2A7 7 0 0 0 12 2.2z"/><rect x="9" y="19" width="6" height="2.6" rx="1.2"/></svg></div>
        <div class="txt" data-slot="t1">Storyboard every beat before you animate</div></div></div>
      <div class="g" style="top:502px"><div class="fill"></div><div class="lit"></div><div class="clip"><div class="sheen"></div></div><div class="in">
        <div class="num">02</div>
        <div class="badge"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M3 19c5 0 5-14 10-14 3.2 0 4.5 2 8 2"/><circle cx="3" cy="19" r="1.7" fill="#FFFFFF"/><circle cx="21" cy="7" r="1.7" fill="#FFFFFF"/></svg></div>
        <div class="txt" data-slot="t2">Ease in and out, never move linearly</div></div></div>
      <div class="g" style="top:688px"><div class="fill"></div><div class="lit"></div><div class="clip"><div class="sheen"></div></div><div class="in">
        <div class="num">03</div>
        <div class="badge"><svg width="44" height="44" viewBox="0 0 24 24" fill="#FFFFFF"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6" fill="#3A46E8"/><circle cx="12" cy="12" r="2.6"/></svg></div>
        <div class="txt" data-slot="t3">Give one idea the whole frame</div></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-t1-key-takeaway";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => [...ROOT.querySelectorAll(s)];
        const css = getComputedStyle(document.documentElement);
        const tok = (n) => css.getPropertyValue(n).trim();
        const WHITE = tok("--white"), PRE = tok("--white-pre");

        const split = (el) => {
          const ws = (el.textContent || "").trim().split(/\s+/).filter(Boolean);
          el.textContent = "";
          return ws.map((w, i) => { const s = document.createElement("span"); s.className = "w"; s.textContent = w + (i < ws.length - 1 ? " " : ""); el.appendChild(s); return s; });
        };
        const rows = $$(".g");
        const rowWords = rows.map((r) => split(r.querySelector(".txt")));

        const tl = gsap.timeline({ paused: true });
        tl.set(rows, { autoAlpha: 0 }, 0).set($(".kick"), { autoAlpha: 0 }, 0).set(rowWords.flat(), { autoAlpha: 0 }, 0);

        /* 1. kicker pill pops with a whisper of overshoot, spark spins in */
        tl.fromTo($(".kick"), { autoAlpha: 0, scale: 0.9, filter: "blur(10px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.38, ease: "back.out(1.25)" }, 0.15)
          .fromTo($(".kick .spk"), { rotation: -90, scale: 0.4 }, { rotation: 0, scale: 1, duration: 0.6, ease: "expo.out" }, 0.2);
        TXT.reveal(tl, $(".kick .lab"), 0.26);

        /* 2. rows rise out of blur one by one; newest row is the lit one */
        const T0 = 0.75, STEP = 1.15;
        rows.forEach((r, i) => {
          const t = T0 + i * STEP;
          if (i > 0) tl.to(rows[i - 1].querySelector(".lit"), { opacity: 0, duration: 0.35, ease: "power2.inOut" }, t + 0.2)
                       .to(rows[i - 1], { scale: 1, duration: 0.35, ease: "power2.inOut" }, t + 0.2);
          tl.fromTo(r, { autoAlpha: 0, y: 26, scale: 0.96, filter: "blur(12px)" }, { autoAlpha: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, t)
            .to(r.querySelector(".lit"), { opacity: 1, duration: 0.4, ease: "power2.out" }, t + 0.12)
            .to(r, { scale: 1.02, duration: 0.6, ease: "expo.out" }, t + 0.3)
          TXT.block(tl, [r.querySelector(".num"), r.querySelector(".badge")], t + 0.08);
          tl.set(rowWords[i], { autoAlpha: 1 }, t);
          TXT.reveal(tl, rowWords[i], t + 0.2);
        });

        /* 3. close: everything lights together, one soft light sweep */
        const TS = T0 + 3 * STEP + 0.35;
        tl.to(rows[2], { scale: 1, duration: 0.4, ease: "power2.inOut" }, TS)
          .to(rows.map((r) => r.querySelector(".lit")), { opacity: 0.75, duration: 0.5, ease: "power2.inOut", stagger: 0.08 }, TS);
        rows.forEach((r, i) => {
          tl.fromTo(r.querySelector(".sheen"), { x: -380, opacity: 0 }, { x: 1420, opacity: 1, duration: 1.1, ease: "power2.inOut" }, TS + 0.15 + i * 0.12)
            .to(r.querySelector(".sheen"), { opacity: 0, duration: 0.25, ease: "power1.in" }, TS + 0.15 + i * 0.12 + 0.85);
        });
        tl.to($(".kick"), { boxShadow: "0 0 0 1.5px rgba(255,255,255,0.5) inset, 0 14px 40px rgba(32,66,238,0.45), 0 0 60px rgba(32,66,238,0.45)", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, TS + 0.1);

        const END = TS + 2.4;
        tl.set({}, {}, END);
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
