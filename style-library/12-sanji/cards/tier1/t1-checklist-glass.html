<!doctype html>
<!--
  SANJI · tier1 · list · CHECKLIST GLASS
  NATURE canvas: a misty landscape photo drifts slowly under a tall liquid-glass
  checklist card (real backdrop blur, the glass takes the photo's color). The
  card resolves out of blur, the title and five items blur in. A soft focus
  highlight slides down row by row: each checkbox fills, its check DRAWS ON,
  the label cools from white to dormant and a strike line sweeps through it.
  The header counter ticks "1 / 5" ... "5 / 5" while a thin progress bar fills.
  On the last item the counter blooms. Use for any "before you ship" list.
  Slots: title (<= 24), i1-i5 (<= 28).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t1-checklist-glass {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--void); font-family: var(--font-body); color: var(--white);
      }
      #sanji-t1-checklist-glass .photo {
        position: absolute; inset: -40px; background: url("../../assets/nature/countryside-mist.jpg") center / cover no-repeat;
        transform-origin: 50% 50%;
      }
      #sanji-t1-checklist-glass .shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.08) 30%, rgba(0,0,0,0.42) 100%); }
      #sanji-t1-checklist-glass .card {
        position: absolute; left: 520px; top: 150px; width: 880px; height: 780px; box-sizing: border-box;
        border-radius: var(--r-card); overflow: hidden;
        background: linear-gradient(150deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.10) 40%, rgba(255,255,255,0.05) 100%);
        border: var(--rim) solid rgba(255,255,255,0.45);
        box-shadow: 0 40px 100px rgba(0,0,0,0.30), inset 0 1.5px 0 rgba(255,255,255,0.55), inset 0 -30px 60px rgba(0,0,0,0.10);
        backdrop-filter: blur(26px) saturate(1.35); -webkit-backdrop-filter: blur(26px) saturate(1.35);
      }
      #sanji-t1-checklist-glass .hd { position: absolute; left: 60px; right: 60px; top: 56px; height: 80px; display: flex; align-items: center; justify-content: space-between; }
      #sanji-t1-checklist-glass .title { font-family: var(--font-display); font-weight: var(--wt-heavy); font-size: 54px; letter-spacing: var(--track-tight); line-height: 1; }
      #sanji-t1-checklist-glass .count {
        font-family: var(--font-display); font-weight: var(--wt-heavy); font-size: 46px; letter-spacing: var(--track-tight);
        padding: 12px 26px; border-radius: var(--r-pill); background: rgba(255,255,255,0.16); border: var(--rim) solid rgba(255,255,255,0.4);
        white-space: nowrap;
      }
      #sanji-t1-checklist-glass .count .of { opacity: 0.6; }
      #sanji-t1-checklist-glass .bar { position: absolute; left: 60px; right: 60px; top: 170px; height: 8px; border-radius: 8px; background: rgba(255,255,255,0.18); overflow: hidden; }
      #sanji-t1-checklist-glass .bar i { position: absolute; inset: 0; border-radius: 8px; background: var(--white); transform-origin: 0 50%; box-shadow: 0 0 16px rgba(255,255,255,0.8); }
      #sanji-t1-checklist-glass .rows { position: absolute; left: 36px; right: 36px; top: 214px; }
      #sanji-t1-checklist-glass .hl {
        position: absolute; left: 0; right: 0; top: 0; height: 104px; border-radius: 30px;
        background: linear-gradient(90deg, rgba(255,255,255,0.22), rgba(255,255,255,0.10));
        border: var(--rim) solid rgba(255,255,255,0.35);
      }
      #sanji-t1-checklist-glass .row { position: relative; height: 104px; display: flex; align-items: center; gap: 30px; padding-left: 26px; }
      #sanji-t1-checklist-glass .box {
        flex: none; position: relative; width: 52px; height: 52px; border-radius: 15px; box-sizing: border-box;
        border: 2.5px solid rgba(255,255,255,0.75);
      }
      #sanji-t1-checklist-glass .box .bf { position: absolute; inset: -2.5px; border-radius: 15px; background: var(--white); opacity: 0; }
      #sanji-t1-checklist-glass .box svg { position: absolute; left: 8px; top: 8px; width: 31px; height: 31px; overflow: visible; }
      #sanji-t1-checklist-glass .lab { position: relative; display: inline-block; font-weight: var(--wt-ui); font-size: 42px; letter-spacing: var(--track-ui); white-space: nowrap; }
      #sanji-t1-checklist-glass .lab .st { position: absolute; left: -4px; right: -4px; top: 54%; height: 3px; border-radius: 3px; background: currentColor; transform-origin: 0 50%; transform: scaleX(0); }
    </style>
  </head>
  <body>
    <div id="sanji-t1-checklist-glass" data-composition-id="sanji-t1-checklist-glass" data-start="0" data-width="1920" data-height="1080">
      <div class="photo"></div>
      <div class="shade"></div>
      <div class="card">
        <div class="hd">
          <div class="title" data-slot="title">Before you export</div>
          <div class="count"><span class="n">0</span><span class="of"> / 5</span></div>
        </div>
        <div class="bar"><i></i></div>
        <div class="rows">
          <div class="hl"></div>
          <div class="row"><div class="box"><div class="bf"></div><svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--void)"><path pathLength="1" d="M4.5 12.5l4.8 4.8L19.5 7"/></svg></div><span class="lab"><span data-slot="i1">Silences trimmed</span><i class="st"></i></span></div>
          <div class="row"><div class="box"><div class="bf"></div><svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--void)"><path pathLength="1" d="M4.5 12.5l4.8 4.8L19.5 7"/></svg></div><span class="lab"><span data-slot="i2">Retakes removed</span><i class="st"></i></span></div>
          <div class="row"><div class="box"><div class="bf"></div><svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--void)"><path pathLength="1" d="M4.5 12.5l4.8 4.8L19.5 7"/></svg></div><span class="lab"><span data-slot="i3">Audio at minus 14 LUFS</span><i class="st"></i></span></div>
          <div class="row"><div class="box"><div class="bf"></div><svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--void)"><path pathLength="1" d="M4.5 12.5l4.8 4.8L19.5 7"/></svg></div><span class="lab"><span data-slot="i4">Captions checked</span><i class="st"></i></span></div>
          <div class="row"><div class="box"><div class="bf"></div><svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--void)"><path pathLength="1" d="M4.5 12.5l4.8 4.8L19.5 7"/></svg></div><span class="lab"><span data-slot="i5">Thumbnail ready</span><i class="st"></i></span></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-t1-checklist-glass";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => [...ROOT.querySelectorAll(s)];

        const INK = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
        const rows = $$(".row"), N = rows.length, ROWH = 104;
        const tl = gsap.timeline({ paused: true });
        const T1 = 1.45, STEP = 0.82, END = T1 + (N - 1) * STEP + 2.0;

        /* photo: slow push-in, whole card */
        tl.fromTo($(".photo"), { scale: 1.08, filter: "blur(8px)" }, { scale: 1.0, filter: "blur(0px)", duration: END, ease: "sine.out" }, 0);
        tl.set($(".hl"), { autoAlpha: 0 }, 0).set($(".bar i"), { scaleX: 0 }, 0)
          .set($$(".row svg path"), { strokeDasharray: 1, strokeDashoffset: 1 }, 0);

        /* card resolve + content blur-in */
        tl.fromTo($(".card"), { autoAlpha: 0, scale: 0.94, y: 20, filter: "blur(14px)" }, { autoAlpha: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0.2);
        TXT.reveal(tl, $(".title"), 0.45);
        TXT.block(tl, [$(".count"), $(".bar")], 0.52, { stagger: 0.07 });
        rows.forEach((r, i) => { const at = 0.66 + i * 0.07; TXT.block(tl, r.querySelector(".box"), at); TXT.reveal(tl, r.querySelector(".lab"), at + 0.04); });

        /* counter proxy (fromTo so seeking is safe) */
        const nEl = $(".count .n"), cnt = { v: 0 };
        rows.forEach((r, i) => {
          const t = T1 + i * STEP;
          /* focus highlight slides onto this row */
          if (i === 0) tl.fromTo($(".hl"), { autoAlpha: 0, y: 0, scaleY: 0.8 }, { autoAlpha: 1, scaleY: 1, duration: 0.32, ease: "expo.out" }, t - 0.3);
          else tl.to($(".hl"), { y: i * ROWH, duration: 0.42, ease: "power3.inOut" }, t - 0.36);
          const box = r.querySelector(".box"), lab = r.querySelector(".lab");
          tl.to(box, { scale: 0.86, duration: 0.08, ease: "power2.in" }, t)
            .to(box, { scale: 1, duration: 0.34, ease: "back.out(1.3)" }, t + 0.08)
            .to(box.querySelector(".bf"), { opacity: 1, duration: 0.18, ease: "power2.out" }, t + 0.02)
            .to(box, { borderColor: "rgba(255,255,255,1)", boxShadow: "0 0 26px rgba(255,255,255,0.65)", duration: 0.18 }, t + 0.02)
            .to(box, { boxShadow: "0 0 0px rgba(255,255,255,0)", duration: 0.5, ease: "power2.out" }, t + 0.25)
            .to(box.querySelector("path"), { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t + 0.1)
            .to(lab.querySelector(".st"), { scaleX: 1, duration: 0.36, ease: "power2.inOut" }, t + 0.16)
            .to(lab, { opacity: 0.55, duration: 0.4, ease: "power2.inOut" }, t + 0.2)
            .to($(".bar i"), { scaleX: (i + 1) / N, duration: 0.45, ease: "power3.out" }, t + 0.05)
            .fromTo(cnt, { v: i }, { v: i + 1, duration: 0.01, immediateRender: false, onUpdate: () => { nEl.textContent = String(Math.round(cnt.v)); } }, t + 0.12)
            .fromTo($(".count .n"), { opacity: 0.4, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, t + 0.12);
        });
        /* done: highlight leaves, counter blooms */
        const DONE = T1 + (N - 1) * STEP + 0.55;
        tl.to($(".hl"), { autoAlpha: 0, duration: 0.4, ease: "power2.inOut" }, DONE)
          .to($(".count"), { backgroundColor: "rgba(255,255,255,0.95)", color: INK, boxShadow: "0 0 40px rgba(255,255,255,0.55)", duration: 0.35, ease: "power2.out" }, DONE)
          .to($(".count"), { boxShadow: "0 0 0px rgba(255,255,255,0)", duration: 0.8, ease: "power2.out" }, DONE + 0.35)
          .to($(".count .of"), { opacity: 0.55, duration: 0.3 }, DONE);
        tl.set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
