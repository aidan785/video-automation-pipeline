  a reverse dither band eats the title back to blue.

          if (invs.length) {
            ctx.fillStyle = `rgb(${INK})`; for (const o of invs) ctx.fillRect(o.c * CW, o.r * CH, CW, CH);
            ctx.font = `600 ${Math.round(CH * 1.02)}px "IBM Plex Mono", monospace`; ctx.textBaseline = "top"; ctx.fillStyle = BLUE;
            for (const o of invs) ctx.fillText(SYS.NOISE[Math.floor(hash(o.c, o.r, f) * SYS.NOISE.length)], o.c * CW + 0.5, o.r * CH - 1);
          }

          /* ---- micro labels ---- */
          const clr = c01((t - T_CLEAR) / (6 / 24));
          if (t >= T_CMT) {
            lbl(64, 56, unscr(scramble(COMMENT, c01((t - T_CMT) / (5 / 24)), t, 3, 3), clr, t, 4));
            const thrV = t < T_IN ? 0 : t < T_OUT ? c01((t - T_IN) / D_IN) : 1 - c01((t - T_OUT) / D_OUT);
            lbl(W - 64, 56, unscr(scramble(`thr ${thrV.toFixed(2)} . grid ${COLS}x${ROWS}`, c01((t - T_CMT - 0.12) / (5 / 24)), t, 6, 3), clr, t, 7), { right: true, a: 0.7 });
          }
          if (t >= T_IN - 0.1) {
            const pb = c01((t - T_IN + 0.1) / (4 / 24));
            const pct = Math.round((dev / Math.max(1, CELLS.length)) * 100);
            lbl(64, H - 78, unscr(scramble(`>> ${String(pct).padStart(3, " ")}% developed . ${CELLS.length} cells`, pb, t, 8, 2), clr, t, 9), { a: 0.8 });
            lbl(W - 64, H - 78, unscr(scramble(`/* frame ${String(f).padStart(3, "0")} */`, pb, t, 10, 2), clr, t, 11), { right: true, a: 0.7 });
          }
          /* band riders: a tick + a micro label on the band front at 4 grid rows */
          const ride = (p, live, seedB, mode) => {
            if (!live) return;
            const ys = [168, (BOX.minY * CH) - 40, (BOX.maxY + 1) * CH + 18, 880];
            ys.forEach((y, i) => {
              const x = Math.round(frontX(p - BW * 0.5, y) / 24) * 24;
              if (x < 40 || x > W - 260) return;
              ctx.fillStyle = `rgba(${INK},0.9)`; ctx.fillRect(x - 8, y - 4, 1.5, 26);
              const prog = Math.round(c01(p / 1.0) * 100);
              const s = i === 0 ? `x:${String(x).padStart(4, "0")} y:${String(y).padStart(4, "0")}` : i === 1 ? `${mode} ${String(prog).padStart(2, "0")}%` : i === 2 ? `0x${Math.floor(hash(f, i, seedB) * 255).toString(16).toUpperCase().padStart(2, "0")}` : `/* bayer[${(f % 8)}][${((f * 3) % 8)}] */`;
              lbl(x, y, scramble(s, 1, t, seedB + i, 2), { inv: i === 1, a: 0.9 });
            });
          };
          ride(pIn, inLive && pIn > -0.1 && pIn < 1.25, 20, ">>");
          ride(pOut, outLive && pOut > -0.1 && pOut < 1.25, 30, "--");

          /* tag chip + subtitle under the title (micro type) */
          if (t >= T_SUB) {
            const y = (BOX.maxY + 1) * CH + 64;
            const sub = SUB;
            ctx.font = '500 18px "IBM Plex Mono", monospace';
            const tw = TAG ? ctx.measureText(TAG).width + 22 : 0;
            const sw = ctx.measureText(sub).width;
            const x0 = Math.round((960 - (tw + sw) / 2) / CW) * CW;
            const pt = c01((t - T_SUB) / (4 / 24)), ps = c01((t - T_SUB - 0.12) / 0.5);
            const out = c01((t - T_CLEAR - 0.1) / (6 / 24));
            if (TAG && out < 1) lbl(x0, y, unscr(pt < 0.25 ? " " : scramble(TAG, (pt - 0.25) / 0.75, t, 41, 2), out, t, 42), { inv: true, font: '500 18px "IBM Plex Mono", monospace', h: 25 });
            lbl(x0 + tw, y, unscr(scramble(sub, ps, t, 43, 3), out, t, 44), { font: '500 18px "IBM Plex Mono", monospace', a: 0.92 });
          }
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) {
          document.fonts.load('800 200px "Inter Tight"').then(() => { build(); draw(P.t); }).catch(() => {});
          document.fonts.ready.then(() => { build(); draw(P.t); });
        }
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
