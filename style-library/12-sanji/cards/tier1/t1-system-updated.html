        /* ---- beats ---- */
        const T_HEAD = 0, T_FLICK = f(2);                 /* value chip flickers f493-505 */
        const T_LABEL = 1.5, T_ITEM0 = 2.0, ITEM_D = 0.25; /* one item per half beat */
        const T_CUT = Math.ceil((T_ITEM0 + ITEMS.length * ITEM_D + 1.0) * 2) / 2;   /* hold, cut on the beat */
        const T_BRAND = T_CUT + 2.0;
        const END = T_BRAND + 3.0;                         /* breathing outro hold */

        /* doodles: tiny glyph clusters around the headline, stepping on the grid */
        const F = SYS.field($("canvas.field"), { cw: 15, ch: 22 });
        const DG = "\\/|-_<>()[]~:;'.,^";
        const rd = lcg(1903), DOOD = [];
        for (let i = 0; i < 16; i++) {
          let x, y; do { x = 620 + rd() * 1200; y = 180 + rd() * 720; } while (x > 940 && x < 1700 && y > 440 && y < 760);
          DOOD.push({ x, y, n: 2 + Math.floor(rd() * 4), rows: rd() < 0.4 ? 2 : 1, vx: (rd() - 0.5) * 50, vy: (rd() - 0.5) * 36, seed: i * 13 + 5, hz: 3 + Math.floor(rd() * 4) });
        }

        function draw(t) {
          F.clearLum(); F.clearText();
          const fade = 1 - c01((t - (T_CUT - 0.5)) / 0.5);
          if (fade > 0) for (const d of DOOD) {
            const x = d.x + d.vx * t, y = d.y + d.vy * t, step = Math.floor(t * 24 / d.hz);
            for (let r = 0; r < d.rows; r++) {
              let s = ""; for (let k = 0; k < d.n; k++) s += DG[Math.floor(hash(k + r * 7, step, d.seed) * DG.length)];
              F.textAt(x, y + r * F.ch, s, { alpha: 0.85 * fade });
            }
          }
          F.render(t, { flicker: 0 });

          /* headline + value flicker */
          const head = $(".head"), v = $(".v");
          head.style.visibility = t < T_CUT ? "visible" : "hidden";
          const fr = frame(t - T_FLICK);
          const on = t < T_FLICK ? false : fr < 12 ? (fr % 4 < 2) : true;
          v.className = on ? "v inv" : "v";
          v.textContent = t < T_FLICK + f(3) ? scramble(VALUE, (t - T_FLICK) / f(3), t, 3, 3) : VALUE;

          /* label + items */
          const list = $(".list"), lab = $(".lab");
          list.style.visibility = t >= T_LABEL && t < T_CUT ? "visible" : "hidden";
          lab.textContent = t < T_LABEL + f(3) ? scramble(LABEL, (t - T_LABEL) / f(3), t, 8, 3) : LABEL;
          rows.forEach((el, i) => {
            const at = T_ITEM0 + i * ITEM_D;
            el.style.visibility = t >= at && t < T_CUT ? "visible" : "hidden";
            el.textContent = t < at + f(2) ? scramble(ITEMS[i], (t - at) / f(2), t, 20 + i, 4) : ITEMS[i];
          });

          /* tagline, then brand with blinking cursor */
          $(".tag").style.visibility = t >= T_CUT && t < T_BRAND ? "visible" : "hidden";
          const br = $(".brand");
          br.style.visibility = t >= T_BRAND ? "visible" : "hidden";
          $(".cur").style.opacity = Math.floor((t - T_BRAND) / 0.5) % 2 === 0 ? 1 : 0;
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        /* the tagline is plain DOM text: text preset pour-in without blur (SYSTEM never blurs type), lifts out before the wordmark */
        TXT.reveal(tl, $(".tag"), T_CUT, { blur: 0 });
        TXT.exit(tl, $(".tag"), T_BRAND - 0.45, { blur: 0 });
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) document.fonts.ready.then(() => draw(P.t));
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
