<!doctype html>
<!--
  SANJI · tier1 · compare · DO / DON'T
  Two tall liquid-glass columns on COBALT with slow sonar rings. Left = DO
  (glass badge with a drawn white check), right = DON'T (solid ember badge with
  a drawn x: the single small ember accent allowed on cobalt). Items resolve
  ALTERNATELY left / right, and focus ping-pongs: the column receiving the new
  item lights active while the other rests. On the hold the DON'T column
  focus-shifts to dormant (glass loses sheen, text to grey-lavender, the ember
  badge cools to dormant) and DO stays lit: the takeaway.
  Slots: doTitle, dontTitle (caps <= 8), do1-do3, dont1-dont3 (<= 26).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t1-do-dont {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--cobalt); font-family: var(--font-display); color: var(--white);
      }
      #sanji-t1-do-dont .ring {
        position: absolute; left: 50%; top: 50%; width: 1800px; height: 1800px; margin: -900px 0 0 -900px;
        border-radius: 50%; border: 2px solid rgba(255,255,255,0.07);
        background: radial-gradient(circle, rgba(255,255,255,0) 55%, rgba(255,255,255,0.035) 100%);
      }
      #sanji-t1-do-dont .g { position: absolute; box-sizing: border-box; border-radius: var(--r-card); }
      #sanji-t1-do-dont .g > .fill, #sanji-t1-do-dont .g > .lit { position: absolute; inset: 0; border-radius: inherit; box-sizing: border-box; }
      #sanji-t1-do-dont .g > .fill { background: var(--glass-fill); border: var(--rim) solid var(--glass-rim); box-shadow: var(--glass-shadow); }
      #sanji-t1-do-dont .g > .lit  { background: var(--glass-fill-active); border: var(--rim) solid var(--glass-rim-active); box-shadow: var(--glass-shadow-active); opacity: 0; }
      #sanji-t1-do-dont .g > .in { position: absolute; inset: 0; }
      #sanji-t1-do-dont .col { top: 225px; width: 720px; height: 630px; }
      #sanji-t1-do-dont .col.do { left: 200px; }
      #sanji-t1-do-dont .col.dont { left: 1000px; }
      #sanji-t1-do-dont .hd { position: absolute; left: 54px; top: 50px; right: 54px; height: 110px; display: flex; align-items: center; gap: 30px; }
      #sanji-t1-do-dont .badge {
        flex: none; width: 104px; height: 104px; border-radius: 50%; box-sizing: border-box; position: relative;
        background: var(--badge-fill); border: var(--rim) solid var(--badge-rim);
        display: flex; align-items: center; justify-content: center;
      }
      #sanji-t1-do-dont .badge.hot { background: var(--ember); border-color: rgba(255,200,150,0.7); box-shadow: 0 0 30px rgba(var(--ember-rgb),0.45), 0 10px 30px rgba(14,18,150,0.35); }
      #sanji-t1-do-dont .badge .cool { position: absolute; inset: -1.5px; border-radius: 50%; background: var(--dormant); opacity: 0; }
      #sanji-t1-do-dont .badge svg { position: relative; width: 52px; height: 52px; overflow: visible; }
      #sanji-t1-do-dont .ttl { font-weight: var(--wt-heavy); font-size: 72px; line-height: 0.9; letter-spacing: var(--track-caps); text-transform: uppercase; }
      #sanji-t1-do-dont .rule { position: absolute; left: 54px; right: 54px; top: 196px; height: 2px; background: rgba(255,255,255,0.22); transform-origin: 0 50%; }
      #sanji-t1-do-dont .rows { position: absolute; left: 54px; right: 54px; top: 236px; }
      #sanji-t1-do-dont .row {
        position: relative; height: 136px; display: flex; align-items: center; gap: 26px;
        border-bottom: 1.5px solid rgba(255,255,255,0.12);
      }
      #sanji-t1-do-dont .row:last-child { border-bottom: none; }
      #sanji-t1-do-dont .mk {
        flex: none; width: 52px; height: 52px; border-radius: 50%; box-sizing: border-box;
        border: 2px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center;
      }
      #sanji-t1-do-dont .mk svg { width: 26px; height: 26px; }
      #sanji-t1-do-dont .row .t {
        font-family: var(--font-body); font-weight: var(--wt-ui); font-size: 42px; line-height: 1.1; letter-spacing: var(--track-ui);
      }
    </style>
  </head>
  <body>
    <div id="sanji-t1-do-dont" data-composition-id="sanji-t1-do-dont" data-start="0" data-width="1920" data-height="1080">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>

      <div class="g col do"><div class="fill"></div><div class="lit"></div><div class="in">
        <div class="hd">
          <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path class="dr" pathLength="1" d="M4.5 12.5l4.8 4.8L19.5 7"/></svg></div>
          <div class="ttl" data-slot="doTitle">Do</div>
        </div>
        <div class="rule"></div>
        <div class="rows">
          <div class="row"><div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l4.8 4.8L19.5 7"/></svg></div><div class="t" data-slot="do1">Cut on the breath</div></div>
          <div class="row"><div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l4.8 4.8L19.5 7"/></svg></div><div class="t" data-slot="do2">Keep one idea per shot</div></div>
          <div class="row"><div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l4.8 4.8L19.5 7"/></svg></div><div class="t" data-slot="do3">Ease every move</div></div>
        </div>
      </div></div>

      <div class="g col dont"><div class="fill"></div><div class="lit"></div><div class="in">
        <div class="hd">
          <div class="badge hot"><div class="cool"></div><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"><path class="dr" pathLength="1" d="M6.5 6.5l11 11"/><path class="dr" pathLength="1" d="M17.5 6.5l-11 11"/></svg></div>
          <div class="ttl" data-slot="dontTitle">Don't</div>
        </div>
        <div class="rule"></div>
        <div class="rows">
          <div class="row"><div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></div><div class="t" data-slot="dont1">Cut mid word</div></div>
          <div class="row"><div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></div><div class="t" data-slot="dont2">Stack three graphics</div></div>
          <div class="row"><div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></div><div class="t" data-slot="dont3">Animate linearly</div></div>
        </div>
      </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-t1-do-dont";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => [...ROOT.querySelectorAll(s)];
        const css = getComputedStyle(document.documentElement);
        const DORM = css.getPropertyValue("--dormant").trim(), WHITE = css.getPropertyValue("--white").trim();

        const cols = [$(".col.do"), $(".col.dont")];
        const rows = cols.map((c) => [...c.querySelectorAll(".row")]);

        const tl = gsap.timeline({ paused: true });
        const T1 = 1.15, GAP = 0.62, DIM = T1 + 6 * GAP + 0.35, END = DIM + 1.9;

        const rings = $$(".ring"), PER = 4.2;
        rings.forEach((r, i) => {
          const st = i * (PER / rings.length);
          if (st + PER > END) return;   /* skip rings that can't finish before END */
          const reps = Math.floor((END - st) / PER) - 1;
          tl.fromTo(r, { scale: 0.25, opacity: 0 }, { keyframes: [{ scale: 0.62, opacity: 1, duration: PER * 0.45, ease: "sine.out" }, { scale: 1.05, opacity: 0, duration: PER * 0.55, ease: "sine.in" }], repeat: reps }, st);
        });

        const pop = (el, t) => tl.fromTo(el, { autoAlpha: 0, scale: 0.92, filter: "blur(12px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "back.out(1.2)" }, t);
        const blurIn = (els, t, st = 0.07) => tl.fromTo(els, { autoAlpha: 0, y: 10, filter: "blur(10px)" }, { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.34, ease: "expo.out", stagger: st }, t);

        tl.set(cols, { autoAlpha: 0 }, 0)
          .set($$(".dr"), { strokeDasharray: 1, strokeDashoffset: 1 }, 0)
          .set($$(".rule"), { scaleX: 0 }, 0);

        cols.forEach((c, k) => {
          const t = 0.15 + k * 0.12;
          pop(c, t);
          TXT.block(tl, c.querySelector(".badge"), t + 0.12);
          TXT.reveal(tl, c.querySelector(".ttl"), t + 0.2);
          tl.to(c.querySelectorAll(".dr"), { strokeDashoffset: 0, duration: 0.32, ease: "power2.out", stagger: 0.1 }, t + 0.3)
            .to(c.querySelector(".rule"), { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, t + 0.3);
        });

        /* alternate: do1, dont1, do2, dont2, do3, dont3 with focus ping-pong */
        let litCol = -1;
        for (let n = 0; n < 6; n++) {
          const k = n % 2, j = Math.floor(n / 2), t = T1 + n * GAP;
          const r = rows[k][j];
          if (litCol !== k) {
            tl.to(cols[k].querySelector(".lit"), { opacity: 1, duration: 0.35, ease: "power2.out" }, t)
              .to(cols[k], { scale: 1.02, duration: 0.45, ease: "expo.out" }, t);
            if (litCol >= 0) tl.to(cols[litCol].querySelector(".lit"), { opacity: 0, duration: 0.35, ease: "power2.inOut" }, t)
              .to(cols[litCol], { scale: 1, duration: 0.35, ease: "power2.inOut" }, t);
            litCol = k;
          }
          TXT.block(tl, r.querySelector(".mk"), t + 0.04);
          tl.fromTo(r.querySelector(".mk"), { scale: 0.7 }, { scale: 1, duration: 0.38, ease: "back.out(1.3)" }, t + 0.06);
          TXT.reveal(tl, r.querySelector(".t"), t + 0.1);
        }

        /* takeaway: DON'T goes dormant, DO stays lit */
        const dn = cols[1];
        tl.to(dn.querySelector(".lit"), { opacity: 0, duration: 0.4, ease: "power2.inOut" }, DIM)
          .to(dn, { scale: 0.97, duration: 0.6, ease: "power2.inOut" }, DIM)
          .to([...dn.querySelectorAll(".ttl, .t")], { color: DORM, duration: 0.4, ease: "power2.inOut" }, DIM)
          .to(dn.querySelectorAll(".mk"), { opacity: 0.45, duration: 0.4 }, DIM)
          .to(dn.querySelector(".badge .cool"), { opacity: 1, duration: 0.45, ease: "power2.inOut" }, DIM)
          .to(dn.querySelector(".badge"), { boxShadow: "0 0 0px rgba(255,122,26,0), 0 10px 30px rgba(14,18,150,0.25)", opacity: 0.7, duration: 0.45 }, DIM)
          .to(cols[0].querySelector(".lit"), { opacity: 1, duration: 0.4, ease: "power2.out" }, DIM)
          .to(cols[0], { scale: 1.04, duration: 0.6, ease: "expo.out" }, DIM);
        tl.set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
