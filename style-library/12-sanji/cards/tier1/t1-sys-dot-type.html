              bctx.fillStyle = `rgba(255,255,255,${Math.min(1, hot * 1.1).toFixed(3)})`;
              bctx.beginPath(); bctx.arc(p.x, p.y, r * 1.5 + 2, 0, 6.2832); bctx.fill();
              if (hot > 0.45) { ctx.strokeStyle = `rgba(${INK},${((hot - 0.45) * 1.4).toFixed(3)})`; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(p.x, p.y, r + 4 + (1 - hot) * 6, 0, 6.2832); ctx.stroke(); }
            }
          }

          /* ---- micro labels ---- */
          const clr = c01((t - T_CLEAR) / (6 / 24));
          /* corner: comment + lattice spec (top), counter + frame (bottom) */
          if (t >= T_CMT) {
            const pc = c01((t - T_CMT) / (5 / 24));
            lbl(64, 56, unscr(scramble(COMMENT, pc, t, 3, 3), clr, t, 4));
            lbl(W - 64, 56, unscr(scramble(`lattice ${COLS}x${ROWS} . sp ${SP}px`, c01((t - T_CMT - 0.12) / (5 / 24)), t, 6, 3), clr, t, 7), { right: true, a: 0.7 });
          }
          if (t >= T_IN - 0.1) {
            const pct = Math.round((landed / Math.max(1, DOTS.length)) * 100);
            const pb = c01((t - T_IN + 0.1) / (4 / 24));
            lbl(64, H - 78, unscr(scramble(`>> ${String(pct).padStart(3, " ")}% landed . ${DOTS.length} dots`, pb, t, 8, 2), clr, t, 9), { a: 0.8 });
            lbl(W - 64, H - 78, unscr(scramble(`/* frame ${String(f).padStart(3, "0")} */`, pb, t, 10, 2), clr, t, 11), { right: true, a: 0.7 });
          }
          /* front riders: ticks + coordinates on the moving edge (in and out waves) */
          const ride = (p, seedB, txt) => {
            if (p <= 0.01 || p >= 0.99) return;
            const ys = [BOX.minY - 46, (BOX.minY + BOX.maxY) / 2 - 8, BOX.maxY + 30];
            ys.forEach((y, i) => {
              const x = Math.round(frontX(p, y) / 24) * 24 + 10;
              ctx.fillStyle = `rgba(${INK},0.9)`; ctx.fillRect(x - 10, y - 4, 1.5, 26);
              const s = i === 0 ? `x:${pad4(x)} y:${pad4(y)}` : i === 1 ? txt : `0x${(Math.floor(hash(f, i, seedB) * 255)).toString(16).toUpperCase().padStart(2, "0")}`;
              lbl(x, y, scramble(s, c01(p * 6), t, seedB + i, 2), { inv: i === 1, a: 0.95 });
            });
          };
          const pIn = c01((t - T_IN) / (SPAN_IN + LIFE_IN * 0.5));
          ride(eIO(pIn) * 0.999 + 0.0, 20, `>> ${String(Math.round(pIn * 100)).padStart(2, "0")}%`);
          const pOut = c01((t - T_OUT) / (SPAN_OUT + LIFE_OUT * 0.5));
          ride(pOut, 30, `-- ${String(Math.round(pOut * 100)).padStart(2, "0")}%`);

          /* per-word scramble labels with an inverse count chip */
          WORDS.forEach((w, i) => {
            const st = T_LBL + i * 0.12;
            if (t < st) return;
            const p = c01((t - st) / (3 / 24)), q = c01((t - st - 4 / 24) / (3 / 24));
            const x = Math.round(w.x0 / SP) * SP, y = w.base + 26;
            const id = `w${String(i + 1).padStart(2, "0")} / 0x${Math.floor(hash(i, 3, 77) * 255).toString(16).toUpperCase().padStart(2, "0")} /`;
            const ww = lbl(x, y, unscr(scramble(id, p, t, 50 + i, 3), clr, t, 60 + i), { a: 0.85 });
            if (q > 0 && clr < 1) lbl(x + ww + 14, y, unscr(scramble(`${w.n} dots`, q, t, 70 + i, 2), clr, t, 80 + i), { inv: true });
          });
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) {
          document.fonts.load('900 200px "Inter Tight"').then(() => { build(); draw(P.t); }).catch(() => {});
          document.fonts.ready.then(() => { build(); draw(P.t); });
        }
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
