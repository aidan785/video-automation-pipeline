<!doctype html>
<!--
  SANJI · tier1 · stat · BAR CHART GLASS
  Cobalt + sonar rings. A large glass chart card resolves in with its title
  and dashed gridlines, then five vertical glass bars grow up from the
  baseline (staggered), each value counting up above its bar. The tallest bar
  then lights ACTIVE (brighter sheen, halo) while the others focus-shift to
  dormant, and a glass callout pill pops above it on a short connector.
  Bar heights are proportional to the numeric part of v1..v5.
  Slots: title (<=24), l1..l5 (<=6), v1..v5 (number with optional prefix /
  suffix, <=5), callout (<=14).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t1-bar-chart-glass {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--cobalt); font-family: var(--font-body); color: var(--white);
      }
      #sanji-t1-bar-chart-glass .ring {
        position: absolute; left: 50%; top: 50%; width: 1800px; height: 1800px; margin: -900px 0 0 -900px;
        border-radius: 50%; border: 2px solid rgba(255,255,255,0.07);
        background: radial-gradient(circle, rgba(255,255,255,0) 55%, rgba(255,255,255,0.035) 100%);
      }
      #sanji-t1-bar-chart-glass .g { position: absolute; box-sizing: border-box; }
      #sanji-t1-bar-chart-glass .g > .fill, #sanji-t1-bar-chart-glass .g > .lit { position: absolute; inset: 0; border-radius: inherit; box-sizing: border-box; }
      #sanji-t1-bar-chart-glass .g > .fill { background: var(--glass-fill); border: var(--rim) solid var(--glass-rim); box-shadow: var(--glass-shadow); }
      #sanji-t1-bar-chart-glass .g > .lit  { background: var(--glass-fill-active); border: var(--rim) solid var(--glass-rim-active); box-shadow: var(--glass-shadow-active); opacity: 0; }
      #sanji-t1-bar-chart-glass .card { left: 240px; top: 120px; width: 1440px; height: 840px; border-radius: var(--r-card); }
      #sanji-t1-bar-chart-glass .badge {
        position: absolute; border-radius: 50%; box-sizing: border-box;
        background: var(--badge-fill); border: var(--rim) solid var(--badge-rim);
        display: flex; align-items: center; justify-content: center;
      }
      #sanji-t1-bar-chart-glass .hb { left: 300px; top: 168px; width: 104px; height: 104px; }
      #sanji-t1-bar-chart-glass .ttl { position: absolute; left: 434px; top: 168px; height: 104px; display: flex; align-items: center; white-space: nowrap;
        font-weight: var(--wt-bold); font-size: 56px; letter-spacing: var(--track-ui); }
      #sanji-t1-bar-chart-glass svg.grid { position: absolute; left: 0; top: 0; overflow: visible; }
      /* bars: an outer column holds bar + value + label */
      #sanji-t1-bar-chart-glass .bar { bottom: 250px; width: 150px; height: 0; border-radius: 30px; transform-origin: 50% 100%; }
      #sanji-t1-bar-chart-glass .val { position: absolute; width: 240px; margin-left: -45px; text-align: center; white-space: nowrap;
        font-family: var(--font-display); font-weight: var(--wt-heavy); font-size: 54px; line-height: 1; letter-spacing: var(--track-tight); }
      #sanji-t1-bar-chart-glass .lbl { position: absolute; top: 856px; width: 240px; margin-left: -45px; text-align: center; white-space: nowrap;
        font-weight: var(--wt-ui); font-size: 32px; letter-spacing: var(--track-ui); color: var(--white-soft); }
      #sanji-t1-bar-chart-glass .halo { position: absolute; width: 700px; height: 700px; margin: -350px 0 0 -350px; border-radius: 50%;
        background: radial-gradient(circle, rgba(150,170,255,0.36) 0%, rgba(90,110,255,0.12) 40%, rgba(32,66,238,0) 68%); opacity: 0; }
      #sanji-t1-bar-chart-glass .call { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      #sanji-t1-bar-chart-glass .call .pill { position: absolute; left: 0; top: -84px; height: 76px; border-radius: var(--r-pill); box-sizing: border-box;
        padding: 0 32px 0 14px; display: flex; align-items: center; gap: 14px; white-space: nowrap;
        background: var(--glass-fill-active); border: var(--rim) solid var(--glass-rim-active); box-shadow: var(--glass-shadow-active);
        font-family: var(--font-display); font-weight: var(--wt-heavy); font-size: 30px; letter-spacing: var(--track-caps); text-transform: uppercase; }
      #sanji-t1-bar-chart-glass .call .pill .badge { position: relative; width: 50px; height: 50px; flex: 0 0 auto; }
      #sanji-t1-bar-chart-glass .call .stem { position: absolute; left: -1.5px; top: -8px; width: 3px; height: 30px; background: var(--white); border-radius: 2px; transform-origin: 50% 0%; }
      #sanji-t1-bar-chart-glass .call .nd { position: absolute; left: -7px; top: 18px; width: 14px; height: 14px; border-radius: 50%; background: var(--white); box-shadow: 0 0 0 6px rgba(255,255,255,0.2); }
    </style>
  </head>
  <body>
    <div id="sanji-t1-bar-chart-glass" data-composition-id="sanji-t1-bar-chart-glass" data-start="0" data-width="1920" data-height="1080">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div class="g card"><div class="fill"></div><div class="lit"></div></div>
      <div class="badge hb"><svg width="48" height="48" viewBox="0 0 24 24" fill="#FFFFFF"><rect x="3" y="11" width="4" height="10" rx="1.5"/><rect x="10" y="5" width="4" height="16" rx="1.5"/><rect x="17" y="8" width="4" height="13" rx="1.5" opacity="0.7"/></svg></div>
      <div class="ttl" data-slot="title">Revenue by month</div>
      <svg class="grid" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" stroke="#FFFFFF">
        <path class="gl" d="M330 410H1590" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="4 10"/>
        <path class="gl" d="M330 550H1590" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="4 10"/>
        <path class="gl" d="M330 690H1590" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="4 10"/>
        <path class="base" d="M330 830H1590" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div class="halo"></div>
      <div class="cols">
        <div class="col"><div class="g bar"><div class="fill"></div><div class="lit"></div></div><div class="val" data-slot="v1">$42K</div><div class="lbl" data-slot="l1">Jan</div></div>
        <div class="col"><div class="g bar"><div class="fill"></div><div class="lit"></div></div><div class="val" data-slot="v2">$58K</div><div class="lbl" data-slot="l2">Feb</div></div>
        <div class="col"><div class="g bar"><div class="fill"></div><div class="lit"></div></div><div class="val" data-slot="v3">$51K</div><div class="lbl" data-slot="l3">Mar</div></div>
        <div class="col"><div class="g bar"><div class="fill"></div><div class="lit"></div></div><div class="val" data-slot="v4">$86K</div><div class="lbl" data-slot="l4">Apr</div></div>
        <div class="col"><div class="g bar"><div class="fill"></div><div class="lit"></div></div><div class="val" data-slot="v5">$64K</div><div class="lbl" data-slot="l5">May</div></div>
      </div>
      <div class="call"><div class="stem"></div><div class="nd"></div>
        <div class="pill"><div class="badge"><svg width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"/></svg></div><span data-slot="callout">Best month</span></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-t1-bar-chart-glass";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => [...ROOT.querySelectorAll(s)];
        const css = getComputedStyle(document.documentElement);
        const WHITE = css.getPropertyValue("--white").trim(), DORM = css.getPropertyValue("--dormant").trim();

        const counter = (el) => {
          const raw = el.textContent.trim();
          const m = raw.match(/^([^0-9]*)([0-9][0-9,]*(?:\.[0-9]+)?)(.*)$/);
          if (!m) return { el, target: 0, set: () => {} };
          const dec = (m[2].split(".")[1] || "").length, commas = m[2].includes(",");
          const target = parseFloat(m[2].replace(/,/g, ""));
          const fmt = (v) => { const s = v.toFixed(dec); if (!commas) return s; const [a, b] = s.split("."); return a.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (b ? "." + b : ""); };
          return { el, target, set: (v) => { el.textContent = m[1] + fmt(v) + m[3]; } };
        };

        const cols = $$(".col"), BASE = 830, MAXH = 340, X0 = 330, SPAN = 1260, N = cols.length;
        const cs = cols.map((c) => counter(c.querySelector(".val")));
        const max = Math.max(...cs.map((c) => c.target)) || 1;
        const top = cs.reduce((b, c, i) => (c.target > cs[b].target ? i : b), 0);
        const geo = cols.map((c, i) => {
          const cx = X0 + SPAN * (i + 0.5) / N, h = Math.max(24, MAXH * cs[i].target / max);
          const bar = c.querySelector(".bar"), val = c.querySelector(".val"), lbl = c.querySelector(".lbl");
          bar.style.left = cx - 75 + "px"; val.style.left = cx - 75 + "px"; lbl.style.left = cx - 75 + "px";
          return { cx, h, bar, val, lbl };
        });
        cs.forEach((c) => c.set(0));
        const H = geo.map(() => ({ h: 0 }));
        const place = (i) => { const g = geo[i]; g.bar.style.height = H[i].h + "px"; g.val.style.top = BASE - H[i].h - 74 + "px"; };
        geo.forEach((g, i) => place(i));

        /* flex containers: wrap their text in one inline box so the preset's word boxes keep their spaces */
        const inl = (el) => { const s = document.createElement("span"); while (el.firstChild) s.appendChild(el.firstChild); el.appendChild(s); return s; };
        const tl = gsap.timeline({ paused: true });
        const T_BARS = 0.85, BSTEP = 0.16, T_FOCUS = T_BARS + 4 * BSTEP + 1.15, END = T_FOCUS + 2.6;

        const rings = $$(".ring"), PER = 4.2;
        rings.forEach((r, i) => {
          const st = i * (PER / rings.length);
          if (st + PER > END) { tl.set(r, { opacity: 0 }, 0); return; }
          if (st + PER > END) return;   /* skip rings that can't finish before END */
          const reps = Math.floor((END - st) / PER) - 1;
          tl.fromTo(r, { scale: 0.25, opacity: 0 }, { keyframes: [{ scale: 0.62, opacity: 1, duration: PER * 0.45, ease: "sine.out" }, { scale: 1.05, opacity: 0, duration: PER * 0.55, ease: "sine.in" }], repeat: reps }, st);
        });
        const blurIn = (els, t, st = 0.06) => tl.fromTo(els, { autoAlpha: 0, y: 8, filter: "blur(8px)" }, { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out", stagger: st }, t);

        tl.fromTo($(".card"), { autoAlpha: 0, scale: 0.94, filter: "blur(12px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.2)" }, 0.1);
        TXT.block(tl, $(".hb"), 0.35);
        TXT.reveal(tl, inl($(".ttl")), 0.43);
        tl.fromTo($(".base"), { strokeDasharray: 1260, strokeDashoffset: 1260 }, { strokeDashoffset: 0, duration: 0.7, ease: "power3.inOut" }, 0.45);
        tl.fromTo($$(".gl"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, stagger: 0.08 }, 0.55);
        TXT.reveal(tl, geo.map((g) => g.lbl), 0.6, { stagger: 0.06 });

        geo.forEach((g, i) => {
          const t = T_BARS + i * BSTEP;
          tl.fromTo(H[i], { h: 0 }, { h: g.h, duration: 0.95, ease: "expo.out", onUpdate: () => place(i), immediateRender: false }, t);
          tl.fromTo(g.bar, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.15 }, t);
          TXT.block(tl, g.val, t + 0.05, { blur: 6 });   /* count-up text is rewritten per frame: block, not words */
          const P = { v: 0 };
          tl.fromTo(P, { v: 0 }, { v: cs[i].target, duration: 0.95, ease: "power2.out", onUpdate: () => cs[i].set(P.v), immediateRender: false }, t);
        });

        /* focus: tallest bar lights, others go dormant, callout pops */
        const W = geo[top];
        gsap.set($(".halo"), { left: W.cx, top: BASE - W.h * 0.55 });
        gsap.set($(".call"), { x: W.cx, y: BASE - W.h - 74 - 44 });
        tl.to(W.bar.querySelector(".lit"), { opacity: 1, duration: 0.4, ease: "power2.out" }, T_FOCUS)
          .to(W.bar, { scale: 1.025, duration: 0.5, ease: "expo.out" }, T_FOCUS)
          .fromTo($(".halo"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out" }, T_FOCUS)
          .to(W.val, { textShadow: "0 0 30px rgba(255,255,255,0.55)", duration: 0.4 }, T_FOCUS);
        geo.forEach((g, i) => {
          if (i === top) return;
          tl.to([g.val, g.lbl], { color: DORM, duration: 0.35, ease: "power2.inOut" }, T_FOCUS)
            .to(g.bar, { opacity: 0.6, duration: 0.35, ease: "power2.inOut" }, T_FOCUS);
        });
        tl.to(W.lbl, { color: WHITE, duration: 0.35 }, T_FOCUS);
        tl.set([$(".call .stem"), $(".call .nd"), $(".call .pill")], { autoAlpha: 0 }, 0);
        tl.fromTo($(".call .nd"), { autoAlpha: 0, scale: 0 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, T_FOCUS + 0.15);
        tl.fromTo($(".call .stem"), { autoAlpha: 1, scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.25, ease: "power2.out" }, T_FOCUS + 0.22);
        tl.fromTo($(".call .pill"), { autoAlpha: 0, scale: 0.9, filter: "blur(10px)", xPercent: -50, x: 0 }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", xPercent: -50, duration: 0.38, ease: "back.out(1.25)" }, T_FOCUS + 0.36);
        TXT.reveal(tl, $(".call .pill span"), T_FOCUS + 0.44);
        tl.set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
