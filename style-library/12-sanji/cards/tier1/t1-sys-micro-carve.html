<!doctype html>
<!--
  SANJI · tier1 · thesis · SYSTEM MICRO CARVE
  SYSTEM x Sanji (wave 4). The whole blue screen fills with a dense grid of very
  small terminal log text (13px Plex Mono on an 8x16 cell grid, seeded lines
  typing fast top to bottom with a white block cursor at each typing head). Then
  a big statement is carved out of it: the micro-text cells inside the
  statement's letter mask brighten to full white, scramble for a frame, and
  invert into chips (white cell, blue glyph) on a ragged left-to-right front,
  while everything else dims to 15%. A few dim cells keep re-rolling so the log
  stays alive through the hold. Exit: the whole log scrolls up and away in
  stepped terminal rows, leaving the empty blue screen.
  Slots: statement (text, <= 12 on one line, <= 24 wraps to two balanced lines,
  uppercase reads best).
-->

        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--sys-blue); font-family: var(--font-term); color: var(--sys-ink);

      #sanji-t1-sys-micro-carve .src { display: none; }

    </style>
  </head>
