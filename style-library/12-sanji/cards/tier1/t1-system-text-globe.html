            if (rot && s > 20) { g2.save(); g2.translate(x, y); g2.rotate(rot); g2.fillText(ch, 0, 0); g2.restore(); }
            else g2.fillText(ch, x, y);
          }
          g2.globalAlpha = 1;

          drawRing(ringFront, false);
          for (const c of chips) if (c.p.z >= 0) chipAt(c.str, c.p, c.ang, 28 * (1 + c.p.z / RR * 0.15), ringAlpha);
          g2.globalAlpha = 1;
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) document.fonts.ready.then(() => draw(P.t));
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
