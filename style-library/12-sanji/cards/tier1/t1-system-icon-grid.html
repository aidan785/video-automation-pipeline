  "**Label" tags scramble in under each, an echo block types top-right, then
  one icon takes focus: it goes denser + brighter + slightly bigger while the
  others dim, and its tag flickers into the inverse chip.
  Slots: icons (comma list of 3 names: lock, shield, key, zap, cloud, file),
  labels (comma list of 3, <= 12 chars each, "**" prefix added for you),
  focus (1-3, which icon takes the highlight).

              const mc = Math.floor(px / F.cw), mr = Math.floor(py / F.ch);
              let near = false;
              for (let dr = -3; dr <= 3 && !near; dr++) for (let dc = -4; dc <= 4; dc++) if (F.lumAt(mc + dc, mr + dr) > 0.04) { near = true; break; }
              if (near) continue;
              if (CLEAR.some((b) => t >= b[4] && px > b[0] && px < b[2] && py > b[1] && py < b[3])) continue;
              const step = Math.floor(fr / 5 + hash(c, r, 4) * 5);
              const chr = WALL[Math.floor(hash(c, r, step) * WALL.length)];
              W.text(c, r, chr, { alpha: 0.72 + 0.28 * hash(r, c, 9) });
            }
          }
          W.render(t, { flicker: 0 });

          /* tags: "**Label" scramble in under each icon; focus tag flickers into the chip */
          tagEls.forEach((el, i) => {
            if (t < T_TAG[i]) { el.style.visibility = "hidden"; return; }
            el.style.visibility = "visible";
            el.textContent = scramble(TAGS[i], (t - T_TAG[i]) / TAG_D, t, 30 + i, 3);
            const hero = i === FOCUS;
            const fr = frame(t - T_FOCUS);
            const on = hero && t >= T_FOCUS && (fr < 12 ? fr % 4 < 2 : true);
            el.className = "t tag" + i + (on ? " inv" : "");
            el.style.opacity = hero ? 1 : 1 - 0.55 * foc;
          });
          /* echo block (s31 top-right): hero tag repeated, typed in */
          const echo = $(".echo");
          if (t < T_ECHO) echo.textContent = "";
          else {
            const k = Math.floor((t - T_ECHO) * 24), tag = TAGS[FOCUS];
            const a = scramble(tag, k / 4, t, 41, 2), b = scramble(tag, (k - 3) / 4, t, 42, 2);
            echo.textContent = a + (k >= 3 ? "\n" + b : "");
          }
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) document.fonts.ready.then(() => draw(P.t));
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
