<!doctype html>
<!--
  SANJI · tier1 · thesis · NATURE GLASS PILL
  The landscape moment from the cold open. A real landscape photo, full bleed,
  with a very slow push-in on the background only. The card opens on a blue
  ordered-dither / pixel-mosaic version of the photo that dissolves away in a
  diagonal band sweep (canvas, Bayer threshold per 14px cell, seeded ragged
  edge, redrawn from the timeline clock). A wide liquid-glass pill slides in
  from the right out of blur; because it is translucent it takes the photo's
  own tint (olive over grass). The words of the line resolve one by one inside
  the pill, a soft light sheen crosses it once, then the whole scene dims to
  dark as the exit.
  Slots: line (text, <= 30 chars), photo (filename stem in assets/nature:
  green-hills | hills-sunset | countryside-mist | wheat-field).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t1-nature-glass-pill {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--void); font-family: var(--font-body);
      }
      #sanji-t1-nature-glass-pill .bg { position: absolute; inset: 0; transform-origin: 56% 58%; }
      #sanji-t1-nature-glass-pill .bg img,
      #sanji-t1-nature-glass-pill .bg canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #sanji-t1-nature-glass-pill .bg img { object-fit: cover; }
      #sanji-t1-nature-glass-pill .bg canvas { image-rendering: pixelated; }
      #sanji-t1-nature-glass-pill .shade {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.28) 100%);
      }
      #sanji-t1-nature-glass-pill .slot-photo { display: none; }

      /* liquid glass pill: translucent, so it takes the photo's own tint */
      #sanji-t1-nature-glass-pill .pillwrap {
        position: absolute; left: 0; right: 0; top: 50%; height: 124px; margin-top: -62px;
        display: flex; justify-content: center;
      }
      #sanji-t1-nature-glass-pill .pill {
        position: relative; box-sizing: border-box; min-width: 860px; height: 124px; padding: 0 76px;
        border-radius: var(--r-pill); overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        -webkit-backdrop-filter: blur(22px) saturate(1.4) brightness(1.1); backdrop-filter: blur(22px) saturate(1.4) brightness(1.1);
        background: linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.05) 46%, rgba(0,0,0,0.07) 100%);
        border: var(--rim) solid rgba(255,255,255,0.35);
        box-shadow:
          inset 0 1.5px 0 rgba(255,255,255,0.55),
          inset 0 -18px 34px rgba(0,0,0,0.10),
          0 22px 60px rgba(0,0,0,0.20);
      }
      #sanji-t1-nature-glass-pill .pill .hl {
        position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        background:
          radial-gradient(34% 120% at 9% -10%, rgba(255,255,255,0.42), rgba(255,255,255,0) 70%),
          radial-gradient(40% 90% at 92% 120%, rgba(255,255,255,0.10), rgba(255,255,255,0) 70%);
      }
      #sanji-t1-nature-glass-pill .pill .sheen {
        position: absolute; top: -30%; left: 0; width: 230px; height: 160%; pointer-events: none;
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.30) 50%, rgba(255,255,255,0) 100%);
        transform: skewX(-22deg); filter: blur(6px); opacity: 0;
      }
      #sanji-t1-nature-glass-pill .line {
        position: relative; white-space: nowrap;
        font-family: var(--font-body); font-weight: var(--wt-bold); font-size: 64px;
        letter-spacing: var(--track-ui); line-height: 1; color: var(--white);
        text-shadow: 0 2px 14px rgba(0,0,0,0.16);
      }
      #sanji-t1-nature-glass-pill .line .w { display: inline-block; white-space: pre; }
      #sanji-t1-nature-glass-pill .dim { position: absolute; inset: 0; background: var(--void); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="sanji-t1-nature-glass-pill" data-composition-id="sanji-t1-nature-glass-pill" data-start="0" data-width="1920" data-height="1080">
      <span class="slot-photo" data-slot="photo">green-hills</span>
      <div class="bg">
        <img class="photo" alt="" />
        <canvas class="dither" width="1920" height="1080"></canvas>
      </div>
      <div class="shade"></div>
      <div class="pillwrap">
        <div class="pill">
          <div class="hl"></div>
          <div class="sheen"></div>
          <div class="line" data-slot="line">and clients have no idea?</div>
        </div>
      </div>
      <div class="dim"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-t1-nature-glass-pill";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => ROOT.querySelectorAll(s);
        const css = getComputedStyle(document.documentElement);
        const tok = (n) => css.getPropertyValue(n).trim();
        const WHITE = tok("--white"), PRE = tok("--white-pre");

        /* photo from slot */
        const stem = ($(".slot-photo").textContent || "green-hills").trim();
        const img = $(".photo");
        img.src = "../../assets/nature/" + stem + ".jpg";

        /* ---- dither field: blue ordered dither of the photo, 14px cells ---- */
        const CELL = 14, COLS = Math.ceil(1920 / CELL), ROWS = Math.ceil(1080 / CELL), N = COLS * ROWS;
        const PAL = [tok("--cobalt-ink"), tok("--cobalt"), tok("--cobalt-lift"), tok("--volt"), tok("--volt-soft"), WHITE];
        const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
        let seed = 7331; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
        const diag = new Float32Array(N), bay = new Float32Array(N), lvl = new Uint8Array(N);
        for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
          const i = y * COLS + x;
          bay[i] = BAYER[(y % 4) * 4 + (x % 4)];
          /* diagonal coordinate: sweeps bottom-left -> top-right, ragged */
          diag[i] = (x / COLS) * 0.58 + (1 - y / ROWS) * 0.42 + (rnd() - 0.5) * 0.035;
          lvl[i] = 1;
        }
        let ready = false;
        function prep() {
          const off = document.createElement("canvas"); off.width = COLS; off.height = ROWS;
          const o = off.getContext("2d"); o.drawImage(img, 0, 0, COLS, ROWS);
          const d = o.getImageData(0, 0, COLS, ROWS).data;
          for (let i = 0; i < N; i++) {
            const l = (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) / 255;
            const v = Math.min(0.999, Math.max(0, Math.pow(l, 1.25) * 1.02 + (bay[i] - 0.5) * 0.42));
            lvl[i] = Math.floor(v * PAL.length);
          }
          ready = true;
        }
        const cv = $("canvas.dither"), ctx = cv.getContext("2d");
        const BW = 0.22;                          /* band width in diag units */
        const sweep = gsap.parseEase("power2.inOut");
        const S0 = 0.18, S1 = 1.28;               /* band sweep window */
        let lastT = 0;
        function draw(t) {
          lastT = t;
          ctx.clearRect(0, 0, 1920, 1080);
          const k = Math.min(1, Math.max(0, (t - S0) / (S1 - S0)));
          if (k >= 1) return;
          const p = -0.05 + sweep(k) * (1.1 + BW + 0.05);   /* band front */
          for (let i = 0; i < N; i++) {
            const u = (p - diag[i]) / BW;           /* <0 ahead (dithered), >1 revealed */
            if (u >= 1) continue;
            if (u > 0 && bay[i] < u) continue;      /* ordered dissolve inside the band */
            let L = ready ? lvl[i] : 1;
            if (u > 0 && u < 0.45) L = Math.min(PAL.length - 1, L + 1);   /* hot leading edge */
            ctx.fillStyle = PAL[L];
            ctx.fillRect((i % COLS) * CELL, ((i / COLS) | 0) * CELL, CELL, CELL);
          }
        }
        const onImg = () => { try { prep(); } catch (e) {} draw(lastT); };
        if (img.complete && img.naturalWidth) onImg(); else img.addEventListener("load", onImg);

        /* ---- words ---- */
        const line = $(".line");
        const ws = line.textContent.trim().split(/\s+/);
        line.textContent = "";
        const words = ws.map((w, i) => {
          const s = document.createElement("span"); s.className = "w";
          s.textContent = w + (i < ws.length - 1 ? " " : ""); line.appendChild(s); return s;
        });

        const tl = gsap.timeline({ paused: true });
        const PILL = 0.42, W0 = 0.86, GAP = 0.24;
        const TW = W0 + (words.length - 1) * 0.04 + 0.7;   /* house preset: last word lands */
        const SHEEN = TW - 0.2;
        const DIM = Math.max(SHEEN + 1.5, 3.9);
        const END = DIM + 0.7;

        /* clock: dither band redrawn from time */
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);

        /* slow push-in on the BACKGROUND only */
        tl.fromTo($(".bg"), { scale: 1 }, { scale: 1.05, duration: END, ease: "sine.inOut" }, 0);

        /* glass pill slides in from the right out of blur */
        tl.set(words, { autoAlpha: 0 }, 0)
          .fromTo($(".pill"),
            { autoAlpha: 0, x: 520, scaleX: 1.06, filter: "blur(16px)" },
            { autoAlpha: 1, x: 0, scaleX: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, PILL);

        /* words resolve one by one inside the pill */
        tl.set(words, { autoAlpha: 1 }, 0);
        TXT.reveal(tl, words, W0);                         /* house preset pour-in */

        /* one soft light sheen across the glass */
        tl.fromTo($(".sheen"), { x: -320, opacity: 0 }, { x: () => $(".pill").offsetWidth + 120, opacity: 1, duration: 0.95, ease: "power2.inOut" }, SHEEN)
          .to($(".sheen"), { opacity: 0, duration: 0.25, ease: "power1.in" }, SHEEN + 0.7);

        /* exit: the whole scene dims to dark, the line softens */
        tl.to(words, { filter: "blur(6px)", autoAlpha: 0.4, duration: 0.45, ease: "power2.in" }, DIM)
          .to($(".pill"), { scale: 0.985, duration: 0.6, ease: "power2.in" }, DIM)
          .to($(".dim"), { opacity: 1, duration: 0.65, ease: "power2.in" }, DIM)
          .set({}, {}, END);

        draw(0);
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
