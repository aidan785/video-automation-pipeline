  references/system s23 (text globe with rays, f481-490). One giant word is
  painted with SYS.word() and rendered AS glyphs: its core is filled with the
  word's own letters repeating (like the reference's "updatedsystem" globe),
  the edges fall back to the density ramp. Every cell flies in from a seeded
  spot anywhere in the frame and converges on the grid, while slash/ray glyph
  lines radiate behind it. Then an inverse chip of the label scrambles in
  inside the word and terminal-size echo tags float around it. Exit is a
  2-frame noise flash back to blue.

  chip inside the word), tag (text, <= 10, small floating echoes).
