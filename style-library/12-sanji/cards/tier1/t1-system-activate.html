<!doctype html>
<!--
  SANJI · tier1 · stat · SYSTEM ACTIVATE
  references/system s08-s13. A coin built from luminance-mapped glyphs spins
  on its vertical axis over a faint glyph field, goes edge-on, collapses into a
  ring of drifting dots; two frames of full-screen glyph noise; an inverse-video
  chip scrambles in at the center ("Activating"), the ring thins out, then the
  label lets go of its chip and the VALUE scrambles in, inverse, after it.
  Side columns of ">ITEM" tickers type down and small glyph coins tumble in.
  Slots: label (text, <= 14 chars), value (text, <= 14 chars), glyph (1 char
  on the coin face), items (comma list, 6-30 short names, <= 6 chars each).
-->

        background: var(--sys-blue); font-family: var(--font-term);

        text-shadow: var(--sys-bloom); color: var(--sys-ink);

    </style>
  </head>

      lumAt(c, r) { return c < 0 || r < 0 || c >= cols || r >= rows ? 0 : lum[r * cols + c]; },

  /* spinning coin: angle in radians around the vertical axis. Generic face

        const ID = "sanji-t1-system-activate";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s);
        const { c01, hash, lcg, scramble, noiseStr, coin, dot } = SYS;
