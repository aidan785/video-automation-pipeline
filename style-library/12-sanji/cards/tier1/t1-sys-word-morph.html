            if (t < T_CAPX) label(LA, capX, capY, T_CAP, 3, { typeF: 4 });
            else {
              const n = Math.max(LA.length, LB.length), q = c01((t - T_CAPX) / CAPX_D);
              g.font = MF;
              for (let i = 0; i < n; i++) {
                const e = i / n, d = q * 1.4 - e;   /* front with a 3-cell noise band */
                let ch = d >= 0.3 ? LB[i] : d > 0 ? NOISE[Math.floor(hash(i, fr, 41) * NOISE.length)] : LA[i];
                if (!ch || ch === " ") continue;
                g.fillStyle = `rgba(${INK},${d > 0 && d < 0.3 ? 0.75 : 1})`; g.fillText(ch, Math.round(capX + i * ADV), Math.round(capY));
              }
            }
          }

          /* ---- micro readouts on the grid around the word ---- */
          const by = Math.max(A.y1, B.y1) + 40, lx = capX;
          const N = PAIRS.length;
          label(`pts ${String(N).padStart(4, "0")}`, lx, by, T_A + f(6), 5, { out: T_CLR });
          const mp = Math.round(100 * c01((t - T_M) / (T_SET - T_M)));
          label(`morph >> ${String(mp).padStart(3, " ")}%`, lx + 12 * ADV, by, T_M - f(4), 7, { out: T_CLR });
          label(t < T_M ? "[ .. ]" : mp < 100 ? "[ RUN ]" : "[ OK ]", lx + 30 * ADV, by, T_M - f(2), 9, { out: T_CLR });
          const frs = `/* frame ${String(fr).padStart(3, "0")} */`;
          const rx = Math.round(Math.max(A.x1, B.x1) / ADV) * ADV;
          label(frs, rx - frs.length * ADV, capY, T_CAP + f(4), 11, { out: T_CLR });
          /* coordinate tags riding a few travelling dots */
          for (const { p: P, k } of RIDERS) {
            const s = pos(P, t);
            if (s.m < 0.3) continue;
            const a = c01((s.m - 0.3) / 0.15);
            const tag = k % 2 ? `0x${(P.i & 255).toString(16).toUpperCase().padStart(2, "0")}` : `x:${String(Math.round(s.x)).padStart(4, "0")}`;
            g.fillStyle = `rgba(${INK},${0.85 * a})`; g.fillRect(Math.round(s.x) + 10, Math.round(s.y), 14, 1);
            g.font = MF; g.fillText(tag, Math.round(s.x) + 28, Math.round(s.y) - 10);
          }

          /* ---- inverse chip on B: one lone cell, grows left to right while scrambling ---- */
          if (t >= T_CHIP) {
            const n = CHIP.length + 2, grow = c01((frame(t - T_CHIP) + 1) / 9);
            const cells = Math.max(1, Math.round(grow * n));
            const s = " " + (grow < 1 ? SYS.scramble(CHIP, grow, t, 17, 3) : CHIP) + " ";
            const cw = 14.4, x = Math.round(B.x1 - n * cw), y = Math.round(B.y1 + 18);
            g.fillStyle = `rgb(${INK})`; g.fillRect(x, y, Math.round(cells * cw), 34);
            g.font = `600 24px "IBM Plex Mono", "JetBrains Mono", monospace`; g.fillStyle = BLUE;
            for (let i = 0; i < cells; i++) if (s[i] !== " ") g.fillText(s[i], x + i * cw, y + 3);
          }
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) {
          Promise.all([document.fonts.load(WF(100)), document.fonts.load(MF), document.fonts.load('600 24px "IBM Plex Mono"')])
            .then(() => { build(); draw(P.t); }, () => {});
          document.fonts.ready.then(() => { build(); draw(P.t); });
        }
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
