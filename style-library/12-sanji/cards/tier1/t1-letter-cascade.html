<!doctype html>
<!--
  SANJI · tier1 · section · LETTER CASCADE
  COBALT WASH (cyan blobs + faint 64px blueprint grid). A caps title builds
  letter by letter, but NOT left to right: a seeded shuffle decides the order,
  so letters rain in from all over the word. Each letter drops from above out
  of a heavy blur (dim white to full white, slightly stretched like it carries
  motion blur), lands a hair low and settles up into place. Once the word is
  complete a soft diagonal light beam crosses the frame and each letter
  catches a halo as it passes. Exit: letters lift away in the same seeded
  order, fast, with blur.
  Slots: title (text caps, <=22, wraps to two lines past ~13).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t1-letter-cascade {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--cobalt-wash); color: var(--white); font-family: var(--font-display);
      }
      #sanji-t1-letter-cascade .grid { position: absolute; inset: -64px; background: var(--cell-grid); }
      #sanji-t1-letter-cascade .vig {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at center, rgba(20,30,180,0) 50%, rgba(20,30,180,0.45) 100%);
      }
      #sanji-t1-letter-cascade .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #sanji-t1-letter-cascade .title {
        max-width: 1560px; text-align: center;
        font-weight: var(--wt-heavy); font-size: 190px; line-height: 0.9; letter-spacing: var(--track-caps);
        text-transform: uppercase; word-spacing: 0.08em;
        text-shadow: 0 10px 50px rgba(14,18,150,0.35);
      }
      #sanji-t1-letter-cascade .title .wd { display: inline-block; white-space: nowrap; }
      #sanji-t1-letter-cascade .title .ch { display: inline-block; transform-origin: 50% 100%; }
      #sanji-t1-letter-cascade .beam {
        position: absolute; left: 0; top: -300px; width: 420px; height: 1680px;
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(190,225,255,0.22) 35%, rgba(255,255,255,0.46) 50%, rgba(190,225,255,0.22) 65%, rgba(255,255,255,0) 100%);
        filter: blur(24px); mix-blend-mode: screen; transform: rotate(18deg); opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="sanji-t1-letter-cascade" data-composition-id="sanji-t1-letter-cascade" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="vig"></div>
      <div class="stage"><div class="title" data-slot="title">Make it move</div></div>
      <div class="beam"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const ID = "sanji-t1-letter-cascade";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s);
        const css = getComputedStyle(document.documentElement);
        const tok = (n) => css.getPropertyValue(n).trim();
        const WHITE = tok("--white"), PRE = tok("--white-pre");

        /* split into word wrappers (no mid-word breaks) + letter spans */
        const title = $(".title");
        const ws = (title.textContent || "").trim().split(/\s+/).filter(Boolean);
        title.textContent = "";
        const chars = [];
        ws.forEach((w, i) => {
          const wd = document.createElement("span"); wd.className = "wd";
          [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.textContent = c; wd.appendChild(s); chars.push(s); });
          title.appendChild(wd);
          if (i < ws.length - 1) title.appendChild(document.createTextNode(" "));
        });

        /* seeded shuffle (LCG) for the landing order */
        let seed = 20241103 + chars.length * 7;
        const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
        const order = chars.map((_, i) => i);
        for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
        const drops = chars.map(() => 110 + rnd() * 90);   /* per-letter drop height */

        const tl = gsap.timeline({ paused: true });
        const T0 = 0.25, STAG = Math.min(0.07, 1.1 / chars.length);
        tl.set(chars, { autoAlpha: 0 }, 0);

        /* ambient: grid drifts, wash breathes */
        tl.fromTo($(".grid"), { x: 0, y: 0 }, { x: 32, y: -24, duration: 6, ease: "sine.inOut" }, 0)
          .fromTo($(".vig"), { opacity: 0.6 }, { opacity: 1, duration: 3, ease: "sine.inOut" }, 0);

        order.forEach((ci, k) => {
          const c = chars[ci], t = T0 + k * STAG;
          tl.fromTo(c, { autoAlpha: 0, y: -drops[ci], scaleY: 1.18, filter: "blur(14px)", color: PRE },
                       { autoAlpha: 1, y: 7, scaleY: 0.97, filter: "blur(0px)", color: WHITE, duration: 0.42, ease: "power3.out" }, t)
            .to(c, { y: 0, scaleY: 1, duration: 0.22, ease: "sine.out" }, t + 0.42);
        });
        const BUILT = T0 + (chars.length - 1) * STAG + 0.64;

        /* the light beam crosses; letters catch a halo as it passes (DOM order ~ x order) */
        const SW = BUILT + 0.15, SD = 1.3;
        tl.fromTo($(".beam"), { x: -700, opacity: 0 }, { x: 2300, duration: SD, ease: "power2.inOut" }, SW)
          .to($(".beam"), { opacity: 1, duration: 0.3, ease: "sine.out" }, SW)
          .to($(".beam"), { opacity: 0, duration: 0.3, ease: "sine.in" }, SW + SD - 0.3);
        chars.forEach((c, i) => {
          const r = chars.length > 1 ? i / (chars.length - 1) : 0.5;
          const t = SW + SD * (0.32 + r * 0.42);
          tl.to(c, { textShadow: "0 0 44px rgba(255,255,255,0.95), 0 10px 50px rgba(14,18,150,0.35)", duration: 0.2, ease: "power2.out" }, t)
            .to(c, { textShadow: "0 0 0px rgba(255,255,255,0), 0 10px 50px rgba(14,18,150,0.35)", duration: 0.5, ease: "power2.out" }, t + 0.2);
        });

        /* hold, then letters lift away in the seeded order */
        const OUT = SW + SD + 1.0;
        order.forEach((ci, k) => {
          tl.to(chars[ci], { autoAlpha: 0, y: -40, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, OUT + k * STAG * 0.4);
        });
        tl.set({}, {}, OUT + chars.length * STAG * 0.4 + 0.35);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
