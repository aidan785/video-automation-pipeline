          if (t >= T_ARR) maskRect(b.x + 26, b.y - 26, TO.length * 20 + 30, 48);

          /* ---- the map, cell by cell ---- */
          const pm = c01((t - T_MAP) / MAP_D);
          const rA = 230 * eO(c01((t - T_A) / 1.1)), rB = 540 * eO(c01((t - T_ARR) / SPREAD_D));
          const BIG = [], TRAIL = [];
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
            const k = r * cols + c; if (MASK[k]) continue;
            if (hash(c, r, 21) > pm * 1.15) continue;                   /* scramble-in */
            const x = (c + 0.5) * F.cw, y = (r + 0.5) * F.ch;
            if (coinOn && Math.hypot(x - obj.x, y - obj.y) < CR + 24) continue;   /* coin occludes the map */
            const L = LANDM[k];
            if (!L) { if (c % 2 === 0 && r % 2 === 0) F.text(c, r, ".", { alpha: 0.34 }); continue; }
            const coast = !land(c + 1, r) || !land(c - 1, r) || !land(c, r + 1) || !land(c, r - 1);
            /* "+" clusters spreading over land around the endpoints */
            const dA = Math.hypot(x - a.x, (y - a.y) * 1.3), dB = Math.hypot(x - b.x, (y - b.y) * 1.3);
            const inA = dA < rA * (0.75 + 0.5 * SYS.fbm(c * 0.18, r * 0.18, 4)), inB = dB < rB * (0.6 + 0.8 * SYS.fbm(c * 0.12, r * 0.12, 8));
            if ((inA || inB) && hash(c, r, 33) < 0.5) {
              const h = hash(c, r, 34);
              if (h < 0.09 && c % 2 === 0 && r % 2 === 0) { BIG.push([x, y, h < 0.03 ? "#" : "+"]); continue; }
              F.text(c, r, h < 0.62 ? "+" : h < 0.8 ? "%" : h < 0.9 ? "#" : "&", { alpha: 0.95 });
              continue;
            }
            if (coast) { F.text(c, r, hash(c, r, fr >> 2) < 0.06 ? ":" : coastGlyph(c, r), { alpha: 0.9 }); continue; }
            if (c % 2 === 0) F.text(c, r, hash(c, r, 5) < 0.14 ? "*" : hash(c, r, 6) < 0.08 ? "." : ">", { alpha: 0.6 });
          }
          /* arc: faint dotted path, brighter trail behind the coin */
          if (t >= T_GO - f(4)) {
            const pa = c01((t - (T_GO - f(4))) / 0.35);
            for (let i = 0; i <= 160; i++) {
              const u = i / 160; if (u > pa) break;
              const p = cam(bez(u)), c = Math.floor(p.x / F.cw), r = Math.floor(p.y / F.ch);
              const behind = u <= pGo && pGo < 1;
              if (behind) TRAIL.push([p.x, p.y, u > pGo - 0.06 ? 1 : 0.55 + 0.4 * (u / pGo)]);
              else if (i % 3 === 0) F.text(c, r, ".", { alpha: 0.7 });
              MASK[r * cols + c] = 1;
            }
          }
          /* coin (luminance paint) */
          F.paint((g) => {
            if (coinOn) {
              coin(g, obj.x, obj.y, CR, t * 7, { glyph: GLYPH, sheen: t * 2, face: 0.3 });
            }
            /* arrival ring */
            if (t >= T_ARR && t < T_ARR + 0.6) {
              const q = (t - T_ARR) / 0.6; g.lineWidth = 16 * (1 - q); g.strokeStyle = `rgba(255,255,255,${1 - q})`;
              g.beginPath(); g.ellipse(b.x, b.y, 40 + 260 * eO(q), 30 + 190 * eO(q), 0, 0, 6.2832); g.stroke();
            }
          });
          F.render(t, { flicker: 0.12, floor: 0.08, alphaMin: 0.5 });

          /* ---- smooth layer: big glyphs, markers, chips, labels ---- */
          g2.clearRect(0, 0, 1920, 1080); g2.textBaseline = "middle";
          g2.fillStyle = INK; g2.textAlign = "center";
          for (const [x, y, ch] of BIG) { g2.font = `700 ${ch === "#" ? 40 : 46}px ${TERM}`; g2.fillText(ch, x, y); }
          /* trail behind the coin, on the smooth layer */
          g2.font = `700 30px ${TERM}`;
          for (let i = 0; i < TRAIL.length; i += 2) { const [x, y, al] = TRAIL[i]; g2.globalAlpha = al; g2.fillText(i % 8 === 0 ? "+" : ".", x, y); }
          g2.globalAlpha = 1;
          /* endpoint crosshairs */
          const mark = (p, on) => { if (!on) return; g2.font = `700 34px ${TERM}`; g2.fillText(fr % 12 < 8 ? "[+]" : "[ ]", p.x, p.y); };
          mark(a, t >= T_A); mark(b, t >= T_ARR - f(2));
          g2.textAlign = "left";
          if (t >= T_A) {
            const p = (t - T_A) / f(11);
            chip(p < 0.12 ? " " : scramble(FROM, (p - 0.12) / 0.88, t, 5, 2), a.x + 34, a.y, 28);
          }
          if (t >= T_ARR) {
            const p = (t - T_ARR) / f(11);
            chip(p < 0.12 ? " " : scramble(TO, (p - 0.12) / 0.88, t, 9, 2), b.x + 34, b.y, 28);
          }
          if (t >= T_LAB1) label(scramble(LAB, (t - T_LAB1) / 0.5, t, 3, 3), 120, 720, 30);
          if (t >= T_LAB2) label(scramble(LAB, (t - T_LAB2) / 0.5, t, 4, 3), 990, 640, 30);
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) document.fonts.ready.then(() => draw(P.t));
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
