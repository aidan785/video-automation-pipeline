<!doctype html>
<!--
  SANJI · tier1 · compare · SYSTEM DIFF
  A terminal diff as a before/after (references/system s01-s03 terminal type,
  s12/s24 inverse chip). "$ git diff workflow" scrambles in, a dim hunk header,
  then the "- old way" lines list in. One by one each old line is struck
  through (a hairline draws left to right) and falls back to dim. The
  "+ new way" lines type in below, letter by letter with a scramble edge, and
  their keywords flicker into inverse chips. On the right a huge ASCII minus
  (hatched luminance paint) grows its vertical bar into a plus as the new
  lines arrive. No red/green: dim vs bright + the chip only.
  Slots: header (text, <= 30 chars), old (list split on "|", 2-4 lines,
  <= 30 chars each), new (list split on "|", 2-4 lines, <= 30 chars each,
  wrap 1 keyword per line in *asterisks* for the chip), summary (text, <= 34).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t1-system-diff {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--sys-blue); font-family: var(--font-term); color: var(--sys-ink);
      }
      #sanji-t1-system-diff canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; filter: drop-shadow(0 0 4px rgba(225,232,255,0.45)); }
      #sanji-t1-system-diff .scan { position: absolute; inset: 0; background: var(--sys-scan); }
      #sanji-t1-system-diff .term { position: absolute; left: 236px; top: 0; }
      #sanji-t1-system-diff .ln {
        position: relative; height: 56px; white-space: pre; font-weight: 600; font-size: calc(var(--term-size) * 1.2);
        letter-spacing: var(--term-track); line-height: 56px; text-shadow: var(--sys-bloom); width: max-content;
      }
      #sanji-t1-system-diff .ln .strike { position: absolute; left: 40px; right: -6px; top: 29px; height: 3px; background: var(--sys-ink); transform-origin: 0 50%; box-shadow: 0 0 6px rgba(225,232,255,0.55); }
      #sanji-t1-system-diff .gut { position: absolute; left: -96px; top: 0; opacity: 0.32; }
      #sanji-t1-system-diff .inv { background: var(--sys-chip-bg); color: var(--sys-chip-ink); text-shadow: none; padding: 2px 3px; box-shadow: 0 0 10px rgba(225,232,255,0.45); }
      #sanji-t1-system-diff .src { display: none; }
    </style>
  </head>

      <div class="term"></div>
      <div class="scan"></div>
      <div class="src">
        <span data-slot="header">$ git diff workflow</span>
        <span data-slot="old">Scrub the timeline by hand|Cut every pause yourself|Export, check, repeat</span>
        <span data-slot="new">Let the *agent* find the cuts|Silences gone *automatically*|Review once, then *ship*</span>
        <span data-slot="summary">1 workflow changed, 3 hours saved</span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

        const ID = "sanji-t1-system-diff";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s);
        const { c01, hash, scramble, frame } = SYS;
        const slot = (n) => $(`[data-slot="${n}"]`).textContent.trim();
        const listOf = (n) => slot(n).split("|").map((s) => s.trim()).filter(Boolean).slice(0, 4);

        const T_SUM = T_NEW_END + 0.25;
        const END = Math.ceil((T_SUM + 1.5) * 2) / 2;

        const term = $(".term");
        const nLines = 2 + NO + NN + 2;
        term.style.top = Math.round((1080 - nLines * 56) / 2) + "px";

    </script>
