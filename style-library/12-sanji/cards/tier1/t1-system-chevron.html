  references/system s18 (f366-399). The "send / next" motif. Scattered glyph
  particles gather into a small dotted triangle around a tiny inverse chip;
  on the beat it snaps (stepped, 3 frames) into a big chevron arrow built from
  ">" columns and "\->" "/>>" ">>" glyph rows with a smaller inner chevron,
  and inverse chips pop at its three vertices. It collapses back to the small
  triangle, slides right with ghost echoes, and grows again: the next step.
  Slots: label (center chip, <= 8 chars), tags (comma list, exactly 3,
  <= 6 chars each, the vertex chips).
