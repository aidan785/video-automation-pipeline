<!doctype html>
<!--
  SANJI · tier1 · section · MASK REVEAL CAPS
  NATURE. A landscape photo, darkened and slowly drifting. A giant two-line
  Inter Tight 800 caps title is revealed by horizontal mask bands: each line
  lives in its own clipped band, rises from below its baseline with blur and
  sharpens as it lands, line two a beat behind line one, while the bands open
  outward from the center. Then a thin white hairline draws out from the
  center under the title and a sentence-case sub resolves word by word.
  Slots: title (richtext <= 22, <br> splits the two lines, <= 11 per line),
  sub (text <= 48), photo (filename stem in assets/nature, default hills-sunset).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t1-mask-reveal-caps {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--void); color: var(--white);
      }
      #sanji-t1-mask-reveal-caps .slot-photo { display: none; }
      #sanji-t1-mask-reveal-caps .bg { position: absolute; inset: 0; }
      #sanji-t1-mask-reveal-caps .bg img { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; display: block; filter: brightness(0.7) saturate(0.95); }
      #sanji-t1-mask-reveal-caps .shade {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse 70% 60% at 50% 50%, rgba(0,0,0,0.38) 0%, rgba(0,0,0,0.12) 70%, rgba(0,0,0,0) 100%),
          radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.45) 100%);
      }
      #sanji-t1-mask-reveal-caps .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #sanji-t1-mask-reveal-caps .title { display: flex; flex-direction: column; align-items: center; }
      #sanji-t1-mask-reveal-caps .band { overflow: hidden; padding: 0 30px; margin: -6px 0; }
      #sanji-t1-mask-reveal-caps .ln {
        display: block; white-space: nowrap;
        font-family: var(--font-display); font-weight: var(--wt-heavy); text-transform: uppercase;
        font-size: 180px; line-height: 0.9; letter-spacing: var(--track-caps); padding: 14px 0 10px;
        text-shadow: 0 6px 40px rgba(0,0,0,0.25);
      }
      #sanji-t1-mask-reveal-caps .rule { width: 520px; height: 2px; margin-top: 46px; background: rgba(255,255,255,0.7); border-radius: 1px; }
      #sanji-t1-mask-reveal-caps .sub {
        margin-top: 34px; white-space: nowrap;
        font-family: var(--font-body); font-weight: var(--wt-ui); font-size: 40px; letter-spacing: var(--track-ui);
        color: var(--white); text-shadow: 0 2px 18px rgba(0,0,0,0.35);
      }
      #sanji-t1-mask-reveal-caps .sub .w { display: inline-block; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="sanji-t1-mask-reveal-caps" data-composition-id="sanji-t1-mask-reveal-caps" data-start="0" data-width="1920" data-height="1080">
      <span class="slot-photo" data-slot="photo">hills-sunset</span>
      <div class="bg"><img class="photo" alt="" /></div>
      <div class="shade"></div>
      <div class="stage">
        <div class="title" data-slot="title">Shot on<br>location</div>
        <div class="rule"></div>
        <div class="sub" data-slot="sub">Real places, real light, no green screen</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-t1-mask-reveal-caps";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s);
        const css = getComputedStyle(document.documentElement);
        const WHITE = css.getPropertyValue("--white").trim(), PRE = css.getPropertyValue("--white-pre").trim();

        const stem = ($(".slot-photo").textContent || "hills-sunset").trim();
        $(".photo").src = "../../assets/nature/" + stem + ".jpg";

        /* title: one clipped band per line */
        const title = $(".title");
        const lines = (title.innerHTML || "").split(/<br\s*\/?>/i).map((s) => s.replace(/<[^>]+>/g, "").trim()).filter(Boolean);
        title.textContent = "";
        const bands = [], lns = [];
        lines.forEach((txt) => {
          const b = document.createElement("div"); b.className = "band";
          const l = document.createElement("span"); l.className = "ln"; l.textContent = txt;
          b.appendChild(l); title.appendChild(b); bands.push(b); lns.push(l);
        });
        const sub = $(".sub");
        const sw = (sub.textContent || "").split(/\s+/).filter(Boolean);
        sub.textContent = "";
        const subW = sw.map((w, i) => { const s = document.createElement("span"); s.className = "w"; s.textContent = w + (i < sw.length - 1 ? " " : ""); sub.appendChild(s); return s; });

        const tl = gsap.timeline({ paused: true });
        const END = 5.6;

        /* photo: fade up out of black + slow drift */
        tl.fromTo($(".bg"), { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1.12, duration: 0.5, ease: "power2.out" }, 0)
          .to($(".bg"), { scale: 1.04, x: -30, duration: END, ease: "sine.inOut" }, 0);

        /* mask bands open from the center while each line rises from below its baseline */
        tl.set(subW, { autoAlpha: 0 }, 0).set($(".rule"), { scaleX: 0 }, 0);
        bands.forEach((b, i) => {
          const t = 0.35 + i * 0.16;
          tl.fromTo(b, { clipPath: "inset(0% 50% 0% 50%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power3.inOut" }, t)
            .fromTo(lns[i], { yPercent: 105, filter: "blur(14px)", color: PRE },
                            { yPercent: 0, filter: "blur(0px)", color: WHITE, duration: 0.85, ease: "expo.out" }, t + 0.05);
        });

        /* hairline from the center, then the sub resolves word by word */
        const R = 0.35 + bands.length * 0.16 + 0.55;
        tl.to($(".rule"), { scaleX: 1, duration: 0.55, ease: "power3.inOut" }, R);
        tl.set(subW, { autoAlpha: 1 }, 0);
        TXT.reveal(tl, subW, R + 0.3);                     /* house preset pour-in */

        /* quiet exit: everything softens and dims a touch */
        tl.to([$(".title"), $(".rule"), sub], { opacity: 0.85, filter: "blur(1.5px)", duration: 0.35, ease: "power2.in" }, END - 0.4)
          .set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
