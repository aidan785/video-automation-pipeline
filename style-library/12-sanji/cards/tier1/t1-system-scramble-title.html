              if (q.em && on) {
                /* chip cells let go as inverse ASCII: bright block with the letter cut out */
                g.fillStyle = `rgba(255,255,255,${a})`; g.fillRect(x - SIZE * 0.04, y - SIZE * 0.08, ADV + 2, SIZE * 1.16);
                g.fillStyle = "#000"; g.fillText(q.c, x, y);
              } else { g.fillStyle = `rgba(255,255,255,${a})`; g.fillText(q.c, x, y); }
            }
          });
          /* erosion: fbm front eats the rendition from the light end of the ramp */
          const ep = c01((t - T_EXIT) / (EXIT_SPREAD + DECAY));
          S.fn((c, r) => S.lumAt(c, r) * c01((fbm(c * 0.09, r * 0.12 - t * 0.6, 5, 3) - ep * 0.75 + 0.12) * 4), "set");
          S.render(t, { flicker: 0.3, floor: 0.08, alphaMin: 0.5 });
        }

        function draw(t) { drawAmb(t); drawAsh(t); drawType(t); }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) {
          Promise.all([document.fonts.load(`600 ${SIZE}px "IBM Plex Mono"`), document.fonts.load('600 30px "IBM Plex Mono"')]).then(() => draw(P.t), () => {});
          document.fonts.ready.then(() => draw(P.t));
        }
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
