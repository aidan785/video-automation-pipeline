  SANJI · tier1 · process · SYSTEM CHAT TERMINAL
  An AI chat in terminal form (references/system s01-s03 type, s12 chip).
  Four frames of dead blue, a "/*" session header resolves and a rule draws
  across. ">> user:" types the prompt with a block cursor, then the agent row
  shows an ASCII spinner "[|] thinking..." for ~0.6s, then the reply streams
  in token chunks with a scramble edge riding the stream. The key phrase
  flickers into an inverse chip once it lands. Status line, fresh prompt
  with a blinking cursor, hold. Faint flickering glyph field behind.
  Slots: header (<= 40), prompt (<= 52), reply (<= 150, wraps to 3 lines of
  54), key (exact phrase inside reply, <= 24), status (<= 48).

            if (t < T_REPLY) {
              const fr = frame(t - T_THINK);
              T.str(cx(IND), Y_AGENT, "[" + "|/-\\"[Math.floor(fr / 2) % 4] + "] thinking" + ".".repeat(1 + (Math.floor(fr / 3) % 3)), { alpha: 0.88 });
              T.str(OKX, Y_AGENT, "[ RUN ]", { alpha: 0.7 });
            } else {
              const k = kAt(t);
              const fk = frame(t - T_KEY), chipOn = t >= T_KEY && (fk >= 8 || fk % 4 < 2);
              LINES.forEach((L, li) => {
                const vis = Math.max(0, Math.min(L.s.length, k - L.i0)), y = Y_AGENT + li * PITCH;
                let i = 0;
                while (i < vis) {
                  const g = L.i0 + i, inK = chipOn && g >= KI && g < KE;
                  let j = i; while (j < vis && (chipOn && L.i0 + j >= KI && L.i0 + j < KE) === inK) j++;
                  T.str(cx(IND + i), y, L.s.slice(i, j), { inv: inK });
                  i = j;
                }
              });
              /* scramble edge: 3 noise glyphs ride ahead of the stream */
              if (k < REPLY.length) {
                const fr = frame(t);
                for (let g = k + 1; g < Math.min(REPLY.length, k + 4); g++) {
                  if (REPLY[g] === " ") continue;
                  const p = lineOf(g); if (!p) continue;
                  T.str(cx(IND + p[1]), Y_AGENT + p[0] * PITCH, NOISE[Math.floor(hash(g, fr, 17) * NOISE.length)], { alpha: 0.9 });
                }
              }
              T.str(OKX, Y_AGENT, t < REPLY_END + f(4) ? "[ RUN ]" : "[ OK ]", { alpha: 0.7 });
            }
          }

          /* status + fresh prompt with blinking cursor */
          if (t >= T_STATUS) {
            T.str(cx(0), Y_STATUS, "[ OK ] ", { alpha: 0.75 });
            T.str(cx(7), Y_STATUS, scramble(STATUS, (t - T_STATUS) / f(4), t, 9), { alpha: 0.75 });
          }
          if (t >= T_NEXT) {
            T.str(cx(0), Y_NEXT, ">> user: ");
            if (Math.floor((t - T_NEXT) / 0.5) % 2 === 0) T.str(cx(9), Y_NEXT, " ", { inv: true });
          }
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) document.fonts.ready.then(() => draw(P.t));
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
