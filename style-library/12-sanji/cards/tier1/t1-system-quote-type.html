<!doctype html>
<!--
  SANJI · tier1 · takeaway · SYSTEM QUOTE TYPE
  references/system s01, s24-s25. A "/* quote" comment opens on empty blue,
  then a 2-3 line quote types character by character at ~44px terminal mono
  behind a solid block cursor (seeded rhythm, short pauses on punctuation).
  When it finishes, the key phrase grows an inverse chip left to right (one
  lone white cell first, then cell by cell like the chip scramble), the
  attribution types as a "// name" comment line, and the cursor blinks on the
  beat. Little ASCII doodles step around the empty space. Exit: 2 frames of
  glyph noise over the text rows, then clean blue.
  Slots: quote (text, <= 140 chars, wraps to <= 3 lines automatically),
  key (text, an exact substring of the quote to chip, <= 30), name (text, <= 36).
-->

        background: var(--sys-blue); font-family: var(--font-term);

        <span data-slot="name">a very tired video editor</span>
      </div>
    </div>
