              ang = e < 0.5 ? -180 * e : 180 * (1 - e);
              glyph = e < 0.5 ? o.seq[j] : o.seq[j + 1];
              sheen = Math.sin((Math.abs(ang) * Math.PI) / 180) * 0.55;
              flipNo = j + (e >= 0.5 ? 1 : 0);
              if (isLast && e >= 0.5) { inv = o.key; }
            } else glyph = " ";
            const isLanded = o.live && t >= o.land && t < o.ex;
            if (o.live) { live++; rowLanded[o.r][1]++; if (isLanded) { landed++; rowLanded[o.r][0]++; } }
            /* key chips flicker every 2 frames once the board is set, then hold */
            if (o.key && isLanded && t >= T_FLICK && t < T_FLICK + 12 / 24) inv = Math.floor((t - T_FLICK) * 12) % 2 === 1;
            set(o, "tf", o.flap.style, "transform", `scale(${popS}) rotateX(${ang.toFixed(2)}deg)`);
            set(o, "sh", o.sh.style, "opacity", sheen.toFixed(3));
            const dimDot = glyph === " ";
            set(o, "gt", o.g, "textContent", dimDot ? "·" : glyph);
            set(o, "gc", o.g, "className", dimDot ? "g dim" : "g");
            set(o, "fc", o.flap, "className", inv ? "flap inv" : "flap");

            /* index label (01..N) above row cells + flip counter */
            const ip = c01((t - (o.st - 0.3)) / (3 / 24));
            const id = String(o.k + 1).padStart(2, "0");
            setS(o.idx, t < o.st - 0.3 ? "" : unscr(scramble(id, ip, t, 40 + o.k, 2), clr, t, 50 + o.k));
            let cs = "";
            if (o.live && t >= o.st) cs = isLanded || t >= o.land ? "OK" : `${flipNo}/${o.n}`;
            else if (!o.live && t >= o.st) cs = "--";
            setS(o.cnt, unscr(cs, clr, t, 60 + o.k));
          }

          /* corners + rows */
          const pc = c01((t - T_CMT) / (5 / 24));
          setS(cTL, t < T_CMT ? "" : unscr(scramble(COMMENT, pc, t, 3, 3), clr, t, 4));
          setS(cTR, t < T_CMT + 0.12 ? "" : unscr(scramble(`board ${String(NR).padStart(2, "0")}x${String(N).padStart(2, "0")} . cell ${CS}px`, c01((t - T_CMT - 0.12) / (5 / 24)), t, 6, 3), clr, t, 7));
          const pb = c01((t - T0 + 0.2) / (4 / 24));
          const pct = Math.round((landed / Math.max(1, live)) * 100);
          setS(cBL, t < T0 - 0.2 ? "" : unscr(scramble(`>> ${String(pct).padStart(3, " ")}% landed . ${landed}/${live} cells`, pb, t, 8, 2), clr, t, 9));
          setS(cBR, t < T0 - 0.2 ? "" : unscr(scramble(`/* frame ${String(f).padStart(3, "0")} */`, pb, t, 10, 2), clr, t, 11));
          rowL.forEach((e, r) => {
            const p = c01((t - T_FRAMES - r * 0.06) / (3 / 24));
            setS(e, t < T_FRAMES + r * 0.06 ? "" : unscr(scramble(`R${r + 1} >`, p, t, 20 + r, 2), clr, t, 22 + r));
          });
          rowR.forEach((e, r) => {
            const [a, b] = rowLanded[r];
            const st = T0 + r * 0.22;
            setS(e, t < st ? "" : unscr(a >= b ? "[ OK ]" : `${String(Math.round((a / Math.max(1, b)) * 100)).padStart(2, "0")}%`, clr, t, 24 + r));
            e.className = a >= b && t >= st ? "mi inv" : "mi";
          });
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) document.fonts.ready.then(() => draw(P.t));
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
