<!doctype html>
<!--
  SANJI · tier1 · thesis · EMBER CHATBOX
  The dark chatbot moment. Black canvas soaked in orange corner light. We open
  CLOSE on the top-left of a rounded chat box while the prompt types: each
  character arrives ember-tinted and dim, then cools to warm white, with a
  caret riding the end. When the prompt lands the camera pulls back to the full
  box, the toolbar resolves in (+ / model pill / mic / waveform / send), an
  orange comet streak slides in over the top edge and a light pool blooms
  bottom-left. Ends on a send-button press: dip, white-hot flash, glow ring.
  Slots: prompt (text, <= 40 chars), model (text, <= 12 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t1-ember-chatbox {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--void); font-family: var(--font-body);
      }
      #sanji-t1-ember-chatbox .warm { position: absolute; inset: 0; background: var(--ember-corners); }
      #sanji-t1-ember-chatbox .pool {
        position: absolute; left: -260px; bottom: -380px; width: 980px; height: 980px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,170,70,0.95) 0%, rgba(230,131,42,0.65) 26%, rgba(103,39,13,0.35) 52%, rgba(3,1,0,0) 70%);
        filter: blur(30px); opacity: 0;
      }
      #sanji-t1-ember-chatbox .comet {
        position: absolute; left: 880px; top: -60px; width: 780px; height: 64px;
        transform-origin: 0% 50%; transform: rotate(33deg);
        background: linear-gradient(90deg, rgba(255,122,26,0) 0%, rgba(255,140,40,0.35) 30%, rgba(255,190,90,0.95) 78%, rgba(255,230,170,1) 92%, rgba(255,200,120,0) 100%);
        border-radius: 50%; filter: blur(9px); opacity: 0;
      }
      #sanji-t1-ember-chatbox .comet::after {
        content: ""; position: absolute; inset: -60px -40px; border-radius: 50%;
        background: radial-gradient(60% 50% at 80% 50%, rgba(255,140,40,0.45), rgba(255,122,26,0) 70%);
        filter: blur(20px);
      }
      #sanji-t1-ember-chatbox .vig { position: absolute; inset: 0; background: var(--vignette-dark); opacity: 0.5; }

      #sanji-t1-ember-chatbox .cam { position: absolute; inset: 0; transform-origin: 300px 420px; }
      #sanji-t1-ember-chatbox .box {
        position: absolute; left: 140px; top: 372px; width: 1640px; height: 340px; box-sizing: border-box;
        border-radius: var(--r-chat); background: var(--chat-fill);
        border: var(--rim) solid var(--chat-rim); box-shadow: var(--chat-shadow);
      }
      #sanji-t1-ember-chatbox .prompt {
        position: absolute; left: 56px; top: 46px; right: 56px;
        font-weight: 500; font-size: 44px; letter-spacing: var(--track-ui); color: #EFE7E1; white-space: pre;
      }
      #sanji-t1-ember-chatbox .prompt .c { display: none; }
      #sanji-t1-ember-chatbox .caret {
        display: inline-block; width: 3px; height: 46px; margin-left: 3px; vertical-align: -8px;
        background: rgba(255,240,228,0.9); border-radius: 2px;
      }
      #sanji-t1-ember-chatbox .plus { position: absolute; left: 50px; bottom: 44px; width: 40px; height: 40px; }
      #sanji-t1-ember-chatbox .tools {
        position: absolute; right: 40px; bottom: 34px; display: flex; align-items: center; gap: 30px;
        color: #E9E2DC; font-size: 34px; font-weight: 500; letter-spacing: var(--track-ui);
      }
      #sanji-t1-ember-chatbox .tools svg { display: block; }
      #sanji-t1-ember-chatbox .model { display: flex; align-items: center; gap: 12px; }
      #sanji-t1-ember-chatbox .send {
        width: 76px; height: 76px; border-radius: 20px; background: var(--ember);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 0 0 rgba(255,179,71,0), 0 8px 30px rgba(255,122,26,0.35);
      }
      #sanji-t1-ember-chatbox .grain { position: absolute; inset: 0; background: var(--grain); opacity: 0.6; mix-blend-mode: overlay; }
    </style>
  </head>
  <body>
    <div id="sanji-t1-ember-chatbox" data-composition-id="sanji-t1-ember-chatbox" data-start="0" data-width="1920" data-height="1080">
      <div class="warm"></div>
      <div class="pool"></div>
      <div class="comet"></div>
      <div class="vig"></div>
      <div class="cam">
        <div class="box">
          <div class="prompt"><span class="txt" data-slot="prompt">Make SaaS launch video</span><span class="caret"></span></div>
          <svg class="plus" viewBox="0 0 24 24" fill="none" stroke="#F2ECE6" stroke-width="2" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
          <div class="tools">
            <div class="model t"><span data-slot="model">Opus 5.5</span>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E9E2DC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
            <svg class="t" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#E9E2DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
            <svg class="t" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#E9E2DC" stroke-width="2.2" stroke-linecap="round"><path d="M3 10v4M7.5 6v12M12 3v18M16.5 7v10M21 10v4"/></svg>
            <div class="send t"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></div>
          </div>
        </div>
      </div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-t1-ember-chatbox";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => ROOT.querySelectorAll(s);

        /* split prompt into chars (display:none until typed so the caret rides the end) */
        const txt = $(".txt");
        const str = txt.textContent; txt.textContent = "";
        const chars = [...str].map((ch) => { const c = document.createElement("span"); c.className = "c"; c.textContent = ch; txt.appendChild(c); return c; });

        const tl = gsap.timeline({ paused: true });
        const CPS = 0.065;                         /* seconds per typed char */
        const T0 = 0.45;                           /* typing starts */
        const TEND = T0 + chars.length * CPS;      /* last char lands */
        const PULL = TEND + 0.35;                  /* camera pull-back */

        /* opening state: close on the prompt, warm light everywhere */
        tl.set($(".cam"), { scale: 2.05, x: 110, y: 40 }, 0)
          .fromTo($(".cam"), { autoAlpha: 0, filter: "blur(14px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 0)
          .set($$(".tools .t"), { autoAlpha: 0 }, 0)
          .fromTo($(".warm"), { opacity: 0.55 }, { opacity: 1, duration: TEND, ease: "sine.inOut" }, 0);

        /* caret blink while idle, then while typing it stays solid */
        tl.to($(".caret"), { opacity: 0, duration: 0.01, repeat: 3, yoyo: true, repeatDelay: 0.11 }, 0.0);

        /* typing: each char appears dim + ember, cools to warm white */
        chars.forEach((c, i) => {
          const t = T0 + i * CPS;
          tl.set(c, { display: "inline" }, t)
            .fromTo(c, { opacity: 0.25, color: "#FF9A4A", filter: "blur(4px)" },
                       { opacity: 1, color: "#EFE7E1", filter: "blur(0px)", duration: 0.28, ease: "power2.out" }, t);
        });

        /* pull back to the full box: quick glide with a breath of motion blur */
        tl.to($(".cam"), { scale: 1, x: 0, y: 0, duration: 0.55, ease: "power3.inOut" }, PULL)
          .to($(".cam"), { filter: "blur(3px)", duration: 0.2, ease: "power1.in", yoyo: true, repeat: 1 }, PULL + 0.08)
          .to($(".warm"), { opacity: 0.22, duration: 0.7, ease: "power2.inOut" }, PULL)
          .to($(".caret"), { opacity: 0, duration: 0.2 }, PULL + 0.1)
          .fromTo($(".pool"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.1, ease: "expo.out" }, PULL + 0.25)
          .fromTo($(".comet"), { opacity: 0, x: -260, y: -150 }, { opacity: 1, x: 0, y: 0, duration: 0.9, ease: "expo.out" }, PULL + 0.3);
        TXT.block(tl, $$(".tools .t"), PULL + 0.4, { stagger: 0.06 });   /* toolbar chips/buttons rise as blocks; the prompt keeps its letter typing */

        /* send press: dip, white-hot flash + glow ring, settle */
        const SEND = PULL + 1.6;
        tl.to($(".send"), { scale: 0.88, duration: 0.09, ease: "power2.in" }, SEND)
          .to($(".send"), { scale: 1, duration: 0.3, ease: "back.out(2)" }, SEND + 0.09)
          .to($(".send"), { backgroundColor: "#FFC266", boxShadow: "0 0 0 10px rgba(255,179,71,0.25), 0 0 46px rgba(255,170,60,0.85)", duration: 0.12, ease: "power2.out" }, SEND + 0.06)
          .to($(".send"), { backgroundColor: "#FF7A1A", boxShadow: "0 0 0 22px rgba(255,179,71,0), 0 8px 30px rgba(255,122,26,0.35)", duration: 0.55, ease: "power2.out" }, SEND + 0.2)

          /* comet breathes during the hold */
          .to($(".comet"), { opacity: 0.8, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, SEND + 0.3)
          .set({}, {}, SEND + 2.2);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
