<!doctype html>
<!--
  SANJI · tier1 · thesis · GLOW TYPE
  "selling motion design". True black; the blue dot-halftone grid shows only at
  the frame edges under a dark vignette and breathes down as the line builds.
  A plain white lead word resolves out of blur, then the emphasis phrase TYPES
  letter by letter in --volt blue with a strong layered glow, each letter
  blurring in. The line re-centers as it grows (paper-resolve approach). Once
  the phrase is complete the glow cools left to right over ~0.5s, so the final
  line is all white with a faint residual blue halo.
  Slots: lead (text, <= 9 chars), glow (text, <= 14 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t1-glow-type {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--void); font-family: var(--font-body);
      }
      #sanji-t1-glow-type .grid {
        position: absolute; inset: 0; background: var(--dot-grid-blue);
        -webkit-mask-image: radial-gradient(ellipse 60% 62% at 50% 50%, rgba(0,0,0,0) 58%, rgba(0,0,0,1) 100%);
                mask-image: radial-gradient(ellipse 60% 62% at 50% 50%, rgba(0,0,0,0) 58%, rgba(0,0,0,1) 100%);
      }
      #sanji-t1-glow-type .vig { position: absolute; inset: 0; background: var(--vignette-dark); opacity: 0.4; }
      #sanji-t1-glow-type .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #sanji-t1-glow-type .line {
        position: relative; white-space: nowrap; color: var(--white);
        font-family: var(--font-body); font-weight: var(--wt-ui);
        font-size: 132px; letter-spacing: var(--track-ui); line-height: 1.15;
      }
      #sanji-t1-glow-type .line .w { display: inline-block; white-space: pre; }
      #sanji-t1-glow-type .line .gw { display: inline-block; position: relative; white-space: pre; }
      #sanji-t1-glow-type .line .gw .bloom {
        position: absolute; left: -12%; right: -12%; top: -45%; bottom: -45%; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(var(--volt-rgb),0.34), rgba(var(--volt-rgb),0.1) 60%, rgba(var(--volt-rgb),0) 100%);
        filter: blur(20px); opacity: 0; pointer-events: none;
      }
      #sanji-t1-glow-type .line .c { display: inline-block; white-space: pre; position: relative; }
      #sanji-t1-glow-type .grain { position: absolute; inset: 0; background: var(--grain); opacity: 0.6; mix-blend-mode: overlay; }
    </style>
  </head>
  <body>
    <div id="sanji-t1-glow-type" data-composition-id="sanji-t1-glow-type" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="vig"></div>
      <div class="stage">
        <div class="line"><span class="w lead" data-slot="lead">selling</span><span class="w sp"> </span><span class="gw" data-slot="glow">motion design</span></div>
      </div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-t1-glow-type";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => [...ROOT.querySelectorAll(s)];
        const css = getComputedStyle(document.documentElement);
        const tok = (n) => css.getPropertyValue(n).trim();
        const WHITE = tok("--white"), PRE = tok("--white-pre"), VOLT = tok("--volt"), VR = tok("--volt-rgb");

        const HOT = `0 0 6px rgba(${VR},0.95), 0 0 22px rgba(${VR},0.8), 0 0 54px rgba(${VR},0.6)`;
        const COOL = `0 0 6px rgba(${VR},0.22), 0 0 22px rgba(${VR},0.12), 0 0 54px rgba(${VR},0.06)`;

        /* split the glow phrase into chars, plus a bloom layer behind it */
        const line = $(".line"), lead = $(".lead"), gw = $(".gw");
        const str = gw.textContent; gw.textContent = "";
        const bloom = document.createElement("span"); bloom.className = "bloom"; gw.appendChild(bloom);
        const chars = [...str].map((ch) => { const c = document.createElement("span"); c.className = "c"; c.textContent = ch; gw.appendChild(c); return c; });

        /* re-center: shift so the visible run [lead .. el] sits centered (lazy, after fonts) */
        const shiftFor = (el) => () => {
          const full = line.offsetWidth;
          const right = el === lead ? lead.offsetLeft + lead.offsetWidth : gw.offsetLeft + el.offsetLeft + el.offsetWidth;
          return (full - right) / 2;
        };

        const tl = gsap.timeline({ paused: true });
        const T_LEAD = 0.18, T_TYPE = 0.78, CPS = 0.065;
        const T_DONE = T_TYPE + chars.length * CPS;
        const T_COOL = T_DONE + 0.3;
        const T_OUT = T_COOL + 1.7;
        const END = T_OUT + 0.45;

        tl.set(chars, { autoAlpha: 0 }, 0).set(line, { x: shiftFor(lead) }, 0);

        /* edge grid: visible at the open, breathes down as the type takes over */
        tl.fromTo($(".grid"), { opacity: 1 }, { opacity: 0.28, duration: 1.3, ease: "sine.inOut" }, 0.15)
          .to($(".grid"), { opacity: 0.45, duration: 1.4, ease: "sine.inOut" }, T_COOL);

        /* lead word resolves */
        TXT.reveal(tl, lead, T_LEAD);   /* lead words pour in; the glow phrase keeps its hot letter typing */

        /* emphasis phrase types in hot blue; the line re-centers per char */
        chars.forEach((c, i) => {
          const t = T_TYPE + i * CPS;
          tl.to(line, { x: shiftFor(c), duration: 0.34, ease: "power3.out" }, t)
            .fromTo(c, { autoAlpha: 0, filter: "blur(8px)", color: VOLT, textShadow: HOT, y: 4 },
              { autoAlpha: 1, filter: "blur(0px)", color: VOLT, textShadow: HOT, y: 0, duration: 0.22, ease: "power2.out" }, t);
        });
        tl.fromTo(bloom, { opacity: 0, scaleX: 0.3, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: chars.length * CPS + 0.2, ease: "power2.out" }, T_TYPE);

        /* glow cools left to right to white, residual faint halo */
        tl.to(chars, { color: WHITE, textShadow: COOL, duration: 0.42, ease: "power2.inOut", stagger: { amount: 0.32 } }, T_COOL)
          .to(bloom, { opacity: 0.22, duration: 0.7, ease: "power2.inOut" }, T_COOL + 0.1);

        /* exit: softens back */
        TXT.exit(tl, lead, T_OUT);
        tl.to(chars, { autoAlpha: 0, filter: "blur(8px)", duration: 0.3, ease: "power2.in", stagger: 0.012 }, T_OUT + 0.03)
          .to(bloom, { opacity: 0, duration: 0.3, ease: "power2.in" }, T_OUT)
          .set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
