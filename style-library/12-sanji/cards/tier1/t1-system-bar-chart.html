<!doctype html>
<!--
  SANJI · tier1 · stat · SYSTEM BAR CHART
  A bar chart where every bar is a column of luminance-mapped ramp glyphs
  (references/system s08/s13 glyph objects, s12 chip). Bars are painted as
  rects with a vertical gradient (bright top edge, mid body) so the top
  reads as dense "$#%" and the body as "+*>~". A "/*" comment and the title
  resolve, a baseline of "_" glyphs types across, then bars grow upward on a
  stagger with their labels scrambling in underneath and their values
  counting up inside inverse chips riding the bar tops. Dim axis ticks on the
  left, faint glyph field, the tallest bar's chip flickers once it lands.
  Slots: comment (<= 30), title (<= 40), items (comma list "label:value",
  3-6 items, label <= 10 chars, numeric value), unit (<= 3, appended).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t1-system-bar-chart {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--sys-blue); font-family: var(--font-term);
      }
      #sanji-t1-system-bar-chart canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #sanji-t1-system-bar-chart .field { filter: drop-shadow(0 0 4px rgba(225,232,255,0.45)); }
      #sanji-t1-system-bar-chart .term { filter: drop-shadow(0 0 5px rgba(225,232,255,0.5)); }
      #sanji-t1-system-bar-chart .scan { position: absolute; inset: 0; background: var(--sys-scan); }
      #sanji-t1-system-bar-chart .src { display: none; }
    </style>
  </head>
  <body>
    <div id="sanji-t1-system-bar-chart" data-composition-id="sanji-t1-system-bar-chart" data-start="0" data-width="1920" data-height="1080">
      <canvas class="field"></canvas>
      <canvas class="term"></canvas>
      <div class="scan"></div>
      <div class="src">
        <span data-slot="comment">/* benchmark : 30 days */</span>
        <span data-slot="title">Videos shipped per week</span>
        <span data-slot="items">Manual:3,Presets:6,Scripts:11,Agents:24</span>
        <span data-slot="unit"></span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

        const ID = "sanji-t1-system-bar-chart";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s);

/* SANJI · SYSTEM canvas · ASCII engine (single source of truth).

   Model (measured from the BUCK blue-screen spots): every image is a

     const F = SYS.field(canvasEl, { cw: 15, ch: 22 });
     F.paint((g) => { ...draw grayscale in 1920x1080 coords... });  // white = dense glyph

      /* text placed by pixel position (snapped to the grid) */
      textAt(x, y, str, o = {}) { F.text(Math.round(x / cw), Math.round(y / ch), str, o); },
      lumAt(c, r) { return c < 0 || r < 0 || c >= cols || r >= rows ? 0 : lum[r * cols + c]; },
      render(t, o = {}) {
        const flick = o.flicker == null ? 0.18 : o.flicker;   /* prob a cell hops one ramp level per frame */
        const gain = o.gain == null ? 1 : o.gain, floor = o.floor == null ? 0.06 : o.floor;
        const aMin = o.alphaMin == null ? 0.38 : o.alphaMin, aMax = o.alphaMax == null ? 1 : o.alphaMax;

  /* spinning coin: angle in radians around the vertical axis. Generic face

        /* ---- card-local term grid: glyphs on a fixed advance/pitch. Box-drawing
           characters are stroked through the cell center (like a real terminal
           renders them), so frames join seamlessly whatever font is loaded. ---- */
        const BLUE = getComputedStyle(ROOT).getPropertyValue("--sys-blue").trim() || "#0F18FB";
        const INK = "243,245,255";

              for (let i = 0; i < s.length; i++) {

        tl.set({}, {}, END);

        if (document.fonts) document.fonts.ready.then(() => draw(P.t));
        window.__timelines[ID] = tl;
      })();
    </script>
