  SANJI · tier1 · hook · SYSTEM ERROR DIALOG
  A classic system dialog drawn entirely with box-drawing characters
  (references/system s01-s03 type, s12 chip). Dead blue for 4 frames, then
  the frame draws itself around the perimeter from the top-left corner in
  both directions (noise glyphs ride the two fronts), the title bar fills in
  inverse like a growing chip, the message and detail type, two buttons
  scramble in. An ASCII arrow cursor glides to [ Update ], hovers, clicks
  (button inverts for 2 frames), 2 frames of glyph noise, then the log floods
  the screen 2 lines a frame, swallowing the dialog row by row, and lands on
  a final "KEY > VALUE" line with the value in a flickering chip.
  Slots: title (<= 30), message (<= 36), detail (<= 36), ignore (<= 8),
  update (<= 8), log (multiline, <= 60 chars a line, 3-8 lines; seeded
  filler follows), done-key (<= 14), done-value (<= 12).

        }

        function draw(t) {
          /* faint field + the 2-frame noise flash */
          /* the flood swallows the dialog row by row */
          const vis = t >= T_FLOOD ? lines.filter((L) => L.at <= t + 1e-6) : [];
          const floodBottom = vis.length ? LY + Math.min(vis.length, LROWS) * PITCH : -1;
          const rowAlive = (r) => t < T_NOISE || (t >= T_FLOOD && dy(r) >= floodBottom);
          const dlgOn = t >= T_BOX && (t < T_NOISE || t >= T_FLOOD);
          F.clearText();
          /* field stays out of the dialog (its ground reads as empty blue) */
          F.fn((c, r, x, y) => {
            if (dlgOn && x > DX - 4 && x < DX + DC * ADV + 4 && y > DY && y < DY + DR * PITCH && rowAlive(Math.floor((y - DY) / PITCH))) return 0;
            return hash(c, r, 9) < 0.05 ? 0.14 * c01((t - f(4)) / 0.5) : 0;
          }, "set");
          if (t >= T_NOISE && t < T_FLOOD) F.fn((c, r) => (hash(c, r, frame(t)) < 0.6 ? 0.55 + hash(r, c, 2) * 0.45 : 0), "max");
          F.render(t, { flicker: 0.12, floor: 0.05, alphaMin: 0.22, alphaMax: 1 });

          T.clear();
          if (t < T_BOX) return;

          if (dlgOn) {
            /* border draws from the top-left in both directions */
            const n = Math.floor(c01((t - T_BOX) / BOX_D) * (PER.length / 2 + 1));
            const fr = frame(t);
            PER.forEach(([c, r], i) => {
              if (!rowAlive(r)) return;
              const d = Math.min(i, PER.length - i);   /* distance from the start corner along either front */
              if (d > n) return;
              const ch = d >= n - 1 && n < PER.length / 2 ? NOISE[Math.floor(hash(c, r * 31 + fr, 4) * NOISE.length)] : boxChar(c, r);
              T.str(dx(c), dy(r), ch);
            });
            /* divider under the title bar */
            if (t >= T_DIV && rowAlive(2)) { const k = Math.floor(c01((t - T_DIV) / f(3)) * (DC - 2)); T.str(dx(1), dy(2), "─".repeat(k)); }
            /* title bar: lone white cell grows into a full inverse row */
            if (t >= T_TITLE && rowAlive(1)) {
              const g = c01((t - T_TITLE) / TITLE_D), w = Math.max(1, Math.floor(g * (DC - 2)));
              T.rect(dx(1), dy(1) + 2, w * ADV, PITCH - 4);
              const ttl = " /!\\ " + scramble(TITLE, (t - T_TITLE - f(1)) / f(4), t, 8);
              const right = "[x] ";
              const full = ttl + " ".repeat(Math.max(1, DC - 2 - ttl.length - right.length)) + right;
              T.ctx.save(); T.ctx.beginPath(); T.ctx.rect(dx(1), dy(1), w * ADV, PITCH); T.ctx.clip();
              T.ctx.fillStyle = BLUE; T.str(dx(1), dy(1), full, { alpha: 1, inv: false, blue: true });
              T.ctx.restore();
            }
            /* message + detail type in */
            if (t >= T_MSG && rowAlive(4)) {
              const n1 = Math.min(MSG.length, Math.floor((t - T_MSG) * MSG_CPS));
              T.str(dx(3), dy(4), scramble("(!)", (t - T_MSG) / f(3), t, 2));
              T.str(dx(8), dy(4), MSG.slice(0, n1) + (n1 < MSG.length ? NOISE[Math.floor(hash(n1, frame(t), 6) * NOISE.length)] : ""));
            }
            if (t >= T_DET && rowAlive(5)) T.str(dx(8), dy(5), scramble(DETAIL, (t - T_DET) / f(6), t, 12), { alpha: 0.62 });
            /* buttons; Update gains a hover state, then inverts for 2 frames on the click */
            if (t >= T_BTN && rowAlive(7)) {
              T.str(dx(B1C), dy(7), scramble(B1, (t - T_BTN) / f(3), t, 13), { alpha: 0.8 });
              const hover = t >= T_ARR - f(2);
              const lab = hover ? "[>" + B2.slice(2, -2) + "<]" : B2;
              const inv = t >= T_CLICK && t < T_CLICK + f(2);
              T.str(dx(B2C), dy(7), scramble(lab, (t - T_BTN - f(1)) / f(3), t, 14), { inv });
            }
          }

          /* log flood */
          if (vis.length) {
            const scroll = Math.max(0, vis.length - LROWS);
            for (let li = scroll; li < vis.length; li++) {
              const L = vis[li], y = LY + (li - scroll) * PITCH;
              if (L.chip != null) {
                T.str(LX, y, L.s);
                const fc = frame(t - L.at), on = fc >= 12 || fc % 4 < 2;
                T.str(LX + L.s.length * ADV, y, scramble(L.chip, (t - L.at) / f(3), t, 3), { inv: on });
                if (t >= L.at + 0.6 && Math.floor((t - L.at - 0.6) / 0.5) % 2 === 0) T.str(LX + (L.s.length + L.chip.length + 1) * ADV, y, "_");
                continue;
              }
              T.str(LX, y, L.scr ? scramble(L.s, (t - L.at) / L.scr, t, li) : L.s);
              if (L.ok) T.str(OKX, y, L.ok);
            }
          }

          /* cursor rides above everything until the flood takes the screen */
          if (t >= T_CUR && t < T_NOISE) { const [x, y] = cursorPos(t); drawCursor(x, y); }
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) document.fonts.ready.then(() => draw(P.t));
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
