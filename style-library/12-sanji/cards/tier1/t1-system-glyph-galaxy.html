  SANJI · tier1 · thesis · SYSTEM GLYPH GALAXY
  references/system s17 (f337-365). Big slow spiral arms of glyphs rotate over
  a sparse field of drifting "> - : ." glyphs and twinkling stars. ASCII coins
  with a slot glyph face fly out of the depth past the camera at mixed scale
  (far ones small and dim, near ones huge and sliced by the frame edge). One
  inverse chip scrambles in at the center and holds: the single idea.
  Slots: label (text, <= 16 chars), glyph (1 char on the coin faces).
