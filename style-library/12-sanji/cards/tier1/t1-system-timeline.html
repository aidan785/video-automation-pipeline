<!doctype html>
<!--
  SANJI · tier1 · overview · SYSTEM TIMELINE
  A horizontal terminal timeline (references/system s02 type, s12 chip,
  s19 glyph stream). A "/*" title resolves, then "o-----o-----o" types left
  to right across the frame with noise glyphs on the leading edge. As the
  line reaches each node it pops "o" to "(@)", its label scrambles in above
  and its year below. The current node and its label flicker into inverse
  chips; nodes after it stay dim (future). A glyph packet "=#>" with a
  decaying trail ($ % + : .) rides the line from the start to the current
  node and loops. Faint glyph field behind.
  Slots: title (<= 40), items (comma list "year:label", 3-5 items, year <= 6,
  label <= 14 chars), current (1-based index of the current node, default last).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t1-system-timeline {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--sys-blue); font-family: var(--font-term);
      }
      #sanji-t1-system-timeline canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #sanji-t1-system-timeline .field { filter: drop-shadow(0 0 4px rgba(225,232,255,0.45)); }
      #sanji-t1-system-timeline .term { filter: drop-shadow(0 0 5px rgba(225,232,255,0.5)); }
      #sanji-t1-system-timeline .scan { position: absolute; inset: 0; background: var(--sys-scan); }
      #sanji-t1-system-timeline .src { display: none; }
    </style>
  </head>
  <body>
    <div id="sanji-t1-system-timeline" data-composition-id="sanji-t1-system-timeline" data-start="0" data-width="1920" data-height="1080">
      <canvas class="field"></canvas>
      <canvas class="term"></canvas>
      <div class="scan"></div>
      <div class="src">
        <span data-slot="title">/* how editing got automated */</span>
        <span data-slot="items">2019:Manual cuts,2021:Presets,2023:AI captions,2025:Agents,2026:One command</span>
        <span data-slot="current">4</span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

        /* ---- card-local term grid: glyphs on a fixed advance/pitch. Box-drawing
