  chip). A "/* remember */" comment line resolves, a box-drawing frame draws
  itself from the top-left corner in both directions (noise glyphs on the two
  fronts), then the takeaway sentence scramble-types inside at 40px, the key
  word flickers into an inverse chip once it lands, a "_" cursor blinks on

  key (one word or short phrase inside sentence, <= 16).

              for (let g = Math.max(k, L.i0); g < Math.min(k + 3, L.i0 + L.s.length); g++) {

                T.str(x0 + (g - L.i0) * T.adv, y, NOISE[Math.floor(hash(g, frame(t), 17) * NOISE.length)], { alpha: 0.85 });
              }
            });
            /* blinking cursor after the last character */
            if (t >= T_TYPED && Math.floor((t - T_TYPED) / 0.5) % 2 === 0) {
              const L = LINES[LINES.length - 1];
              T.str(bx(4) + L.s.length * T.adv, by(1 + LINES.length), "_");
            }
          }
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) document.fonts.ready.then(() => draw(P.t));
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
