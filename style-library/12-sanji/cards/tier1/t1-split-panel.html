<!doctype html>
<!--
  SANJI · tier1 · stat · SPLIT PANEL
  Opens full-frame on the footage (STAND-IN plate here: a warm talking-head
  room built from CSS shapes, slot-free; replace with the real clip at
  assembly). The footage shrinks into a rounded left panel (cover crop, the
  subject stays centered) while a cobalt panel with slow sonar rings slides in
  from the right and takes the rest of the frame. Stacked center in the blue: a
  white stroke clock draws on, the big caps stat resolves word by word, a small
  ember 8-ray spark pops (the one allowed accent on cobalt), then the second
  stat resolves out of heavy blur.
  Slots: stat (<= 8, caps), stat2 (<= 8).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t1-split-panel {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--cobalt); font-family: var(--font-display); color: var(--white);
      }
      /* --- blue panel --- */
      #sanji-t1-split-panel .blue { position: absolute; left: 940px; top: 0; width: 980px; height: 1080px; overflow: hidden; background: var(--cobalt); }
      #sanji-t1-split-panel .ring {
        position: absolute; left: 50%; top: 50%; width: 1300px; height: 1300px; margin: -650px 0 0 -650px;
        border-radius: 50%; border: 2px solid rgba(255,255,255,0.07);
        background: radial-gradient(circle, rgba(255,255,255,0) 58%, rgba(255,255,255,0.035) 100%);
      }
      #sanji-t1-split-panel .stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #sanji-t1-split-panel .clock { width: 150px; height: 150px; margin-bottom: 36px; overflow: visible; }
      #sanji-t1-split-panel .stat, #sanji-t1-split-panel .stat2 {
        font-weight: var(--wt-heavy); font-size: 144px; line-height: 0.95; letter-spacing: var(--track-caps);
        text-transform: uppercase; white-space: nowrap;
        text-shadow: 0 0 40px rgba(170,190,255,0.35), 0 10px 40px rgba(10,20,140,0.35);
      }
      #sanji-t1-split-panel .stat .w { display: inline-block; white-space: pre; }
      #sanji-t1-split-panel .stat .w + .w { margin-left: 0.24em; }
      #sanji-t1-split-panel .spark { width: 170px; height: 170px; margin: 56px 0 50px; }
      /* --- footage panel (stand-in) --- */
      #sanji-t1-split-panel .foot { position: absolute; inset: 0; overflow: hidden; clip-path: inset(0px 0px 0px 0px round 0px); }
      #sanji-t1-split-panel .plate { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 50% 45%;
        background: linear-gradient(180deg, #D8D2C8 0%, #CFC8BC 60%, #B9B1A5 100%); }
      #sanji-t1-split-panel .plate i { position: absolute; display: block; }
      #sanji-t1-split-panel .plate .fr { border-radius: 6px; box-shadow: 0 6px 18px rgba(60,45,30,0.25); filter: blur(1.2px); }
      #sanji-t1-split-panel .plate .soft { filter: blur(10px); }
    </style>
  </head>
  <body>
    <div id="sanji-t1-split-panel" data-composition-id="sanji-t1-split-panel" data-start="0" data-width="1920" data-height="1080">
      <div class="blue">
        <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
        <div class="stack">
          <svg class="clock" viewBox="0 0 150 150" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
            <circle class="cc" cx="75" cy="75" r="66" transform="rotate(-90 75 75)"/>
            <path class="ch" d="M75 34V78l24 26"/>
          </svg>
          <div class="stat" data-slot="stat">&lt;1 Day</div>
          <svg class="spark" viewBox="0 0 100 100" fill="none" style="stroke:var(--ember)" stroke-width="7" stroke-linecap="round">
            <g opacity="0.92"><path d="M50 6v88M6 50h88M19 19l62 62M81 19L19 81"/></g>
          </svg>
          <div class="stat2" data-slot="stat2">$20</div>
        </div>
      </div>

      <div class="foot">
        <!-- STAND-IN footage: warm talking-head room. Replace with the real clip at assembly. -->
        <div class="plate">
          <i class="fr" style="left:610px;top:40px;width:250px;height:170px;background:#6E89A6"></i>
          <i class="fr" style="left:880px;top:110px;width:150px;height:200px;background:#C9643E"></i>
          <i class="fr" style="left:1080px;top:60px;width:190px;height:240px;background:#38518A"></i>
          <i class="fr" style="left:1300px;top:150px;width:170px;height:130px;background:#B59A74"></i>
          <i class="fr" style="left:470px;top:300px;width:120px;height:150px;background:#8C7A66"></i>
          <i class="soft" style="left:480px;top:470px;width:360px;height:190px;border-radius:14px;background:linear-gradient(135deg,#7FB2E6,#3A6FC4)"></i>
          <i class="soft" style="left:1140px;top:470px;width:330px;height:190px;border-radius:14px;background:linear-gradient(135deg,#3A6FC4,#9CC6F0)"></i>
          <i style="left:0;top:880px;width:1920px;height:200px;background:linear-gradient(180deg,#E9E6E1,#D9D5CF)"></i>
          <!-- figure -->
          <i class="soft" style="left:700px;top:500px;width:520px;height:520px;border-radius:46% 46% 8% 8%;background:linear-gradient(180deg,#E6D9BE,#CDBB98);filter:blur(2px)"></i>
          <i style="left:868px;top:515px;width:184px;height:110px;border-radius:0 0 50% 50%;background:#F1EEE8"></i>
          <i style="left:868px;top:262px;width:184px;height:240px;border-radius:46%;background:linear-gradient(180deg,#D6A483,#BE8A69);filter:blur(1px)"></i>
          <i style="left:850px;top:222px;width:220px;height:170px;border-radius:50% 50% 38% 38%;background:#3B2A20;filter:blur(3px)"></i>
          <i style="left:40px;top:690px;width:560px;height:360px;border-radius:18px;background:linear-gradient(160deg,#ECECEE,#C9C9CD);box-shadow:0 20px 40px rgba(0,0,0,0.25)"></i>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-t1-split-panel";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => [...ROOT.querySelectorAll(s)];
        const css = getComputedStyle(document.documentElement);
        const WHITE = css.getPropertyValue("--white").trim(), PRE = css.getPropertyValue("--white-pre").trim();

        /* stat words */
        const stat = $(".stat");
        const ws = stat.textContent.trim().split(/\s+/); stat.textContent = "";
        const words = ws.map((w, i) => { const s = document.createElement("span"); s.className = "w"; s.textContent = w; stat.appendChild(s); return s; });

        /* clock draw-on prep */
        const cc = $(".cc"), ch = $(".ch");
        [cc, ch].forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });

        const PANEL = 940, SH0 = 0.55, SHD = 0.75;
        const END = 5.6;
        const tl = gsap.timeline({ paused: true });
        tl.set([...words, $(".spark"), $(".stat2"), $(".clock")], { autoAlpha: 0 }, 0)
          .set($(".blue"), { x: 980 }, 0);

        /* footage breathes, then shrinks into the left panel (cover crop keeps subject centered) */
        tl.fromTo($(".plate"), { scale: 1.06 }, { scale: 1.0, duration: SH0 + SHD, ease: "power2.out" }, 0)
          .to($(".foot"), { clipPath: `inset(0px ${1920 - PANEL}px 0px 0px round 40px)`, duration: SHD, ease: "power3.inOut" }, SH0)
          .to($(".plate"), { x: (PANEL - 1920) / 2, duration: SHD, ease: "power3.inOut" }, SH0)
          .to($(".blue"), { x: 0, duration: SHD, ease: "power3.inOut" }, SH0)
          .fromTo($(".blue"), { filter: "blur(10px)" }, { filter: "blur(0px)", duration: SHD, ease: "power2.out" }, SH0);

        /* sonar rings (finite, end before END) */
        const rings = $$(".ring"), PER = 4.2;
        rings.forEach((r, i) => {
          const st = SH0 + i * (PER / rings.length);
          const cyc = Math.max(1, Math.floor((END - st) / PER)), P = cyc === 1 ? Math.min(PER, END - st) : PER;   /* finite, never past END */
          tl.fromTo(r, { scale: 0.25, opacity: 0 }, { keyframes: [{ scale: 0.62, opacity: 1, duration: P * 0.45, ease: "sine.out" }, { scale: 1.05, opacity: 0, duration: P * 0.55, ease: "sine.in" }], repeat: cyc - 1 }, st);
        });

        /* clock draws on */
        const C = SH0 + SHD - 0.1;
        tl.fromTo($(".clock"), { autoAlpha: 0, scale: 0.9, filter: "blur(8px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, C)
          .to(cc, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, C)
          .to(ch, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, C + 0.4);

        /* stat resolves word by word */
        tl.set(words, { autoAlpha: 1 }, C + 0.3)
          .fromTo(words, { color: PRE }, { color: WHITE, duration: 0.5, ease: TXT.EASE }, C + 0.3);
        const t = TXT.reveal(tl, words, C + 0.3);          /* house preset pour-in */
        /* ember spark pops */
        const SP = t + 0.05;
        tl.fromTo($(".spark"), { autoAlpha: 0, scale: 0.4, rotation: -40, filter: "blur(8px)" }, { autoAlpha: 1, scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.45, ease: "back.out(1.25)" }, SP)
          .to($(".spark"), { rotation: 18, duration: END - SP - 0.6, ease: "sine.inOut" }, SP + 0.45);

        /* second stat out of heavy blur */
        const S2 = SP + 0.5;
        tl.set($(".stat2"), { autoAlpha: 1 }, S2)
          .fromTo($(".stat2"), { color: PRE }, { color: WHITE, duration: 0.5, ease: "power2.out" }, S2 + 0.15);
        TXT.reveal(tl, $(".stat2"), S2);

        /* exit: content dissolves */
        TXT.blockExit(tl, [$(".clock"), $(".spark")], END - 0.48);
        TXT.exit(tl, [...words, $(".stat2")], END - 0.48);
        tl.set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
