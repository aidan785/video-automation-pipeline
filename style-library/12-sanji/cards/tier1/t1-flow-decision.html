<!doctype html>
<!--
  SANJI · tier1 · instructional · FLOW DECISION (flowchart)
  COBALT WASH canvas (cyan blobs + faint 64px blueprint grid). A glass start
  pill pops on the left, a connector draws and a glowing light dot travels it
  into a glass diamond decision node; the question resolves inside the
  diamond and a sonar ring leaves it. Two branches draw out (top = YES,
  bottom = NO) with small glass label pills riding the lines, landing on two
  result cards. Then the decision: the light dot runs the chosen branch,
  tracing it bright with a glowing overlay line; that label + card light
  ACTIVE and lift, while the other branch, label and card go dormant.
  Slots: start (<=10), question (<=34, wraps to 3 short lines), yes / no
  (<=22, richtext <br> ok), pick (yes|no).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t1-flow-decision {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--cobalt-wash); font-family: var(--font-display); color: var(--white);
      }
      #sanji-t1-flow-decision .grid { position: absolute; inset: 0; background: var(--cell-grid); opacity: 0.8; }
      #sanji-t1-flow-decision .g { position: absolute; box-sizing: border-box; border-radius: var(--r-tile); }
      #sanji-t1-flow-decision .g > .fill, #sanji-t1-flow-decision .g > .lit { position: absolute; inset: 0; border-radius: inherit; box-sizing: border-box; }
      #sanji-t1-flow-decision .g > .fill { background: var(--glass-fill); border: var(--rim) solid var(--glass-rim); box-shadow: var(--glass-shadow); }
      #sanji-t1-flow-decision .g > .lit  { background: var(--glass-fill-active); border: var(--rim) solid var(--glass-rim-active); box-shadow: var(--glass-shadow-active); opacity: 0; }
      #sanji-t1-flow-decision .g > .in { position: absolute; inset: 0; }
      #sanji-t1-flow-decision .badge {
        position: absolute; border-radius: 50%; box-sizing: border-box;
        background: var(--badge-fill); border: var(--rim) solid var(--badge-rim);
        display: flex; align-items: center; justify-content: center;
      }

      #sanji-t1-flow-decision .start { left: 80px; top: 499px; width: 380px; height: 112px; border-radius: var(--r-pill); }
      #sanji-t1-flow-decision .start .badge { left: 14px; top: 14px; width: 84px; height: 84px; }
      #sanji-t1-flow-decision .start .lab { position: absolute; left: 118px; top: 0; height: 112px; display: flex; align-items: center; white-space: nowrap; font-weight: var(--wt-heavy); font-size: 40px; letter-spacing: var(--track-caps); text-transform: uppercase; }

      #sanji-t1-flow-decision .dia { left: 665px; top: 430px; width: 250px; height: 250px; border-radius: 44px; }
      #sanji-t1-flow-decision .dping { position: absolute; left: 665px; top: 430px; width: 250px; height: 250px; border-radius: 44px; box-sizing: border-box; border: 2px solid rgba(255,255,255,0.6); opacity: 0; }
      #sanji-t1-flow-decision .qt {
        position: absolute; left: 650px; top: 455px; width: 280px; height: 200px; display: flex; align-items: center; justify-content: center; text-align: center;
        font-family: var(--font-body); font-weight: var(--wt-bold); font-size: 32px; line-height: 1.12; letter-spacing: var(--track-ui);
      }
      #sanji-t1-flow-decision .qt .w { display: inline-block; white-space: pre; }

      #sanji-t1-flow-decision .tag { width: 136px; height: 56px; border-radius: var(--r-pill); }
      #sanji-t1-flow-decision .tag > .fill { background: var(--glass-fill), var(--cobalt); }
      #sanji-t1-flow-decision .tag > .lit { background: var(--glass-fill-active), var(--cobalt); }
      #sanji-t1-flow-decision .tag .t { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: var(--wt-heavy); font-size: 24px; letter-spacing: 0.06em; }

      #sanji-t1-flow-decision .res { left: 1180px; width: 600px; height: 180px; border-radius: 44px; }
      #sanji-t1-flow-decision .res .badge { left: 30px; top: 30px; width: 120px; height: 120px; }
      #sanji-t1-flow-decision .res .ttl { position: absolute; left: 182px; right: 24px; top: 0; height: 180px; display: flex; align-items: center; font-weight: var(--wt-heavy); font-size: 52px; line-height: 0.92; letter-spacing: var(--track-caps); text-transform: uppercase; }

      #sanji-t1-flow-decision svg.wires { position: absolute; inset: 0; overflow: visible; }
      #sanji-t1-flow-decision .hot { filter: drop-shadow(0 0 8px rgba(255,255,255,0.85)) drop-shadow(0 0 22px rgba(160,190,255,0.6)); }
      #sanji-t1-flow-decision .spark {
        position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
        background: var(--white); box-shadow: 0 0 14px 4px rgba(255,255,255,0.85), 0 0 44px 12px rgba(150,180,255,0.6);
      }
      #sanji-t1-flow-decision .slots { display: none; }
    </style>
  </head>
  <body>
    <div id="sanji-t1-flow-decision" data-composition-id="sanji-t1-flow-decision" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>

      <svg class="wires" viewBox="0 0 1920 1080" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
        <path class="w0" d="M460 555 L631 555" />
        <path class="wy" d="M790 396 C 790 300, 840 290, 930 290 L 1180 290" />
        <path class="wn" d="M790 714 C 790 810, 840 820, 930 820 L 1180 820" />
        <path class="hot hy" d="M790 396 C 790 300, 840 290, 930 290 L 1180 290" stroke-width="4" />
        <path class="hot hn" d="M790 714 C 790 810, 840 820, 930 820 L 1180 820" stroke-width="4" />
        <g fill="#FFFFFF" stroke="none">
          <g class="nd n0"><circle cx="460" cy="555" r="7"/><circle cx="631" cy="555" r="16" opacity="0.2"/><circle cx="631" cy="555" r="7"/></g>
          <g class="nd ny"><circle cx="790" cy="396" r="7"/><circle cx="1180" cy="290" r="16" opacity="0.2"/><circle cx="1180" cy="290" r="7"/></g>
          <g class="nd nn"><circle cx="790" cy="714" r="7"/><circle cx="1180" cy="820" r="16" opacity="0.2"/><circle cx="1180" cy="820" r="7"/></g>
        </g>
      </svg>

      <div class="g start"><div class="fill"></div><div class="lit"></div><div class="in">
        <div class="badge"><svg width="38" height="38" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l10.6-6.8a1 1 0 0 0 0-1.72L9.5 4.34A1 1 0 0 0 8 5.2z"/></svg></div>
        <div class="lab" data-slot="start">New task</div></div></div>

      <div class="dping"></div>
      <div class="g dia"><div class="fill"></div><div class="lit"></div></div>
      <div class="qt" data-slot="question">Will you repeat it weekly?</div>

      <div class="g tag ty" style="left:966px;top:262px"><div class="fill"></div><div class="lit"></div><div class="t">YES</div></div>
      <div class="g tag tn" style="left:966px;top:792px"><div class="fill"></div><div class="lit"></div><div class="t">NO</div></div>

      <div class="g res ry" style="top:200px"><div class="fill"></div><div class="lit"></div><div class="in">
        <div class="badge"><svg width="56" height="56" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M13.5 2 4.8 13.2h6l-1.3 8.8 8.7-11.3h-6z"/></svg></div>
        <div class="ttl" data-slot="yes">Automate<br>it</div></div></div>
      <div class="g res rn" style="top:730px"><div class="fill"></div><div class="lit"></div><div class="in">
        <div class="badge"><svg width="54" height="54" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M18.6 2.6a2 2 0 0 1 2.8 2.8L9.2 17.6 4.5 19.5l1.9-4.7z"/></svg></div>
        <div class="ttl" data-slot="no">Do it<br>by hand</div></div></div>

      <div class="spark"></div>
      <div class="slots"><span data-slot="pick">yes</span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-t1-flow-decision";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => [...ROOT.querySelectorAll(s)];
        const css = getComputedStyle(document.documentElement);
        const tok = (n) => css.getPropertyValue(n).trim();
        const WHITE = tok("--white"), PRE = tok("--white-pre"), DORM = tok("--dormant");

        const YES = ($("[data-slot=pick]").textContent || "yes").trim().toLowerCase() !== "no";
        const K = YES ? "y" : "n", O = YES ? "n" : "y";

        const qt = $(".qt");
        const qIn = document.createElement("span"); qIn.innerHTML = qt.innerHTML.trim(); qt.textContent = ""; qt.appendChild(qIn);   /* one inline box inside the flex centre, so words wrap */

        const draw = $$("path"); draw.forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });

        /* flex containers: wrap their text in one inline box so the preset's word boxes keep their spaces */
        const inl = (el) => { const s = document.createElement("span"); while (el.firstChild) s.appendChild(el.firstChild); el.appendChild(s); return s; };
        const tl = gsap.timeline({ paused: true });
        const pop = (el, t, extra = {}) => tl.fromTo(el, { autoAlpha: 0, scale: 0.9, filter: "blur(10px)", ...extra }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.38, ease: "back.out(1.25)", ...extra }, t);
        const blurIn = (els, t, st = 0.06) => tl.fromTo(els, { autoAlpha: 0, y: 8, filter: "blur(8px)" }, { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out", stagger: st }, t);

        /* light dot that rides a path (proxy progress -> point on path) */
        const spark = $(".spark");
        const ride = (path, t, d) => {
          const L = path.getTotalLength(), p = { v: 0 };
          tl.fromTo(p, { v: 0 }, { v: 1, duration: d, ease: "power2.inOut", onUpdate: () => {
            const pt = path.getPointAtLength(p.v * L); gsap.set(spark, { x: pt.x, y: pt.y });
          } }, t);
        };

        tl.set([...$$(".g"), spark, ...$$(".nd")], { autoAlpha: 0 }, 0)
          .set([$(".dia"), $(".dping")], { rotation: 45 }, 0);

        /* 1. start pill, connector, light travels into the diamond */
        pop($(".start"), 0.15);
        tl.to($(".start .lit"), { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.25);
        TXT.block(tl, $(".start .badge"), 0.22);
        TXT.reveal(tl, inl($(".start .lab")), 0.3);
        tl.to($(".w0"), { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, 0.6)
          .fromTo($(".n0"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.16 }, 0.6)
          .fromTo(spark, { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1, duration: 0.2, ease: "power2.out" }, 0.62);
        ride($(".w0"), 0.62, 0.45);
        tl.to(spark, { autoAlpha: 0, scale: 0.5, duration: 0.18, ease: "power2.in" }, 1.05);
        pop($(".dia"), 0.95, { rotation: 45 });
        tl.to($(".start .lit"), { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 1.0)
          .to($(".dia .lit"), { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.05)
          .to($(".dia"), { scale: 1.04, duration: 0.5, ease: "expo.out" }, 1.1)
          .fromTo($(".dping"), { opacity: 0.8, scale: 1 }, { opacity: 0, scale: 1.7, duration: 1.0, ease: "expo.out", immediateRender: false }, 1.1);
        const TQ = TXT.reveal(tl, qIn, 1.2) - 0.3;

        /* 2. both branches draw out with their label pills and result cards */
        const TB = TQ + 0.35;
        tl.to([$(".wy"), $(".wn")], { strokeDashoffset: 0, duration: 0.65, ease: "power2.inOut", stagger: 0.08 }, TB)
          .fromTo([$(".ny"), $(".nn")], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, stagger: 0.08 }, TB + 0.5);
        pop($(".ty"), TB + 0.3); pop($(".tn"), TB + 0.38);
        TXT.block(tl, [$(".ty .t"), $(".tn .t")], TB + 0.36);
        pop($(".ry"), TB + 0.6); pop($(".rn"), TB + 0.7);
        TXT.block(tl, $(".ry .badge"), TB + 0.66); TXT.reveal(tl, inl($(".ry .ttl")), TB + 0.74);
        TXT.block(tl, $(".rn .badge"), TB + 0.76); TXT.reveal(tl, inl($(".rn .ttl")), TB + 0.84);

        /* 3. the decision: light runs the chosen branch, other side goes dormant */
        const TD = TB + 1.75;
        tl.to($(".dia .lit"), { opacity: 0.4, duration: 0.35, ease: "power2.inOut" }, TD + 0.5)
          .to($(".dia"), { scale: 1, duration: 0.35, ease: "power2.inOut" }, TD + 0.5)
          .set(spark, { scale: 1 }, TD)
          .fromTo(spark, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.15 }, TD)
          .to($(".h" + K), { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, TD);
        ride($(".w" + K), TD, 0.7);
        tl.to(spark, { autoAlpha: 0, scale: 1.8, duration: 0.3, ease: "power2.out" }, TD + 0.68)
          .to($(".t" + K + " .lit"), { opacity: 1, duration: 0.35, ease: "power2.out" }, TD + 0.25)
          .to($(".t" + K), { scale: 1.06, duration: 0.45, ease: "expo.out" }, TD + 0.25)
          .to($(".r" + K + " .lit"), { opacity: 1, duration: 0.4, ease: "power2.out" }, TD + 0.62)
          .to($(".r" + K), { scale: 1.04, transformOrigin: "0% 50%", duration: 0.6, ease: "expo.out" }, TD + 0.62)
          .to([$(".w" + O), $(".n" + O)], { opacity: 0.35, duration: 0.4, ease: "power2.inOut" }, TD + 0.3)
          .to([$(".t" + O + " .t"), $(".r" + O + " .ttl")], { color: DORM, duration: 0.4, ease: "power2.inOut" }, TD + 0.3)
          .to([$(".t" + O + " .fill"), $(".r" + O + " .fill")], { opacity: 0.7, duration: 0.4, ease: "power2.inOut" }, TD + 0.3)
          .to($(".r" + O + " .badge"), { opacity: 0.55, duration: 0.4, ease: "power2.inOut" }, TD + 0.3)
          .to($(".r" + O), { scale: 0.985, transformOrigin: "0% 50%", duration: 0.45, ease: "power2.inOut" }, TD + 0.3);

        const END = TD + 2.3;
        tl.set({}, {}, END);
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
