<!doctype html>
<!--
  SANJI · tier1 · stat · SYSTEM STAT COUNT
  references/system s08-s12, s28. A huge number painted as a glyph mask and
  rendered on the ASCII grid. It counts up from zero on a proxy value (digits
  re-roll on 24fps frames, dense flickering ramp inside the strokes), lands
  with a 2-frame noise punch on the digits, then holds with a bright edge rim
  and slow lighter sheen bands across a mid-density face (the reference's
  coin-face recipe). A faint glyph field sits outside. Under it a terminal
  line scrambles in: the unit inside an inverse chip, then the label.
  Slots: prefix (text, <= 2, e.g. "$" or "+"), value (number, <= 6 digits,
  commas and one decimal point allowed), suffix (text, <= 2, e.g. "%" "x" "+"),
  unit (text, <= 14, chip), label (text, <= 30), kicker (text, <= 20).
-->
<html>

    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t1-system-stat-count {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--sys-blue); font-family: var(--font-term);
      }
      #sanji-t1-system-stat-count canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; filter: drop-shadow(0 0 4px rgba(225,232,255,0.45)); }

      <canvas class="type"></canvas>
      <div class="scan"></div>
      <div class="src">
        <span data-slot="kicker">time saved</span>
        <span data-slot="prefix"></span>
        <span data-slot="value">120</span>
        <span data-slot="suffix">+</span>
        <span data-slot="unit">hours</span>
        <span data-slot="label">back every month</span>
      </div>
    </div>
