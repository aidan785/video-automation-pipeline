<!doctype html>
<!--
  SANJI · tier1 · thesis (ui-plate) · NATURE GLASS PLATE
  A wheat field photo, full bleed, slowly drifting. A small liquid-glass review
  chip (check glyph) resolves in top-center over the photo first. Then a large
  rounded white UI plate floats in out of blur with a slight 3D tilt that
  settles flat (perspective on the wrapper, GSAP moves the inner plate). The
  plate is a generic message composer: To pill, subject line, body text that
  types in with a caret, a cobalt Send button. A cursor glides to Send and
  presses (dip + ripple + flash) and the plate whooshes off to the upper right
  with motion blur, leaving the landscape.
  Slots: chip (text <= 14, empty hides the chip), to (text <= 26),
  subject (text <= 30), body (text <= 80, wraps to ~3 lines), photo
  (filename stem in assets/nature, default wheat-field).
-->
<html>
  <head>

    <link rel="stylesheet" href="../../tokens.css" />

        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--void); font-family: var(--font-body);

      #sanji-t1-nature-glass-plate .slot-photo { display: none; }
      #sanji-t1-nature-glass-plate .bg { position: absolute; inset: 0; }
      #sanji-t1-nature-glass-plate .bg img { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; display: block; }
      #sanji-t1-nature-glass-plate .shade {
        position: absolute; inset: 0;
        background:
          linear-gradient(180deg, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0) 30%),
          radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.30) 100%);
      }

      #sanji-t1-nature-glass-plate .chipwrap { position: absolute; left: 0; right: 0; top: 92px; display: flex; justify-content: center; }

        position: relative; box-sizing: border-box; height: 72px; padding: 0 34px 0 16px;
        display: flex; align-items: center; gap: 16px; border-radius: var(--r-pill); overflow: hidden;

/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).

     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word

   line "pours" in as one wave instead of popping word by word.

     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function

      if (x <= 0) return 0; if (x >= 1) return 1;

  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;

    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;

        };
        tl.fromTo($(".cursor"), { autoAlpha: 0, x: 1180, y: 760 },
            { autoAlpha: 1, x: () => sendPt().x, y: () => sendPt().y, duration: 0.74, ease: "power3.inOut" }, CUR);

        /* press: dip + ripple + flash */
        tl.to($(".cursor"), { scale: 0.82, duration: 0.08, ease: "power2.in" }, PRESS)
          .to($(".cursor"), { scale: 1, duration: 0.24, ease: "power2.out" }, PRESS + 0.1)
          .to($(".send"), { scale: 0.93, duration: 0.08, ease: "power2.in" }, PRESS)
          .to($(".send"), { scale: 1, duration: 0.3, ease: "back.out(1.25)" }, PRESS + 0.08)
          .fromTo($(".send .rip"), { opacity: 0.9, scale: 0.1 }, { opacity: 0, scale: 1.6, duration: 0.5, ease: "power2.out" }, PRESS + 0.04)
          .fromTo($(".send .flash"), { opacity: 0 }, { opacity: 0.42, duration: 0.07, ease: "power2.out" }, PRESS + 0.05)
          .to($(".send .flash"), { opacity: 0, duration: 0.3, ease: "power2.out" }, PRESS + 0.12)
          .to($(".send"), { boxShadow: "0 0 0 10px rgba(" + tok("--cobalt-rgb") + ",0.18), 0 10px 40px rgba(" + tok("--cobalt-rgb") + ",0.6), inset 0 1.5px 0 rgba(255,255,255,0.3)", duration: 0.12, ease: "power2.out" }, PRESS + 0.05)
          .to($(".send"), { boxShadow: "0 0 0 22px rgba(" + tok("--cobalt-rgb") + ",0), 0 10px 28px rgba(" + tok("--cobalt-rgb") + ",0.35), inset 0 1.5px 0 rgba(255,255,255,0.3)", duration: 0.45, ease: "power2.out" }, PRESS + 0.17);

        /* plate whooshes off to the upper right with motion blur */
        tl.to($(".cursor"), { autoAlpha: 0, duration: 0.16, ease: "power1.in" }, OUT - 0.06)
          .to($(".caret"), { autoAlpha: 0, duration: 0.1 }, OUT)
          .to($(".plate"), { x: 1500, y: -820, scale: 0.72, rotationZ: -7, rotationY: 14, filter: "blur(18px)", duration: 0.5, ease: "power2.in" }, OUT)
          .to($(".plate"), { autoAlpha: 0, duration: 0.2, ease: "power1.in" }, OUT + 0.36);
        if (hasChip) TXT.blockExit(tl, $(".chip"), OUT + 0.4);
        tl.set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
