<!doctype html>
<!--
  SANJI · tier1 · stat · PARTICLE NUMERAL
  The "$500" moment of the cold open. True black. A short white sentence
  resolves out of blur across the middle, then a huge figure built from
  thousands of tiny glowing blue particle dots slams in OVERFILLING the frame
  and dollies back to ~65% width while every dot shimmers (seeded per-dot
  twinkle) and a few loose dots drift off the glyph edges. Late in the card the
  blue dot-halftone grid fades in at the frame edges behind a dark vignette,
  then the figure dims and the sentence softens out.
  The glyph is rasterised once to an offscreen canvas and sampled with a
  seeded LCG; the visible canvas is redrawn from the timeline (a proxy tween's
  onUpdate computes everything from time, never rAF).
  Slots: figure (text, <= 6 chars, e.g. $500, 3x, 98%), line (text, <= 28 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t1-particle-numeral {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--void); font-family: var(--font-body);
      }
      #sanji-t1-particle-numeral .grid {
        position: absolute; inset: 0; background: var(--dot-grid-blue); opacity: 0;
        -webkit-mask-image: radial-gradient(ellipse 62% 62% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,1) 100%);
                mask-image: radial-gradient(ellipse 62% 62% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,1) 100%);
      }
      #sanji-t1-particle-numeral .vig { position: absolute; inset: 0; background: var(--vignette-dark); }
      #sanji-t1-particle-numeral .aura {
        position: absolute; left: 50%; top: 50%; width: 1700px; height: 900px; margin: -450px 0 0 -850px;
        border-radius: 50%; opacity: 0;
        background: radial-gradient(closest-side, rgba(var(--volt-rgb),0.22), rgba(var(--volt-rgb),0.07) 55%, rgba(var(--volt-rgb),0) 100%);
      }
      #sanji-t1-particle-numeral canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #sanji-t1-particle-numeral canvas.halo { filter: blur(9px); opacity: 0.95; mix-blend-mode: screen; }
      #sanji-t1-particle-numeral canvas.bloom { filter: blur(26px); opacity: 0.6; mix-blend-mode: screen; }
      #sanji-t1-particle-numeral .fig { display: none; }
      #sanji-t1-particle-numeral .stage {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      }
      #sanji-t1-particle-numeral .line {
        position: relative; white-space: nowrap; color: var(--white);
        font-family: var(--font-body); font-weight: var(--wt-ui);
        font-size: 96px; letter-spacing: var(--track-tight); line-height: 1.1;
        text-shadow: 0 2px 18px rgba(0,0,0,0.55), 0 0 2px rgba(0,0,0,0.4);
      }
      #sanji-t1-particle-numeral .line .w { display: inline-block; white-space: pre; }
      #sanji-t1-particle-numeral .grain { position: absolute; inset: 0; background: var(--grain); opacity: 0.6; mix-blend-mode: overlay; }
    </style>
  </head>
  <body>
    <div id="sanji-t1-particle-numeral" data-composition-id="sanji-t1-particle-numeral" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="vig"></div>
      <div class="aura"></div>
      <canvas class="bloom" width="1920" height="1080"></canvas>
      <canvas class="halo" width="1920" height="1080"></canvas>
      <canvas class="dots" width="1920" height="1080"></canvas>
      <span class="fig" data-slot="figure">$500</span>
      <div class="stage"><div class="line" data-slot="line">People are making over</div></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-t1-particle-numeral";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => [...ROOT.querySelectorAll(s)];
        const css = getComputedStyle(document.documentElement);
        const tok = (n) => css.getPropertyValue(n).trim();
        const WHITE = tok("--white"), PRE = tok("--white-pre");
        const rgbOf = (hex) => { const h = hex.replace("#", ""); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); };
        const VOLT = rgbOf(tok("--volt")), SOFT = rgbOf(tok("--volt-soft"));

        /* ---- timing ---- */
        const T_LINE = 0.12, GAP = 0.13;       /* sentence resolves first */
        const T_IN = 0.42;                     /* figure slams in */
        const DOLLY = 0.36;                    /* fast pull-back */
        const T_GRID = 2.55;                   /* halftone grid fades in at edges */
        const T_OUT = 3.55;                    /* exit */
        const END = T_OUT + 0.5;

        /* ---- sentence: words resolve out of blur ---- */
        const line = $(".line");
        const ws = line.textContent.trim().split(/\s+/);
        line.textContent = "";
        const words = ws.map((w, i) => { const s = document.createElement("span"); s.className = "w"; s.textContent = w + (i < ws.length - 1 ? " " : ""); line.appendChild(s); return s; });

        /* ---- particles: seeded sample of the rasterised glyph ---- */
        let seed = 7331;
        const rnd = () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>>0) / 4294967296);
        let pts = null, sampledFont = false;
        const CX = 960, CY = 540;
        function sample() {
          const fig = $(".fig").textContent.trim() || "$500";
          const off = document.createElement("canvas"); off.width = 1920; off.height = 1080;
          const o = off.getContext("2d");
          let fs = 560;
          o.font = `800 ${fs}px "Inter Tight", "Inter", sans-serif`;
          const w0 = o.measureText(fig).width;
          fs = Math.min(fs * 1300 / w0, 600);
          o.font = `800 ${fs}px "Inter Tight", "Inter", sans-serif`;
          o.textAlign = "center"; o.textBaseline = "alphabetic";
          const m = o.measureText(fig);
          const asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
          const base = CY + (asc - desc) / 2;
          o.fillStyle = "#fff"; o.fillText(fig, CX, base);
          const top = base - asc, bot = base + desc;
          const data = o.getImageData(0, 0, 1920, 1080).data;
          seed = 7331;
          const out = [];
          const STEP = 5.3;
          for (let y = Math.max(0, top - 4); y < Math.min(1080, bot + 4); y += STEP) {
            for (let x = 0; x < 1920; x += STEP) {
              const jx = x + (rnd() - 0.5) * STEP * 1.1, jy = y + (rnd() - 0.5) * STEP * 1.1;
              const xi = jx | 0, yi = jy | 0;
              if (xi < 0 || yi < 0 || xi >= 1920 || yi >= 1080) continue;
              const a = data[(yi * 1920 + xi) * 4 + 3];
              if (a < 120 || rnd() > 0.9) continue;
              const v = Math.min(1, Math.max(0, (jy - top) / (bot - top)));   /* 0 top .. 1 bottom */
              /* top = saturated volt, middle = volt-soft, bottom = near white */
              const k1 = Math.min(1, v * 1.6), k2 = Math.max(0, (v - 0.55) / 0.45);
              let r = VOLT[0] + (SOFT[0] - VOLT[0]) * k1, g = VOLT[1] + (SOFT[1] - VOLT[1]) * k1, b = VOLT[2] + (SOFT[2] - VOLT[2]) * k1;
              r += (236 - r) * k2; g += (244 - g) * k2; b += (255 - b) * k2;
              const loose = rnd() < 0.028;
              const ang = rnd() * Math.PI * 2;
              out.push({
                x: jx, y: jy, rad: 1.25 + rnd() * 1.35, base: 0.55 + rnd() * 0.45,
                ph: rnd() * Math.PI * 2, fq: 5 + rnd() * 9,
                col: `rgb(${r | 0},${g | 0},${b | 0})`,
                loose, t0: T_IN + 0.3 + rnd() * 2.4, vx: Math.cos(ang) * (40 + rnd() * 90), vy: Math.sin(ang) * (40 + rnd() * 90) - 20,
              });
            }
          }
          /* group by colour so fillStyle switches stay cheap */
          out.sort((a, b) => (a.col < b.col ? -1 : a.col > b.col ? 1 : 0));
          return out;
        }
        const fontReady = () => document.fonts && document.fonts.check('800 200px "Inter Tight"');

        const cv = $("canvas.dots"), ctx = cv.getContext("2d");
        const hv = $("canvas.halo"), hctx = hv.getContext("2d");
        const bv = $("canvas.bloom"), bctx = bv.getContext("2d");

        const eDolly = gsap.parseEase("power3.out"), eDrift = gsap.parseEase("sine.out"), eIn = gsap.parseEase("expo.out"), eOut = gsap.parseEase("power2.in");
        const clamp01 = (x) => Math.max(0, Math.min(1, x));

        function draw(t) {
          if (!pts || (!sampledFont && fontReady())) { sampledFont = fontReady(); pts = sample(); }
          ctx.clearRect(0, 0, 1920, 1080);
          if (t < T_IN) { hctx.clearRect(0, 0, 1920, 1080); bctx.clearRect(0, 0, 1920, 1080); return; }
          const u = t - T_IN;
          /* scale: 2.3 (overfilling) -> 1.04 fast, then a slow drift to 0.94 */
          let s;
          if (u < DOLLY) s = 2.3 + (1.04 - 2.3) * eDolly(u / DOLLY);
          else s = 1.04 + (0.94 - 1.04) * eDrift(clamp01((u - DOLLY) / (T_OUT - T_IN - DOLLY)));
          const fade = eIn(clamp01(u / 0.12)) * (1 - 0.85 * eOut(clamp01((t - T_OUT) / 0.45)));
          const blurAmt = 1 - clamp01(u / 0.22);
          let cur = null;
          for (let i = 0; i < pts.length; i++) {
            const p = pts[i];
            let x = CX + (p.x - CX) * s, y = CY + (p.y - CY) * s;
            let a = p.base * (0.5 + 0.5 * Math.sin(t * p.fq + p.ph)) ** 1.4;
            a = 0.5 + 0.5 * a;
            if (p.loose && t > p.t0) {
              const d = t - p.t0;
              x += p.vx * d ** 1.25; y += p.vy * d ** 1.25;
              a *= Math.max(0, 1 - d / 1.4);
              if (a <= 0.01) continue;
            }
            if (cur !== p.col) { ctx.fillStyle = p.col; cur = p.col; }
            ctx.globalAlpha = a * fade;
            const r = p.rad * (0.8 + 0.3 * s) * (1 + blurAmt * 1.4);
            ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
          }
          ctx.globalAlpha = 1;
          hctx.clearRect(0, 0, 1920, 1080); hctx.drawImage(cv, 0, 0);
          bctx.clearRect(0, 0, 1920, 1080); bctx.drawImage(cv, 0, 0);
        }

        const tl = gsap.timeline({ paused: true });
        tl.set(words, { autoAlpha: 0 }, 0);

        /* sentence resolves word by word (white-pre -> white, blur 12 -> 0) */
        tl.set(words, { autoAlpha: 1 }, 0);
        TXT.reveal(tl, words, T_LINE);                     /* house preset pour-in */

        /* ambient: aura blooms behind the figure as it lands */
        tl.fromTo($(".aura"), { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, T_IN)
          .to($(".aura"), { opacity: 0.6, duration: 2, ease: "sine.inOut" }, T_IN + 0.8)
          /* halftone grid wakes up at the frame edges */
          .fromTo($(".grid"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.inOut" }, T_GRID)
          .to($(".vig"), { opacity: 0.8, duration: 0.6, ease: "sine.inOut" }, T_GRID);

        /* exit: figure dims (in draw), sentence softens away */
        TXT.exit(tl, words, T_OUT);
        tl
          .to($(".aura"), { opacity: 0, duration: 0.4, ease: "power2.in" }, T_OUT);

        /* particle canvas: pure function of time, driven by a proxy */
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);

        draw(0);
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
