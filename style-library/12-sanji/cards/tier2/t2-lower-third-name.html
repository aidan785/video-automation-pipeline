<!doctype html>
<!--
  SANJI · tier2 · lower-third · NAME LOWER THIRD
  Transparent overlay, lower-left. A frosted liquid-glass card (white sheen
  over a cool tint, bright rim, backdrop blur over the footage) slides up from
  below the frame edge with vertical motion blur and settles. Inside: an
  avatar circle (initials from the name) whose ring draws on clockwise, the
  name in Inter Tight 800 resolving out of blur, the role in Inter 500 dim,
  and a thin cobalt accent line drawing left to right underneath with a faint
  glow. Holds with a slow drift, then sinks away softly.
  Slots: name (text <=24), role (text <=36).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t2-lower-third-name {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: transparent;
      }
      #sanji-t2-lower-third-name .card {
        position: absolute; left: 140px; bottom: 120px; height: 172px;
        display: inline-flex; align-items: center; gap: 30px; padding: 0 64px 0 30px; box-sizing: border-box;
        border-radius: 44px; transform-origin: 0% 100%;
        background:
          linear-gradient(150deg, rgba(255,255,255,0.26) 0%, rgba(255,255,255,0.08) 42%, rgba(var(--cobalt-rgb),0.16) 100%),
          rgba(18, 22, 40, 0.28);
        border: var(--rim) solid rgba(255,255,255,0.42);
        box-shadow: 0 24px 60px rgba(0,0,0,0.30), inset 0 1.5px 0 rgba(255,255,255,0.45), inset 0 -18px 40px rgba(var(--cobalt-rgb),0.12);
        -webkit-backdrop-filter: blur(22px) saturate(1.3); backdrop-filter: blur(22px) saturate(1.3);
      }
      #sanji-t2-lower-third-name .ava { position: relative; width: 112px; height: 112px; flex: none; }
      #sanji-t2-lower-third-name .ava .disc {
        position: absolute; inset: 10px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.34), rgba(255,255,255,0.10) 60%, rgba(var(--cobalt-rgb),0.25));
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-display); font-weight: var(--wt-heavy); font-size: 34px; letter-spacing: -0.02em; color: var(--white);
      }
      #sanji-t2-lower-third-name .ava svg { position: absolute; inset: 0; overflow: visible; transform: rotate(-90deg); }
      #sanji-t2-lower-third-name .txt { position: relative; display: flex; flex-direction: column; gap: 8px; padding-bottom: 6px; }
      #sanji-t2-lower-third-name .name {
        font-family: var(--font-display); font-weight: var(--wt-heavy); font-size: 52px; line-height: 1;
        letter-spacing: var(--track-tight); color: var(--white); white-space: nowrap;
        text-shadow: 0 2px 14px rgba(0,0,0,0.25);
      }
      #sanji-t2-lower-third-name .role {
        font-family: var(--font-body); font-weight: 500; font-size: 28px; line-height: 1.1;
        letter-spacing: var(--track-ui); color: var(--white-soft); white-space: nowrap;
      }
      #sanji-t2-lower-third-name .accent {
        position: absolute; left: 0; right: 0; bottom: -14px; height: 3px; border-radius: 2px;
        background: linear-gradient(90deg, var(--cobalt-lift), var(--sky-2));
        box-shadow: 0 0 14px rgba(var(--cobalt-rgb),0.9), 0 0 4px rgba(32,160,245,0.8);
        transform-origin: 0% 50%;
      }
    </style>
  </head>
  <body>
    <div id="sanji-t2-lower-third-name" data-composition-id="sanji-t2-lower-third-name" data-start="0" data-width="1920" data-height="1080">
      <div class="card">
        <div class="ava">
          <div class="disc"></div>
          <svg viewBox="0 0 112 112" fill="none"><circle class="ring" cx="56" cy="56" r="53" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/></svg>
        </div>
        <div class="txt">
          <div class="name" data-slot="name">Maya Chen</div>
          <div class="role" data-slot="role">Head of Motion, Northlight Studio</div>
          <div class="accent"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-t2-lower-third-name";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s);

        const nm = ($(".name").textContent || "").trim().split(/\s+/).filter(Boolean);
        $(".disc").textContent = nm.slice(0, 2).map((p) => p[0].toUpperCase()).join("");

        const ring = $(".ring");
        const L = 2 * Math.PI * 53;
        ring.style.strokeDasharray = L; ring.style.strokeDashoffset = L;

        const tl = gsap.timeline({ paused: true });
        const card = $(".card");
        tl.set($(".disc"), { autoAlpha: 0 }, 0).set($(".accent"), { scaleX: 0 }, 0);

        /* plate slide-up with faked vertical motion blur */
        tl.fromTo(card, { autoAlpha: 0, y: 260, scaleY: 1.08, filter: "blur(12px)" },
                        { autoAlpha: 1, y: 0, scaleY: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0.15)
          .to(card, { y: -10, duration: 4.0, ease: "sine.inOut" }, 0.65);

        /* avatar: disc resolves, ring draws on clockwise */
        tl.fromTo($(".disc"), { autoAlpha: 0, scale: 0.8, filter: "blur(8px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.36, ease: "back.out(1.25)" }, 0.38)
          .to(ring, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 0.45);

        /* name + role resolve */
        TXT.reveal(tl, $(".name"), 0.48);
        TXT.reveal(tl, $(".role"), 0.62, { stagger: 0.03 });

        /* accent line draws L to R */
        tl.to($(".accent"), { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 0.78);

        /* exit: sink + dissolve */
        const OUT = 4.1;
        TXT.exit(tl, [$(".name"), $(".role")], OUT - 0.16);
        tl.to(card, { autoAlpha: 0, y: "+=40", filter: "blur(10px)", duration: 0.36, ease: "power2.in" }, OUT)
          .set({}, {}, OUT + 0.4);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
