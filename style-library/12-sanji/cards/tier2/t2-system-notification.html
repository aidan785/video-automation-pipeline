<!doctype html>
<!--
  SANJI · tier2 · label · SYSTEM NOTIFICATION
  A small blue-screen toast in the top-right corner, drawn with box-drawing
  characters (references/system s01-s03 type, s12 chip). It pops in from a
  lone white cell that unrolls leftward column by column (noise glyphs on the
  leading column), the title row fills in inverse, one message line types,
  an ASCII progress bar fills and an [ OK ] chip flickers on. Holds, then the
  whole toast decays to glyphs on a ragged front ($ # % c + : .) drifting up
  and out. Transparent everywhere except the toast (sits over footage).
  Slots: title (<= 16), time (<= 6), message (<= 30), done (<= 6, chip text).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t2-system-notification {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: transparent; font-family: var(--font-term);
      }
      #sanji-t2-system-notification canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #sanji-t2-system-notification .term { filter: drop-shadow(0 0 4px rgba(225,232,255,0.5)); }
      #sanji-t2-system-notification .src { display: none; }
    </style>
  </head>
  <body>
    <div id="sanji-t2-system-notification" data-composition-id="sanji-t2-system-notification" data-start="0" data-width="1920" data-height="1080">
      <canvas class="ground"></canvas>
      <canvas class="term"></canvas>
      <div class="src">
        <span data-slot="title">AGENT : NOTICE</span>
        <span data-slot="time">now</span>
        <span data-slot="message">Rough cut is ready to review</span>
        <span data-slot="done">OK</span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>

        const ROOT = document.getElementById(ID);
