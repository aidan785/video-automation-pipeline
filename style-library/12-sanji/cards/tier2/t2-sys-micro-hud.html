          /* frame counter + lock percent under the box, right aligned */
          const fr = `/* frame ${String(frame(t) + 24).padStart(3, "0")} */`;
          label(fr, R - fr.length * ADV, bot, T_L + f(6), 9);
          const lp = Math.round(100 * eio(c01((t - (T_L + f(8))) / 1.0)));
          const lk = `lock >> ${String(lp).padStart(3, " ")}%`;
          label(lk, R - lk.length * ADV, bot + LH, T_L + f(8), 11);
          label(lp >= 100 ? "[ OK ]" : "[ .. ]", B.x, bot + LH, T_L + f(8), 13);

          /* right leader from the top-right region to the inverse chip */
          const ly = Math.round(B.y + 64), lx0 = R + 16, lx1 = R + 150;
          leader(lx0, ly, lx1, ly, T_L + f(10), 21);
          chip(CHIP, lx1 + 8, ly - 8, T_L + f(10) + f(Math.ceil(134 / 24)), 23);
          label(`trk 03  ${String(Math.round(tq * 24 * 1.7) % 1000).padStart(3, "0")}ms`, lx1 + 8, ly + LH + 4, T_L + f(16), 25, { alpha: 0.8 });

          /* left leader into a small id stack */
          const ly2 = Math.round(B.y + B.h * 0.62), sx = B.x - 230;
          leader(B.x - 16, ly2, sx + 13 * ADV, ly2, T_L + f(12), 31);
          label(`id ${IDV}`, sx, ly2 - LH * 1.5, T_L + f(16), 35);
          label(`w:${Math.round(B.w)} h:${Math.round(B.h)}`, sx, ly2 - LH * 0.5, T_L + f(18), 37, { alpha: 0.8 });
          label(`>> ${String(Math.round(cp * 37 + (cp >= 1 ? hash(frame(t) >> 2, 3, 5) * 4 : 0))).padStart(2, "0")} pts`, sx, ly2 + LH * 0.5, T_L + f(20), 39, { alpha: 0.8 });
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) {
          document.fonts.load(MF).then(() => draw(P.t), () => {});
          document.fonts.ready.then(() => draw(P.t));
        }
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
