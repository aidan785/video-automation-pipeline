<!doctype html>
<!--
  SANJI · tier2 · stat · BADGE COUNTER
  An app icon tile (white rounded squircle with a cobalt envelope glyph) pops
  out of blur in the upper-left third. An ember count badge pops onto its
  top-right corner and the number ticks up fast (accelerating, then easing
  into the final value). Every tick nudges the badge (tiny scale kick), the
  badge grows leftward as digits are added. On the final value the badge
  blooms: an ember glow pulse plus a soft ring off its rim. A caption resolves
  beside the tile. Everything dissolves with blur on the way out.
  Slots: count (integer, <=4 digits; ticks from a low number), label (<=22).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t2-badge-counter {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: transparent; font-family: var(--font-body); color: var(--white);
      }
      #sanji-t2-badge-counter .grp { position: absolute; left: 170px; top: 150px; }
      #sanji-t2-badge-counter .tile {
        position: relative; width: 190px; height: 190px; border-radius: 48px; box-sizing: border-box;
        background: linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
        box-shadow: 0 26px 60px rgba(0,0,0,0.32), 0 3px 10px rgba(0,0,0,0.14), inset 0 -6px 18px rgba(0,0,0,0.05), inset 0 1.5px 0 rgba(255,255,255,1);
        display: flex; align-items: center; justify-content: center;
      }
      #sanji-t2-badge-counter .tile svg { display: block; }
      #sanji-t2-badge-counter .badge {
        position: absolute; right: -30px; top: -30px; height: 78px; min-width: 78px; box-sizing: border-box;
        padding: 0 22px; border-radius: var(--r-pill);
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(120% 120% at 30% 20%, var(--ember-hot) 0%, var(--ember) 55%, var(--ember-glow) 100%);
        border: 3px solid rgba(255,255,255,0.95);
        box-shadow: 0 8px 22px rgba(var(--ember-rgb), 0.45), 0 2px 6px rgba(0,0,0,0.2);
        font-family: var(--font-display); font-weight: var(--wt-heavy); font-size: 42px; letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums; transform-origin: 70% 30%;
      }
      #sanji-t2-badge-counter .bloom {
        position: absolute; right: -80px; top: -80px; width: 180px; height: 180px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,179,71,0.85) 0%, rgba(var(--ember-rgb),0.45) 35%, rgba(var(--ember-rgb),0) 70%);
        filter: blur(6px); opacity: 0;
      }
      #sanji-t2-badge-counter .ring {
        position: absolute; right: -30px; top: -30px; width: 78px; height: 78px; border-radius: 50%;
        border: 2.5px solid rgba(255,190,110,0.9); opacity: 0; box-sizing: border-box;
      }
      #sanji-t2-badge-counter .lab {
        position: absolute; left: 250px; top: 50px; white-space: nowrap;
        text-shadow: 0 2px 24px rgba(0,0,0,0.35), 0 1px 3px rgba(0,0,0,0.18);
      }
      #sanji-t2-badge-counter .lab .k { font-family: var(--font-display); font-weight: var(--wt-heavy); font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--white-soft); }
      #sanji-t2-badge-counter .lab .v { margin-top: 4px; font-weight: var(--wt-bold); font-size: 48px; letter-spacing: var(--track-tight); }
    </style>
  </head>
  <body>
    <div id="sanji-t2-badge-counter" data-composition-id="sanji-t2-badge-counter" data-start="0" data-width="1920" data-height="1080">
      <div class="grp">
        <div class="tile">
          <svg width="112" height="112" viewBox="0 0 24 24"><rect x="2" y="4.5" width="20" height="15" rx="3.2" fill="#2042EE"/><path d="M3.2 6.4l8.8 6.6 8.8-6.6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div class="bloom"></div>
          <div class="ring"></div>
          <div class="badge"><span class="num" data-slot="count">200</span></div>
        </div>
        <div class="lab"><div class="k">Inbox</div><div class="v" data-slot="label">Client inquiries</div></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-t2-badge-counter";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s);
        const tile = $(".tile"), badge = $(".badge"), num = $(".num"), lab = $(".lab");
        const FINAL = parseInt(num.textContent.replace(/[^0-9]/g, ""), 10) || 200;
        const START = Math.max(1, Math.min(3, FINAL - 1));
        num.textContent = String(START);

        const tl = gsap.timeline({ paused: true });
        tl.set([tile, badge], { autoAlpha: 0 }, 0);

        /* tile pops out of blur */
        tl.fromTo(tile, { autoAlpha: 0, scale: 0.86, y: 18, filter: "blur(12px)" },
                        { autoAlpha: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "back.out(1.25)" }, 0.15);
        /* badge pops onto the corner */
        tl.fromTo(badge, { autoAlpha: 0, scale: 0.4, filter: "blur(8px)" },
                         { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.36, ease: "back.out(1.4)" }, 0.62);
        /* caption resolves */
        TXT.block(tl, lab.querySelector(".k"), 0.75);
        TXT.reveal(tl, lab.querySelector(".v"), 0.85);

        /* ticks: discrete steps (deterministic), sine-in-out spacing so it races then eases in */
        const T0 = 1.15, TD = 1.7, N = 16;
        for (let k = 1; k <= N; k++) {
          const p = k / N;
          const tt = T0 + TD * (0.5 - 0.5 * Math.cos(Math.PI * Math.pow(p, 0.8)));   /* fast middle, soft landing */
          const val = Math.round(START + (FINAL - START) * (1 - Math.pow(1 - p, 2.2)));
          tl
            .set(num, { textContent: String(val) }, tt)
            .fromTo(badge, { scale: k === N ? 1.22 : 1.1 }, { scale: 1, duration: k === N ? 0.45 : 0.14, ease: k === N ? "back.out(1.3)" : "power2.out", immediateRender: false }, tt);
        }
        /* back-fill: before the first tick the start value shows */
        tl.set(num, { textContent: String(START) }, 0.01);

        /* bloom on landing */
        const LAND = T0 + TD;
        tl.fromTo($(".bloom"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1.15, duration: 0.3, ease: "expo.out", immediateRender: false }, LAND)
          .to($(".bloom"), { opacity: 0, scale: 1.4, duration: 0.8, ease: "power2.out" }, LAND + 0.3)
          .fromTo($(".ring"), { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 2.4, duration: 0.85, ease: "expo.out", immediateRender: false }, LAND + 0.04)
          .to(badge, { boxShadow: "0 0 0 6px rgba(255,179,71,0.25), 0 0 40px rgba(255,122,26,0.85), 0 2px 6px rgba(0,0,0,0.2)", duration: 0.25, ease: "power2.out" }, LAND)
          .to(badge, { boxShadow: "0 0 0 14px rgba(255,179,71,0), 0 8px 22px rgba(255,122,26,0.45), 0 2px 6px rgba(0,0,0,0.2)", duration: 0.8, ease: "power2.out" }, LAND + 0.25);

        /* hold, then exit */
        const OUT = LAND + 1.7;
        tl.to(ROOT.querySelector(".grp"), { autoAlpha: 0, y: -12, filter: "blur(10px)", duration: 0.36, ease: "power2.in" }, OUT)
          .set({}, {}, OUT + 0.45);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
