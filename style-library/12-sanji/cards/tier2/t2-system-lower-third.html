  talking-head footage. A flat blue-screen panel opens at lower left from one
  white cell, stepping wider on the cell grid. Inside it: a "/* name */"

  ASCII doodles stepping on the grid to the right. Exit: every letter decays
  down the ramp (letter > % > : > .) on a ragged front, then the panel folds
  back to a cell. Everything outside the panel is transparent.
