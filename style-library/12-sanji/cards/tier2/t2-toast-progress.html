<!doctype html>
<!--
  SANJI · tier2 · callout · TOAST PROGRESS
  A dark liquid-glass toast pill rises out of blur in the lower-left third:
  a white spinner arc + "Rendering..." + a thin progress track whose cobalt
  fill eases to 100% while a mono percentage counts up. On completion the
  spinner resolves into a cobalt check badge, the label swaps to "Exported"
  (blur resolve), the track and percentage dissolve and the pill MORPHS
  narrower to hug the new label. A soft white flash washes across the pill and
  a thin white ring breathes off its rim. Exit: dissolve down with blur.
  Slots: working (<=16), done (<=16).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t2-toast-progress {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: transparent; font-family: var(--font-body); color: var(--white);
      }
      #sanji-t2-toast-progress .toast {
        position: absolute; left: 280px; bottom: 120px; width: 640px; height: 96px; box-sizing: border-box;
        border-radius: var(--r-pill);
        background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02) 60%), rgba(22,22,32,0.52);
        border: 1px solid rgba(255,255,255,0.26);
        box-shadow: 0 20px 56px rgba(0,0,0,0.30), 0 2px 8px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.2);
        -webkit-backdrop-filter: blur(20px) saturate(1.25); backdrop-filter: blur(20px) saturate(1.25);
        transform-origin: 0% 50%;
      }
      #sanji-t2-toast-progress .clip { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; }
      #sanji-t2-toast-progress .flash {
        position: absolute; top: 0; bottom: 0; left: 0; width: 70%; opacity: 0;
        background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.7) 50%, rgba(255,255,255,0));
        filter: blur(8px);
      }
      #sanji-t2-toast-progress .ring {
        position: absolute; inset: -2px; border-radius: var(--r-pill); border: 2px solid rgba(255,255,255,0.8); opacity: 0;
      }
      #sanji-t2-toast-progress .ic { position: absolute; left: 22px; top: 22px; width: 52px; height: 52px; }
      #sanji-t2-toast-progress .spin { position: absolute; inset: 0; }
      #sanji-t2-toast-progress .spin svg { display: block; }
      #sanji-t2-toast-progress .chk {
        position: absolute; inset: 0; border-radius: 50%; box-sizing: border-box;
        background: var(--glass-fill-active), var(--cobalt); border: var(--rim) solid rgba(255,255,255,0.7);
        box-shadow: 0 0 24px rgba(var(--cobalt-rgb), 0.55), inset 0 1.5px 0 rgba(255,255,255,0.45);
        display: flex; align-items: center; justify-content: center;
      }
      #sanji-t2-toast-progress .lab {
        position: absolute; left: 96px; top: 0; height: 96px; display: flex; align-items: center; white-space: nowrap;
        font-weight: var(--wt-ui); font-size: 32px; letter-spacing: var(--track-ui);
      }
      #sanji-t2-toast-progress .track {
        position: absolute; left: 372px; top: 45px; width: 160px; height: 6px; border-radius: 3px;
        background: rgba(255,255,255,0.16); overflow: hidden;
      }
      #sanji-t2-toast-progress .bar {
        position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 3px; transform-origin: 0% 50%;
        background: linear-gradient(90deg, rgba(var(--cobalt-rgb),1), var(--volt-soft));
        box-shadow: 0 0 12px rgba(var(--volt-rgb), 0.8);
      }
      #sanji-t2-toast-progress .pct {
        position: absolute; right: 30px; top: 0; height: 96px; display: flex; align-items: center;
        font-family: var(--font-mono); font-size: 24px; color: var(--white-soft);
      }
    </style>
  </head>
  <body>
    <div id="sanji-t2-toast-progress" data-composition-id="sanji-t2-toast-progress" data-start="0" data-width="1920" data-height="1080">
      <div class="toast">
        <div class="ring"></div>
        <div class="clip"><div class="flash"></div></div>
        <div class="ic">
          <div class="spin"><svg width="52" height="52" viewBox="0 0 52 52" fill="none" stroke-linecap="round"><circle cx="26" cy="26" r="19" stroke="rgba(255,255,255,0.18)" stroke-width="4.5"/><path d="M26 7a19 19 0 0 1 19 19" stroke="#FFFFFF" stroke-width="4.5"/></svg></div>
          <div class="chk"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path class="tick" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        </div>
        <div class="lab l1" data-slot="working">Rendering...</div>
        <div class="lab l2" data-slot="done">Exported</div>
        <div class="track"><div class="bar"></div></div>
        <div class="pct">0%</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-t2-toast-progress";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s);
        const toast = $(".toast"), l1 = $(".l1"), l2 = $(".l2"), pct = $(".pct"), tick = $(".tick");
        const TL_ = tick.getTotalLength(); tick.style.strokeDasharray = TL_; tick.style.strokeDashoffset = TL_;

        const tl = gsap.timeline({ paused: true });
        tl.set(toast, { autoAlpha: 0 }, 0).set([$(".chk"), l2], { autoAlpha: 0 }, 0).set($(".bar"), { scaleX: 0 }, 0);

        /* rise in */
        tl.fromTo(toast, { autoAlpha: 0, y: 40, scale: 0.94, filter: "blur(12px)" },
                         { autoAlpha: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.2)" }, 0.15)
          .set(toast, { filter: "none" }, 0.66)
;
        /* contents rise in as blocks on the house curve (label is one word; % is a live counter) */
        TXT.block(tl, [$(".ic"), l1, $(".track"), pct], 0.3, { stagger: 0.06 });

        /* spinner: finite rotation, decelerates into the completion */
        const P0 = 0.6, DONE = 2.9;
        tl.fromTo($(".spin"), { rotation: 0 }, { rotation: 900, duration: DONE - P0 + 0.1, ease: "power1.inOut" }, P0 - 0.3);

        /* progress: eased fill, stepped feel via power2.inOut, mono % count */
        tl.to($(".bar"), { scaleX: 1, duration: DONE - P0, ease: "power2.inOut" }, P0);
        const pr = { v: 0 };
        tl.fromTo(pr, { v: 0 }, { v: 100, duration: DONE - P0, ease: "power2.inOut", onUpdate: () => { pct.textContent = Math.round(pr.v) + "%"; } }, P0);

        /* completion: spinner -> check, label swap, track dissolves, pill hugs the new label */
        tl.to($(".spin"), { autoAlpha: 0, scale: 0.6, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DONE)
          .fromTo($(".chk"), { autoAlpha: 0, scale: 0.6, filter: "blur(8px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.38, ease: "back.out(1.3)" }, DONE + 0.08)
          .to(tick, { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, DONE + 0.2)
          .to([l1, $(".track"), pct], { autoAlpha: 0, filter: "blur(8px)", duration: 0.22, ease: "power2.in" }, DONE)
          .fromTo(l2, { autoAlpha: 0, y: 18, filter: "blur(6px)" }, { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: TXT.EASE, immediateRender: false }, DONE + 0.16)
          .to(toast, { width: () => 96 + l2.offsetWidth + 40, duration: 0.5, ease: "expo.out" }, DONE + 0.1)
          /* soft white flash sweeps the glass + a rim ring breathes out */
          .fromTo($(".flash"), { opacity: 0, xPercent: -110 }, { opacity: 1, xPercent: 160, duration: 0.6, ease: "power2.inOut" }, DONE + 0.12)
          .to($(".flash"), { opacity: 0, duration: 0.2 }, DONE + 0.55)
          .fromTo($(".ring"), { opacity: 0.7, scale: 1 }, { opacity: 0, scale: 1.12, duration: 0.7, ease: "expo.out", immediateRender: false }, DONE + 0.2)
          .to($(".chk"), { boxShadow: "0 0 34px rgba(255,255,255,0.55), inset 0 1.5px 0 rgba(255,255,255,0.45)", duration: 0.2, ease: "power2.out" }, DONE + 0.22)
          .to($(".chk"), { boxShadow: "0 0 18px rgba(32,66,238,0.45), inset 0 1.5px 0 rgba(255,255,255,0.45)", duration: 0.6, ease: "power2.out" }, DONE + 0.42);

        /* hold, exit */
        const OUT = DONE + 1.9;
        tl.to(toast, { autoAlpha: 0, y: 24, filter: "blur(10px)", duration: 0.36, ease: "power2.in" }, OUT)
          .set({}, {}, OUT + 0.45);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
