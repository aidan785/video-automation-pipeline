<!doctype html>
<!--
  SANJI · tier2 · caption · SYSTEM CAPTION
  references/system s12, s24 (chip + terminal type), transparent overlay for
  talking-head footage. A flat blue-screen bar opens at lower center from one
  lone white cell, stepping wider cell by cell with a ragged glyph edge. A thin
  "/*" comment marker sits on its left. The phrase types in word group by word
  group (each group scrambles over 2 frames, noise tail riding the edge); the
  key word lands inside an inverse chip that flickers on. Exit: the letters
  decay down the ramp (letter > % > : > .) on a ragged front and the bar
  collapses back to a cell. Everything outside the bar is transparent.
  Slots: text (text, <= 48 chars, one line), key (text, one word of the text
  to chip, optional), group (number of words per group, 1-3, default 2).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t2-system-caption {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: transparent; font-family: var(--font-term);
      }
      #sanji-t2-system-caption canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #sanji-t2-system-caption .glow { filter: drop-shadow(0 0 4px rgba(225,232,255,0.45)); }
      #sanji-t2-system-caption .src { display: none; }
    </style>
  </head>
  <body>
    <div id="sanji-t2-system-caption" data-composition-id="sanji-t2-system-caption" data-start="0" data-width="1920" data-height="1080">
      <canvas class="cap"></canvas>
      <div class="src">
        <span data-slot="text">Cut the dead air without touching a timeline</span>
        <span data-slot="key">dead</span>
        <span data-slot="group">2</span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

/* @ascii-engine:start v1 */
/* SANJI · SYSTEM canvas · ASCII engine (single source of truth).

      /* write a string into the grid. col/row in cells; inv = inverse-video chip */

        const gain = o.gain == null ? 1 : o.gain, floor = o.floor == null ? 0.06 : o.floor;
        const aMin = o.alphaMin == null ? 0.38 : o.alphaMin, aMax = o.alphaMax == null ? 1 : o.alphaMax;
        const seed = o.seed || 11, f = frame(t), R = o.ramp || ramp, N = R.length - 1;

        const B = 8, buckets = Array.from({ length: B }, () => []);

          for (const k of inv) ctx.fillRect((k % cols) * cw, Math.floor(k / cols) * ch, cw, ch);

  }

  /* ---- grayscale paint helpers (draw onto F.src inside F.paint) ---------- */
  /* spinning coin: angle in radians around the vertical axis. Generic face
     (rim + inner ring + diagonal sheen bands); pass a glyph string for the face. */
  function coin(g, x, y, R, angle, o = {}) {
    const sx = Math.cos(angle), w = Math.max(R * 0.07, Math.abs(sx) * R);

    const face = o.face == null ? 0.3 : o.face;
    g.save(); g.translate(x, y);

    if (thick > 0.5) { g.fillStyle = `rgba(255,255,255,${o.edge || 0.8})`; g.beginPath(); g.ellipse(Math.sign(Math.sin(angle)) * thick * 0.5, 0, w, R, 0, 0, 6.2832); g.fill(); }

        const ID = "sanji-t2-system-caption";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s);
        const { c01, hash, frame, NOISE } = SYS;
        const f = (n) => n / 24;
        const slot = (n) => $(`[data-slot="${n}"]`).textContent.replace(/\s+/g, " ").trim();
        const TEXT = slot("text"), KEY = slot("key").toLowerCase(), GROUP = Math.max(1, Math.min(3, parseInt(slot("group"), 10) || 2));
        const INK = "243,245,255", BLUE = getComputedStyle(ROOT).getPropertyValue("--sys-blue").trim() || "#0F18FB";
        const RAMPDOWN = "%+:.";

        const PAD = 2;                                     /* cells of padding each side */
        const NC = TEXT.length + PAD * 2;                  /* bar width in cells */
        const BW = NC * CELL, BH = Math.round(SIZE * 2.1);
        const BX = Math.round(960 - BW / 2), BY = 1080 - 150 - BH;
        const TY = BY + Math.round((BH - SIZE * 1.12) / 2);

        const T_DONE = T_TXT + (groups.length - 1) * G_STEP + G_D;
        const keyW = words.find((w) => w.key);
        const T_FLICK = keyW ? Math.max(...Array.from({ length: keyW.w.length }, (_, k) => charAt[keyW.i0 + k])) + f(2) : 1e9;

        const g = cv.getContext("2d");

        const MF = '600 22px "IBM Plex Mono", "JetBrains Mono", monospace';

        function chipOn(t) { if (t < T_FLICK) return false; const fr = frame(t - T_FLICK); return fr < 12 ? fr % 4 < 2 : true; }

        function draw(t) {

          /* bar width in cells: opens from one cell, collapses back on exit */
          let cells;
          if (t < T_BAR) cells = 0;
          else if (t < T_BAR + BAR_D) cells = Math.max(1, Math.round(c01((frame(t - T_BAR) + 1) / (BAR_D * 24)) * NC));
          else cells = NC;

          if (t >= T_OUT + OUT_D) cells = 0;
