<!doctype html>
<!--
  SANJI · tier2 · stat · STAT + APP ICON
  A file-style app icon (deep indigo rounded tile, lavender rim, 2-letter
  monogram + tiny sub-label) glass-pops in the left third while a huge white
  number ticks up in the right third and lands with a soft glow bloom. On the
  way out both dissolve to transparent with blur, and the number keeps ticking
  a few more digits while it fades (the "it keeps counting" read).
  Slots: badge (<=2), sub (<=4), prefix (<=2), value (number, <=6 chars incl. commas).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-t2-stat-icon {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: transparent;
      }
      /* app icon */
      #sanji-t2-stat-icon .icon {
        position: absolute; left: 380px; top: 330px; width: 200px; height: 236px;
        transform-origin: 50% 60%;
      }
      #sanji-t2-stat-icon .icon .tile {
        position: absolute; inset: 0; border-radius: 34px; box-sizing: border-box;
        background:
          radial-gradient(120% 80% at 30% 18%, rgba(255,255,255,0.16), rgba(255,255,255,0) 60%),
          linear-gradient(165deg, color-mix(in srgb, var(--cobalt-ink) 78%, var(--volt-soft)) 0%, var(--cobalt-ink) 45%, color-mix(in srgb, var(--cobalt-ink) 55%, var(--void)) 100%);
        border: 3px solid color-mix(in srgb, var(--volt-soft) 55%, var(--dormant));
        box-shadow: 0 0 34px rgba(140,150,255,0.35), 0 18px 50px rgba(0,0,0,0.35), inset 0 2px 0 rgba(255,255,255,0.22);
      }
      /* folded page corner */
      #sanji-t2-stat-icon .icon .fold {
        position: absolute; right: -1px; top: -1px; width: 48px; height: 48px;
        border-top-right-radius: 34px;
        background: linear-gradient(225deg, rgba(255,255,255,0) 50%, color-mix(in srgb, var(--volt-soft) 45%, var(--dormant)) 50%, color-mix(in srgb, var(--volt-soft) 30%, var(--cobalt-ink)) 100%);
        clip-path: polygon(0 0, 100% 100%, 0 100%);
        opacity: 0.85;
      }
      #sanji-t2-stat-icon .icon .mono {
        position: absolute; left: 0; right: 0; top: 34px; text-align: center;
        font-family: var(--font-body); font-weight: var(--wt-bold); font-size: 92px; letter-spacing: -0.03em; line-height: 1;
        color: color-mix(in srgb, var(--volt-soft) 55%, var(--white));
        text-shadow: 0 0 18px rgba(160,170,255,0.45);
      }
      #sanji-t2-stat-icon .icon .sub {
        position: absolute; left: 0; right: 0; bottom: 30px; text-align: center;
        font-family: var(--font-body); font-weight: var(--wt-ui); font-size: 40px; letter-spacing: 0; line-height: 1;
        color: var(--white);
      }
      /* number */
      #sanji-t2-stat-icon .stat {
        position: absolute; right: 120px; top: 300px; height: 300px;
        display: flex; align-items: center; justify-content: flex-end;
      }
      #sanji-t2-stat-icon .bloom {
        position: absolute; left: -10%; right: -10%; top: 10%; bottom: 10%;
        background: radial-gradient(closest-side, rgba(255,255,255,0.34), rgba(255,255,255,0.10) 55%, rgba(255,255,255,0) 100%);
        filter: blur(28px); opacity: 0;
      }
      #sanji-t2-stat-icon .num {
        position: relative; white-space: nowrap;
        font-family: var(--font-display); font-weight: var(--wt-heavy); font-size: 210px; line-height: 1;
        letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: var(--white);
        text-shadow: 0 2px 24px rgba(0,0,0,.30), 0 0 40px rgba(255,255,255,0.25);
      }
    </style>
  </head>
  <body>
    <div id="sanji-t2-stat-icon" data-composition-id="sanji-t2-stat-icon" data-start="0" data-width="1920" data-height="1080">
      <div class="icon">
        <div class="tile"></div>
        <div class="fold"></div>
        <div class="mono" data-slot="badge">Ae</div>
        <div class="sub" data-slot="sub">AEP</div>
      </div>
      <div class="stat">
        <div class="bloom"></div>
        <div class="num"><span class="pre" data-slot="prefix">$</span><span class="val" data-slot="value">932</span></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-t2-stat-icon";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s);
        const icon = $(".icon"), stat = $(".stat"), num = $(".num"), val = $(".val"), bloom = $(".bloom");

        /* parse the value slot; keep comma grouping if the copy used it */
        const raw = (val.textContent || "0").trim();
        const commas = raw.includes(",");
        const END_V = parseInt(raw.replace(/[^0-9]/g, ""), 10) || 0;
        const fmt = (v) => { const n = Math.round(v); return commas ? n.toLocaleString("en-US") : String(n); };
        const START_V = Math.round(END_V * 0.62);
        const EXTRA = Math.max(3, Math.round(END_V * 0.008));   /* keeps ticking while it fades */
        val.textContent = fmt(START_V);

        const tl = gsap.timeline({ paused: true });
        tl.set(icon, { autoAlpha: 0 }, 0);

        /* 1. app icon glass-pops in the left third */
        tl.fromTo(icon,
          { autoAlpha: 0, scale: 0.88, filter: "blur(10px)", y: 10 },
          { autoAlpha: 1, scale: 1, filter: "blur(0px)", y: 0, duration: 0.42, ease: "back.out(1.25)" }, 0.15);

        /* 2. the number resolves out of blur and ticks up */
        const N0 = 0.32, TICK = 0.9;
        TXT.block(tl, num, N0, { blur: 6 });   /* number rises on the house curve; the count-up below is the move */
        const p = { v: START_V };
        tl.fromTo(p, { v: START_V }, { v: END_V, duration: TICK, ease: "power2.out", onUpdate: () => { val.textContent = fmt(p.v); } }, N0);

        /* 3. lands: soft glow bloom behind it */
        const LAND = N0 + TICK;
        tl.fromTo(bloom, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1.05, duration: 0.3, ease: "power2.out" }, LAND - 0.08)
          .to(bloom, { opacity: 0.35, scale: 1, duration: 0.9, ease: "sine.inOut" }, LAND + 0.22);

        /* 4. hold, then dissolve with blur while the number keeps counting */
        const OUT = LAND + 1.9, X = 0.35;
        const q = { v: END_V };
        tl.fromTo(q, { v: END_V }, { v: END_V + EXTRA, duration: X + 0.1, ease: "none", onUpdate: () => { val.textContent = fmt(q.v); } }, OUT - 0.1)
          .to([icon, num], { autoAlpha: 0, filter: "blur(8px)", duration: X, ease: "power2.in" }, OUT)
          .to(bloom, { opacity: 0, duration: X, ease: "power2.in" }, OUT)
          .set({}, {}, OUT + X + 0.05);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
