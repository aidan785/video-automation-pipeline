              g.font = MF(gl); g.textAlign = "center"; g.textBaseline = "middle";
              g.fillText(RAMP[idx], b.cx, b.cy + (S >= 48 ? 3 : 1));
            }
            /* micro value labels from 48px up */
            if (S >= 96 || (S >= 48 && (v > 0.05 || ((b.i + b.j) & 1) === 0))) {
              const lab = "L." + String(Math.min(99, Math.round((sys ? 0.06 + v * 0.9 : 1 - v) * 99))).padStart(2, "0");
              const id = "0x" + (((b.j + 12) * 21 + b.i + 10) & 255).toString(16).toUpperCase().padStart(2, "0");
              const scr = swAge >= 0 && swAge < f(3);
              g.font = MF(14); g.textAlign = "left"; g.textBaseline = "top";
              g.fillStyle = sys ? `rgba(${INK},0.72)` : "rgba(28,28,30,0.55)";
              if (v > 0.55 && !sys) g.fillStyle = "rgba(255,255,255,0.8)";
              g.fillText(scr ? scramble(lab, swAge / f(3), t, b.i * 7 + b.j, 3) : lab, b.x + 6, b.y + 5);
              if (S >= 96) { g.textAlign = "right"; g.textBaseline = "bottom"; g.fillText(scr ? SYS.noiseStr(4, t, b.i + b.j * 13) : id, b.x + S - 6, b.y + S - 4); }
            }
          }
          /* ---- bottom readout: resolution chip row + frame counter (rides the edge, clears before B) ---- */
          const sysUI = t >= T_SW + SW_D * 0.5;
          const ink = sysUI ? `rgb(${INK})` : INKP, gnd = sysUI ? BLUE : PAPER;
          g.font = MF(16); g.textBaseline = "middle"; g.textAlign = "left";
          let x = 40; const y = 1046;
          const put = (s, inv) => {
            const w = s.length * 9.65 + 12;
            g.fillStyle = inv ? ink : gnd; g.fillRect(x, y - 12, w, 24);
            g.fillStyle = inv ? gnd : ink; g.fillText(s, x + 6, y + 1); x += w + 4;
          };
          const age = t - T_UP;
          put(age < f(3) ? scramble("res", age / f(3), t, 5, 3) : "res", false);
          SIZES.forEach((s, k) => { put(String(s).padStart(2, "0"), s === S); if (k < 3) put(phaseDown ? "<" : ">", false); });
          put("px", false);
          const avgL = L.reduce((a, b) => a + (phaseDown || (S === 96 && t >= swapAt(b)) ? 0.06 + b.b * 0.9 : 1 - b.a), 0) / L.length;
          put(`/* f${String(fr).padStart(3, "0")} :: luma ${avgL.toFixed(2)} :: ${phaseDown ? "system" : sysUI ? "flip" : "paper"} */`, false);
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) document.fonts.ready.then(() => { prep(); buildBlocks(); draw(P.t); });
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
