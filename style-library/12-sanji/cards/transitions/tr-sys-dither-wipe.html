  A diagonal ordered-dither band (Bayer 4x4, seeded ragged edge) sweeps from
  bottom-left to top-right. Ahead of it scene A, a NATURE photo, breaks into
  two-tone blue dither cells driven by its own luminance; inside the band the
  cells turn into ASCII ramp glyphs on blue (dense "#$%" in the hot core);
  behind it the glyphs thin out over scene B, the blue SYSTEM terminal, whose
  log lines land and statement scrambles in as the band passes. Micro labels
  ride the band core ("dither 4x4", "pass 2/3", a percentage, coordinates)
  and clear before B settles. Bridges a NATURE section into a SYSTEM section.
  ~2.6s. Slots: photo (stem in assets/nature, default green-hills),
  b_log ("|" list, 2-4 lines, <= 36 each), b_text (<= 20), b_chip (<= 12).

          for (let i = 0; i < N; i++) {
            const u = (p - diag[i]) / BW;           /* -1 leading edge (over A) .. +1 trailing edge (over B) */
            if (u <= -1 || u >= 1) continue;
            const c = i % COLS, r = (i / COLS) | 0;
            if (u < -0.35) {
              /* A breaks into two-tone blue dither cells, ordered by the Bayer matrix */
              const dens = (u + 1) / 0.65;
              if (bay[i] > dens) continue;
              const on = lumA[i] + (bay[i] - 0.5) * 0.55 > 0.5;
              (on ? inkCells : blueCells).push(i);
            } else if (u < 0.35) {
              /* inside the band: ASCII ramp glyphs on blue, hot dense core */
              blueCells.push(i);
              const core = 1 - Math.abs(u) / 0.35;
              let v = c01(lumA[i] * (1 - c01((u + 0.35) / 0.7)) * 0.75 + core * 0.7 + 0.08);
              let idx = Math.round(v * (RAMP.length - 1));
              if (hash(c, r, fr * 31 + 7) < 0.28) idx += hash(r, c, fr + 7) < 0.5 ? -1 : 1;
              idx = Math.max(1, Math.min(RAMP.length - 1, idx));
              glyphs.push([i, RAMP[idx], 0.55 + v * 0.45]);
            } else {
              /* behind: glyphs thin out on the Bayer order over scene B */
              const dens = 1 - (u - 0.35) / 0.65;
              if (bay[i] > dens) continue;
              const idx = 1 + Math.floor(hash(c, r, fr + 13) * 5);
              glyphs.push([i, RAMP[idx], 0.45 + dens * 0.4]);
            }
          }
          dx.fillStyle = BLUE;
          for (const i of blueCells) dx.fillRect((i % COLS) * CW, ((i / COLS) | 0) * CH, CW, CH);
          dx.fillStyle = `rgba(${INK},0.88)`;
          for (const i of inkCells) dx.fillRect((i % COLS) * CW, ((i / COLS) | 0) * CH, CW, CH);
          for (const [i, ch, a] of glyphs) { dx.fillStyle = `rgba(${INK},${a.toFixed(2)})`; dx.fillText(ch, (i % COLS) * CW, ((i / COLS) | 0) * CH); }
        }

        /* micro labels: ride the band core line (u = 0) at fixed rows */
        const ROWSY = [176, 396, 616, 836];
        function drawMicro(t) {
          mx.clearRect(0, 0, W, H);
          const p = pAt(t), k = c01((t - S0) / (S1 - S0)), fr = frame(t);
          const pass = Math.min(3, 1 + Math.floor(k * 3));
          const tIn = S0 + f(3), tOut = S1 - f(5);
          ROWSY.forEach((y, j) => {
            const x = ((p - (1 - y / H) * KY) / KX) * W + 28;
            if (x < 30 || x > 1720) return;
            const txt = ["dither 4x4", "pass " + pass + "/3", ">> " + pad(k * 100, 2) + "%", "x:" + pad(x) + " y:" + pad(y)][j];
            micro(x, y, lab(txt, t, tIn + j * f(2), tOut, 50 + j), { inv: j === 0 || j === 2 });
          });
          micro(48, 1024, lab("/* bayer 4x4 */ frame " + pad(fr, 3), t, 0.2, tOut + f(2), 61));
          micro(1560, 1024, lab("ramp  .,:-~>*+cC%#$", t, 0.3, tOut + f(2), 62));
        }

        let lastT = 0;
        function draw(t) {
          lastT = t;
          drawB(t); drawBand(t); drawMicro(t);
          img.style.transform = `scale(${(1.0 + 0.02 * c01(t / S1)).toFixed(4)})`;
        }
        const onImg = () => { try { prep(); } catch (e) {} draw(lastT); };
        if (img.complete && img.naturalWidth) onImg(); else img.addEventListener("load", onImg);

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) {
          Promise.all([document.fonts.load(TF), document.fonts.load(MF), document.fonts.load(GF)]).then(() => draw(P.t), () => {});
          document.fonts.ready.then(() => draw(P.t));
        }
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
