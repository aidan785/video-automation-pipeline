          dx.clearRect(0, 0, 1920, 1080);
          const pg = pgAt(t), ps = psAt(t), fr = frame(t);
          /* scene A glyphs: letter > . > o > round dot, slightly ahead of the field */
          if (ps <= 0) {
            dx.textBaseline = "top"; dx.textAlign = "left";
            for (let i = 0; i < GA.length; i++) {
              const c = GA[i];
              const ag = c01((pg - c.o * (1 - W) + 0.05) / (W * 0.8));
              if (ag < 0.22) {
                dx.font = TF;
                if (c.inv) { dx.fillStyle = `rgb(${INK})`; dx.fillRect(c.x - 0.5, c.y - 2, ADV + 1, 38); dx.fillStyle = BLUE; }
                else dx.fillStyle = `rgba(${INK},${c.a})`;
                /* about to go: the glyph re-rolls once before it collapses */
                const ch = ag > 0.12 ? SYS.NOISE[Math.floor(hash(i, fr, 9) * SYS.NOISE.length)] : c.ch;
                dx.fillText(ch, c.x, c.y);
                continue;
              }
              const gx = c.x + ADV / 2, gy = c.y + 18;
              dx.fillStyle = `rgba(${INK},${Math.max(c.a, 0.8)})`;
              if (ag < 0.4 || ag < 0.58) {
                dx.font = DF; dx.textAlign = "center"; dx.textBaseline = "middle";
                dx.fillText(ag < 0.4 ? "." : "o", gx, gy + (ag < 0.4 ? -6 : -2));
                dx.textAlign = "left"; dx.textBaseline = "top";
              } else {
                const r = 4 + eG((ag - 0.58) / 0.42) * 9;
                dx.beginPath(); dx.arc(gx, gy, r, 0, 6.2832); dx.fill();
              }
            }
          }
          /* the halftone field */
          if (pg <= 0 || ps >= 1) return;
          dx.font = DF; dx.textAlign = "center"; dx.textBaseline = "middle";
          for (let i = 0; i < CELLS.length; i++) {
            const c = CELLS[i];
            const a = c01((pg - c.o * (1 - W)) / W);
            if (a <= 0) continue;
            const b = c01((ps - c.o * (1 - W)) / W);
            const sb_ = eS(b); if (sb_ >= 0.995) continue;
            const settle = c01((a - 0.45) / 0.55);
            const hot = Math.min(1, (1 - settle) * 1.1 + Math.min(1, b * 2.2) * 0.85);
            const col = mix(LIFTc, INKc, hot);
            dx.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
            const e = eG(c01((a - 0.22) / 0.78));
            const k = (e < 0.55 ? (e / 0.55) * 0.5 : 0.5 + ((e - 0.55) / 0.45) * 0.5) * (1 - sb_);
            /* glyph stages at both ends of a dot's life */
            if (a < 0.22 || (b > 0 && k < 0.16)) {
              const dotish = b > 0 ? k > 0.07 : a >= 0.11;
              dx.fillText(dotish ? "o" : ".", c.x, c.y + (dotish ? -2 : -6));
              continue;
            }
            dx.beginPath(); dx.arc(c.x, c.y, Math.max(3, RFULL * k), 0, 6.2832); dx.fill();
          }
          dx.textAlign = "left"; dx.textBaseline = "top";
        }

        /* micro labels on the front: fixed angles, radius follows the front */
        const ANG = [-0.62, 0.35, 1.25, 2.2, 2.95, 3.9, 4.75, 5.55];
        function drawMicro(t) {
          mx.clearRect(0, 0, 1920, 1080);
          const pg = pgAt(t), ps = psAt(t), fr = frame(t);
          const growing = t < T_FULL, shrinking = t >= S0;
          const p = shrinking ? ps : pg;
          const R0 = shrinking ? clear(p) : lead(p), R = R0 + (shrinking ? -30 : 26);
          const tIn = shrinking ? S0 + f(2) : G0 + f(3), tOut = shrinking ? S0 + SD - f(8) : T_FULL - f(6);
          if (growing || shrinking) ANG.forEach((ang, i) => {
            const x = CX + Math.cos(ang) * R, y = CY + Math.sin(ang) * R * 0.92;
            if (x < 24 || x > 1760 || y < 24 || y > 1040 || R < 40) return;
            const cid = CELLS[Math.min(CELLS.length - 1, Math.max(0, Math.floor(y / SP) * 81 + Math.floor(x / SP)))].id;
            const txt = [
              "r:" + pad(R0),
              "merge " + pad(p * 100, 2) + "%",
              "0x" + (cid & 0xfff).toString(16).toUpperCase().padStart(3, "0"),
              "x:" + pad(x) + " y:" + pad(y),
              ">> " + pad(p * 100, 2) + "%",
              "/* frame " + pad(fr, 3) + " */",
              "cell " + pad(cid),
              shrinking ? "[ OK ]" : "[ RUN ]",
            ][i];
            micro(mx, x - (Math.cos(ang) < 0 ? txt.length * MADV : 0), y, lab(txt, t, tIn + i * f(1), tOut, 40 + i), { inv: i === 1 || i === 7, a: 0.95, back: true });
          });
          /* the readout at the seeded center: scrambles in as the first dots bloom */
          micro(mx, CX - 40, CY - 64, lab("o:" + pad(CX) + "," + pad(CY), t, G0 - f(4), G0 + 0.35, 71), { a: 0.9 });
          /* held peak: a single inverse chip, dead center of the merged field */
          micro(mx, CX - 45, CY - 10, lab("merge 100%", t, T_FULL - f(3), S0 + f(3), 72), { inv: true });
          /* frame corners: dissolve counters tick on frames, then clear */
          const merged = CELLS.reduce((n, c) => n + (c01((pg - c.o * (1 - W)) / W) > 0.9 && c01((ps - c.o * (1 - W)) / W) < 0.1 ? 1 : 0), 0);
          micro(mx, 48, 1024, lab("/* dot dissolve */ frame " + pad(fr, 3), t, 0.2, S0 + SD - f(6), 73), { a: 0.8 });
          micro(mx, 1648, 1024, lab("cells " + pad(merged) + "/" + pad(CELLS.length), t, 0.3, S0 + SD - f(6), 74), { a: 0.8 });
          micro(mx, 48, 40, lab("sp 24 . W 0.30", t, 0.25, T_FULL, 75), { a: 0.8 });
        }

        function draw(t) {
          bx.clearRect(0, 0, 1920, 1080);
          if (t >= S0) drawStatement(bx, LB, t, T_B, 17);
          drawDots(t);
          drawMicro(t);
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) {
          Promise.all([document.fonts.load(TF), document.fonts.load(MF), document.fonts.load(DF)]).then(() => draw(P.t), () => {});
          document.fonts.ready.then(() => draw(P.t));
        }
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
