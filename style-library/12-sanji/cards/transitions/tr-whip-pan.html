<!doctype html>
<!--
  SANJI · transition · WHIP PAN
  Camera whip between two COBALT glass scenes. Scene A (a lit glass card with
  badge + caps title) holds, then the camera snaps left: the whole strip
  accelerates out (power2.in) under a heavy HORIZONTAL smear (SVG directional
  blur, stdDeviation x only, plus a scaleX stretch), a thin white-hot light
  streak and a softer halo streak race across at the peak, and scene B (two
  glass tiles under a caps title) lands sharp with expo.out. B's contents do a
  last micro blur-resolve after the landing. ~1.1s incl. holds.
  Slots: titleA (caps, <= 14), titleB (caps, <= 16), tileB1 / tileB2 (<= 14).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-tr-whip-pan {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--cobalt); font-family: var(--font-display); color: var(--white);
      }
      #sanji-tr-whip-pan svg.defs { position: absolute; width: 0; height: 0; }
      #sanji-tr-whip-pan .strip { position: absolute; left: 0; top: 0; width: 3840px; height: 1080px; transform-origin: 50% 50%; }
      #sanji-tr-whip-pan .scene { position: absolute; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
      #sanji-tr-whip-pan .scene.a { left: 0; background: radial-gradient(55% 60% at 50% 50%, rgba(255,255,255,0.08), rgba(255,255,255,0) 70%), var(--cobalt); }
      #sanji-tr-whip-pan .scene.b { left: 1920px; background: var(--cobalt-wash); }
      #sanji-tr-whip-pan .scene.b .grid { position: absolute; inset: 0; background: var(--cell-grid); opacity: 0.8; }
      #sanji-tr-whip-pan .ring {
        position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 2px solid rgba(255,255,255,0.07);
        background: radial-gradient(circle, rgba(255,255,255,0) 55%, rgba(255,255,255,0.03) 100%);
      }
      #sanji-tr-whip-pan .g { position: absolute; box-sizing: border-box; border-radius: var(--r-card); }
      #sanji-tr-whip-pan .g > .fill, #sanji-tr-whip-pan .g > .lit { position: absolute; inset: 0; border-radius: inherit; box-sizing: border-box; }
      #sanji-tr-whip-pan .g > .fill { background: var(--glass-fill); border: var(--rim) solid var(--glass-rim); box-shadow: var(--glass-shadow); }
      #sanji-tr-whip-pan .g > .lit  { background: var(--glass-fill-active); border: var(--rim) solid var(--glass-rim-active); box-shadow: var(--glass-shadow-active); }
      #sanji-tr-whip-pan .g > .in { position: absolute; inset: 0; }
      #sanji-tr-whip-pan .badge {
        position: absolute; border-radius: 50%; box-sizing: border-box;
        background: var(--badge-fill); border: var(--rim) solid var(--badge-rim);
        display: flex; align-items: center; justify-content: center;
      }
      /* scene A: one wide lit glass card */
      #sanji-tr-whip-pan .cardA { left: 460px; top: 380px; width: 1000px; height: 320px; }
      #sanji-tr-whip-pan .cardA .badge { left: 52px; top: 52px; width: 216px; height: 216px; }
      #sanji-tr-whip-pan .cardA .ttl {
        position: absolute; left: 320px; top: 0; height: 320px; display: flex; align-items: center;
        font-weight: var(--wt-heavy); font-size: 104px; line-height: 0.9; letter-spacing: var(--track-caps); text-transform: uppercase;
      }
      #sanji-tr-whip-pan .metaA { position: absolute; left: 460px; top: 330px; font-family: var(--font-mono); font-size: 22px; color: var(--white-soft); }
      /* scene B: caps title over two glass tiles */
      #sanji-tr-whip-pan .titleB {
        position: absolute; left: 0; right: 0; top: 210px; text-align: center;
        font-weight: var(--wt-heavy); font-size: var(--size-head); line-height: 0.9; letter-spacing: var(--track-caps); text-transform: uppercase;
      }
      #sanji-tr-whip-pan .tile { top: 360px; width: 380px; height: 380px; border-radius: var(--r-tile); }
      #sanji-tr-whip-pan .tile .badge { left: 34px; top: 34px; width: 132px; height: 132px; }
      #sanji-tr-whip-pan .tile .lab { position: absolute; left: 36px; right: 24px; bottom: 36px; font-family: var(--font-body); font-weight: var(--wt-bold); font-size: 44px; line-height: 1.06; letter-spacing: var(--track-ui); }
      /* light streaks that cross at the peak of the whip */
      #sanji-tr-whip-pan .streak {
        position: absolute; left: -400px; width: 2720px; border-radius: 50%; opacity: 0; pointer-events: none;
      }
      #sanji-tr-whip-pan .streak.core {
        top: 527px; height: 5px;
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 30%, rgba(255,255,255,1) 55%, rgba(220,232,255,0.7) 75%, rgba(255,255,255,0) 100%);
        filter: blur(1px); box-shadow: 0 0 18px rgba(200,215,255,0.9);
      }
      #sanji-tr-whip-pan .streak.halo {
        top: 470px; height: 120px;
        background: linear-gradient(90deg, rgba(160,190,255,0) 0%, rgba(160,190,255,0.20) 35%, rgba(255,255,255,0.40) 55%, rgba(160,190,255,0) 100%);
        filter: blur(26px);
      }
      #sanji-tr-whip-pan .streak.thin {
        top: 612px; height: 2px;
        background: linear-gradient(90deg, rgba(255,255,255,0) 10%, rgba(255,255,255,0.8) 60%, rgba(255,255,255,0) 100%);
      }
    </style>
  </head>
  <body>
    <div id="sanji-tr-whip-pan" data-composition-id="sanji-tr-whip-pan" data-start="0" data-width="1920" data-height="1080">
      <svg class="defs" aria-hidden="true">
        <filter id="sanji-tr-whip-pan-smear" x="-20%" y="0%" width="140%" height="100%" color-interpolation-filters="sRGB">
          <feGaussianBlur class="smear" in="SourceGraphic" stdDeviation="0 0" />
        </filter>
      </svg>

      <div class="strip">
        <div class="scene a">
          <div class="ring" style="width:1500px;height:1500px;margin:-750px 0 0 -750px"></div>
          <div class="ring" style="width:2200px;height:2200px;margin:-1100px 0 0 -1100px"></div>
          <div class="metaA">chapter_02.md</div>
          <div class="g cardA"><div class="fill"></div><div class="lit"></div><div class="in">
            <div class="badge"><svg width="96" height="96" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFFFFF"/><path d="M12 6.5V12h4" fill="none" stroke="#3A46E8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="ttl" data-slot="titleA">Timing</div>
          </div></div>
        </div>

        <div class="scene b">
          <div class="grid"></div>
          <div class="bin">
            <div class="titleB" data-slot="titleB">Motion rules</div>
            <div class="g tile" style="left:540px"><div class="fill"></div><div class="lit"></div><div class="in">
              <div class="badge"><svg width="62" height="62" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M4 19c4 0 4-14 9-14 3 0 4 2 7 2"/><circle cx="4" cy="19" r="1.6" fill="#FFFFFF"/><circle cx="20" cy="7" r="1.6" fill="#FFFFFF"/></svg></div>
              <div class="lab" data-slot="tileB1">Ease every move</div></div></div>
            <div class="g tile" style="left:1000px"><div class="fill"></div><div class="in">
              <div class="badge"><svg width="60" height="60" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M12 2.5l2.2 6.6 6.8.2-5.4 4.2 1.9 6.6L12 16.2 6.5 20.1l1.9-6.6L3 9.3l6.8-.2z"/></svg></div>
              <div class="lab" data-slot="tileB2">One idea per frame</div></div></div>
          </div>
        </div>
      </div>

      <div class="streak halo"></div>
      <div class="streak core"></div>
      <div class="streak thin"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-tr-whip-pan";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => [...ROOT.querySelectorAll(s)];

        const strip = $(".strip"), smear = $("feGaussianBlur.smear");
        const tl = gsap.timeline({ paused: true });
        const W = 0.28;            /* whip starts */
        const OUT = 0.2;           /* accelerate out */
        const LAND = 0.5;          /* decelerate in, expo.out */
        const PEAK = W + OUT;
        const END = PEAK + LAND + 0.52;   /* tile labels land at ~1.45 */

        tl.set(strip, { filter: "url(#sanji-tr-whip-pan-smear)" }, 0);

        /* scene A ambient: card breathes forward a hair while it holds */
        tl.fromTo($(".cardA"), { scale: 0.985 }, { scale: 1.01, duration: W + 0.1, ease: "sine.inOut" }, 0);

        /* the whip: strip travels one frame width left. power2.in out of A,
           expo.out into B so B lands sharp. */
        tl.fromTo(strip, { x: 0 }, { x: -960, duration: OUT, ease: "power2.in" }, W)
          .to(strip, { x: -1920, duration: LAND, ease: "expo.out" }, PEAK);

        /* horizontal smear: x-only gaussian, peaks at the handoff, gone by the landing */
        tl.fromTo(smear, { attr: { stdDeviation: "0 0" } }, { attr: { stdDeviation: "90 0" }, duration: OUT, ease: "power2.in" }, W)
          .to(smear, { attr: { stdDeviation: "0 0" }, duration: LAND * 0.62, ease: "power3.out" }, PEAK)
          .fromTo(strip, { scaleX: 1 }, { scaleX: 1.07, duration: OUT, ease: "power2.in" }, W)
          .to(strip, { scaleX: 1, duration: LAND * 0.6, ease: "expo.out" }, PEAK);

        /* light streaks race right to left across the peak */
        tl.fromTo($(".streak.halo"), { opacity: 0, x: 900 }, { keyframes: [{ opacity: 1, x: 0, duration: 0.14, ease: "power2.out" }, { opacity: 0, x: -900, duration: 0.2, ease: "power2.in" }] }, PEAK - 0.12)
          .fromTo($(".streak.core"), { opacity: 0, x: 1100, scaleX: 0.6 }, { keyframes: [{ opacity: 1, x: 0, scaleX: 1, duration: 0.12, ease: "power2.out" }, { opacity: 0, x: -1300, scaleX: 0.7, duration: 0.18, ease: "power2.in" }] }, PEAK - 0.1)
          .fromTo($(".streak.thin"), { opacity: 0, x: 1300 }, { keyframes: [{ opacity: 0.8, x: 100, duration: 0.12, ease: "power2.out" }, { opacity: 0, x: -1200, duration: 0.16, ease: "power2.in" }] }, PEAK - 0.06);

        /* scene B: contents do a last micro resolve as the camera settles */
        tl.fromTo($$(".tile"), { filter: "blur(6px)", y: 6 }, { filter: "blur(0px)", y: 0, duration: 0.34, ease: "expo.out", stagger: 0.05 }, PEAK + 0.1);
        /* house text preset: scene B's title + tile labels pour in as the camera lands */
        TXT.reveal(tl, $(".titleB"), PEAK + 0.06);
        $$(".tile .lab").forEach((l, i) => TXT.reveal(tl, l, PEAK + 0.14 + i * 0.06, { stagger: 0.03 }));

        tl.set({}, {}, END);
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
