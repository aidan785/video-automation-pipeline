<!doctype html>
<!--
  SANJI · transition · PAPER TO EMBER
  Scene A (PAPER sentence) to scene B (EMBER glow line). On the white page a
  short sentence sits settled; one heavy caps word in it is the door. The
  camera dollies INTO that word: the whole line scales up around a point
  inside the stem of the word's first letter (exponential dolly, power3.in,
  blur ramps with speed), the neighbouring words fly off the frame, and the
  dark glyph swallows the page until the frame is black. That black IS the
  ember scene: the corner light blooms in from top-right and bottom-left, the
  grain fades up, and the scene B line resolves hot (ember glow) and cools to
  warm white.
  Pick a hero word whose first letter has a straight left stem (B D E F H K L
  M N P R): the dolly aims at that stem.
  Slots: before (text <= 18), word (caps <= 8), after (text <= 10), lineB (text <= 24).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-tr-paper-to-ember {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--paper); font-family: var(--font-display);
      }
      #sanji-tr-paper-to-ember .sceneA { position: absolute; inset: 0; background: var(--paper); }
      #sanji-tr-paper-to-ember .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      #sanji-tr-paper-to-ember .line {
        position: absolute; left: 0; right: 0; top: 486px; text-align: center; white-space: nowrap;
        font-weight: var(--wt-bold); font-size: 92px; letter-spacing: var(--track-tight); line-height: 1.1; color: var(--ink);
      }
      #sanji-tr-paper-to-ember .line .hero { font-weight: var(--wt-black); letter-spacing: var(--track-caps); text-transform: uppercase; }
      #sanji-tr-paper-to-ember .line .w { display: inline-block; white-space: pre; }
      #sanji-tr-paper-to-ember .black { position: absolute; inset: 0; background: var(--void); opacity: 0; }

      /* scene B: ember */
      #sanji-tr-paper-to-ember .sceneB { position: absolute; inset: 0; opacity: 0; }
      #sanji-tr-paper-to-ember .warm { position: absolute; inset: 0; background: var(--ember-corners); opacity: 0; transform-origin: 50% 50%; }
      #sanji-tr-paper-to-ember .vig { position: absolute; inset: 0; background: var(--vignette-dark); opacity: 0.5; }
      #sanji-tr-paper-to-ember .lineB {
        position: absolute; left: 0; right: 0; top: 490px; text-align: center; white-space: nowrap;
        font-family: var(--font-body); font-weight: var(--wt-bold); font-size: 88px; letter-spacing: var(--track-tight); line-height: 1; color: #F3ECE6;
      }
      #sanji-tr-paper-to-ember .lineB .w { display: inline-block; white-space: pre; }
      #sanji-tr-paper-to-ember .grain { position: absolute; inset: 0; background: var(--grain); opacity: 0; mix-blend-mode: overlay; }
    </style>
  </head>
  <body>
    <div id="sanji-tr-paper-to-ember" data-composition-id="sanji-tr-paper-to-ember" data-start="0" data-width="1920" data-height="1080">
      <div class="sceneA">
        <div class="cam">
          <div class="line"><span class="w pre" data-slot="before">The part that stays </span><span class="w hero" data-slot="word">hidden</span><span class="w post" data-slot="after"> online</span></div>
        </div>
      </div>
      <div class="black"></div>
      <div class="sceneB">
        <div class="warm"></div>
        <div class="vig"></div>
        <div class="lineB" data-slot="lineB">Where the real work is</div>
        <div class="grain"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-tr-paper-to-ember";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => [...ROOT.querySelectorAll(s)];
        const cam = $(".cam"), hero = $(".hero"), line = $(".line");

        /* wrap the hero word's first letter so we can aim inside its stem */
        const hw = hero.textContent; hero.textContent = "";
        const first = document.createElement("span"); first.className = "first"; first.textContent = hw.slice(0, 1);
        hero.appendChild(first); hero.appendChild(document.createTextNode(hw.slice(1)));

        /* scene B words (house text preset split) */
        const lb = $(".lineB"); const ws = TXT.split(lb);

        /* aim point, measured lazily (after fonts) from untransformed layout */
        let aim = null;
        function getAim() {
          if (aim && document.fonts.status === "loaded") return aim;
          const lx = line.offsetLeft, ly = line.offsetTop;
          /* spans report offsets relative to .line (their offsetParent) */
          const fx = first.offsetLeft, fy = first.offsetTop, fw = first.offsetWidth, fh = first.offsetHeight;
          /* caps stem: ~30% into the letter's advance, vertical middle of the cap height */
          const x = lx + fx + fw * 0.3;
          const y = ly + fy + fh * 0.5;
          aim = { x, y };
          return aim;
        }

        const DOLLY0 = 0.18, DOLLY = 0.6, SMAX = 420;
        const BLACK = DOLLY0 + DOLLY * 0.88;
        const END = 2.0;
        const eD = gsap.parseEase("power2.in");
        const D = { p: 0 };
        function applyCam() {
          const a = getAim();
          const p = D.p;
          const s = Math.exp(Math.log(SMAX) * eD(p));
          /* camera also centres the aim point while it pushes */
          const c = gsap.parseEase("power2.inOut")(Math.min(1, p * 1.4));
          const tx = a.x + (960 - a.x) * c, ty = a.y + (540 - a.y) * c;
          cam.style.transform = `translate(${tx}px, ${ty}px) scale(${s}) translate(${-a.x}px, ${-a.y}px)`;
          cam.style.filter = `blur(${Math.min(16, (s - 1) * 0.1).toFixed(2)}px)`;
        }

        const tl = gsap.timeline({ paused: true });
        /* scene A: hero word darkens a touch as attention lands on it */
        tl.fromTo([$(".pre"), $(".post")], { color: "#1C1C1E" }, { color: "#C9C9CC", duration: 0.3, ease: "power2.out" }, 0.04);
        tl.fromTo(D, { p: 0 }, { p: 1, duration: DOLLY, ease: "none", onUpdate: applyCam }, DOLLY0);
        /* the glyph has filled the frame: hand off to true black */
        tl.fromTo($(".black"), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.in" }, BLACK)
          .set($(".sceneA"), { autoAlpha: 0 }, DOLLY0 + DOLLY + 0.02)
          .set($(".sceneB"), { opacity: 1 }, BLACK + 0.16);

        /* ember corner light blooms in */
        const B = BLACK + 0.16;
        tl.fromTo($(".warm"), { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.9, ease: "expo.out" }, B)
          .to($(".warm"), { opacity: 0.75, duration: END - B - 0.9, ease: "sine.inOut" }, B + 0.9)
          .fromTo($(".grain"), { opacity: 0 }, { opacity: 0.6, duration: 0.4, ease: "power1.out" }, B);
        /* scene B words resolve hot and cool down */
        /* house text preset pours the words in; each word arrives hot and cools on its own clock */
        TXT.reveal(tl, lb, B + 0.12);
        ws.forEach((w, i) => {
          const t = B + 0.12 + i * TXT.DEFAULTS.stagger;
          tl.fromTo(w, { color: "#FFB347", textShadow: "0 0 24px rgba(255,122,26,0.95), 0 0 60px rgba(255,122,26,0.6)" },
            { color: "#F3ECE6", textShadow: "0 0 0px rgba(255,122,26,0), 0 0 0px rgba(255,122,26,0)", duration: 0.6, ease: "power2.out", immediateRender: true }, t + 0.2);
        });

        tl.set({}, {}, END);
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
