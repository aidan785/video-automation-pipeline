<!doctype html>
<!--
  SANJI · transition · SYSTEM ZOOM GLYPH
  The camera pushes into one character of scene A (by default the final "."
  of the statement) until that glyph fills the screen. Close up, the glyph
  is not solid: it is made of smaller luminance-mapped glyphs (the ASCII
  field takes over from the vector type as the character grows), textured
  in the glyph's own coordinates so the push keeps reading as motion. On the
  line the frame is all glyph field; the camera pulls out of scene B's
  matching character and B settles, chip scrambling in.
  Camera = canvas transform on a re-render every frame (vector text stays
  crisp at any scale). ~2s.
  Slots: a_text (<= 32, ends with the zoom glyph), b_text (<= 28),
  b_chip (<= 12; B pulls out of the solid chip, which then scrambles in;
  empty chip = pull out of b_text's last character),
  zoom_char (1 char to zoom into in A, default "."; falls back to the last
  character of a_text).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-tr-system-zoom-glyph {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--sys-blue); font-family: var(--font-term);
      }
      #sanji-tr-system-zoom-glyph canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #sanji-tr-system-zoom-glyph .glow { filter: drop-shadow(0 0 4px rgba(225,232,255,0.45)); }
      #sanji-tr-system-zoom-glyph .scan { position: absolute; inset: 0; background: var(--sys-scan); }
      #sanji-tr-system-zoom-glyph .src { display: none; }
    </style>
  </head>

      <canvas class="field glow"></canvas>
      <canvas class="vec glow"></canvas>
      <div class="scan"></div>
      <div class="src">
        <span data-slot="a_text">Every edit starts with one cut.</span>
        <span data-slot="b_text">Next step &gt;</span>
        <span data-slot="b_chip">Automate it.</span>
        <span data-slot="zoom_char">.</span>
      </div>
    </div>

  /* spinning coin: angle in radians around the vertical axis. Generic face

        const ID = "sanji-tr-system-zoom-glyph";
