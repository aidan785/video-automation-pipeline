<!doctype html>
<!--
  SANJI · transition · BLUR PULLBACK
  The chatbox cut from the reference: close-up to wide. Scene A is CLOSE on
  the top-left of a dark ember chat plate, the typed line huge in frame, its
  last letters still arriving hot and cooling. The camera then pulls back hard
  (scale 2.1 -> 1, power3.inOut, 0.55s) with a breath of motion blur,
  revealing scene B: a wider framing of the same plate, a small rounded dark
  box holding that line, with orange corner light blooming at its edge. ~1.4s.
  At assembly the close-up / wide plates stand in for real footage framings.
  Slots: line (text, <= 28 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-tr-blur-pullback {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--void); font-family: var(--font-body);
      }
      #sanji-tr-blur-pullback .warm { position: absolute; inset: 0; background: var(--ember-corners); }
      #sanji-tr-blur-pullback .vig { position: absolute; inset: 0; background: var(--vignette-dark); opacity: 0.55; }
      #sanji-tr-blur-pullback .cam { position: absolute; inset: 0; transform-origin: 462px 466px; }
      #sanji-tr-blur-pullback .comet {
        position: absolute; left: 1010px; top: 96px; width: 620px; height: 58px;
        transform-origin: 0% 50%; transform: rotate(33deg);
        background: linear-gradient(90deg, rgba(255,122,26,0) 0%, rgba(255,140,40,0.35) 30%, rgba(255,190,90,0.95) 78%, rgba(255,230,170,1) 92%, rgba(255,200,120,0) 100%);
        border-radius: 50%; filter: blur(9px); opacity: 0;
      }
      #sanji-tr-blur-pullback .comet::after {
        content: ""; position: absolute; inset: -60px -40px; border-radius: 50%;
        background: radial-gradient(60% 50% at 80% 50%, rgba(255,140,40,0.45), rgba(255,122,26,0) 70%);
        filter: blur(20px);
      }
      #sanji-tr-blur-pullback .pool {
        position: absolute; left: -320px; top: 600px; width: 1100px; height: 900px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,170,70,0.7) 0%, rgba(230,131,42,0.42) 28%, rgba(103,39,13,0.22) 52%, rgba(3,1,0,0) 70%);
        filter: blur(30px); opacity: 0;
      }
      #sanji-tr-blur-pullback .box {
        position: absolute; left: 410px; top: 400px; width: 1100px; height: 280px; box-sizing: border-box;
        border-radius: var(--r-chat); background: var(--chat-fill);
        border: var(--rim) solid var(--chat-rim); box-shadow: var(--chat-shadow);
      }
      #sanji-tr-blur-pullback .line {
        position: absolute; left: 52px; top: 40px; white-space: pre;
        font-weight: 500; font-size: 46px; letter-spacing: var(--track-ui); color: #EFE7E1;
      }
      #sanji-tr-blur-pullback .line .c { display: inline; }
      #sanji-tr-blur-pullback .caret {
        display: inline-block; width: 3px; height: 48px; margin-left: 3px; vertical-align: -8px;
        background: rgba(255,240,228,0.9); border-radius: 2px;
      }
      #sanji-tr-blur-pullback .plus { position: absolute; left: 48px; bottom: 36px; width: 36px; height: 36px; }
      #sanji-tr-blur-pullback .send {
        position: absolute; right: 30px; bottom: 28px; width: 64px; height: 64px; border-radius: 18px; background: var(--ember);
        display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 26px rgba(255,122,26,0.35);
      }
      #sanji-tr-blur-pullback .grain { position: absolute; inset: 0; background: var(--grain); opacity: 0.6; mix-blend-mode: overlay; }
    </style>
  </head>
  <body>
    <div id="sanji-tr-blur-pullback" data-composition-id="sanji-tr-blur-pullback" data-start="0" data-width="1920" data-height="1080">
      <div class="warm"></div>
      <div class="vig"></div>
      <div class="cam">
        <div class="pool"></div>
        <div class="comet"></div>
        <div class="box">
          <div class="line"><span class="txt" data-slot="line">Make it in one day</span><span class="caret"></span></div>
          <svg class="plus t" viewBox="0 0 24 24" fill="none" stroke="#F2ECE6" stroke-width="2" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
          <div class="send t"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></div>
        </div>
      </div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const ID = "sanji-tr-blur-pullback";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => ROOT.querySelectorAll(s);

        const txt = $(".txt");
        const str = txt.textContent; txt.textContent = "";
        const chars = [...str].map((ch) => { const c = document.createElement("span"); c.className = "c"; c.textContent = ch; txt.appendChild(c); return c; });
        const TAIL = Math.min(4, chars.length);               /* last letters still arriving */
        const tail = chars.slice(chars.length - TAIL);

        const tl = gsap.timeline({ paused: true });
        const PULL = 0.4, END = 1.4;

        /* scene A: close on the plate top-left, line huge in frame */
        tl.set($(".cam"), { scale: 2.1, x: -222, y: 0 }, 0)
          .set(tail, { display: "none" }, 0)
          .set($(".warm"), { opacity: 0.85 }, 0);
        tail.forEach((c, i) => {
          const t = 0.04 + i * 0.06;
          tl.set(c, { display: "inline" }, t)
            .fromTo(c, { opacity: 0.25, color: "#FF9A4A", filter: "blur(4px)" },
              { opacity: 1, color: "#EFE7E1", filter: "blur(0px)", duration: 0.26, ease: "power2.out" }, t);
        });

        /* hard pull-back with a breath of motion blur */
        tl.to($(".cam"), { scale: 1, x: 0, y: 0, duration: 0.55, ease: "power3.inOut" }, PULL)
          .to($(".cam"), { filter: "blur(4px)", duration: 0.2, ease: "power1.in", yoyo: true, repeat: 1 }, PULL + 0.07)
          .to($(".warm"), { opacity: 0.3, duration: 0.7, ease: "power2.inOut" }, PULL)
          .to($(".caret"), { opacity: 0, duration: 0.15 }, PULL + 0.12)
          .fromTo($$(".box .t"), { autoAlpha: 0, filter: "blur(8px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out", stagger: 0.05 }, PULL + 0.38)

          /* scene B: ember corner light blooms at the box's edge */
          .fromTo($(".comet"), { opacity: 0, x: -200, y: -120 }, { opacity: 1, x: 0, y: 0, duration: 0.66, ease: "expo.out" }, PULL + 0.3)
          .fromTo($(".pool"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.66, ease: "expo.out" }, PULL + 0.34)
          .set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
