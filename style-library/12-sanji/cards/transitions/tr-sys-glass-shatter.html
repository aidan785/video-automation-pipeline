<!doctype html>
<!--
  SANJI · transition · SYSTEM GLASS SHATTER (COBALT -> SYSTEM)
  Bridges the COBALT liquid-glass canvas into SYSTEM. Scene A: flat cobalt
  with sonar rings and four glass squircle tiles (badge + caps title), each
  with a micro label above it ("tile 01 :: idle"). Tile by tile, left to
  right, a radial front eats the glass from a seeded point and leaves a
  halftone dot version of that tile behind (dot size = the glass luminance:
  rim, sheen, badge, title). The dots bloom, drift apart, then turn into
  glyphs (@ % o * : .) while the labels scramble ("tile 03 :: breaking",
  dot counts). The ground cross-fades cobalt to system blue. Then the glyphs
  fly and settle into scene B, a blue-screen terminal: one log line per tile
  ("> ingest ...... [ OK ]") and the statement with its inverse chip, each
  cell resolving . > : > noise > letter as it lands. Leftover glyphs decay
  to dots and clear. ~3.0s.
  Slots: tile1-tile4 (caps <= 8), b_text (<= 28), b_chip (<= 12).
-->

            for (let i = 0; i < s.length; i++) if (s[i] !== " ") TG.push({ ch: s[i], x: 46 + i * ADV, y: 150 + k * 36, inv: 0, line: k, col: i, n: s.length });
          });
          const n = BT.length + 1 + BC.length, x0 = Math.min(1000, 1860 - n * ADV);
          for (let i = 0; i < BT.length; i++) if (BT[i] !== " ") TG.push({ ch: BT[i], x: x0 + i * ADV, y: 504, inv: 0, line: 4, col: i, n });
          for (let i = 0; i < BC.length; i++) TG.push({ ch: BC[i], x: x0 + (BT.length + 1 + i) * ADV, y: 504, inv: 1, line: 4, col: BT.length + 1 + i, n });
          /* landing schedule: lines type in order, left to right */
          for (const g of TG) g.at = 1.5 + g.line * 0.17 + (g.col / g.n) * 0.26 + hash(g.col, g.line, 61) * 0.04;
        }
        /* each target pulls a lead + 2 followers from its own tile (statement: any tile) */
        function assign() {
          for (const d of DOTS) d.tgt = null;
          const pools = TILES.map((T) => DOTS.filter((d) => d.T === T).sort((a, b) => b.l - a.l));
          const used = new Set();
          TG.forEach((g, gi) => {
            const pool = pools[g.line < 4 ? g.line : gi % 4];
            for (let r = 0; r < 3; r++) {
              let j = Math.floor(hash(gi, r, 62) * pool.length), tries = 0;
              while (used.has(pool[j].k) && tries++ < pool.length) j = (j + 1) % pool.length;
              const d = pool[j]; used.add(d.k); d.tgt = g; d.lead = r === 0;
            }
          });
        }
        buildTargets(); buildDots();

        /* ---- beats ---- */
        const T_LAB = 0.12;                                   /* tile labels scramble in */
        const TB = (i) => 0.55 + i * 0.16;                      /* tile i starts breaking */
        const GLY = 0.36;                                        /* dot -> glyph after this long */
        const T_GROUND = 0.95, GROUND_D = 0.6;                   /* cobalt -> system blue */
        const T_DONE = Math.max(...TG.map((g) => g.at)) + 0.12;
        const END = 3.0;
        const GR = "@%#o*+:.";

        const fx = $("canvas.fx"); fx.width = 1920; fx.height = 1080; const gx = fx.getContext("2d");
        const sysbg = $(".sysbg"), rings = $$(".ring"), scanEl = $(".scan");

        /* where a dot is at time t (before any flight) */
        function dotPos(d, t) {
          const u = Math.max(0, t - TB(d.T.i) - d.dd);
          const drift = d.sp * (u * u * 0.9 + u * 0.35);
          const w = fbm(d.x * 0.004, d.y * 0.004 + t * 0.4, 9, 2) - 0.5;
          return [d.x + d.ax * drift + w * 40 * u, d.y + d.ay * drift * 0.8 - 36 * u * u];
        }

        function draw(t) {
          const fr = frame(t);
          /* ground + rings */
          const gk = eIO(c01((t - T_GROUND) / GROUND_D));
          sysbg.style.opacity = gk.toFixed(3);
          scanEl.style.opacity = gk.toFixed(3);
          rings.forEach((r, i) => { r.style.opacity = (1 - c01((t - 0.85 - i * 0.08) / 0.4)).toFixed(3); });
          /* glass tiles: a radial front eats each tile from its seeded origin */
          for (const T of TILES) {
            const u = (t - TB(T.i)) / 0.26;
            if (u <= 0) { T.el.style.visibility = "visible"; T.el.style.webkitMaskImage = T.el.style.maskImage = "none"; continue; }
            if (u >= 1) { T.el.style.visibility = "hidden"; continue; }
            const R = u * T.maxD, ox = T.ox - T.x, oy = T.oy - T.y;
            const m = `radial-gradient(circle at ${ox.toFixed(1)}px ${oy.toFixed(1)}px, transparent ${R.toFixed(1)}px, #000 ${(R + 3).toFixed(1)}px)`;
            T.el.style.visibility = "visible"; T.el.style.webkitMaskImage = m; T.el.style.maskImage = m;
          }

          gx.clearRect(0, 0, 1920, 1080);
          const landed = new Set();
          /* dots -> glyphs -> flight */
          for (const d of DOTS) {
            const t0 = TB(d.T.i) + d.dd, u = t - t0;
            if (u < 0) continue;
            let [x, y] = dotPos(d, t), a = 1, ch = null, r = 0;
            if (d.tgt) {
              const g = d.tgt, arrive = Math.max(g.at, t0 + GLY + 0.42), fly0 = Math.max(t0 + GLY + 0.12, arrive - 0.6);
              if (t >= arrive) { if (d.lead) landed.add(g); continue; }
              if (t >= fly0) {
                const [px, py] = dotPos(d, fly0), q = eIO(c01((t - fly0) / (arrive - fly0)));
                const sw = Math.sin(q * Math.PI) * 70 * (hash(d.k, 3, 64) - 0.5);
                x = px + (g.x + 9 - px) * q + sw; y = py + (g.y + 14 - py) * q - Math.sin(q * Math.PI) * 40;
                ch = d.lead ? (q < 0.45 ? GR[Math.min(7, Math.floor(hash(d.k, fr, 65) * 8))] : q < 0.8 ? ":" : NOISE[Math.floor(hash(d.k, fr, 66) * NOISE.length)]) : (q > 0.7 ? "." : q > 0.4 ? ":" : g.ch);
                a = d.lead ? 1 : 0.9 * (1 - q * q);
              }
            }
            if (ch === null) {
              if (u < GLY) {
                /* halftone dot: bloom at the front, then settle to its luminance size */
                const bloom = 1 + 0.45 * Math.exp(-((u - 0.06) ** 2) / 0.004);
                r = Math.min(5.6, 5.0 * Math.pow(d.l, 0.8) * bloom * (0.55 + 0.45 * c01(u / 0.05)));
              } else {
                /* glyph: dense glyph for bright dots, re-rolls a few frames, then decays (non-targets fade out) */
                const gu = u - GLY;
                let idx = Math.floor((1 - d.l) * 6.99);
                if (gu < f(3)) idx = Math.floor(hash(d.k, fr, 67) * 8);
                if (!d.tgt) { idx = Math.min(7, idx + Math.floor(gu / 0.1)); a = 1 - c01((gu - 0.1) / 0.4); }
                ch = GR[Math.min(7, idx)];
              }
            }
            if (a <= 0.02) continue;
            gx.fillStyle = `rgba(${INK},${a.toFixed(3)})`;
            if (r > 0) { gx.beginPath(); gx.arc(x, y, r, 0, 6.2832); gx.fill(); }
            else if (ch) { gx.font = MF(18); gx.textBaseline = "middle"; gx.textAlign = "center"; gx.fillText(ch, x, y); }
          }
          /* landed scene B cells (chip cells invert as they land; 2-frame noise then the letter) */
          gx.textAlign = "left"; gx.textBaseline = "top"; gx.font = TF;
          for (const g of TG) {
            if (!landed.has(g) && t < T_DONE + 0.05) continue;
            const age = t - g.at, c = age < f(2) ? NOISE[Math.floor(hash(g.col, fr, 68 + g.line) * NOISE.length)] : g.ch;
            if (g.inv) {
              gx.fillStyle = `rgb(${INK})`;
              const first = !TG.some((h) => h.inv && h.line === g.line && h.col === g.col - 1), last = !TG.some((h) => h.inv && h.line === g.line && h.col === g.col + 1);
              gx.fillRect(g.x - (first ? 4 : 0.5), g.y - 2, ADV + 1 + (first ? 3.5 : 0) + (last ? 4 : 0), 38);
              gx.fillStyle = BLUE;
            } else gx.fillStyle = `rgba(${INK},${g.line < 4 ? 0.88 : 1})`;
            gx.fillText(c, g.x, g.y);
          }

          /* ---- micro labels: one per tile, plus a status line ---- */
          gx.font = MF(16); gx.textBaseline = "middle"; gx.textAlign = "left";
          const lbl = (x, y, s, aa = 1, inv = false) => {
            const w = s.length * 9.65 + 12;
            if (inv) { gx.fillStyle = `rgba(${INK},${aa})`; gx.fillRect(x - 6, y - 12, w, 24); gx.fillStyle = BLUE; }
            else gx.fillStyle = `rgba(${INK},${aa})`;
            gx.fillText(s, x, y + 1);
          };
          for (const T of TILES) {
            const tb = TB(T.i), id = `tile ${String(T.i + 1).padStart(2, "0")} ::`;
            if (t < T_LAB || t > tb + 0.95) continue;
            let s, inv = false;
            if (t < tb - 0.12) { s = `${id} idle`; if (t < T_LAB + f(3)) s = scramble(s, (t - T_LAB) / f(3), t, T.i + 2, 3); }
            else if (t < tb + GLY) { const s0 = `${id} breaking`; s = t < tb - 0.12 + f(3) ? scramble(s0, (t - tb + 0.12) / f(3), t, T.i + 6, 4) : s0; inv = true; }
            else if (t < tb + 0.8) { const n = Math.round(T.n * c01((t - tb - GLY) / 0.3)); const s0 = `${id} ${String(n).padStart(4, "0")} glyphs`; s = t < tb + GLY + f(2) ? scramble(s0, (t - tb - GLY) / f(2), t, T.i + 9, 4) : s0; }
            else { s = scramble(`${id} sent`, 0.4, t, T.i + 12, 6); }
            lbl(T.x + 6, T.y - 26, s, 0.92, inv);
          }
          if (t >= 0.5 && t < T_DONE - 0.15) {
            const sent = DOTS.reduce((a, d) => a + (t >= TB(d.T.i) + d.dd ? 1 : 0), 0);
            lbl(46, 1040, `/* shatter :: f${String(fr).padStart(3, "0")} :: ${String(sent).padStart(4, "0")}/${String(DOTS.length).padStart(4, "0")} dots */`, 0.85);
          }
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) document.fonts.ready.then(() => { buildDots(); draw(P.t); });
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
