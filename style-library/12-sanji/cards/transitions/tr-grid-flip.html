<!doctype html>
<!--
  SANJI · transition · GRID FLIP
  Scene A (PAPER headline) to scene B (COBALT glass tile + sentence).
  Scene A is taken over by a 12 x 7 grid of cells. In a diagonal wave from
  the top-left (seeded jitter per cell, no Math.random) each cell lifts away
  from its neighbours (scales to 0.9 and rounds into a squircle, so the
  black seams open), flips on its vertical axis with perspective (rotateY on
  a per-cell wrapper), shows its back face carrying scene B's slice, and
  settles flat again so the seams close. When the last cell lands, the real
  scene B takes over underneath and its content breathes in.
  Faces are built at runtime as clones of the two master scenes (slots stay
  only on the masters), so filled slot text shows on every slice.
  Both scenes are STAND-INS. Slots: headA (text <= 22), title (caps <= 12), sub (text <= 32).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-tr-grid-flip {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--void); font-family: var(--font-display); color: var(--white);
      }
      #sanji-tr-grid-flip .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
      /* scene A: paper */
      #sanji-tr-grid-flip .sceneA { background: var(--paper); }
      #sanji-tr-grid-flip .sceneA .head { position: absolute; left: 0; right: 0; top: 470px; text-align: center; white-space: nowrap;
        font-weight: var(--wt-bold); font-size: 120px; line-height: 1.1; letter-spacing: var(--track-tight); color: var(--ink); }
      #sanji-tr-grid-flip .sceneA .kick { position: absolute; left: 0; right: 0; top: 404px; text-align: center; font-family: var(--font-mono); font-size: 26px; color: var(--ink-mid); letter-spacing: 0.04em; }
      /* scene B: cobalt */
      #sanji-tr-grid-flip .sceneB { background: var(--cobalt); }
      #sanji-tr-grid-flip .ring { position: absolute; left: 50%; top: 50%; width: 1800px; height: 1800px; margin: -900px 0 0 -900px;
        border-radius: 50%; border: 2px solid rgba(255,255,255,0.07); background: radial-gradient(circle, rgba(255,255,255,0) 55%, rgba(255,255,255,0.035) 100%); }
      #sanji-tr-grid-flip .tile { position: absolute; left: 400px; top: 350px; width: 380px; height: 380px; border-radius: var(--r-tile); }
      #sanji-tr-grid-flip .tile > .fill { position: absolute; inset: 0; border-radius: inherit; background: var(--glass-fill-active); border: var(--rim) solid var(--glass-rim-active); box-shadow: var(--glass-shadow-active); }
      #sanji-tr-grid-flip .badge { position: absolute; left: 34px; top: 34px; width: 138px; height: 138px; border-radius: 50%; box-sizing: border-box;
        background: var(--badge-fill); border: var(--rim) solid var(--badge-rim); display: flex; align-items: center; justify-content: center; }
      #sanji-tr-grid-flip .tile .t { position: absolute; left: 30px; bottom: 30px; font-weight: var(--wt-heavy); font-size: 58px; line-height: 0.9; letter-spacing: var(--track-caps); text-transform: uppercase; white-space: nowrap; }
      #sanji-tr-grid-flip .copy { position: absolute; left: 860px; top: 420px; width: 700px; }
      #sanji-tr-grid-flip .copy .k { font-family: var(--font-mono); font-size: 24px; color: var(--white-soft); }
      #sanji-tr-grid-flip .copy .s { margin-top: 22px; font-family: var(--font-body); font-weight: var(--wt-bold); font-size: 66px; line-height: 1.04; letter-spacing: var(--track-tight); }

      /* the flip grid */
      #sanji-tr-grid-flip .grid { position: absolute; inset: 0; visibility: hidden; }
      #sanji-tr-grid-flip .cell { position: absolute; width: 160px; height: 160px; perspective: 900px; }
      #sanji-tr-grid-flip .flip { position: absolute; inset: 0; transform-style: preserve-3d; }
      #sanji-tr-grid-flip .face { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 0; }
      #sanji-tr-grid-flip .face.back { transform: rotateY(180deg); }
      #sanji-tr-grid-flip .face > .scene { pointer-events: none; }
      #sanji-tr-grid-flip .face .shade { position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,0.5), rgba(255,255,255,0) 60%); opacity: 0; }
      #sanji-tr-grid-flip .face.back .shade { background: linear-gradient(300deg, rgba(255,255,255,0.45), rgba(255,255,255,0) 60%); }
    </style>
  </head>
  <body>
    <div id="sanji-tr-grid-flip" data-composition-id="sanji-tr-grid-flip" data-start="0" data-width="1920" data-height="1080">
      <div class="scene sceneB master">
        <div class="ring" style="transform:scale(0.5)"></div><div class="ring" style="transform:scale(0.75)"></div><div class="ring" style="transform:scale(1)"></div>
        <div class="tile"><div class="fill"></div>
          <div class="badge"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M4 19c4 0 4-14 9-14 3 0 4 2 7 2"/><circle cx="4" cy="19" r="1.6" fill="#FFFFFF"/><circle cx="20" cy="7" r="1.6" fill="#FFFFFF"/></svg></div>
          <div class="t" data-slot="title">Easing</div>
        </div>
        <div class="copy"><div class="k">rule 02</div><div class="s" data-slot="sub">Nothing moves linearly, ever.</div></div>
      </div>
      <div class="scene sceneA master">
        <div class="kick">chapter one</div>
        <div class="head" data-slot="headA">One idea per frame.</div>
      </div>
      <div class="grid"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const ID = "sanji-tr-grid-flip";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => [...ROOT.querySelectorAll(s)];
        const A = $(".sceneA.master"), B = $(".sceneB.master"), grid = $(".grid");

        const CS = 160, COLS = 12, ROWS = 7;
        let seed = 6203;
        const rnd = () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296);
        const strip = (el) => { el.classList.remove("master"); el.querySelectorAll("[data-slot]").forEach((n) => n.removeAttribute("data-slot")); return el; };

        const cells = [];
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
          const cell = document.createElement("div"); cell.className = "cell";
          cell.style.left = c * CS + "px"; cell.style.top = r * CS + "px";
          const flip = document.createElement("div"); flip.className = "flip";
          ["front", "back"].forEach((side) => {
            const f = document.createElement("div"); f.className = "face " + side;
            const sc = strip((side === "front" ? A : B).cloneNode(true));
            sc.style.left = -c * CS + "px"; sc.style.top = -r * CS + "px";
            f.appendChild(sc);
            const sh = document.createElement("div"); sh.className = "shade"; f.appendChild(sh);
            flip.appendChild(f);
          });
          cell.appendChild(flip); grid.appendChild(cell);
          cells.push({ cell, flip, faces: [...flip.children], shades: [...flip.querySelectorAll(".shade")], d: (c + r * 1.35) * 0.034 + rnd() * 0.07 });
        }

        const T0 = 0.22, FL = 0.5;
        const last = Math.max(...cells.map((o) => o.d));
        const DONE = T0 + last + FL;
        const END = DONE + 0.45;

        const tl = gsap.timeline({ paused: true });
        /* cells rest at 1.008 so neighbours overlap by a hair: no anti-alias seams */
        tl.set(cells.map((o) => o.cell), { scale: 1.008 }, 0);
        tl.set(grid, { visibility: "visible" }, T0 - 0.02).set(A, { autoAlpha: 0 }, T0 - 0.02).set(B, { autoAlpha: 0 }, T0 - 0.02);

        cells.forEach((o) => {
          const t = T0 + o.d;
          /* lift: shrink + round so seams open; flip; land flat again */
          tl.to(o.cell, { keyframes: [{ scale: 0.9, duration: FL * 0.35, ease: "power2.out" }, { scale: 0.9, duration: FL * 0.3 }, { scale: 1.008, duration: FL * 0.35, ease: "power2.inOut" }] }, t)
            .to(o.faces, { keyframes: [{ borderRadius: 30, duration: FL * 0.35, ease: "power2.out" }, { borderRadius: 30, duration: FL * 0.3 }, { borderRadius: 0, duration: FL * 0.35, ease: "power2.inOut" }] }, t)
            .fromTo(o.flip, { rotateY: 0 }, { rotateY: 180, duration: FL * 0.8, ease: "power3.inOut" }, t + FL * 0.08)
            .to(o.shades, { keyframes: [{ opacity: 1, duration: FL * 0.4, ease: "power1.in" }, { opacity: 0, duration: FL * 0.4, ease: "power1.out" }] }, t + FL * 0.08);
        });

        /* hand back to the live scene B */
        tl.set(B, { autoAlpha: 1 }, DONE).set(grid, { visibility: "hidden" }, DONE)
          /* ambient: the rings keep breathing outward (type layer stays still) */
          .fromTo($$(".sceneB.master .ring"), { opacity: 1 }, { opacity: 0.55, scale: "+=0.06", duration: 0.45, ease: "sine.out", stagger: 0.04 }, DONE);

        tl.set({}, {}, END);
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
