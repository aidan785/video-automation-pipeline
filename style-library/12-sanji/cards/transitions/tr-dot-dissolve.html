<!doctype html>
<!--
  SANJI · transition · DOT DISSOLVE
  Scene A (EMBER glow-type line on black) to scene B (COBALT glass stat card).
  Scene A dissolves into the blue dot-halftone grid: dots grow from nothing
  across the frame in a radial, seeded order (centre first, ragged edge), each
  dot arriving bright volt-blue and settling to cobalt, until the dots merge
  into a solid blue field. Underneath, the scenes swap; then the dots shrink
  away in the same radial order, revealing scene B, whose card resolves out
  of blur. A blurred copy of the dot canvas adds the bloom at the growth front.
  Canvas drawn from the timeline clock (proxy onUpdate), seeded LCG, no rAF.
  Both scenes are STAND-INS. Slots: lineA (text <= 26), stat (<= 6), label (<= 22).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-tr-dot-dissolve {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--void); font-family: var(--font-body); color: var(--white);
      }
      #sanji-tr-dot-dissolve .scene { position: absolute; inset: 0; overflow: hidden; }
      /* scene A: ember-side glow type (blue glow variant, same as the reference) */
      #sanji-tr-dot-dissolve .sceneA { background: var(--void); transform-origin: 50% 50%; }
      #sanji-tr-dot-dissolve .sceneA .dots { position: absolute; inset: 0; background: var(--dot-grid-blue); opacity: 0.5;
        -webkit-mask-image: radial-gradient(ellipse at center, transparent 40%, #000 100%); mask-image: radial-gradient(ellipse at center, transparent 40%, #000 100%); }
      #sanji-tr-dot-dissolve .sceneA .line {
        position: absolute; left: 0; right: 0; top: 488px; text-align: center; white-space: nowrap;
        font-weight: var(--wt-bold); font-size: 96px; letter-spacing: var(--track-tight); line-height: 1;
      }
      #sanji-tr-dot-dissolve .sceneA .line b { font-weight: var(--wt-bold); color: var(--volt-soft);
        text-shadow: 0 0 18px rgba(var(--volt-rgb),0.9), 0 0 60px rgba(var(--volt-rgb),0.6); }
      #sanji-tr-dot-dissolve .sceneA .grain { position: absolute; inset: 0; background: var(--grain); opacity: 0.6; mix-blend-mode: overlay; }
      /* scene B: cobalt + rings + glass stat card */
      #sanji-tr-dot-dissolve .sceneB { background: var(--cobalt); transform-origin: 50% 50%; }
      #sanji-tr-dot-dissolve .ring {
        position: absolute; left: 50%; top: 50%; width: 1800px; height: 1800px; margin: -900px 0 0 -900px;
        border-radius: 50%; border: 2px solid rgba(255,255,255,0.07);
        background: radial-gradient(circle, rgba(255,255,255,0) 55%, rgba(255,255,255,0.035) 100%);
      }
      #sanji-tr-dot-dissolve .card { position: absolute; left: 610px; top: 300px; width: 700px; height: 480px; border-radius: var(--r-card); }
      #sanji-tr-dot-dissolve .card > .fill { position: absolute; inset: 0; border-radius: inherit; background: var(--glass-fill-active); border: var(--rim) solid var(--glass-rim-active); box-shadow: var(--glass-shadow-active); }
      #sanji-tr-dot-dissolve .card .glow { position: absolute; left: 150px; top: 60px; width: 400px; height: 300px; border-radius: 50%;
        background: radial-gradient(circle, rgba(160,180,255,0.45), rgba(120,140,255,0) 70%); filter: blur(20px); }
      #sanji-tr-dot-dissolve .stat { position: absolute; left: 0; right: 0; top: 88px; text-align: center; font-family: var(--font-display); font-weight: var(--wt-heavy);
        font-size: var(--size-hero); letter-spacing: var(--track-caps); line-height: 1; text-shadow: 0 0 40px rgba(170,190,255,0.55); }
      #sanji-tr-dot-dissolve .lab { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-weight: var(--wt-ui); font-size: var(--size-ui); letter-spacing: var(--track-ui); color: var(--white-soft); white-space: nowrap; }
      #sanji-tr-dot-dissolve canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #sanji-tr-dot-dissolve canvas.bloom { filter: blur(9px); mix-blend-mode: screen; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div id="sanji-tr-dot-dissolve" data-composition-id="sanji-tr-dot-dissolve" data-start="0" data-width="1920" data-height="1080">
      <div class="scene sceneB">
        <div class="ring" style="transform:scale(0.5)"></div><div class="ring" style="transform:scale(0.75)"></div><div class="ring" style="transform:scale(1)"></div>
        <div class="card"><div class="fill"></div><div class="glow"></div>
          <div class="stat" data-slot="stat">$880</div>
          <div class="lab" data-slot="label">earned in a single day</div>
        </div>
      </div>
      <div class="scene sceneA">
        <div class="dots"></div>
        <div class="line" data-slot="lineA">selling motion <b>design</b></div>
        <div class="grain"></div>
      </div>
      <canvas class="dots" width="1920" height="1080"></canvas>
      <canvas class="bloom" width="1920" height="1080"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-tr-dot-dissolve";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s);
        const css = getComputedStyle(document.documentElement);
        const rgbOf = (n) => { const h = css.getPropertyValue(n).trim().replace("#", ""); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); };
        const COB = rgbOf("--cobalt"), VOLT = rgbOf("--volt-soft");

        const SP = 24, RFULL = SP * 0.74;           /* full radius overlaps neighbours -> solid field */
        const CX = 960, CY = 540, DMAX = Math.hypot(960, 540);
        let seed = 4721;
        const rnd = () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296);
        const cells = [];
        for (let y = SP / 2; y < 1080 + SP; y += SP) for (let x = SP / 2; x < 1920 + SP; x += SP) {
          const o = (Math.hypot(x - CX, y - CY) / DMAX) * 0.72 + rnd() * 0.28;   /* radial + seeded ragged edge */
          cells.push({ x, y, o });
        }
        /* phases */
        const G0 = 0.12, GD = 0.62;       /* grow window */
        const S0 = 0.82, SD = 0.66;        /* shrink window */
        const W = 0.32;                   /* per-dot share of the window */
        const END = 1.9;
        const eG = gsap.parseEase("power2.out"), eS = gsap.parseEase("power2.in");
        const c01 = (x) => Math.max(0, Math.min(1, x));

        const cv = $("canvas.dots"), ctx = cv.getContext("2d");
        const bv = $("canvas.bloom"), bctx = bv.getContext("2d");
        function draw(t) {
          ctx.clearRect(0, 0, 1920, 1080);
          const pg = c01((t - G0) / GD), ps = c01((t - S0) / SD);
          if (pg > 0 && ps < 1) {
            for (let i = 0; i < cells.length; i++) {
              const c = cells[i];
              const a = c01((pg - c.o * (1 - W)) / W);
              if (a <= 0) continue;
              const b = c01((ps - c.o * (1 - W)) / W);
              /* two-stage size: clean halftone dot first, then merge into the field */
              const ga = eG(a), sb = eS(b);
              const k = (ga < 0.6 ? (ga / 0.6) * 0.56 : 0.56 + ((ga - 0.6) / 0.4) * 0.44) * (1 - sb);
              if (k <= 0.01) continue;
              /* fresh dots are bright volt, settled dots are cobalt, leaving dots flare again */
              const hot = Math.pow(1 - a, 1.5) * 0.95 + Math.min(1, b * 1.6) * 0.85;
              const col = COB.map((v, j) => Math.round(v + (VOLT[j] - v) * Math.min(1, hot)));
              ctx.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
              ctx.beginPath(); ctx.arc(c.x, c.y, RFULL * k, 0, 6.2832); ctx.fill();
            }
          }
          bctx.clearRect(0, 0, 1920, 1080);
          /* bloom only while the front is moving */
          const bloom = Math.sin(Math.PI * pg) * 0.9 + Math.sin(Math.PI * ps) * 0.7;
          if (bloom > 0.02) { bctx.globalAlpha = Math.min(1, bloom); bctx.drawImage(cv, 0, 0); bctx.globalAlpha = 1; }
        }

        const tl = gsap.timeline({ paused: true });
        /* scene A softens and leans back as the dots eat it */
        tl.fromTo($(".sceneA"), { scale: 1, filter: "blur(0px)" }, { scale: 1.04, filter: "blur(4px)", duration: G0 + GD, ease: "power2.in" }, 0)
          .set($(".sceneA"), { autoAlpha: 0 }, G0 + GD + 0.02);
        /* scene B: waiting under the field, settles as dots clear */
        tl.fromTo($(".sceneB"), { scale: 1.05 }, { scale: 1, duration: 0.9, ease: "expo.out" }, S0)
          .fromTo($(".card"), { autoAlpha: 0, scale: 0.92, filter: "blur(10px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "back.out(1.25)" }, S0 + 0.1)
;
        /* scene B text: the static stat rises as a block, the label pours in (house preset) */
        TXT.block(tl, $(".stat"), S0 + 0.2);
        TXT.reveal(tl, $(".lab"), S0 + 0.26, { stagger: 0.03 });

        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
