<!doctype html>
<!--
  SANJI · transition · DITHER WIPE
  The pixel-dither band from the landscape cold open, as a scene transition.
  A diagonal band of blue ordered-dither cells (14px, Bayer threshold, seeded
  ragged edge) sweeps from bottom-left to top-right. Ahead of the band scene A
  breaks up into cobalt cells; behind it the cells carry scene B's own
  luminance in blue and dissolve away to reveal B. Redrawn from the timeline
  clock (proxy tween onUpdate), fully deterministic. ~1.2s.
  Demo: scene A = cobalt glass card stand-in, scene B = nature photo. At
  assembly replace .sceneA / .sceneB contents with real footage.
  Slots: photo (scene B filename stem in assets/nature, default countryside-mist).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-tr-dither-wipe {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--void); font-family: var(--font-display); color: var(--white);
      }
      #sanji-tr-dither-wipe .slot-photo { display: none; }
      #sanji-tr-dither-wipe .scene { position: absolute; inset: 0; overflow: hidden; }
      #sanji-tr-dither-wipe .sceneB img { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; display: block; }
      #sanji-tr-dither-wipe .sceneB .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.25) 100%); }

      #sanji-tr-dither-wipe .sceneA { background: var(--cobalt-wash); }
      #sanji-tr-dither-wipe .sceneA .grid { position: absolute; inset: 0; background: var(--cell-grid); }
      #sanji-tr-dither-wipe .sceneA .g {
        position: absolute; left: 50%; top: 50%; width: 880px; height: 380px; margin: -190px 0 0 -440px;
        border-radius: var(--r-card); box-sizing: border-box;
        background: var(--glass-fill-active); border: var(--rim) solid var(--glass-rim-active); box-shadow: var(--glass-shadow-active);
      }
      #sanji-tr-dither-wipe .sceneA .badge {
        position: absolute; left: 56px; top: 50%; width: 150px; height: 150px; margin-top: -75px; border-radius: 50%; box-sizing: border-box;
        background: var(--badge-fill); border: var(--rim) solid var(--badge-rim);
        display: flex; align-items: center; justify-content: center;
      }
      #sanji-tr-dither-wipe .sceneA .mono { position: absolute; left: 250px; top: 112px; font-family: var(--font-mono); font-size: 24px; color: var(--white-soft); }
      #sanji-tr-dither-wipe .sceneA .ttl {
        position: absolute; left: 248px; top: 150px; font-weight: var(--wt-heavy); font-size: 104px; line-height: 0.9;
        letter-spacing: var(--track-caps); text-transform: uppercase;
      }
      #sanji-tr-dither-wipe canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="sanji-tr-dither-wipe" data-composition-id="sanji-tr-dither-wipe" data-start="0" data-width="1920" data-height="1080">
      <span class="slot-photo" data-slot="photo">countryside-mist</span>
      <div class="scene sceneB"><img class="photo" alt="" /><div class="vig"></div></div>
      <div class="scene sceneA">
        <div class="grid"></div>
        <div class="g">
          <div class="badge"><svg width="70" height="70" viewBox="0 0 24 24"><path fill="#FFFFFF" d="M12 2.5l2.1 6.4 6.4 2.1-6.4 2.1L12 19.5l-2.1-6.4L3.5 11l6.4-2.1z"/></svg></div>
          <div class="mono">scene_a</div>
          <div class="ttl">The plan</div>
        </div>
      </div>
      <canvas class="dither" width="1920" height="1080"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const ID = "sanji-tr-dither-wipe";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s);
        const css = getComputedStyle(document.documentElement);
        const tok = (n) => css.getPropertyValue(n).trim();

        const stem = ($(".slot-photo").textContent || "countryside-mist").trim();
        const img = $(".photo");
        img.src = "../../assets/nature/" + stem + ".jpg";

        const W = 1920, H = 1080, CELL = 14, COLS = Math.ceil(W / CELL), ROWS = Math.ceil(H / CELL), N = COLS * ROWS;
        const PAL = [tok("--cobalt-ink"), tok("--cobalt"), tok("--cobalt-lift"), tok("--volt"), tok("--volt-soft"), tok("--white")];
        const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
        let seed = 90210; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
        const diag = new Float32Array(N), bay = new Float32Array(N), lvB = new Uint8Array(N).fill(2), lvA = new Uint8Array(N);
        const KX = 0.58, KY = 0.42;
        for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
          const i = y * COLS + x;
          bay[i] = BAYER[(y % 4) * 4 + (x % 4)];
          diag[i] = ((x + 0.5) / COLS) * KX + (1 - (y + 0.5) / ROWS) * KY + (rnd() - 0.5) * 0.03;
          /* scene A cells: cobalt field, brighter where the glass card sits */
          const px = x * CELL, py = y * CELL;
          const inCard = px > 520 && px < 1400 && py > 350 && py < 730;
          lvA[i] = inCard ? (bay[i] < 0.55 ? 2 : 3) : (bay[i] < 0.7 ? 1 : 2);
        }
        function prep() {
          const off = document.createElement("canvas"); off.width = COLS; off.height = ROWS;
          const o = off.getContext("2d"); o.drawImage(img, 0, 0, COLS, ROWS);
          const d = o.getImageData(0, 0, COLS, ROWS).data;
          for (let i = 0; i < N; i++) {
            const l = (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) / 255;
            const v = Math.min(0.999, Math.max(0, Math.pow(l, 1.1) * 1.1 + (bay[i] - 0.5) * 0.42));
            lvB[i] = Math.floor(v * PAL.length);
          }
        }

        /* scene A clip: keep the half-plane ahead of the band front (d > p) */
        const dOf = (x, y) => (x / W) * KX + (1 - y / H) * KY;
        function clipA(p) {
          const pts = [[0, 0], [W, 0], [W, H], [0, H]], out = [];
          for (let k = 0; k < 4; k++) {
            const a = pts[k], b = pts[(k + 1) % 4];
            const da = dOf(a[0], a[1]) - p, db = dOf(b[0], b[1]) - p;
            if (da > 0) out.push(a);
            if ((da > 0) !== (db > 0)) { const t = da / (da - db); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
          }
          return out.length ? "polygon(" + out.map((q) => q[0].toFixed(1) + "px " + q[1].toFixed(1) + "px").join(",") + ")" : "polygon(0 0,0 0,0 0)";
        }

        const cv = $("canvas.dither"), ctx = cv.getContext("2d");
        const sceneA = $(".sceneA");
        const BW = 0.2;
        const ease = gsap.parseEase("sine.inOut");
        const S0 = 0.04, S1 = 1.08;
        let lastT = 0;
        function draw(t) {
          lastT = t;
          const k = Math.min(1, Math.max(0, (t - S0) / (S1 - S0)));
          const p = -BW - 0.03 + ease(k) * (1 + 2 * BW + 0.06);
          sceneA.style.clipPath = k <= 0 ? "none" : clipA(p);
          ctx.clearRect(0, 0, W, H);
          if (k <= 0 || k >= 1) return;
          for (let i = 0; i < N; i++) {
            const u = (p - diag[i]) / BW;          /* -1 front edge (over A) .. +1 trailing edge (over B) */
            if (u <= -1 || u >= 1) continue;
            const dens = 1 - Math.abs(u);
            if (bay[i] > dens * 1.08) continue;
            let L = u < 0 ? lvA[i] : lvB[i];
            if (Math.abs(u) < 0.22) L = Math.min(PAL.length - 1, L + 2);       /* hot core of the band */
            ctx.fillStyle = PAL[L];
            ctx.fillRect((i % COLS) * CELL, ((i / COLS) | 0) * CELL, CELL, CELL);
          }
        }
        const onImg = () => { try { prep(); } catch (e) {} draw(lastT); };
        if (img.complete && img.naturalWidth) onImg(); else img.addEventListener("load", onImg);

        const tl = gsap.timeline({ paused: true });
        const END = 1.2;
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0)
          .fromTo($(".sceneA .g"), { scale: 1 }, { scale: 1.04, duration: S1, ease: "sine.in" }, 0)
          .fromTo($(".sceneB img"), { scale: 1.07 }, { scale: 1.0, duration: END, ease: "power2.out" }, 0)
          .set({}, {}, END);

        draw(0);
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
