<!doctype html>
<!--
  SANJI · transition · FEED SCROLL
  Scene A (COBALT glass stat tile) to scene B (EMBER glow chips row), pushed
  vertically like flicking a feed. A short finger drag first: the frame eases
  back into a rounded "post" (scale 0.93, corners round) and creeps up a few
  px; then the release: the stack throws upward fast and takes a long
  momentum settle (expo.out), scene A leaving off the top with vertical
  smear (blur + scaleY driven by the real scroll velocity) while scene B
  rises from below. A faint liquid-glass scrollbar thumb at the right edge
  wakes up during the scroll, slides one notch down its track and fades.
  Scene B grows back to full-bleed as it lands and its chips cool from hot.
  Motion is a pure function of the timeline clock (proxy onUpdate).
  Both scenes are STAND-INS. Slots: stat (<= 6), label (<= 24), chip1-3 (<= 10).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-tr-feed-scroll {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--void); font-family: var(--font-body); color: var(--white);
      }
      #sanji-tr-feed-scroll .bgdots { position: absolute; inset: 0; background: var(--dot-grid-blue); opacity: 0.18;
        -webkit-mask-image: radial-gradient(ellipse at center, transparent 30%, #000 100%); mask-image: radial-gradient(ellipse at center, transparent 30%, #000 100%); }
      #sanji-tr-feed-scroll .view { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 540px; }
      #sanji-tr-feed-scroll .post { position: absolute; left: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 50% 50%; }
      #sanji-tr-feed-scroll .post.a { top: 0; background: var(--cobalt); }
      #sanji-tr-feed-scroll .post.b { top: 1160px; background: var(--void); box-shadow: inset 0 0 0 1.5px var(--chat-rim-dim); }
      /* scene A content */
      #sanji-tr-feed-scroll .ring { position: absolute; left: 50%; top: 50%; width: 1800px; height: 1800px; margin: -900px 0 0 -900px;
        border-radius: 50%; border: 2px solid rgba(255,255,255,0.07); background: radial-gradient(circle, rgba(255,255,255,0) 55%, rgba(255,255,255,0.035) 100%); }
      #sanji-tr-feed-scroll .tile { position: absolute; left: 660px; top: 290px; width: 600px; height: 500px; border-radius: var(--r-card); }
      #sanji-tr-feed-scroll .tile > .fill { position: absolute; inset: 0; border-radius: inherit; background: var(--glass-fill-active); border: var(--rim) solid var(--glass-rim-active); box-shadow: var(--glass-shadow-active); }
      #sanji-tr-feed-scroll .badge { position: absolute; left: 40px; top: 40px; width: 120px; height: 120px; border-radius: 50%; box-sizing: border-box;
        background: var(--badge-fill); border: var(--rim) solid var(--badge-rim); display: flex; align-items: center; justify-content: center; }
      #sanji-tr-feed-scroll .stat { position: absolute; left: 44px; top: 200px; font-family: var(--font-display); font-weight: var(--wt-heavy); font-size: var(--size-hero); line-height: 1; letter-spacing: var(--track-caps); text-shadow: 0 0 40px rgba(170,190,255,0.5); }
      #sanji-tr-feed-scroll .lab { position: absolute; left: 48px; top: 380px; font-weight: var(--wt-ui); font-size: 40px; letter-spacing: var(--track-ui); color: var(--white-soft); white-space: nowrap; }
      /* scene B content */
      #sanji-tr-feed-scroll .warm { position: absolute; inset: 0; background: var(--ember-corners); opacity: 0.8; }
      #sanji-tr-feed-scroll .vig { position: absolute; inset: 0; background: var(--vignette-dark); opacity: 0.5; }
      #sanji-tr-feed-scroll .chips { position: absolute; left: 0; right: 0; top: 476px; display: flex; justify-content: center; gap: 36px; }
      #sanji-tr-feed-scroll .chip { height: 128px; padding: 0 64px; border-radius: var(--r-pill); background: var(--chip-fill); box-shadow: 0 0 0 1.5px var(--chip-rim);
        display: flex; align-items: center; font-family: var(--font-display); font-weight: var(--wt-heavy); font-size: 60px; letter-spacing: var(--track-caps); text-transform: uppercase; color: #F3ECE6; }
      #sanji-tr-feed-scroll .grain { position: absolute; inset: 0; background: var(--grain); opacity: 0.6; mix-blend-mode: overlay; }
      /* glass scrollbar */
      #sanji-tr-feed-scroll .track { position: absolute; right: 22px; top: 160px; width: 12px; height: 760px; border-radius: 6px; background: rgba(255,255,255,0.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); opacity: 0; }
      #sanji-tr-feed-scroll .thumb { position: absolute; left: 0; top: 0; width: 12px; height: 150px; border-radius: 6px;
        background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.35)); box-shadow: 0 0 14px rgba(180,200,255,0.45), inset 0 1px 0 rgba(255,255,255,0.9); }
    </style>
  </head>
  <body>
    <div id="sanji-tr-feed-scroll" data-composition-id="sanji-tr-feed-scroll" data-start="0" data-width="1920" data-height="1080">
      <div class="bgdots"></div>
      <div class="view">
        <div class="post a">
          <div class="ring" style="transform:scale(0.5)"></div><div class="ring" style="transform:scale(0.75)"></div><div class="ring" style="transform:scale(1)"></div>
          <div class="tile"><div class="fill"></div>
            <div class="badge"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></div>
            <div class="stat" data-slot="stat">3.4x</div>
            <div class="lab" data-slot="label">more replies per post</div>
          </div>
        </div>
        <div class="post b">
          <div class="warm"></div><div class="vig"></div>
          <div class="chips">
            <div class="chip" data-slot="chip1">Create</div>
            <div class="chip" data-slot="chip2">Write</div>
            <div class="chip" data-slot="chip3">Learn</div>
          </div>
          <div class="grain"></div>
        </div>
      </div>
      <div class="track"><div class="thumb"></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-tr-feed-scroll";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => [...ROOT.querySelectorAll(s)];
        const view = $(".view"), posts = $$(".post"), thumb = $(".thumb");

        const DIST = 1160;                          /* post B top */
        const PULL0 = 0.1, DRAG0 = 0.2, DRAG = 0.16, DRAGPX = 46;
        const FLICK0 = DRAG0 + DRAG, FLICK = 1.15;
        const LAND = FLICK0 + FLICK;
        const END = 1.9;
        const eF = gsap.parseEase("expo.out"), eD = gsap.parseEase("power2.in"), eK = gsap.parseEase("power2.inOut");
        const c01 = (x) => Math.max(0, Math.min(1, x));

        /* scroll offset as a pure function of time */
        const Y = (t) => {
          const d = DRAGPX * eD(c01((t - DRAG0) / DRAG));
          const f = (DIST - DRAGPX) * eF(c01((t - FLICK0) / FLICK));
          return d + f;
        };
        /* "post" scale: pull back into a card for the scroll, full-bleed again on landing */
        const K = (t) => {
          const out = eK(c01((t - PULL0) / 0.24));
          const back = eK(c01((t - (FLICK0 + 0.5)) / 0.55));
          return 1 - 0.07 * out * (1 - back);
        };

        function apply(t) {
          const y = Y(t);
          const v = Math.abs(Y(t + 0.01) - Y(t - 0.01)) / 0.02;   /* px / s */
          const k = K(t);
          const sm = Math.min(1, v / 9000);                         /* smear amount 0..1 */
          view.style.transform = `scale(${k.toFixed(4)})`;
          const rad = ((1 - k) / 0.07) * 48;
          posts.forEach((p) => {
            p.style.transform = `translateY(${(-y).toFixed(1)}px) scaleY(${(1 + 0.07 * sm).toFixed(4)})`;
            p.style.filter = `blur(${(sm * 12).toFixed(2)}px)`;
            p.style.borderRadius = rad.toFixed(1) + "px";
          });
          /* scrollbar: one notch down the track, mirrors the scroll */
          thumb.style.transform = `translateY(${(140 + (y / DIST) * 150).toFixed(1)}px) scaleY(${(1 + 0.25 * sm).toFixed(3)})`;
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => apply(P.t) }, 0);
        /* scrollbar wakes, then fades after the settle */
        tl.fromTo($(".track"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, DRAG0)
          .to($(".track"), { opacity: 0, duration: 0.4, ease: "power2.inOut" }, FLICK0 + 0.95);
        /* scene B chips arrive glowing and cool */
        const chips = $$(".chip");
        chips.forEach((c, i) => {
          const t = FLICK0 + 0.28 + i * 0.08;
          tl.fromTo(c, { boxShadow: "0 0 0 1.5px rgba(255,140,50,0.95), 0 0 26px rgba(255,122,26,0.65), 0 0 60px rgba(255,122,26,0.35)", color: "#FFB347" },
            { boxShadow: "0 0 0 1.5px rgba(255,255,255,0.16), 0 0 0px rgba(255,122,26,0), 0 0 0px rgba(255,122,26,0)", color: "#F3ECE6", duration: 0.6, ease: "power2.out" }, t);
        });
        /* house text preset: the chips rise in as blocks on the momentum settle (80ms apart) */
        TXT.block(tl, chips, FLICK0 + 0.22);
        tl.set({}, {}, END);
        apply(0);
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
