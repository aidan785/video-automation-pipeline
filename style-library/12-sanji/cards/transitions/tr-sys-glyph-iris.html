          }
          /* a second tracker below, opposite side */
          const a2 = 1.15, x2 = CX + Math.cos(a2) * (R + 16), y2 = CY + Math.sin(a2) * (R + 16);
          if (R > 40 && x2 < 1700 && y2 < 1030) micro(x2 + 12, y2, lab("iris " + pad(c01(R / RMAX) * 100, 2) + "%", t, T_OPEN + f(6), tOut, 73));
          /* corners */
          micro(48, 1024, lab("/* glyph iris */ frame " + pad(fr, 3), t, 0.25, T_COVER + 0.1, 74));
          micro(1630, 40, lab("rim  $#%C", t, T_OPEN, T_COVER + 0.1, 75));
          micro(48, 40, lab("[ RUN ] open", t, T_OPEN + f(2), T_COVER - f(4), 76));
        }

        function draw(t) {
          const R = Rat(t);
          /* A leans in a hair as the iris eats it */
          $(".sceneA").style.transform = `scale(${(1 + 0.03 * open(c01((t - T_OPEN) / OPEN))).toFixed(4)})`;
          $(".sceneA").style.visibility = R > DMAX + 4 ? "hidden" : "visible";
          drawB(t, R); drawRing(t, R); drawMicro(t, R);
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) {
          Promise.all([document.fonts.load(TF), document.fonts.load(MF)]).then(() => draw(P.t), () => {});
          document.fonts.ready.then(() => draw(P.t));
        }
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
