<!doctype html>
<!--
  SANJI · transition · SYSTEM TAG WALL
  references/system s15, s16 (f289-336). Scene A (statement + chip) holds a
  beat, then a wall of one-word tags (about half of them inverse chips) fills
  the frame row by row from the top in 10 frames, covering A. The wall
  jitters: every 2 frames a share of the tags re-roll their word, flip their
  chip state and hop one cell sideways. On the bar line the wall parts from
  the center outward: center columns slide away first, left half to the left,
  right half to the right, revealing scene B, whose chip scrambles in.
  Slots: a_text (<= 28), a_chip (<= 12), b_text (<= 28), b_chip (<= 12),
  tags (comma list, 3-10 single words, <= 8 chars each).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-tr-system-tag-wall {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--sys-blue); font-family: var(--font-term);
      }
      #sanji-tr-system-tag-wall canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #sanji-tr-system-tag-wall .glow { filter: drop-shadow(0 0 4px rgba(225,232,255,0.45)); }
      #sanji-tr-system-tag-wall .scan { position: absolute; inset: 0; background: var(--sys-scan); }
      #sanji-tr-system-tag-wall .src { display: none; }
    </style>
  </head>

    <div id="sanji-tr-system-tag-wall" data-composition-id="sanji-tr-system-tag-wall" data-start="0" data-width="1920" data-height="1080">
      <canvas class="field glow"></canvas>
      <canvas class="main glow"></canvas>
      <canvas class="wallbg"></canvas>
      <canvas class="wallink glow"></canvas>
      <div class="scan"></div>
      <div class="src">
        <span data-slot="a_text">Your timeline &gt;</span>
        <span data-slot="a_chip">Raw</span>
        <span data-slot="b_text">Your timeline &gt;</span>
        <span data-slot="b_chip">Finished</span>
        <span data-slot="tags">Edit,Cut,Render,Trim,Sync,Export,Grade,Mix</span>
      </div>
    </div>

        const ID = "sanji-tr-system-tag-wall";
