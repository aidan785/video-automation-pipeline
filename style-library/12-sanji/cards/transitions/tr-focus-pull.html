<!doctype html>
<!--
  SANJI · transition · FOCUS PULL
  A rack focus from NATURE to COBALT. Scene A is a landscape photo with a
  translucent liquid-glass pill holding a line (the pill takes the photo's own
  tint). The lens racks: A blurs heavily (0 to 30px) and recedes (scale 0.94)
  while scene B, a cobalt glass card, comes FORWARD from scale 1.06 and
  blur 24px to sharp. The two overlap for ~0.5s, and a soft exposure bloom
  (screen-blended warm white) swells at the crossover so the handoff feels
  optical rather than a dissolve. B's contents land last with a small stagger.
  ~1.6s. Slots: line (<= 28), photo (green-hills | hills-sunset |
  countryside-mist | wheat-field), file (mono <= 14), title (caps, <= 14).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-tr-focus-pull {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--cobalt); font-family: var(--font-body); color: var(--white);
      }
      #sanji-tr-focus-pull .slot-photo { display: none; }
      #sanji-tr-focus-pull .sceneA, #sanji-tr-focus-pull .sceneB { position: absolute; inset: 0; transform-origin: 50% 50%; }
      #sanji-tr-focus-pull .sceneA img { position: absolute; left: -80px; top: -45px; width: 2080px; height: 1170px; object-fit: cover; display: block; }
      #sanji-tr-focus-pull .shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.28) 100%); }
      #sanji-tr-focus-pull .pillwrap { position: absolute; left: 0; right: 0; top: 50%; height: 124px; margin-top: -62px; display: flex; justify-content: center; }
      #sanji-tr-focus-pull .pill {
        position: relative; box-sizing: border-box; min-width: 820px; height: 124px; padding: 0 76px;
        border-radius: var(--r-pill); overflow: hidden; display: flex; align-items: center; justify-content: center;
        -webkit-backdrop-filter: blur(22px) saturate(1.4) brightness(1.1); backdrop-filter: blur(22px) saturate(1.4) brightness(1.1);
        background: linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.05) 46%, rgba(0,0,0,0.07) 100%);
        border: var(--rim) solid rgba(255,255,255,0.35);
        box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.55), inset 0 -18px 34px rgba(0,0,0,0.10), 0 22px 60px rgba(0,0,0,0.20);
      }
      #sanji-tr-focus-pull .pill .hl {
        position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        background: radial-gradient(34% 120% at 9% -10%, rgba(255,255,255,0.42), rgba(255,255,255,0) 70%), radial-gradient(40% 90% at 92% 120%, rgba(255,255,255,0.10), rgba(255,255,255,0) 70%);
      }
      #sanji-tr-focus-pull .pill .line {
        position: relative; white-space: nowrap; font-weight: var(--wt-bold); font-size: 64px; letter-spacing: var(--track-ui); line-height: 1;
        text-shadow: 0 2px 14px rgba(0,0,0,0.16);
      }

      /* scene B: cobalt glass card */
      #sanji-tr-focus-pull .sceneB { background: radial-gradient(55% 60% at 50% 50%, rgba(255,255,255,0.09), rgba(255,255,255,0) 70%), var(--cobalt); font-family: var(--font-display); }
      #sanji-tr-focus-pull .ring {
        position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 2px solid rgba(255,255,255,0.07);
        background: radial-gradient(circle, rgba(255,255,255,0) 55%, rgba(255,255,255,0.03) 100%);
      }
      #sanji-tr-focus-pull .g { position: absolute; left: 760px; top: 340px; width: 400px; height: 400px; box-sizing: border-box; border-radius: var(--r-tile); }
      #sanji-tr-focus-pull .g > .lit { position: absolute; inset: 0; border-radius: inherit; box-sizing: border-box; background: var(--glass-fill-active); border: var(--rim) solid var(--glass-rim-active); box-shadow: var(--glass-shadow-active); }
      #sanji-tr-focus-pull .g .badge {
        position: absolute; left: 36px; top: 36px; width: 146px; height: 146px; border-radius: 50%; box-sizing: border-box;
        background: var(--badge-fill); border: var(--rim) solid var(--badge-rim); display: flex; align-items: center; justify-content: center;
      }
      #sanji-tr-focus-pull .g .file { position: absolute; right: 36px; top: 42px; font-family: var(--font-mono); font-size: 22px; color: var(--white-soft); }
      #sanji-tr-focus-pull .g .title { position: absolute; left: 32px; right: 24px; bottom: 32px; font-weight: var(--wt-heavy); font-size: 50px; line-height: 0.92; letter-spacing: var(--track-caps); text-transform: uppercase; }

      #sanji-tr-focus-pull .bloom {
        position: absolute; inset: -10%; pointer-events: none; mix-blend-mode: screen; opacity: 0;
        background: radial-gradient(50% 50% at 50% 50%, rgba(255,250,240,0.95) 0%, rgba(255,236,214,0.55) 35%, rgba(200,215,255,0.18) 65%, rgba(255,255,255,0) 85%);
      }
    </style>
  </head>
  <body>
    <div id="sanji-tr-focus-pull" data-composition-id="sanji-tr-focus-pull" data-start="0" data-width="1920" data-height="1080">
      <span class="slot-photo" data-slot="photo">green-hills</span>
      <div class="sceneA">
        <img class="photo" alt="" />
        <div class="shade"></div>
        <div class="pillwrap"><div class="pill"><div class="hl"></div><div class="line" data-slot="line">and clients have no idea?</div></div></div>
      </div>
      <div class="sceneB">
        <div class="ring" style="width:1300px;height:1300px;margin:-650px 0 0 -650px"></div>
        <div class="ring" style="width:2000px;height:2000px;margin:-1000px 0 0 -1000px"></div>
        <div class="g"><div class="lit"></div>
          <div class="badge b-in"><svg width="70" height="70" viewBox="0 0 24 24"><path fill="#FFFFFF" d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path fill="#3A46E8" d="M14 2v6h6z" opacity="0.55"/><path fill="#3A46E8" d="M12 11.2l1.05 2.6 2.6 1.05-2.6 1.05L12 18.5l-1.05-2.6-2.6-1.05 2.6-1.05z"/></svg></div>
          <div class="file b-in" data-slot="file">SKILL.md</div>
          <div class="title b-in" data-slot="title">The whole<br>workflow</div>
        </div>
      </div>
      <div class="bloom"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-tr-focus-pull";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => [...ROOT.querySelectorAll(s)];

        const OK = ["green-hills", "hills-sunset", "countryside-mist", "wheat-field"];
        const stem = ($(".slot-photo").textContent || "").trim();
        $(".photo").src = "../../assets/nature/" + (OK.includes(stem) ? stem : "green-hills") + ".jpg";

        const tl = gsap.timeline({ paused: true });
        const RACK = 0.32;                      /* A starts to defocus */
        const A_D = 0.78, B_IN = RACK + 0.28, B_D = 0.7, END = B_IN + B_D + 0.45;  /* title words land at B_IN + 1.1 */

        tl.set($(".sceneB"), { autoAlpha: 0 }, 0);

        /* scene A ambient push while it holds */
        tl.fromTo($(".sceneA img"), { scale: 1.0 }, { scale: 1.03, duration: RACK + A_D, ease: "sine.inOut" }, 0);

        /* A racks out of focus and recedes */
        tl.to($(".sceneA"), { filter: "blur(30px)", scale: 0.94, duration: A_D, ease: "power2.inOut" }, RACK)
          .to($(".sceneA"), { autoAlpha: 0, duration: 0.5, ease: "power1.inOut" }, RACK + A_D - 0.45);

        /* B comes forward from blur, overlapping ~0.5s */
        tl.fromTo($(".sceneB"), { autoAlpha: 0, scale: 1.06, filter: "blur(24px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: B_D, ease: "power3.out" }, B_IN);

        /* exposure bloom at the crossover */
        tl.fromTo($(".bloom"), { opacity: 0, scale: 0.8 }, { keyframes: [{ opacity: 0.55, scale: 1, duration: 0.26, ease: "power2.out" }, { opacity: 0, scale: 1.15, duration: 0.42, ease: "power2.in" }] }, B_IN - 0.06);

        /* B contents land last */
        tl.fromTo($(".g"), { scale: 0.94 }, { scale: 1.03, duration: 0.7, ease: "expo.out" }, B_IN + 0.2);
        /* house text preset: badge + file label rise as blocks, the title pours in word by word */
        TXT.block(tl, [$(".badge"), $(".file")], B_IN + 0.3);
        TXT.reveal(tl, $(".title"), B_IN + 0.36);

        tl.set({}, {}, END);
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
