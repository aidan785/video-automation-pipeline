<!doctype html>
<!--
  SANJI · transition · EMBER SWEEP
  PAPER to EMBER on a light leak. Scene A is a white paper line. An orange
  light leak pours in from the top-right corner (the same corner the ember
  light lives in): first the page warms (a multiply wash, the ink tints
  ember), then a radial leak with a white-hot core accelerates across the
  frame (power2.in) with a diagonal flare streak, washing everything to warm
  white-hot at the peak. Under cover the cut happens. The leak then recedes
  back INTO the top-right corner (expo.out) and becomes scene B's ember corner
  light, revealing the dark chat box, whose rim and send button arrive hot and
  cool down. ~1.8s. Slots: line (<= 30), prompt (<= 30), model (<= 12).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #sanji-tr-ember-sweep {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--void); font-family: var(--font-body); color: var(--white);
      }
      /* scene A: paper */
      #sanji-tr-ember-sweep .sceneA { position: absolute; inset: 0; background: var(--paper); }
      #sanji-tr-ember-sweep .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #sanji-tr-ember-sweep .line { white-space: nowrap; font-family: var(--font-display); font-weight: var(--wt-bold); font-size: 96px; letter-spacing: var(--track-tight); line-height: 1.1; color: var(--ink); }
      #sanji-tr-ember-sweep .warmA {
        position: absolute; inset: 0; mix-blend-mode: multiply; opacity: 0;
        background: radial-gradient(90% 95% at 100% 0%, rgba(255,150,70,0.95) 0%, rgba(255,190,130,0.55) 40%, rgba(255,255,255,0) 80%);
      }

      /* scene B: ember chat */
      #sanji-tr-ember-sweep .sceneB { position: absolute; inset: 0; background: var(--void); }
      #sanji-tr-ember-sweep .warm { position: absolute; inset: 0; background: var(--ember-corners); }
      #sanji-tr-ember-sweep .vig { position: absolute; inset: 0; background: var(--vignette-dark); opacity: 0.5; }
      #sanji-tr-ember-sweep .box {
        position: absolute; left: 260px; top: 400px; width: 1400px; height: 280px; box-sizing: border-box;
        border-radius: var(--r-chat); background: var(--chat-fill);
        border: var(--rim) solid var(--chat-rim); box-shadow: var(--chat-shadow);
      }
      #sanji-tr-ember-sweep .prompt { position: absolute; left: 54px; top: 44px; font-weight: 500; font-size: 44px; letter-spacing: var(--track-ui); color: #EFE7E1; white-space: pre; }
      #sanji-tr-ember-sweep .plus { position: absolute; left: 50px; bottom: 40px; width: 38px; height: 38px; }
      #sanji-tr-ember-sweep .tools { position: absolute; right: 36px; bottom: 30px; display: flex; align-items: center; gap: 28px; color: #E9E2DC; font-size: 32px; font-weight: 500; letter-spacing: var(--track-ui); }
      #sanji-tr-ember-sweep .tools svg { display: block; }
      #sanji-tr-ember-sweep .send { width: 72px; height: 72px; border-radius: 20px; background: var(--ember); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 30px rgba(255,122,26,0.35); }
      #sanji-tr-ember-sweep .grain { position: absolute; inset: 0; background: var(--grain); opacity: 0.6; mix-blend-mode: overlay; }

      /* the leak: radial pool centred on the top-right corner */
      #sanji-tr-ember-sweep .leak {
        position: absolute; left: 1120px; top: -800px; width: 1600px; height: 1600px; border-radius: 50%;
        transform-origin: 50% 50%; pointer-events: none; opacity: 0;
        background: radial-gradient(circle, rgba(255,250,240,1) 0%, rgba(255,236,206,1) 24%, rgba(255,196,120,0.98) 38%, rgba(255,140,50,0.85) 52%, rgba(160,60,18,0.5) 70%, rgba(3,1,0,0) 100%);
        filter: blur(24px);
      }
      #sanji-tr-ember-sweep .flare {
        position: absolute; left: 700px; top: -120px; width: 1500px; height: 90px; border-radius: 50%;
        transform-origin: 100% 50%; transform: rotate(-33deg); pointer-events: none; opacity: 0;
        background: linear-gradient(90deg, rgba(255,122,26,0) 0%, rgba(255,150,60,0.4) 35%, rgba(255,210,150,0.95) 80%, rgba(255,245,230,1) 94%, rgba(255,200,120,0) 100%);
        filter: blur(12px);
      }
      #sanji-tr-ember-sweep .wash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(120% 120% at 100% 0%, rgba(255,254,250,1) 0%, rgba(255,244,228,1) 55%, rgba(255,228,196,1) 100%); }
    </style>
  </head>
  <body>
    <div id="sanji-tr-ember-sweep" data-composition-id="sanji-tr-ember-sweep" data-start="0" data-width="1920" data-height="1080">
      <div class="sceneB">
        <div class="warm"></div>
        <div class="vig"></div>
        <div class="box">
          <div class="prompt" data-slot="prompt">Turn this into a launch film</div>
          <svg class="plus" viewBox="0 0 24 24" fill="none" stroke="#F2ECE6" stroke-width="2" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
          <div class="tools">
            <span data-slot="model">Opus 5.5</span>
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#E9E2DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
            <div class="send"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></div>
          </div>
        </div>
        <div class="grain"></div>
      </div>
      <div class="sceneA">
        <div class="stage"><div class="line" data-slot="line">Then the light changes</div></div>
        <div class="warmA"></div>
      </div>
      <div class="leak"></div>
      <div class="flare"></div>
      <div class="wash"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
/* @text-preset:start v2 */
/* SANJI · TEXT PRESET "uppit-reveal" (single source of truth).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        const ID = "sanji-tr-ember-sweep";
        const ROOT = document.getElementById(ID);
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => [...ROOT.querySelectorAll(s)];
        const css = getComputedStyle(document.documentElement);
        const EMBER = css.getPropertyValue("--ember").trim();

        const tl = gsap.timeline({ paused: true });
        const IN = 0.3, IND = 0.55, PEAK = IN + IND, OUTD = 0.7, END = PEAK + OUTD + 0.3;   /* 1.85: prompt words land by ~1.83 */

        /* scene A: line drifts a hair; page warms, ink tints toward ember */
        tl.fromTo($(".line"), { scale: 1 }, { scale: 1.02, duration: PEAK, ease: "sine.inOut" }, 0)
          .to($(".warmA"), { opacity: 1, duration: IND, ease: "power2.in" }, IN - 0.1)
          .to($(".line"), { color: EMBER, filter: "blur(3px)", duration: IND, ease: "power2.in" }, IN + 0.05);

        /* leak pours in from the corner, accelerating */
        tl.fromTo($(".leak"), { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 3.4, duration: IND, ease: "power2.in" }, IN)
          .fromTo($(".flare"), { opacity: 0, x: 500, y: -280 }, { keyframes: [{ opacity: 1, x: 0, y: 0, duration: IND * 0.8, ease: "power2.in" }, { opacity: 0, x: -400, y: 260, duration: 0.3, ease: "power2.out" }] }, IN + 0.08)
          .fromTo($(".wash"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.in" }, PEAK - 0.16);

        /* the cut, under cover of the white-hot peak */
        tl.set($(".sceneA"), { autoAlpha: 0 }, PEAK + 0.02);

        /* recede back into the corner: wash fades, leak shrinks into the ember corner light */
        tl.to($(".wash"), { opacity: 0, duration: 0.32, ease: "power2.out" }, PEAK + 0.04)
          .to($(".leak"), { scale: 0.55, opacity: 0, duration: OUTD, ease: "expo.out" }, PEAK + 0.04)
          .fromTo($(".warm"), { opacity: 1 }, { keyframes: [{ opacity: 1, duration: 0.3 }, { opacity: 0.75, duration: 0.6, ease: "sine.inOut" }] }, PEAK);

        /* scene B resolves out of the glare; rim + send arrive hot and cool */
        tl.fromTo($(".box"), { scale: 1.05, filter: "blur(16px)" }, { scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, PEAK + 0.06)
          .fromTo($(".box"), { boxShadow: "0 0 0 1.5px rgba(255,170,80,0.95), 0 0 60px rgba(255,140,40,0.6), 0 30px 90px rgba(0,0,0,0.8)" },
                  { boxShadow: "0 0 0 1px rgba(255,120,40,0.10), 0 30px 90px rgba(0,0,0,0.8), 0 -10px 60px rgba(255,110,30,0.10)", duration: 0.6, ease: "power2.out" }, PEAK + 0.2)
          .fromTo($(".prompt"), { color: "#FFB070", textShadow: "0 0 18px rgba(255,140,40,0.8)" }, { color: "#EFE7E1", textShadow: "0 0 0px rgba(255,140,40,0)", duration: 0.5, ease: "power2.out" }, PEAK + 0.2)
          .fromTo($(".send"), { backgroundColor: "#FFC266", boxShadow: "0 0 0 10px rgba(255,179,71,0.25), 0 0 46px rgba(255,170,60,0.85)" },
                  { backgroundColor: EMBER, boxShadow: "0 0 0 22px rgba(255,179,71,0), 0 8px 30px rgba(255,122,26,0.35)", duration: 0.55, ease: "power2.out" }, PEAK + 0.24);
        /* house text preset: prompt pours in out of the glare (still cooling hot to warm white), model label rises as a block */
        TXT.reveal(tl, $(".prompt"), PEAK + 0.12, { stagger: 0.03 });
        TXT.block(tl, $('.tools [data-slot="model"]'), PEAK + 0.26);

        tl.set({}, {}, END);
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
