  resolves the cells one by one: each chip grows back to a full inverse cell
  and wipes down to reveal scene B's slice. A label riding the cascade front

              outline(o, 1); chip(o, t, cx - w / 2, cy - h / 2, w, h, sp > 0.25 ? lab : "");
              /* cell id in the corner, scrambles in a beat after the chip */
              const ta = t0 + f(2);
              if (t >= ta) { gx.font = MF(14); gx.textBaseline = "top"; gx.fillStyle = `rgba(${INK},0.62)`; gx.fillText(t < ta + f(2) ? scramble(o.id, (t - ta) / f(2), t, o.seed + 1, 2) : o.id, o.x + 12, o.y + 13); }
              chips++;
            }
          }
          /* label riding the cascade front: coordinates + progress (an inverse tag + mono line) */
          if (front && t < TEND - 0.05) {
            const fr = String(frame(t)).padStart(3, "0");
            const inPhase = t < T2;
            const pct = inPhase ? Math.round((chips / cells.length) * 100) : Math.round((done / cells.length) * 100);
            const l1 = `x:${String(front.x + 60).padStart(4, "0")} y:${String(front.y + 60).padStart(4, "0")}`;
            const l2 = `${inPhase ? ">> chip" : ">> resolve"} ${String(pct).padStart(2, "0")}%`;
            let lx = front.x + CS + 6, ly = front.y + CS - 58;
            if (lx + 190 > 1910) lx = front.x - 196;
            if (ly < 8) ly = 8;
            gx.fillStyle = BLUE; gx.fillRect(lx - 4, ly - 2, 192, 56);
            gx.font = MF(15); gx.textBaseline = "top";
            chip(null, t, lx - 2, ly, 110, 20, "");
            gx.fillStyle = BLUE; gx.fillText(`/* f${fr} */`, lx + 4, ly + 2);
            gx.fillStyle = `rgba(${INK},0.95)`; gx.fillText(l1, lx, ly + 22);
            gx.fillStyle = `rgba(${INK},0.75)`; gx.fillText(l2, lx, ly + 38);
          }
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) document.fonts.ready.then(() => { SA = makeScene(LA); SB = makeScene(LB); draw(P.t); });
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
