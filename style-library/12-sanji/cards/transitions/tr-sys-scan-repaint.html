            const s = `/* repaint :: dither > glyph > frame :: ${String(pct).padStart(2, "0")}% */`;
            const ta = T0 - 0.1;
            lbl(30, 22, t < ta + f(3) ? scramble(s, (t - ta) / f(3), t, 9, 3) : s, 0.9);
          }
        }

        const tl = gsap.timeline({ paused: true });
        const PX = { t: 0 };
        tl.fromTo(PX, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(PX.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) document.fonts.ready.then(() => { prep(); draw(PX.t); });
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
