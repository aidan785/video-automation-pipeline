<!doctype html>
<!--
  SANJI · transition · SYSTEM GRID FLIP (SYSTEM x Sanji grid flip)
  Scene A (blue-screen terminal: log + statement with an inverse chip) is cut
  into a 12 x 7 grid of SQUARE cells. In a seeded diagonal wave from the top
  left each cell lifts (shrinks so the seams open onto a dim glyph field),
  flips on its vertical axis with per-cell perspective (DOM 3D), and lands
  flat carrying scene B's slice. Near edge-on the visible face fills with
  inverse glyph noise (white cell, blue glyphs, re-rolled per frame). Every
  cell carries a tiny hex id ("0x1F") that scrambles while it flips, inverts
  for a beat as it lands, then clears. Frame counters ride the corners.
  After the last cell lands the live scene B takes over and its chip flickers.
  Faces are runtime clones of the two master scenes (slots stay on masters).
  ~2.8s. Slots: a_log ("|" list, 2-5 lines, <= 34 each), a_text (<= 20),
  a_chip (<= 10), b_text (<= 20), b_chip (<= 10), b_note (<= 30).
-->

              /* edge-on: the visible face fills with inverse glyph noise */
              const nzA = c01(1 - Math.abs(ang - 90) / 70);
              const key = nzA > 0 ? String(fr) : "";
              if (key !== o.last) { const s = nzA > 0 ? noiseBlock(o.i, fr) : ""; o.nzs[0].textContent = s; o.nzs[1].textContent = s; o.last = key; }
              o.nzs[0].style.opacity = o.nzs[1].style.opacity = (Math.min(1, nzA * 1.4)).toFixed(3);
              o.rims[0].style.opacity = o.rims[1].style.opacity = (lift * 0.85).toFixed(3);
              /* lifted tiles catch a flat ink tint, brighter as they turn */
              o.tints[0].style.opacity = o.tints[1].style.opacity = (lift * 0.07 + Math.sin(ang * Math.PI / 180) * 0.16).toFixed(3);
            }
            if (u > 0 && u < 1) { flipping++; if (o.st > fx) { fx = o.st; fy = o.i; } }
            if (u >= 1) landed++;

            /* cell id: scrambles while it flips, inverts on landing, clears */
            const id = "0x" + o.i.toString(16).toUpperCase().padStart(2, "0");
            const lx = o.c * CS + 80 + (-80 + 10) * sc, ly = o.r * CS + 80 + (-80 + 10) * sc;
            const tA = o.st + FL * 0.06, tL = o.st + FL * 0.84, tX = o.st + FL + f(1);
            if (t >= tA && t < tX && ly < 1060) {
              const s = t < tL ? "0x" + HEX[Math.floor(hash(o.i, fr, 5) * 16)] + HEX[Math.floor(hash(fr, o.i, 6) * 16)] : id;
              micro(lx, ly, t < tA + f(2) ? s.slice(0, 1 + Math.floor((t - tA) / f(1))) : s, { inv: t >= tL && t < tL + f(4), a: 0.95 });
            }
          }

          /* corner readouts: they tick on frames and clear before B settles */
          const tO = DONE - f(2);
          const fc = cells[fy] || cells[0];
          micro(48, 40, lab("flip " + pad(flipping, 2) + " . landed " + pad(landed, 2) + "/" + cells.length, t, T0 - f(4), tO, 81));
          micro(1590, 40, lab("/* frame " + pad(fr, 3) + " */", t, T0 - f(2), tO, 82));
          micro(48, 1024, lab("x:" + pad(fc.c * CS) + " y:" + pad(fc.r * CS), t, T0 + f(4), tO, 83));
          micro(1630, 1024, lab(">> wave " + pad(c01((t - T0) / (DONE - T0)) * 100, 2) + "%", t, T0 + f(2), tO, 84), { inv: true });
          micro(912, 1024, lab("rotY " + pad(180 * eIO(c01((t - T0) / (DONE - T0))), 3), t, T0 + f(6), tO, 85), { a: 0.8 });

          /* live scene B: chip flickers on/off every 2 frames, then holds on */
          const v = $(".sceneB.master .v"), k = frame(t - DONE);
          v.className = t < DONE || k >= 10 || k % 4 < 2 ? "v inv" : "v";
        }

        const tl = gsap.timeline({ paused: true });
        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        if (document.fonts) {
          document.fonts.load(MF).then(() => draw(P.t), () => {});
          document.fonts.ready.then(() => draw(P.t));
        }
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
