<!doctype html>
<!--
  HP V3 · tier1 · text · PARTICLE NUMERAL  (DUSK hero, ported from sanji t1-particle-numeral)
  Retrofit 2: one of group B's two light-on hero cards (photo held in night,
  burn corner glowing, grain on); the daylight-through-the-dark motes ARE the idea.
  On flat grounds or none the motes are solid gold.
  The headline money / number moment, after dark. A field at the last of the
  sun, held in night (only the burn corner glows), the ground perfectly still.
  A short cream line pours in up top, then the figure arrives OVERFILLING the
  frame and dollies back into place: it is built from thousands of seeded
  motes of light, and every mote is a tiny window onto the same field in full
  sun (the photo pinned to the ground geometry, gold-warmed), so the number
  reads as daylight through the dark. The motes shimmer (seeded per-mote
  twinkle), the figure takes the lub-dub when it lands, and a few loose motes
  lift off its edges on the wind like seed fluff. The figure is the frame's
  one gold. No orange.
  Canvas drawn from the timeline clock (proxy onUpdate), seeded LCG, no rAF.
  Slots: ground (photo), grain (on), light (on), figure (text <=6, e.g. $2,400, 3x, 98%), line (text <=28),
  photo (nature stem, default field-sunset).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #hp3-t1-particle-numeral { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--hp-deep); font-family: var(--font-body); color: var(--hp-cream); }
      #hp3-t1-particle-numeral .slot-photo, #hp3-t1-particle-numeral .slot-fig { display: none; }
      #hp3-t1-particle-numeral .fg-night { opacity: 0.84; }
      #hp3-t1-particle-numeral .line { position: absolute; left: 0; right: 0; top: 196px; text-align: center; font-size: 76px; white-space: nowrap; }
      #hp3-t1-particle-numeral canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 50% 62%; }
    </style>
  </head>
  <body>
    <div id="hp3-t1-particle-numeral" data-composition-id="hp3-t1-particle-numeral" data-start="0" data-width="1920" data-height="1080">
      <span class="fg-slot" data-slot="ground">photo</span><span class="fg-slot" data-slot="grain">on</span><span class="fg-slot" data-slot="light">on</span>
      <span class="slot-photo" data-slot="photo">field-sunset</span>
      <span class="slot-fig" data-slot="figure">$2,400</span>
      <div class="fg-ground">
        <img class="fg-photo" alt="" />
        <div class="fg-shade"></div>
        <div class="fg-flare"></div>
        <div class="fg-night"></div>
      </div>
      <div class="line fg-display" data-slot="line">Added to Dana's month</div>
      <canvas width="1920" height="1080"></canvas>
      <div class="fg-grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

/* @text-preset:start v2 */
/* HP V3 copy of the Sanji TEXT PRESET "uppit-reveal" (source of truth for 15-humanly-possible-v3).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;

      let t = x;

    if (!el) return [];
    if (el._tpWords) return el._tpWords;

       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };

            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }

            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;

    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {

    });

  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();

  }

    const d = el.matches(".fg-dapple") ? el : el.querySelector(".fg-dapple");
    if (d) tl.fromTo(d, { x: -60, y: 10 }, { x: 60, y: -14, duration: dur, ease: "sine.inOut" }, at);
  }

/* @field-glass:end */
        const ID = "hp3-t1-particle-numeral";
        const ROOT = document.getElementById(ID);

        const src = "../../assets/nature/" + stem + ".jpg";

          x.font = font(S); x.letterSpacing = (-0.05 * S) + "px";

        const T_FIG = 1.35, END = 6.2;
        /* the canvas redraws after every child tween has rendered (timeline onUpdate), from the timeline clock */
        const tl = gsap.timeline({ paused: true, onUpdate: () => draw(tl.time()) });

        /* ground stays still (the motes are pinned to it); only the light moves */
        tl.fromTo($(".fg-night"), { "--sr": 0 }, { "--sr": 52, duration: 1.6, ease: FG.GLIDE }, 0);
        tl.fromTo($(".fg-flare"), { opacity: 0, scale: 0.4 }, { keyframes: [{ opacity: 0.9, scale: 1, duration: 0.9, ease: "power2.out" }, { opacity: 0.5, duration: 1.4, ease: "sine.inOut" }] }, 0);
        tl.to($(".fg-flare"), { x: 140, y: -50, duration: END - 1.0, ease: "sine.inOut" }, 1.0);

        TXT.reveal(tl, $(".line"), 0.35);

        /* the figure arrives overfilling the frame and dollies back */
        tl.fromTo(P, { a: 0 }, { a: 1, duration: 0.35, ease: "power2.out" }, T_FIG)
          .fromTo(P, { s: 1.9 }, { s: 1, duration: 1.25, ease: FG.SETTLE }, T_FIG);
        FG.beat(tl, cv, T_FIG + 1.15, { amp: 0.5 });
        tl.fromTo(P, { lift: 0 }, { lift: 1, duration: END - (T_FIG + 1.4), ease: "sine.inOut" }, T_FIG + 1.4);

        tl.set({}, {}, END);
        draw(0);
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
