<!doctype html>
<!--
  HP V3 · tier1 · text · NUMBER MORPH  (photo, ported from sanji t1-number-morph)
  Retrofit 2 default: misty valley dimmed evenly to dusk (no corner light, no
  grain). On flat grounds or none the landed number turns solid gold instead
  of a window.
  Before / after growth stat, slot-machine style. A misty valley at the last of
  the sun, held in night, the ground perfectly still. The starting value
  settles in cream. Then every digit column rolls (soft motion blur, tinted
  warm while it spins) and the columns land one after another, left to right,
  on the new value; columns the new number needs grow in from zero width as
  they roll. Each column settles from gold to cream as it lands. When the
  last one lands, a hand-speed wipe crosses the number and it becomes a
  WINDOW onto the same valley in full sun (the photo pinned to the ground,
  gold-warmed, the frame's one gold), takes the lub-dub, and the label pours
  in underneath. No orange.
  Slots: ground (photo), grain (off), light (off), from (text, digits + separators, <=11), to (text, digits + separators, <=11),
  label (text <=28), photo (nature stem, default misty-sunrise).
-->

    <link rel="stylesheet" href="../../tokens.css" />
    <style>

      #hp3-t1-number-morph .slot-photo, #hp3-t1-number-morph .src { display: none; }
      #hp3-t1-number-morph .fg-night { opacity: 0.84; }
      /* retrofit 2: no corner light; the photo is held at dusk by an even dim so the window reads */
      #hp3-t1-number-morph .dusk { position: absolute; inset: 0; background: rgba(var(--deep-rgb), 0.62); }
      #hp3-t1-number-morph:not([data-ground="photo"]) .dusk { display: none; }
      #hp3-t1-number-morph .num, #hp3-t1-number-morph .win { position: absolute; left: 0; top: 0; display: flex; white-space: nowrap;
        font-family: var(--font-display); font-variation-settings: var(--display-opsz); font-weight: 800; letter-spacing: 0; line-height: 1; }
      #hp3-t1-number-morph .col { position: relative; display: block; overflow: visible; clip-path: inset(0 -40px); flex: none; }
      #hp3-t1-number-morph .col.edge { clip-path: inset(0 0); }

          num.style.left = ((1920 - M.wF.reduce((a, b) => a + b, 0)) / 2) + "px";
          win.style.left = ((1920 - tot) / 2) + "px";
          win.style.backgroundPosition = `0 0, ${-96 - win.offsetLeft}px ${-54 - top}px`;
        };
        if (ROOT.dataset.ground !== "photo") win.style.backgroundImage = "linear-gradient(#FFC145, #FFC145), linear-gradient(#FFC145, #FFC145)";
        else win.style.backgroundImage = `linear-gradient(rgba(255,193,69,0.30), rgba(255,138,76,0.12)), url("${src}")`;
        win.style.backgroundSize = "100% 100%, 2112px 1188px";
        if (ROOT.dataset.ground === "photo") win.style.filter = "brightness(1.9) saturate(1.15)";
        place(); if (document.fonts) document.fonts.ready.then(place);

        const R0 = 1.55, LAND = 1.05, LSTEP = 0.13, LAST = R0 + LAND + (n - 1) * LSTEP, W0 = LAST + 0.35, END = W0 + 3.0;
        const tl = gsap.timeline({ paused: true });

        /* ground stays still (the window is pinned to it); light does the moving */
        tl.fromTo($(".fg-night"), { "--sr": 0 }, { "--sr": 50, duration: 1.6, ease: FG.GLIDE }, 0);
        tl.fromTo($(".fg-flare"), { opacity: 0, scale: 0.4 }, { opacity: 0.6, scale: 0.9, duration: 1.6, ease: "power2.out" }, 0);
        tl.to($(".fg-flare"), { x: 150, y: -50, duration: END - 1.6, ease: "sine.inOut" }, 1.6);

        /* the starting value settles in */
        TXT.block(tl, num, 0.35, { blur: 8 });

        /* roll: all columns spin, landing left to right; the row re-centers as columns grow */
        cols.forEach((c, i) => {
          const land = R0 + LAND + i * LSTEP, d = land - R0;
          if (c.steps > 0) {
            tl.to(c.strip, { y: () => -c.steps * M.LH, duration: d, ease: "power3.inOut" }, R0)
              .fromTo(c.strip, { filter: "blur(0px)" }, { keyframes: [{ filter: "blur(7px)", duration: d * 0.35, ease: "power1.in" }, { filter: "blur(7px)", duration: d * 0.35 }, { filter: "blur(0px)", duration: d * 0.3, ease: "power2.out" }] }, R0)
              .fromTo(c.strip, { color: CREAM }, { color: GOLD, duration: 0.3, ease: "power1.out" }, R0)
              .to(c.strip, { color: CREAM, duration: 0.55, ease: "power1.inOut" }, land);
          }
          tl.to(c.col, { width: () => M.wT[i], duration: 0.7, ease: FG.SETTLE }, R0 + 0.1);
        });
        tl.to(num, { left: () => (1920 - M.wT.reduce((a, b) => a + b, 0)) / 2, duration: 0.8, ease: FG.SETTLE }, R0 + 0.1);

        /* the wipe: the landed number becomes a window onto the valley in sun */
        tl.fromTo(win, { "--w": -30 }, { "--w": 110, duration: 0.95, ease: "power2.inOut" }, W0)
          .to(num, { opacity: 0, duration: 0.8, ease: "power2.inOut" }, W0 + 0.1);
        FG.beat(tl, win, W0 + 0.95, { amp: 0.6 });
        TXT.reveal(tl, $(".label"), W0 + 0.6);
        tl.set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
