<!doctype html>
<!--
  HP V3 · tier1 · text · KINETIC SEQUENCE  (Field Glass, OVERLAY, window type; Sanji paper kinetic-sequence in HP)
  DEFAULT (pass 2): no background, cream ink, no grain, no light (corner sun pool removed).
  ground=cream flips the ink to oxblood (Sanji's paper look). The beat-1 window keeps its photo.
  One sentence in three beats, the same words travelling between layouts
  (FLIP, measured after fonts).
    beat 1  one HUGE word, centered, as a WINDOW: a hand-speed wipe opens the
            glyphs onto a sunlit meadow (gold-warmed, the frame's one gold),
            then it takes the heartbeat
    beat 2  the window closes into solid ink as the word flies up and
            shrinks into a quiet kicker, and two words land split wide to the
            left and right margins, drifting a little while they hold
    beat 3  every word flies home into the small centered line; the rest of
            the line pours in around them with the uppit preset
  Flights carry a breath of motion blur. Beat words are matched to the line by
  text; a beat word missing from the line dissolves at beat 3. No orange.
  Slots: beat1 (one word <= 9), beat2a, beat2b (one word <= 10 each), line (text <= 44,
  should contain the beat words), photo (nature stem for the window, default meadow-sunrise).
-->

            .to(el, { filter: "blur(0px)", duration: d * 0.5, ease: "power2.out" }, t + d * 0.5);
        };

        /* BEAT 1: the window opens on the meadow, then the heartbeat */
        const B1 = 0.25;
        tl.fromTo(win, { "--w": -30, scale: 1.04 }, { "--w": 110, scale: 1, duration: 1.0, ease: "power2.inOut" }, B1);
        FG.beat(tl, win, B1 + 1.0, { amp: 0.5 });

        /* BEAT 2: the window closes into solid ink as it becomes the kicker; two words land wide */
        const B2 = 2.05;
        tl.set(b1.el, { scale: S1, autoAlpha: 0 }, 0);
        tl.to(b1.el, { autoAlpha: 1, duration: 0.25, ease: "power2.out" }, B2 - 0.05)
          .to(win, { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, B2 - 0.02)
          .to(win, { y: 300, scale: () => SK / S1(), duration: 0.62, ease: FG.GLIDE }, B2);
        fly(b1.el, { y: 300, scale: SK, color: MID }, B2, 0.62);
        tl.fromTo(b2a.el, { autoAlpha: 0, scale: S2 * 1.1, filter: "blur(6px)", color: PRE, x: () => 160 + W(b2a.el) * S2 / 2 + 80, y: 520 },
                          { autoAlpha: 1, scale: S2, filter: "blur(0px)", color: INK, x: () => 160 + W(b2a.el) * S2 / 2, y: 500, duration: 0.7, ease: TXT.EASE }, B2 + 0.34)
          .fromTo(b2b.el, { autoAlpha: 0, scale: S2 * 1.1, filter: "blur(6px)", color: PRE, x: () => 1760 - W(b2b.el) * S2 / 2 - 80, y: 700 },
                          { autoAlpha: 1, scale: S2, filter: "blur(0px)", color: INK, x: () => 1760 - W(b2b.el) * S2 / 2, y: 720, duration: 0.7, ease: TXT.EASE }, B2 + 0.56);
        tl.to(b2a.el, { x: "+=18", duration: 1.0, ease: "sine.inOut" }, B2 + 0.9)
          .to(b2b.el, { x: "-=18", duration: 1.0, ease: "sine.inOut" }, B2 + 1.1);

        /* BEAT 3: everything flies home into the small centered line */
        const B3 = 3.7;
        beatEls.forEach((b, i) => {
          if (b.g) fly(b.el, { x: () => gpos(b.g).x, y: () => gpos(b.g).y, scale: S3f, color: INK }, B3 + i * 0.07, 0.72);
          else tl.to(b.el, { autoAlpha: 0, filter: "blur(6px)", duration: 0.35, ease: "power2.in" }, B3);
        });
        let tR = B3 + 0.62;
        rest.forEach((o, i) => {
          tl.set(o.el, { autoAlpha: 1, filter: "blur(0px)", color: INK, scale: S3f, x: () => gpos(o.g).x, y: () => gpos(o.g).y }, B3 + 0.6);
          tR = TXT.reveal(tl, o.el, B3 + 0.6 + i * 0.04);
        });

        /* hold, then the line lifts out */
        const OUT = Math.max(tR, B3 + 0.8) + 1.5;
        TXT.exit(tl, all, OUT);
        const END = OUT + 0.7;
        tl.set({}, {}, END);
        if (document.fonts) document.fonts.ready.then(() => { place(); const now = tl.time(); tl.invalidate(); tl.seek(now, false); });
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
