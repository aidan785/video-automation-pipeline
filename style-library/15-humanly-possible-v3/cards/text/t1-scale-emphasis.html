<!doctype html>
<!--
  HP V3 · tier1 · text · SCALE EMPHASIS  (Field Glass, FIELD, window type)
  DEFAULT (pass 2): photo, light ON (one of group A's two light cards: the sun rising behind
  the reeds sets up the window moment), grain off. On flat grounds the frost is solid glass and
  the window still opens onto the photo; on none the frost is dropped and only the word moves.
  One word carries the point. Reeds against a low sun rise out of the dark
  (SUNRISE) and a short cream sentence pours in, the line re-centering as it
  grows. Then the camera leans in: the <em> word glides to frame center and
  grows toward full width while the other words blur and fall back to dormant,
  and the whole frame fogs over from the burn corner (full-bleed CONDENSE).
  At full size the word becomes a WINDOW: a hand-speed wipe clears the glyphs
  and the sharp, gold-warmed reeds and sun show through them (the frame's one
  gold), it takes the heartbeat and a glint passes through it. Then it
  settles back into the sentence as solid gold while the frost clears and the
  neighbours re-sharpen. Ground stays still (the window is pinned to it). No orange.
  Slots: headline (richtext <= 28, one line, one <em> = the key word <= 9 chars),
  photo (nature stem, default sun-reeds; good: field-sunset, fern-backlit, meadow-sunrise).
-->

  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;

    const els = list(el); if (!els.length) return at;

        const shiftFor = (k) => () => (line.offsetWidth - (words[k].offsetLeft + words[k].offsetWidth)) / 2;

        const tl = gsap.timeline({ paused: true });
        tl.set(words, { autoAlpha: 0 }, 0).set(line, { x: shiftFor(0) }, 0);

        /* ground: still (window is pinned to it); the light does the moving */
        FG.sunrise(tl, ROOT, 0, { dur: 1.4, flareRest: 0.32 });

        let t = 0.45;
        words.forEach((w, k) => {
          if (k > 0) tl.to(line, { x: shiftFor(k), duration: 0.34, ease: FG.SETTLE }, t);
          tl.set(w, { autoAlpha: 1 }, t).fromTo(w, { color: PRE }, { color: CREAM, duration: 0.5, ease: TXT.EASE }, t);
          TXT.reveal(tl, w, t);
          t += 0.26;
        });

        /* lean in: frost condenses, the key word glides to center and grows, neighbours fall back */
        const Z = t + 0.6, ZD = 0.85;
        tl.to(line, { x: 0, duration: 0.3, ease: FG.SETTLE }, Z - 0.3);
        FG.condense(tl, $(".frost"), Z, { dur: 1.0, x: "0%", y: "100%", blur: 34 });
        tl.to(key, { x: () => G.dx, y: () => G.dy, scale: () => G.s * 0.94, duration: ZD, ease: FG.GLIDE }, Z);
        others.forEach((w) => {
          const dir = words.indexOf(w) < ki ? -1 : 1;
          tl.to(w, { x: dir * 120, scale: 0.8, color: DORM, opacity: 0.25, filter: "blur(10px)", duration: ZD, ease: FG.GLIDE }, Z);
        });

        /* the window: the solid word fades as the wipe clears the photo through the glyphs */
        const W0 = Z + ZD - 0.15;
        tl.set([win, glint], { visibility: "visible" }, W0);
        tl.fromTo(win, { "--w": -30 }, { "--w": 110, duration: 0.95, ease: "power2.inOut" }, W0);
        tl.to(key, { opacity: 0, scale: () => G.s, duration: 0.6, ease: "power2.inOut" }, W0 + 0.05);
        FG.beat(tl, [win, glint], W0 + 0.95, { amp: 0.5 });
        tl.fromTo(glint, { "--g": -40 }, { "--g": 120, duration: 1.3, ease: FG.GLIDE }, W0 + 1.35);

        /* settle back: window and frost clear, the word returns home as solid gold */
        const B = W0 + 2.55, BD = 0.8;
        tl.to([win, glint], { opacity: 0, duration: 0.4, ease: "power2.in" }, B);
        tl.set(key, { color: GOLD }, B);
        tl.to(key, { opacity: 1, duration: 0.3, ease: "power2.out" }, B)
          .to(key, { x: 0, y: 0, scale: 1, duration: BD, ease: FG.GLIDE }, B);
        FG.clear(tl, $(".frost"), B + 0.1, { dur: 0.7 });
        tl.to(others, { x: 0, scale: 1, color: CREAM, opacity: 1, filter: "blur(0px)", duration: BD, ease: FG.GLIDE }, B + 0.08);

        const END = B + BD + 1.5;
        tl.set({}, {}, END);
        if (document.fonts) document.fonts.ready.then(() => { place(); const now = tl.time(); tl.invalidate(); tl.seek(now, false); });
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
