<!doctype html>
<!--
  HP V3 · tier1 · text · DUSK SERIF CHIPS  (overlay, ported from sanji t1-ember-serif-chips)
  Introduce a tool and what it does. Default (retrofit 2): NO background, the
  lockup and the chip row ride over footage or a blank screen. Switches:
  photo (grass-silhouette, wind), deep / oxblood (solid glass chips). A cream icon well (the tool's glyph, a
  Lucide line icon) settles in, then the tool's name TYPES beside it in
  Bricolage 600 at optical size 12 (the editorial moment), each letter arriving
  gold and settling to cream. The lockup parts (well drifts left, word drifts
  right, both softening out) and five small smoked-glass chips condense out of
  the gap, sliding to their places, each with an icon well and a one-word job.
  The last chip is the payoff:
  its well turns orange (the frame's one accent) and takes the lub-dub, then
  one sun glint crosses the row.
  Slots: ground (none), grain (off), light (off), word (text <=10), chip1..chip5 (text <=7 each), photo (nature stem,
  default grass-silhouette).
-->

/* @text-preset:start v2 */
/* HP V3 copy of the Sanji TEXT PRESET "uppit-reveal" (source of truth for 15-humanly-possible-v3).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function

   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;

    if (!el) return [];
    if (el._tpWords) return el._tpWords;

    /* flex/grid parents turn every word box into an item and drop the spaces:

    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };

    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();

/* HP V3 · FIELD GLASS motion helpers (single source of truth).

     <span class="fg-slot" data-slot="grain">off</span>       on | off

  }
  function dapple(tl, el, at, dur) {
    const d = el.matches(".fg-dapple") ? el : el.querySelector(".fg-dapple");
    if (d) tl.fromTo(d, { x: -60, y: 10 }, { x: 60, y: -14, duration: dur, ease: "sine.inOut" }, at);
  }
  return { ground, sunrise, condense, clear, beat, sway, dapple, POP, SETTLE, GLIDE, bz };
})();

        const ROOT = document.getElementById(ID);
        FG.ground(ROOT, { ground: "none", grain: "off", light: "off" });
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => [...ROOT.querySelectorAll(s)];
        const css = getComputedStyle(document.documentElement);
        const CREAM = css.getPropertyValue("--hp-cream").trim(), GOLD = css.getPropertyValue("--hp-gold").trim();

        const stem = ($(".slot-photo").textContent || "grass-silhouette").trim();
        $(".fg-photo").src = "../../assets/nature/" + stem + ".jpg";

        const word = $(".word"), str = word.textContent; word.textContent = "";
        const chars = [...str].map((ch) => { const c = document.createElement("span"); c.className = "c"; c.textContent = ch; word.appendChild(c); return c; });

        /* lockup centered; the five chips sit in one centered row */
        const chips = $$(".chip"), CW = 320, GAP = 24, ROW = 5 * CW + 4 * GAP, X0 = (1920 - ROW) / 2;
        chips.forEach((c, i) => { c.style.left = (X0 + i * (CW + GAP)) + "px"; });
        const place = () => { const l = $(".lock"); l.style.left = ((1920 - l.offsetWidth) / 2) + "px"; };
        place(); if (document.fonts) document.fonts.ready.then(place);

        const T0 = 1.0, CPS = 0.07, TEND = T0 + chars.length * CPS, SPLIT = TEND + 1.0, TC = SPLIT + 0.18, KEY = TC + 1.35, END = KEY + 2.3;
        const tl = gsap.timeline({ paused: true });

        /* ground: night with the wind in the grass */
        FG.sway(tl, ROOT, 0, END);
        tl.fromTo($(".fg-night"), { "--sr": 0 }, { "--sr": 42, duration: 1.6, ease: FG.GLIDE }, 0);
        tl.fromTo($(".fg-flare"), { opacity: 0, scale: 0.4 }, { opacity: 0.55, scale: 0.85, duration: 1.6, ease: "power2.out" }, 0);

        /* the tool glyph settles in, its name types warm and settles to cream */
        TXT.block(tl, $(".well"), 0.45);
        tl.fromTo($(".well"), { scale: 0.96 }, { scale: 1, duration: 0.5, ease: FG.POP }, 0.45);
        chars.forEach((c, i) => {
          const t = T0 + i * CPS;
          tl.fromTo(c, { autoAlpha: 0, color: GOLD, filter: "blur(7px)", y: 12 }, { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: 0.32, ease: FG.SETTLE, immediateRender: true }, t)
            .to(c, { color: CREAM, duration: 0.5, ease: "power1.inOut" }, t + 0.18);
        });

        /* the lockup parts, softening out to either side */
        tl.to($(".well"), { x: -260, autoAlpha: 0, filter: "blur(8px)", duration: 0.45, ease: "power2.in" }, SPLIT)
          .to(word, { x: 260, autoAlpha: 0, filter: "blur(8px)", duration: 0.45, ease: "power2.in" }, SPLIT);

        /* chips condense out of the gap and slide to their places; the sun corner opens a little */
        tl.to($(".fg-night"), { "--sr": 60, duration: 1.4, ease: FG.GLIDE }, TC);
        tl.to($(".fg-flare"), { opacity: 0.8, scale: 1, duration: 1.2, ease: FG.SETTLE }, TC);
        chips.forEach((c, i) => {
          const at = TC + Math.abs(i - 2) * 0.09, dx = (2 - i) * (CW + GAP) * 0.42;
          FG.condense(tl, c, at, { dur: 0.8, x: i < 2 ? "100%" : i > 2 ? "0%" : "50%", y: "50%", blur: 24 });
          tl.fromTo(c, { x: dx }, { x: 0, duration: 0.7, ease: FG.POP }, at);
          TXT.block(tl, c.querySelector(".ic"), at + 0.18);
          const lb = c.querySelector(".lb");
          TXT.reveal(tl, lb, at + 0.22);
          tl.fromTo(lb, { color: GOLD }, { color: CREAM, duration: 0.55, ease: "power1.inOut" }, at + 0.3);
        });

        /* payoff: the last chip's well turns orange and takes the lub-dub; one glint crosses the row */
        const key = $(".chip.key");
        tl.to(key.querySelector(".hot"), { opacity: 1, duration: 0.3, ease: FG.POP }, KEY);
        FG.beat(tl, key.querySelector(".ic"), KEY + 0.12, { amp: 1.2 });
        chips.forEach((c, i) => tl.fromTo(c.querySelector(".fg-sheen"), { backgroundPosition: "120% 0" }, { backgroundPosition: "-20% 0", duration: 0.9, ease: FG.GLIDE }, KEY + 0.5 + i * 0.12));
        tl.set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
