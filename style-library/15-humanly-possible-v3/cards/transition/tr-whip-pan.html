<!doctype html>
<!--
  HP V3 · transition · WHIP PAN  (Field Glass photo to FLAT deep)
  A camera whip. Scene A (dunes, a glass card) and scene B (flat deep, two
  solid glass tiles under a title: Sanji's cobalt explainer canvas in HP)
  sit side by side on one strip. The camera snaps left: the
  strip accelerates out under a horizontal-only smear on the photos and the
  type (SVG blur, x only, from the real pan velocity; never a filter on the
  glass) plus a slight scaleX stretch, and at the peak the lens passes the
  low sun: a thin warm streak and a softer halo race across. Scene B lands
  on a long settle and its tile lines pour in.
  Use between two explainer beats or any fast topic hop.
  Motion is a pure function of the timeline clock (proxy onUpdate).
  Grounds (scene B): deep (default), oxblood, brick, photo (photoB, the next ridge over), none.
  Both scenes are STAND-INS. Slots: ground/grain/light switches, photoA, photoB (nature stems), eyebrowA (<=14), titleA (<=20),
  titleB (<=22), tileB1 / tileB2 (<=14).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #hp3-tr-whip-pan { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--hp-deep); font-family: var(--font-body); color: var(--hp-cream); }
      #hp3-tr-whip-pan .slot { display: none; }
      #hp3-tr-whip-pan svg.defs { position: absolute; width: 0; height: 0; }
      #hp3-tr-whip-pan .strip { position: absolute; left: 0; top: 0; width: 3840px; height: 1080px; transform-origin: 50% 50%; }
      #hp3-tr-whip-pan .scene { position: absolute; top: 0; width: 1920px; height: 1080px; }
      #hp3-tr-whip-pan .scene.b { left: 1920px; }
      #hp3-tr-whip-pan .scene img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; filter: url(#hp3-wp-smear); }
      #hp3-tr-whip-pan .scene.b img { left: -2px; width: 1924px; }
      #hp3-tr-whip-pan .shade { position: absolute; inset: 0; background: var(--shade-photo); }
      #hp3-tr-whip-pan .sm { filter: url(#hp3-wp-smear); }
      #hp3-tr-whip-pan .pane { border-radius: var(--r-panel); visibility: visible; --fb: 28; --fm: 170; }
      #hp3-tr-whip-pan .pane > .fg-tint { opacity: 1; }
      #hp3-tr-whip-pan .cardA { left: 116px; top: 560px; width: 980px; height: 400px; }
      #hp3-tr-whip-pan .cardA .eyebrow { position: absolute; left: 66px; top: 70px; white-space: nowrap; }
      #hp3-tr-whip-pan .cardA .title { position: absolute; left: 62px; top: 130px; font-size: 124px; line-height: 0.98; width: 860px; }
      #hp3-tr-whip-pan .titleB { position: absolute; left: 116px; top: 300px; font-size: 112px; white-space: nowrap; }
      #hp3-tr-whip-pan .tileB { top: 480px; width: 640px; height: 220px; border-radius: var(--r-card); }
      #hp3-tr-whip-pan .tileB .t { position: absolute; left: 52px; top: 72px; font-size: 76px; white-space: nowrap; }
      #hp3-tr-whip-pan .streak { position: absolute; left: 0; top: 470px; width: 1920px; height: 6px; opacity: 0; mix-blend-mode: screen; filter: blur(2px);
        background: linear-gradient(90deg, rgba(255,240,230,0), rgba(255,240,230,1) 45%, rgba(255,193,69,0.9) 60%, rgba(255,193,69,0)); }
      #hp3-tr-whip-pan .halo { position: absolute; left: 0; top: 400px; width: 1920px; height: 150px; opacity: 0; mix-blend-mode: screen; filter: blur(34px);
        background: linear-gradient(90deg, rgba(255,138,76,0), rgba(255,193,69,0.55) 50%, rgba(255,138,76,0)); }
    </style>
  </head>
  <body>
    <div id="hp3-tr-whip-pan" data-composition-id="hp3-tr-whip-pan" data-start="0" data-width="1920" data-height="1080">
      <span class="fg-slot" data-slot="ground">deep</span><span class="fg-slot" data-slot="grain">off</span><span class="fg-slot" data-slot="light">off</span>
      <svg class="defs" aria-hidden="true"><filter id="hp3-wp-smear" x="-20%" y="0" width="140%" height="100%"><feGaussianBlur class="gb" stdDeviation="0 0" /></filter></svg>
      <span class="slot" data-slot="photoA">dunes</span>
      <span class="slot" data-slot="photoB">dune-shadow</span>
      <div class="strip">
        <div class="scene a">
          <img class="pa" alt="" /><div class="shade"></div>
          <div class="fg-glass pane cardA"><div class="fg-tint"></div><div class="fg-dapple"></div>
            <div class="eyebrow fg-label sm" data-slot="eyebrowA">Last spring</div>
            <div class="title fg-display sm" data-slot="titleA">Forty calls a day</div></div>
        </div>
        <div class="scene b">
          <div class="fg-ground"><img class="fg-photo pb" alt="" /><div class="fg-shade"></div></div>
          <div class="titleB fg-display sm" data-slot="titleB">And this spring</div>
          <div class="fg-glass pane tileB" style="left:116px"><div class="fg-tint"></div><div class="fg-dapple"></div><div class="t fg-display sm" data-slot="tileB1">Four a day</div></div>
          <div class="fg-glass pane tileB" style="left:796px"><div class="fg-tint"></div><div class="fg-dapple"></div><div class="t fg-display sm" data-slot="tileB2"><em>None</em> missed</div></div>
        </div>
      </div>
      <div class="halo"></div><div class="streak"></div>
      <div class="fg-grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        /* @text-preset:start v2 */
/* HP V3 copy of the Sanji TEXT PRESET "uppit-reveal" (source of truth for 15-humanly-possible-v3).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE = bezier(0.23, 1, 0.32, 1);
  const D = { dur: 0.7, stagger: 0.04, blur: 6, y: 0.3, exitDur: 0.42, exitStagger: 0.02, exitY: 0.18, blockY: 18 };

  /* one shared stylesheet for the word wrappers */
  if (!document.getElementById("tp-style")) {
    const st = document.createElement("style"); st.id = "tp-style";
    st.textContent = ".tp-m{display:inline-block}.tp-w{display:inline-block}";
    document.head.appendChild(st);
  }

  function split(el) {
    if (!el) return [];
    if (el._tpWords) return el._tpWords;
    const words = [];
    /* flex/grid parents turn every word box into an item and drop the spaces:
       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };
    const walk = (node) => {
      if (isBox(node)) [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3 && n.textContent.trim()) { const l = document.createElement("span"); l.className = "tp-l"; n.replaceWith(l); l.appendChild(n); }
      });
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const parts = n.textContent.split(/(\s+)/);
          if (parts.length === 1 && !parts[0]) return;
          const frag = document.createDocumentFragment();
          parts.forEach((p) => {
            if (!p) return;
            if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
            const m = document.createElement("span"); m.className = "tp-m";
            const w = document.createElement("span"); w.className = "tp-w"; w.textContent = p;
            m.appendChild(w); frag.appendChild(m); words.push(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && n.tagName !== "BR" && !n.classList.contains("tp-m")) {
          walk(n);
        }
      });
    };
    walk(el);
    el._tpWords = words;
    return words;
  }
  const list = (el) => (el == null ? [] : el.length !== undefined && !el.nodeType ? [...el] : [el]);
  const em = (w) => parseFloat(getComputedStyle(w).fontSize) || 40;

  function order(ws, from) {
    if (from === "end") return ws.slice().reverse();
    if (from === "center") { const c = (ws.length - 1) / 2; return ws.slice().sort((a, b) => Math.abs(ws.indexOf(a) - c) - Math.abs(ws.indexOf(b) - c)); }
    return ws;
  }

  function reveal(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger, blur = o.blur ?? D.blur, y = o.y ?? D.y;
    ws.forEach((w, i) => {
      tl.fromTo(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: em(w) * y },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur, ease: o.ease || EASE, immediateRender: true }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();
/* @text-preset:end */
        /* @field-glass:start v3 */
/* HP V3 · FIELD GLASS motion helpers (single source of truth).
   Cards carry an inlined copy between the @field-glass markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-hp3-libs.mjs`
   (restamps both the @text-preset and @field-glass blocks).

   Markup it expects (CSS lives in tokens.css, "FIELD GLASS utilities"):
     .fg-photo > img          the graded nature photo (drifts, sways)
     .fg-night                pre-sunrise veil, masked by --sr (radius %)
     .fg-flare                sun bloom at the burn origin (bottom-left)
     .fg-glass                glass pane; --fb blur px, --fm condense radius %,
                              --fx/--fy condense origin; child .fg-tint, .fg-dapple
   GROUND SWITCHES (v3, Aidan 11/3: not every card needs nature / the corner glow;
   some flat, some with grain, some with no background at all). Every card carries
   three hidden slots and calls FG.ground(ROOT, defaults) before building its timeline:
     <span class="fg-slot" data-slot="ground">oxblood</span>  photo | oxblood | deep | brick | cream | burn | wash | none
     <span class="fg-slot" data-slot="grain">off</span>       on | off
     <span class="fg-slot" data-slot="light">off</span>       on | off  (the bottom-left sunrise + flare)
   FG.ground sets data-ground / data-grain / data-light on the root; tokens.css does
   the rest (hides the photo / flare / night / grain, paints flat grounds, switches
   glass to the solid Sanji-style fill on flat grounds, makes "none" transparent).
     FG.ground(ROOT, {ground, grain, light}) -> {ground, photo, flat, none, grain, light}
   API (timeline-driven, deterministic):
     FG.sunrise(tl, root, at, {dur})        light burns up from bottom-left, flare peaks then settles
     FG.condense(tl, el, at, {dur, x, y})   glass fogs in from a point: clear -> frosted, tint rises
     FG.clear(tl, el, at, {dur})            glass evaporates (exit), edges first
     FG.beat(tl, el, at, {amp})             the logo's lub-dub: 1.07, back, 1.045, back
     FG.sway(tl, root, at, dur)             wind on the photo: slow drift + a breath of rotation
     FG.dapple(tl, el, at, dur)             leaf-shadow plate drifts across a pane
     FG.POP / FG.SETTLE                     HP pop ease (no overshoot) / uppit settle */
const FG = (function () {
  function bz(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t, dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x; for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; } return sy(t); };
  }
  const POP = bz(0.2, 0.9, 0.25, 1), SETTLE = bz(0.23, 1, 0.32, 1), GLIDE = bz(0.65, 0, 0.35, 1);
  const q = (root, s) => (root.matches && root.matches(s) ? root : root.querySelector(s));

  const comp = (el) => (el && el.closest ? el.closest("[data-composition-id]") : null);
  const FLAT = ["oxblood", "deep", "brick", "cream"];
  function ground(ROOT, d = {}) {
    const slot = (n) => { const e = ROOT.querySelector(`[data-slot="${n}"]`); return e ? e.textContent.trim().toLowerCase() : ""; };
    const g = slot("ground") || d.ground || "photo", grain = slot("grain") || d.grain || "off", light = slot("light") || d.light || "off";
    Object.assign(ROOT.dataset, { ground: g, grain, light: g === "none" ? "off" : light });
    const base = ROOT.querySelector(".fg-ground");
    if (base && g === "wash" && !base.querySelector(".fg-blob")) {
      [["gold", -260, 520], ["orange", 1180, -320], ["brick", 520, 340], ["deep", 1400, 560]].forEach(([c, x, y]) => {
        const b = document.createElement("div"); b.className = "fg-blob " + c; b.style.left = x + "px"; b.style.top = y + "px"; base.appendChild(b); });
    }
    return { ground: g, photo: g === "photo", flat: FLAT.includes(g), none: g === "none", grain: grain === "on", light: ROOT.dataset.light === "on" };
  }
  const lightOff = (root) => { const c = comp(root); return c && c.dataset.light === "off"; };
  function sunrise(tl, root, at = 0, o = {}) {
    if (lightOff(root)) return at;
    const dur = o.dur ?? 1.4, night = q(root, ".fg-night"), flare = q(root, ".fg-flare");
    if (night) tl.fromTo(night, { "--sr": 0 }, { "--sr": 150, duration: dur, ease: GLIDE }, at);
    if (flare) tl.fromTo(flare, { opacity: 0, scale: 0.4 }, { keyframes: [{ opacity: 1, scale: 1.1, duration: dur * 0.45, ease: "power2.out" }, { opacity: o.flareRest ?? 0.38, scale: 1, duration: dur * 0.9, ease: "sine.inOut" }] }, at);
    return at + dur;
  }
  function condense(tl, el, at = 0, o = {}) {
    const dur = o.dur ?? 0.9, tint = el.querySelector(":scope > .fg-tint");
    tl.set(el, { "--fx": o.x ?? "0%", "--fy": o.y ?? "100%", autoAlpha: 1 }, at);
    tl.fromTo(el, { "--fm": 0, "--fb": 0 }, { "--fm": 170, duration: dur, ease: SETTLE }, at)
      .to(el, { "--fb": o.blur ?? 28, duration: dur * 1.1, ease: "power2.out" }, at);
    if (tint) tl.fromTo(tint, { opacity: 0 }, { opacity: 1, duration: dur, ease: "power2.out" }, at + 0.05);
    return at + dur;
  }
  function clear(tl, el, at = 0, o = {}) {
    const dur = o.dur ?? 0.55;
    tl.to(el, { "--fb": 0, duration: dur, ease: "power2.in" }, at).to(el, { autoAlpha: 0, duration: dur * 0.7, ease: "power2.in" }, at + dur * 0.3);
    return at + dur;
  }
  function beat(tl, el, at = 0, o = {}) {
    const a = o.amp ?? 1;
    tl.to(el, { keyframes: [
      { scale: 1 + 0.07 * a, duration: 0.11, ease: "sine.inOut" }, { scale: 1, duration: 0.14, ease: "sine.inOut" },
      { scale: 1 + 0.045 * a, duration: 0.1, ease: "sine.inOut" }, { scale: 1, duration: 0.27, ease: "sine.inOut" }] }, at);
    return at + 0.62;
  }
  /* ambient motion for whatever the ground is: wind on a photo, drifting wash blobs, a slow sun on the burn */
  function sway(tl, root, at, dur) {
    const c = comp(root) || root, g = c.dataset.ground || "photo";
    if (g === "photo") { const img = q(root, ".fg-photo"); if (img) tl.fromTo(img, { scale: 1.1, x: -18, rotation: -0.25 }, { scale: 1.03, x: 14, rotation: 0.2, duration: dur, ease: "sine.inOut" }, at); }
    else if (g === "wash") root.querySelectorAll(".fg-blob").forEach((b, i) => tl.fromTo(b, { x: 0, y: 0 }, { x: (i % 2 ? -1 : 1) * 140, y: (i < 2 ? -1 : 1) * 70, duration: dur, ease: "sine.inOut" }, at));
    else if (g === "burn") { const gr = q(root, ".fg-ground"); if (gr) tl.fromTo(gr, { "--bx": "4%", "--by": "104%" }, { "--bx": "14%", "--by": "96%", duration: dur, ease: "sine.inOut" }, at); }
  }
  function dapple(tl, el, at, dur) {
    const d = el.matches(".fg-dapple") ? el : el.querySelector(".fg-dapple");
    if (d) tl.fromTo(d, { x: -60, y: 10 }, { x: 60, y: -14, duration: dur, ease: "sine.inOut" }, at);
  }
  return { ground, sunrise, condense, clear, beat, sway, dapple, POP, SETTLE, GLIDE, bz };
})();
/* @field-glass:end */
        const ID = "hp3-tr-whip-pan";
        const ROOT = document.getElementById(ID);
        const GR = FG.ground(ROOT, { ground: "deep", grain: "off", light: "off" });
        const $ = (s) => ROOT.querySelector(s);
        const slot = (n, d) => ($(`[data-slot="${n}"]`).textContent || d).trim();
        $(".pa").src = "../../assets/nature/" + slot("photoA", "dunes") + ".jpg";
        $(".pb").src = "../../assets/nature/" + slot("photoB", "dune-shadow") + ".jpg";
        ROOT.querySelectorAll(".tileB .t em").forEach((e) => e.classList.add("fg-key"));

        const strip = $(".strip"), gb = $(".gb");
        const W0 = 0.35, WD = 0.62, END = 1.9;
        const WHIP = FG.bz(0.72, 0, 0.08, 1);            /* accelerate out, long settle in */
        const clamp = (v) => Math.max(0, Math.min(1, v));
        const X = (t) => WHIP(clamp((t - W0) / WD)) * 1920;
        function draw(t) {
          const x = X(t), v = Math.abs(x - X(t - 1 / 60)) * 60, k = Math.min(1, v / 9000);
          strip.style.transform = `translateX(${-x}px) scaleX(${1 + k * 0.06})`;
          gb.setAttribute("stdDeviation", `${(k * 70).toFixed(1)} 0`);
          const halo = Math.sin(clamp((t - W0 - WD * 0.18) / (WD * 0.5)) * Math.PI);
          $(".streak").style.opacity = halo; $(".halo").style.opacity = halo * 0.9;
          $(".streak").style.transform = `translateX(${(1 - clamp((t - W0 - WD * 0.18) / (WD * 0.5))) * 900 - 450}px)`;
        }

        const tl = gsap.timeline({ paused: true });
        ROOT.querySelectorAll(".pane").forEach((p) => FG.dapple(tl, p, 0, END));
        /* B's lines pour in on the landing */
        TXT.reveal(tl, $(".titleB"), W0 + WD * 0.62);
        ROOT.querySelectorAll(".tileB .t").forEach((el, i) => TXT.reveal(tl, el, W0 + WD * 0.7 + i * 0.08));

        const P = { t: 0 };
        tl.fromTo(P, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(P.t) }, 0);
        tl.set({}, {}, END);
        draw(0);
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
