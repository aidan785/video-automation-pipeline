<!--
  HP V3 · transition · ZOOM THROUGH TILE  (FLAT oxblood into FIELD)
  Into one step. Scene A is Sanji's tile row in HP: three solid glass tiles on flat oxblood. The
  center one goes ACTIVE (lit wash, cream label) while its neighbours shift
  dormant, and a view starts to show through its glass: the place that step
  happens. The camera pushes INTO that tile: the neighbours fly outward and
  their content blurs away (never a filter on the glass), the tile's glass
  grows to full frame with its corners relaxing to 0, a sun glint crosses
  its frost at mid-push, and the view inside (backlit ferns, pinned to the
  frame) becomes scene B as the frost clears. B's glass note fogs in.
  Use to dive from an overview tile into that step's detail.
  Grounds (scene B): photo (default, the view inside the tile), oxblood, deep, none (the tile
  opens onto the footage; the view still shows inside the tile during the push).
  Both scenes are STAND-INS. Slots: ground/grain/light switches, tileA1..tileA3 (<=12), photoB (nature stem),
  eyebrow (<=16), line (<=22).
-->

/* HP V3 copy of the Sanji TEXT PRESET "uppit-reveal" (source of truth for 15-humanly-possible-v3).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)

   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function

  function bezier(x1, y1, x2, y2) {

       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };

    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();

   Markup it expects (CSS lives in tokens.css, "FIELD GLASS utilities"):

  }

    const d = el.matches(".fg-dapple") ? el : el.querySelector(".fg-dapple");
    if (d) tl.fromTo(d, { x: -60, y: 10 }, { x: 60, y: -14, duration: dur, ease: "sine.inOut" }, at);
  }
  return { ground, sunrise, condense, clear, beat, sway, dapple, POP, SETTLE, GLIDE, bz };

        $(".fg-photo.b").src = src; $(".view").src = src;

        const note = $(".note");
        const place = () => { note.style.width = (Math.max($(".note .ln").offsetWidth, $(".note .eyebrow").offsetWidth) + 96) + "px"; };
        place(); if (document.fonts) document.fonts.ready.then(place);

        const t2 = $(".t2"), view = $(".view");
        const R0 = { x: 732, y: 330, w: 456, h: 480, r: 28 }, R = { ...R0 };
        const apply = () => {
          Object.assign(t2.style, { left: R.x + "px", top: R.y + "px", width: R.w + "px", height: R.h + "px", borderRadius: R.r + "px" });
          view.style.left = (-96 - R.x) + "px"; view.style.top = (-54 - R.y) + "px";   /* the view stays pinned to the frame */
        };
        apply();

        const ACT = 0.25, PU = 0.62, PD = 0.8, SW = PU + PD, END = 2.6;
        const tl = gsap.timeline({ paused: true });
        FG.dapple(tl, $(".t1"), 0, SW); FG.dapple(tl, $(".t3"), 0, SW);
        /* focus shift: the middle step goes active, the others dormant (0.35s) */
        tl.to($(".t2 .lit"), { opacity: 1, duration: 0.35, ease: "power2.out" }, ACT);
        tl.to([$(".t1 .lab"), $(".t3 .lab"), $(".t1 .idx"), $(".t3 .idx")], { color: "rgba(255,240,230,0.46)", duration: 0.35, ease: "power2.out" }, ACT);
        tl.to([$(".t1 .well"), $(".t3 .well")], { opacity: 0.55, duration: 0.35, ease: "power2.out" }, ACT);
        tl.to(view, { opacity: 0.22, duration: 0.4, ease: "power2.out" }, ACT + 0.05);
        /* the push: the tile grows to the frame, the view fills it, the neighbours fly out */
        tl.to(R, { x: 0, y: 0, w: 1920, h: 1080, r: 0, duration: PD, ease: FG.GLIDE, onUpdate: apply }, PU);
        tl.to($(".cam"), { scale: 1.12, duration: PD, ease: FG.GLIDE }, PU);
        tl.to(view, { opacity: 1, duration: PD * 0.7, ease: "power1.inOut" }, PU + PD * 0.2);
        tl.to($(".t2 .in"), { opacity: 0, filter: "blur(10px)", duration: PD * 0.4, ease: "power2.in" }, PU);
        tl.to($(".t1"), { x: -900, opacity: 0, duration: PD * 0.8, ease: "power2.in" }, PU);
        tl.to($(".t3"), { x: 900, opacity: 0, duration: PD * 0.8, ease: "power2.in" }, PU);
        tl.to([$(".t1 .in"), $(".t3 .in"), $(".head")], { filter: "blur(14px)", opacity: 0, duration: PD * 0.5, ease: "power2.in" }, PU);
        tl.fromTo($(".t2 .fg-sheen"), { backgroundPosition: "120% 0" }, { backgroundPosition: "-20% 0", duration: PD * 0.8, ease: FG.GLIDE }, PU + PD * 0.2);
        /* the frost clears off the view, which is now scene B */
        tl.to($(".t2 > .fg-tint"), { opacity: 0, duration: 0.4, ease: "power2.in" }, SW - 0.3);
        tl.to($(".t2 .lit"), { opacity: 0, duration: 0.4, ease: "power2.in" }, SW - 0.3);
        /* on ground none there is no scene B photo: the view itself fades off the footage as the push lands */
        if (GR.none) tl.to($(".t2"), { opacity: 0, duration: 0.35, ease: "power2.in" }, SW - 0.3);
        tl.set($(".sceneB"), { autoAlpha: 1 }, SW).set($(".sceneA"), { autoAlpha: 0 }, SW);
        tl.fromTo($(".fg-photo.b"), { scale: 1, x: 0 }, { scale: 1.03, x: 12, duration: END - SW, ease: "sine.inOut" }, SW);
        FG.condense(tl, note, SW + 0.05, { dur: 0.8, x: "0%", y: "100%" });
        FG.dapple(tl, note, SW, END - SW);
        TXT.reveal(tl, $(".note .eyebrow"), SW + 0.25);
        TXT.reveal(tl, $(".note .ln"), SW + 0.3);
        tl.set({}, {}, END);
        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
