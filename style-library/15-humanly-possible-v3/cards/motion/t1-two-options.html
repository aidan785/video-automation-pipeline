  across the top. Card A (solid oxblood, radius 42, a soft ambient pool under
  it) rises from below and lands overlapping the headline's baseline: icon well,
  "Option 1", the name, three key / value rows. Then A glides left as card B
  rises beside it. B's rows land in full cream while A's settle dim, B's key
  value lands in gold (the frame's one gold, gold on oxblood, never on cream),
  and a small orange check well (the frame's one accent, a shape) lands on B,
  which takes the lub-dub. Both cards keep a slow breathing drift.
  Slots: title (<=12), labelA / labelB (<=12), nameA / nameB (<=14),
  a1k a2k a3k (<=14, shared row keys), a1v..a3v b1v..b3v (<=12).

        const tl = gsap.timeline({ paused: true });

        /* the headline pours */
        TXT.reveal(tl, $(".ttl"), 0.15, { stagger: 0.06 });

        /* card A rises and lands over the headline's baseline */
        const fill = (card, at) => {
          tl.fromTo(card, { y: 520, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.95, ease: FG.POP }, at);
          TXT.block(tl, card.querySelector(".ic"), at + 0.32);
          TXT.reveal(tl, card.querySelector(".lab"), at + 0.36);
          TXT.reveal(tl, card.querySelector(".nm"), at + 0.42);
          card.querySelectorAll(".rw").forEach((r, i) => {
            TXT.block(tl, r.querySelector(".bg"), at + 0.55 + i * 0.1);
            TXT.reveal(tl, r.querySelector(".k"), at + 0.6 + i * 0.1);
            TXT.reveal(tl, r.querySelector(".v"), at + 0.68 + i * 0.1);
          });
        };
        fill(A, A0);

        /* A glides left as B rises beside it */
        tl.to(A, { x: -SHIFT, duration: 0.9, ease: FG.GLIDE }, B0 - 0.15);
        tl.set(B, { left: 640 + SHIFT }, 0);
        fill(B, B0);

        /* payoff: B's key value turns gold, the orange check lands, B takes the lub-dub */
        tl.to($(".v.key"), { color: GOLD, duration: 0.4, ease: FG.POP }, KEY);
        TXT.block(tl, $(".ok"), KEY + 0.05, { y: 10 });
        FG.beat(tl, B, KEY + 0.3, { amp: 0.35 });

        /* hold: both cards breathe a little */
        tl.to(A, { y: 8, duration: 2, ease: "sine.inOut" }, B0 + 1.0);
        tl.to(B, { y: -8, duration: 1.6, ease: "sine.inOut" }, KEY + 0.95);
        tl.set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
