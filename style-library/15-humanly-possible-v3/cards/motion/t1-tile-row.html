<!doctype html>
<!--
  HP V3 · tier1 · motion · TILE ROW  (Field Glass, wash ground)
  The roadmap row. A warm wash (blurred gold, orange, brick and deep light
  drifting slowly) comes up from the bottom-left (SUNRISE over the wash). The
  eyebrow and a one-line headline pour in top-left (one gold word). Rounded glass
  tiles arrive one at a time from the right: each slides in a short way while
  it fogs in from its own right corner (CONDENSE), and the whole row glides to
  stay centered, like a word re-centering. The newest tile is lit (row wash,
  cream label), older tiles go quiet (dim label, well .55). With a fifth tile
  the row scrolls left and the first tile clears away. The last tile is the
  payoff: its icon well fills orange (the frame's one accent) and it takes the
  lub-dub. One glint crosses it on the hold.
  Slots: eyebrow (<=20), title (richtext <=34, one <em> = gold),
  tile1..tile5 (<=22, wraps to 2 lines; an empty tile is skipped, min 2).
-->

      #hp3-t1-tile-row .b2 { left: 520px; top: 380px; width: 900px; height: 760px; opacity: 0.7; }
      #hp3-t1-tile-row .b3 { left: 1180px; top: -260px; width: 1000px; height: 900px; }
      #hp3-t1-tile-row .b4 { left: 260px; top: -420px; width: 1100px; height: 800px; }
      #hp3-t1-tile-row .eyebrow { position: absolute; left: 116px; top: 132px; white-space: nowrap; }
      #hp3-t1-tile-row .ttl { position: absolute; left: 112px; top: 172px; font-size: 96px; white-space: nowrap; }
      #hp3-t1-tile-row .row { position: absolute; left: 0; top: 470px; width: 0; height: 380px; }
      #hp3-t1-tile-row .tile { top: 0; width: 360px; height: 380px; border-radius: var(--r-card); }

/* @text-preset:start v2 */
/* HP V3 copy of the Sanji TEXT PRESET "uppit-reveal" (source of truth for 15-humanly-possible-v3).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)

   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s

    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;

    });

  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }

/* @field-glass:start v3 */
/* HP V3 · FIELD GLASS motion helpers (single source of truth).

   Markup it expects (CSS lives in tokens.css, "FIELD GLASS utilities"):

     <span class="fg-slot" data-slot="grain">off</span>       on | off

  }

    const d = el.matches(".fg-dapple") ? el : el.querySelector(".fg-dapple");
    if (d) tl.fromTo(d, { x: -60, y: 10 }, { x: 60, y: -14, duration: dur, ease: "sine.inOut" }, at);
  }
  return { ground, sunrise, condense, clear, beat, sway, dapple, POP, SETTLE, GLIDE, bz };
})();

        all.forEach((t) => { if (!t.querySelector(".lb").textContent.trim()) t.remove(); });
        const tiles = $$(".tile");
        tiles.forEach((t, i) => { t.querySelector(".st").textContent = "Step " + (i + 1); });
        const W = 360, GAP = 36, PITCH = W + GAP, VIS = 4;
        tiles.forEach((t, i) => { t.style.left = i * PITCH + "px"; });
        const rowX = (k) => { const first = Math.max(0, k - (VIS - 1)); return 960 - ((first + k) / 2) * PITCH - W / 2; };

        const N = tiles.length, T0 = 1.45, STEP = 0.92;
        const KEY = T0 + (N - 1) * STEP;
        const END = KEY + 2.4;
        const tl = gsap.timeline({ paused: true });

        /* ground: the wash drifts like slow light; sunrise from the burn corner */
        FG.sway(tl, ROOT, 0, END);
        FG.sunrise(tl, ROOT, 0, { dur: 1.4 });

        TXT.reveal(tl, $(".eyebrow"), 0.55);
        TXT.reveal(tl, $(".ttl"), 0.62);

        tl.set($(".row"), { x: rowX(0) }, 0);
        tiles.forEach((tile, i) => {
          const at = T0 + i * STEP;
          if (i > 0) tl.to($(".row"), { x: rowX(i), duration: 0.75, ease: FG.GLIDE }, at - 0.05);
          tl.fromTo(tile, { x: 150 }, { x: 0, duration: 0.8, ease: FG.POP }, at);
          FG.condense(tl, tile, at, { dur: 0.85, x: "100%", y: "100%" });
          TXT.block(tl, tile.querySelector(".ic"), at + 0.18);
          TXT.reveal(tl, tile.querySelector(".st"), at + 0.22);
          TXT.reveal(tl, tile.querySelector(".lb"), at + 0.26);
          /* focus: newest lit, previous goes quiet */
          tl.to(tile.querySelector(".hl"), { opacity: 1, duration: 0.35, ease: FG.POP }, at + 0.3)
            .to(tile.querySelector(".lb"), { color: CREAM, duration: 0.35, ease: FG.POP }, at + 0.3);
          if (i > 0) {
            const p = tiles[i - 1];
            tl.to(p.querySelector(".hl"), { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at + 0.3)
              .to(p.querySelector(".lb"), { color: DIM, duration: 0.35, ease: "power2.inOut" }, at + 0.3)
              .to(p.querySelector(".ic"), { opacity: 0.55, duration: 0.35 }, at + 0.3);
          }
          /* a fifth tile pushes the first out of frame-left */
          if (i >= VIS) {
            const old = tiles[i - VIS];
            tl.to(old, { x: -120, duration: 0.5, ease: "power2.in" }, at);
            FG.clear(tl, old, at);
          }
        });

        /* payoff: the last well fills orange, the tile takes the lub-dub, one glint */
        const last = tiles[N - 1];
        tl.to(last.querySelector(".or"), { opacity: 1, duration: 0.42, ease: FG.POP }, KEY + 0.55);
        FG.beat(tl, last, KEY + 0.7, { amp: 0.5 });
        tl.fromTo(last.querySelector(".fg-sheen"), { backgroundPosition: "120% 0" }, { backgroundPosition: "-20% 0", duration: 1.3, ease: FG.GLIDE }, KEY + 0.9);
        tl.set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
