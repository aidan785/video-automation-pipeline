  The head-to-head. Two dunes at dusk come up out of the dark (SUNRISE) with a
  slow rack into focus and wind on the sand. A small glass kicker chip fogs in at
  the top. Two glass cards rise from below and condense from their outer bottom
  corners, left and right. Between them a quiet lowercase "vs" pours in. Each
  card: an icon well + tag, the name, a soft divider, two plain chips, and a
  timer row. Last, both timers count up together: the left one stops early and
  lands in gold (the frame's one gold) with the lub-dub; the right one keeps
  counting to its value in cream. No orange on this card.
  Slots: kicker (<=24), leftTag / rightTag (<=16), leftName / rightName (<=14),
  left1 left2 right1 right2 (<=20), timerLabel (<=14),
  leftTime / rightTime (mm:ss), photo (nature stem, default dunes).

        const slot = (n, d) => ($(`[data-slot="${n}"]`).textContent || d).trim();
        const css = getComputedStyle(document.documentElement);
        const GOLD = css.getPropertyValue("--hp-gold").trim();
        $(".fg-photo").src = "../../assets/nature/" + slot("photo", "dunes") + ".jpg";
        $(".card.r .tlb").textContent = $(".card.l .tlb").textContent;

        const secs = (s) => { const [m, x] = s.split(":").map(Number); return (m || 0) * 60 + (x || 0); };
        const mmss = (v) => { v = Math.round(v); return String(Math.floor(v / 60)).padStart(2, "0") + ":" + String(v % 60).padStart(2, "0"); };
        const LT = secs(slot("leftTime", "00:42")), RT = secs(slot("rightTime", "14:30"));

        const C0 = 0.8, TM = 2.6, END = TM + 1.9 + 1.6;
        const tl = gsap.timeline({ paused: true });

        /* ground: sunrise + rack focus, wind on the sand */
        FG.sway(tl, ROOT, 0, END);
        FG.sunrise(tl, ROOT, 0, { dur: 1.5 });
        tl.fromTo($(".fg-photo"), { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 1.5, ease: FG.SETTLE }, 0.1);

        /* kicker chip, then the two cards rise and fog in from their outer corners */
        FG.condense(tl, $(".kick"), 0.55, { dur: 0.7, x: "50%", y: "100%" });
        TXT.reveal(tl, $(".kt"), 0.7);
        [["l", "0%", 0], ["r", "100%", 0.12]].forEach(([k, x, d]) => {
          const card = $(".card." + k), at = C0 + d;
          tl.fromTo($(".depth." + k), { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, at);
          tl.fromTo(card, { y: 90 }, { y: 0, duration: 0.95, ease: FG.POP }, at);
          FG.condense(tl, card, at, { dur: 0.95, x, y: "100%" });
          FG.dapple(tl, card, 0, END);
          TXT.block(tl, card.querySelector(".ic"), at + 0.3);
          TXT.reveal(tl, card.querySelector(".tag"), at + 0.34);
          TXT.reveal(tl, card.querySelector(".nm"), at + 0.4);
          tl.fromTo(card.querySelector(".dv"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: FG.GLIDE }, at + 0.55);
          TXT.block(tl, card.querySelectorAll(".chip"), at + 0.66);
          TXT.reveal(tl, card.querySelector(".tlb"), at + 0.8);
          TXT.block(tl, card.querySelector(".tm"), at + 0.86);
        });
        TXT.reveal(tl, $(".vs"), C0 + 0.5);

        /* timers: both run; the left stops early and lands gold, the right keeps going */
        const tL = $(".card.l .tm"), tR = $(".card.r .tm");
        const pl = { v: 0 }, pr = { v: 0 };
        tl.fromTo(pl, { v: 0 }, { v: LT, duration: 0.7, ease: "power2.out", onUpdate: () => { tL.textContent = mmss(pl.v); } }, TM);
        tl.fromTo(pr, { v: 0 }, { v: RT, duration: 1.9, ease: "power1.inOut", onUpdate: () => { tR.textContent = mmss(pr.v); } }, TM);
        tl.to(tL, { color: GOLD, duration: 0.4, ease: FG.POP }, TM + 0.7);
        FG.beat(tl, tL, TM + 0.75, { amp: 0.8 });
        tl.to(tR, { opacity: 0.8, duration: 0.4, ease: "power2.inOut" }, TM + 1.9);

        /* hold: one glint across the left card */
        tl.fromTo($(".card.l .fg-sheen"), { backgroundPosition: "120% 0" }, { backgroundPosition: "-20% 0", duration: 1.4, ease: FG.GLIDE }, TM + 2.0);
        tl.set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
