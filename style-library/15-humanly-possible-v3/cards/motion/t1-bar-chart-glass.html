<!doctype html>
<!--
  HP V3 · tier1 · motion · BAR CHART GLASS  (Field Glass, burn ground)
  Monthly growth, best performer. The burn is the ground: the low sun comes up
  in the bottom-left (SUNRISE over the burn) and keeps glowing through the
  glass. A big smoked glass chart pane fogs in from the burn corner; the eyebrow
  and title pour in and soft dotted guide lines draw across. Five rounded cream
  bars grow up from the baseline one after another (heights from the values),
  each value counting up above its bar. Then the tallest bar fills orange (the
  frame's one accent) and its value lands in gold (the frame's one gold) with the
  lub-dub, while the others go quiet (cream 32%). A small glass callout fogs in
  above it on a short cream stem. One glint across the pane on the hold.
  Slots: eyebrow (<=24), title (<=22), l1..l5 (<=5), v1..v5 (number with
  optional prefix / suffix, <=5), callout (<=14).
-->

      #hp3-t1-bar-chart-glass .depth { left: 320px; top: 200px; width: 1280px; height: 720px; }
      #hp3-t1-bar-chart-glass .eyebrow { position: absolute; left: 72px; top: 64px; white-space: nowrap; }
      #hp3-t1-bar-chart-glass .ttl { position: absolute; left: 70px; top: 102px; font-size: 80px; white-space: nowrap; }
      #hp3-t1-bar-chart-glass svg.guides { position: absolute; left: 0; top: 0; overflow: visible; }
      #hp3-t1-bar-chart-glass .bar { position: absolute; width: 150px; margin-left: -75px; border-radius: var(--r-chip) var(--r-chip) 8px 8px; background: rgba(var(--cream-rgb), 0.6); transform-origin: 50% 100%; }

          Object.assign(v.style, { left: x + "px", top: (BASE - h - 72) + "px" }); host.appendChild(v); vals.push(v);
          const l = document.createElement("div"); l.className = "lab fg-label"; l.textContent = d.l; l.style.left = x + "px"; host.appendChild(l);
          b._h = h; b._x = x;
        });

        /* callout sits beside the best bar's value (the side with room), on a short soft stem */
        const pane = $(".pane"), call = $(".call"), tb = bars[TOP];
        const side = TOP >= 3 && TOP === D.length - 1 ? -1 : 1;
        const vy = BASE - tb._h - 72;                                   /* value top, pane coords */
        const cx = side > 0 ? tb._x + 75 + 56 : tb._x - 75 - 56 - 300;  /* callout left, pane coords */
        const cy = vy - 70;
        Object.assign(call.style, { left: (pane.offsetLeft + cx) + "px", top: (pane.offsetTop + cy) + "px" });
        const stem = $("svg.stem path"), sx = tb._x + side * 66, sy = vy + 24, ex = side > 0 ? cx - 4 : cx + 304, ey = cy + 54;
        stem.setAttribute("d", `M${sx},${sy} C ${sx + side * 18},${sy - 4} ${ex - side * 26},${ey + 10} ${ex},${ey}`);
        const SL = stem.getTotalLength();

        const B0 = 1.75, BS = 0.18, F0 = B0 + 4 * BS + 1.15, END = F0 + 2.5;
        const tl = gsap.timeline({ paused: true });

        /* ground: sunrise over the burn, the sun slowly creeps up */
        FG.sunrise(tl, ROOT, 0, { dur: 1.4, flareRest: 0.32 });
        FG.sway(tl, ROOT, 0, END);

        /* the pane fogs in, title, guides draw */
        tl.fromTo($(".depth"), { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.out" }, 0.5);
        FG.condense(tl, pane, 0.45, { dur: 1.0, x: "0%", y: "100%" });
        TXT.reveal(tl, $(".eyebrow"), 0.8);
        TXT.reveal(tl, $(".ttl"), 0.86);
        guides.forEach((l, k) => tl.fromTo(l, { attr: { x2: 72 } }, { attr: { x2: 1288 }, duration: 0.8, ease: FG.GLIDE }, 1.1 + k * 0.08));
        TXT.block(tl, $$(".lab"), 1.3, { stagger: 0.05 });

        /* bars grow from the baseline, values count up above them */
        bars.forEach((b, i) => {
          const at = B0 + i * BS, v = vals[i], d = D[i], c = { v: 0 };
          tl.fromTo(b, { scaleY: 0 }, { scaleY: 1, duration: 0.85, ease: FG.POP }, at);
          tl.fromTo(v, { autoAlpha: 0, y: b._h }, { autoAlpha: 1, y: 0, duration: 0.85, ease: FG.POP }, at);
          tl.fromTo(c, { v: 0 }, { v: d.p.v, duration: 0.85, ease: FG.POP, onUpdate: () => { v.textContent = fmt(d.p, Math.round(c.v * Math.pow(10, d.p.dec)) / Math.pow(10, d.p.dec)); } }, at);
        });

        /* the best bar fills orange, its value gold; the rest go quiet */
        tl.to(tb.querySelector(".or"), { opacity: 1, duration: 0.42, ease: FG.POP }, F0)
          .to(vals[TOP], { color: GOLD, duration: 0.4, ease: FG.POP }, F0);
        bars.forEach((b, i) => {
          if (i === TOP) return;
          tl.to(b, { backgroundColor: "rgba(255,240,230,0.32)", duration: 0.35, ease: "power2.inOut" }, F0)
            .to(vals[i], { color: DIM, duration: 0.35, ease: "power2.inOut" }, F0);
        });
        FG.beat(tl, [tb, vals[TOP]], F0 + 0.3, { amp: 0.5 });
        tl.fromTo(stem, { strokeDasharray: SL, strokeDashoffset: SL }, { strokeDashoffset: 0, duration: 0.55, ease: FG.GLIDE }, F0 + 0.35);
        FG.condense(tl, call, F0 + 0.6, { dur: 0.7, x: "0%", y: "100%" });
        TXT.reveal(tl, $(".call .ct"), F0 + 0.75);
        tl.fromTo($(".pane .fg-sheen"), { backgroundPosition: "120% 0" }, { backgroundPosition: "-20% 0", duration: 1.4, ease: FG.GLIDE }, F0 + 1.0);
        tl.set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
