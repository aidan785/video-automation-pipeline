<!doctype html>
<!--
  HP V3 · tier1 · motion · ORBIT TILES  (Field Glass, wash ground)
  "Stop guessing, the answer is X." A warm wash comes up from the bottom-left
  (SUNRISE over the wash). A glass pill holds the state ("Guessing", with a ?
  well). Six small glass tiles fog in around it and drift slowly on a wide
  ellipse (a faint dotted orbit drawn in cream), nearer tiles a touch larger,
  like things circling your head. The guess is turned down: its well fills
  orange with an x (the frame's one accent) and the pill clears away. One tile
  (the pick) is drawn into the center, grows and lights, its word lands in gold
  (the frame's one gold) and takes the lub-dub; the other five ease out into a
  loose ring and go quiet while the orbit line fades. One glint on the pick.
  Slots: eyebrow (<=30), center (<=12), pick (<=14), t1..t5 (<=12).
-->

   line "pours" in as one wave instead of popping word by word.

   assembly only copies a card's own <script>). Edit this file, then run

    const els = list(el); if (!els.length) return at;

            let z = Math.round((Math.sin(th) + 1) * 10);
            if (i === 0) { x += (CX - x) * S.k; y += (CY - y) * S.k; sc += (1.55 - sc) * S.k; z = S.k > 0.2 ? 40 : z; }
            gsap.set(el, { x: x - TW / 2, y: y - TH / 2, scale: sc, zIndex: z });
          });
        }
        apply();

        const TX = 3.2, TP = 3.75, END = TP + 3.0;
        const tl = gsap.timeline({ paused: true });

        /* ground */
        FG.sway(tl, ROOT, 0, END);
        FG.sunrise(tl, ROOT, 0, { dur: 1.4 });
        TXT.reveal(tl, $(".eyebrow"), 0.5);

        /* the orbit drifts and slows; later the pick is pulled in and the rest settle out */
        tl.fromTo(S, { a: 0 }, { a: 1.05, duration: END - 0.2, ease: "sine.out", onUpdate: apply, immediateRender: false }, 0);
        tl.fromTo(S, { k: 0 }, { k: 1, duration: 0.95, ease: FG.GLIDE, onUpdate: apply, immediateRender: false }, TP);
        tl.fromTo(S, { s: 0 }, { s: 1, duration: 1.1, ease: FG.SETTLE, onUpdate: apply, immediateRender: false }, TP + 0.1);

        /* the orbit line, the pill, the tiles */
        tl.fromTo($("svg.orbit"), { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.out" }, 0.4);
        FG.condense(tl, $(".pill"), 0.55, { dur: 0.8, x: "0%", y: "100%" });
        TXT.block(tl, $(".pill .q"), 0.75);
        TXT.reveal(tl, $(".pl"), 0.8);
        tiles.forEach((el, i) => {
          FG.condense(tl, el, 0.85 + i * 0.1, { dur: 0.75, x: "50%", y: "100%" });
          TXT.reveal(tl, el.querySelector(".tl"), 1.0 + i * 0.1);
        });

        /* the guess is turned down: orange well with an x, then the pill clears */
        tl.to($(".pill .q .or"), { opacity: 1, duration: 0.35, ease: FG.POP }, TX)
          .to($(".pill .q .qm"), { opacity: 0, duration: 0.2 }, TX)
          .to($(".pill .q .x"), { opacity: 1, duration: 0.3, ease: FG.POP }, TX + 0.05)
          .to($(".pl"), { color: DIM, duration: 0.35, ease: "power2.inOut" }, TX);
        FG.beat(tl, $(".pill .q"), TX + 0.15, { amp: 0.7 });
        TXT.exit(tl, $(".pl"), TP - 0.05);
        tl.to($(".pill .q"), { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, TP);
        FG.clear(tl, $(".pill"), TP, { dur: 0.5 });
        tl.to($("svg.orbit"), { opacity: 0.25, duration: 0.8, ease: "power2.inOut" }, TP + 0.2);

        /* the pick lights in gold; the others go quiet */
        const pick = tiles[0], TL = TP + 0.8;
        tl.to(pick.querySelector(".hl"), { opacity: 1, duration: 0.4, ease: FG.POP }, TL)
          .to(pick.querySelector(".tl"), { color: GOLD, duration: 0.4, ease: FG.POP }, TL);
        tiles.slice(1).forEach((el) => {
          tl.to(el.querySelector(".tl"), { color: DIM, duration: 0.35, ease: "power2.inOut" }, TL)
            .to(el, { opacity: 0.8, duration: 0.35 }, TL);
        });
        FG.beat(tl, pick.querySelector(".tl"), TL + 0.3, { amp: 0.6 });
        tl.fromTo(pick.querySelector(".fg-sheen"), { backgroundPosition: "120% 0" }, { backgroundPosition: "-20% 0", duration: 1.3, ease: FG.GLIDE }, TL + 0.9);
        tl.set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
