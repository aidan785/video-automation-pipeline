<!doctype html>
<!--
  HP V3 · tier1 · motion · DUSK CHATBOX  (flat deep, ported from sanji t1-ember-chatbox)
  The "ask the assistant" moment. Default (retrofit 2): Sanji's EMBER chatbox
  composition on flat deep HP ground with grain, no corner light. Ground
  switches: photo (sun-reeds at dusk), any flat, none (over footage). We open
  CLOSE on the top-left of a dark smoked-glass chat pane that has just fogged
  in, while the prompt types: each character arrives gold and settles to cream
  (warm to settled, no glow), a caret riding the end. When the prompt lands
  the camera pulls back to the whole pane, the last of the sun swells in the
  corner, the toolbar rises in (+, model chip, mic, voice, send), one sun glint
  crosses the glass. Ends on the send press: dip, pop back, lub-dub. The send
  key is the frame's one orange. No gold once the typing has settled.
  Slots: ground (deep), grain (on), light (off), prompt (text <=40), model (text <=12),
  photo (nature stem, used when ground = photo, default sun-reeds).
-->
<html>

    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />

        -webkit-backdrop-filter: blur(calc(var(--fb) * 1px)) saturate(1.2) brightness(0.7); backdrop-filter: blur(calc(var(--fb) * 1px)) saturate(1.2) brightness(0.7); }
      #hp3-t1-dusk-chatbox[data-ground="photo"] .box > .fg-tint { background: linear-gradient(158deg, rgba(var(--cream-rgb),0.09) 0%, rgba(var(--brick-rgb),0.18) 40%, rgba(var(--deep-rgb),0.62) 100%); }

/* @text-preset:start v2 */
/* HP V3 copy of the Sanji TEXT PRESET "uppit-reveal" (source of truth for 15-humanly-possible-v3).
   The house text animation for every DOM text element in the Sanji library.
   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word
     .reveal  { opacity:0; transform:translateY(18px); .7s same curve }  (blocks)
   Why it feels smooth: every word takes 0.7s on a long quint-out tail but
   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger
     TXT.block(tl, el, at, opts)    whole element: fade + 18px rise, 0.7s (chips, pills, labels, icons)
     TXT.blockExit(tl, el, at)      whole element: fade + 10px lift, 0.42s
     TXT.split(el)                  wraps words in .tp-m > .tp-w (keeps <em>/<strong>/<br>/<span>)
     TXT.EASE                       the cubic-bezier(.23,1,.32,1) curve as a GSAP ease function
   opts: { stagger, dur, blur, y (em), ease, from:"start"|"end"|"center", delayPerLine }
   Each call returns the time its last word lands, so cards can chain beats. */
const TXT = (function () {
  /* cubic-bezier solver (same math as CSS), so no CustomEase plugin is needed */
  function bezier(x1, y1, x2, y2) {

    if (!el) return [];
    if (el._tpWords) return el._tpWords;

       give such text one inline wrapper first so it flows like a normal line */
    const isBox = (node) => { const d = getComputedStyle(node).display; return /flex|grid/.test(d); };

    const ws = order(list(el).flatMap(split), o.from);

  function exit(tl, el, at = 0, o = {}) {
    const ws = order(list(el).flatMap(split), o.from);
    if (!ws.length) return at;
    const dur = o.dur ?? D.exitDur, stg = o.stagger ?? D.exitStagger, blur = o.blur ?? D.blur, y = o.y ?? D.exitY;
    ws.forEach((w, i) => {
      tl.to(w, { autoAlpha: 0, filter: `blur(${blur}px)`, y: -em(w) * y, duration: dur, ease: "power2.in" }, at + i * stg);
    });
    return at + (ws.length - 1) * stg + dur;
  }
  function block(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.dur, stg = o.stagger ?? D.stagger * 2;
    tl.fromTo(els, { autoAlpha: 0, y: o.y ?? D.blockY, filter: o.blur ? `blur(${o.blur}px)` : "blur(0px)" },
      { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: dur, ease: o.ease || EASE, stagger: stg, immediateRender: true }, at);
    return at + (els.length - 1) * stg + dur;
  }
  function blockExit(tl, el, at = 0, o = {}) {
    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;
    tl.to(els, { autoAlpha: 0, y: -(o.y ?? 10), duration: dur, ease: "power2.in", stagger: o.stagger ?? 0.02 }, at);
    return at + dur;
  }
  return { reveal, exit, block, blockExit, split, bezier, EASE, DEFAULTS: D };
})();

/* HP V3 · FIELD GLASS motion helpers (single source of truth).

   `node scripts/style-library/sync-hp3-libs.mjs`
   (restamps both the @text-preset and @field-glass blocks).

   Markup it expects (CSS lives in tokens.css, "FIELD GLASS utilities"):

      { scale: 1 + 0.045 * a, duration: 0.1, ease: "sine.inOut" }, { scale: 1, duration: 0.27, ease: "sine.inOut" }] }, at);
    return at + 0.62;

  /* ambient motion for whatever the ground is: wind on a photo, drifting wash blobs, a slow sun on the burn */
  function sway(tl, root, at, dur) {
    const c = comp(root) || root, g = c.dataset.ground || "photo";
    if (g === "photo") { const img = q(root, ".fg-photo"); if (img) tl.fromTo(img, { scale: 1.1, x: -18, rotation: -0.25 }, { scale: 1.03, x: 14, rotation: 0.2, duration: dur, ease: "sine.inOut" }, at); }

  }
  function dapple(tl, el, at, dur) {
    const d = el.matches(".fg-dapple") ? el : el.querySelector(".fg-dapple");
    if (d) tl.fromTo(d, { x: -60, y: 10 }, { x: 60, y: -14, duration: dur, ease: "sine.inOut" }, at);
  }
  return { ground, sunrise, condense, clear, beat, sway, dapple, POP, SETTLE, GLIDE, bz };
})();

        ruler.style.cssText = "position:absolute;visibility:hidden;white-space:pre;left:0;top:0";
        $(".prompt").appendChild(ruler);
        const panX = (text) => { ruler.textContent = text; const px = 140 + 60 + ruler.offsetWidth + 20; return Math.min(120, 1790 - 300 - (px - 300) * 2.05); };
        const CPS = 0.062, T0 = 0.75, TEND = T0 + chars.length * CPS, PULL = TEND + 0.4, SEND = PULL + 1.55, END = SEND + 2.0;
        const tl = gsap.timeline({ paused: true });

        /* ground: night, wind in the reeds; the camera starts close and pulls back with the pane */
        FG.sway(tl, ROOT, 0, END);
        tl.fromTo($(".fg-night"), { "--sr": 0 }, { "--sr": 34, duration: 1.4, ease: FG.GLIDE }, 0);
        tl.fromTo($(".fg-flare"), { opacity: 0, scale: 0.4 }, { opacity: 0.5, scale: 0.8, duration: 1.4, ease: "power2.out" }, 0);
        tl.set($(".cam"), { scale: 2.05, x: 120, y: 40 }, 0);
        tl.set($(".fg-ground"), { scale: 1.14 }, 0);
        tl.set($$(".t"), { autoAlpha: 0 }, 0);

        const box = $(".box");
        FG.condense(tl, box, 0.05, { dur: 0.85, x: "6%", y: "20%" });
        tl.fromTo($(".depth"), { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.1);
        FG.dapple(tl, box, 0, END);

        /* caret blinks while idle, then rides the typing */
        tl.to($(".caret"), { opacity: 0, duration: 0.01, repeat: 3, yoyo: true, repeatDelay: 0.13 }, 0.05);
        tl.to($(".cam"), { x: () => panX(str), duration: TEND - T0, ease: "sine.inOut" }, T0);
        chars.forEach((c, i) => {
          const t = T0 + i * CPS;
          tl.set(c, { display: "inline" }, t)
            .fromTo(c, { opacity: 0.3, color: GOLD, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.26, ease: FG.SETTLE }, t)
            .to(c, { color: CREAM, duration: 0.5, ease: "power1.inOut" }, t + 0.12);
        });

        /* pull back to the whole pane: a glide; the last of the sun swells in the corner */
        tl.to($(".cam"), { scale: 1, x: 0, y: 0, duration: 0.8, ease: FG.GLIDE }, PULL)
          .to($(".fg-ground"), { scale: 1, duration: 1.0, ease: FG.GLIDE }, PULL)
          .to($(".caret"), { opacity: 0, duration: 0.2 }, PULL + 0.1)
          .to($(".fg-night"), { "--sr": 64, duration: 1.4, ease: FG.GLIDE }, PULL + 0.1)
          .to($(".fg-flare"), { opacity: 1, scale: 1.05, duration: 1.1, ease: FG.SETTLE }, PULL + 0.2)
          .to($(".fg-flare"), { opacity: 0.55, scale: 1, duration: 1.6, ease: "sine.inOut" }, PULL + 1.3);
        TXT.block(tl, $(".plus"), PULL + 0.45);
        TXT.block(tl, $$(".tools .t"), PULL + 0.5, { stagger: 0.06 });
        tl.fromTo($(".fg-sheen"), { backgroundPosition: "120% 0" }, { backgroundPosition: "-20% 0", duration: 1.4, ease: FG.GLIDE }, PULL + 0.6);

        /* send press: dip, pop back (no overshoot), cream flash, lub-dub */
        const send = $(".send");
        tl.to(send, { scale: 0.88, duration: 0.09, ease: "power2.in" }, SEND)
          .to(send, { scale: 1, duration: 0.3, ease: FG.POP }, SEND + 0.09)
          .fromTo($(".send .flash"), { opacity: 0 }, { keyframes: [{ opacity: 0.5, duration: 0.1, ease: "power2.out" }, { opacity: 0, duration: 0.45, ease: "power2.out" }] }, SEND + 0.05);
        FG.beat(tl, send, SEND + 0.45, { amp: 1.2 });
        tl.set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
