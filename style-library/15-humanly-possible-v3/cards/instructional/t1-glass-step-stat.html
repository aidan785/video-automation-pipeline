  knob glides to the value. The numeral takes the lub-dub, the unit pours in,
  then up to three glass chips fog in under the pane, each taking focus in
  turn (the previous one goes quiet). Ground is still (the window is pinned to it).
  One of the group's two light-on hero cards: the sunrise is what lights the window.
  On flat / none grounds the numeral falls back to solid gold.
  Slots: num (<=2), title (<=14), line (<=38, wraps to 2 lines), value (numeric <=4,

   Lifted 1:1 from uppitai.com's RevealText component (11/3):
     .rt-word { opacity:0; filter:blur(6px); transform:translateY(.3em);
                transition: all .7s cubic-bezier(.23,1,.32,1) }   stagger 40ms / word

   words start only 40ms apart, so 10-17 words are in flight at once and the
   line "pours" in as one wave instead of popping word by word.
   Cards carry an inlined copy between the @text-preset markers (inline
   assembly only copies a card's own <script>). Edit this file, then run
   `node scripts/style-library/sync-text-preset.mjs` to restamp every card.

   API (all timeline-driven, deterministic):
     TXT.reveal(tl, el, at, opts)   words: blur 6px + 0.3em rise + fade, 0.7s, 40ms stagger
     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger

    const els = list(el); if (!els.length) return at;

    const els = list(el); if (!els.length) return at;
    const dur = o.dur ?? D.exitDur;

        const ROOT = document.getElementById(ID);
        const G = FG.ground(ROOT, { ground: "photo", grain: "on", light: "on" });
        const $ = (s) => ROOT.querySelector(s), $$ = (s) => [...ROOT.querySelectorAll(s)];
        const css = getComputedStyle(document.documentElement);
        const CREAM = css.getPropertyValue("--hp-cream").trim(), DIM = css.getPropertyValue("--hp-cream-dim").trim();

        const stem = ($(".slot-photo").textContent || "grass-sunset").trim();
        const src = "../../assets/nature/" + stem + ".jpg";
        $(".fg-photo").src = src;

        const panel = $(".panel"), win = $(".win"), unit = $(".unit"), track = $(".track");
        const raw = (win.textContent || "0").trim(), VAL = parseFloat(raw) || 0, DEC = (raw.split(".")[1] || "").length;
        const MAX = parseFloat(track.dataset.max) || 30, FRAC = Math.max(0, Math.min(1, VAL / MAX));
        $(".tk.t1").textContent = MAX + " " + unit.textContent.trim();
        const chips = $$(".chip").filter((c) => c.querySelector(".tx").textContent.trim());
        $$(".chip").forEach((c) => { if (!chips.includes(c)) c.remove(); });

        /* the window shows the same photo, pinned to the ground's geometry, warmed toward gold */
        win.style.backgroundImage = `linear-gradient(rgba(255,193,69,0.30), rgba(255,138,76,0.12)), url("${src}")`;
        win.style.backgroundSize = "100% 100%, 2112px 1188px";
        win.style.filter = "brightness(1.5) saturate(1.2)";
        /* no photo under the card (flat / none): the numeral falls back to solid gold */
        if (!G.photo) { win.style.backgroundImage = "none"; win.style.filter = "none"; win.style.color = "var(--hp-gold)"; }
        const place = () => {
          /* value + unit sit right-aligned in the pane, measured at the final value */
          const cur = win.textContent; win.textContent = raw;
          const W = panel.offsetWidth, uw = unit.offsetWidth, vw = win.offsetWidth;
          win.textContent = cur;
          const L = W - 64 - uw - 18 - vw;
          win.style.left = L + "px"; unit.style.left = (L + vw + 18) + "px";
          win.style.backgroundPosition = `0 0, ${-96 - panel.offsetLeft - L}px ${-54 - panel.offsetTop - win.offsetTop}px`;
          const t1 = $(".tk.t1"); t1.style.left = (60 + track.offsetWidth - t1.offsetWidth) + "px"; $(".tk.t0").style.left = "60px";
          /* chips flow left to right under the pane */
          let x = 116; chips.forEach((c) => { const w = c.querySelector(".tx").offsetWidth + 68; c.style.left = x + "px"; c.style.width = w + "px"; x += w + 24; });
        };
        place(); if (document.fonts) document.fonts.ready.then(place);
        const sp = $(".stem path"), SL = sp.getTotalLength(); sp.style.strokeDasharray = SL; sp.style.strokeDashoffset = SL;

        const C0 = 3.55, CSTEP = 0.7, END = C0 + Math.max(0, chips.length - 1) * CSTEP + 2.0;
        const tl = gsap.timeline({ paused: true });

        /* ground stays still (the window is pinned to it); light does the moving */
        FG.sunrise(tl, ROOT, 0, { dur: 1.4, flareRest: 0.32 });
        tl.to($(".fg-flare"), { x: 150, y: -50, duration: END - 1.4, ease: "sine.inOut" }, 1.4);

        TXT.reveal(tl, $(".head .num"), 0.6);
        TXT.reveal(tl, $(".head .title"), 0.68);
        tl.to(sp, { strokeDashoffset: 0, duration: 0.5, ease: FG.GLIDE }, 0.95);
        TXT.block(tl, $(".stem circle"), 1.3, { y: 0, dur: 0.4 });

        tl.fromTo($(".depth"), { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.out" }, 1.05);
        FG.condense(tl, panel, 1.0, { dur: 1.0, x: "0%", y: "100%" });
        FG.dapple(tl, panel, 0, END);
        TXT.block(tl, $(".panel .ic"), 1.4);
        TXT.reveal(tl, $(".panel .line"), 1.45);
        TXT.block(tl, [track, $(".knob"), $(".tk.t0"), $(".tk.t1")], 1.6);

        /* the value: wipe clear at hand speed while it counts up and the knob glides */
        const W0 = 2.05, P = { v: 0 };
        const fmt = (v) => v.toFixed(DEC);
        win.textContent = fmt(0);
        tl.fromTo(win, { "--w": -30 }, { "--w": 110, duration: 0.95, ease: "power2.inOut" }, W0);
        tl.fromTo(P, { v: 0 }, { v: VAL, duration: 1.0, ease: "power2.out", onUpdate: () => { win.textContent = fmt(P.v); } }, W0);
        tl.fromTo($(".knob"), { x: 0 }, { x: () => FRAC * track.offsetWidth, duration: 1.0, ease: FG.POP }, W0);
        tl.fromTo($(".track .fill"), { scaleX: 0 }, { scaleX: FRAC, duration: 1.0, ease: FG.POP }, W0);
        TXT.reveal(tl, unit, W0 + 0.62);
        FG.beat(tl, win, W0 + 1.0, { amp: 0.6 });

        /* chips fog in under the pane, focus walks left to right */
        chips.forEach((c, i) => {
          const at = C0 + i * CSTEP;
          FG.condense(tl, c, at, { dur: 0.7, x: "0%", y: "100%" });
          TXT.reveal(tl, c.querySelector(".tx"), at + 0.12);
          tl.to(c.querySelector(".hl"), { opacity: 1, duration: 0.32, ease: FG.POP }, at + 0.3)
            .to(c.querySelector(".tx"), { color: CREAM, duration: 0.3, ease: FG.POP }, at + 0.3);
          if (i > 0) {
            const p = chips[i - 1];
            tl.to(p.querySelector(".hl"), { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at + 0.3)
              .to(p.querySelector(".tx"), { color: DIM, duration: 0.35, ease: "power2.inOut" }, at + 0.3);
          }
        });

        /* hold: one sun glint across the pane */
        tl.fromTo($(".panel .fg-sheen"), { backgroundPosition: "120% 0" }, { backgroundPosition: "-20% 0", duration: 1.3, ease: FG.GLIDE }, END - 1.6);
        tl.set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
