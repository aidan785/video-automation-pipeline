<!--
  HP V3 · tier1 · instructional · MATRIX 2x2  (Field Glass, NONE default; oxblood/deep = flat Sanji look with faint rings)
  A two-by-two framework in the Sanji matrix composition, default with no
  background (blank screen or footage). Two cream axes grow out from a center dot (soft round
  ends, no arrowheads) and their tracked labels pour in at the tips. Four
  glass quadrants fog in, each from the corner that touches the center, so
  the grid looks like it condenses off the axes. Each holds a tracked index
  and a sentence-case title. Then one chip drops into each quadrant in turn
  and that quadrant takes focus (row-lit wash) while the one before settles.
  Final beat: the chosen quadrant (hi) lights and lifts, its title goes gold
  (the frame's one gold) and its chip fills orange (the one accent), it takes
  the lub-dub; the other three go quiet.
  Quadrants: q1 top-left, q2 top-right, q3 bottom-left, q4 bottom-right; y points up, x right.
  Slots: eyebrow (<=24), yLabel / xLabel (<=14), q1..q4 (<=14), chip1..chip4 (<=18,
  chipN lands in qN), hi (1-4).
-->

   assembly only copies a card's own <script>). Edit this file, then run

     TXT.exit(tl, el, at, opts)     words leave: blur 6px + 0.18em lift + fade, 0.42s, 20ms stagger

    const els = list(el); if (!els.length) return at;

        const axes = [$(".up"), $(".dn"), $(".lf"), $(".rt")];
        axes.forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
        const place = () => { const xl = $(".xl"); xl.style.left = (1620 - xl.offsetWidth) + "px"; xl.style.top = "516px"; };
        place(); if (document.fonts) document.fonts.ready.then(place);
        /* each quadrant condenses from the corner that touches the center */
        const ORG = [["100%", "100%"], ["0%", "100%"], ["100%", "0%"], ["0%", "0%"]];

        const TC = 2.3, CSTEP = 0.62, TV = TC + 3 * CSTEP + 0.45, END = TV + 2.1;
        const tl = gsap.timeline({ paused: true });

        FG.sunrise(tl, ROOT, 0, { dur: 1.2, flareRest: 0.3 });
        FG.sway(tl, ROOT, 0, END);
        tl.fromTo($(".rings"), { scale: 0.96, opacity: 0 }, { scale: 1.03, opacity: 1, duration: END, ease: "sine.inOut" }, 0);
        TXT.reveal(tl, $(".eyebrow"), 0.5);

        /* axes grow out from the center */
        TXT.block(tl, $(".c0"), 0.45, { y: 0, dur: 0.4 });
        tl.to(axes, { strokeDashoffset: 0, duration: 0.85, ease: FG.GLIDE }, 0.55);
        TXT.block(tl, $$(".tip"), 1.25, { y: 0, dur: 0.4 });
        TXT.reveal(tl, $(".yl"), 1.2); TXT.reveal(tl, $(".xl"), 1.26);

        /* quadrants fog in off the axes */
        qs.forEach((q, i) => {
          const at = 0.95 + i * 0.1;
          FG.condense(tl, q, at, { dur: 0.9, x: ORG[i][0], y: ORG[i][1] });
          TXT.reveal(tl, q.querySelector(".ix"), at + 0.35);
          TXT.reveal(tl, q.querySelector(".tt"), at + 0.4);
        });

        /* one chip drops into each quadrant; focus follows */
        qs.forEach((q, i) => {
          const at = TC + i * CSTEP;
          TXT.block(tl, q.querySelector(".ch"), at, { y: -20, dur: 0.6 });
          tl.to(q.querySelector(".hl"), { opacity: 1, duration: 0.32, ease: FG.POP }, at + 0.08);
          if (i > 0) tl.to(qs[i - 1].querySelector(".hl"), { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at + 0.08);
        });

        /* the verdict: hi lights and lifts, the rest go quiet */
        const hq = qs[HI];
        tl.to(qs[3].querySelector(".hl"), { opacity: HI === 3 ? 1 : 0, duration: 0.35, ease: "power2.inOut" }, TV);
        tl.to(hq.querySelector(".hl"), { opacity: 1, duration: 0.32, ease: FG.POP }, TV)
          .to(hq, { y: -10, duration: 0.5, ease: FG.POP }, TV)
          .to(hq.querySelector(".tt"), { color: GOLD, duration: 0.4, ease: FG.POP }, TV)
          .to(hq.querySelector(".or"), { opacity: 1, duration: 0.35, ease: FG.POP }, TV + 0.05)
          .to(hq.querySelector(".ch .tx"), { color: DEEP, duration: 0.35, ease: FG.POP }, TV + 0.05);
        qs.forEach((q) => { if (q === hq) return;
          tl.to([q.querySelector(".tt"), q.querySelector(".ix")], { color: DIM, duration: 0.35, ease: "power2.inOut" }, TV)
            .to(q.querySelector(".ch"), { opacity: 0.55, duration: 0.35 }, TV); });
        FG.beat(tl, hq, TV + 0.35, { amp: 0.3 });
        tl.fromTo(hq.querySelector(".fg-sheen"), { backgroundPosition: "120% 0" }, { backgroundPosition: "-20% 0", duration: 1.3, ease: FG.GLIDE }, TV + 0.7);
        tl.set({}, {}, END);

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
